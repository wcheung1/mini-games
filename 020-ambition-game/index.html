<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07031a">
<title>上進心能量核心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#07031a; --panel:rgba(22,12,58,.78); --line:rgba(255,255,255,.16);
  --gold:#ffd166; --orange:#f4a261; --cyan:#4cc9f0; --pink:#f72585; --green:#06d6a0; --red:#ef476f; --purple:#7b2ff7;
  --txt:#fff; --sub:#cfc6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#fallbackOrb{display:none;position:fixed;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#fff6d0 0%,#ffd166 25%,#f4a26188 45%,#7b2ff733 65%,transparent 72%);animation:orbPulse 3s ease-in-out infinite;transition:transform 1s,opacity 1s}
body.noThree{background:radial-gradient(ellipse at center,#2a1460 0%,#07031a 70%)}
@keyframes orbPulse{50%{filter:brightness(1.3)}}
#dimmer{position:fixed;inset:0;background:rgba(6,2,22,.55);z-index:1;opacity:0;pointer-events:none;transition:opacity .6s}
body.dim #dimmer{opacity:1}
#app{position:fixed;inset:0;z-index:2}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:84px 16px 60px}
.screen.on{display:block;animation:fadeIn .5s}
#intro.screen{padding-top:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:26px;padding:22px;max-width:860px;margin:0 auto 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.3}
h2{font-size:clamp(22px,3vw,30px);color:var(--gold)}
/* ===== say blocks ===== */
.say{display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-size:clamp(18px,2.3vw,22px);line-height:1.7}
.say .tx{flex:1}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(145deg,#ffe08a,#f4a261);font-size:21px;box-shadow:0 3px 0 #b86a2a,0 0 14px rgba(255,209,102,.45);transition:transform .15s}
.spk:active{transform:scale(.92)}
.spk.sm{width:40px;height:40px;font-size:17px}
.spk.playing{animation:spkPulse .8s infinite;background:linear-gradient(145deg,#8ef5d8,#06d6a0);box-shadow:0 3px 0 #03805f,0 0 20px #06d6a0}
@keyframes spkPulse{50%{transform:scale(1.12)}}
/* ===== buttons ===== */
.btn{border:none;border-radius:18px;padding:14px 26px;font-size:clamp(18px,2.2vw,22px);font-weight:700;color:#1b0f3a;background:linear-gradient(145deg,#ffe08a,#f4a261);box-shadow:0 5px 0 #b86a2a;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a2a}
.btn.big{font-size:clamp(20px,2.8vw,26px);padding:18px 34px}
.btn.g{background:linear-gradient(145deg,#8ef5d8,#06d6a0);box-shadow:0 5px 0 #03805f}
.btn.r{background:linear-gradient(145deg,#ffb0c0,#ef476f);box-shadow:0 5px 0 #a3203f;color:#fff}
.btn.c{background:linear-gradient(145deg,#a6e9ff,#4cc9f0);box-shadow:0 5px 0 #1f7fa0}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.nav{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.optRow{display:flex;gap:10px;align-items:center;margin:10px 0}
.opt{flex:1;text-align:left;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);color:#fff;font-size:clamp(17px,2.1vw,20px);line-height:1.5;transition:all .2s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--green);background:rgba(6,214,160,.22)}
.opt.wrong{border-color:var(--red);background:rgba(239,71,111,.18)}
.opt.soft{border-color:var(--orange);background:rgba(244,162,97,.18)}
.fb{margin-top:10px}
.fb .say{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ===== HUD ===== */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(7,3,26,.95),rgba(7,3,26,.6));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex-wrap:wrap}
body.hudOn #hud{display:flex}
#hud .core{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#fff6d0,#ffd166 40%,#f4a261 60%,transparent 72%);box-shadow:0 0 18px #ffd166;animation:orbPulse 2s infinite}
#hud .lv{font-weight:900;font-size:17px;white-space:nowrap}
#hud .bar{width:clamp(80px,16vw,170px);height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
#hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .8s}
#hud .sp{flex:1}
.hb{border:none;border-radius:14px;padding:9px 12px;font-size:16px;font-weight:700;color:#fff;background:rgba(255,255,255,.12)}
.hb.sos{background:linear-gradient(145deg,#ff8fab,#ef476f);animation:sosGlow 2.5s infinite}
@keyframes sosGlow{50%{box-shadow:0 0 16px #ef476f}}
/* ===== intro ===== */
.introWrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:10px 0 20px}
.title{font-size:clamp(54px,11vw,120px);font-weight:900;letter-spacing:.08em;margin:0;background:linear-gradient(180deg,#fff6d0,#ffd166 45%,#f4a261);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,209,102,.6));animation:titleGlow 3s ease-in-out infinite}
@keyframes titleGlow{50%{filter:drop-shadow(0 0 40px rgba(255,209,102,.95))}}
.subtitle{font-size:clamp(18px,3vw,28px);letter-spacing:.4em;color:var(--sub);margin-top:-6px}
.introLines{max-width:760px;margin:0 auto}
.introLines .say{display:none;opacity:0;transform:translateY(12px);transition:all .8s;background:rgba(10,4,34,.62);border-radius:18px;padding:10px 14px;text-align:left}
.introLines .say.on{display:flex}.introLines .say.show{opacity:1;transform:none}
.voiceWarn{max-width:760px;margin:14px auto 0;font-size:14px;background:rgba(239,71,111,.2);border:1px solid var(--red);border-radius:14px;padding:10px 14px;text-align:left;display:none}
/* ===== map ===== */
.mapHead{max-width:860px;margin:0 auto}
.mapWrap{position:relative;max-width:860px;height:max(620px,calc(100dvh - 250px));margin:0 auto}
.mapWrap svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:none;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;width:130px}
.node .ic{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:radial-gradient(circle at 35% 30%,#fff8,var(--c) 45%,#0008 100%);box-shadow:0 0 22px var(--c);border:3px solid #fff6}
.node .nm{font-size:15px;font-weight:700;line-height:1.3;text-shadow:0 2px 6px #000;background:rgba(7,3,26,.6);padding:2px 8px;border-radius:10px}
.node.locked .ic{background:#2a2350;box-shadow:none;filter:grayscale(1);opacity:.7}
.node.locked .nm{opacity:.6}
.node.next .ic{animation:nodePulse 1.4s infinite}
@keyframes nodePulse{50%{transform:scale(1.12);box-shadow:0 0 40px var(--c)}}
.node .ok{position:absolute;top:0;right:22px;background:var(--green);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 10px var(--green)}
/* ===== level ===== */
.lvTop{max-width:860px;margin:0 auto 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lvTop h2{margin:0;flex:1}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dots i.now{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.talk{display:flex;gap:16px;align-items:flex-start}
.bubble{flex:1}
.mascot{flex:none;width:84px;height:84px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#fffbe6,#ffd166 45%,#f4a261 75%);box-shadow:0 0 30px #ffd166aa;animation:bob 2.4s ease-in-out infinite}
.mascot::after{content:"";position:absolute;top:-14px;left:36px;width:12px;height:18px;border-radius:50% 50% 0 0;background:#ffd166;transform:rotate(12deg)}
.mascot .eye{position:absolute;top:30px;width:10px;height:14px;border-radius:50%;background:#2a1460;animation:blink 4s infinite}
.mascot .eye.l{left:24px}.mascot .eye.r{right:24px}
.mascot .mouth{position:absolute;left:32px;top:52px;width:20px;height:9px;border-radius:0 0 12px 12px;background:#7a2a2a}
body.speaking .mascot .mouth{animation:talkM .25s infinite alternate}
@keyframes talkM{to{height:3px}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bigEmoji{font-size:64px;text-align:center;line-height:1.2}
/* story */
.storyRow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.sCard{border-radius:20px;border:2px solid var(--line);background:rgba(255,255,255,.07);padding:14px;min-height:190px;cursor:pointer}
.sCard .back{display:none}
.sCard.open .face .hint{display:none}
.sCard.open .back{display:block;animation:fadeIn .5s}
.sCard .hint{text-align:center;color:var(--gold);font-weight:700;animation:bob 1.6s infinite}
.sCard h3{text-align:center}
/* gems */
.gems{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.gem{border:2px dashed var(--line);border-radius:20px;padding:14px;text-align:center;background:rgba(255,255,255,.05);cursor:pointer;min-height:150px}
.gem .g{font-size:54px;display:block;filter:grayscale(1) brightness(.6);transition:all .5s}
.gem.open{border-style:solid;border-color:var(--gold);background:rgba(255,209,102,.12)}
.gem.open .g{filter:none;transform:scale(1.15);text-shadow:0 0 20px #fff}
.gem .gt{display:none;text-align:left}
.gem.open .gt{display:block}
/* sort */
.sortArea{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;align-items:center;margin-top:12px}
.jar{border-radius:18px 18px 30px 30px;border:3px solid;padding:10px 6px;text-align:center;font-weight:900;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.jar.j1{border-color:var(--gold);background:rgba(255,209,102,.1)}
.jar.j2{border-color:#8a86b8;background:rgba(138,134,184,.1)}
.jar .cnt{font-size:34px}
.scard{border-radius:18px;background:#fff;color:#1b0f3a;padding:14px;min-height:120px;box-shadow:0 6px 20px #0006;transition:all .5s}
.scard .say{font-size:clamp(17px,2.2vw,21px)}
.scard.flyL{transform:translateX(-120%) scale(.3);opacity:0}
.scard.flyR{transform:translateX(120%) scale(.3);opacity:0}
.sortBtns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* neuron */
.neuroBox{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(circle,#1d0f4a,#0a0520);border:1px solid var(--line);margin-top:12px}
.neuroBox canvas{display:block;width:100%;height:330px}
.meter{height:16px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));transition:width .4s}
/* yet */
.sentence{font-size:clamp(22px,3vw,30px);font-weight:900;text-align:center;padding:20px 10px;border-radius:18px;background:rgba(255,255,255,.06);margin:12px 0}
.slot{display:inline-block;min-width:110px;border-bottom:4px dashed var(--gold);margin:0 6px;color:var(--gold)}
.sentence.magic{background:linear-gradient(135deg,rgba(255,209,102,.25),rgba(76,201,240,.25));box-shadow:0 0 30px rgba(255,209,102,.5);animation:magicPop .6s}
@keyframes magicPop{40%{transform:scale(1.05)}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tileWrap{display:flex;gap:6px;align-items:center}
.tile{border:none;border-radius:14px;padding:12px 18px;font-size:20px;font-weight:700;background:linear-gradient(145deg,#c9b6ff,#7b2ff7);color:#fff;box-shadow:0 4px 0 #4a1a9a}
/* ladder */
.goalBox{text-align:center;font-size:clamp(19px,2.5vw,24px);font-weight:900;color:var(--gold);margin:6px 0}
.stairs{position:relative;height:300px;margin:12px 0;border-radius:18px;background:linear-gradient(#1a3a6e55,#0a052055);border:1px solid var(--line);overflow:hidden}
.stair{position:absolute;width:24%;height:48px;border-radius:10px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25);font-size:13px;padding:4px 6px;display:flex;align-items:center;line-height:1.25}
.stair.fill{background:linear-gradient(145deg,#8ef5d8,#06d6a0);color:#063;border-style:solid;border-color:#fff;font-weight:700;animation:magicPop .5s}
.hero{position:absolute;font-size:40px;transition:all .8s cubic-bezier(.3,1.6,.5,1);z-index:2}
.flag{position:absolute;right:8px;top:6px;font-size:40px}
/* battle */
.arena{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:10px 0;min-height:170px}
.monster{font-size:100px;transition:transform .5s,filter .5s;filter:drop-shadow(0 0 16px #b14dff)}
.monster.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(20px) rotate(10deg);filter:brightness(3)}60%{transform:translateX(-10px)}}
.me{font-size:80px}
.hp{display:flex;gap:4px;justify-content:center;font-size:24px}
.speech{position:relative;background:#fff;color:#2a1460;border-radius:18px;padding:10px 14px;margin:10px 0}
.speech .say{font-size:clamp(18px,2.3vw,22px);font-weight:700;margin:0}
.beam{position:fixed;height:10px;border-radius:10px;background:linear-gradient(90deg,#fff,var(--gold),var(--cyan));box-shadow:0 0 20px var(--gold);z-index:20;pointer-events:none;transform-origin:left center;animation:beam .5s forwards}
@keyframes beam{from{transform:scaleX(0)}70%{transform:scaleX(1);opacity:1}to{opacity:0}}
/* mine */
.rockZone{text-align:center;margin:10px 0}
.rock{font-size:110px;border:none;background:none;transition:transform .15s}
.rock:active{transform:scale(.9) rotate(-6deg)}
.rock.crack{animation:crack .5s}
@keyframes crack{30%{transform:rotate(-8deg) scale(1.05)}60%{transform:rotate(8deg)}}
.gemRow{display:flex;gap:10px;justify-content:center;font-size:40px;min-height:56px;margin:8px 0}
.gemRow span{animation:magicPop .6s;filter:drop-shadow(0 0 10px #fff)}
.mistake{background:rgba(239,71,111,.15);border:2px solid var(--red);border-radius:16px;padding:6px 12px}
/* practice */
.gameArea{position:relative;height:min(58vh,520px);border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at bottom,#2a1460,#07031a);border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.gHud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:22px;font-weight:900;z-index:3;pointer-events:none}
.fall{position:absolute;font-size:48px;line-height:1;width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-left:-32px}
.pop{position:absolute;font-weight:900;font-size:26px;pointer-events:none;animation:popUp .7s forwards;z-index:4}
@keyframes popUp{to{transform:translateY(-50px);opacity:0}}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:var(--gold);z-index:5;text-shadow:0 0 30px var(--gold)}
.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding:10px;border-radius:16px;background:rgba(255,255,255,.06);margin:12px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-weight:700}
.chart .b i{display:block;width:100%;max-width:70px;border-radius:10px 10px 4px 4px;background:linear-gradient(var(--gold),var(--orange));transition:height .8s}
.chart .b.last i{background:linear-gradient(var(--green),var(--cyan));box-shadow:0 0 14px var(--green)}
.tip{background:rgba(76,201,240,.15);border:2px solid var(--cyan);border-radius:16px;padding:6px 12px;margin-top:10px}
/* plan / chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chipWrap{display:flex;gap:6px;align-items:center}
.chip{border:2px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:700}
.chip.sel{border-color:var(--gold);background:rgba(255,209,102,.25)}
.promise{border-radius:22px;padding:20px;background:linear-gradient(135deg,#fff6d0,#ffd8a8);color:#3a1d00;box-shadow:0 0 40px rgba(255,209,102,.6);margin:14px 0;animation:magicPop .7s}
.promise h3{color:#b35900;text-align:center}
.promise .say{font-size:clamp(19px,2.5vw,24px);font-weight:700}
/* summary */
.badge{font-size:110px;text-align:center;animation:badgeIn 1.2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 30px var(--gold))}
@keyframes badgeIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.points .say{background:rgba(255,209,102,.1);border-left:5px solid var(--gold);border-radius:12px;padding:8px 12px}
/* sos */
.breath{width:200px;height:200px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,#a6e9ff,#4cc9f0 55%,#4cc9f000 72%);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#07031a;transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.1)}
.ring{display:block;margin:10px auto}
.timerTxt{font-size:56px;font-weight:900;text-align:center;color:var(--gold)}
.steps4{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.steps4 i{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-style:normal;font-size:14px}
.steps4 i.on{background:var(--pink)}
/* daily */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.day{border-radius:12px;padding:8px 2px;text-align:center;background:rgba(255,255,255,.06);font-size:13px}
.day b{display:block;font-size:24px}
.day.on{background:rgba(255,209,102,.25);box-shadow:0 0 12px rgba(255,209,102,.5)}
/* modal cert */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal.on{display:flex}
.cert{max-width:680px;width:100%;background:linear-gradient(135deg,#fffaf0,#ffefc2);color:#3a1d00;border-radius:24px;padding:28px;border:8px double #d99a2b;text-align:center;box-shadow:0 0 60px #ffd166}
.cert h1{color:#b35900;font-size:clamp(26px,4vw,38px)}
.cert input{font-size:26px;text-align:center;border:none;border-bottom:3px solid #d99a2b;background:transparent;color:#3a1d00;width:80%;font-family:inherit;font-weight:900}
.cert .say{justify-content:center;text-align:left}
/* floating + confetti */
.floatT{position:fixed;z-index:40;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 12px #000;pointer-events:none;animation:floatUp 1.4s forwards;transform:translateX(-50%)}
@keyframes floatUp{to{transform:translate(-50%,-90px);opacity:0}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:confFall linear forwards}
@keyframes confFall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.parents p,.parents li{font-size:17px;line-height:1.7}
.small{font-size:14px;color:var(--sub)}
@media (max-width:900px){#hud .lb{display:none}#hud .hb{padding:9px 11px;font-size:18px}#hud{flex-wrap:nowrap}}

</head>

  <button class="hb" id="hbDaily" type="button">📅<span class="lb"> 每日打卡</span></button>
  <button class="hb" id="hbAuto" type="button">🗣️<span class="lb" id="autoLb"> 自動讀：開</span></button>
  <button class="hb" id="hbParent" type="button">👨‍👩‍👧<span class="lb"> 家長</span></button>
</div>

<div id="app">
  <!-- ===== INTRO ===== -->
  <section class="screen on" id="intro">

      <button class="btn" type="button" id="certPrint">🖨️ 列印證書</button>
      <button class="btn g" type="button" id="certClose">返回地圖</button>

<script>
/* =========================================================
   上進心能量核心 —— 兒童上進心學習 App
   純前端、單一檔案。紀錄只存喺本機瀏覽器 (localStorage)。
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, '');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ===================== 儲存 ===================== */
const Store = {
  k: 'sjx_energy_core_v1', d: {},
  load() {
    try { this.d = JSON.parse(localStorage.getItem(this.k)) || {}; } catch (e) { this.d = {}; }
    this.d = Object.assign({ energy: 0, done: {}, checkins: {}, plan: null, practice: [], sos: 0, name: '' }, this.d);
  },
  save() { try { localStorage.setItem(this.k, JSON.stringify(this.d)); } catch (e) {} }
};
Store.load();

/* ===================== 廣東話語音 ===================== */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu;
const Voice = {
  v: null, auto: true, rate: 0.93, q: [], busy: false, token: 0, curBtn: null, u: null,
  ok: 'speechSynthesis' in window,
  pick() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices();
    this.v = vs.find(x => /zh[-_]HK/i.test(x.lang)) ||
             vs.find(x => /yue|cantonese|粵|廣東|sin-?ji|hiugaai|hiumaan|wanlung|tracy|danny/i.test(x.name + ' ' + x.lang)) || null;
  },
  clean(t) { return strip(t).replace(EMOJI_RE, '').replace(/[▶✔✅⚡★☆]/g, '').replace(/\s+/g, ' ').trim(); },
  split(t) {
    return (t.match(/[^。！？!?；\n]+[。！？!?；]*/g) || []).map(s => s.trim())
      .filter(s => s.replace(/[，。！？!?；、「」『』…—\-:：（）()\s]/g, '').length);
  },
  speak(text, btn) { this.stop(); this.enqueue(text, btn); },
  enqueue(text, btn) {
    if (!this.ok) return;
    const parts = this.split(this.clean(text));
    if (!parts.length) return;
    this.q.push({ parts, btn });
    if (!this.busy) this._next();
  },
  _next() {
    const tok = this.token;
    if (!this.q.length) { this.busy = false; this._btn(null); document.body.classList.remove('speaking'); return; }
    this.busy = true;
    const item = this.q[0];
    this._btn(item.btn);
    document.body.classList.add('speaking');
    const part = item.parts.shift();
    if (!item.parts.length) this.q.shift();
    const u = new SpeechSynthesisUtterance(part);
    u.lang = 'zh-HK'; if (this.v) u.voice = this.v;
    u.rate = this.rate; u.pitch = 1.08;
    u.onend = u.onerror = () => { if (tok === this.token) this._next(); };
    this.u = u;
    speechSynthesis.speak(u);
  },
  stop() {
    this.token++; this.q = []; this.busy = false;
    if (this.ok) { try { speechSynthesis.cancel(); } catch (e) {} }
    this._btn(null); document.body.classList.remove('speaking');
  },
  _btn(b) {
    if (this.curBtn && this.curBtn !== b) this.curBtn.classList.remove('playing');
    this.curBtn = b; if (b) b.classList.add('playing');
  }
};
if (Voice.ok) { Voice.pick(); speechSynthesis.onvoiceschanged = () => Voice.pick(); setTimeout(() => Voice.pick(), 800); }

// 可讀句子元件（帶小喇叭）
function S(text, cls = '') {
  return `<div class="say ${cls}"><button class="spk" type="button" aria-label="播放廣東話語音">🔊</button><div class="tx">${text}</div></div>`;
}
// 選項（左邊小喇叭，右邊選擇掣）
function O(text, attrs = '', cls = 'opt') {
  return `<div class="optRow"><button class="spk sm" type="button" data-say="${esc(strip(text))}" aria-label="讀出選項">🔊</button><button class="${cls}" type="button" ${attrs}>${text}</button></div>`;
}
function autoSay(root) {
  if (!Voice.auto) return;
  Voice.stop();
  root.querySelectorAll('.say.auto').forEach(s => Voice.enqueue(s.querySelector('.tx').textContent, s.querySelector('.spk')));
}
function sayNow(text, btn) { if (Voice.auto) Voice.speak(text, btn); }
function sayEl(el) { if (!el) return; const s = el.querySelector('.say'); if (s) sayNow(s.querySelector('.tx').textContent, s.querySelector('.spk')); }

document.addEventListener('click', e => {
  const b = e.target.closest('.spk');
  if (!b) return;
  e.stopPropagation();
  Sfx.init();
  if (b.classList.contains('playing')) { Voice.stop(); return; }
  const t = b.dataset.say || (b.parentElement.querySelector('.tx') || {}).textContent || '';
  Voice.speak(t, b);
}, true);

/* ===================== 音效 & 特效 ===================== */
const Sfx = {
  ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d = .15, type = 'sine', v = .12, when = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05);
  },
  good() { this.tone(660, .15); this.tone(880, .15, 'sine', .12, .1); this.tone(1320, .25, 'sine', .1, .2); },
  soft() { this.tone(330, .2, 'triangle', .1); this.tone(294, .25, 'triangle', .08, .15); },
  pop() { this.tone(900, .08, 'triangle', .1); },
  bad() { this.tone(180, .2, 'sawtooth', .06); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .3, 'sine', .12, i * .12)); },
  rise() { for (let i = 0; i < 12; i++) this.tone(200 + i * 70, .25, 'sine', .06, i * .08); }
};
function confetti(n = 70) {
  const cols = ['#ffd166', '#4cc9f0', '#f72585', '#06d6a0', '#7b2ff7', '#fff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}
function floatText(txt, x, y) {
  const f = document.createElement('div'); f.className = 'floatT'; f.textContent = txt;
  f.style.left = (x ?? innerWidth / 2) + 'px'; f.style.top = (y ?? innerHeight / 2) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1500);
}
function evXY(e) { if (e && e.clientX) return [e.clientX, e.clientY]; return [innerWidth / 2, innerHeight / 2]; }

/* ===================== 能量 ===================== */
const levelOf = e => Math.floor(e / 50) + 1;
const powerOf = () => Math.min(1, .12 + Store.d.energy / 450);
function updateHUD() {
  const e = Store.d.energy;
  $('#lvNum').textContent = levelOf(e);
  $('#barFill').style.width = ((e % 50) / 50 * 100) + '%';
}
function addEnergy(n, ev) {
  const before = levelOf(Store.d.energy);
  Store.d.energy += n; Store.save(); updateHUD();
  const [x, y] = evXY(ev); floatText('+' + n + ' ⚡', x, y);
  Core.setPower(powerOf()); Core.burst(.5);
  if (levelOf(Store.d.energy) > before) {
    setTimeout(() => { floatText('能量核心升級！Lv.' + levelOf(Store.d.energy), innerWidth / 2, innerHeight * .4); Sfx.win(); Core.burst(1.6); }, 500);
  }
}

/* ===================== Three.js 能量核心 ===================== */
const Core = { setPower() {}, burst() {} };
(function initCore() {
  const fallback = () => {
    document.body.classList.add('noThree'); $('#bg').style.display = 'none';
    const o = $('#fallbackOrb'); o.style.display = 'block';
    Core.setPower = p => { o.style.transform = `scale(${.7 + p * .7})`; o.style.opacity = .5 + p * .5; };
    Core.burst = () => { o.animate([{ filter: 'brightness(2.5)' }, { filter: 'brightness(1)' }], { duration: 900 }); };
    Core.setPower(powerOf());
  };
  if (!window.THREE) { fallback(); return; }
  try {
    const canvas = $('#bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x07031a);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07031a, 0.008);
    const camera = new THREE.PerspectiveCamera(55, 1, .1, 600);
    camera.position.set(0, 0, 7);

    const glowTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.2, 'rgba(255,255,255,.7)');
      gr.addColorStop(.5, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    })();

    // 星空
    const N = 2200, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 40 + Math.random() * 180, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th); pos[i * 3 + 2] = r * Math.cos(ph);
    }
    const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: .8, transparent: true, opacity: .9, depthWrite: false }));
    scene.add(stars);

    // 星雲
    [[0x7b2ff7, -30, 10, -80], [0xf72585, 35, -15, -90], [0x4cc9f0, 0, 25, -100]].forEach(([c, x, y, z]) => {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: c, transparent: true, opacity: .28, blending: THREE.AdditiveBlending, depthWrite: false }));
      s.position.set(x, y, z); s.scale.set(90, 90, 1); scene.add(s);
    });

    const group = new THREE.Group(); scene.add(group);
    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(.8, 3), new THREE.MeshBasicMaterial({ color: 0xffc94d }));
    const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), new THREE.MeshBasicMaterial({ color: 0x9fe6ff, wireframe: true, transparent: true, opacity: .5 }));
    const shell2 = new THREE.Mesh(new THREE.OctahedronGeometry(1.6, 0), new THREE.MeshBasicMaterial({ color: 0xf72585, wireframe: true, transparent: true, opacity: .25 }));
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffc94d, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.set(5, 5, 1);
    group.add(glow, inner, shell, shell2);
    const rings = [0x4cc9f0, 0xf72585, 0xffd166].map((c, k) => {
      const r = new THREE.Mesh(new THREE.TorusGeometry(1.9 + k * .5, .014, 8, 160), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .6 }));
      r.rotation.x = Math.random() * Math.PI; r.rotation.y = Math.random() * Math.PI; group.add(r); return r;
    });
    const SN = 700, sp = new Float32Array(SN * 3);
    for (let i = 0; i < SN; i++) {
      const r = 1.7 + Math.random() * 2.2, a = Math.random() * Math.PI * 2;
      sp[i * 3] = Math.cos(a) * r; sp[i * 3 + 1] = (Math.random() - .5) * .6; sp[i * 3 + 2] = Math.sin(a) * r;
    }
    const swg = new THREE.BufferGeometry(); swg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const swirl = new THREE.Points(swg, new THREE.PointsMaterial({ color: 0xffe29a, size: .06, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false }));
    swirl.rotation.x = .35; group.add(swirl);

    let power = .1, target = powerOf(), burst = 0, mx = 0, my = 0;
    const cA = new THREE.Color(0x3a5bff), cB = new THREE.Color(0xffc94d), tmp = new THREE.Color();
    function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 70 : 55; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();
    addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
    const t0 = performance.now();
    (function loop() {
      const t = (performance.now() - t0) / 1000;
      power += (target - power) * .03; burst *= .95;
      tmp.copy(cA).lerp(cB, power);
      inner.material.color.copy(tmp); glow.material.color.copy(tmp);
      const s = .7 + power * .55 + burst * .35 + Math.sin(t * 2.2) * .03;
      group.scale.setScalar(s);
      glow.material.opacity = .3 + power * .65;
      const gs = 3.2 + power * 3 + burst * 3 + Math.sin(t * 3) * .2; glow.scale.set(gs, gs, 1);
      inner.rotation.y += .005; inner.rotation.x += .002;
      shell.rotation.y -= .004 + burst * .03; shell.rotation.x += .002;
      shell2.rotation.z += .003; shell2.rotation.y += .002 + burst * .02;
      rings.forEach((r, i) => { r.rotation.z += .003 * (i + 1) + burst * .02; r.material.opacity = .25 + power * .55; });
      swirl.rotation.y += .004 + power * .012 + burst * .05;
      stars.rotation.y += .0003; stars.rotation.x += .0001;
      camera.position.x += (mx * 1.6 - camera.position.x) * .03;
      camera.position.y += (-my * 1.2 - camera.position.y) * .03;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
    Core.setPower = p => { target = p; };
    Core.burst = (b = 1) => { burst = Math.max(burst, b); };
  } catch (err) { fallback(); }
})();

/* ===================== 畫面切換 ===================== */
let mapSpoken = false;
function show(id) {
  Voice.stop();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.toggle('hudOn', id !== 'intro');
  document.body.classList.toggle('dim', !['intro', 'map'].includes(id));
  const sc = $('#' + id); if (sc) sc.scrollTop = 0;
  if (id === 'map') renderMap();
}
$('#hbMap').onclick = () => show('map');
$('#hbSos').onclick = () => startSOS();
$('#hbDaily').onclick = () => renderDaily();
$('#hbParent').onclick = () => renderParents();
$('#hbAuto').onclick = () => {
  Voice.auto = !Voice.auto; $('#autoLb').textContent = ' 自動讀：' + (Voice.auto ? '開' : '關'); $('#hbAuto').style.opacity = Voice.auto ? 1 : .55;
  if (!Voice.auto) Voice.stop();
};

/* ===================== 開場 ===================== */
const INTRO_LINES = [
  '喺每個人心入面，都收埋咗一粒神秘嘅能量核心。',
  '佢嘅名字叫做——「上進心」。',
  '當你同自己講：「我可以再好少少！」佢就會發光。',
  '佢愈發光，你就愈強大：學嘢更快、做嘢更好、遇到困難都唔怕。',
  '呢粒能量核心，可以改變你嘅將來。',
  '今日開始，你就係「上進心探險家」！'
];
$('#introLines').innerHTML = INTRO_LINES.map(l => S(l, 'auto')).join('');
$('#btnAwake').onclick = () => {
  Sfx.init(); Sfx.rise(); Core.burst(2.5);
  $('#btnAwake').style.display = 'none';
  const ls = [...document.querySelectorAll('#introLines .say')];
  $('#introGap').style.height = '6vh'; $('#voiceWarn').style.display = 'none';
  Core.setPower(Math.max(powerOf(), .75));
  ls.forEach((l, i) => { l.classList.add('on'); setTimeout(() => l.classList.add('show'), 400 + i * 900); });
  setTimeout(() => { $('#btnGo').style.display = ''; }, 400 + ls.length * 900);
  Voice.stop();
  ls.forEach(l => Voice.enqueue(l.querySelector('.tx').textContent, l.querySelector('.spk')));
};
$('#btnGo').onclick = () => { Sfx.good(); Core.burst(1); Core.setPower(powerOf()); show('map'); };
setTimeout(() => {
  if (!Voice.ok || !Voice.v) {
    const w = $('#voiceWarn'); w.style.display = 'block';
    w.innerHTML = '⚠️ 呢部機暫時搵唔到「廣東話（香港）」語音，小喇叭可能讀唔到廣東話。<br>' +
      '• iPad / iPhone：設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文 → 中文（香港），下載一把聲，再重新開呢頁。<br>' +
      '• 電腦：建議用 Microsoft Edge 或 Chrome 開啟；Windows 可以喺「設定 → 時間與語言 → 語音」加入「中文（香港）」。';
  }
}, 1800);

/* ===================== 關卡資料 ===================== */
const LEVELS = [

  const done = Store.d.done;
  let nextI = LEVELS.findIndex((lv, i) => !done[lv.id] && (i === 0 || done[LEVELS[i - 1].id]));
  const all = LEVELS.every(lv => done[lv.id]);
  const msg = all ? '嘩！你已經完成晒七個關卡！記住每日打卡，同埋想求其嗰陣用懶懶急救站，令能量核心繼續變強！'
    : Object.keys(done).length ? '歡迎返嚟，探險家！繼續下一個發光嘅星球啦。每過一關，你嘅能量核心都會更加光。'
    : '呢度係能量宇宙地圖！一共有七個關卡。每過一關，你嘅能量核心就會更加光。撳發光嘅星球開始啦！';
  $('#mapHead').innerHTML = `<div class="talk"><div class="mascot"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div><div class="bubble">${S(msg, 'auto')}</div></div>`;
  $('#mapPath').innerHTML = `<polyline points="${POS.map(p => p.join(',')).join(' ')}" fill="none" stroke="rgba(255,209,102,.55)" stroke-width="0.6" stroke-dasharray="1.5 1.5" vector-effect="non-scaling-stroke" style="stroke-width:4px"/>`;
  $('#mapNodes').innerHTML = LEVELS.map((lv, i) => {

STEP.neuron = (box, st, next) => {
  const GOAL = 12; let taps = 0;
  box.innerHTML = S(st.intro, 'auto') + `<div class="neuroBox"><canvas></canvas></div><div class="meter"><i></i></div><div class="nav"><button class="btn big c" type="button">💪 練習一次！</button></div><div class="fb"></div>`;
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d'), fb = box.querySelector('.fb');
  const W = () => cv.clientWidth, H = () => cv.clientHeight;
  function size() { const r = window.devicePixelRatio || 1; cv.width = W() * r; cv.height = H() * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  size();
  const nodes = []; for (let k = 0; k < 16; k++) nodes.push({ x: .08 + Math.random() * .84, y: .1 + Math.random() * .8, p: Math.random() * 6 });
  const edges = [];
  nodes.forEach((a, ai) => {
    const near = nodes.map((b, bi) => ({ bi, d: Math.hypot(a.x - b.x, a.y - b.y) })).filter(o => o.bi !== ai).sort((x, y) => x.d - y.d).slice(0, 2);
    near.forEach(o => { if (!edges.find(e => (e.a === ai && e.b === o.bi) || (e.a === o.bi && e.b === ai))) edges.push({ a: ai, b: o.bi, s: 0 }); });
  });
  const pulses = [];
  const msgs = { 3: '你睇！大腦入面開始出現一條條發光嘅小路喇！', 7: '練得愈多，條路就愈闊、愈光。呢個就係「練習」嘅魔法！', 12: '嘩！成個大腦都發晒光！你親眼見到：練習真係會令大腦變強！' };
  box.querySelector('.nav button').onclick = e => {
    if (taps >= GOAL) return;
    taps++; Sfx.tone(400 + taps * 50, .15, 'sine', .1);
    shuffle(edges).slice(0, 4).forEach(ed => { ed.s = Math.min(5, ed.s + 1); pulses.push({ ed, t: 0 }); });
    box.querySelector('.meter i').style.width = (taps / GOAL * 100) + '%';
    if (msgs[taps]) { fb.innerHTML = S(msgs[taps]); sayEl(fb); }
    if (taps === GOAL) { Sfx.win(); addEnergy(5, e); confetti(40); edges.forEach(ed => ed.s = Math.max(ed.s, 3)); box.querySelector('.nav button').disabled = true; nextBtn(box, next); }
  };
  (function draw(t) {
    if (!cv.isConnected) return;
    if (cv.width !== Math.round(W() * (window.devicePixelRatio || 1))) size();
    const w = W(), h = H(); ctx.clearRect(0, 0, w, h);
    edges.forEach(ed => {
      const a = nodes[ed.a], b = nodes[ed.b];
      ctx.strokeStyle = ed.s ? `rgba(255,${180 + ed.s * 10},${80 + ed.s * 30},${.15 + ed.s * .17})` : 'rgba(255,255,255,.07)';
      ctx.lineWidth = 1 + ed.s * 1.6; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = ed.s * 4;
      ctx.beginPath(); ctx.moveTo(a.x * w, a.y * h); ctx.lineTo(b.x * w, b.y * h); ctx.stroke();
    });
    ctx.shadowBlur = 0;
    for (let k = pulses.length - 1; k >= 0; k--) {
      const p = pulses[k]; p.t += .03; if (p.t > 1) { pulses.splice(k, 1); continue; }
      const a = nodes[p.ed.a], b = nodes[p.ed.b];
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#4cc9f0'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc((a.x + (b.x - a.x) * p.t) * w, (a.y + (b.y - a.y) * p.t) * h, 4, 0, 7); ctx.fill();
    }
    nodes.forEach((n, ni) => {
      const lit = edges.filter(ed => ed.a === ni || ed.b === ni).reduce((s, ed) => s + ed.s, 0);
      const r = 5 + Math.min(lit, 10) * .6 + Math.sin((t || 0) / 400 + n.p) * 1;
      ctx.shadowColor = lit ? '#f72585' : '#000'; ctx.shadowBlur = lit * 3;
      ctx.fillStyle = lit ? '#ffe0f0' : '#6a5a9a';
      ctx.beginPath(); ctx.arc(n.x * w, n.y * h, r, 0, 7); ctx.fill();
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  })();
  autoSay(box);
};

STEP.practice = (box, st, next) => {
  const scores = [];
  const TIPS = ['小貼士：先撳最低、就快跌落去嗰粒星。', '小貼士：唔使急，睇清楚係星星先撳，避開烏雲。', '小貼士：眼望住畫面中間，可以用兩隻手指一齊撳！', '小貼士：深呼吸，放鬆肩膊，專心就會更準。'];
  function intro() {
    const n = scores.length + 1;
    box.innerHTML = S(n === 1 ? '準備好未？撳「開始」，喺三十秒入面撳住星星⭐，避開烏雲☁️。' : `第${n}次練習！記住剛才嘅小貼士，試下用新方法。`, 'auto') +
      (scores.length ? `<div class="tip">${S(TIPS[(scores.length - 1) % TIPS.length])}</div>` : '') +
      `<div class="nav"><button class="btn big" type="button">▶ 開始第${n}次練習</button></div>`;
    box.querySelector('.nav .btn').onclick = () => { Sfx.pop(); play(); };
    autoSay(box);
    if (scores.length && Voice.auto) Voice.enqueue(TIPS[(scores.length - 1) % TIPS.length]);
  }
  function play() {
    Voice.stop();
    box.innerHTML = `<div class="gameArea"><div class="gHud"><span>⭐ <b class="sc">0</b></span><span>⏱️ <b class="tm">30</b></span></div><div class="countdown">3</div></div>`;
    const area = box.querySelector('.gameArea'), cd = box.querySelector('.countdown');
    let c = 3; Sfx.tone(600, .15);
    const ci = setInterval(() => {
      c--; if (c > 0) { cd.textContent = c; Sfx.tone(600, .15); }
      else { clearInterval(ci); cd.textContent = '開始！'; Sfx.tone(900, .25); setTimeout(() => { cd.remove(); run(area); }, 500); }
    }, 800);
  }
  function run(area) {
    let score = 0, last = performance.now(), start = last, spawnAcc = 0; const items = [];
    const scEl = area.querySelector('.sc'), tmEl = area.querySelector('.tm');
    function spawn(el) {
      const cloud = Math.random() < (.22 + Math.min(el, 30) * .004);
      const d = document.createElement('div'); d.className = 'fall'; d.textContent = cloud ? '☁️' : '⭐';
      const obj = { d, cloud, x: 8 + Math.random() * 84, y: -60, v: 120 + el * 6 + Math.random() * 60, dead: false };
      d.style.left = obj.x + '%'; d.style.top = '-60px';
      d.addEventListener('pointerdown', ev => {
        ev.preventDefault(); if (obj.dead) return; obj.dead = true; d.remove();
        const p = document.createElement('div'); p.className = 'pop';
        p.style.left = obj.x + '%'; p.style.top = obj.y + 'px';
        if (cloud) { score = Math.max(0, score - 1); p.textContent = '-1'; p.style.color = '#ef476f'; Sfx.bad(); area.classList.add('shake'); setTimeout(() => area.classList.remove('shake'), 400); }
        else { score++; p.textContent = '+1'; p.style.color = '#ffd166'; Sfx.pop(); }
        scEl.textContent = score; area.appendChild(p); setTimeout(() => p.remove(), 700);
      });
      area.appendChild(d); items.push(obj);
    }
    function frame(now) {
      if (!area.isConnected) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const el = (now - start) / 1000, left = Math.max(0, 30 - el);
      tmEl.textContent = Math.ceil(left);
      spawnAcc += dt * 1000;
      const interval = Math.max(380, 850 - el * 16);
      if (spawnAcc > interval && left > 0) { spawnAcc = 0; spawn(el); }
      const H = area.clientHeight;
      items.forEach(o => { if (o.dead) return; o.y += o.v * dt; o.d.style.top = o.y + 'px'; if (o.y > H) { o.dead = true; o.d.remove(); } });
      if (left <= 0) { items.forEach(o => o.d.remove()); done(score); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function done(score) {
    scores.push(score);
    Store.d.practice.push(score); Store.save();
    const first = scores[0], n = scores.length, prev = scores[n - 2];
    let msg;
    if (n === 1) msg = `第一次，你撳到 ${score} 粒星！呢個就係你嘅起點，記住呢個數字。`;
    else if (score > first) msg = `嘩！你比第一次多咗 ${score - first} 粒星！呢個就係練習嘅魔法！` + (score < prev ? '雖然比上一次少少，但整體都進步緊！' : '');
    else if (score === first) msg = '今次同第一次一樣，冇問題！試下用新嘅小貼士，進步可能就喺下一次。';
    else msg = '今次少咗少少，好正常！進步好似行山，有上有落。深呼吸，再試一次！';
    const max = Math.max(...scores, 1);
    box.innerHTML = `<h2>📈 我嘅進步線</h2><div class="chart">${scores.map((s, k) => `<div class="b ${k === n - 1 ? 'last' : ''}"><span>${s}</span><i style="height:${Math.max(4, s / max * 150)}px"></i><span class="small">第${k + 1}次</span></div>`).join('')}</div>` +
      S(msg, 'auto') + `<div class="nav"><button class="btn c" type="button" id="again">🔁 再練一次</button>${n >= 3 ? '<button class="btn g" type="button" id="fin">✔ 完成訓練</button>' : ''}</div>` +
      (n < 3 ? `<p class="small" style="text-align:center">再練 ${3 - n} 次就可以過關</p>` : '');
    Sfx.good(); addEnergy(3);
    box.querySelector('#again').onclick = () => { Sfx.pop(); intro(); };
    if (n >= 3) box.querySelector('#fin').onclick = () => { Sfx.pop(); next(); };
    autoSay(box);
  }
  intro();
};

function startSOS() {
  show('sos'); const box = $('#sosStage'); let step = 0; const ctx = { task: '', feel: '', way: '' };

  function s0() {
    step = 0;
    box.innerHTML = head() + `<div class="talk">${mascot()}<div class="bubble">` +
      S('你而家係咪覺得好悶、好攰，或者想求其做完佢？冇問題，每個人都會有咁嘅時候，連大人都會！', 'auto') +
      S('我哋一齊用四步，救返你嘅能量核心。第一步：停一停，深呼吸。跟住個圓圈，佢變大就吸氣，變細就呼氣。', 'auto') +
      `</div></div><div class="breath">準備</div><div class="nav"><button class="btn c" type="button" id="bStart">🌬️ 開始深呼吸</button></div>`;

    Voice.stop(); const b = box.querySelector('.breath'); box.querySelector('#bStart').remove();

    const cycle = () => {
      if (!b.isConnected) return;
      if (n >= 3) { b.textContent = '好叻！'; Sfx.good(); const nav = document.createElement('div'); nav.className = 'nav'; nav.innerHTML = '<button class="btn g" type="button">下一步 ▶</button>'; nav.querySelector('button').onclick = s1; box.appendChild(nav); sayNow('做得好！你已經冷靜落嚟喇。'); return; }
      n++; b.classList.add('in'); b.textContent = '吸氣…'; Voice.speak('吸氣，一，二，三，四');
      setTimeout(() => { if (!b.isConnected) return; b.classList.remove('in'); b.textContent = '呼氣…'; Voice.speak('呼氣，一，二，三，四'); setTimeout(cycle, 4200); }, 4200);
    };
    cycle();
  }
  function s1() {
    step = 1; const TASKS = ['📚 做功課', '📖 溫書', '🎹 練琴', '⚽ 運動練習', '🧹 執房', '✨ 其他事'];
    box.innerHTML = head() + S('第二步：想一想。你而家做緊咩？', 'auto') + chips(TASKS, 't');
    bindChips('t', v => { ctx.task = v.replace(/^\S+\s/, ''); s1b(); });
    autoSay(box);
  }
  function s1b() {
    const FEEL = ['😊 好自豪', '😌 好輕鬆，唔使擔心', '🧠 學識新嘢', '💖 屋企人同老師會開心', '🏆 下次會做得更好'];
    box.innerHTML = head() + S(`閉埋眼諗一諗：如果你認真將「${ctx.task}」做好，做完之後，你會有咩感覺？`, 'auto') + chips(FEEL, 'f');
    bindChips('f', v => { ctx.feel = v.replace(/^\S+\s/, ''); s2(); });
    autoSay(box);
  }
  function s2() {
    step = 2; const WAYS = ['🔍 做完檢查多一次', '✍️ 寫整齊少少', '➕ 多做一題或者多練一次', '❓ 唔明就問一個問題', '👣 只做第一小步先', '🎮 做完先玩'];
    box.innerHTML = head() + S(`記住呢種「${ctx.feel}」嘅感覺！第三步：揀一招「再好少少」嘅方法。唔使做到完美，只要比求其好少少就得！`, 'auto') + chips(WAYS, 'w');
    bindChips('w', v => { ctx.way = v.replace(/^\S+\s/, ''); s3(); });
    autoSay(box);
  }
  function s3() {
    step = 3;
    box.innerHTML = head() + S(`第四步：開始做！你嘅招式係：「${ctx.way}」。揀一個時間，我會陪住你。`, 'auto') +
      `<div class="nav">${[3, 5, 10].map(m => `<button class="btn c" type="button" data-m="${m}">⏱️ ${m} 分鐘</button>`).join('')}</div>`;
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => timer(+b.dataset.m));
    autoSay(box);
  }
  function timer(min) {
    Voice.stop();
    const total = min * 60 * 1000, end = Date.now() + total, R = 90, C = 2 * Math.PI * R;
    box.innerHTML = head() + S(`能量計時開始！專心做「${ctx.task}」，記住用「${ctx.way}」。你做得到！`, 'auto') +
      `<svg class="ring" width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="${R}" stroke="rgba(255,255,255,.15)" stroke-width="16" fill="none"/><circle id="rg" cx="110" cy="110" r="${R}" stroke="url(#gg)" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 110 110)"/><defs><linearGradient id="gg"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs></svg>
      <div class="timerTxt" id="tt"></div><div class="nav"><button class="btn g" type="button" id="doneEarly">✔ 我做完喇！</button></div>`;
    autoSay(box);
    const rg = box.querySelector('#rg'), tt = box.querySelector('#tt');
    let halfSaid = false;
    const iv = setInterval(() => {
      if (!tt.isConnected) { clearInterval(iv); return; }
      const left = Math.max(0, end - Date.now());
      rg.setAttribute('stroke-dashoffset', C * (left / total));
      tt.textContent = Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0');
      Core.setPower(Math.min(1, powerOf() + (1 - left / total) * .3));
      if (!halfSaid && left < total / 2) { halfSaid = true; sayNow('已經做咗一半喇，你嘅能量核心愈嚟愈光！'); }
      if (left <= 0) { clearInterval(iv); finish(true); }
    }, 250);
    box.querySelector('#doneEarly').onclick = () => { clearInterval(iv); finish(false); };
  }
  function finish(timeUp) {
    Store.d.sos++; Store.save(); Core.setPower(powerOf());
    box.innerHTML = `<div class="badge">🌟</div>` + S((timeUp ? '時間到！' : '') + `你打敗咗得過且過怪！你冇求其做，而係用咗「${ctx.way}」。呢個就係真正嘅上進心！`, 'auto') +
      S('如果仲未做完，可以再開多一次計時，或者休息五分鐘再嚟。', 'auto') +

    Sfx.win(); confetti(70); addEnergy(15);
    box.querySelector('#again2').onclick = s3; box.querySelector('#back2').onclick = () => show('map');
    autoSay(box);
  }
  function chips(list, id) { return `<div class="chips" data-g="${id}">${list.map(t => `<div class="chipWrap"><button class="spk sm" type="button" data-say="${esc(t)}">🔊</button><button class="chip" type="button" data-v="${esc(t)}">${t}</button></div>`).join('')}</div>`; }
  function bindChips(id, cb) { box.querySelectorAll(`[data-g="${id}"] .chip`).forEach(c => c.onclick = () => { Sfx.pop(); c.classList.add('sel'); setTimeout(() => cb(c.dataset.v), 300); }); }
  s0();
}

  <ul>
    <li><b>成長型思維（Growth Mindset，Carol Dweck）</b>：第2關用「大腦神經小路」同「未字魔法」，令小朋友明白能力係靠練習同方法提升。</li>
    <li><b>自我決定理論（自主、勝任、連繫）</b>：小朋友自己揀目標同承諾（自主）；每步都細到做得到（勝任）；能量小精靈「能能」全程陪伴（連繫）。</li>
    <li><b>近距離小目標與自我效能感（Bandura）</b>：第3關「目標階梯」同「能量第一步」，解決「唔想開始」嘅問題。</li>
    <li><b>正向自我對話與自我慈悲</b>：第4關分辨「藉口」、「能量說話」同「鬧自己」，避免小朋友用羞恥感推動自己。</li>
    <li><b>從錯誤中學習</b>：第5關將錯誤重新定義為「寶石原石」，並教「三條寶石問題」反思法。</li>
    <li><b>刻意練習與進步可視化</b>：第6關真實重複練習，並用「進步線」令小朋友親眼見到努力嘅成果，同時學識接受起伏。</li>
    <li><b>執行意圖（If-Then Plan，Gollwitzer）</b>：第7關「如果……我就……」承諾卡，幫小朋友喺真實情境自動用出策略。</li>
    <li><b>習慣養成</b>：「每日打卡」及「能量核心」視覺化累積，獎勵只針對努力同策略，唔針對天份。</li>
  </ul>
  <h3>🆘 小朋友做嘢「得過且過」時點用？</h3>
  <ol>
    <li>唔好即時責罵，先請佢撳「懶懶急救站」。</li>
    <li>App 會帶佢：深呼吸冷靜 → 想像做好之後嘅感覺 → 揀一招「再好少少」 → 3／5／10 分鐘專注計時。</li>
    <li>完成後，請具體讚賞過程，例如：「你肯檢查多一次，好有上進心！」而唔係「你好聰明」。</li>
  </ol>
  <h3>📆 建議用法</h3>
  <ul>
    <li>每次玩一關（約 10–15 分鐘），玩完同小朋友傾兩句：「今日學到咩招式？聽日喺邊度用？」</li>
    <li>將「能量承諾卡」抄低貼喺書枱；每晚一齊做「每日打卡」。</li>
    <li>全部完成後可重玩，第6關訓練場尤其適合重複練習。</li>
  </ul>
  <h3>🔊 廣東話語音設定</h3>
  <ul>
    <li>iPad／iPhone：設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文 → 中文（香港），下載語音後重新開啟本頁。</li>
    <li>電腦：建議使用 Microsoft Edge（內建自然嘅粵語語音）或 Chrome；Windows 可喺「設定 → 時間與語言 → 語音」加入「中文（香港）」。</li>
    <li>上方「🗣️ 自動讀」可開關自動朗讀；每段文字旁邊嘅 🔊 可隨時重播。</li>
  </ul>
  <h3>🔒 私隱</h3>
  <p>所有進度只儲存喺呢部機嘅瀏覽器入面，唔會上載到任何地方。</p>
  <div class="nav"><button class="btn ghost" type="button" id="resetAll">🗑️ 清除所有進度</button><button class="btn g" type="button" id="pBack">🗺️ 返回地圖</button></div>`;
  $('#pBack').onclick = () => show('map');
  $('#resetAll').onclick = () => {
    if (confirm('確定要清除所有進度同能量？')) { try { localStorage.removeItem(Store.k); } catch (e) {} Store.load(); updateHUD(); Core.setPower(powerOf()); show('map'); }
  };
}

/* ===================== 證書 ===================== */
function openCert() {
  $('#certName').value = Store.d.name || '';
  $('#certBody').innerHTML = S('已經完成七大能量關卡，喚醒咗心入面嘅「上進心能量核心」！由今日開始，每日都要比昨日嘅自己，好少少！');
  const d = new Date(); $('#certDate').textContent = `日期：${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日　｜　能量核心 Lv.${levelOf(Store.d.energy)}`;
  $('#certModal').classList.add('on'); Sfx.win(); confetti(120);
  sayNow('恭喜你！你已經完成七大能量關卡，成為真正嘅上進心探險家！寫低你嘅名，領取你嘅證書啦！');
}
$('#certName').oninput = e => { Store.d.name = e.target.value; Store.save(); };
$('#certPrint').onclick = () => window.print();
$('#certClose').onclick = () => { $('#certModal').classList.remove('on'); Voice.stop(); };

/* ===================== 啟動 ===================== */
updateHUD();
Core.setPower(powerOf());
document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stop(); });
</script>
