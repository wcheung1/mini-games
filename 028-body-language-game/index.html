<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<title>未開口之前</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231a1714' width='32' height='32'/%3E%3Cpath d='M16 4v24' stroke='%23e2b15a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1a1714;
    --paper: #f4ecdf;
    --paper-2: #fffaf3;
    --ink: #1c1916;
    --muted: #5e564c;
    --gold: #e2b15a;
    --gold-ink: #8a5a22;
    --coral: #9d3424;
    --good: #1d6a50;
    --serif: "Noto Serif HK", "Songti TC", serif;
    --sans: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--paper); }
  body {
    font-family: var(--sans); font-size: 17px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent; user-select: none;
    display: grid;
    grid-template-areas: "stage" "dock";
    grid-template-rows: minmax(180px, 1fr) minmax(220px, 48dvh);
    grid-template-columns: minmax(0, 1fr);
  }
  button, input { font-family: inherit; font-size: 17px; }
  button { cursor: pointer; touch-action: manipulation; }
  #stage { position: relative; min-width: 0; min-height: 0; grid-area: stage; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
  #top button, #coach .horn { pointer-events: auto; }
  #top {
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px 14px;
    background: linear-gradient(#1a1714 10%, rgba(26,23,20,0));
  }
  .brand { flex: 1; font-family: var(--serif); font-weight: 700; font-size: 20px; pointer-events: none; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(244,236,223,.28);
    background: rgba(26,23,20,.35); color: var(--paper); display: grid; place-items: center; padding: 0;
  }
  #dock {
    grid-area: dock;
    min-height: 0; min-width: 0;
    display: flex; flex-direction: column;
    background: #14110e;
    border-top: 1px solid rgba(226,177,90,.28);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    z-index: 2;
  }
  #coach {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 2px 2px 8px; min-height: 0; flex: 0 0 auto;
  }
  #coach p { margin: 2px 0 0; font-family: var(--serif); font-weight: 700; font-size: clamp(18px, 2.5vw, 26px); line-height: 1.35; color: var(--paper); }
  #panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .card {
    background: var(--paper); color: var(--ink);
    border-radius: 22px; padding: 14px 14px 12px;
    overflow: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    flex: 1 1 auto; min-height: 0;
  }
  .card p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .line { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 10px; }
  .line p { margin: 0; }
  .minirow { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .minirow .btn, .minirow .tile, .minirow .drum { flex: 1; margin-top: 0; width: auto; }
  .minirow .horn { flex: 0 0 40px; width: 40px; height: 40px; }
  .chipwrap { display: inline-flex; align-items: center; gap: 4px; }
  .chipwrap .horn { flex: 0 0 32px; width: 32px; height: 32px; }
  .open-say { justify-content: center; text-align: left; }
  .open-say .horn { background: transparent; color: var(--gold); border-color: rgba(226,177,90,.65); }
  .horn {
    flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid #ddcfbb; background: #fff; color: var(--ink);
    display: grid; place-items: center; padding: 0;
  }
  #coach .horn { border-color: rgba(244,236,223,.45); background: rgba(26,23,20,.45); color: var(--paper); pointer-events: auto; }
  .horn[aria-pressed="true"] { background: var(--ink); color: var(--gold); }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%;
    min-height: 52px; padding: 10px 14px; border: 0; border-radius: 14px;
    background: var(--coral); color: #fff8f3; font-weight: 700; margin-top: 8px;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid #d9cbb6; }
  .btn.ink { background: var(--ink); color: var(--paper); }
  .btn.good { background: var(--good); color: #f4fff9; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    text-align: left; border-radius: 16px; border: 1.5px solid #e0d3c0;
    background: var(--paper-2); color: var(--ink); padding: 10px 10px 8px; min-height: 74px;
  }
  .tile b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .tile span { display: block; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; }
  .tile.on { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--gold); }
  .stars { display: inline-flex; gap: 3px; margin-top: 4px; }
  .star {
    width: 12px; height: 12px; background: #e0d3c0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .star.on { background: #c8963e; }
  .meter { height: 10px; border-radius: 99px; background: #e6d9c6; overflow: hidden; margin: 8px 0; position: relative; }
  .meter i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .08s linear; }
  .meter.full i { background: #c8963e; }
  .meter::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: #8a5a22; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .bigstep { min-height: 78px; font-family: var(--serif); font-size: 26px; background: var(--ink); color: var(--paper); border-radius: 16px; border: 0; }
  .bigstep.soon {
    background: #1c1916; color: #fff6df; outline: none;
    border: 3px solid #e2b15a; box-shadow: 0 0 0 5px rgba(226,177,90,.45);
    animation: footsoon .7s ease-in-out infinite;
  }
  #footpad .bigstep.on {
    background: #2f6b4f; color: #f3fff6; border: 3px solid #d7f5e4;
    box-shadow: none; animation: none;
  }
  @keyframes footsoon {
    50% { box-shadow: 0 0 0 10px rgba(226,177,90,.12); }
  }
  #footpad { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  #footpad[hidden] { display: none !important; }
  #footpad .bigstep {
    position: absolute; width: 124px; min-height: 64px; margin: 0; padding: 8px 6px;
    top: 82%; transform: translate(-50%, -50%); pointer-events: auto;
    font-size: 18px; line-height: 1.15; box-shadow: 0 8px 18px rgba(0,0,0,.4);
  }
  #foot-L { left: max(72px, calc(50% - 168px)); }
  #foot-R { left: min(calc(100% - 72px), calc(50% + 168px)); }
  .drum {
    width: 112px; height: 112px; border-radius: 50%; margin: 6px auto; display: grid; place-items: center;
    background: var(--ink); color: var(--gold); border: 3px solid var(--gold); font-weight: 700; font-family: var(--serif); font-size: 22px;
  }
  .drum.on { background: var(--gold); color: var(--ink); }
  .choice {
    width: 100%; text-align: left; border-radius: 16px; border: 1.5px solid #e0d3c0;
    background: var(--paper-2); color: var(--ink); padding: 12px; min-height: 52px; margin-top: 8px; font-weight: 700;
  }
  .choice small { display: block; font-weight: 500; color: var(--muted); }
  .choicerow { display: flex; gap: 8px; align-items: stretch; }
  .choicerow .choice { flex: 1; margin-top: 8px; }
  .choicerow .btn { flex: 1; width: auto; margin-top: 8px; }
  .choicerow .horn { margin-top: 8px; flex: 0 0 48px; width: 48px; height: auto; min-height: 52px; border-radius: 14px; }
  .sec { font-family: var(--serif); font-size: 18px; margin: 2px 0 8px; }
  .sec small { display: block; font-family: var(--sans); font-weight: 500; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .flag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .flag.ok { background: #1d6a50; color: #f3fff8; }
  .flag.no { background: #efe4d4; color: #6a5c4e; }
  .chapter { margin: 16px 0 4px; padding-top: 12px; border-top: 1px solid #e6d9c6; }
  .ch-head { display: flex; gap: 8px; align-items: flex-start; }
  .ch-head b { display: block; font-family: var(--serif); font-size: 18px; }
  .ch-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: stretch; margin-top: 8px; }
  .stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stack > .corner { flex: 1; }
  .corner { position: relative; min-width: 0; display: flex; align-items: stretch; }
  .corner > .btn, .corner > .side { width: 100%; height: auto; flex: 1 1 auto; }
  .corner > .btn { padding-right: 40px; }
  .hub-stat { position: relative; z-index: 1; margin: 12px 0 10px; }
  .book-entry { margin: 4px 0 12px; }
  .book-entry > .corner > .side { min-height: 72px; }
  .corner-horn {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
  }
  .side {
    flex: 1; width: 100%; text-align: left; border-radius: 14px; border: 0;
    background: #ffe08a; color: #3a2508;
    padding: 10px 36px 10px 10px; min-height: 78px;
  }
  .side em { display: block; font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #8a4b12; }
  .side b { display: block; font-family: var(--serif); font-size: 16px; margin-top: 2px; }
  .side span { display: block; color: #6d4e22; font-size: 12px; margin-top: 2px; }
  .side.listen .flag.no { background: #fff6e0; color: #6a4a20; }
  .side.play { background: #e15a3a; color: #fff8f4; }
  .side.play em { color: #ffe08a; }
  .side.play span { color: #ffe8df; }
  .side.play .flag.no { background: rgba(255,248,244,.22); color: #fff8f4; }
  .side.play .flag.ok { background: #146b4a; color: #f3fff8; }
  .side.done { box-shadow: inset 4px 0 0 #146b4a; }
  #panel .btn.soft { background: #7eb8d4; color: #102430; border: 0; padding-right: 40px; }
  .doneflag { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #1d6a50; margin: 0 0 8px; }
  .remember { color: var(--gold-ink); font-weight: 700; margin: 0 0 8px; }
  .grouplabel { font-family: var(--serif); font-size: 18px; margin: 12px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips .corner { flex: 1 1 calc(50% - 6px); max-width: calc(50% - 3px); }
  .chips .chip { width: 100%; text-align: left; border-radius: 14px; min-height: 48px; padding: 8px 32px 8px 10px; }
  .chips .corner-horn { width: 24px; height: 24px; top: 4px; right: 4px; }
  .groupcorner { margin: 10px 0 6px; }
  .groupcorner .grouplabel { margin: 0; padding: 2px 32px 2px 0; }
  .countcorner { margin-bottom: 4px; }
  .countcorner .teach { margin: 0; padding-right: 32px; }
  #free-pose .two { margin-top: 8px; }
  #free-pose .corner > .drum { width: 100%; min-height: 52px; margin-top: 8px; }
  .chip { border-radius: 999px; border: 1.5px solid #e0d3c0; background: #fff; color: var(--ink); min-height: 40px; padding: 6px 10px; }
  .chip em { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--muted); }
  .chip em.ok { color: var(--good); }
  .chip.tried { border-color: #1d6a50; }
  .chip.on { background: var(--ink); color: var(--gold); border-color: var(--ink); }
  .chip.on em { color: var(--gold); }
  .verdict { font-family: var(--serif); font-size: 22px; font-weight: 700; border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; line-height: 1.35; }
  .verdict.ok { background: #1d6a50; color: #f4fff8; }
  .verdict.bad { background: #8d3424; color: #fff7f4; }
  .verdict.wait { background: #efe4d4; color: #3a3228; }
  .btn.on { background: var(--ink); color: var(--paper); box-shadow: inset 0 0 0 3px var(--gold); }
  #pop {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    font-family: var(--serif); font-size: 40px; font-weight: 700; pointer-events: none; opacity: 0;
    text-shadow: 0 2px 10px #1a1714; background: rgba(28,25,22,.88); padding: 10px 18px; border-radius: 18px;
  }
  #pop.go { animation: pop 1.6s ease; }
  #pop.ok { color: #b6f0c8; }
  #pop.bad { color: #ffb4a8; }
  #ringguide {
    display: none; position: absolute; left: 50%; top: 34%; width: 140px; height: 140px;
    transform: translate(-50%, -50%); border: 3px dashed rgba(226,177,90,.85); border-radius: 50%;
    pointer-events: none;
  }
  #keyhint {
    padding: 0 14px 4px;
    font-size: 13px; line-height: 1.35; color: rgba(244,236,223,.9);
    text-shadow: 0 1px 8px #1a1714; pointer-events: none;
  }
  #camtools {
    position: absolute; right: 10px; bottom: 12px; z-index: 4;
    display: flex; flex-direction: column; gap: 6px; pointer-events: auto;
  }
  #camtools button {
    width: 46px; height: 46px; border-radius: 14px; padding: 0;
    border: 1px solid rgba(226,177,90,.55); background: rgba(26,23,20,.78);
    color: var(--paper); font-weight: 700; font-size: 15px;
  }
  #camtools button.on { background: var(--gold); color: var(--ink); }
  .iconbtn.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .course-title { font-family: var(--serif); font-size: 22px; line-height: 1.3; margin: 0 0 8px; }
  .eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--gold-ink); }
  .path { font-size: 14px; color: var(--muted); }
  .chapter { margin-top: 14px; padding-top: 10px; border-top: 1px solid #e6d9c6; }
  .chapter-title { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -20%) scale(.85); }
    12% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1.04); }
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #pop.go { animation: none; opacity: 1; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; }
    #coach p { font-size: 18px; }
  }
  body[data-orient="land"] {
    grid-template-areas: "stage dock";
    grid-template-columns: minmax(0, 1fr) minmax(280px, min(420px, 36vw));
    grid-template-rows: minmax(0, 1fr);
  }
  body[data-orient="land"] #dock {
    border-top: 0;
    border-left: 1px solid rgba(226,177,90,.28);
    padding: 12px 12px 12px 14px;
  }
  body[data-orient="port"] #coach p { font-size: 18px; }
  #open[hidden] { display: none !important; }
  #open {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 50% 38%, rgba(226,177,90,.18), transparent 42%),
      #14110e;
    color: var(--paper);
  }
  .open-stage { width: min(460px, 100%); text-align: center; }
  .open-fig { width: min(420px, 96vw); height: auto; display: block; margin: 0 auto 4px; overflow: visible; }
  .open-kicker { margin: 0 0 8px; letter-spacing: .22em; font-size: 13px; font-weight: 700; color: var(--gold); }
  #open h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(32px, 5.6vw, 48px); line-height: 1.2; }
  .open-line { margin: 8px 0 0; font-family: var(--serif); font-size: clamp(20px, 3vw, 26px); line-height: 1.35; }
  .open-gold { margin: 12px 0 0; color: var(--gold); font-weight: 700; font-size: 18px; }
  .open-go { width: min(220px, 100%); margin: 20px auto 0; }
  .open-hint { margin: 10px 0 0; color: #a89884; font-size: 14px; }
  body.cover-on #dock, body.cover-on #ui { display: none; }
  #click-shield { position: fixed; inset: 0; z-index: 60; background: transparent; }
  #click-shield[hidden] { display: none !important; }
  #panel .btn.on, #panel .choice.on, #panel .tile.on, #panel .chip.on {
    background: #e2b15a;
    color: #1c1916;
    border: 3px solid #1c1916;
    box-shadow: none;
  }
  #panel .chip.on em { color: #1c1916; }
  #panel .chip.tried {
    background: #1c1916;
    color: #fff;
    border: 2px solid #1d6a50;
  }
  #panel .chip.tried em,
  #panel .chip.tried em.ok { color: #fff; }
  #panel .chip.tried.on {
    background: #1c1916;
    color: #fff;
    border: 3px solid #1d6a50;
    box-shadow: inset 0 0 0 2px #e2b15a;
  }
  #panel .chip.tried.on em { color: #fff; }
  #panel .btn:active, #panel .choice:active, #panel .tile:active, #panel .chip:active, #open .btn:active {
    background: #e2b15a;
    color: #1c1916;
  }
</style>
</head>
<body>
<div id="open">
  <div class="open-stage">
    <svg class="open-fig" viewBox="0 0 360 230" aria-hidden="true">
      <g>
        <rect x="22" y="2" width="84" height="24" rx="12" fill="#2a241e"/>
        <text x="64" y="18" text-anchor="middle" fill="#cfc3b4" font-size="13" font-family="Noto Sans HK, sans-serif">我知道</text>
        <circle cx="70" cy="52" r="13" fill="#f0c7a4"/>
        <path d="M58 50 Q70 36 84 50" fill="#4a3428"/>
        <path d="M68 64 C72 86 108 92 102 112" fill="none" stroke="#8d6e63" stroke-width="9" stroke-linecap="round"/>
        <path d="M102 112 L90 150 M102 112 L118 148" fill="none" stroke="#3e4450" stroke-width="5" stroke-linecap="round"/>
        <text x="90" y="172" text-anchor="middle" fill="#a89884" font-size="14" font-family="Noto Sans HK, sans-serif">個身縮埋</text>
      </g>
      <g>
        <circle cx="180" cy="118" r="20" fill="#ffd9b8"/>
        <ellipse cx="172" cy="116" rx="4" ry="4.5" fill="#fff"/>
        <ellipse cx="188" cy="116" rx="4" ry="4.5" fill="#fff"/>
        <circle cx="173.5" cy="116" r="1.7" fill="#1a1a1a"/>
        <circle cx="189.5" cy="116" r="1.7" fill="#1a1a1a"/>
        <path d="M174 126 Q180 130 186 126" fill="none" stroke="#b03a48" stroke-width="1.4" stroke-linecap="round"/>
        <text x="180" y="172" text-anchor="middle" fill="#e2b15a" font-size="14" font-family="Noto Sans HK, sans-serif">聽嘅人</text>
        <text x="180" y="190" text-anchor="middle" fill="#e2b15a" font-size="13" font-family="Noto Sans HK, sans-serif">望住企直嗰個</text>
      </g>
      <g>
        <rect x="250" y="2" width="84" height="24" rx="12" fill="#3a2e18"/>
        <text x="292" y="18" text-anchor="middle" fill="#f4ecdf" font-size="13" font-family="Noto Sans HK, sans-serif">我知道</text>
        <circle cx="292" cy="48" r="13" fill="#ffd9b8"/>
        <path d="M280 46 Q292 32 304 46" fill="#2b1d14"/>
        <path d="M292 62 V118" fill="none" stroke="#1f6f6a" stroke-width="9" stroke-linecap="round"/>
        <path d="M292 118 L276 156 M292 118 L308 156" fill="none" stroke="#35407a" stroke-width="5" stroke-linecap="round"/>
        <text x="292" y="176" text-anchor="middle" fill="#e2b15a" font-size="14" font-family="Noto Sans HK, sans-serif">個身企直</text>
      </g>
    </svg>
    <div class="line open-say">
      <button class="horn" type="button" data-say="身體語言好重要。你嘅表情同姿勢，係人第一眼見到你嘅印象。" aria-label="讀出嚟"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10v4h3.2L12 18.5V5.5L6.2 10H3z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9.2a3.6 3.6 0 010 5.6M18.2 7a6.2 6.2 0 010 10"/></svg></button>
      <div>
        <p class="open-kicker">未開口之前</p>
        <h1>身體語言好重要。</h1>

function hasCanto() {
  return speechSynthesis.getVoices().some((v) => /zh-HK|yue|cantonese|sin-?ji|hong ?kong|粵|粤/i.test((v.lang || "") + " " + (v.name || "")));

function pickDeviceVoice() {
  let best = null, score = 0;
  speechSynthesis.getVoices().forEach((v) => {
    const n = ((v.lang || "") + " " + (v.name || "")).toLowerCase();
    let s = 0;
    if (/zh-hk|yue|cantonese|sin-?ji|hong kong|粵|粤/.test(n)) s = 5;
    else if (/zh-tw|zh-hant/.test(n)) s = 2;
    else if (/zh/.test(n)) s = 1;

function chunk(text, max) {
  const parts = []; let buf = "";
  for (const ch of text) {
    buf += ch;
    if (buf.length >= max && /[。！？；，、\n]/.test(ch)) { parts.push(buf.trim()); buf = ""; }
    else if (buf.length >= max + 16) { parts.push(buf.trim()); buf = ""; }
  }
  if (buf.trim()) parts.push(buf.trim());

}

  document.querySelectorAll('.horn[aria-pressed="true"]').forEach((b) => b.removeAttribute("aria-pressed"));

}
function deviceSpeak(text, btn, gen) {
  const start = () => {
    if (gen !== speakGen) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK";
    const v = pickDeviceVoice();
    if (v) u.voice = v;
    u.rate = 0.94;
    markHorn(btn);
    u.onend = () => finishSpeak(gen);
    speechSynthesis.speak(u);
    clearInterval(resumeTimer);
    resumeTimer = setInterval(() => {
      if (gen !== speakGen || !speechSynthesis.speaking) { clearInterval(resumeTimer); return; }
      try { speechSynthesis.pause(); speechSynthesis.resume(); } catch (e) {}

}
function webSpeak(text, btn, gen) {
  const parts = chunk(text, 48);
  let i = 0;
  markHorn(btn);
  const next = () => {
    if (gen !== speakGen) return;
    if (i >= parts.length) { finishSpeak(gen); return; }
    const part = parts[i++];
    const url = "https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=yue&q=" + encodeURIComponent(part);
    audio.onended = next;
    audio.onerror = () => { if (gen === speakGen) deviceSpeak(parts.slice(i - 1).join(""), btn, gen); };
    audio.src = url;
    audio.play().catch(() => { if (gen === speakGen) deviceSpeak(text, btn, gen); });
  };

}

let actx, noiseBuf;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type, gainV, delay = 0) {
  if (state.muted) return;
  const a = ac();
  const t = a.currentTime + delay;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gainV, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function chime() { tone(523, 0.12, "sine", 0.07); tone(659, 0.14, "sine", 0.06, 0.08); tone(784, 0.18, "sine", 0.05, 0.15); }
function tick() { tone(880, 0.05, "triangle", 0.04); }
function scuffSnd() {
  if (state.muted) return;
  const a = ac();
  if (!noiseBuf || noiseBuf.duration < 0.5) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.62), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / d.length) * Math.PI);
  }
  const now = a.currentTime;
  const playNoise = (type, freq, peak, delay) => {
    const s = a.createBufferSource();
    s.buffer = noiseBuf;
    const f = a.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = a.createGain();
    const t0 = now + delay;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.58);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0);
  };
  playNoise("lowpass", 900, 1, 0);
  playNoise("bandpass", 1600, 0.9, 0.04);
  tone(90, 0.28, "sawtooth", 0.28);
  const synthOn = !!(window.speechSynthesis && speechSynthesis.speaking && !speechSynthesis.paused);
  const webOn = !!(audio && !audio.paused && !audio.ended && audio.currentTime > 0);
  if (synthOn) { try { speechSynthesis.pause(); } catch (e) {} }
  if (webOn) { try { audio.pause(); } catch (e) {} }
  setTimeout(() => {
    if (synthOn) { try { speechSynthesis.resume(); } catch (e) {} }
    if (webOn) audio.play().catch(() => {});
  }, 700);
}

function woodTex() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#5a3b2a";
  g.fillRect(0, 0, 1024, 1024);
  const rows = 7;
  for (let i = 0; i < rows; i++) {
    const y = Math.floor(i * (1024 / rows));
    const h = Math.floor(1024 / rows);
    const shade = 118 + (i % 3) * 16;
    g.fillStyle = "rgb(" + (shade + 36) + "," + (shade + 8) + "," + Math.floor(shade * 0.62) + ")";
    g.fillRect(0, y + 1, 1024, h - 4);
    g.strokeStyle = "rgba(255,214,170,.13)";
    g.lineWidth = 1.4;
    g.beginPath();
    for (let x = 0; x <= 1024; x += 5) {
      const yy = y + h * 0.38 + Math.sin(x * 0.018 + i) * 7 + Math.sin(x * 0.006 + i * 2) * 3;
      if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
    }
    g.stroke();
    g.fillStyle = "rgba(48,26,16,.4)";
    g.beginPath();
    g.ellipse(140 + i * 90, y + h * 0.55, 16, 9, 0.4, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "rgba(28,16,10,.55)";
    g.fillRect(0, y + h - 4, 1024, 4);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 6);

}

  const order = ["今", "日", "功", "課", "做", "完"];
  const ch = order[i];
  if (!ch) return;
  if (ch !== order[letterI]) { pop("未到", false); return; }
  const hit = letterSprites.find((s) => s.visible && s.userData.ch === ch);
  if (!hit) return;
  hit.visible = false;
  letterI++;
  pop("清", true); tick();
  if (letterI >= order.length) {

}
function keyAxes() {

}
function driveKeys(dt) {
  const ax = keyAxes();
  const driving = ax.x !== 0 || ax.y !== 0;
  let kind = null;
  if (mode === "spine" || (mode === "try" && tryPhase === 0)) kind = "spine";
  else if (mode === "eyes" || (mode === "try" && tryPhase === 1)) kind = "eyes";
  else if (mode === "stance") kind = "stance";
  else if (mode === "sit" && sitPhase === 0) kind = "sit";
  else if (mode === "free" || (mode === "persona" && personaPicked)) kind = "spine";

  }

    keyDrag = true;

    else if (kind === "stance") heroPose.stance = clamp(heroPose.stance + ax.x * dt * 0.85, 0.05, 1);

      if (heroPose.gazeMode !== "free" || heroPose.gaze.z > 1.2) heroPose.gaze.set(hero.position.x, 1.05, 0.55);
      heroPose.gazeMode = "free";
      heroPose.gaze.x = clamp(heroPose.gaze.x + ax.x * dt * 0.95, -1.4, 1.6);
      heroPose.gaze.y = clamp(heroPose.gaze.y + ax.y * dt * 0.85, 0.15, 2.05);
      heroPose.gaze.z = 0.55;
    } else if (kind === "hands") {
      cursor.visible = true;
      cursor.position.x = clamp(cursor.position.x + ax.x * dt * 1.35, -1.8, 2);
      cursor.position.y = clamp(cursor.position.y + ax.y * dt * 1.1, 0.25, 1.95);
      cursor.position.z = 0.72;
    } else if (kind === "sit") {
      cursor.visible = true;
      cursor.position.x = clamp(cursor.position.x + ax.x * dt * 1.05, -1.5, 1.7);
      cursor.position.z = clamp(cursor.position.z - ax.y * dt * 1.05, -0.5, 1.35);
      cursor.position.y = 0.2;
    }
    if (kind === "spine" && (mode === "free" || mode === "persona") && ax.x) {
      heroPose.stance = clamp(heroPose.stance + ax.x * dt * 0.5, 0.05, 1);
    }
  } else if (!pointerDown && keyDrag && !driving) {
    keyDrag = false;
    dragKind = null;
  }
  if (mode === "tired" && tiredStep === 1 && (heldKeys.has("c") || heldKeys.has("o")) && !result) {
    const spot = shoulderScreen(tiredSide);
    keyOrbit += dt * 4.6;
    circlePts.push({
      x: spot.x + Math.cos(keyOrbit) * 70,
      y: spot.y + Math.sin(keyOrbit) * 70

    if (keyOrbit > Math.PI * 2.15) {

    }

}

function syncKeys() {
  const el = document.getElementById("keyhint");
  if (!el) return;
  const t = hintFor();
  if (el.textContent !== t) el.textContent = t;
}
function tapChoice(n) {
  const choices = document.querySelectorAll("#panel .choice");
  if (choices.length && choices[n]) { choices[n].click(); return true; }
  const tiles = document.querySelectorAll("#panel .tile");
  if (tiles.length && tiles[n]) { tiles[n].click(); return true; }
  const chips = document.querySelectorAll("#panel .chip");
  if (!choices.length && !tiles.length && chips.length && chips[n]) { chips[n].click(); return true; }

addEventListener("keydown", (e) => {
  if (e.target && e.target.closest && e.target.closest("input, textarea")) return;

  heldKeys.add(e.key.toLowerCase());
  if (e.repeat && e.key !== "+" && e.key !== "=" && e.key !== "-" && e.key !== "_") return;
  if (e.key === "+" || e.key === "=") { zoomBy(0.86); return; }
  if (e.key === "-" || e.key === "_") { zoomBy(1.16); return; }
  try { ac(); } catch (err) {}
  if (e.code === "Space") {
    const canVoice = mode === "voice" || (mode === "try" && tryPhase === 2) || (mode === "tired" && tiredStep === 2) || mode === "free" || (mode === "persona" && personaPicked) || mode === "person";
    if (canVoice) {
      holding = "voice";
      const drum = document.querySelector(".drum");
      if (drum) drum.classList.add("on");

    return;

  if (mode === "sit" && sitPhase === 1 && !result) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { stampFoot("L"); return; }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { stampFoot("R"); return; }
  }
  if (mode === "sort" && !result) {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { resolveSort(true); return; }
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { resolveSort(false); return; }

    if (mode === "try" && tryPhase === 3) {
      document.querySelector('[data-go="hub"]')?.click();
      return;
    }
    if (mode === "day") {
      document.querySelector("[data-act='day-start']")?.click();
      return;
    }
    if (mode === "loop") {
      document.querySelector("#panel .btn:not(.ghost)")?.click();
      return;
    }
  }

addEventListener("keyup", (e) => {
