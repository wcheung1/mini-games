<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9b2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小小銷售達人 3D 訓練營</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   小小銷售達人 3D 訓練營 — 樣式
   顏色功能分工：
   藍 --c-nav  = 前進／主要動作   紫 --c-learn = 學
   青 --c-play = 練               橙 --c-voice = 語音
   綠 --c-ok   = 啱／完成          紅 --c-bad   = 錯
   黃 --c-hint = 提示你撳（閃動）
   ========================================================= */
:root{
  --font:"Noto Sans HK","PingFang HK","PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Microsoft YaHei UI","Heiti TC","Noto Sans CJK TC","Source Han Sans TC","Droid Sans Fallback",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --c-nav:#2f6fe4; --c-nav-d:#1f56bd;
  --c-learn:#7a4ff0; --c-play:#0fa39a;
  --c-voice:#ff8a1f; --c-ok:#1fa85a; --c-bad:#e0393e;
  --c-hint:#ffc61a;
  --ink:#24304a; --ink2:#5a6680;
  --bg1:#fff6e6; --bg2:#e8f3ff;
  --card:#ffffff; --line:#e3e8f2;
  --r:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-text-size-adjust:100%;}
button,input,select{font-family:var(--font);color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--c-nav)}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 頂欄 ---------- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) 6px calc(8px + var(--safe-l));
  background:#fff;box-shadow:0 2px 10px rgba(30,50,90,.08);z-index:20;min-height:50px}
#topTitle{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{flex:0 0 auto;height:38px;padding:0 10px;border-radius:12px;font-size:14px;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;background:#eef3fb;white-space:nowrap}
.tbtn:active{transform:scale(.96)}
#btnVoice{background:var(--c-voice);color:#fff;min-width:78px;justify-content:center;transition:opacity .2s,background .2s}
#btnVoice.paused{background:var(--c-ok);box-shadow:0 0 0 3px rgba(31,168,90,.25)}
#btnVoice.idle{opacity:.4}
#btnVoice.speaking .vbar{animation:vb .6s infinite alternate}
.vbar{display:inline-block;width:3px;height:10px;background:#fff;border-radius:2px;margin-left:1px}
@keyframes vb{from{transform:scaleY(.4)}to{transform:scaleY(1.2)}}

/* ---------- 主區：畫面 + 文字 ---------- */
#main{flex:1 1 auto;display:flex;min-height:0;min-width:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#cfe6ff}
/* 只係套用喺 3D 畫布；之前寫 #stage canvas 會連小地圖都拉到成個畫面咁大 */
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 14px calc(18px + var(--safe-b));background:rgba(255,255,255,.72)}
#pageView{display:none;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l))}

/* 打橫：左畫面、右文字 */
@media (orientation:landscape){
  #main{flex-direction:row}
  #stage{flex:1 1 auto}
  #panel{flex:0 0 clamp(300px,38%,470px);border-left:1px solid var(--line);padding-right:calc(14px + var(--safe-r))}
}
/* 打直：上畫面、下文字 */
@media (orientation:portrait){
  #main{flex-direction:column}
  #stage{flex:0 0 46%}
  #panel{flex:1 1 auto;border-top:1px solid var(--line)}
}

/* 模式切換 */
body.m-start #panel, body.m-start #pageView{display:none}
body.m-start #stage{flex:1 1 auto}
body.m-start #topbar{position:absolute;top:0;left:0;right:0;background:transparent;box-shadow:none}
body.m-start #btnMenu, body.m-start #topTitle{visibility:hidden}
body.m-page #main{display:none}
body.m-start #navCtl, body.m-start #navPad, body.m-start #minimap{display:none}
body.m-page #pageView{display:block}
body.m-split #pageView{display:none}

/* ---------- 開始畫面 ---------- */
#startOv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(64px + var(--safe-t)) 16px calc(26px + var(--safe-b));pointer-events:none;text-align:center}
body.m-start #startOv{display:flex}
.st-top{pointer-events:auto}
.st-kicker{display:inline-block;background:rgba(255,255,255,.9);color:var(--c-learn);font-weight:900;font-size:14px;
  padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.st-title{margin:10px 0 0;font-size:clamp(34px,9vw,64px);font-weight:900;line-height:1.05;color:#fff;
  text-shadow:0 3px 0 #e2622a,0 6px 0 #b9441a,0 10px 22px rgba(0,0,0,.25);letter-spacing:1px}
.st-sub{font-size:clamp(18px,4.6vw,26px);font-weight:900;color:#ffe066;text-shadow:0 2px 0 #b9441a,0 4px 12px rgba(0,0,0,.25);margin-top:6px}
.st-bottom{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:440px}
.st-tag{position:relative;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 46px 10px 16px;font-size:17px;font-weight:800;
  line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.st-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.st-badge{background:rgba(255,255,255,.9);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px}
.st-go{font-size:24px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff9b2f,#ff6a1a);padding:14px 42px;border-radius:999px;
  box-shadow:0 6px 0 #c9480f,0 12px 26px rgba(201,72,15,.35);animation:goPulse 1.6s infinite}
.st-go:active{transform:translateY(4px);box-shadow:0 2px 0 #c9480f}
@keyframes goPulse{50%{transform:scale(1.06)}}
.st-note{font-size:13.5px;color:#24304a;font-weight:800;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 12px}

/* ---------- 3D 畫面上嘅浮動控制 ---------- */
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;width:max-content;max-width:min(210px,58%);background:#fff;border:3px solid #ffb84d;border-radius:16px;padding:6px 34px 7px 10px;
  font-size:14px;font-weight:700;line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.15);transform:translate(-50%,-100%);
  transition:opacity .2s}
.bub.me{border-color:#6ea8ff}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#ffb84d;border-bottom:0}
.bub.me::after{border-top-color:#6ea8ff}
.bub b{display:block;font-size:11px;color:var(--ink2)}
.bub .spk{position:absolute;top:4px;right:4px;pointer-events:auto}

#navCtl{position:absolute;left:calc(8px + var(--safe-l));bottom:8px;display:flex;gap:6px;z-index:5}
.nbtn{height:40px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.93);font-weight:800;font-size:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);display:inline-flex;align-items:center;gap:4px}
.nbtn.on{background:var(--c-nav);color:#fff}
#navPad{position:absolute;left:calc(8px + var(--safe-l));bottom:54px;display:none;z-index:5;background:rgba(255,255,255,.93);
  border-radius:14px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);width:216px}
#navPad.show{display:block}
.pad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pbtn{height:36px;border-radius:10px;background:#eef3fb;font-size:12.5px;white-space:nowrap;font-weight:800;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;touch-action:none}
.pbtn:active,.pbtn.hold{background:var(--c-nav);color:#fff}
.pad-keys{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.4}
#minimap{position:absolute;left:8px;top:8px;width:88px;height:88px;border-radius:12px;background:rgba(255,255,255,.88);
  box-shadow:0 3px 10px rgba(0,0,0,.15);opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
#minimap.show{opacity:1}
/* 打開咗操控板（喺左下）時，小地圖改去右上，兩樣唔會疊埋（細手機尤其要緊） */
#stage.pad-open #minimap{left:auto;right:8px}
#floatMsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;pointer-events:none;
  opacity:0;z-index:6;text-shadow:0 3px 0 #fff,0 0 12px #fff}
#floatMsg.go{animation:floatUp 1.1s ease-out}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3}
#flash.ok{animation:fl .6s;box-shadow:inset 0 0 0 8px var(--c-ok)}
#flash.bad{animation:fl .6s;box-shadow:inset 0 0 0 8px var(--c-bad)}
@keyframes fl{0%,60%{opacity:1}100%{opacity:0}}

/* ---------- 喇叭 ---------- */
.spk{width:28px;height:28px;border-radius:50%;background:var(--c-voice);color:#fff;font-size:13px;display:inline-flex;
  align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 5px rgba(255,138,31,.4)}
.spk::before{content:"🔊";font-size:13px;line-height:1}
.spk.speaking{background:#1f8bff;box-shadow:0 0 0 4px rgba(31,139,255,.3);animation:spkp .8s infinite alternate}
@keyframes spkp{to{box-shadow:0 0 0 7px rgba(31,139,255,.15)}}
.has-spk{position:relative;padding-right:40px !important}
.has-spk > .spk.corner{position:absolute;top:8px;right:8px}

/* ---------- 文字面板元件 ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:#eef3fb}
.chip.learn{background:#efe8ff;color:var(--c-learn)}
.chip.play{background:#dcf6f3;color:#087b74}
.h1{font-size:22px;font-weight:900;margin:8px 0 6px;line-height:1.3}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin:10px 0;box-shadow:0 3px 12px rgba(30,50,90,.08);
  font-size:17px;line-height:1.6;font-weight:600}
.card.lead{background:#fff8e1;border:2px solid #ffe08a}
.card p{margin:0 0 6px}
.card p:last-child{margin-bottom:0}
.prompt{font-weight:900;font-size:18px}
.steps4{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.steps4 span{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:#eef3fb;color:var(--ink2)}
.steps4 span.on{background:var(--c-hint);color:#3d2c00}
.prog{display:flex;align-items:center;gap:8px;margin:6px 0}
.pbar{flex:1;height:14px;border-radius:999px;background:#e5eaf3;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ad07a,#1fa85a);border-radius:999px;transition:width .5s}
.score{font-weight:900;font-size:15px;white-space:nowrap}

.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{position:relative;display:flex;align-items:flex-start;gap:8px;background:#fff;border:3px solid #dbe4f3;border-radius:14px;
  padding:10px 44px 10px 10px;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer;text-align:left;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--c-nav);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.opt .spk{position:absolute;right:8px;top:9px}
.opt.bad{border-color:var(--c-bad);background:#ffecec}
.opt.bad .num{background:var(--c-bad)}
.opt.ok{border-color:var(--c-ok);background:#e6f8ee}
.opt.ok .num{background:var(--c-ok)}
.opt.dis{opacity:.5;pointer-events:none}
.opt.ok.dis{opacity:1}

.fb{border-radius:14px;padding:12px 44px 12px 14px;margin:10px 0;font-size:17px;font-weight:700;line-height:1.55;position:relative;animation:fbIn .3s}
.fb .big{display:block;font-size:22px;font-weight:900;margin-bottom:2px}
.fb.ok{background:#e3f7ec;border:3px solid var(--c-ok);color:#0f5a31}
.fb.bad{background:#ffe9e9;border:3px solid var(--c-bad);color:#7d1418}
.fb.info{background:#eef4ff;border:3px solid #9ab8f5}
.fb .hintline{display:block;margin-top:6px;font-size:15px;background:rgba(255,198,26,.25);border-radius:10px;padding:6px 8px;color:#5a4300}
@keyframes fbIn{from{transform:scale(.95);opacity:0}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;
  font-size:17px;font-weight:900;background:var(--c-nav);color:#fff;box-shadow:0 4px 0 var(--c-nav-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c-nav-d)}
.btn.wide{width:100%}
.btn.green{background:var(--c-ok);box-shadow:0 4px 0 #13763d}
.btn.play{background:var(--c-play);box-shadow:0 4px 0 #087b74}
.btn.learn{background:var(--c-learn);box-shadow:0 4px 0 #5631c4}
.btn.ghost{background:#eef3fb;color:var(--ink);box-shadow:0 3px 0 #cfd8e8}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.row > .btn{flex:1 1 0;min-width:0}
.tools{display:flex;gap:8px;margin:8px 0}
.tool{flex:1;min-height:40px;border-radius:12px;background:#eef3fb;font-weight:800;font-size:15px}
.tool.on{background:var(--c-hint);color:#3d2c00}
.fold{display:none;background:#fffdf3;border:2px dashed #ffd76b;border-radius:14px;padding:10px 44px 10px 12px;margin:6px 0;font-size:15.5px;line-height:1.65;font-weight:600;position:relative}
.fold.open{display:block}
.fold h4{margin:0 0 4px;font-size:16px}

.clues{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.clue{position:relative;display:flex;gap:8px;align-items:center;background:#f3f6fb;border-radius:12px;padding:8px 44px 8px 10px;font-size:15.5px;font-weight:700;line-height:1.45}
.clue.got{background:#e6f8ee}
.clue .spk{position:absolute;right:8px;top:50%;margin-top:-14px}
.ppl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pchip{position:relative;min-height:42px;padding:4px 10px;border-radius:12px;background:#fff;border:3px solid #dbe4f3;font-weight:800;font-size:15px}
.pchip.sel{border-color:var(--c-nav);background:#e6efff}
.pchip.done{border-color:var(--c-ok);background:#e6f8ee}
.pchip.hint{border-color:var(--c-hint);animation:hintb 1s infinite}
@keyframes hintb{50%{box-shadow:0 0 0 4px rgba(255,198,26,.45)}}
.items{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid #dbe4f3;border-radius:12px;padding:8px 44px 8px 10px;font-weight:800;font-size:15.5px;line-height:1.4;cursor:pointer}
.item.sel{border-color:var(--c-nav);background:#e6efff}
.item.done{border-color:var(--c-ok);background:#e6f8ee;cursor:default}
.item .spk{position:absolute;right:8px;top:50%;margin-top:-14px}
.tg{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;margin:5px 0;font-weight:800;font-size:15px;border:3px solid #dbe4f3}
.tg .st{margin-left:auto;font-size:13px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.tg.good{border-color:var(--c-ok)} .tg.good .st{background:#d6f5e3;color:#0f5a31}
.tg.badst{border-color:#f3b2b4} .tg.badst .st{background:#ffe0e0;color:#7d1418}

/* ---------- 目錄 ---------- */
.page{max-width:780px;margin:0 auto}
.cat-head{position:relative;background:linear-gradient(135deg,#ff9b2f,#ff5f7e);color:#fff;border-radius:20px;padding:16px 50px 16px 16px;box-shadow:0 8px 24px rgba(255,95,126,.3)}
.cat-head h2{margin:0;font-size:22px;font-weight:900}
.cat-head p{margin:6px 0 0;font-size:15.5px;font-weight:700;line-height:1.5}
.cat-head .spk{position:absolute;right:12px;top:12px;background:#fff;}
.cat-head .spk::before{filter:none}
.overall{margin:12px 0;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 3px 12px rgba(30,50,90,.08);font-weight:800;font-size:15px}
.chap{position:relative;background:#fff;border-radius:18px;padding:12px 12px 12px;margin:10px 0;box-shadow:0 3px 12px rgba(30,50,90,.08);border-left:8px solid var(--c-learn)}
.chap.locked{opacity:.6}
.chap h3{margin:0 40px 2px 0;font-size:18px;font-weight:900;line-height:1.35}
.chap .what{font-size:14.5px;color:var(--ink2);font-weight:700;margin:0 40px 8px 0;line-height:1.45}
.chap > .spk{position:absolute;right:10px;top:10px}
.lp{display:grid;gap:6px}
.lpb{min-height:52px;border-radius:12px;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px 2px}
.lpb small{font-size:11.5px;font-weight:800;opacity:.9}
.lpb.learn{background:#efe8ff;color:var(--c-learn)}
.lpb.play{background:#dcf6f3;color:#087b74}
.lpb.done{background:var(--c-ok);color:#fff}
.lpb.lock{background:#eceff4;color:#98a2b3}
.lpb.next{outline:3px solid var(--c-hint);animation:hintb 1s infinite}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}

/* ---------- 延伸閱讀 ---------- */
.rd{position:relative;background:#fff;border-radius:16px;margin:8px 0;box-shadow:0 3px 12px rgba(30,50,90,.08)}
.rd summary{position:relative;list-style:none;cursor:pointer;padding:12px 48px 12px 14px;font-weight:900;font-size:16.5px;line-height:1.4}
.rd summary::-webkit-details-marker{display:none}
.rd summary::before{content:"▸ ";color:var(--c-learn)}
.rd[open] summary::before{content:"▾ "}
.rd .spk{position:absolute;right:10px;top:10px}
.rd .body{padding:0 14px 12px;font-size:15.5px;line-height:1.7;font-weight:600}
.rd .lim{background:#fff6dd;border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14.5px}
.rd .src{font-size:13.5px;margin-top:6px;word-break:break-all}

/* ---------- 彈出視窗 ---------- */
#modal{position:fixed;inset:0;background:rgba(20,30,55,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.show{display:flex}
.dlg{position:relative;background:#fff;border-radius:22px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;padding:18px 16px 16px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dlgIn .3s}
@keyframes dlgIn{from{transform:scale(.9);opacity:0}}
.dlg h2{margin:0 40px 8px 0;font-size:21px;font-weight:900;line-height:1.3}
.dlg > .spk{position:absolute;right:14px;top:16px}
.win-top{text-align:center;font-size:56px;line-height:1;margin:2px 0 4px;animation:winB 1s infinite alternate}
@keyframes winB{to{transform:scale(1.12) rotate(-4deg)}}
.stars{text-align:center;font-size:34px;letter-spacing:4px;color:#cfd8e8}
.set-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:15.5px;flex-wrap:wrap}
.set-row label{flex:1;min-width:120px}
.sw{min-width:78px;height:38px;border-radius:999px;background:#e5eaf3;font-weight:900;font-size:14px}
.sw.on{background:var(--c-ok);color:#fff}
.seg{display:flex;gap:4px}
.seg button{height:36px;padding:0 10px;border-radius:10px;background:#eef3fb;font-weight:800;font-size:14px}
.seg button.on{background:var(--c-nav);color:#fff}
.set-note{font-size:13.5px;color:var(--ink2);font-weight:600;line-height:1.5;width:100%}
select.vsel{max-width:100%;height:38px;border-radius:10px;border:2px solid var(--line);font-size:14px;padding:0 6px}

/* ---------- 揀主角 ---------- */
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.swt{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cfd8e8}
.swt.on{box-shadow:0 0 0 4px var(--c-nav)}
.gbtn{flex:1;min-height:56px;border-radius:14px;background:#eef3fb;font-size:18px;font-weight:900;border:3px solid transparent}
.gbtn.on{background:#e6efff;border-color:var(--c-nav)}
.nameIn{width:100%;height:46px;border-radius:12px;border:3px solid #dbe4f3;font-size:18px;font-weight:800;padding:0 12px}

/* ---------- 系統提示 ---------- */
#toast{position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);max-width:min(92vw,460px);background:#24304a;color:#fff;
  border-radius:14px;padding:10px 14px;font-size:14.5px;font-weight:700;line-height:1.5;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{display:block;animation:fbIn .3s}

/* 細畫面微調（最細 360px） */
@media (max-width:400px){
  .bub{font-size:12.5px;max-width:min(170px,52%)}
  .tbtn{padding:0 8px;font-size:13px}
  #topTitle{font-size:14px}
  .h1{font-size:20px}
  .card,.opt,.fb{font-size:15.5px}
}
@media (orientation:landscape) and (max-height:500px){
  #topbar{min-height:44px;padding-top:calc(3px + var(--safe-t));padding-bottom:3px}
  .tbtn{height:34px}
  .h1{font-size:19px;margin:4px 0}
  .card{padding:9px 12px;margin:7px 0}
  .st-title{font-size:38px}
  #startOv{padding-top:calc(48px + var(--safe-t));padding-bottom:12px}
  .st-tag{font-size:15px;padding:6px 44px 6px 12px}
  .st-go{font-size:20px;padding:10px 34px}
}

.move-tag{font-size:13.5px;font-weight:900;color:var(--c-learn);margin-bottom:2px}
.h1.move{font-size:26px;margin:0 0 2px;letter-spacing:2px}
p.one{font-size:18px;font-weight:800;margin:0}
.fold.sum{background:#eefbf3;border-color:#8ce0ae}
.tools .tool{padding:0 4px;white-space:nowrap}
.transfer{margin-top:10px;background:#f5f0ff;border-radius:16px;padding:10px 10px 4px}
.cue-btn{display:block;width:100%;margin-top:8px;min-height:40px;border-radius:12px;background:#fff4d6;color:#7a5600;font-weight:900;font-size:14.5px;border:2px dashed #ffc61a}

<script>
'use strict';
/* =========================================================
   第 1 部分：小工具
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FONT = '"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",sans-serif';

/* 將 {name} 換成主角名 */
function T(s) { return String(s == null ? '' : s).replace(/\{name\}/g, (Store.d && Store.d.avatar && Store.d.avatar.name) || '小達'); }
function toast(msg, ms = 6000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* =========================================================
   第 2 部分：儲存（localStorage）
   ========================================================= */
const Store = {
  KEY: 'salesCamp3d_v1',
  d: null,
  def() { return { settings: { autoVoice: true, rate: 1, sfx: true, voiceURI: '', maleURI: '', charVoice: true, noticeSeen: false }, avatar: null, lessons: {}, levels: {} }; },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { d = null; }
    const def = this.def();
    this.d = Object.assign(def, d || {});
    this.d.settings = Object.assign(this.def().settings, (d && d.settings) || {});
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch (e) { /* 私隱模式寫唔到就算 */ } },
  get s() { return this.d.settings; }
};

/* =========================================================
   第 3 部分：廣東話語音（背景朗讀佇列）
   規則：
   - say()    ：取代（新一頁、撳喇叭）
   - insert() ：回饋，排喺「而家讀緊嗰句」之後
   - append() ：排喺最尾（例如下一步嘅題目）
   - 只有暫停、新一頁、撳另一個喇叭會打斷；3D 操作完全唔會掂語音
   ========================================================= */
const Voice = {
  q: [], i: 0, state: 'idle', unlocked: false, token: 0, timer: null, startTimer: null,
  ownerEl: null, voice: null, kind: 'none', voices: [],
  supported: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  init() {
    if (!this.supported) { this.kind = 'none'; return; }
    const pick = () => this.pick();
    try { speechSynthesis.addEventListener('voiceschanged', pick); } catch (e) { try { speechSynthesis.onvoiceschanged = pick; } catch (e2) {} }
    pick(); setTimeout(pick, 700); setTimeout(pick, 2200);
  },
  isYue(v) { const L = (v.lang || '').toLowerCase().replace('_', '-'); return /^(zh-hk|yue|zh-yue)/.test(L) || /cantonese|粵|廣東|hong ?kong/i.test(v.name || ''); },
  pick() {
    if (!this.supported) return;
    const vs = speechSynthesis.getVoices() || [];
    this.voices = vs;
    const want = Store.s.voiceURI;
    let v = want ? vs.find(x => x.voiceURI === want) : null;
    if (!v) v = vs.find(x => this.isYue(x));
    if (!v) v = vs.find(x => /^zh-tw/i.test(x.lang)) || vs.find(x => /^(zh|cmn)/i.test(x.lang));
    this.voice = v || null;
    /* 男聲：用戶揀咗就用；否則搵名入面明顯係男聲嘅粵語語音（例如 Windows 嘅 Danny、Edge 嘅 WanLung） */
    const mu = Store.s.maleURI;
    let mv = mu === 'none' ? null : mu ? vs.find(x => x.voiceURI === mu) : vs.find(x => this.isYue(x) && /danny|wan ?lung|\bmale\b|男/i.test(x.name));
    this.maleVoice = mv && mv !== this.voice ? mv : null;
    this.kind = !vs.length ? 'none' : (v ? (this.isYue(v) ? 'yue' : 'zh') : 'other');
    if (window.UI && UI.onVoices) UI.onVoices();
  },
  /* 讀之前清理：去 emoji、轉錢銀讀法 */
  clean(t) {
    return T(t)
      .replace(/\$\s?(\d[\d,]*)/g, '$1蚊')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}\u{2300}-\u{23FF}]/gu, '')
      .replace(/[「」『』《》【】]/g, '')
      .replace(/→/g, '，').replace(/／/g, '或者').replace(/…+/g, '，').replace(/—+/g, '，').replace(/·/g, '，')
      .replace(/\s+/g, ' ').trim();
  },
  /* 拆句（唔用 lookbehind，舊 iPad Safari 都行到） */
  chunks(t) {
    t = this.clean(t); if (!t) return [];
    const parts = (t.match(/[^。！？!?；;\n]+[。！？!?；;\n]*/g) || [t]).map(s => s.trim()).filter(s => s && /[^\s，。,.！？!?]/.test(s));
    const out = [];
    for (let p of parts) {
      while (p.length > 52) { let k = p.lastIndexOf('，', 48); if (k < 12) k = 48; out.push(p.slice(0, k + 1)); p = p.slice(k + 1); }
      if (p) out.push(p);
    }
    return out;
  },
  /* 每一項可以係文字，或者 { t, who（邊個角色講）, cb（開始讀嗰陣做嘅動作）, silent（唔讀、只做動作）, g } */
  mk(texts, g) {
    const arr = Array.isArray(texts) ? texts : [texts], o = [];
    arr.forEach(x => {
      const it = (x && typeof x === 'object') ? x : { t: x }, gg = it.g || g;
      const cs = it.silent ? [] : this.chunks(it.t || '');
      if (!cs.length) { if (it.cb || it.silent) o.push({ t: '', g: gg, cb: it.cb, silent: true, wait: it.wait }); return; }
      cs.forEach((c, k) => o.push({ t: c, g: gg, who: it.who, cb: k === 0 ? it.cb : null }));
    });
    return o;
  },
  /* 按角色性別、年齡調聲：男角用男聲（有嘅話），冇男聲就壓低音調；小朋友音調高啲，長者慢啲、低啲 */
  prof(who) {
    const base = { v: this.voice, pitch: 1.0, rate: Store.s.rate || 1 };   // 旁白
    if (!who || !Store.s.charVoice) return base;
    const sp = (W.objs[who] && W.objs[who].sp) || (who === 'me' ? avatarSpec() : (typeof PPL !== 'undefined' && PPL[who]));
    if (!sp) return base;
    const TB = { kid: { f: [1.5, 1.06], m: [1.3, 1.06] }, teen: { f: [1.25, 1.03], m: [0.95, 1.0, 1.1] },
      adult: { f: [1.12, 1.0], m: [0.72, 1.0, 1.0] }, elder: { f: [0.85, 0.88], m: [0.62, 0.88, 0.82] } };
    const row = (TB[sp.kind] || TB.kid)[sp.g === 'm' ? 'm' : 'f'];
    const male = row[2] != null && this.maleVoice;
    return { v: male ? this.maleVoice : this.voice, pitch: male ? row[2] : row[0], rate: base.rate * row[1] };
  },
  setOwner(elm) { if (this.ownerEl && this.ownerEl !== elm) this.ownerEl.classList.remove('speaking'); this.ownerEl = elm || null; },
  stopCur() {
    this.token++; clearTimeout(this.timer); clearTimeout(this.startTimer);
    if (this.supported) { try { speechSynthesis.cancel(); } catch (e) {} }
  },
  /* 取代：新頁／撳喇叭 */
  say(texts, owner, g = 'page') {
    const items = this.mk(texts, g);
    this.stopCur(); this.q = items; this.i = 0; this.setOwner(owner);
    if (!items.length) { this.state = 'idle'; this.ui(); return; }
    if (!this.unlocked) { this.state = 'pending'; this.ui(); return; }
    this.state = 'playing'; this.next();
  },
  /* 新一頁自動讀（跟「自動播放」設定） */
  auto(texts) {
    if (Store.s.autoVoice) this.say(texts, null);
    else { this.stopCur(); this.q = []; this.i = 0; this.state = 'idle'; this.setOwner(null); this.ui(); }
  },
  /* 回饋：等而家嗰句讀完先插入 */
  insert(texts, g = 'fb', force = false) {
    if (!Store.s.autoVoice && !force) return;
    const items = this.mk(texts, g); if (!items.length) return;
    if (this.state === 'playing') this.q.splice(this.i + 1, 0, ...items);
    else if (this.state === 'paused') this.q.splice(this.i, 0, ...items);
    else if (this.state === 'pending') this.q.push(...items);
    else { this.q = items; this.i = 0; this.setOwner(null); this.state = 'playing'; this.next(); }
    this.ui();
  },
  /* 排喺最尾 */
  append(texts, g = 'task') {
    if (!Store.s.autoVoice) return;
    const items = this.mk(texts, g); if (!items.length) return;
    if (this.state === 'idle') { this.q = items; this.i = 0; this.setOwner(null); this.state = this.unlocked ? 'playing' : 'pending'; if (this.unlocked) this.next(); }
    else this.q.push(...items);
    this.ui();
  },
  /* 移走未讀、屬於某一組嘅句子（例如上一題嘅選項） */
  purge(g) { const i = this.i; this.q = this.q.filter((it, k) => k <= i || it.g !== g); },
  next() {
    clearTimeout(this.timer); clearTimeout(this.startTimer);
    if (this.state !== 'playing') return;
    if (this.i >= this.q.length) { this.state = 'idle'; this.setOwner(null); this.ui(); return; }
    const it = this.q[this.i], text = it.t, id = ++this.token;
    if (it.cb) { const f = it.cb; it.cb = null; try { f(); } catch (e) { console.warn(e); } }
    if (it.who) { const b = Bubbles.list.find(x => x.ch.id === it.who); if (b) this.setOwner(b.el.querySelector('.spk')); }
    this.ui();
    if (it.silent) { this.timer = setTimeout(() => { if (id === this.token) { this.i++; this.next(); } }, it.wait || 1100); return; }
    if (!this.supported) { this.timer = setTimeout(() => { if (id === this.token) { this.i++; this.next(); } }, 300 + text.length * 110); return; }
    const pr = this.prof(it.who);
    const speakOnce = () => {
      const u = new SpeechSynthesisUtterance(text);
      if (pr.v) { u.voice = pr.v; u.lang = pr.v.lang; } else u.lang = 'zh-HK';
      u.rate = pr.rate; u.pitch = pr.pitch; u.volume = 1;
      let started = false;
      u.onstart = () => { started = true; };
      const done = () => { if (id !== this.token) return; this.token++; clearTimeout(this.timer); clearTimeout(this.startTimer); this.i++; this.next(); };
      u.onend = done; u.onerror = done;
      this._u = u; // 保留參考，避免 Chrome 回收咗冇 onend
      try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) { done(); return; }
      return () => started;

    this.startTimer = setTimeout(() => {
      if (id !== this.token || !isStarted || isStarted()) return;
      try { speechSynthesis.cancel(); } catch (e) {}
      if (id === this.token) speakOnce();
    }, 1500);
    /* 看門狗：讀咗太耐冇回應就跳去下一句 */
    const est = (3000 + text.length * 420 / pr.rate) * 2;
    this.timer = setTimeout(() => {
      if (id !== this.token) return;
      this.token++; try { speechSynthesis.cancel(); } catch (e) {}
      this.i++; setTimeout(() => this.next(), 60);
    }, est);
  },
  pause() { if (this.state === 'playing') { this.stopCur(); this.state = 'paused'; this.ui(); } },
  resume() { if (this.state === 'paused') { this.state = 'playing'; this.next(); } },
  toggle() {
    if (this.state === 'playing') this.pause();
    else if (this.state === 'paused') this.resume();
    else if (this.state === 'pending') this.unlock();
    this.ui();
  },
  /* iOS／瀏覽器：第一下撳畫面先可以出聲 */
  unlock() {
    if (this.unlocked) return;
    this.unlocked = true;
    Sfx.init();
    if (this.supported) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'zh-HK'; speechSynthesis.speak(u); } catch (e) {} }
    if (this.state === 'pending') { this.state = 'playing'; this.next(); }
    this.ui();
    if (window.UI && UI.onUnlock) UI.onUnlock();
  },
  ui() {
    const b = $('#btnVoice'); if (!b) return;
    const st = this.state;
    b.classList.toggle('paused', st === 'paused');
    b.classList.toggle('idle', st === 'idle');
    b.classList.toggle('speaking', st === 'playing');
    b.innerHTML = st === 'paused' ? '▶ 繼續' : st === 'playing' ? '⏸ 暫停<span class="vbar"></span>' : st === 'pending' ? '🔊 開聲' : '⏸ 暫停';
    if (this.ownerEl) this.ownerEl.classList.toggle('speaking', st === 'playing' || st === 'pending');
  }
};

/* 喇叭掣：撳即讀嗰度嘅內容（取代而家讀緊嘅） */
function spk(texts, extraCls) {
  const b = el('button', 'spk' + (extraCls ? ' ' + extraCls : ''));
  b.type = 'button'; b.setAttribute('aria-label', '讀出嚟');
  b.addEventListener('click', e => {
    e.stopPropagation(); e.preventDefault();
    Voice.unlock();
    const t = typeof texts === 'function' ? texts() : texts;
    Voice.say(Array.isArray(t) ? t : [t], b);
  });
  return b;
}
const ORD = ['第一個', '第二個', '第三個', '第四個', '第五個'];
function optSpeech(opts) { return opts.map((o, k) => ORD[k] + '：' + o); }

/* =========================================================
   第 4 部分：音效（WebAudio 即時生成，唔使 MP3）
   ========================================================= */
const Sfx = {
  ctx: null,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  tone(f, dur, type, vol, when = 0, f2) {
    if (!this.ctx || !Store.s.sfx) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  tap() { this.tone(560, 0.06, 'triangle', 0.12); },
  pop() { this.tone(420, 0.12, 'sine', 0.2, 0, 900); },
  ok() { this.tone(660, 0.12, 'sine', 0.28); this.tone(990, 0.2, 'sine', 0.28, 0.1); },
  bad() { this.tone(240, 0.22, 'square', 0.3); this.tone(170, 0.3, 'square', 0.3, 0.17); }, // 警告聲：大聲啲
  win() { [523, 659, 784, 1047].forEach((f, k) => this.tone(f, 0.25, 'triangle', 0.3, k * 0.12)); this.tone(1047, 0.5, 'sine', 0.22, 0.5); },
  whoosh() { this.tone(300, 0.25, 'sawtooth', 0.06, 0, 900); }
};

/* =========================================================
   第 5 部分：3D 基礎（共用幾何、材質、文字貼圖）
   ========================================================= */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const GEO = {};
function geo(key, make) { return GEO[key] || (GEO[key] = make()); }
const gSph = () => geo('sph', () => new THREE.SphereGeometry(1, 20, 14));
const gSphLo = () => geo('sphlo', () => new THREE.SphereGeometry(1, 10, 8));

/* 拖 3D 物件 */
const Drag = {
  h: null, plane: new THREE.Plane(), over: null,
  start(h, e) {
    this.h = h; this.plane.set(V3(0, 1, 0), -(h.home.y + 0.35)); this.over = null;
    h.g.position.y = h.home.y + 0.35; h.dragging = true; Sfx.tap();
    $('#cv').style.cursor = 'grabbing';
    if (h.onPick) h.onPick();
  },
  move(e) {
    if (!this.h) return; W.setXY(e.clientX, e.clientY);
    const p = new THREE.Vector3(); if (!W.ray.ray.intersectPlane(this.plane, p)) return;
    const b = Ctl.b; p.x = clamp(p.x, b.x0 + 0.3, b.x1 - 0.3); p.z = clamp(p.z, b.z0 + 0.3, b.z1 - 0.3);
    this.h.g.position.x = p.x; this.h.g.position.z = p.z;
    const tgt = this.nearest(p); if (tgt !== this.over) { if (this.over) this.over.setRing(null); this.over = tgt; if (tgt) tgt.setRing('#2f6fe4'); }
  },
  nearest(p) {
    let best = null, bd = 1.25;
    W.chars.forEach(c => { if (!c.dropTarget) return; const d = Math.hypot(c.root.position.x - p.x, c.root.position.z - p.z); if (d < bd) { bd = d; best = c; } });
    return best;
  },
  end() {
    const h = this.h; if (!h) return; this.h = null; h.dragging = false; $('#cv').style.cursor = 'default';
    const tgt = this.over; if (tgt) tgt.setRing(null); this.over = null;
    if (tgt && W.onDrop) W.onDrop(h, tgt); else Drag.back(h);
  },
  back(h) { const p0 = h.g.position.clone(); W.tween(0.35, k => { h.g.position.lerpVectors(p0, h.home, k); }); }
};

/* =========================================================
   第 8 部分：對白泡泡（HTML，跟住角色頭頂）
   ========================================================= */
const Bubbles = {
  list: [],
  clear() { this.list.forEach(b => b.el.remove()); this.list = []; },
  show(ch, text, opt = {}) {
    this.list.filter(b => b.ch === ch).forEach(b => b.el.remove());
    this.list = this.list.filter(b => b.ch !== ch);
    const e = el('div', 'bub' + (ch.isMe ? ' me' : ''));
    e.innerHTML = `<b>${esc(ch.name)}</b>${esc(T(text))}`;
    e.appendChild(spk(() => [T(text)]));
    $('#bubbles').appendChild(e);
    this.list.push({ ch, el: e, text }); ch.lastLine = text;
    while (this.list.length > 2) this.list.shift().el.remove();
    if (opt.read) Voice.append([ch.name + '話：' + T(text)], 'bub');
    return e;
  },
  hide(ch) { this.list.filter(b => b.ch === ch).forEach(b => b.el.remove()); this.list = this.list.filter(b => b.ch !== ch); },
  update() {
    if (!this.list.length) return;
    const st = $('#stage'), Wd = st.clientWidth, Hd = st.clientHeight, placed = [];
    this.list.forEach(b => {
      const p = b.ch.headTop().project(W.cam);
      if (p.z > 1 || p.x < -1.3 || p.x > 1.3 || p.y < -1.2 || p.y > 1.6) { b.el.style.opacity = 0; return; }
      b.el.style.opacity = 1;
      const bw = b.el.offsetWidth, bh = b.el.offsetHeight;
      let x = (p.x + 1) / 2 * Wd, y = (1 - p.y) / 2 * Hd - 6;
      x = clamp(x, bw / 2 + 4, Wd - bw / 2 - 4); y = clamp(y, bh + 4, Hd - 52);
      placed.forEach(q => { if (Math.abs(q.x - x) < (q.w + bw) / 2 && Math.abs(q.y - y) < (q.h + bh) / 2) y = Math.max(bh + 4, q.y - q.h - 6); });
      placed.push({ x, y, w: bw, h: bh });
      b.el.style.left = x + 'px'; b.el.style.top = y + 'px';
    });
  }
};

/* 將卡遞俾角色：有遞出、接住嘅動作 */
function handOver(h, ch, me, done) {
  if (me) me.play('give');
  ch.play('receive');
  const p0 = h.g.position.clone(), s0 = h.g.scale.x;
  W.tween(0.7, k => {
    const p1 = ch.handPos();
    h.g.position.lerpVectors(p0, p1, k); h.g.position.y += Math.sin(k * Math.PI) * 0.35 - 0.36 * 0.45 * k;
    h.g.scale.setScalar(s0 + (0.45 - s0) * k);

    h.gone = true; ch.holding = true;

    h.g.position.set(0, -ch.D.armL - 0.02, 0.1); h.g.rotation.set(0.9, 0, 0);

    ch.play('happy'); done && done();

}

const Prog = {
  lesson(ch) { return Store.d.lessons[ch.id] || { seen: 0, done: false }; },
  lvDone(id) { return !!(Store.d.levels[id] && Store.d.levels[id].done); },
  chDone(k) { return CH[k].levels.every(l => this.lvDone(l.id)); },
  chOpen(k) { return k === 0 || this.chDone(k - 1); },
  lvOpen(k, n) { const ch = CH[k]; if (!this.chOpen(k)) return false; if (n === 0) return this.lesson(ch).done; return this.lvDone(ch.levels[n - 1].id); },
  /* 下一樣未完成嘅嘢 */
  next() {
    for (let k = 0; k < CH.length; k++) {
      const ch = CH[k];
      if (!this.lesson(ch).done) return { type: 'lesson', k, label: ch.no + '：學' };
      for (let n = 0; n < ch.levels.length; n++) if (!this.lvDone(ch.levels[n].id)) return { type: 'level', k, n, label: ch.no + ' 練習' + '一二三'[n] };
    }
    return null;
  },
  counts() {
    let lv = 0, lvAll = 0, ls = 0; CH.forEach(ch => { ch.levels.forEach(l => { lvAll++; if (this.lvDone(l.id)) lv++; }); if (this.lesson(ch).done) ls++; });
    return { lv, lvAll, ls, lsAll: CH.length };
  }
};

    case 'booth': table(W.scene, a[0], a[1], 2.4, 0.8, 0.78, '#ffe066'); box(W.scene, 2.4, 0.5, 0.04, '#69db7c', a[0], 0.5, a[1] + 0.41); wallSign(p.text, a[0], 0.5, a[1] + 0.44, 0, 2.2, 0.42, { bg: '#69db7c', fg: '#fff', fs: 70 });
      for (let k = 0; k < 6; k++) box(W.scene, 0.1, 0.02, 0.3, ['#ff8787', '#74c0fc', '#ffd43b'][k % 3], a[0] - 0.8 + k * 0.32, 0.79, a[1]); break;

/* 一個角色講一句、做一個動作 */
function actOne(who, text, anim) { const c = W.objs[who]; if (!c || !c.say) return; if (text) c.say(text); if (anim) c.play(anim); }
const isAction = t => !t || /^（/.test(t);
/* 執行角色動作 [[誰, 講乜, 動作]]
   開咗自動語音：排入語音佇列，讀到嗰句先出泡泡同做動作（用角色自己把聲）
   冇自動語音：按時間逐句出 */
function runActs(acts, read, gap = 1500) {
  const tok = UI.tok;
  (acts || []).forEach(([who, text, anim], i) => {
    const go = () => { if (tok === UI.tok) actOne(who, text, anim); };
    if (read && Store.s.autoVoice) Voice.append([isAction(text) ? { silent: true, cb: go, wait: 1000 } : { t: T(text), who, cb: go }], 'bub');
    else if (i === 0) go(); else UI.later(go, gap * i);
  });
}
/* 角色講返佢嗰句對白（撳角色時用） */
function charSpeak(c) {
  const line = c.lastLine || c.sp.hi || ('你好，我係' + c.name + '。');
  c.play('nod'); c.say(line);
  if (!isAction(line)) Voice.insert([{ t: T(line), who: c.id }], 'fb');
}

/* 冇任務時撳 3D 物件：讀出、掀開 */
function tapGeneric(h) {
  if (!h) return;
  if (h.kind === 'char') { charSpeak(h.char); return; }
  if (h.kind === 'sign') { Voice.insert([h.speak], 'fb'); Sfx.tap(); return; }
  if (h.kind === 'reveal') { h.toggle(); if (h.open && h.speak) Voice.insert([h.speak], 'fb'); return; }
  if (h.kind === 'card') { Voice.insert([h.label], 'fb'); return; }
  if (h.kind === 'toggle') { h.toggle(); }
}

const Lv = {

    const pr = el('div', 'prog'); pr.innerHTML = '<div class="pbar"><i id="lvBar"></i></div><span class="score" id="lvScore">⭐ 0 分</span>'; P.appendChild(pr);
    const s4 = el('div', 'steps4', '<b style="font-size:12px;align-self:center">🧠 四步：</b>' + STEPS4.map(s => `<span data-s="${s}">${s}</span>`).join('')); P.appendChild(s4);
    this.box = el('div'); P.appendChild(this.box);

    tools.appendChild(bH); tools.appendChild(bD); P.appendChild(tools);
    this.hintFold = el('div', 'fold has-spk'); P.appendChild(this.hintFold);
    const dF = el('div', 'fold has-spk', `<h4>📖 呢關嘅背景</h4>${esc(T(L.detail))}`); const ds = spk([L.detail]); ds.classList.add('corner'); dF.appendChild(ds); P.appendChild(dF);
    bH.onclick = () => { const on = this.hintFold.classList.toggle('open'); bH.classList.toggle('on', on); this.hintOn = on; this.updateHints(); if (on) this.hintFold.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };

    this.hintOn = !!L.guided;
    if (this.hintOn) { this.hintFold.classList.add('open'); bH.classList.add('on'); }
  },
  setProgress() {
    const t = this.task, N = this.L.tasks.length; let part = 0;
    if (t && this.st && !this.st.done) {
      if (t.type === 'find') part = this.st.found.size / t.targets.length;
      if (t.type === 'talk') part = Object.keys(this.st.ok).length / t.people.length;
      if (t.type === 'drag') { const need = t.items.filter(i => t.ans[i]); part = need.filter(i => this.st.placed[i]).length / need.length; }
      if (t.type === 'shopfront') part = Shopfront.goodCount() / 5;
    }
    const frac = this.won ? 1 : Math.min(1, (this.ti + (this.st && this.st.done ? 1 : part)) / N);
    const bar = $('#lvBar'); if (bar) bar.style.width = Math.round(frac * 100) + '%';
    const sc = $('#lvScore'); if (sc) sc.textContent = '⭐ ' + this.score + ' 分';

  add(pts) {
    if (pts > 0) { this.score += pts; UI.float('+' + pts, '#1fa85a'); UI.flash('ok'); Sfx.ok(); }

    const speech = [];

function saveCanvas(cv, name) {
  cv.toBlob(b => {
    if (!b) return;
    const dl = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('💾 已經儲存：' + name, 3000); };
    try {
      const f = new File([b], name, { type: 'image/png' });
      /* 手機同 iPad：用分享選單，可以揀「儲存影像」入相簿 */
      if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).catch(e => { if (e && e.name !== 'AbortError') dl(); }); return; }
    } catch (e) { /* 唔支援分享就直接下載 */ }
    dl();
  }, 'image/png');
}

/* 主角拎卡行過去：路徑合理，唔會突然飛走 */
function carryAndGive(h, c, me, cb) {
  const p0 = h.g.position.clone(); h.gone = true;
  W.tween(0.4, k => { h.g.position.lerpVectors(p0, me.handPos(), k); h.g.scale.setScalar(1 - 0.5 * k); }, () => {
    me.arms[1].attach(h.g); me.holding = true;
    const p = c.root.position, side = me.root.position.x > p.x ? 0.8 : -0.8;
    me.walk([[p.x + side, p.z + 0.4]], () => { me.holding = false; W.scene.attach(h.g); h.gone = false; handOver(h, c, me, cb); }, 2.2);
  });
}

/* 資料自我檢查：每關提到嘅線索、卡、人都要存在（開發同測試用；有問題會喺 console 警告） */
function selfCheck() {
  const bad = [];
  CH.forEach(ch => {
    ch.lesson.cards.forEach((c, i) => { if (!c.n || !c.o || !c.x) bad.push(ch.id + ' 卡' + (i + 1) + ' 缺招式名／一句／原來係咁'); (c.demo || []).forEach(([w]) => { if (w !== 'me' && !ch.lesson.cast.some(x => x[0] === w)) bad.push(ch.id + ' 示範冇呢個角色：' + w); }); });
    ch.levels.forEach(L => {
      const props = new Set((L.props || []).map(p => p.id).filter(Boolean)), cast = new Set(['me', ...L.cast.map(c => c[0])]);
      if (!L.move || !L.one || !L.transfer || L.transfer.options.filter(o => o.ok).length !== 1) bad.push(L.id + ' 缺招式或者舉一反三');
      L.tasks.forEach((t, i) => {
        const tag = L.id + ' 第' + (i + 1) + '步 ';
        (t.targets || []).forEach(id => { if (!props.has(id)) bad.push(tag + '搵唔到線索 ' + id); });
        (t.items || []).forEach(id => { if (!props.has(id)) bad.push(tag + '搵唔到卡 ' + id); });
        (t.to ? [].concat(t.to) : []).concat(t.people || []).forEach(id => { if (!cast.has(id)) bad.push(tag + '冇呢個角色 ' + id); });
        (t.before || []).concat(t.say ? [t.say] : []).forEach(([w]) => { if (!cast.has(w)) bad.push(tag + '對白角色唔喺場 ' + w); });
        (t.options || []).forEach(o => (o.after || []).forEach(([w]) => { if (!cast.has(w)) bad.push(tag + '回應角色唔喺場 ' + w); }));
        if (t.type === 'choice' && t.options.filter(o => o.ok).length !== 1) bad.push(tag + '要啱一個答案');
        if (t.type === 'drag') { const need = t.items.filter(id => t.ans[id]); if (!need.length) bad.push(tag + '冇啱嘅卡'); need.forEach(id => { if (!cast.has(t.ans[id])) bad.push(tag + '答案角色唔喺場'); }); }
        if (t.type === 'talk') t.people.forEach(pid => { if (!t.lines.some(l => l.id === t.ans[pid])) bad.push(tag + pid + ' 冇啱嘅句子'); });
      });
    });
  });
  if (bad.length) console.warn('資料檢查：', bad);
  return bad;
}

/* =========================================================
   第 23 部分：導航同啟動
   ========================================================= */
const App = {
  go(page, arg) {
    try { Voice.purge && 0; } catch (e) {}
    if (page === 'start') return showStart();
    if (page === 'avatar') return showAvatar();
    if (page === 'catalog') return showCatalog();
    if (page === 'lesson') { if (!Prog.chOpen(arg)) return showCatalog(); UI.page = ''; return showLesson(arg, 0); }
    if (page === 'level') { const f = findLevel(arg); if (!f || !Prog.lvOpen(f.k, f.n)) return showCatalog(); return Lv.start(arg); }
    if (page === 'reading') return showReading();
  }
};
function buildPad() {
  const pad = $('#navPad');
  const B = [['rl', '↩️ 左轉'], ['f', '⬆️ 前'], ['rr', '↪️ 右轉'], ['zi', '➕ 近'], ['l', '⬅️ 左'], ['b', '⬇️ 後'], ['r', '➡️ 右'], ['zo', '➖ 遠'], ['u', '🔼 升高', 2], ['dn', '🔽 降低', 2]];
  const g = el('div', 'pad-grid');
  B.forEach(([a, t, span]) => {
    const b = el('button', 'pbtn', t); if (span) b.style.gridColumn = 'span ' + span; b.setAttribute('aria-label', t);
    const on = e => { e.preventDefault(); Ctl.hold = a; b.classList.add('hold'); try { b.setPointerCapture(e.pointerId); } catch (er) {} };
    const off = () => { if (Ctl.hold === a) Ctl.hold = null; b.classList.remove('hold'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    g.appendChild(b);
  });
  pad.appendChild(g);
  const touch = matchMedia('(pointer:coarse)').matches;
  pad.appendChild(el('div', 'pad-keys', touch ? '手勢：一隻手指拖＝轉視角；兩隻手指撐開／捏埋＝放大縮細；兩隻手指一齊拖＝移動；撳兩下＝飛過去。'
    : '鍵盤：W A S D 前後左右 · Q／E 升降 · ＋／－ 放大縮細 · R 返正面。滑鼠：拖＝轉、右鍵拖＝移動、滾輪＝放大、撳兩下＝飛過去。'));
}
function boot() {
  Store.load();
  if (Store.d.avatar && Store.d.avatar.g === 'f' && Store.d.avatar.name === DEF_NAME.m) { Store.d.avatar.name = DEF_NAME.f; Store.save(); }
  Voice.init();
  buildPad();
  W.init();
  // 第一下撳畫面任何位置：解鎖語音
  const unlock = () => Voice.unlock();
  document.addEventListener('pointerdown', unlock, { capture: true });
  document.addEventListener('keydown', unlock, { capture: true });
  $('#btnVoice').onclick = () => Voice.toggle();
  $('#btnSet').onclick = () => renderSettings();
  $('#btnMenu').onclick = () => App.go('catalog');
  $('#btnPad').onclick = () => { const on = $('#navPad').classList.toggle('show'); $('#btnPad').classList.toggle('on', on); $('#stage').classList.toggle('pad-open', on); };
  $('#btnHome').onclick = () => Ctl.reset();
  $('#btnStart').onclick = () => { Voice.unlock(); Sfx.tap(); App.go(Store.d.avatar ? 'catalog' : 'avatar'); };
  Voice.ui();
  App.go('start');
}
window.addEventListener('load', () => {
  if (!window.THREE) { document.body.innerHTML = '<div style="padding:24px;font-size:18px;font-family:sans-serif">載入唔到 3D 引擎（three.js）。請檢查網絡，再重新整理頁面。</div>'; return; }
  boot();
});
