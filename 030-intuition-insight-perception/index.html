<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3cc4">
<meta name="description" content="小神探洞察力訓練營：畀 6 至 12 歲小朋友自學自玩嘅 3D 洞察力訓練遊戲">
<title>小神探洞察力訓練營</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC&family=Noto+Sans+HK:wght@400;700&display=swap">
<style>
/* =========================================================
   版面同顏色
   顏色功能：紫色＝導航／主要掣；綠色＝啱／已完成；紅色＝錯；
   橙色＝提示（閃動＝提你撳）；藍色＝資訊；青色＝細喇叭
   ========================================================= */
:root{
  --font:"Chiron GoRound TC","Yuanti TC","圓體-繁","PingFang HK","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans HK","Noto Sans TC","Source Han Sans HK","Heiti TC","Roboto","Helvetica Neue",Arial,sans-serif;
  --pur:#5b3cc4;--pur2:#7c5cf0;--purL:#efeaff;
  --org:#f57c00;--orgL:#fff1de;
  --grn:#108a45;--grnL:#e0f7e8;
  --red:#d32f2f;--redL:#ffe6e6;
  --blu:#1c64d1;--bluL:#e6efff;
  --tea:#00838f;
  --ink:#2a2140;--bg:#fff7ea;--line:#eadfcd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
body{overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit}
h1,h2,h3{margin:0;line-height:1.3}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}

/* 頂部列 */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#5b3cc4,#7c5cf0);color:#fff;
  padding:6px calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));padding-top:calc(6px + env(safe-area-inset-top))}
#topbar .brand{position:relative;flex:1 1 auto;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
#topbar .brand .spk{top:50%;transform:translateY(-50%)}
@media (max-width:520px){#topbar .brand{display:none}}
.btn.hbtn{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.14);color:#fff;border-radius:14px;min-height:44px;padding:4px 29px 4px 8px;font-size:15px;white-space:nowrap;flex:0 0 auto}
.btn.hbtn.on{background:#fff;color:var(--pur)}
.btn.hbtn.idle{opacity:.6}
@media (max-width:420px){.btn.hbtn{font-size:14px;padding:4px 27px 4px 6px;flex:1 1 0;min-width:0}.btn.hbtn .em{display:none}#topbar{gap:4px}}

#notice{flex:0 0 auto}
.notice{display:flex;align-items:center;gap:6px;background:#fff3c4;border-bottom:2px solid #f0c000;padding:5px 8px;font-size:14px;line-height:1.35}
.notice .nt{position:relative;flex:1 1 auto;min-width:0;padding-right:28px}
.notice .nt .spk{top:50%;transform:translateY(-50%)}
.notice .btn{flex:0 0 auto;min-height:40px;font-size:14px;padding:2px 28px 2px 8px;border-width:2px}

/* 主畫面：3D 舞台＋文字面板 */
#view{flex:1 1 auto;display:flex;min-height:0}
#stage{position:relative;display:flex;flex-direction:column;background:#cfe8ff;min-width:0;min-height:0}
#cv{position:relative;flex:1 1 auto;min-height:0;touch-action:none;overflow:hidden}
#cv canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#cv.flash canvas{animation:flash .35s}
#minimap{position:absolute;top:6px;left:6px;width:112px!important;height:112px!important;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3}
#minimap.show{opacity:1}
@keyframes flash{0%{filter:brightness(1.8)}100%{filter:none}}
#stageBar{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom));background:#2f2560}
.barrow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.walkgrp{display:contents}
#panel{position:relative;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;min-width:0;min-height:0}
@media (orientation:landscape){#view{flex-direction:row}#stage{flex:0 0 58%}#panel{flex:1 1 42%}}
@media (orientation:portrait){#view{flex-direction:column}#stage{flex:0 0 58%}}
@media (max-width:480px){.tbtn{min-width:48px;min-height:46px;padding:2px 16px 2px 2px}.tbtn .tl{font-size:12px}.tbtn .ic{font-size:18px}.barrow{gap:4px}#stageBar{padding:4px 4px calc(4px + env(safe-area-inset-bottom))}}
#view.nostage #stage{display:none}
#view.nostage #panel{max-width:960px;margin:0 auto;width:100%}

/* 按鈕：細喇叭固定喺右上角，唔會蓋住文字 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700;line-height:1.25;
  border:3px solid var(--pur);background:#fff;color:var(--pur);border-radius:16px;min-height:50px;padding:8px 32px 8px 14px;cursor:pointer;text-align:center;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pur);color:#fff}
.btn.big{font-size:21px;min-height:62px;padding:12px 40px 12px 22px;border-radius:20px}
.btn.green{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.ghost{border-color:#bfb2e6}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.primary{background:var(--red);color:#fff}
.btn.on{background:var(--pur);color:#fff;box-shadow:0 0 0 3px #ffd54f inset}
.btn.locked{opacity:.6;border-style:dashed}
.btn.hint-blink{animation:blink 1s infinite;border-color:var(--org)!important}
@keyframes blink{0%,100%{background:#fff;color:var(--org)}50%{background:var(--org);color:#fff}}
.btn.wide{width:100%}
.spk{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--tea);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.spk svg{width:14px;height:14px}
.spk.playing{background:var(--org);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}

/* 舞台下面嘅工具掣 */
.tbtn{position:relative;min-width:62px;min-height:54px;border-radius:14px;border:2px solid #c9bdf7;background:#fff;color:var(--pur);font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 20px 4px 6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tbtn .ic{font-size:20px;line-height:1;margin-top:6px}
.tbtn .tl{font-size:13px;line-height:1.2;margin-top:3px;white-space:nowrap}
.tbtn .spk{width:20px;height:20px;top:2px;right:2px}
.tbtn .spk svg{width:12px;height:12px}
.tbtn.on{background:var(--pur);border-color:#ffd54f;color:#fff;box-shadow:0 0 0 2px #ffd54f}
.tbtn.hint-blink{animation:blink 1s infinite}
.tbtn.tool{border-color:#b39ddb;background:#f6f2ff}
.tbtn.tool.on,.tbtn.on{background:var(--pur);border-color:#ffd54f;color:#fff;box-shadow:0 0 0 2px #ffd54f}

/* 卡片 */
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 38px 12px 14px;margin:0 0 10px}
.card .spk{top:8px;right:8px}
.card.head{background:linear-gradient(135deg,#fff,#f3eeff);border-color:#d8ccff}
.card.mission{background:var(--purL);border-color:#cbbcff}
.card.ok{background:var(--grnL);border-color:#8fd7aa}
.card.warn{background:var(--orgL);border-color:#ffc58a}
.kicker{font-size:14px;color:#6b5ca8;font-weight:700}
.sub{font-size:14px;color:#6b5ca8;font-weight:700;margin-bottom:2px}
.tag{display:inline-block;background:#fff;border:2px solid #cbbcff;color:var(--pur);border-radius:999px;padding:0 10px;font-size:14px;font-weight:700;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.row > .btn{flex:1 1 140px}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:6px 0 6px 40px;counter-increment:s;border-top:1px dashed #e5dcf5}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:30px;height:30px;border-radius:50%;background:var(--pur);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pager{font-size:14px;color:#6b5ca8;font-weight:700;margin:0 0 6px}
.dots{display:flex;gap:6px;margin:0 0 8px}
.dots i{width:28px;height:8px;border-radius:4px;background:#ddd2f7}
.dots i.on{background:var(--pur)}

/* 進度 */
.bar{height:16px;border-radius:9px;background:#ece6f7;overflow:hidden;border:2px solid #d9cff3}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#12a150,#4cd17f);transition:width .4s}
.stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;font-weight:700;margin-top:6px}

/* 回饋 */
.fb{position:relative;display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:12px 40px 12px 12px;margin:0 0 10px;border:3px solid;font-weight:700;font-size:17px}
.fb .fbi{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.fb .fbt{flex:1 1 auto}
.fb .pts{display:inline-block;margin-left:6px;padding:0 8px;border-radius:10px;color:#fff;font-size:15px}
.fb.good{background:var(--grnL);border-color:var(--grn);color:#0b5c2e}.fb.good .fbi,.fb.good .pts{background:var(--grn)}
.fb.bad{background:var(--redL);border-color:var(--red);color:#8a1414}.fb.bad .fbi,.fb.bad .pts{background:var(--red)}
.fb.info{background:var(--bluL);border-color:var(--blu);color:#123f85}.fb.info .fbi{background:var(--blu)}
.fb.hint{background:var(--orgL);border-color:var(--org);color:#7a3d00}.fb.hint .fbi{background:var(--org)}
.fb.pop{animation:fbpop .35s}
@keyframes fbpop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}

/* 選擇題 */
.opts:empty{display:none}
.opts{background:#fff;border:3px solid #cbbcff;border-radius:18px;padding:10px;margin:0 0 10px}
.q{position:relative;font-size:17px;padding:2px 36px 8px 2px}
.q .spk{top:0;right:0}
.opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:17px;font-weight:700;line-height:1.35;
  background:#fff;color:var(--ink);border:3px solid #cbbcff;border-radius:16px;padding:10px 36px 10px 10px;margin:0 0 8px;min-height:54px;cursor:pointer;touch-action:manipulation}
.opt .num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--pur);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.opt.right{background:var(--grnL);border-color:var(--grn)}.opt.right .num{background:var(--grn)}
.opt.wrong{background:var(--redL);border-color:var(--red)}.opt.wrong .num{background:var(--red)}
.opt.dim{opacity:.55}
.opt .res{margin-left:auto;font-size:20px}

/* 任務清單 */
.tasks ul{list-style:none;margin:4px 0 0;padding:0}
.tasks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px dashed #eee;font-size:16px}
.tasks li:first-child{border-top:0}
.tasks li .ck{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:3px solid #bdb2dc;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:700}
.tasks li.done{color:var(--grn);font-weight:700}
.tasks li.done .ck{background:var(--grn);border-color:var(--grn)}

details.fold{background:#fff;border:2px solid var(--line);border-radius:18px;margin:0 0 10px;padding:0}
details.fold > summary{position:relative;list-style:none;cursor:pointer;padding:12px 40px 12px 14px;font-weight:700;min-height:48px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"▸ ";color:var(--pur)}
details.fold[open] > summary::before{content:"▾ "}
details.fold > summary .spk{top:12px;right:8px}
details.fold .fbody{padding:0 14px 12px}
details.fold .fbody p{margin:6px 0}
a{color:var(--blu);word-break:break-all}

/* 入口畫面 */
.hero h1{font-size:28px;color:var(--pur)}
.hero .lead{font-size:19px;font-weight:700;margin-top:6px}
.feat{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 10px}
.feat .card{margin:0;display:flex;align-items:center;gap:10px}
.feat .ic{font-size:30px;flex:0 0 auto}
.unlock{background:#fff3c4;border:2px dashed #f0b400;border-radius:14px;padding:8px 12px;margin:0 0 10px;font-weight:700;text-align:center}

/* 章節目錄 */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ch{position:relative;border-radius:20px;border:3px solid var(--c,#cbbcff);background:#fff;padding:12px 38px 12px 12px;display:flex;flex-direction:column;gap:8px}
.ch.locked{background:#f4f1f8;border-style:dashed}
.ch .top{display:flex;gap:10px;align-items:center}
.ch .ic{width:54px;height:54px;flex:0 0 auto;border-radius:16px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:30px}
.ch .nm{font-weight:700;font-size:18px}
.ch .sk{font-size:14px;color:#5e5478}
.ch .btns{display:flex;gap:6px;flex-wrap:wrap}
.ch .btns .btn{flex:1 1 110px;font-size:15px;min-height:48px;padding:6px 30px 6px 8px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;border:2px solid}
.chip.done{background:var(--grnL);border-color:var(--grn);color:var(--grn)}
.chip.todo{background:#fff;border-color:#bdb2dc;color:#6b5ca8}
.chip.lock{background:#eee;border-color:#bbb;color:#777}

/* 過關彈出畫面 */
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(40,25,90,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
#overlay[hidden]{display:none}
.ovbox{position:relative;background:#fff;border-radius:24px;max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:16px;border:4px solid #ffd54f;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ovbox h2{font-size:26px;color:var(--grn);text-align:center}
.stars{font-size:34px;text-align:center;letter-spacing:4px;margin:4px 0}
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:49}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

#loading{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100;text-align:center;padding:20px}
#loading .spin{width:56px;height:56px;border-radius:50%;border:7px solid #e2d9fb;border-top-color:var(--pur);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:14px;color:#5e5478}
.center{text-align:center}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <div id="notice"></div>
  <main id="view" class="nostage">
    <section id="stage" aria-label="3D 畫面">
      <div id="cv"><canvas id="minimap" width="150" height="150" aria-hidden="true"></canvas></div>
      <div id="stageBar"></div>
    </section>
    <section id="panel" aria-live="polite"></section>
  </main>
</div>
<div id="overlay" hidden></div>
<div id="loading"><div class="spin"></div><div><b>載入緊 3D 世界……</b></div><div class="small">第一次打開要等幾秒</div></div>
<noscript><p style="padding:20px">請開啟瀏覽器嘅 JavaScript 先可以玩。</p></noscript>

<script type="module">
/* =========================================================
   小神探洞察力訓練營
   程式結構：
   1. 存檔（localStorage）
   2. 語音朗讀（Web Speech API）同音效（Web Audio）
   3. 介面小工具（按鈕、卡片、細喇叭）
   4. 3D 引擎（three.js：鏡頭、撳、拖、動畫）
   5. 3D 素材（房間、傢俬、角色、動物、特效）
   6. 章節內容（教學文字）
   7. 課堂示範場景
   8. 關卡（每章一關）
   9. 畫面（入口、目錄、課堂、關卡、過關、總結、延伸閱讀、設定）
   10. 啟動
   ========================================================= */
let THREE = null;
const FONT = '"Chiron GoRound TC","PingFang HK","Microsoft JhengHei","Noto Sans HK","Heiti TC",sans-serif';
const CN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const cn = n => (n <= 10 ? CN[n] : n < 20 ? '十' + CN[n - 10] : String(n));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);

/* ---------- 1. 存檔 ---------- */
const SAVE_KEY = 'xst-save-v1';
const save = (() => {
  const d = { lessons: {}, levels: {}, autoVoice: true, rate: 1 };
  try { return Object.assign(d, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { return d; }
})();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 私隱模式可能存唔到 */ } }

/* ---------- 2. 語音同音效 ---------- */
const Voice = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  unlocked: false, voice: null, kind: 'none', pendingAuto: '', timer: 0, playingEl: null, noticed: false,
  pick() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices() || [];
    const lang = v => (v.lang || '').toLowerCase().replace('_', '-');
    let v = vs.find(x => lang(x) === 'zh-hk') || vs.find(x => lang(x).startsWith('yue')) ||
      vs.find(x => /cantonese|粵|廣東|hong kong|香港|sin-ji/i.test(x.name));
    if (v) { this.voice = v; this.kind = 'yue'; return; }
    v = vs.find(x => lang(x) === 'zh-tw') || vs.find(x => lang(x).startsWith('zh'));
    if (v) { this.voice = v; this.kind = 'zh'; } else { this.voice = null; this.kind = vs.length ? 'other' : 'none'; }
  },
  clean(t) {
    return String(t).replace(/<[^>]+>/g, ' ')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}\u{25A0}-\u{25FF}]/gu, '')
      .replace(/[＋]/g, '加').replace(/\s+/g, ' ').trim();
  },
  /* =====================================================
     語音排隊系統（喺背景讀，唔會因為轉視角、放大、行、撳 3D 而停）
     - say(text, el)：用戶刻意要聽（撳細喇叭）→ 由頭讀呢段
     - auto(text)：入新一頁／新一關 → 讀呢頁重點
     - fb(text)：撳完之後嘅回饋 → 讀完而家呢句，即刻插隊讀，之後繼續讀返背景嗰段
     - ask(text)：問題同選項 → 排喺回饋後面
     - 只有撳「⏸ 暫停」先會暫停；再撳「▶ 繼續」就由停低嗰句讀落去
     ===================================================== */
  q: [], cur: null, paused: false, gid: 0, watch: 0,
  chunks(text) { const t = this.clean(text); if (!t) return []; return (t.match(/[^。！？!?；]+[。！？!?；]*/g) || [t]).map(x => x.trim()).filter(Boolean); },
  push(text, opt = {}) {
    const parts = this.chunks(text); if (!parts.length) return;
    const g = ++this.gid, prio = opt.prio || 0, kind = opt.kind || 'narr';

  box.scrollIntoView({ block: 'start', behavior: 'smooth' });
  Voice.ask(say());
}
function giveHint(R) {
  R.ui.hint.classList.remove('hint-blink'); const def = R.def;
  if (R.afterAsked) { setFb(R, 'hint', '答下面嘅問題就過關喇。每個選項都撳得到細喇叭聽。'); R.ui.opts.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  const t = def.tasks.find(t => !t.final && !R.done[t.id]);
  if (t) { const ht = typeof t.hint === 'function' ? t.hint() : t.hint; setFb(R, 'hint', '提示：' + ht); const at = t.at && t.at(); if (at) E.markHint(at); return; }
  setFb(R, 'hint', '提示：' + (def.bonusHint || '必做嘅已經完成，答最後一題就過關。'));
}
function finishLevel(R) {
  const n = R.n, id = R.id, stars = R.wrong <= 1 ? 3 : R.wrong <= 4 ? 2 : 1, prev = save.levels[id] || {};
  save.levels[id] = { done: true, best: Math.max(prev.best || 0, R.score), stars: Math.max(prev.stars || 0, stars) }; persist();
  RUN.finished = true; Sfx.win(); const w = R.def.win, lv = R.b ? '練習二' : '練習一';
  /* 下一步：練習一 → 練習二 → 下一章 → 畢業總結 */
  let next;
  if (!R.b && hasB(n)) next = { label: `▶ 練習二：${CH[n - 1].level2}`, say: `下一關：練習二「${CH[n - 1].level2}」`, go: () => startLevel(n + 'b'), tip: '撳「練習二」，喺另一個生活場景再練一次。' };
  else if (n < 9) next = { label: `▶ 下一章：${CH[n].name}`, say: `下一章：${chTitle(n + 1)}`, go: () => openLesson(n + 1, 0), tip: '撳「下一章」繼續。' };
  else next = { label: '🎓 睇畢業總結', say: '睇畢業總結：你學識咗乜', go: () => showSummary(), tip: '撳「睇畢業總結」。', cls: 'green' };
  const ov = $('#overlay'); ov.innerHTML = ''; ov.hidden = false;
  const conf = h('div', { class: 'confetti' }); for (let i = 0; i < 40; i++) conf.append(h('i', { style: `left:${Math.random() * 100}%;background:${['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'][i % 5]};animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.6}s` }));
  ov.append(conf);
  const bx = h('div', { class: 'ovbox', role: 'dialog' });
  bx.append(Card(`<h2>🎉 過關！</h2><div class="center"><b>${chTitle(n)} · ${lv}</b>　<span class="chip done">✅ 已完成</span></div><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><div class="center"><b>分數：${R.score} 分</b>${R.def.bonusTotal ? ` ｜ 額外發現 ${Object.keys(R.bonus).length} / ${R.def.bonusTotal}` : ''}</div>`, `過關！${chTitle(n)}${lv}已完成。你攞到${stars}粒星，${R.score}分。`, 'head'));
  bx.append(Card('🕵️ <b>你做到：</b>' + w.did, '你做到：' + w.did, 'ok'));
  bx.append(Card('🧠 <b>你學識咗：</b>' + w.learned, '你學識咗：' + w.learned, 'mission'));
  bx.append(Card('🏠 <b>喺日常點用：</b>' + w.daily, '喺日常點用：' + w.daily));
  if (w.think) bx.append(Card('🤔 <b>諗多一層（冇標準答案，用你自己嘅諗法）：</b>' + w.think, '諗多一層，冇標準答案，用你自己嘅諗法：' + w.think, 'warn'));
  bx.append(h('div', { class: 'row' }, Btn(next.label, next.say, () => { closeOverlay(); next.go(); }, (next.cls || 'primary') + ' big wide')));
  bx.append(h('div', { class: 'row' }, Btn('🔄 再玩一次', '再玩一次呢關', () => { closeOverlay(); startLevel(id); }), Btn('📚 返目錄', '返目錄', () => { closeOverlay(); showMap(); }, 'ghost')));
  ov.append(bx); bx.scrollTop = 0;
  if (save.autoVoice) setTimeout(() => Voice.say(`過關！${chTitle(n)}${lv}完成咗。你做到：${w.did} 你學識咗：${w.learned} ${next.tip}`), 400);

function closeOverlay() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; Voice.stop(); }

/* 畢業總結 */
function showSummary() {
  SCREEN = 'summary'; RUN = null; LESSON = null; navMode(false); setStage(true);
  const S = E.newScene(); makeRoom(S, { wall: 0xfff8e1, floorTex: woodTex('#e0b07a', '#d6a46c') });

    const tex = canvasTex(128, 128, x => { x.fillStyle = '#108a45'; x.beginPath(); x.arc(64, 64, 60, 0, 7); x.fill(); x.fillStyle = '#fff'; x.font = `bold 70px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(b[0], 64, 68); });
    texPlane(g, 0.7, 0.7, tex, 0, 0, 0.07); texPlane(g, 0.7, 0.7, tex, 0, 0, -0.07, Math.PI); g.lookAt(0, g.position.y, 0); g.rotateY(Math.PI); g.userData.tap = 'b' + i; });

  E.onTap = hit => { if (hit.id && hit.id[0] === 'b') { const b = BADGES[+hit.id.slice(1)]; const g = hit.obj; const r0 = g.rotation.y; E.anim(700, k => { g.rotation.y = r0 + k * Math.PI * 2; }); Voice.fb(b[1] + '：' + b[2]); } };
  setBar([]);

  const intro = all ? '你完成咗九章！下面係你學識嘅八招，同埋點樣喺屋企、學校同街上用返出嚟。' : `你已經完成 ${doneCount()} 章，完成晒九章就正式畢業。`;

  BADGES.forEach((b, i) => P.append(Card(`<b>${CH[i].icon} 第${cn(i + 1)}招：${b[1]}</b><br>${b[2]}<br><span class="small">🏠 ${uses[i]}</span>`, `第${cn(i + 1)}招：${b[1]}。${b[2]} 日常點用：${uses[i]}`)));
  P.append(Card('🤖 AI 越嚟越普及，係我哋嘅好幫手。而你對眼、你個心同你問問題嘅能力，係你獨有嘅超能力。每日練一練，你會越嚟越厲害！', null, 'ok'));
  P.append(h('div', { class: 'row' }, Btn('📚 返目錄', '返目錄', () => showMap(), 'primary'), Btn('📖 延伸閱讀', '延伸閱讀', () => showReading())));
  Voice.auto((all ? '恭喜你成為小神探！' : '') + intro + ' 喺 3D 畫面撳徽章，可以重溫每一招。');

/* ---------- 10. 啟動 ---------- */
async function boot() {
  const urls = ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js', 'https://unpkg.com/three@0.160.0/build/three.module.js'];
  for (const u of urls) { try { THREE = await import(u); break; } catch (e) { /* 試下一個 CDN */ } }
  if (!THREE) { $('#loading').innerHTML = '<div style="font-size:40px">📡</div><b>載入唔到 3D 程式庫</b><div class="small">請檢查網絡，然後再試。</div>'; const b = Btn('🔄 再試', '再試一次', () => location.reload(), 'primary'); $('#loading').append(b); return; }
  E.init(); buildTopbar();
  const unlock = () => Voice.unlock();
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true, once: false, passive: true }));
  if (Voice.ok) { Voice.pick(); speechSynthesis.onvoiceschanged = () => Voice.pick(); }
  setTimeout(() => Voice.checkNotice(), 2200);
  window.addEventListener('resize', () => E.resize());
  $('#loading').remove();
  showHome();
  window.XST = { E, get RUN() { return RUN; }, startLevel, openLesson, showMap, showHome, save }; // 測試用
}
boot();
