<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#58B4FF">
<title>波波倒帶大冒險:逆向思維遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --line:#23255C; --text:#23255C; --muted:#50548F;
  --panel:#FFFFFF; --panel-2:#EEF6FF; --bg:#A9DBFF;
  --tang:#FF7A2F; --mint:#10A98F; --sun:#FFC93C; --pink:#FF5D8F; --sky:#3E9BFF; --grape:#7B61FF;
  --lock:#D3D6EE; --slot:#FFE9A8;
  --font:"Noto Sans HK","PingFang HK","Heiti TC","Microsoft JhengHei",sans-serif;
  --num:"Baloo 2","Arial Rounded MT Bold","Noto Sans HK",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --line:#0B0C2A; --text:#F4F3FF; --muted:#C5C7F2;
    --panel:#2B2E6B; --panel-2:#222560; --bg:#191B47; --lock:#454A86; --slot:#5A4A1E;
  }
}
:root[data-theme="dark"]{
  --line:#0B0C2A; --text:#F4F3FF; --muted:#C5C7F2;
  --panel:#2B2E6B; --panel-2:#222560; --bg:#191B47; --lock:#454A86; --slot:#5A4A1E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
*,*::before,*::after{box-sizing:inherit;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none;}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---------- shared pieces ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.35em;
  min-height:58px;padding:0 20px;border:3px solid var(--line);border-radius:16px;
  background:var(--sun);color:#23255C;font-weight:900;font-size:20px;line-height:1.1;
  box-shadow:0 5px 0 var(--line);transition:transform .06s,box-shadow .06s;white-space:nowrap;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line);}
.btn.go{background:var(--tang);color:#fff;}
.btn.ghost{background:var(--panel);color:var(--text);}
.btn.small{min-height:48px;font-size:17px;padding:0 14px;border-radius:14px;box-shadow:0 4px 0 var(--line);}
.btn.big{min-height:74px;font-size:28px;border-radius:22px;box-shadow:0 7px 0 var(--line);}
.spk{
  flex:none;width:54px;height:54px;border-radius:50%;border:3px solid var(--line);
  background:var(--mint);color:#fff;display:grid;place-items:center;padding:0;position:relative;
  box-shadow:0 4px 0 var(--line);
}
.spk svg{width:28px;height:28px;}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.spk.small{width:46px;height:46px;} .spk.small svg{width:23px;height:23px;}
.spk.talking{background:var(--pink);}
.spk.talking::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--pink);animation:ring 1s ease-out infinite;}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.say-card{
  display:flex;gap:14px;align-items:flex-start;background:var(--panel);
  border:3px solid var(--line);border-radius:22px;padding:12px 16px 12px 12px;
  box-shadow:0 6px 0 var(--line);font-size:18px;line-height:1.65;font-weight:500;
}
.say-card p{margin:2px 0 0;}
.lbl{font-weight:900;font-size:15px;color:var(--muted);white-space:nowrap;}

#autoBtn{
  position:fixed;top:0;right:12px;z-index:15;margin-top:calc(env(safe-area-inset-top,0px) + 10px);
  min-height:52px;font-size:17px;padding:0 14px;background:var(--panel);color:var(--text);
}
#autoBtn .dot{width:16px;height:16px;border-radius:50%;background:var(--mint);border:2.5px solid var(--line);}
#autoBtn .dot.off{background:var(--lock);}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:5;}
.screen.on{display:flex;}

#home{
  justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 74px) 20px calc(env(safe-area-inset-bottom,0px) + 26px);
}
.title{text-align:center;transform:rotate(-3deg);}
.title .t1,.title .t2{
  display:block;font-weight:900;line-height:1.08;letter-spacing:.05em;
  text-shadow:
    3px 3px 0 var(--line),-3px 3px 0 var(--line),3px -3px 0 var(--line),-3px -3px 0 var(--line),
    0 4px 0 var(--line),4px 0 0 var(--line),-4px 0 0 var(--line),0 -4px 0 var(--line),
    0 10px 0 var(--line);
}
.title .t1{font-size:clamp(34px,6vw,58px);color:#fff;}
.title .t2{font-size:clamp(44px,9vw,86px);color:var(--sun);}
.rew{
  display:inline-grid;place-items:center;width:1.05em;height:1.05em;vertical-align:-.1em;margin-right:.18em;
  background:var(--tang);border:4px solid var(--line);border-radius:50%;box-shadow:0 5px 0 var(--line);
}
.rew svg{width:62%;height:62%;}
.tagline{
  margin-top:18px;display:inline-block;background:var(--panel);border:3px solid var(--line);
  border-radius:999px;padding:6px 18px;font-weight:700;font-size:clamp(15px,2.2vw,19px);transform:rotate(2deg);
}
.home-bottom{width:min(700px,100%);display:flex;flex-direction:column;gap:18px;align-items:stretch;}
.vnote{display:none;font-size:15px;line-height:1.55;background:#FFF3C4;color:#23255C;border:3px dashed var(--line);border-radius:16px;padding:10px 14px;}
.vnote.on{display:block;}

#map{
  overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(to bottom, rgba(169,219,255,.0), rgba(169,219,255,.35));
}
.map-head{width:min(1040px,100%);display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-right:176px;min-height:56px;}
.map-head h1{margin:0;font-size:28px;font-weight:900;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 var(--line);white-space:nowrap;}
.startotal{font:800 22px var(--num);background:var(--sun);color:#23255C;border:3px solid var(--line);border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 var(--line);white-space:nowrap;}
.worlds{width:min(1040px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;}
.world{background:var(--panel);border:3px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);overflow:hidden;}
.world:nth-child(1){transform:rotate(-1deg);} .world:nth-child(2){transform:rotate(.7deg);} .world:nth-child(3){transform:rotate(-.5deg);}
.world .band{background:var(--wc);color:#fff;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--line);}
.world .ico{font-size:34px;line-height:1;}
.world h2{margin:0;font-size:22px;font-weight:900;flex:1;text-shadow:0 2px 0 rgba(35,37,92,.5);}
.world p{margin:14px 16px 10px;font-size:17px;line-height:1.65;}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px 18px;}
.lvl{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 0;}
.lvl .num{width:62px;height:62px;border-radius:50%;border:3px solid var(--line);background:var(--wc);color:#fff;font:800 30px var(--num);display:grid;place-items:center;box-shadow:0 4px 0 var(--line);}
.lvl:active .num{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.lvl.locked .num{background:var(--lock);color:var(--muted);}
.lvl .num svg{width:26px;height:26px;}
.lvl .st{font-size:15px;letter-spacing:1px;line-height:1;}
.lvl .lname{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;}
.s-on{color:#F5A800;} .s-off{color:var(--lock);}

/* ---------- in-level HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:6;}
#hud.on{display:block;}
#topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 176px 0 12px;display:flex;align-items:center;gap:10px;}
#topbar > *{pointer-events:auto;}
#lvlTitle{font-weight:900;font-size:19px;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:9px 16px;box-shadow:0 4px 0 var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
#card{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);width:min(820px,calc(100% - 24px));pointer-events:auto;font-size:16.5px;line-height:1.6;padding:10px 14px 10px 10px;}
#panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(960px,100%);padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:12px;}
#panel > *{pointer-events:auto;}
#bubble{display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:8px 10px 8px 12px;box-shadow:0 5px 0 var(--line);font-size:18px;font-weight:700;line-height:1.5;min-height:66px;}
#bubble .face{width:44px;height:44px;flex:none;}
#bubbleText{flex:1;min-width:0;}
#bubble.bump{animation:bump .35s ease;}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
#ctrl{background:var(--panel-2);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line);}
#ctrl.locked button:not(.spk){opacity:.5;pointer-events:none;}

/* path world */
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:2.5px solid var(--line);border-radius:12px;padding:0 8px 0 6px;height:42px;color:var(--tang);}
.chip i{font:800 15px var(--num);font-style:normal;color:var(--muted);}
.chip svg{width:26px;height:26px;}
.chip.flash{animation:flash .45s ease 3;}
@keyframes flash{50%{background:var(--sun);transform:translateY(-4px);}}
.play{display:flex;gap:14px;align-items:center;}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:6px;flex:none;}
.dpad button{border:3px solid var(--line);border-radius:15px;background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.dpad button svg{width:34px;height:34px;}
.dpad [data-d=U]{grid-column:2;grid-row:1;} .dpad [data-d=L]{grid-column:1;grid-row:2;}
.dpad [data-d=D]{grid-column:2;grid-row:2;} .dpad [data-d=R]{grid-column:3;grid-row:2;}
.planbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.planhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.planhead .lbl{flex:1;}
.slots{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;}
.slot{width:48px;height:48px;border-radius:12px;border:3px dashed var(--muted);display:grid;place-items:center;background:var(--panel);position:relative;color:var(--tang);}
.slot svg{width:30px;height:30px;}
.slot.filled{border-style:solid;border-color:var(--line);background:var(--slot);}
.slot.next{border-color:var(--tang);border-style:solid;box-shadow:0 0 0 4px rgba(255,122,47,.3);}
.slot.run{background:var(--tang);color:#fff;}
.slot i{position:absolute;top:-9px;left:-7px;font:800 12px var(--num);background:var(--line);color:#fff;border-radius:8px;padding:0 5px;font-style:normal;line-height:18px;}
.acts{display:flex;flex-direction:column;gap:12px;flex:none;}

/* machine world */
.eqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.eqlog{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0;align-items:center;min-height:42px;}
.eq{font:800 20px var(--num);background:var(--panel);border:2.5px solid var(--line);border-radius:12px;padding:2px 12px;line-height:34px;}
.eq.ok{background:#C9F5E7;color:#23255C;}
.eq.empty{font:700 15px var(--font);color:var(--muted);border-style:dashed;}
.optrow{display:flex;gap:12px;align-items:stretch;}
.opts{display:flex;gap:12px;flex:1;}
.opt{flex:1;min-height:76px;font:800 38px var(--num);padding:0 8px;}
.opt.wrong{animation:shake .4s;background:var(--lock);}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.optrow .btn.small{min-height:76px;}

/* maze world */
.mazerow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;}
.doors{display:flex;gap:12px;flex:3;min-width:260px;}
.door{flex:1;min-height:76px;font-size:24px;color:#fff;}
.mtools{display:flex;gap:10px;flex:2;min-width:220px;}
.mtools .btn{flex:1;min-height:76px;}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(20,22,60,.5);padding:20px;}
#modal.on{display:grid;}
.sheet{width:min(560px,100%);background:var(--panel);border:4px solid var(--line);border-radius:30px;box-shadow:0 10px 0 var(--line);padding:22px 22px 26px;text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.bigstars{font-size:66px;letter-spacing:8px;line-height:1.1;}
.bigstars .s-on{text-shadow:0 4px 0 var(--line);}
.sheet h2{font-size:36px;margin:6px 0 12px;font-weight:900;}
.sheet .say-card{box-shadow:none;text-align:left;}
.sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}

#nothree{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;font-size:20px;line-height:1.6;z-index:30;background:var(--bg);}

@media (max-width:700px){
  .play{flex-wrap:wrap;justify-content:center;}
  .acts{flex-direction:row;width:100%;} .acts .btn{flex:1;}
  #autoBtn .txt{display:none;}
  #topbar{padding-right:84px;} .map-head{padding-right:84px;}
  .opt{font-size:30px;}
}
@media (max-height:720px) and (min-width:701px){
  #card{font-size:15px;line-height:1.5;}
  .say-card .spk{width:46px;height:46px;}
}
@media (prefers-reduced-motion: reduce){
  .spk.talking::after,.chip.flash,#bubble.bump,.sheet,.opt.wrong{animation:none;}
}
</style>
</head>
<body>
<canvas id="c" aria-label="遊戲畫面"></canvas>

<button id="autoBtn" class="btn ghost small" type="button" aria-pressed="true"></button>

<section id="home" class="screen" aria-label="主頁">
  <div class="title">
    <span class="t1">機械人波波</span>
    <span class="t2"><span class="rew" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z" fill="#fff" stroke="#23255C" stroke-width="1.6" stroke-linejoin="round"/></svg></span>倒帶大冒險</span>
    <div class="tagline">由結果開始,倒轉諗返轉頭</div>
  </div>
  <div class="home-bottom">
    <div class="say-card" id="introCard"><p id="introText"></p></div>
    <div class="vnote" id="vnote"></div>
    <button class="btn big go" id="btnStart" type="button">▶ 開始冒險</button>
  </div>
</section>

<section id="map" class="screen" aria-label="揀關卡">
  <div class="map-head">
    <button class="btn ghost small" id="btnMapHome" type="button">🏠 主頁</button>
    <h1>揀關卡</h1>
    <span class="startotal" id="starTotal"></span>
    <span id="mapSpk"></span>
  </div>
  <div class="worlds" id="worlds"></div>
</section>

<div id="hud">
  <div id="topbar">
    <button class="btn ghost small" id="btnBack" type="button">🗺 地圖</button>
    <button class="btn ghost small" id="btnRetry" type="button" aria-label="重新開始呢一關">↻</button>
    <div id="lvlTitle"></div>
  </div>
  <div id="card" class="say-card"><p id="cardText"></p></div>
  <div id="panel">
    <div id="bubble">
      <svg class="face" viewBox="0 0 40 40" aria-hidden="true"><line x1="20" y1="10" x2="20" y2="4.5" stroke="#23255C" stroke-width="3"/><circle cx="20" cy="4.5" r="3.2" fill="#FF5D8F" stroke="#23255C" stroke-width="2"/><rect x="4" y="10" width="32" height="24" rx="7" fill="#10A98F" stroke="#23255C" stroke-width="3"/><rect x="9" y="15" width="22" height="14" rx="4" fill="#23255C"/><circle cx="15" cy="21" r="2.7" fill="#9FF7FF"/><circle cx="25" cy="21" r="2.7" fill="#9FF7FF"/><path d="M16.5 25.2q3.5 2.6 7 0" stroke="#FF5D8F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div id="bubbleText"></div>
    </div>
    <div id="ctrl"></div>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"></div>
<div id="nothree">遊戲載入唔到 3D 引擎,請檢查網絡之後重新整理頁面。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){ document.getElementById('nothree').style.display='grid'; return; }

/* =========================================================
   Helpers
   ========================================================= */
const $=s=>document.querySelector(s);
function h(tag,attrs){
  const e=document.createElement(tag); attrs=attrs||{};
  for(const k in attrs){ const v=attrs[k];
    if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k==='style') e.setAttribute('style',v);
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v); }
  for(let i=2;i<arguments.length;i++){ const kid=arguments[i]; const list=Array.isArray(kid)?kid:[kid];
    list.forEach(kd=>{ if(kd==null||kd===false) return; e.append(kd.nodeType?kd:document.createTextNode(String(kd))); }); }
  return e;
}
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const SPK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const LOCK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>';
const ROT={U:0,R:90,D:180,L:270};
const arrowSvg=d=>'<svg viewBox="0 0 24 24" style="transform:rotate('+ROT[d]+'deg)" aria-hidden="true"><path d="M12 3.5 20.5 12.5H15.2V20.5H8.8V12.5H3.5Z" fill="currentColor" stroke="#23255C" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const starsHtml=(n,total)=>{ total=total||3; let s=''; for(let i=0;i<total;i++) s+='<span class="'+(i<n?'s-on':'s-off')+'">★</span>'; return s; };

/* =========================================================
   Save data
   ========================================================= */
const SAVE='bobo-rewind-v1';
const prog={stars:{path:[0,0,0,0],machine:[0,0,0,0],maze:[0,0,0,0]},auto:true};

/* =========================================================
   Cantonese speech (Web Speech API, zh-HK)
   ========================================================= */
const Speech=(function(){
  const synth=window.speechSynthesis||null;
  let voice=null, kind='none', talking=false, unlocked=false, gen=0, delayUntil=0, cb=function(){};
  function pick(){
    if(!synth) return;
    const vs=synth.getVoices()||[];
    const L=v=>(v.lang||'').toLowerCase().replace(/_/g,'-');
    let v=vs.find(v=>L(v)==='zh-hk')||vs.find(v=>L(v).indexOf('yue')===0)||vs.find(v=>/cantonese|粵|粤|hong ?kong|香港/i.test(v.name));
    if(v){ voice=v; kind='yue'; }
    else { v=vs.find(v=>L(v)==='zh-tw')||vs.find(v=>L(v).indexOf('zh')===0)||vs.find(v=>L(v).indexOf('cmn')===0); voice=v||null; kind=v?'zh':'none'; }
    cb();
  }
  function clearMarks(){ document.querySelectorAll('.spk.talking').forEach(b=>b.classList.remove('talking')); }
  function split(t){ return (String(t).match(/[^。!?!?;;]+[。!?!?;;]*/g)||[String(t)]).map(s=>s.trim()).filter(Boolean); }
  function speak(text,btn,opt){
    opt=opt||{};
    if(!synth||!text) return false;
    const my=opt.queue?gen:++gen;
    const go=()=>{
      if(my!==gen) return;
      const parts=split(text);
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=voice?voice.lang:'zh-HK'; if(voice) u.voice=voice;
        u.rate=0.9; u.pitch=1.08; u.volume=1;
        u.onstart=()=>{ talking=true; if(i===0){ clearMarks(); if(btn) btn.classList.add('talking'); } };
        u.onend=u.onerror=()=>{ if(i===parts.length-1){ talking=false; if(btn) btn.classList.remove('talking'); } };
        synth.speak(u);
      });
    };
    if(!opt.queue&&(synth.speaking||synth.pending)){
      synth.cancel(); clearMarks(); talking=false; delayUntil=performance.now()+100; setTimeout(go,100);
    } else {
      const d=delayUntil-performance.now(); if(d>0) setTimeout(go,d+30); else go();
    }
    return true;
  }
  function stop(){ gen++; if(synth) synth.cancel(); clearMarks(); talking=false; }
  function unlock(){
    if(unlocked||!synth) return; unlocked=true;
    try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='zh-HK'; synth.speak(u); }catch(e){}
  }
  if(synth){ pick(); try{ synth.addEventListener('voiceschanged',pick); }catch(e){ synth.onvoiceschanged=pick; } [300,900,2000,4000].forEach(t=>setTimeout(pick,t)); }
  return { speak, stop, unlock, onChange(f){ cb=f; }, get kind(){ return synth?kind:'nosynth'; }, get talking(){ return talking; } };
})();

/* =========================================================
   Sound effects (WebAudio)
   ========================================================= */
const Sfx={
  ctx:null,
  init(){ try{ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) this.ctx=new AC(); } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  tone(f,d,type,v,delay,f2){
    const c=this.ctx; if(!c) return; const t=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain(); o.type=type||'triangle';
    o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||.1,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
  },
  noise(d,v,lp){
    const c=this.ctx; if(!c) return; const len=Math.floor(c.sampleRate*d); const b=c.createBuffer(1,len,c.sampleRate); const ch=b.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1000;
    const g=c.createGain(); g.gain.value=v||.2; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  tap(p){ this.tone(620+(p||0)*40,.07,'triangle',.08); },
  step(){ this.tone(480+Math.random()*90,.06,'square',.025); },
  ok(){ [523,659,784].forEach((f,i)=>this.tone(f,.16,'triangle',.12,i*.08)); },
  bad(){ this.tone(250,.25,'sawtooth',.05,0,170); },
  splash(){ this.noise(.5,.25,900); this.tone(300,.3,'sine',.08,0,90); },
  win(){ [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.11,i*.11)); },
  pop(){ this.tone(380,.12,'sine',.1,0,900); },
  whir(){ this.tone(160,.55,'sawtooth',.03,0,460); },
  bump(){ this.tone(130,.16,'square',.06); }
};
document.addEventListener('pointerdown',()=>{ Speech.unlock(); Sfx.init(); },true);

const ease={
  io:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,
  lin:p=>p,

};

function updateTweens(dt){
  const list=tweens.slice();
  for(const tw of list){
    if(tweens.indexOf(tw)<0) continue;
    tw.t+=dt; const p=Math.min(1,tw.t/tw.dur); tw.fn(tw.e(p));
    if(p>=1){ const i=tweens.indexOf(tw); if(i>=0) tweens.splice(i,1); tw.res(); }
  }
}

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt; p.v.y-=p.g*dt; p.m.position.addScaledVector(p.v,dt);
    if(p.spin){ p.m.rotation.x+=p.spin*dt; p.m.rotation.y+=p.spin*.7*dt; p.v.x*=.985; p.v.z*=.985; if(p.v.y<-1.4) p.v.y=-1.4; }
    if(p.life<=0){ if(p.m.parent) p.m.parent.remove(p.m); p.m.material.dispose(); parts.splice(i,1); }
    else if(p.life<.35) p.m.material.opacity=p.life/.35;
  }
}

/* =========================================================
   Camera framing (keeps the scene inside the free space between UI panels)
   ========================================================= */
let frame={c:V3(0,0,0),rx:4,ry:3,near:1,elev:.8,az:0};
let regionFn=()=>({top:0,bot:0});
/* rx: half width to fit, ry: half height (as seen on screen), near: how far the scene reaches toward the camera */
function setFrame(c,rx,ry,near,elev,az){ frame={c:c.clone(),rx:rx,ry:ry,near:near,elev:elev,az:az||0}; reframe(); }
function reframe(){
  const w=window.innerWidth, hh=window.innerHeight;
  renderer.setSize(w,hh,false);
  const reg=regionFn(); let top=Math.max(0,reg.top)+10, bot=Math.max(0,reg.bot)+10;
  let free=hh-top-bot; if(free<170){ const k=(170-free)/2; top-=k; bot-=k; free=170; }
  camera.aspect=w/hh;
  const half=THREE.MathUtils.degToRad(camera.fov)/2;
  const tv=Math.tan(half)*free/hh, th=Math.tan(half)*(w-24)/hh;
  const dist=Math.max(frame.rx/th,frame.ry/tv)+frame.near;
  const dir=V3(Math.sin(frame.az)*Math.cos(frame.elev),Math.sin(frame.elev),Math.cos(frame.az)*Math.cos(frame.elev));
  camera.position.copy(frame.c).addScaledVector(dir,dist); camera.lookAt(frame.c);
  camera.setViewOffset(w,hh,0,-(top-bot)/2,w,hh); camera.updateProjectionMatrix();
}

/* ---------- movement animations ---------- */
function faceAngle(dx,dz){ return Math.atan2(dx,dz); }
async function hop(obj,to,dur,height){
  dur=dur||.34; height=height==null?.35:height;
  const from=obj.position.clone(); const dx=to.x-from.x, dz=to.z-from.z;
  const a0=obj.rotation.y; const a1=(Math.abs(dx)+Math.abs(dz)>.01)?faceAngle(dx,dz):a0;
  const da=((a1-a0)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  obj.userData.moving=true;
  await tween(dur,p=>{ obj.position.x=from.x+dx*p; obj.position.z=from.z+dz*p; obj.position.y=from.y+(to.y-from.y)*p+Math.sin(p*Math.PI)*height; obj.rotation.y=a0+da*Math.min(1,p*2.5); },ease.lin);
  obj.userData.moving=false; Sfx.step();
}
async function turnTo(obj,angle,dur){
  const a0=obj.rotation.y; const da=((angle-a0)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  await tween(dur||.25,p=>{ obj.rotation.y=a0+da*p; });
}
async function jumpCheer(r,times){
  r.userData.cheer=true;
  for(let i=0;i<(times||2);i++){ const y0=r.position.y; await tween(.36,p=>{ r.position.y=y0+Math.sin(p*Math.PI)*.55; },ease.lin); }
  r.userData.cheer=false;
}
function showQ(r,txt){
  const q=tagSprite(txt||'?','#FFFFFF','#FF5D8F',.62); q.position.y=1.85; r.add(q);
  return ()=>{ r.remove(q); q.material.map.dispose(); q.material.dispose(); };
}
async function poof(r){ await tween(.22,p=>r.scale.setScalar(Math.max(.01,1-p))); }
async function unpoof(r){ r.scale.setScalar(.01); await tween(.3,p=>r.scale.setScalar(.01+.99*p),ease.back); }

/* ---------- render loop ---------- */
let lastT=performance.now(), T=0;
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000)); lastT=now; T+=dt;
  updateTweens(dt); updateParts(dt);
  for(const f of idlers) f(T,dt);
  for(const r of robots) animRobot(r,T);
  sky.children.forEach(c=>{ c.position.x+=c.userData.v*dt; if(c.position.x>30) c.position.x=-30; });
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

function startPath(wi,li){
  clearStage();
  const L=WORLDS[wi].levels[li];
  const cells=[[0,0]]; L.moves.forEach(m=>{ const d=DIRS[m], p=cells[cells.length-1]; cells.push([p[0]+d.dx,p[1]+d.dz]); });
  const n=L.moves.length, first=DIRS[L.moves[0]], last=DIRS[L.moves[n-1]];
  const houseCell=[-first.dx,-first.dz], end=cells[n], chestCell=[end[0]+last.dx,end[1]+last.dz];
  const all=cells.concat([houseCell,chestCell]);
  const xs=all.map(c=>c[0]), zs=all.map(c=>c[1]);
  const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2, cz=(Math.min.apply(null,zs)+Math.max.apply(null,zs))/2, SP=1.2;
  const P=(c,y)=>V3((c[0]-cx)*SP,y||0,(c[1]-cz)*SP);
  let R=0; all.forEach(c=>{ R=Math.max(R,P(c).length()); }); R+=.95;
  stage.add(island(R+.75));
  const water=new THREE.Mesh(new THREE.CylinderGeometry(R,R,.12,64),new THREE.MeshPhongMaterial({color:0x49B3EE,shininess:90,specular:0xffffff,transparent:true,opacity:.9}));
  water.position.y=-.02; water.receiveShadow=true; stage.add(water);
  const key=c=>c[0]+','+c[1]; const used=new Set(all.map(key));
  const rnd=mulberry32(li*31+5);
  for(let i=0;i<9;i++){ const a=rnd()*Math.PI*2, d=rnd()*(R-.5); const x=Math.cos(a)*d, z=Math.sin(a)*d;
    const gc=[Math.round(x/SP+cx),Math.round(z/SP+cz)]; if(used.has(key(gc))) continue;
    const pad=new THREE.Mesh(new THREE.CircleGeometry(.2+rnd()*.1,18,.3,Math.PI*1.8),toon(0x4FBF63)); pad.rotation.x=-Math.PI/2; pad.position.set(x,.05,z); stage.add(pad); }
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+rnd(); const t=makeTree(rnd,.8+rnd()*.4); t.position.set(Math.cos(a)*(R+.4),0,Math.sin(a)*(R+.4)); stage.add(t); }
  const stones=cells.map((c,i)=>{
    const s=mesh(new THREE.CylinderGeometry(.44,.5,.3,20),toon(i===0?0xF3DDAA:i===n?0xFFD66B:0xB9BECB));
    s.position.copy(P(c,.05)); stage.add(s); if(L.hidden&&i>0&&i<n) s.visible=false; return s; });
  const islet=c=>{ const m=mesh(new THREE.CylinderGeometry(.62,.66,.34,24),toon(0x8BD66B)); m.position.copy(P(c,0)); stage.add(m); };
  islet(houseCell); islet(chestCell);
  const house=makeHouse(); house.position.copy(P(houseCell,.17)); house.rotation.y=faceAngle(first.dx,first.dz); stage.add(house);
  const chest=makeChest(); chest.position.copy(P(chestCell,.17)); chest.rotation.y=faceAngle(-last.dx,-last.dz); stage.add(chest);
  const robot=makeRobot({main:true}); robot.position.copy(P(end,.2)); stage.add(robot);
  S={kind:'path',wi:wi,li:li,L:L,n:n,cells:cells,P:P,stones:stones,robot:robot,houseCell:houseCell,chestCell:chestCell,
     plan:[],correct:L.moves.slice().reverse().map(m=>OPP[m]),mistakes:0,hinted:false,wrongAt:{},busy:false};
  S.instr='第'+(li+1)+'關:'+L.name+'。波波由屋企出發,跟住足跡紀錄行咗'+n+'步,去到寶藏度。依家佢要返屋企!'
    +(L.hidden?'小心,今次啲石頭隱形咗,睇唔到條路,只可以靠足跡紀錄㗎!':'')
    +'用逆向思維:由最後一步開始倒轉排,每一步嘅方向都要調轉,向上變向下,向左變向右。撳箭嘴排好返屋企嘅路,排好就撳「出發」。';
  setFrame(V3(0,.2,.1),R+.45,(R+.45)*Math.sin(.92)+.3,(R+.45)*Math.cos(.92)*.5,.92,0);
  pathUI();
  say('撳箭嘴排好返屋企嘅路,排好就撳「出發」。唔識就撳「提示」或者「睇去程」。',{speak:false});
}

function gridBfs(map,start){
  const H=map.length,W=map[0].length,k=(r,c)=>r+','+c;
  const prev={}, seen=new Set([k(start[0],start[1])]), q=[start], order=[];
  while(q.length){ const cur=q.shift(); order.push(cur); const r=cur[0],c=cur[1];
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(n=>{ const a=n[0],b=n[1]; if(a<0||b<0||a>=H||b>=W||map[a][b]==='.'||seen.has(k(a,b))) return; seen.add(k(a,b)); prev[k(a,b)]=cur; q.push(n); }); }
  return {seen:seen,prev:prev,order:order,
    path:goal=>{ const out=[goal]; let cur=goal; while(!(cur[0]===start[0]&&cur[1]===start[1])){ cur=prev[k(cur[0],cur[1])]; if(!cur) return null; out.push(cur); } return out.reverse(); }};
}
function startMaze(wi,li){
  clearStage();
  const L=WORLDS[wi].levels[li], map=L.map, H=map.length, W=map[0].length;
  const P=(r,c,y)=>V3(c-(W-1)/2,y||0,r-(H-1)/2);
  const ground=mesh(new THREE.BoxGeometry(W+1.4,.5,H+1.4),toon(0x8BD66B)); ground.position.y=-.25; stage.add(ground);
  const dirt=mesh(new THREE.BoxGeometry(W+1.1,1.6,H+1.1),toon(0xC98B5A)); dirt.position.y=-1.3; stage.add(dirt);
  const rnd=mulberry32(101+li*17);
  const tiles={}, doors={}; let T=null;
  const DOORCOL={A:0xFF5D8F,B:0xFFC93C,C:0x3E9BFF}, DOORCSS={A:'#FF5D8F',B:'#FFC93C',C:'#3E9BFF'};
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const ch=map[r][c];
    if(ch==='.'){ const x=rnd(); if(x<.34){ const t=makeTree(rnd,.7+rnd()*.3); t.position.copy(P(r,c)); stage.add(t); } else if(x<.5){ const f=makeFlower(rnd); f.position.copy(P(r,c)); stage.add(f); } continue; }
    const tile=mesh(new THREE.BoxGeometry(.94,.14,.94),toon(0xF3D9A4)); tile.position.copy(P(r,c,.07)); tile.userData.cell=[r,c];
    stage.add(tile); pickables.push(tile); tiles[r+','+c]=tile;

  }
  const chest=makeChest(); chest.position.copy(P(T[0],T[1],.14)); stage.add(chest);
  Object.keys(doors).forEach(D=>{
    const d=doors[D], g=new THREE.Group(); g.position.copy(P(d[0],d[1],.14)); g.position.z+=.36;
    const m=toon(DOORCOL[D]);
    const p1=mesh(new THREE.BoxGeometry(.12,.8,.12),m); p1.position.set(-.42,.4,0);
    const p2=mesh(new THREE.BoxGeometry(.12,.8,.12),m.clone()); p2.position.set(.42,.4,0);
    const top=mesh(new THREE.BoxGeometry(1.02,.16,.16),m.clone()); top.position.y=.84;
    const lab=tagSprite(D,DOORCSS[D],D==='B'?'#23255C':'#FFFFFF',.7); lab.position.y=1.35;
    g.add(p1,p2,top,lab); stage.add(g);
  });
  const res=gridBfs(map,T);
  const answer=Object.keys(doors).find(D=>res.seen.has(doors[D][0]+','+doors[D][1]));
  const robot=makeRobot({main:true}); robot.visible=false; stage.add(robot);
  S={kind:'maze',wi:wi,li:li,L:L,map:map,H:H,W:W,P:P,tiles:tiles,doors:doors,T:T,answer:answer,goodPath:res.path(doors[answer]),
     lit:new Set([T[0]+','+T[1]]),robot:robot,mistakes:0,hinted:false,busy:false,tried:{}};
  lightTile(T[0],T[1],true);
  S.instr='第'+(li+1)+'關:'+L.name+'。寶藏喺最上面!下面有三道門:A、B、C,只有一道門行得到寶藏。由門口向上行有好多分岔路,好易蕩失路。用逆向思維:由寶藏開始,倒轉行落嚟!你可以用手指由寶藏隔籬開始,一格一格撳條路,將佢點亮。估到係邊道門,就撳下面嘅門。';
  setFrame(V3(0,0,.3),W/2+.75,(H/2+.75)*Math.sin(1.08)+.55,(H/2+.75)*Math.cos(1.08)*.55,1.08,0);
  mazeUI();
  say('由寶藏隔籬開始,一格一格撳條路,睇下條路去到邊道門。',{speak:false});
}
function lightTile(r,c,quiet){
  const t=S.tiles[r+','+c]; if(!t) return;
  S.lit.add(r+','+c);
  t.material.color.set(0xFFD84D); t.material.emissive=new THREE.Color(0x5a3c00);
  if(!quiet){ const y0=.07; tween(.3,p=>{ t.position.y=y0+Math.sin(p*Math.PI)*.12; }); }
}
function unlightAll(){
  Object.keys(S.tiles).forEach(k=>{ const t=S.tiles[k]; t.material.color.set(0xF3D9A4); t.material.emissive=new THREE.Color(0x000000); });
  S.lit=new Set(); lightTile(S.T[0],S.T[1],true);
}
function mazeUI(){
  const DOORCSS={A:'#FF5D8F',B:'#FFC93C',C:'#3E9BFF'};
  $('#ctrl').append(h('div',{class:'mazerow'},
    h('div',{class:'doors'},['A','B','C'].map(D=>h('button',{class:'btn door',type:'button','aria-label':D+'門',style:'background:'+DOORCSS[D]+(D==='B'?';color:#23255C':''),onclick:()=>chooseDoor(D)},'🚪 '+D+' 門'))),
    h('div',{class:'mtools'},h('button',{class:'btn small',type:'button',onclick:mazeHint},'💡 倒帶提示'),h('button',{class:'btn ghost small',type:'button',onclick:()=>{ if(S.busy) return; Sfx.tap(); unlightAll(); say('已經清除咗發光嘅路。可以由寶藏重新開始撳。'); }},'↺ 清除'))));
}
function mazeTap(cell){
  const r=cell[0], c=cell[1], key=r+','+c;
  if(S.lit.has(key)) return;
  const adj=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].some(n=>S.lit.has(n[0]+','+n[1]));
  if(!adj){ Sfx.bad(); say('要由發光嘅格仔隔籬撳起喎,一格接一格咁行。'); return; }
  lightTile(r,c); Sfx.tap(S.lit.size%8);
  const ch=S.map[r][c];
  if('ABC'.indexOf(ch)>=0) say('條發光嘅路連到'+ch+'門喇!撳下面嘅「'+ch+'門」,睇下波波行唔行到寶藏。');
  else {
    const open=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(n=>S.tiles[n[0]+','+n[1]]&&!S.lit.has(n[0]+','+n[1]));
    if(!open.length) say('呢度係死路!試下由其他發光格仔隔籬繼續撳。');
  }
}
function mazeHint(){
  if(S.busy) return;
  if(!S.hinted){ S.hinted=true; S.mistakes++; }
  const p=S.goodPath; // already ordered from the treasure down to the door
  let j=0; while(j<p.length&&S.lit.has(p[j][0]+','+p[j][1])) j++;
  if(j>=p.length){ say('條路已經點亮晒,睇下佢去到邊道門,就撳嗰道門啦!'); return; }
  let n=0; for(;j<p.length&&n<3;j++){ if(!S.lit.has(p[j][0]+','+p[j][1])){ lightTile(p[j][0],p[j][1]); n++; } }
  Sfx.pop();
  say('倒帶提示:我由寶藏開始,幫你倒轉點亮多'+n+'格。跟住條光路,繼續一格一格撳落去啦!');
}
async function chooseDoor(D){
  if(S.busy) return; const my=S;
  S.busy=true; lock(true);
  const d=S.doors[D], r=S.robot, P=S.P;
  r.visible=true; r.position.copy(P(d[0],d[1],.14)); r.rotation.set(0,Math.PI,0); Sfx.pop(); await unpoof(r);
  if(S!==my) return;
  const res=gridBfs(S.map,d);
  if(D===S.answer){
    say(D+'門,出發!');
    const path=res.path(S.T);
    for(let i=1;i<path.length-1;i++){ if(S!==my) return; lightTile(path[i][0],path[i][1],true); await hop(r,P(path[i][0],path[i][1],.14),.22,.16); }
    if(S!==my) return;
    Sfx.win(); burst(P(S.T[0],S.T[1],1.2),60,'conf');
    say('好嘢!'+D+'門真係行得到寶藏!由終點倒轉諗,係咪快好多呢?');
    await turnTo(r,0,.2); await jumpCheer(r,3); await wait(.8);
    if(S!==my) return;
    finishLevel();
  } else {
    S.mistakes++;
    const far=res.order[res.order.length-1]; const path=res.path(far);
    for(let i=1;i<path.length;i++){ if(S!==my) return; await hop(r,P(path[i][0],path[i][1],.14),.2,.14); }
    if(S!==my) return;
    Sfx.bad(); const hideQ=showQ(r);
    say(D+'門行上去係死路!波波行唔到寶藏。試下由寶藏開始,倒轉追返落嚟啦。');
    await wait(1.8); if(S!==my) return; hideQ(); await poof(r); r.visible=false; r.scale.setScalar(1);
    S.busy=false; lock(false);
  }
}

/* ---------- canvas taps (maze tracing) ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downAt=null;
canvas.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup',e=>{
  if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null;
  if(moved>14||S.kind!=='maze'||S.busy||!pickables.length) return;
  ndc.set(e.clientX/window.innerWidth*2-1,-(e.clientY/window.innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if(hit) mazeTap(hit.object.userData.cell);
});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- boot ---------- */
buildHome(); show('home');
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(reframeSoon);
window.__bobo={startLevel:startLevel,goMap:goMap,getS:()=>S};
})();
</script>
