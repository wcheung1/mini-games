<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>心靈小勇士 — 強大內心大冒險（第二集）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2340; --paper:#fffaf3; --sun:#ffd23f; --heart:#ff6fae; --grass:#7ee081;
  --teal:#2ec4b6; --lav:#c9b8ff; --storm:#4a3f63;
  --b:4px solid var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#aee3ff;color:var(--ink);
  font-family:"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:var(--ink)}
button:focus-visible{outline:4px dashed var(--heart);outline-offset:3px}

.btn{font-weight:900;font-size:clamp(18px,2.3vw,23px);border:var(--b);border-radius:999px;padding:10px 24px;
  background:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-height:56px;transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.go{background:var(--grass)}
.btn.pink{background:var(--heart);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.spk{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:var(--b);background:var(--teal);
  font-size:25px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spk.sm{width:44px;height:44px;flex-basis:44px;font-size:20px;border-width:3px}
.spk.playing{background:var(--sun);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.13)}}

.screen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:rgba(43,35,64,.28)}
.panel{background:var(--paper);border:var(--b);border-radius:30px;box-shadow:0 10px 0 var(--ink);
  width:min(780px,100%);max-height:100%;overflow:auto;padding:26px 26px 30px;-webkit-overflow-scrolling:touch}
.title{margin:0;font-weight:900;font-size:clamp(44px,8vw,78px);line-height:1.05;letter-spacing:.04em;
  color:var(--heart);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-align:center}
.subtitle{text-align:center;margin:12px 0 0;font-size:clamp(19px,2.6vw,25px);font-weight:900}
.weatherstrip{text-align:center;font-size:40px;margin:14px 0 0;letter-spacing:10px}
.intro-row{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;margin-top:16px}
.intro-row p{margin:0;font-size:clamp(18px,2.3vw,21px);line-height:1.6;font-weight:700}
.voice{margin-top:14px;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;line-height:1.55;border:3px dashed var(--ink)}
.voice.good{background:#dcf9d6}.voice.bad{background:#ffe1e5}
.voice summary{cursor:pointer;font-weight:900}.voice ol{margin:6px 0 0;padding-left:22px}
.speed{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-weight:900;font-size:18px;flex-wrap:wrap}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;font-weight:900;font-size:18px;padding:8px 18px;cursor:pointer;min-height:46px}
.seg button.on{background:var(--sun)}
.cta{display:flex;justify-content:center;margin-top:20px}
.cta .btn{font-size:clamp(22px,3vw,28px);padding:14px 40px}
.fine{text-align:center;margin:14px 0 0;font-size:15px;font-weight:700;opacity:.75}

.pickhead{display:flex;gap:12px;align-items:center;justify-content:center}
.pickhead h2{margin:0;font-size:clamp(24px,3.4vw,32px);font-weight:900}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
@media (max-width:560px){.avgrid{grid-template-columns:repeat(2,1fr)}}
.avcard{background:#fff;border:var(--b);border-radius:22px;padding:14px 6px 12px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:center;transition:transform .12s}
.avcard.on{background:var(--sun);transform:translateY(-6px) rotate(-2deg)}
.avcard b{display:block;margin-top:8px;font-size:21px}
.av{width:86px;height:112px;position:relative;margin:0 auto}
.av .body{position:absolute;left:50%;bottom:4px;width:58px;height:50px;transform:translateX(-50%);background:var(--shirt);border:3px solid var(--ink);border-radius:24px 24px 12px 12px}
.av .head{position:absolute;left:50%;top:8px;width:58px;height:58px;transform:translateX(-50%);background:#ffd7b5;border:3px solid var(--ink);border-radius:50%;z-index:1}
.av .head::before,.av .head::after{content:"";position:absolute;top:26px;width:8px;height:10px;background:var(--ink);border-radius:50%}
.av .head::before{left:14px}.av .head::after{right:14px}
.av .hair{position:absolute;left:50%;top:4px;width:64px;height:28px;transform:translateX(-50%);background:var(--hair);border:3px solid var(--ink);border-radius:34px 34px 10px 10px;z-index:2}
.av.pony .hair::after{content:"";position:absolute;right:-18px;top:8px;width:20px;height:30px;background:var(--hair);border:3px solid var(--ink);border-radius:50%}
.av.bob .hair::before,.av.bob .hair::after{content:"";position:absolute;top:14px;width:14px;height:32px;background:var(--hair);border:3px solid var(--ink);border-radius:8px}
.av.bob .hair::before{left:-6px}.av.bob .hair::after{right:-6px}
.av.twin .hair::before,.av.twin .hair::after{content:"";position:absolute;top:10px;width:22px;height:22px;background:var(--hair);border:3px solid var(--ink);border-radius:50%}
.av.twin .hair::before{left:-18px}.av.twin .hair::after{right:-18px}
.av.spiky .hair{border-radius:12px 12px 8px 8px;height:24px}

#hud{position:fixed;z-index:15;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
#hud > *{pointer-events:auto}
.hud-l{background:var(--paper);border:var(--b);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.energy{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
#weather{font-size:28px;line-height:1}
.ebar{width:150px;height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
#efill{height:100%;width:50%;background:linear-gradient(90deg,#ff6fae,#ffd23f);transition:width .6s}
#tslots{display:flex;gap:4px}
.tslot{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:15px;font-style:normal;filter:grayscale(1);opacity:.35}
.tslot.on{filter:none;opacity:1;background:#ffe6f2}
@media (max-width:620px){.ebar{width:96px}.tslot{width:24px;height:24px;font-size:12px;border-width:2px}}
.hud-r{display:flex;gap:8px}
.hbtn{width:74px;border:var(--b);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.hbtn span{font-size:26px;line-height:1.1}.hbtn small{font-size:13px;font-weight:900;white-space:nowrap}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:520px){.hbtn{width:58px}.hbtn small{font-size:11px}}
#hintbar{position:fixed;z-index:14;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;background:var(--paper);border:var(--b);border-radius:999px;box-shadow:0 5px 0 var(--ink);
  padding:6px 20px 6px 8px;font-weight:900;font-size:clamp(16px,2.1vw,20px);max-width:94vw}
#hintbar p{margin:0;line-height:1.35}

#dlg{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(940px,96vw);
  transform:translate(-50%,130%);transition:transform .38s cubic-bezier(.2,1.3,.4,1)}
#dlg.show{transform:translate(-50%,0)}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;border:var(--b);border-bottom:0;
  border-radius:18px 18px 0 0;padding:4px 18px 4px 8px;margin-left:24px;font-weight:900;font-size:21px}
.who .face{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;border:3px solid var(--ink)}
.card{background:var(--paper);border:var(--b);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px 18px 18px;
  max-height:min(64vh,660px);overflow:auto;-webkit-overflow-scrolling:touch}
.line{display:flex;gap:14px;align-items:flex-start;animation:pop .3s ease-out}
.line p{margin:4px 0 0;font-size:clamp(20px,2.7vw,27px);line-height:1.55;font-weight:700;flex:1}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
.q{font-weight:900!important}
.hint{margin-top:12px;background:var(--heart);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s}
.hint p{margin:2px 0 0;font-size:clamp(17px,2.2vw,21px);line-height:1.55;font-weight:700}
.choice{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 12px;margin-top:12px;animation:pop .3s both}
.choice .letter{flex:0 0 38px;height:38px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:20px;background:#ffe6f2}
.choice .ctext{flex:1;margin:0;font-size:clamp(18px,2.3vw,22px);line-height:1.5;font-weight:700;cursor:pointer}
.choice .btn{font-size:18px;padding:8px 16px;min-height:50px;white-space:nowrap}
.choice.tried{opacity:.5}.choice.tried .ctext{text-decoration:line-through}
@media (max-width:600px){.choice{flex-wrap:wrap}.choice .ctext{flex-basis:calc(100% - 120px)}.choice .btn{width:100%}}
.result{border:3px solid var(--ink);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s}
.result.wise{background:#d6f7cf}.result.ok{background:#fff1b8}.result.trap{background:#ffd3da}
.result h3{margin:0 0 4px;font-size:clamp(22px,3vw,28px);font-weight:900}
.result p{margin:0;font-size:clamp(18px,2.3vw,22px);line-height:1.55;font-weight:700}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.feel button{border:var(--b);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:8px 4px;font-weight:900;font-size:19px}
.feel button span{display:block;font-size:44px;line-height:1.15}
.feel button.yes{background:var(--grass)}.feel button.no{background:#ffd3da}
.tipcard{border:4px solid var(--ink);border-radius:22px;background:var(--sun);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s}
.tipcard h3{margin:0 0 4px;font-size:24px;font-weight:900}
.tipcard p{margin:0;font-size:clamp(19px,2.5vw,24px);line-height:1.55;font-weight:700}
.newtool{margin-top:12px;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:900;font-size:20px;animation:pop .4s .2s both}
.newtool > span{font-size:40px}

.mg-title{font-weight:900!important}
.breath{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.bball{width:170px;height:170px;border-radius:50%;border:5px solid var(--ink);background:radial-gradient(circle at 40% 35%,#fff0f7,#ff9fcd);
  display:grid;place-items:center;font-size:66px;cursor:pointer;touch-action:none;box-shadow:0 6px 0 var(--ink);transition:transform 3s ease-in-out}
.bball.in{transform:scale(1.32)}
.bball.out{transform:scale(1);transition-duration:3.5s;background:radial-gradient(circle at 40% 35%,#fff9e0,#ffd23f)}
.bmsg{margin:0;font-size:clamp(20px,2.6vw,24px);font-weight:900;text-align:center;min-height:1.5em}
.bdots{font-size:26px;letter-spacing:8px}
.thought{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:20px;padding:10px 12px;margin-top:10px;background:var(--storm);color:#fff;transition:background .5s,color .5s}
.thought p{flex:1;margin:0;font-size:clamp(18px,2.3vw,22px);font-weight:700;line-height:1.45}
.thought .tag{font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;background:#fff;color:var(--ink);white-space:nowrap}
.thought.flip{background:#fff3b0;color:var(--ink)}
.thought.flip .tag{background:var(--grass)}
.thought .btn{font-size:17px;padding:6px 14px;min-height:48px;white-space:nowrap}
@media (max-width:600px){.thought{flex-wrap:wrap}.thought .btn{width:100%}}
.sortcard{margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .3s}
.sortcard p{margin:0;flex:1;font-size:clamp(20px,2.6vw,25px);font-weight:900;line-height:1.45}
.prog{font-weight:900;font-size:16px;opacity:.7;margin-top:10px}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sortbtns button{border:var(--b);border-radius:20px;box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:clamp(18px,2.4vw,22px);padding:12px 6px;cursor:pointer;background:#fff}
.sortbtns button span{display:block;font-size:36px}
.sortbtns button.no{background:#ffd3da}.sortbtns button.yes{background:var(--grass)}
.fb{margin-top:12px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.toolbtn{border:var(--b);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:10px 6px;font-weight:900;font-size:18px;cursor:pointer}
.toolbtn span{display:block;font-size:36px;line-height:1.2}
.toolbtn.no{background:#ffd3da;opacity:.75}.toolbtn.yes{background:var(--grass)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.scard{border:var(--b);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:10px 6px;font-weight:900;font-size:clamp(16px,2.1vw,19px);cursor:pointer;line-height:1.3}
.scard span{display:block;font-size:32px}
.scard.on{background:var(--sun);transform:translateY(-3px)}

#toast{position:fixed;z-index:18;left:50%;top:calc(116px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;width:min(620px,92vw)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-in{display:flex;gap:12px;align-items:center;background:#fff;border:var(--b);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 12px}
.toast-in .tf{flex:0 0 46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.toast-in div{flex:1}.toast-in b{font-size:17px}.toast-in p{margin:2px 0 0;font-size:19px;font-weight:700;line-height:1.45}
.fly{position:fixed;z-index:30;font-weight:900;font-size:40px;color:var(--heart);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  pointer-events:none;animation:rise 1.6s ease-out forwards;left:50%;top:40%;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}

.bookhead{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bookhead h2{margin:0;font-size:clamp(26px,3.6vw,34px);font-weight:900}
.xbtn{width:52px;height:52px;border-radius:50%;border:var(--b);background:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.item .ic{flex:0 0 48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:#ffe6f2;display:grid;place-items:center;font-size:26px}
.item div{flex:1}.item b{font-size:19px}.item p{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.5}
.item.locked{background:#eee;color:#888}.item.locked .ic{filter:grayscale(1);opacity:.5}
.sec{margin:18px 0 0;font-size:22px;font-weight:900}
.cert{margin-top:16px;border:5px double var(--ink);border-radius:24px;background:#fff;padding:18px;text-align:center}
.cert h2{margin:0;font-size:clamp(26px,4vw,38px);font-weight:900;color:var(--heart);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.cert .tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.cert .tags span{background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:18px}
.cert .icons{font-size:30px;margin-top:10px;letter-spacing:4px}
.endtxt{display:flex;gap:12px;align-items:flex-start;margin-top:16px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px}
.endtxt p{margin:0;font-size:clamp(18px,2.4vw,22px);line-height:1.6;font-weight:700}
.btnrow{display:flex;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap}
#nothree{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#aee3ff;padding:20px;text-align:center;font-size:22px;font-weight:900}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="energy"><span id="weather">⛅</span><span>心靈能量</span><div class="ebar"><div id="efill"></div></div></div>
    <div id="tslots"></div>
  </div>
  <div class="hud-r">
    <button class="hbtn" id="bBag" aria-label="法寶袋"><span>🧰</span><small>法寶袋</small></button>
    <button class="hbtn" id="bAuto" aria-label="自動讀出"><span>🗣️</span><small>自動讀：開</small></button>
    <button class="hbtn" id="bHelp" aria-label="玩法"><span>❓</span><small>玩法</small></button>
  </div>
</div>
<div id="hintbar" class="hidden"></div>
<div id="toast"></div>
<div id="dlg"></div>

<section id="sStart" class="screen"><div class="panel" id="startPanel"></div></section>
<section id="sPick" class="screen hidden"><div class="panel" id="pickPanel"></div></section>
<section id="sBag" class="screen hidden"><div class="panel" id="bagPanel"></div></section>
<section id="sEnd" class="screen hidden"><div class="panel" id="endPanel"></div></section>
<div id="nothree">載入唔到 3D 遊戲引擎。請確認部機已經連接互聯網，然後重新開啟呢個檔案。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){ return document.querySelector(s); };
var $$=function(s,root){ return Array.prototype.slice.call((root||document).querySelectorAll(s)); };
if(!window.THREE){ $('#nothree').style.display='flex'; return; }
var PI=Math.PI, V3=THREE.Vector3;
var EPISODE1='校園智慧小偵探.html';

/* =====================================================================
   角色 / 法寶 / 劇本
   ===================================================================== */
var PEOPLE={
  narr:{name:'旁白',face:'📖',color:'#2b2340',pitch:1.0,rate:0.95},
  you:{name:'你',face:'💗',color:'#ff6fae',pitch:1.25},

function setMood(k,m){
  var P=k.userData.parts; k.userData.anim.mood=m;
  if(m==='sad'){ P.mouth.rotation.z=0; P.mouth.position.y=-0.2; P.mouth.scale.set(1,1,1); }
  else if(m==='neutral'){ P.mouth.rotation.z=PI; P.mouth.position.y=-0.08; P.mouth.scale.set(0.8,0.35,1); }
  else { P.mouth.rotation.z=PI; P.mouth.position.y=-0.06; P.mouth.scale.set(1,1,1); }
}
function faceTo(k,pt){ k.userData.anim.ry=Math.atan2(pt.x-k.position.x,pt.z-k.position.z); }
function lerpAngle(a,b,t){ var d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI; return a+d*t; }
function animKid(k,dt,t){
  var P=k.userData.parts,a=k.userData.anim;
  k.rotation.y=lerpAngle(k.rotation.y,a.ry,Math.min(1,dt*8));
  if(a.walking){ a.phase+=dt*11; var s=Math.sin(a.phase)*0.65; P.legL.rotation.x=s; P.legR.rotation.x=-s; P.armL.rotation.x=-s*0.8; P.armR.rotation.x=s*0.8; k.position.y=Math.abs(Math.sin(a.phase))*0.06; }
  else { P.legL.rotation.x*=0.8; P.legR.rotation.x*=0.8; P.armL.rotation.x*=0.8; P.armR.rotation.x*=0.8; k.position.y=0; }
  if(a.cheer>0){ a.cheer-=dt; k.position.y=Math.abs(Math.sin(a.cheer*9))*0.55; P.armL.rotation.z=-2.6; P.armR.rotation.z=2.6; }
  else { P.armL.rotation.z+=(-0.15-P.armL.rotation.z)*Math.min(1,dt*8); P.armR.rotation.z+=(0.15-P.armR.rotation.z)*Math.min(1,dt*8); }
  var hx=a.mood==='sad'?0.3:0; if(a.talk>0){ a.talk-=dt; hx+=Math.sin(t*12)*0.07; }
  P.head.rotation.x+=(hx-P.head.rotation.x)*Math.min(1,dt*8);
  P.head.rotation.z=Math.sin(t*1.6+a.seed)*0.05; P.head.position.y=1.74+Math.sin(t*2.2+a.seed)*0.015;
}

/* ---------- 對話框 ---------- */
function openDialog(ch){
  state.dialog=true; state.target=null; state.pending=null; $('#hintbar').classList.add('hidden'); hideToast();
  if(player) player.userData.anim.walking=false;
  state.focusDir=null;
  if(ch && player){
    var np=ch.cast.k.position, pp=player.position; state.focus=new V3((pp.x+np.x)/2,0.3,(pp.z+np.z)/2); faceTo(player,np); faceTo(ch.cast.k,pp);
    // 鏡頭喺兩個人側邊，兩個人都睇得到
    var dx=np.x-pp.x, dz=np.z-pp.z, dl=Math.hypot(dx,dz)||1, fd=new V3(-dz/dl,0,dx/dl), mr=Math.hypot(state.focus.x,state.focus.z)||1;
    if(fd.x*(-state.focus.x/mr)+fd.z*(-state.focus.z/mr)<0) fd.negate();
    state.focusDir=fd;
  }
  else if(player){ state.focus=new V3(player.position.x,0.3,player.position.z); }
  dlg.classList.add('show');
}
function closeDialog(){
  state.dialog=false; state.focus=null; state.breath=null; state.nearCool=1.5;

function whoTag(who){ var p=PEOPLE[who]||PEOPLE.narr; return '<div class="who" style="--c:'+p.color+'"><span class="face">'+p.face+'</span><span>'+(p.name||who)+'</span></div>'; }
function showLine(line,onNext,label){

}
function playLines(lines,done){ var i=0; (function step(){ if(i>=lines.length){ done(); return; } var l=lines[i++]; showLine(l,step,i>=lines.length?'繼續 ▶':'下一句 ▶'); })(); }
function nextRow(label,cls){ return '<div class="row"><button class="btn '+(cls||'primary')+'" id="dNext">'+label+'</button></div>'; }

/* ---------- 關卡流程 ---------- */
function startChapter(ch){
  openDialog(ch); SFX.pop();
  ch.tried=[]; ch.order=[0,1,2].sort(function(){ return Math.random()-0.5; });
  runSteps(ch,0);
}
function runSteps(ch,i){
  if(i>=ch.steps.length) return;
  var st=ch.steps[i], next=function(){ runSteps(ch,i+1); };
  switch(st.t){
    case 'lines': playLines(st.lines,next); break;
    case 'arrows': fireWords(arrowOrigin(st.from),st.words,'hit'); ch.lastArrows=st; next(); break;
    case 'breathe': runBreathe(st.rounds,next); break;
    case 'reframe': runReframe(st.list,next); break;
    case 'feel': runFeel(st,next); break;
    case 'sort': runSort(st,next); break;
    case 'toolpick': runToolPick(st,next); break;
    case 'choice': showChoices(ch,next); break;
    case 'tip': showTip(ch); break;
  }
}

function pickChoice(ch,ci,next){

function showResult(ch,c,next){
  var head={wise:'💗 內心好強大！',ok:'🙂 都唔錯，不過……',trap:'⛈️ 俾情緒捉住咗！'}[c.g];

/* 深呼吸：按住吸氣、放手呼氣 */
function runBreathe(rounds,next){
  var r=0, phase='ready', timer=null;
  var intro='深呼吸：聞花、吹蠟燭。按住個大波波，好似聞花咁慢慢吸氣。見到蠟燭就放手，好似吹蠟燭咁慢慢呼氣。'+(rounds>1?'一共做'+rounds+'次。':'做一次就得。');
  dlg.innerHTML=whoTag('narr')+'<div class="card"><div class="line">'+sayBtn(intro,'narr')+'<p class="mg-title">🌸 深呼吸：聞花、吹蠟燭</p></div>'+
    '<div class="breath"><div class="bball" id="bball" role="button" aria-label="按住吸氣"><span id="bicon">🌸</span></div><p class="bmsg" id="bmsg">👇 按住個波波，慢慢吸氣</p><div class="bdots" id="bdots"></div></div><div id="bNextWrap"></div></div>';
  var ball=$('#bball'), icon=$('#bicon');
  var msg=function(t,speak){ $('#bmsg').textContent=t; if(speak&&Speech.auto) Speech.speak(speak,'narr'); };
  var dots=function(){ var s=''; for(var i=0;i<rounds;i++) s+=i<r?'💗':'⚪'; $('#bdots').textContent=s; };
  dots(); autoSay(intro,'narr',dlg);
  var press=function(e){
    if(e&&e.preventDefault) e.preventDefault(); if(phase!=='ready') return;
    SFX.init(); phase='in'; ball.classList.remove('out'); ball.classList.add('in'); icon.textContent='🌸'; state.breath='in';
    msg('吸氣……聞下朵花 🌸（繼續按住）','慢慢吸氣，聞下朵花。'); SFX.breathIn();
    timer=setTimeout(function(){ phase='full'; icon.textContent='🕯️'; msg('好！放手，慢慢吹蠟燭 🕯️','放手，慢慢呼氣，吹熄蠟燭。'); SFX.ding(); },3000);
  };
  var release=function(){
    if(phase==='in'){ clearTimeout(timer); phase='ready'; ball.classList.remove('in'); state.breath=null; msg('再慢啲、長啲，按住多一陣先放手。','再慢啲，按住多一陣先放手。'); return; }
    if(phase!=='full') return;
    phase='out'; ball.classList.remove('in'); ball.classList.add('out'); state.breath='out'; msg('呼……慢慢吹熄蠟燭'); SFX.breathOut();
    setTimeout(function(){
      r++; dots(); changeEnergy(6); state.breath=null; if(player) burst(player.position.clone().add(new V3(0,1.5,0)),0xff9fcd,14);
      if(r>=rounds){
        phase='done'; ball.classList.remove('out'); icon.textContent='😌'; msg('做得好！你嘅身體冷靜返喇。','做得好！你嘅身體冷靜返喇。'); SFX.good();
        $('#bNextWrap').innerHTML=nextRow('繼續 ▶'); $('#dNext').onclick=function(){ SFX.tap(); next(); };
      } else { phase='ready'; ball.classList.remove('out'); icon.textContent='🌸'; msg('第 '+(r+1)+' 次：再按住，慢慢吸氣','第'+(r+1)+'次，再按住，慢慢吸氣。'); }
    },3500);
  };
  ball.addEventListener('pointerdown',press);
  ball.addEventListener('pointerup',release);
  ball.addEventListener('pointercancel',release);
  ball.addEventListener('pointerleave',release);
  ball.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ball._press=press; ball._release=release;
}

function finishGame(){
  state.finaleCam=false; state.finished=true; state.energy=100; renderHud(); closeDialog(); refreshWorld();
  rainbow.position.z = player.position.z>0 ? -30 : 30; rainbow.rotation.y = player.position.z>0 ? 0 : PI;
  rainbow.visible=true; confetti(player.position,180); SFX.good(); setTimeout(function(){ SFX.magic(); },600);
  setTimeout(showEnd,2200);
}
function showEnd(){
  state.modal=true;
  var ideasText=IDEAS.map(function(d){ return d[1]+'。'+d[2]; }).join('');
  var text='恭喜你！你成為咗心靈小勇士！你收集齊八件心靈法寶：'+TOOLS.map(function(t){ return t.name; }).join('、')+'。記住四句說話：'+ideasText+'強大嘅內心唔係冇感覺，而係有感覺都可以揀點樣做。你本身已經好珍貴！';
  $('#endPanel').innerHTML='<h1 class="title" style="font-size:clamp(34px,6vw,56px)">心靈小勇士！</h1>'+
    '<div class="cert"><h2>🏅 心靈小勇士證書</h2><div class="icons">'+TOOLS.map(function(t){ return t.icon; }).join('')+'</div>'+
    '<div class="tags">'+state.strengths.map(function(s){ return '<span>'+s[0]+' '+s[1]+'</span>'; }).join('')+'</div></div>'+
    '<div class="endtxt">'+sayBtn(text,'narr')+'<p>🌈 你令心靈島重見彩虹！記住：強大嘅內心唔係冇感覺，而係有感覺都可以揀點樣做。你本身已經好珍貴！</p></div>'+
    '<div class="btnrow"><button class="btn" id="eBag">🧰 睇法寶袋</button><button class="btn primary" id="eAgain">🔄 再玩一次</button><button class="btn go" id="eEp1">🔍 玩第一集</button></div>';
  $('#sEnd').classList.remove('hidden');
  autoSay(text,'narr',$('#endPanel .endtxt'));
  $('#eBag').onclick=function(){ SFX.tap(); $('#sEnd').classList.add('hidden'); openBag(); };
  $('#eAgain').onclick=function(){ SFX.tap(); resetGame(); };
  $('#eEp1').onclick=function(){ Speech.stop(); window.location.href=EPISODE1; };
}
function resetGame(){
  Speech.stop();
  state.chapter=0; state.tools=[]; state.energy=70; state.finished=false; state.firstChoice=true; state.modal=false; state.strengths=[];
  strengthOrbs.forEach(function(o){ scene.remove(o); }); strengthOrbs=[];
  rainbow.visible=false; $('#sEnd').classList.add('hidden'); $('#sBag').classList.add('hidden');
  CAST.forEach(function(c){ setMood(c.k,'happy'); c.k.userData.anim.ry=c.homeRy; });
  player.position.set(1.1,0,9); state.target=null; state.pending=null;
  renderHud(); refreshWorld(); showHintBar();
  toast('narr','新一輪冒險開始！心靈島嘅天空又有啲烏雲，出發啦！');
}

/* 法寶袋 */
function openBag(){
  state.modal=true;
  var intro='法寶袋。呢度有你收集咗嘅心靈法寶，同埋四句要記住嘅說話。唔開心嘅時候，隨時都可以喺度練習深呼吸。';
  var tools=TOOLS.map(function(t){
    var on=state.tools.indexOf(t.id)>=0;
    return '<div class="item'+(on?'':' locked')+'"><span class="ic">'+t.icon+'</span><div><b>'+(on?t.name:'未收集')+'</b><p>'+(on?esc(t.desc):'完成挑戰就可以收集呢件法寶。')+'</p></div>'+(on?sayBtn(t.name+'。'+t.desc,'narr','sm'):'')+'</div>';
  }).join('');
  var ideas=IDEAS.map(function(d){ return '<div class="item"><span class="ic">'+d[0]+'</span><div><b>'+d[1]+'</b><p>'+d[2]+'</p></div>'+sayBtn(d[1]+'。'+d[2],'narr','sm')+'</div>'; }).join('');
  var canPractice=state.tools.indexOf('breath')>=0 && state.started && !state.finished;
  $('#bagPanel').innerHTML='<div class="bookhead">'+sayBtn(intro,'narr')+'<h2>🧰 法寶袋</h2><button class="xbtn" id="bClose" aria-label="關閉">✕</button></div>'+
    (canPractice?'<div class="row" style="justify-content:flex-start"><button class="btn pink" id="bPractice">🌸 而家練習深呼吸</button></div>':'')+
    '<p class="sec">我嘅法寶</p><div class="list">'+tools+'</div><p class="sec">要記住嘅四句說話</p><div class="list">'+ideas+'</div>';
  $('#sBag').classList.remove('hidden');
  autoSay(intro,'narr',$('#bagPanel .bookhead'));
  $('#bClose').onclick=function(){ SFX.tap(); Speech.stop(); $('#sBag').classList.add('hidden'); state.modal=false; if(state.finished) $('#sEnd').classList.remove('hidden'), state.modal=true; };
  var pr=$('#bPractice'); if(pr) pr.onclick=function(){ SFX.tap(); $('#sBag').classList.add('hidden'); state.modal=false; openDialog(null); runBreathe(3,closeDialog); };
}

/* toast */
var toastTimer=null;
function toast(who,text){
  var p=PEOPLE[who]||PEOPLE.narr, el=$('#toast');
  el.innerHTML='<div class="toast-in"><span class="tf" style="background:'+p.color+'">'+p.face+'</span><div><b>'+(p.name||who)+'</b><p>'+esc(text)+'</p></div>'+sayBtn(text,who,'sm')+'</div>';
  el.classList.add('show'); autoSay(text,who,el);
  var k=kidByName(who); if(k) k.userData.anim.talk=1.6;
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,Math.max(5000,text.length*260));
}
function hideToast(){ $('#toast').classList.remove('show'); }

/* HUD 按鈕 */
$('#bBag').onclick=function(){ if(state.dialog) return; SFX.tap(); openBag(); };
$('#bAuto').onclick=function(){ Speech.auto=!Speech.auto; $('#bAuto small').textContent='自動讀：'+(Speech.auto?'開':'關'); SFX.tap(); Speech.speak(Speech.auto?'自動讀出已經開咗。每句說話都會自動讀出嚟。':'自動讀出已經關咗。想聽嘅話，可以撳小喇叭。','narr'); };
$('#bHelp').onclick=function(){ if(state.dialog||state.modal) return; SFX.tap(); openDialog(null); playLines(TUTORIAL,closeDialog); };

/* =====================================================================
   點擊 / 移動
   ===================================================================== */
var raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2(), downPt=null;
canvas.addEventListener('pointerdown',function(e){ downPt={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup',function(e){ if(!downPt) return; var d=Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y); downPt=null; if(d>14) return; handleTap(e.clientX,e.clientY); });
function isShown(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
function approach(np){
  var dir=new V3(player.position.x-np.x,0,player.position.z-np.z); if(dir.length()<0.1) dir.set(-np.x,0,-np.z); dir.normalize();
  return np.clone().add(dir.multiplyScalar(1.9));
}
function handleTap(x,y){
  if(!state.started||state.dialog||state.modal||!player) return;
  SFX.init();
  ndc.set(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1); raycaster.setFromCamera(ndc,camera);
  var hits=raycaster.intersectObjects(pickables,false).filter(function(h){ return h.object.userData.ground||(h.object.userData.tree?heartTree.visible:isShown(h.object.parent)); });
  if(!hits.length) return;
  var h=hits[0], ud=h.object.userData;
  if(ud.cast){
    var c=ud.cast;
    if(c.chapter!==undefined){
      if(c.chapter===state.chapter){ moveTo(approach(c.k.position),CHAPTERS[c.chapter]); SFX.tap(); return; }
      if(c.chapter<state.chapter){ faceTo(c.k,player.position); toast(c.name,CHAPTERS[c.chapter].thanks); return; }
      toast('narr','呢度嘅挑戰遲啲先開始。先去有黃色光柱嘅地方吖！'); return;
    }
    faceTo(c.k,player.position);
    if(c.talk) toast(c.name,state.chapter>c.link?c.talk[1]:c.talk[0]);
    SFX.tap(); return;
  }
  if(ud.tree){
    if(!state.finished && state.chapter>=CHAPTERS.length){ moveTo(treeSpot(),'tree'); SFX.tap(); return; }
    toast('narr', state.finished?'心靈之樹開滿咗花，好似你嘅心一樣，又強大又溫暖。':'心靈之樹：每收集一件法寶，就會開一朵花。而家已經開咗'+state.tools.length+'朵。'); return;
  }
  if(ud.ground){ moveTo(h.point.clone(),null); ring.position.set(h.point.x,0.05,h.point.z); ringT=0.6; SFX.tap(); }
}
function treeSpot(){ var dp=new V3(player.position.x,0,player.position.z); if(dp.length()<0.1) dp.set(0,0,1); return dp.normalize().multiplyScalar(4.2); }
function clampPos(p){ var r=Math.hypot(p.x,p.z), max=ISLAND_R-2.5; if(r>max){ p.x*=max/r; p.z*=max/r; } var r2=Math.hypot(p.x,p.z); if(r2<3.2){ var k=3.2/Math.max(0.01,r2); p.x*=k; p.z*=k; } p.y=0; return p; }
function moveTo(p,target){ state.target=clampPos(p); state.pending=target; }
window.addEventListener('keydown',function(e){
  state.keys[e.key.toLowerCase()]=true;
  if(e.key==='Enter'&&state.dialog){ var n=$('#dNext'); if(n&&!n.disabled&&!n.classList.contains('hidden')){ e.preventDefault(); n.click(); } }
});
window.addEventListener('keyup',function(e){ state.keys[e.key.toLowerCase()]=false; });

/* 行近挑戰點就自動開始 */
function checkNearby(dt){
  if(state.nearCool>0){ state.nearCool-=dt; return; }
  if(!player||state.dialog||state.modal||state.finished) return;
  var cur=currentTarget(), pp=player.position;
  if(cur){ var np=cur.cast.k.position; if(Math.hypot(pp.x-np.x,pp.z-np.z)<2.6){ state.target=null; state.pending=null; startChapter(cur); } }
  else if(Math.hypot(pp.x,pp.z)<5){ state.target=null; state.pending=null; startFinale(); }
}

/* =====================================================================
   主迴圈
   ===================================================================== */
var camPos=new V3(0,20,40), camLook=new V3(0,2,0), clock=new THREE.Clock(), camDir=new V3(-0.3,0,-0.95).normalize(), camWant=new V3();
function update(dt,t){
  if(player&&state.started){
    var a=player.userData.anim, K=state.keys, kx=0, kz=0;
    if(!state.dialog&&!state.modal){ if(K['arrowleft']||K['a']) kx-=1; if(K['arrowright']||K['d']) kx+=1; if(K['arrowup']||K['w']) kz-=1; if(K['arrowdown']||K['s']) kz+=1; }
    if(kx||kz){
      state.target=null; state.pending=null;
      var fx=-camDir.x, fz=-camDir.z, mx=-fz*kx+fx*(-kz), mz=fx*kx+fz*(-kz), len=Math.hypot(mx,mz)||1;
      player.position.x+=mx/len*5.5*dt; player.position.z+=mz/len*5.5*dt; clampPos(player.position); a.ry=Math.atan2(mx,mz); a.walking=true;
    }
    else if(state.target){
      var dx=state.target.x-player.position.x, dz=state.target.z-player.position.z, dist=Math.hypot(dx,dz);
      if(dist>0.08){ var step=Math.min(dist,5.5*dt); player.position.x+=dx/dist*step; player.position.z+=dz/dist*step; a.ry=Math.atan2(dx,dz); a.walking=true; }
      else { state.target=null; a.walking=false; if(state.pending){ var pd=state.pending; state.pending=null; if(pd==='tree') startFinale(); else startChapter(pd); } }
    } else a.walking=false;
    checkNearby(dt);
    animKid(player,dt,t);
    var su=shield.userData, w=state.eShow/100;
    var bs=state.breath==='in'?1.35:1; su.scale+=(bs-su.scale)*Math.min(1,dt*(state.breath==='in'?1:0.9));
    shield.scale.setScalar(su.scale*(1+Math.sin(t*2)*0.02));
    shield.material.opacity=0.08+0.22*w+(su.flash>0?su.flash*0.5:0);
    if(su.flash>0){ su.flash-=dt; shield.material.emissive.copy(su.flashCol); } else shield.material.emissive.copy(su.base);
    shield.material.emissiveIntensity=0.2+0.5*w;
    var ss=Math.max(0,Math.min(1,(52-state.eShow)/30));
    storm.visible=ss>0.03; storm.position.set(player.position.x,4.7+Math.sin(t*1.5)*0.1,player.position.z); storm.scale.setScalar(0.35+ss*0.75);
  }
  // 心靈能量 → 天氣
  var goal=state.started?state.energy:100;
  state.eShow+=(goal-state.eShow)*Math.min(1,dt*1.5);
  var w2=state.eShow/100;
  skyCol.copy(SKY_LOW).lerp(SKY_HIGH,w2); scene.fog.color.copy(skyCol);
  hemi.intensity=0.45+0.35*w2; sun.intensity=0.3+0.6*w2;
  cloudMat.color.setRGB(0.55+0.45*w2,0.55+0.45*w2,0.6+0.4*w2);
  rain.visible=state.eShow<38;
  if(rain.visible){ var arr=rainGeo.attributes.position.array; for(var i=0;i<RAIN_N;i++){ arr[i*3+1]-=dt*16; if(arr[i*3+1]<0) arr[i*3+1]=18+Math.random()*4; } rainGeo.attributes.position.needsUpdate=true; }
  CAST.forEach(function(c){ if(c.k.visible) animKid(c.k,dt,t); c.marker.position.y=(c.kid.adult?2.6:3.3)+Math.sin(t*3)*0.1; });
  beacon.material.opacity=0.18+Math.sin(t*3)*0.07; beacon.rotation.y+=dt*0.5;
  treeMarker.position.y=9.6+Math.sin(t*3)*0.15;
  buds.forEach(function(b){ var tg=b.userData.target||0.6; b.scale.setScalar(b.scale.x+(tg-b.scale.x)*Math.min(1,dt*3)); });
  canopyMat.emissiveIntensity=0.05+state.tools.length/8*0.35; treeHalo.material.opacity=state.finished?0.12+Math.sin(t*2)*0.04:0;
  // 話語箭
  for(var j=ARROWS.length-1;j>=0;j--){
    var A=ARROWS[j]; A.t+=dt; if(A.t<0) continue; A.sp.visible=true;
    var to=player?player.position.clone().add(new V3(0,1.3,0)):A.from, p=Math.min(1,A.t/A.dur);
    if(A.mode==='hit'){
      A.sp.position.copy(A.from).lerp(to,p); A.sp.position.y+=Math.sin(p*PI)*1.2;
      if(p>=1){ shieldFlash(false); changeEnergy(-A.dmg); SFX.hit(); burst(A.sp.position.clone(),0x3d2b4f,10); scene.remove(A.sp); ARROWS.splice(j,1); }
    } else {
      if(p<0.6){ var q=p/0.6, stop=A.from.clone().lerp(to,0.82); A.sp.position.copy(A.from).lerp(stop,q); A.sp.position.y+=Math.sin(q*PI)*1.0; }
      else if(!A.bounced){ A.bounced=true; shieldFlash(true); SFX.ding(); burst(A.sp.position.clone(),0xffd23f,14); A.back=A.from.clone().sub(A.sp.position).normalize(); }
      else { A.sp.position.addScaledVector(A.back,dt*9); A.sp.position.y+=dt*4; A.sp.material.opacity=Math.max(0,1-(p-0.6)/0.4); }
      if(p>=1){ scene.remove(A.sp); ARROWS.splice(j,1); }
    }
  }
  // 思想雲
  thoughts.forEach(function(th,i){ if(th.done||!player) return; th.a+=dt*0.5; th.sp.position.set(player.position.x+Math.sin(th.a)*2.2,3.4+Math.sin(t*2+i)*0.2+(i%2)*0.5,player.position.z+Math.cos(th.a)*1.2); });
  // 控制圈
  var cOn=circleRing.userData.on&&player; circleRing.material.opacity+=((cOn?0.9:0)-circleRing.material.opacity)*Math.min(1,dt*4);
  if(player){ circleRing.position.x=player.position.x; circleRing.position.z=player.position.z; }
  for(var o=orbs.length-1;o>=0;o--){ var ob=orbs[o]; ob.t+=dt;
    if(ob.inside){ ob.m.position.y=Math.max(0.3,4-ob.t*5); }
    else { ob.m.position.y=4+ob.t*3; ob.m.position.x+=Math.sin(ob.a)*dt*2; ob.m.material.opacity=Math.max(0,1-ob.t/2); if(ob.t>2){ scene.remove(ob.m); orbs.splice(o,1); } }
  }
  strengthOrbs.forEach(function(l){ if(!player) return; l.userData.a+=dt*0.8; l.position.set(player.position.x+Math.sin(l.userData.a)*2.2,2.6+Math.sin(t*2+l.userData.a)*0.2,player.position.z+Math.cos(l.userData.a)*2.2); });
  for(var i2=FX.length-1;i2>=0;i2--){ var f=FX[i2]; f.life-=dt; f.v.y-=f.g*dt; f.v.multiplyScalar(f.drag); f.m.position.addScaledVector(f.v,dt); f.m.rotation.x+=dt*(f.spin?4:6); f.m.rotation.y+=dt*3; f.m.material.opacity=Math.min(1,f.life/f.max*2); if(f.life<=0){ scene.remove(f.m); f.m.material.dispose(); FX.splice(i2,1); } }
  if(ringT>0){ ringT-=dt; var rs=1+(0.6-ringT)*1.8; ring.scale.set(rs,rs,rs); ring.material.opacity=Math.max(0,ringT/0.6); }
  clouds.forEach(function(c){ c.position.x+=c.userData.v*dt; if(c.position.x>70) c.position.x=-70; });
  // 鏡頭
  var look,pos,port=camera.aspect<0.85;
  if(player){ var pr=Math.hypot(player.position.x,player.position.z); if(pr>4.5){ var sg=(state.chapter>=CHAPTERS.length&&!state.finished)?1:-1; camWant.set(sg*player.position.x/pr,0,sg*player.position.z/pr); camDir.lerp(camWant,Math.min(1,dt*1.2)).normalize(); } }
  if(!state.started){ var ang=t*0.06; look=new V3(0,2,0); pos=new V3(Math.sin(ang)*38,20,Math.cos(ang)*38); }
  else if(state.focus&&state.finaleCam){ look=state.focus.clone(); pos=look.clone().addScaledVector(camDir,port?-15:-12); pos.y+=port?6:4.5; }
  else if(state.focus){ look=state.focus.clone(); pos=look.clone().addScaledVector(state.focusDir||camDir,port?11.8:8.6); pos.y+=port?4.9:3.8; }
  else if(state.finished){ var sz=player.position.z>0?1:-1; pos=new V3(0,14,30*sz); look=new V3(0,5,0); }
  else if(state.chapter>=CHAPTERS.length){ look=player.position.clone().add(new V3(0,1,0)).lerp(new V3(0,4,0),0.4); pos=look.clone().addScaledVector(camDir,port?18:15); pos.y+=port?11:8; }
  else { look=player.position.clone().add(new V3(0,1,0)); pos=look.clone().addScaledVector(camDir,port?16:12.5); pos.y+=port?15:11; }
  var kk=1-Math.exp(-dt*(state.started?3.2:1.2)); camPos.lerp(pos,kk); camLook.lerp(look,kk);
  camera.position.copy(camPos); camera.lookAt(camLook);
  // 鏡頭經過心靈之樹上面嘅時候，將棵樹變透明，唔會遮住畫面
  var cr=Math.hypot(camPos.x,camPos.z), want=(state.finaleCam||state.finished||!state.started)?1:Math.max(0,Math.min(1,(cr-4.5)/5));
  if(Math.abs(want-treeFade)>0.005){ treeFade+=(want-treeFade)*Math.min(1,dt*5); treeMats.forEach(function(m){ m.opacity=treeFade; m.depthWrite=treeFade>0.95; }); heartTree.visible=treeFade>0.04; }
}
function loop(){ requestAnimationFrame(loop); var dt=Math.min(0.05,clock.getDelta()); update(dt,clock.elapsedTime); renderer.render(scene,camera); }
function onResize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){ setTimeout(onResize,300); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) Speech.stop(); });

renderStart(); Speech.init(); refreshWorld(); loop();
})();
</script>
