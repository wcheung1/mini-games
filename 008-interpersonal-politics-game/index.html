<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>校園智慧小偵探 — 拆解人際陷阱大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2340; --paper:#fffbea; --sun:#ffd23f; --grass:#7ee081; --coral:#ff5d73;
  --teal:#2ec4b6; --sky:#bde7ff; --spy:#7b5cff;
  --b:4px solid var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:var(--ink)}
button:focus-visible{outline:4px dashed var(--spy);outline-offset:3px}

/* ---------- buttons ---------- */
.btn{font-weight:900;font-size:clamp(18px,2.3vw,23px);border:var(--b);border-radius:999px;padding:10px 24px;
  background:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-height:56px;
  transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.go{background:var(--grass)}
.btn.spy{background:var(--spy);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.spk{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:var(--b);background:var(--teal);
  font-size:25px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spk.sm{width:44px;height:44px;flex-basis:44px;font-size:20px;border-width:3px}
.spk.playing{background:var(--sun);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.13)}}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background:rgba(43,35,64,.28)}
.panel{background:var(--paper);border:var(--b);border-radius:30px;box-shadow:0 10px 0 var(--ink);
  width:min(760px,100%);max-height:100%;overflow:auto;padding:26px 26px 30px;position:relative;
  -webkit-overflow-scrolling:touch}
.title{margin:0;font-weight:900;font-size:clamp(40px,7vw,70px);line-height:1.05;letter-spacing:.02em;
  color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--ink);text-align:center}
.subtitle{text-align:center;margin:12px 0 0;font-size:clamp(19px,2.6vw,25px);font-weight:900}
.badge-strip{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.mchip{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--m);
  display:grid;place-items:center;font-size:18px;position:relative}
.mchip::before,.mchip::after{content:"";position:absolute;top:13px;width:8px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.mchip::before{left:8px}.mchip::after{right:8px}
.intro-row{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;margin-top:16px}
.intro-row p{margin:0;font-size:clamp(18px,2.3vw,21px);line-height:1.6;font-weight:700}
.voice{margin-top:14px;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;line-height:1.55;border:3px dashed var(--ink)}
.voice.good{background:#dcf9d6}.voice.bad{background:#ffe1e5}
.voice details{margin-top:6px}.voice summary{cursor:pointer;font-weight:900}
.voice ol{margin:6px 0 0;padding-left:22px}
.speed{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-weight:900;font-size:18px;flex-wrap:wrap}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;font-weight:900;font-size:18px;padding:8px 18px;cursor:pointer;min-height:46px}
.seg button.on{background:var(--sun)}
.cta{display:flex;justify-content:center;margin-top:20px}
.cta .btn{font-size:clamp(22px,3vw,28px);padding:14px 40px}
.fine{text-align:center;margin:14px 0 0;font-size:15px;font-weight:700;opacity:.75}

/* avatar select */
.pickhead{display:flex;gap:12px;align-items:center;justify-content:center}
.pickhead h2{margin:0;font-size:clamp(24px,3.4vw,32px);font-weight:900}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
@media (max-width:560px){.avgrid{grid-template-columns:repeat(2,1fr)}}
.avcard{background:#fff;border:var(--b);border-radius:22px;padding:14px 6px 12px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:center;transition:transform .12s}
.avcard.on{background:var(--sun);transform:translateY(-6px) rotate(-2deg)}
.avcard b{display:block;margin-top:8px;font-size:21px}
.av{width:86px;height:112px;position:relative;margin:0 auto}
.av .body{position:absolute;left:50%;bottom:4px;width:58px;height:50px;transform:translateX(-50%);background:var(--shirt);border:3px solid var(--ink);border-radius:24px 24px 12px 12px}
.av .head{position:absolute;left:50%;top:8px;width:58px;height:58px;transform:translateX(-50%);background:#ffd7b5;border:3px solid var(--ink);border-radius:50%;z-index:1}
.av .head::before,.av .head::after{content:"";position:absolute;top:26px;width:8px;height:10px;background:var(--ink);border-radius:50%}
.av .head::before{left:14px}.av .head::after{right:14px}
.av .hair{position:absolute;left:50%;top:4px;width:64px;height:28px;transform:translateX(-50%);background:var(--hair);border:3px solid var(--ink);border-radius:34px 34px 10px 10px;z-index:2}
.av.pony .hair::after{content:"";position:absolute;right:-18px;top:8px;width:20px;height:30px;background:var(--hair);border:3px solid var(--ink);border-radius:50%}
.av.bob .hair::before,.av.bob .hair::after{content:"";position:absolute;top:14px;width:14px;height:32px;background:var(--hair);border:3px solid var(--ink);border-radius:8px}
.av.bob .hair::before{left:-6px}.av.bob .hair::after{right:-6px}
.av.spiky .hair{border-radius:12px 12px 8px 8px;height:24px}
.av.spiky .hair::after{content:"";position:absolute;left:6px;right:6px;top:-12px;height:14px;background:
  linear-gradient(135deg,transparent 50%,var(--hair) 50%) 0 0/16px 14px repeat-x}

/* ---------- HUD ---------- */
#hud{position:fixed;z-index:15;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
#hud > *{pointer-events:auto}
.hud-l{background:var(--paper);border:var(--b);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;display:flex;align-items:center;gap:12px}
.stars{display:flex;align-items:center;gap:6px;font-weight:900;font-size:26px}
#dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--m);display:grid;place-items:center;font-size:13px;font-style:normal}
.dot.done{background:var(--sun)}
.dot.done::after{content:"★";font-size:15px;color:var(--ink)}
@media (max-width:620px){#dots{display:none}}
.hud-r{display:flex;gap:8px}
.hbtn{width:74px;border:var(--b);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.hbtn span{font-size:26px;line-height:1.1}
.hbtn small{font-size:13px;font-weight:900;white-space:nowrap}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hbtn.on{background:var(--spy);color:#fff}
@media (max-width:520px){.hbtn{width:60px}.hbtn small{font-size:11px}}

#hintbar{position:fixed;z-index:14;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;background:var(--paper);border:var(--b);border-radius:999px;box-shadow:0 5px 0 var(--ink);
  padding:6px 20px 6px 8px;font-weight:900;font-size:clamp(16px,2.1vw,20px);max-width:94vw}
#hintbar p{margin:0;line-height:1.35}

#vision{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,rgba(123,92,255,0) 52%,rgba(123,92,255,.42) 100%)}
body.glasses #vision{opacity:1}

/* ---------- dialog ---------- */
#dlg{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(940px,96vw);
  transform:translate(-50%,130%);transition:transform .38s cubic-bezier(.2,1.3,.4,1)}
#dlg.show{transform:translate(-50%,0)}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;border:var(--b);border-bottom:0;
  border-radius:18px 18px 0 0;padding:4px 18px 4px 8px;margin-left:24px;font-weight:900;font-size:21px}
.who .face{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;border:3px solid var(--ink)}
.card{background:var(--paper);border:var(--b);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px 18px 18px;
  max-height:min(64vh,640px);overflow:auto;-webkit-overflow-scrolling:touch}
.line{display:flex;gap:14px;align-items:flex-start;animation:pop .3s ease-out}
.line p{margin:4px 0 0;font-size:clamp(20px,2.7vw,27px);line-height:1.55;font-weight:700;flex:1}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
.q{font-weight:900!important}
.hint{margin-top:12px;background:var(--spy);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s}
.hint p{margin:2px 0 0;font-size:clamp(17px,2.2vw,21px);line-height:1.55;font-weight:700}
.hint b{color:var(--sun)}
.choice{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 12px;margin-top:12px;animation:pop .3s both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
.choice .letter{flex:0 0 38px;height:38px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:20px;background:var(--sky)}
.choice .ctext{flex:1;margin:0;font-size:clamp(18px,2.3vw,22px);line-height:1.5;font-weight:700;cursor:pointer}
.choice .btn{font-size:18px;padding:8px 16px;min-height:50px;white-space:nowrap}
.choice.tried{opacity:.5}
.choice.tried .ctext{text-decoration:line-through}
@media (max-width:600px){.choice{flex-wrap:wrap}.choice .ctext{flex-basis:calc(100% - 120px)}.choice .btn{width:100%}}
.result{border:3px solid var(--ink);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s}
.result.wise{background:#d6f7cf}.result.ok{background:#fff1b8}.result.trap{background:#ffd3da}
.result h3{margin:0 0 4px;font-size:clamp(22px,3vw,28px);font-weight:900}
.result p{margin:0;font-size:clamp(18px,2.3vw,22px);line-height:1.55;font-weight:700}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.feel button{border:var(--b);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:8px 4px;font-weight:900;font-size:19px}
.feel button span{display:block;font-size:44px;line-height:1.15}
.feel button.yes{background:var(--grass)}.feel button.no{background:#ffd3da}
.tipcard{border:4px solid var(--ink);border-radius:22px;background:var(--sun);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s}
.tipcard h3{margin:0 0 4px;font-size:24px;font-weight:900}
.tipcard p{margin:0;font-size:clamp(19px,2.5vw,24px);line-height:1.55;font-weight:700}

#toast{position:fixed;z-index:18;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;width:min(620px,92vw)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-in{display:flex;gap:12px;align-items:center;background:#fff;border:var(--b);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 12px}
.toast-in .tf{flex:0 0 46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.toast-in div{flex:1}.toast-in b{font-size:17px}.toast-in p{margin:2px 0 0;font-size:19px;font-weight:700;line-height:1.45}

.fly{position:fixed;z-index:30;font-weight:900;font-size:44px;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  pointer-events:none;animation:rise 1.6s ease-out forwards;left:50%;top:40%}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}

/* book & end */
.bookhead{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bookhead h2{margin:0;font-size:clamp(26px,3.6vw,34px);font-weight:900}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:600px){.rules{grid-template-columns:repeat(2,1fr)}}
.rule{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center}
.rule .big{font-size:34px;font-weight:900;display:block;line-height:1.2}
.rule p{margin:4px 0 8px;font-size:15px;font-weight:700;line-height:1.45}
.rule .spk{margin:0 auto}
.tips{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.tip{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.tip .m{flex:0 0 44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--m);display:grid;place-items:center;font-weight:900}
.tip div{flex:1}.tip b{font-size:18px}.tip p{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.5}
.tip.locked{background:#eee;color:#888}
.medal{width:150px;height:150px;margin:6px auto 0;border-radius:50%;border:6px solid var(--ink);display:grid;place-items:center;font-size:74px;box-shadow:0 8px 0 var(--ink);animation:spin 1.2s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
.endtxt{display:flex;gap:12px;align-items:flex-start;margin-top:18px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px}
.endtxt p{margin:0;font-size:clamp(19px,2.5vw,23px);line-height:1.6;font-weight:700}
.btnrow{display:flex;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap}
.xbtn{width:52px;height:52px;border-radius:50%;border:var(--b);background:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
#nothree{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:var(--sky);padding:20px;text-align:center;font-size:22px;font-weight:900}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vision"></div>

<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="stars"><span>⭐</span><b id="starN">0</b></div>
    <div id="dots"></div>
  </div>
  <div class="hud-r">
    <button class="hbtn" id="bGlass" aria-label="偵探眼鏡"><span>🕶️</span><small>偵探眼鏡</small></button>
    <button class="hbtn" id="bBook" aria-label="錦囊簿"><span>📒</span><small>錦囊簿</small></button>
    <button class="hbtn" id="bAuto" aria-label="自動讀出"><span>🗣️</span><small>自動讀：開</small></button>
    <button class="hbtn" id="bHelp" aria-label="玩法"><span>❓</span><small>玩法</small></button>
  </div>
</div>
<div id="hintbar" class="hidden"></div>
<div id="toast"></div>
<div id="dlg"></div>

<section id="sStart" class="screen"><div class="panel" id="startPanel"></div></section>
<section id="sPick" class="screen hidden"><div class="panel" id="pickPanel"></div></section>
<section id="sBook" class="screen hidden"><div class="panel" id="bookPanel"></div></section>
<section id="sEnd" class="screen hidden"><div class="panel" id="endPanel"></div></section>
<div id="nothree">載入唔到 3D 遊戲引擎。請確認部機已經連接互聯網，然後重新開啟呢個檔案。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

if(!window.THREE){ $('#nothree').style.display='flex'; return; }

  {name:'阿綠',css:'#2ec4b6',hairCss:'#1b1b1b',shirt:0x2ec4b6,hair:0x1b1b1b,style:'spiky',pants:0x34405a},
  {name:'阿橙',css:'#ff9f1c',hairCss:'#7a4a2a',shirt:0xff9f1c,hair:0x7a4a2a,style:'bob',pants:0x4a4e69}

var SCENES = [

function makeKid(o){

    return p;
  }
  P.legL=leg(-0.15); P.legR=leg(0.15);
  mesh(new THREE.CylinderGeometry(0.3,0.39,0.74,16),shirt,0,1.0,0,g);
  function arm(s){
    var p=new THREE.Group(); p.position.set(0.4*s,1.28,0); p.rotation.z=0.15*s; g.add(p);
    mesh(new THREE.CylinderGeometry(0.09,0.08,0.5,8),shirt,0,-0.25,0,p);
    var h=mesh(new THREE.SphereGeometry(0.1,10,8),skin,0,-0.54,0,p); p.userData.hand=h;
    return p;
  }
  P.armL=arm(-1); P.armR=arm(1);
  var head=new THREE.Group(); head.position.y=1.74; g.add(head); P.head=head;
  mesh(new THREE.SphereGeometry(0.42,22,16),skin,0,0,0,head);
  [-1,1].forEach(function(s){
    mesh(new THREE.SphereGeometry(0.062,10,8),ink,0.14*s,0.05,0.375,head,true);
    mesh(new THREE.SphereGeometry(0.022,6,6),new THREE.MeshBasicMaterial({color:0xffffff}),0.14*s+0.02,0.075,0.43,head,true);
    var ck=mesh(new THREE.SphereGeometry(0.07,10,8),new THREE.MeshBasicMaterial({color:0xff9aa2}),0.25*s,-0.08,0.32,head,true); ck.scale.z=0.4;
  });
  P.mouth=mesh(new THREE.TorusGeometry(0.085,0.022,6,14,PI),ink,0,-0.1,0.395,head,true);
  // 頭髮
  var cap=mesh(new THREE.SphereGeometry(0.45,22,12,0,PI*2,0,PI*0.5),hairM,0,0.04,-0.02,head);
  cap.rotation.x=-0.42;
  if(o.style==='bob'){
    var bob=mesh(new THREE.CylinderGeometry(0.46,0.49,0.5,20,1,true,PI*0.33,PI*1.34),mat(o.hair,{side:THREE.DoubleSide}),0,-0.1,0,head);
  } else if(o.style==='pony'){
    mesh(new THREE.SphereGeometry(0.15,10,8),hairM,0,0.12,-0.46,head);
    var tail=mesh(new THREE.SphereGeometry(0.14,10,8),hairM,0,-0.14,-0.52,head); tail.scale.y=1.7;
    mesh(new THREE.TorusGeometry(0.1,0.03,6,12),mat(0xffd23f),0,0.02,-0.5,head).rotation.x=PI/2;
  } else if(o.style==='spiky'){
    [[0,0.44,0.05,0],[0.2,0.38,0.05,-0.5],[-0.2,0.38,0.05,0.5],[0,0.36,-0.22,0],[0.1,0.42,-0.1,-0.3]].forEach(function(q){
      var c=mesh(new THREE.ConeGeometry(0.12,0.3,6),hairM,q[0],q[1],q[2],head); c.rotation.z=q[3]; c.rotation.x=q[2]<0?-0.5:0.2;
    });
  }
  // 隱形點擊範圍
  var hit=new THREE.Mesh(new THREE.CylinderGeometry(1,1,2.9,10),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y=1.45; g.add(hit); P.hit=hit;
  g.userData.parts=P;
  g.userData.anim={walking:false,phase:Math.random()*6,seed:Math.random()*10,ry:0,talk:0,cheer:0,mood:'happy'};
  setMood(g,'happy');
  return g;
}
function setMood(k,m){
  var P=k.userData.parts, a=k.userData.anim; a.mood=m;
  if(m==='sad'){ P.mouth.rotation.z=0; P.mouth.position.y=-0.2; P.mouth.scale.set(1,1,1); }
  else if(m==='neutral'){ P.mouth.rotation.z=PI; P.mouth.position.y=-0.08; P.mouth.scale.set(0.8,0.35,1); }
  else { P.mouth.rotation.z=PI; P.mouth.position.y=-0.06; P.mouth.scale.set(1,1,1); }
}
function faceTo(k,pt){ k.userData.anim.ry=Math.atan2(pt.x-k.position.x, pt.z-k.position.z); }
function lerpAngle(a,b,t){ var d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI; return a+d*t; }
function animKid(k,dt,t){
  var P=k.userData.parts, a=k.userData.anim;
  k.rotation.y=lerpAngle(k.rotation.y,a.ry,Math.min(1,dt*8));
  if(a.walking){
    a.phase+=dt*11; var s=Math.sin(a.phase)*0.65;
    P.legL.rotation.x=s; P.legR.rotation.x=-s; P.armL.rotation.x=-s*0.8; P.armR.rotation.x=a.holding?-1.1:s*0.8;
    k.position.y=Math.abs(Math.sin(a.phase))*0.06;
  } else {
    P.legL.rotation.x*=0.8; P.legR.rotation.x*=0.8; P.armL.rotation.x*=0.8;
    P.armR.rotation.x = a.holding ? -1.1 : P.armR.rotation.x*0.8;
    k.position.y=0;
  }
  var targetZ=0.15, sad=a.mood==='sad';
  if(a.cheer>0){
    a.cheer-=dt; var j=Math.abs(Math.sin(a.cheer*9));
    k.position.y=j*0.55; P.armL.rotation.z=-2.6; P.armR.rotation.z=2.6;
  } else {
    P.armL.rotation.z+=(-targetZ-P.armL.rotation.z)*Math.min(1,dt*8);
    P.armR.rotation.z+=(targetZ-P.armR.rotation.z)*Math.min(1,dt*8);
  }
  var hx = sad?0.3:0;
  if(a.talk>0){ a.talk-=dt; hx+=Math.sin(t*12)*0.07; }
  P.head.rotation.x+=(hx-P.head.rotation.x)*Math.min(1,dt*8);
  P.head.rotation.z=Math.sin(t*1.6+a.seed)*0.05;
  P.head.position.y=1.74+Math.sin(t*2.2+a.seed)*0.015;
}

var raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2(), downPt=null;
canvas.addEventListener('pointerdown',function(e){ downPt={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup',function(e){
  if(!downPt) return; var d=Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y); downPt=null;
  if(d>14) return; handleTap(e.clientX,e.clientY);
});
function handleTap(x,y){
  if(!state.started||state.dialog||state.modal||!player) return;
  SFX.init();
  ndc.set(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  var hits=raycaster.intersectObjects(pickables,false);
  if(!hits.length) return;
  var h=hits[0], ud=h.object.userData;
  if(ud.scene){
    var sc=ud.scene;
    if(sc.done){ faceTo(sc.kid3d,player.position); toast(sc.npc,sc.thanks); return; }
    var np=sc.kid3d.position, side=(player.position.x>=np.x)?1:-1;
    var tgt=new V3(np.x+side*1.7,0,np.z+0.35);
    if(Math.abs(tgt.x)>22.5) tgt.x=np.x-side*1.7;
    moveTo(tgt,sc); SFX.tap(); return;
  }
  if(ud.extra){
    var ex=ud.extra, linked=SCENES.filter(function(s){ return s.id===ex.link; })[0];
    faceTo(ex.kid3d,player.position);
    toast(ex.name, linked&&linked.done?ex.after:ex.before); SFX.tap(); return;
  }
  if(ud.ground){ moveTo(h.point.clone(),null); ring.position.set(h.point.x,0.05,h.point.z); ringT=0.6; SFX.tap(); }
}
function clampPos(p){ p.x=Math.max(-22.5,Math.min(22.5,p.x)); p.z=Math.max(-18.5,Math.min(22.5,p.z)); p.y=0; return p; }
function moveTo(p,sc){ state.target=clampPos(p); state.pending=sc; }

window.addEventListener('keydown',function(e){
  state.keys[e.key.toLowerCase()]=true;
  if((e.key==='Enter'||e.key===' ') && state.dialog){ var n=$('#dNext'); if(n && !n.classList.contains('hidden')){ e.preventDefault(); n.click(); } }
});
window.addEventListener('keyup',function(e){ state.keys[e.key.toLowerCase()]=false; });

/* =====================================================================
   主迴圈
   ===================================================================== */
var camPos=new V3(0,16,30), camLook=new V3(0,1,-2), clock=new THREE.Clock(), tmp=new V3();
function update(dt,t){
  // 玩家移動
  if(player && state.started){
    var a=player.userData.anim, K=state.keys, kx=0, kz=0;
    if(!state.dialog && !state.modal){
      if(K['arrowleft']||K['a']) kx-=1; if(K['arrowright']||K['d']) kx+=1;
      if(K['arrowup']||K['w']) kz-=1; if(K['arrowdown']||K['s']) kz+=1;
    }
    if(kx||kz){
      state.target=null; state.pending=null;
      var len=Math.hypot(kx,kz); player.position.x+=kx/len*5.5*dt; player.position.z+=kz/len*5.5*dt; clampPos(player.position);
      a.ry=Math.atan2(kx,kz); a.walking=true;
    } else if(state.target){
      var dx=state.target.x-player.position.x, dz=state.target.z-player.position.z, dist=Math.hypot(dx,dz);
      if(dist>0.08){
        var step=Math.min(dist,5.5*dt); player.position.x+=dx/dist*step; player.position.z+=dz/dist*step;
        a.ry=Math.atan2(dx,dz); a.walking=true;
      } else {
        state.target=null; a.walking=false;
        if(state.pending){ var sc=state.pending; state.pending=null; startScenario(sc); }
      }
    } else a.walking=false;
    animKid(player,dt,t);
  }
  SCENES.forEach(function(sc){
    var k=sc.kid3d; animKid(k,dt,t);
    sc.marker.position.y=3.3+Math.sin(t*3+k.userData.anim.seed)*0.12;
    // 陷阱怪
    var m=sc.monster3d, u=m.userData;
    if(u.dying>0){
      u.dying-=dt*1.6; var s=Math.max(0,u.dying);
      m.scale.setScalar(s*1.3); m.rotation.y+=dt*14;
      if(u.dying<=0) m.visible=false;
      return;
    }
    if(u.dead){ m.visible=false; return; }
    var want=state.glasses?1:0;
    u.vis+=(want-u.vis)*Math.min(1,dt*4);
    m.visible=u.vis>0.02;
    if(!m.visible) return;
    u.mats.forEach(function(mm){ mm.opacity=u.vis*0.92; });
    u.label.material.opacity=u.vis;
    var lx=k.position.x+0.95, lz=k.position.z-0.5;
    var bob=Math.sin(t*2.4+k.userData.anim.seed)*0.15;
    var sc2=1;
    if(u.laugh>0){ u.laugh-=dt; sc2=1.35+Math.sin(t*20)*0.12; bob+=Math.abs(Math.sin(t*14))*0.3; }
    m.scale.setScalar(m.scale.x+(sc2-m.scale.x)*Math.min(1,dt*6));
    m.position.set(lx,2.25+bob,lz);
    if(player){ tmp.copy(player.position); m.rotation.y=Math.atan2(tmp.x-m.position.x,tmp.z-m.position.z); }
  });
  EXTRAS.forEach(function(ex){ animKid(ex.kid3d,dt,t); });

  // 特效
  for(var i=FX.length-1;i>=0;i--){
    var f=FX[i]; f.life-=dt;
    f.v.y-=f.g*dt; f.v.multiplyScalar(f.drag); f.m.position.addScaledVector(f.v,dt);
    f.m.rotation.x+=dt*(f.spin?4:6); f.m.rotation.y+=dt*3;
    f.m.material.opacity=Math.min(1,f.life/f.max*2);
    if(f.life<=0){ scene.remove(f.m); f.m.material.dispose(); FX.splice(i,1); }
  }
  for(var j=flyers.length-1;j>=0;j--){
    var fl=flyers[j]; fl.t+=dt;
    if(fl.t<0){ fl.m.visible=false; continue; } fl.m.visible=true;
    var p=Math.min(1,fl.t/fl.dur), to=player?player.position.clone().add(new V3(0,1.8,0)):fl.from;
    var mid=fl.from.clone().lerp(to,0.5).add(new V3(fl.side,3,0));
    var q=1-p; fl.m.position.set(
      q*q*fl.from.x+2*q*p*mid.x+p*p*to.x, q*q*fl.from.y+2*q*p*mid.y+p*p*to.y, q*q*fl.from.z+2*q*p*mid.z+p*p*to.z);
    fl.m.rotation.y+=dt*10; fl.m.scale.setScalar(1-p*0.5);
    if(p>=1){ scene.remove(fl.m); flyers.splice(j,1); SFX.tone(1320,0.1,'sine',0.05); }
  }
  if(ringT>0){ ringT-=dt; var rs=1+(0.6-ringT)*1.8; ring.scale.set(rs,rs,rs); ring.material.opacity=Math.max(0,ringT/0.6); }
  clouds.forEach(function(c){ c.position.x+=c.userData.v*dt; if(c.position.x>60) c.position.x=-60; });

  // 鏡頭
  var look,pos,port=camera.aspect<0.85;
  if(!state.started){ var ang=t*0.07; look=new V3(0,1,-2); pos=new V3(Math.sin(ang)*30,15,Math.cos(ang)*30); }
  else if(state.focus){ look=state.focus.clone(); pos=look.clone().add(new V3(0,port?4.9:3.7,port?11.8:8.4)); }
  else { look=player.position.clone().add(new V3(0,1,0)); pos=look.clone().add(port?new V3(0,15,16):new V3(0,11,12.5)); }
  var kk=1-Math.exp(-dt*(state.started?3.2:1.2));
  camPos.lerp(pos,kk); camLook.lerp(look,kk);
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;
  update(dt,t);
  renderer.render(scene,camera);
}
function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){ setTimeout(onResize,300); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) Speech.stop(); });

renderStart();
Speech.init();
loop();
})();
</script>
</body>
</html>
