<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="辯辯島">
<meta name="theme-color" content="#86d6ff">
<meta name="description" content="辯辯島 Debate Island：給 6 至 12 歲小朋友嘅辯論訓練遊戲，有廣東話語音、AI 評分同自訂辯題拆解。">
<title>辯辯島 Debate Island｜小學辯論訓練</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#1d2445; --ink2:#4a5480;
  --paper:#fffdf6; --paper2:#fff3d6;
  --sun:#ffd23f; --coral:#ff7a6b; --mint:#3ddc97; --grape:#a898ff; --sky:#6cc8ff;
  --pro:#ff6b6b; --con:#4f8cff;
  --claim:#ffb020; --reason:#3ddc97; --evid:#6cc8ff; --strat:#a898ff; --deliv:#ff8fc2;
  --line:3px solid var(--ink);
  --f:"Noto Sans HK","PingFang HK","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --fd:"Baloo 2","Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);font-size:19px;line-height:1.6;
  background:linear-gradient(180deg,#86d6ff 0%,#bfeaff 48%,#fff0c9 100%);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
textarea,input,select{-webkit-user-select:text;user-select:text;font-family:var(--f)}
button{font-family:var(--f);color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #2b6cff;outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#app{position:fixed;inset:0;z-index:1;pointer-events:none}
.ui{pointer-events:auto}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:5}
.logo{display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--line);border-radius:999px;padding:4px 18px 4px 6px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:21px;cursor:pointer;min-height:54px}
.logo .owl{font-size:30px;line-height:1}
.logo .nm{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.logo small{font-family:var(--fd);font-weight:800;font-size:14px;color:#6b5bd6}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--sun);border:var(--line);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-family:var(--fd);font-weight:800;font-size:22px;min-height:54px}
.pill.bump{animation:bump .5s}
.icon-btn{width:54px;height:54px;border-radius:50%;border:var(--line);background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:25px;cursor:pointer;display:grid;place-items:center;padding:0}
.icon-btn:active,.logo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.home-bottom{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 16px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 14px}
.bubble{position:relative;max-width:780px;width:100%;background:var(--paper);border:var(--line);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:14px 14px 14px 20px;display:flex;gap:12px;align-items:center}
.bubble::before{content:"";position:absolute;top:-17px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom:17px solid var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:12px solid var(--paper);border-top:0}
.bubble p{margin:0;flex:1;font-weight:700;font-size:20px}
.island-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:1040px}
.island-btn{--c:var(--sun);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;border:var(--line);border-radius:26px;background:var(--c);box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .08s}
.island-btn .ib-emoji{font-size:42px;line-height:1.1}
.island-btn b{font-size:23px;font-weight:900;line-height:1.3}
.island-btn small{font-size:15px;font-weight:700;opacity:.85;line-height:1.3;text-align:center}
.island-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.fallback-owl{display:none;position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:150px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(29,36,69,.15))}
.no3d .fallback-owl{display:block}
.no3d #bg{display:none}

/* ---------- sheets ---------- */
.sheet{position:absolute;top:calc(var(--safe-t) + 80px);bottom:calc(var(--safe-b) + 12px);left:12px;right:12px;margin:0 auto;max-width:900px;
  background:rgba(255,253,246,.97);border:var(--line);border-radius:30px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .35s cubic-bezier(.2,1.3,.4,1)}
@media (min-width:1100px){.sheet{left:28px;right:auto;width:min(860px,63vw);margin:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--line);background:var(--hc,var(--sun))}
.sheet-head h2{margin:0;font-size:25px;font-weight:900;flex:1;line-height:1.2}
.sheet-head h2 small{display:block;font-family:var(--fd);font-size:15px;font-weight:800;opacity:.75}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px;overscroll-behavior:contain}

/* ---------- common components ---------- */
.btn{--bc:var(--sun);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--line);border-radius:18px;background:var(--bc);box-shadow:0 5px 0 var(--ink);
  padding:12px 20px;font-size:20px;font-weight:900;min-height:56px;cursor:pointer;transition:transform .08s;line-height:1.25;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{font-size:17px;min-height:46px;padding:8px 14px;border-radius:14px}
.btn.ghost{--bc:#fff}
.btn.go{--bc:var(--mint)}
.btn.pro{--bc:var(--pro);color:#fff}
.btn.con{--bc:var(--con);color:#fff}
.btn.grape{--bc:var(--grape)}
.btn.coral{--bc:var(--coral)}
.btn.sky{--bc:var(--sky)}
.btn.block{width:100%}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:var(--line);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:21px;display:grid;place-items:center;cursor:pointer;padding:0;line-height:1}
.spk.sm{width:38px;height:38px;font-size:17px;border-width:2px}
.spk.playing{background:var(--mint);animation:pulse .9s infinite}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{background:#fff;border:var(--line);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:16px 18px}
.card.tint{background:var(--bg,var(--paper2))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.say{display:flex;gap:10px;align-items:flex-start}
.say>p,.say>div.txt{margin:0;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--c,#fff);font-weight:800;font-size:15px;line-height:1.5}
.chip.big{font-size:17px;padding:5px 14px}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-size:22px;font-weight:900}
.sec-title .e{font-size:28px}
.sec-title .grow{flex:1}
.muted{color:var(--ink2);font-size:16px}
.big-text{font-size:23px;font-weight:900;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lab{font-weight:900;margin-right:4px}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;font-size:19px;border:var(--line);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical;line-height:1.6}
label.fl{display:block;font-weight:900;margin:14px 0 6px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:26px;height:26px;accent-color:#2bb673}

/* ---------- learn ---------- */
.lesson{text-align:center;padding:20px 18px}
.lesson .le{font-size:78px;line-height:1.1;display:inline-block;animation:bob 3s ease-in-out infinite}
.lesson h3{margin:6px 0 0;font-size:30px;font-weight:900}
.lesson .en{font-family:var(--fd);font-weight:800;color:#6b5bd6;font-size:19px}
.lesson .body{text-align:left;margin-top:14px;font-size:21px;font-weight:500}
.lesson .ex{text-align:left;margin-top:14px;background:var(--paper2);border:2px dashed var(--ink);border-radius:16px;padding:12px 14px;font-size:19px}
.dots{display:flex;justify-content:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.dots button{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dots button.on{background:var(--sun);transform:scale(1.35)}
.dots button.seen{background:#ffe89a}

/* ---------- games ---------- */
.game-card{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:var(--c);padding:18px}
.game-card .ge{font-size:52px;line-height:1}
.game-card b{font-size:24px}
.statement{font-size:24px;font-weight:900;background:var(--paper2);border:var(--line);border-radius:20px;padding:16px 18px;position:relative}
.ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:600px){.ans-grid{grid-template-columns:1fr}}
.ans-btn{font-size:22px;min-height:80px;flex-direction:column;gap:0}
.ans-btn small{font-family:var(--fd);font-size:14px;opacity:.8}
.opt-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px;font-size:19px;font-weight:700;cursor:pointer}
.opt-btn .let{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800}
.opt-btn.right{background:#d8ffe9}
.opt-btn.wrong{background:#ffe0dc}
.correct-flash{animation:wiggle .5s}
.feedback{border-left:10px solid var(--c,var(--mint))}
.scoreline{font-family:var(--fd);font-weight:800;font-size:20px}

/* ---------- practice ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:800;cursor:pointer;min-height:44px}
.filters button.on{background:var(--ink);color:#fff}
.motion-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:12px 12px 12px 16px;cursor:pointer}
.motion-card .mt{flex:1;font-size:20px;font-weight:900;line-height:1.4}
.motion-card .mt small{display:block;font-size:15px;font-weight:700;color:var(--ink2)}
.motion-list{display:grid;gap:12px}
.banner{background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.banner .bt{flex:1}
.banner .bt small{display:block;opacity:.75;font-size:15px;font-weight:700}
.banner .bt b{font-size:22px;line-height:1.4;display:block}
.banner .spk{box-shadow:none;border-color:#fff}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side-btn{flex-direction:column;min-height:150px;font-size:26px;border-radius:24px}
.side-btn small{font-size:16px;font-weight:700;opacity:.95}
.side-btn .se{font-size:44px;line-height:1}
.coin{width:120px;height:120px;border-radius:50%;margin:10px auto;border:var(--line);background:radial-gradient(circle at 35% 30%,#fff6c2,var(--sun) 60%,#e0a800);display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 6px 0 var(--ink)}
.coin.flip{animation:flip 1.3s ease-out}
.progress{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pdot{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-family:var(--fd);font-weight:800;font-size:18px;cursor:pointer}
.pdot.done{background:#d8ffe9}
.pdot.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.q-text{font-size:23px;font-weight:900;line-height:1.45}
.q-helper{font-size:17px;color:var(--ink2);font-weight:700;margin-top:8px}
.hint{background:#fffbe6;border:2px dashed var(--ink);border-radius:16px;padding:10px 12px;font-size:18px}
.ta-wrap{position:relative;margin-top:12px}
.ta-wrap textarea{padding-bottom:64px}
.ta-tools{position:absolute;right:10px;bottom:12px;display:flex;gap:8px;align-items:center}
.mic{width:54px;height:54px;border-radius:50%;border:var(--line);background:var(--coral);font-size:24px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.mic.rec{background:#ff3b3b;animation:pulse .8s infinite}
.count{font-size:14px;color:var(--ink2);font-weight:700}
.nav{margin-top:18px;justify-content:space-between}

/* ---------- results ---------- */
.score-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:150px;height:150px;border-radius:50%;border:var(--line);box-shadow:0 6px 0 var(--ink);background:conic-gradient(var(--mint) calc(var(--p)*1%),#ececf4 0);display:grid;place-items:center;flex:none}
.ring>div{width:108px;height:108px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:44px;line-height:1}
.ring>div small{font-size:14px;display:block;text-align:center}
.stars{font-size:40px;letter-spacing:2px;line-height:1.2}
.stars span{display:inline-block;animation:starPop .5s both}
.stars span.off{filter:grayscale(1);opacity:.3}
.rtitle{display:inline-block;background:var(--grape);border:var(--line);border-radius:14px;padding:4px 14px;font-weight:900;font-size:21px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--ink)}
.dim{margin-top:12px}
.dim-top{display:flex;align-items:center;gap:10px;font-weight:900}
.dim-top .nm{flex:1}
.bar{height:18px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;width:0;background:var(--c);transition:width 1.1s cubic-bezier(.2,1,.3,1)}
.list-say{display:grid;gap:10px}
.item{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 12px}
.improve{border-left:10px solid var(--coral)}
.improve .ex{margin-top:6px;background:var(--paper2);border-radius:10px;padding:8px 10px;font-size:18px}
.better{background:#f1edff}

/* ---------- breakdown ---------- */
.tabs{display:flex;gap:10px;margin:8px 0 12px}
.tabs button{flex:1;min-height:54px;border:var(--line);border-radius:16px;font-size:19px;font-weight:900;background:#fff;cursor:pointer}
.tabs button.on.pro{background:var(--pro);color:#fff}
.tabs button.on.con{background:var(--con);color:#fff}
.arg{border-left:12px solid var(--c)}
.arg .rank{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.arg .rank b{font-size:18px}
.arg-row{margin-top:10px}
.arg-row .lbl{display:inline-block;font-size:15px;font-weight:900;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;background:var(--c);margin-bottom:4px}
.warn{font-size:16px;color:#8a4b00;background:#fff4e0;border-radius:10px;padding:6px 10px;margin-top:8px}
.rebut-pair{display:grid;gap:6px}
.rebut-pair .they{background:#f0f2f8;border-radius:14px;padding:8px 12px}
.rebut-pair .you{background:#e3fff0;border-radius:14px;padding:8px 12px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.mode-grid,.side-grid{grid-template-columns:1fr}}
.mode-card{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#fff;position:relative}
.mode-card.on{background:var(--c);transform:translateY(-3px)}
.mode-card .me{font-size:44px;line-height:1}
.mode-card b{font-size:22px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;border:var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:900;min-height:52px;cursor:pointer}
.seg button.on{background:var(--c,var(--sun));box-shadow:0 4px 0 var(--ink)}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,36,69,.45);display:none;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px)}
.modal.open{display:flex}
.modal-box{background:var(--paper);border:var(--line);border-radius:28px;box-shadow:0 8px 0 var(--ink);width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .3s cubic-bezier(.2,1.3,.4,1)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--line);background:var(--sky)}
.modal-head h2{margin:0;flex:1;font-size:24px}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 26px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;font-size:15px;font-weight:800;cursor:pointer;min-height:40px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.note{font-size:15px;background:#eef8ff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:12px;line-height:1.55}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{text-align:center;background:#fff;border:var(--line);border-radius:18px;padding:10px 8px}
.badge .be{font-size:44px;line-height:1.2}
.badge b{display:block;font-size:17px}
.badge small{display:block;font-size:13px;color:var(--ink2);line-height:1.35}
.badge.lock{opacity:.4;filter:grayscale(1)}
.hist{display:grid;gap:8px;margin-top:10px}
.hist div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:16px;display:flex;gap:8px}
.hist div span:first-child{flex:1}
.thinking{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(255,253,246,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-align:center;padding:20px}
.thinking.open{display:flex}
.thinking .to{font-size:110px;animation:think 1.4s ease-in-out infinite;line-height:1}
.thinking p{margin:0;font-size:24px;font-weight:900;background:#fff;border:var(--line);border-radius:18px;padding:10px 18px;box-shadow:0 5px 0 var(--ink)}
.thinking small{font-size:16px;color:var(--ink2);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%) translateY(150%);z-index:80;background:var(--ink);color:#fff;border-radius:18px;padding:12px 20px;font-weight:800;font-size:18px;max-width:92vw;transition:transform .3s cubic-bezier(.2,1.3,.4,1);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetto{position:fixed;top:-20px;z-index:90;width:12px;height:18px;border:2px solid var(--ink);border-radius:3px;pointer-events:none;animation:fall linear forwards}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

<script>
'use strict';
/* =========================================================
   辯辯島 Debate Island — core helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const str = v => (v == null ? '' : String(v));
const arr = v => (Array.isArray(v) ? v : v ? [v] : []);

/* ---------- storage (Local Storage) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dbi_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dbi_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('dbi_' + k); } catch (e) {} }
};
const DEFAULT_SETTINGS = { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini', apiKey: '', rate: 0.9, autoRead: false, sfx: true, enFeedback: 'en', voiceZh: '', voiceEn: '' };
let S = Object.assign({}, DEFAULT_SETTINGS, LS.get('settings', {}));
let P = Object.assign({ name: '', grade: 'P3' }, LS.get('profile', {}));
let G = Object.assign({ stars: 0, badges: [], practiceCount: 0, seenLessons: [], history: [] }, LS.get('progress', {}));
const saveS = () => LS.set('settings', S);
const saveP = () => LS.set('profile', P);
const saveG = () => LS.set('progress', G);

const GRADES = {
  P1: { zh: '小一', age: '6至7歲' }, P2: { zh: '小二', age: '7至8歲' }, P3: { zh: '小三', age: '8至9歲' },
  P4: { zh: '小四', age: '9至10歲' }, P5: { zh: '小五', age: '10至11歲' }, P6: { zh: '小六', age: '11至12歲' }
};

/* ---------- toast / confetti / sound ---------- */
let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function confetti(n = 70) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#ff6b6b', '#ffd23f', '#3ddc97', '#4f8cff', '#a898ff', '#ff8fc2'];
  for (let i = 0; i < n; i++) {
    const c = h('div', { class: 'confetto' });
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.append(c);
    setTimeout(() => c.remove(), 4300);
  }
  World.burst && World.burst();
}
const SFX = {
  ctx: null,
  play(kind) {
    if (!S.sfx) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const seqs = {
        click: [[660, .06, 'triangle']],
        good: [[660, .09], [880, .09], [1320, .16]],
        bad: [[320, .14, 'sawtooth'], [240, .2, 'sawtooth']],
        win: [[523, .11], [659, .11], [784, .11], [1047, .32]],
        flip: [[400, .05], [500, .05], [600, .05], [700, .05], [800, .05], [900, .08]]
      };
      let t = c.currentTime;
      for (const [f, d, ty] of seqs[kind] || []) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = ty || 'triangle'; o.frequency.value = f;
        const vol = ty === 'sawtooth' ? 0.06 : 0.16;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03); t += d * 0.92;
      }
    } catch (e) {}
  }
};

/* ---------- 廣東話 / 英式英語 語音朗讀 (Text-to-Speech) ---------- */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu;
const TTS = {
  supported: 'speechSynthesis' in window,
  voices: [], token: 0, curBtn: null, unlocked: false,
  load() { if (this.supported) this.voices = speechSynthesis.getVoices() || []; },
  zhVoices() { return this.voices.filter(v => /zh[-_]HK|yue/i.test(v.lang) || /cantonese|粵|廣東|香港|hong ?kong/i.test(v.name)); },
  enVoices() { return this.voices.filter(v => /^en/i.test(v.lang)); },
  pick(lang) {
    const vs = this.voices;
    if (lang === 'zh') {
      return (S.voiceZh && vs.find(v => v.voiceURI === S.voiceZh)) || this.zhVoices()[0] || null;
    }
    return (S.voiceEn && vs.find(v => v.voiceURI === S.voiceEn)) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  clean(t) {
    return str(t).replace(EMOJI_RE, ' ').replace(/[*#_`>~|]/g, ' ').replace(/[「」『』“”"]/g, '').replace(/…+|\.\.\.+/g, '，').replace(/\s+/g, ' ').trim();
  },
  chunks(text) {
    const t = this.clean(text);
    const parts = t.replace(/([。！？!?；;：\n])/g, '$1\u0001').replace(/([.])\s+/g, '$1\u0001').split('\u0001');
    const out = [];
    for (let p of parts) {
      p = p.trim(); if (!p || /^[\s,，、.。:：;；!?！？()（）\-–—]+$/.test(p)) continue;
      while (p.length > 130) {
        let cut = p.lastIndexOf('，', 130);
        if (cut < 30) cut = p.lastIndexOf(',', 130);
        if (cut < 30) cut = p.lastIndexOf(' ', 130);
        if (cut < 30) cut = 130;
        out.push(p.slice(0, cut + 1)); p = p.slice(cut + 1).trim();
      }
      if (p) out.push(p);
    }
    return out.map(x => ({ text: x, lang: /[\u3400-\u9fff]/.test(x) ? 'zh' : 'en' }));
  },
  speak(text, btn) {
    if (!this.supported) { toast('呢個瀏覽器唔支援語音朗讀 😢'); return; }
    const same = btn && this.curBtn === btn;
    this.stop();
    if (same) return;
    const list = this.chunks(text); if (!list.length) return;
    if (!this.voices.length) this.load();
    if (!this.pick('zh') && list.some(c => c.lang === 'zh') && !this.warned) {
      this.warned = true; toast('搵唔到廣東話聲音，請睇⚙️設定入面嘅教學', 4000);
    }
    const token = this.token;
    this.curBtn = btn || null; if (btn) btn.classList.add('playing');
    World.talk(true);
    setTimeout(() => {
      if (token !== this.token) return;
      list.forEach((c, i) => {
        const u = new SpeechSynthesisUtterance(c.text);
        const v = this.pick(c.lang);
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = c.lang === 'zh' ? 'zh-HK' : 'en-GB';
        u.rate = S.rate; u.pitch = c.lang === 'zh' ? 1.08 : 1.0;
        if (i === list.length - 1) u.onend = u.onerror = () => { if (token === this.token) this.done(); };
        speechSynthesis.speak(u);
      });
    }, 60);
  },
  done() { if (this.curBtn) this.curBtn.classList.remove('playing'); this.curBtn = null; World.talk(false); },
  stop() { this.token++; if (this.supported) { try { speechSynthesis.cancel(); } catch (e) {} } this.done(); },
  unlock() {
    if (this.unlocked || !this.supported) return; this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  }
};
if (TTS.supported) {
  TTS.load();
  speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', () => { TTS.load(); Settings.fillVoices && Settings.fillVoices(); })
    : (speechSynthesis.onvoiceschanged = () => TTS.load());
}
document.addEventListener('pointerdown', () => TTS.unlock(), { once: true });

/** 🔊 speaker button. textOrFn = string or function returning string */
function spk(textOrFn, opts = {}) {
  const b = h('button', { class: 'spk' + (opts.small ? ' sm' : ''), type: 'button', 'aria-label': opts.label || '朗讀', title: opts.label || '朗讀' }, '🔊');
  b.addEventListener('click', e => { e.stopPropagation(); const t = typeof textOrFn === 'function' ? textOrFn() : textOrFn; TTS.speak(t, b); });
  return b;
}
/** paragraph + speaker */
function sayRow(text, cls = '', opts = {}) {
  return h('div', { class: 'say ' + cls }, h('p', {}, text), spk(opts.speak || text, opts));
}
function autoSay(text) { if (S.autoRead) TTS.speak(text, null); }

/* ---------- 語音輸入 (Speech-to-Text) ---------- */
const STT = {
  R: window.SpeechRecognition || window.webkitSpeechRecognition,
  rec: null,
  start(ta, lang, btn) {
    if (!this.R) { toast('呢個瀏覽器唔支援語音輸入。iPad 可以揿鍵盤上面嘅 🎤 用廣東話講！', 4500); return; }
    if (this.rec) { try { this.rec.stop(); } catch (e) {} return; }
    TTS.stop();
    const r = new this.R();
    r.lang = lang === 'en' ? 'en-GB' : 'zh-HK';
    r.interimResults = true; r.continuous = false;
    const base = ta.value; const sep = base && lang === 'en' && !/\s$/.test(base) ? ' ' : '';
    let fin = '';
    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += tr; else interim += tr;
      }
      ta.value = base + sep + fin + interim; ta.dispatchEvent(new Event('input'));
    };
    r.onerror = e => { if (e.error !== 'aborted') toast('聽唔清楚，再試一次？（' + e.error + '）'); };
    r.onend = () => { btn.classList.remove('rec'); this.rec = null; };
    this.rec = r; btn.classList.add('rec');
    try { r.start(); toast(lang === 'en' ? '🎤 Speak now…' : '🎤 請講嘢…', 1600); } catch (e) { btn.classList.remove('rec'); this.rec = null; }
  }
};

/* ---------- AI client (OpenAI-compatible or Anthropic) ---------- */
class NoKeyError extends Error {}
function aiReady() { return !!(S.apiKey && S.baseUrl && S.model); }
async function callAI(system, user, { json = true, maxTokens = 4000, timeout = 150000 } = {}) {
  if (!aiReady()) throw new NoKeyError('NOKEY');
  const base = S.baseUrl.trim().replace(/\/+$/, '');
  const isAnthropic = /anthropic\.com/i.test(base) || /\/messages$/.test(base);
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), timeout);
  try {
    let res, data, text = '';
    if (isAnthropic) {
      const url = /\/messages$/.test(base) ? base : (/\/v1$/.test(base) ? base + '/messages' : base + '/v1/messages');
      res = await fetch(url, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: S.model.trim(), max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] })
      });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(apiErr(res, data));
      text = arr(data.content).filter(b => b.type === 'text').map(b => b.text).join('\n');
    } else {
      const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
      res = await fetch(url, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.apiKey.trim() },
        body: JSON.stringify({ model: S.model.trim(), messages: [{ role: 'system', content: system }, { role: 'user', content: user }] })
      });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(apiErr(res, data));
      const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      text = Array.isArray(c) ? c.map(x => x.text || '').join('\n') : str(c);
    }
    if (!text.trim()) throw new Error('AI 冇回覆任何內容，請再試一次。');
    return json ? parseJSON(text) : text;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('等咗太耐（超時），請再試一次。');
    if (e instanceof TypeError) throw new Error('連唔到伺服器（' + e.message + '）。可能係 Base URL 錯咗、冇上網，或者呢個 AI 供應商唔俾瀏覽器直接連接（CORS）。');
    throw e;
  } finally { clearTimeout(tm); }
}
function apiErr(res, data) {
  const m = (data && (data.error && (data.error.message || data.error)) || data.message) || res.statusText;
  const hint = res.status === 401 ? '（API Key 唔啱）' : res.status === 404 ? '（Base URL 或者 Model 名唔啱）' : res.status === 429 ? '（用得太密或者額度用完）' : '';
  return `HTTP ${res.status} ${hint} ${typeof m === 'string' ? m : JSON.stringify(m)}`.trim();
}
function parseJSON(t) {
  let s = str(t).replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e) {
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1').replace(/[\u201c\u201d]/g, '"')); }
    catch (e2) { throw new Error('AI 回覆嘅格式有少少問題，請再試一次。'); }
  }
}
const THINK_MSGS = ['阿辯諗緊…🤔', '翻緊辯論秘笈📖', '搵緊最有力嘅論點💡', '計緊分數🧮', '準備緊貼士✨'];
async function withThinking(first, fn) {
  const box = $('#thinking'), msg = $('#thinkMsg');
  msg.textContent = first; box.classList.add('open'); World.think(true);
  let i = 0; const iv = setInterval(() => { msg.textContent = THINK_MSGS[i++ % THINK_MSGS.length]; }, 3500);
  try { return await fn(); } finally { clearInterval(iv); box.classList.remove('open'); World.think(false); }
}
function aiError(e, retry) {
  if (e instanceof NoKeyError) {
    showMsg('🔑 未設定 AI', [
      sayRow('要用 AI 評分同拆解，請大人幫手喺「設定」填好 Base URL、Model 同 API Key。'),
      h('div', { class: 'row', style: 'margin-top:16px' }, h('button', { class: 'btn go', onclick: () => { closeModal('msgModal'); Settings.open(); } }, '⚙️ 去設定'))
    ]);
    return;
  }
  showMsg('😵 阿辯連唔到 AI', [
    h('div', { class: 'card', style: 'font-size:17px;word-break:break-word' }, str(e.message || e)),

/* ---------- language helpers ---------- */
function detectLang(t) {
  const cjk = (str(t).match(/[\u3400-\u9fff]/g) || []).length;
  const lat = (str(t).match(/[A-Za-z]/g) || []).length;
  if (!cjk && !lat) return null;
  return cjk * 3 >= lat ? 'zh' : 'en';
}
function fbLang(lang) { return lang === 'en' && S.enFeedback === 'en' ? 'en' : 'zh'; }
function sideName(side, lang) {
  if (lang === 'en') return side === 'pro' ? 'Proposition 正方' : 'Opposition 反方';
  return side === 'pro' ? '正方' : '反方';
}

    this.renderer.setSize(W, H);
    this.camera.aspect = W / H; this.camera.fov = W / H < 1 ? 60 : 46; this.camera.updateProjectionMatrix();
    this.focus(this.cur || 'home');
  },
  focus(name) {
    this.cur = name; if (!this.camera) return;
    const wide = window.innerWidth >= 1100, portrait = window.innerHeight > window.innerWidth;
    if (name === 'home') {
      this.tPos.set(0, portrait ? 10 : 8.5, portrait ? 31 : 25); this.tLook.set(0, 2.2, -3);
      this.tShiftX = 0; this.tShiftY = portrait ? 0.2 : 0.15;
    } else {
      const off = { learn: -1.6, games: -0.6, practice: 0.6, custom: 1.6 }[name] || 0;
      this.tPos.set(off * 1.6, 4.3, 11.5); this.tLook.set(off * 0.4, 2.4, 1.5);
      this.tShiftX = wide ? -0.33 : 0; this.tShiftY = wide ? 0.03 : 0.12;
    }
  },
  pick(x, y) {
    if (!this.ok) return null;
    this.ptr.set((x / this.W) * 2 - 1, -(y / this.H) * 2 + 1);
    this.ray.setFromCamera(this.ptr, this.camera);
    const hits = this.ray.intersectObjects([...this.islands, this.owl.group], true);
    for (const hit of hits) {
      let o = hit.object;
      while (o) { if (o.userData && (o.userData.go || o.userData.owl)) return o.userData.go || 'owl'; o = o.parent; }
    }
    return null;
  },
  tap(x, y) {
    const p = this.pick(x, y); if (!p) return;
    if (p === 'owl') { Home.owlTip(); return; }
    if (App.cur === 'home') { SFX.play('click'); App.go(p); }
  },
  talk(on) { this.st.talk = on; },
  think(on) { this.st.think = on; if (this.thought) this.thought.visible = on; },
  cheer(spins = 1) { this.st.jumpT = 0; this.st.spins = spins; },
  burst(n = 70) {
    if (!this.ok) return;
    this.cheer(2);
    const T = THREE; if (!this.cGeo) this.cGeo = new T.PlaneGeometry(0.18, 0.28);
    const cols = [0xff6b6b, 0xffd23f, 0x3ddc97, 0x4f8cff, 0xa898ff, 0xff8fc2];
    const o = this.owl.group.position;
    for (let i = 0; i < n; i++) {
      const m = new T.Mesh(this.cGeo, new T.MeshBasicMaterial({ color: cols[i % 6], side: T.DoubleSide }));
      m.position.set(o.x, o.y + 1.2, o.z);
      m.userData = { v: new T.Vector3((Math.random() - .5) * 9, 6 + Math.random() * 7, (Math.random() - .5) * 9), r: new T.Vector3(Math.random() * 9, Math.random() * 9, 0), life: 3 };
      this.scene.add(m); this.confetti.push(m);
    }
  },
  loop() {
    requestAnimationFrame(() => this.loop());
    if (document.hidden) return;
    const dt = Math.min(this.clock.getDelta(), 0.05); this.t += dt; const t = this.t;
    const k = 1 - Math.pow(0.03, dt);
    this.camPos.lerp(this.tPos, k); this.camLook.lerp(this.tLook, k);
    this.shiftX += (this.tShiftX - this.shiftX) * k; this.shiftY += (this.tShiftY - this.shiftY) * k;
    const cam = this.camera;
    cam.position.set(this.camPos.x + Math.sin(t * 0.21) * 0.5, this.camPos.y + Math.sin(t * 0.33) * 0.25, this.camPos.z);
    cam.lookAt(this.camLook);
    cam.setViewOffset(this.W, this.H, this.shiftX * this.W, this.shiftY * this.H, this.W, this.H);

    for (const isl of this.islands) {
      const u = isl.userData; isl.position.y = u.baseY + Math.sin(t * 0.8 + u.phase) * 0.28;
      if (u.lm.userData.spin) u.lm.userData.spin.rotation.y = t * (u.mk === 'target' ? 0.6 : 1.1);
      if (u.lm.userData.orb) u.lm.userData.orb.rotation.y = -t * 1.4;
    }
    for (const c of this.clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 45) c.position.x = -45; }
    this.sparkles.rotation.y = t * 0.02; this.sparkles.material.opacity = 0.55 + Math.sin(t * 2) * 0.3;

    // owl
    const o = this.owl, st = this.st;
    let y = o.baseY + Math.sin(t * 2.2) * 0.06;
    let flap = Math.sin(t * 2.2) * 0.05;
    if (st.jumpT >= 0) {
      st.jumpT += dt; const p = st.jumpT / (0.7 + 0.35 * st.spins);
      if (p >= 1) { st.jumpT = -1; o.body.rotation.y = 0; }
      else { y += Math.sin(p * Math.PI) * 1.7; o.body.rotation.y = p * Math.PI * 2 * st.spins; flap = Math.abs(Math.sin(p * Math.PI * 8)) * 1.1; }
    }
    if (st.talk) { flap += Math.abs(Math.sin(t * 5)) * 0.25; o.beak.scale.set(1 + Math.abs(Math.sin(t * 16)) * 0.35, 1, 1); y += Math.abs(Math.sin(t * 8)) * 0.05; }
    else o.beak.scale.set(1, 1, 1);
    o.group.position.y = y;
    o.wings.forEach(w => { w.rotation.z = (0.15 + flap) * w.userData.s; });
    const tilt = st.think ? 0.22 + Math.sin(t * 1.6) * 0.06 : 0;
    o.body.rotation.z += (tilt - o.body.rotation.z) * k;
    const lx = st.think ? 0.4 : st.lookX, ly = st.think ? 1 : st.lookY;
    o.group.rotation.y += (lx * 0.45 - o.group.rotation.y) * k;
    o.pupils.forEach(p => { p.position.x = clamp(lx, -1, 1) * 0.07; p.position.y = clamp(ly, -1, 1) * 0.06; });
    st.blinkT -= dt;
    const eyeY = st.blinkT < 0 ? 0.12 : 1;
    o.eyes.forEach(e => { e.scale.y = eyeY; });
    if (st.blinkT < -0.14) st.blinkT = 2 + Math.random() * 3.5;
    if (this.thought.visible) this.thought.position.y = 3.9 + Math.sin(t * 3) * 0.15;

    // 3D confetti
    for (let i = this.confetti.length - 1; i >= 0; i--) {
      const m = this.confetti[i], u = m.userData;
      u.v.y -= 12 * dt; u.v.multiplyScalar(0.992);
      m.position.addScaledVector(u.v, dt); m.rotation.x += u.r.x * dt; m.rotation.y += u.r.y * dt; u.life -= dt;
      if (u.life < 0 || m.position.y < -1.4) { this.scene.remove(m); m.material.dispose(); this.confetti.splice(i, 1); }
    }
    this.renderer.render(this.scene, cam);
  }
};

function studentLine() {
  const g = GRADES[P.grade] || GRADES.P3;
  return `學生：${P.name || '小朋友'}，${g.zh}（約${g.age}）`;
}
function langRule(lang) {
  if (lang === 'zh') return '【語言規則】全部內容用香港繁體中文，唔好用簡體字。解釋、評語、提示用親切嘅廣東話口語（例如：係、嘅、咗、唔、佢哋、點解）；示範發言（例如開場白、反駁句、升級版示範、句子開頭）用適合香港小學辯論比賽嘅正式語體（書面語為主）。';
  if (fbLang('en') === 'en') return '[Language rule] The motion is in English. Write EVERY text field in simple British English suitable for primary pupils in Hong Kong. Use British spelling and vocabulary (e.g. colour, favourite, organise, practise (verb), programme, pupils, mum, maths, adjudicator, Madam Chair).';
  return '【語言規則】辯題係英文。解釋、評語、提示用香港繁體中文廣東話口語；但所有論點句、示範發言、開場白、反駁句、升級版示範、句子開頭都要用簡單嘅英式英文（British spelling，例如 colour, favourite, organise），方便學生直接喺英文比賽用。';
}
const COACH = '你係「阿辯」，一位親切、有耐性而且誠實嘅香港小學辯論教練，專門訓練6至12歲學生準備校際辯論比賽。你熟悉香港小學辯論賽制（主辯、第一副辯、第二副辯、結辯、自由辯論）。';

function promptEvaluate({ motion, lang, side, qa }) {
  const sys = `${COACH}
你會收到一位學生就某條辯題嘅作答。請按學生年級作出公平評分同具體、可行嘅改善建議。
評分準則（每項0至20分，總分100分）：
1. claim 立場與論點：立場清唔清楚？論點有冇直接回應辯題？
2. reasoning 論證：有冇解釋「點解」？因果關係合唔合理？
3. evidence 論據：例子、數據或經驗係咪具體、相關、可信？
4. strategy 反駁與策略：有冇預計對方講法並回應？有冇用定義、比較等策略？
5. delivery 組織與表達：句子通唔通順？結構清唔清楚？有冇總結？
年級期望：小一、小二可以寬鬆啲；小五、小六要求較高。但唔好亂送分：空白、離題或者太短嘅答案要誠實俾低分，然後溫柔咁講點樣改。
星星：90分或以上=5，75至89=4，60至74=3，40至59=2，40以下=1。
唔好講學生冇寫過嘅嘢係佢寫嘅。建議要具體，最好附示範句子。
${HONEST}
${langRule(lang)}
只輸出一個 JSON 物件，唔好有其他文字或者 markdown：
{"total":整數,"stars":整數,"title":"一個得意嘅稱號，例如「論點小火箭」","summary":"兩至三句總評","scores":[{"key":"claim","score":整數,"comment":"一至兩句"},{"key":"reasoning","score":整數,"comment":""},{"key":"evidence","score":整數,"comment":""},{"key":"strategy","score":整數,"comment":""},{"key":"delivery","score":整數,"comment":""}],"strengths":["具體優點（2至3項）"],"improvements":[{"point":"要改善嘅地方","how":"點樣改","example":"示範句子"}],"better_version":"根據學生原本嘅想法改寫嘅升級版發言（中文約120至200字；英文約80至140 words）","next_challenge":"一個細小、可以即刻做嘅下一步練習"}`;
  const user = `${studentLine()}
辯題：${motion}
辯題語言：${lang === 'en' ? 'English' : '中文'}
學生立場：${side === 'pro' ? '正方（支持辯題）' : '反方（反對辯題）'}
學生作答：
${qa.map((x, i) => `【第${i + 1}題｜${x.stage}】\n問題：${x.q}\n答案：${x.a && x.a.trim() ? x.a.trim() : '（冇作答）'}`).join('\n\n')}`;
  return [sys, user];
}

function promptBreakdown({ motion, lang, side }) {
  const sys = `${COACH}
請即時拆解以下辯題，教學生點樣準備。要實用、有策略，而且適合學生年級。
要求：
- 正方同反方各俾3個論點，由最有力排到最弱（strength 5 係最強）。每個論點都要有 claim（論點）、reasoning（論證）、evidence（論據）。
- evidence 要具體；如果係建議搵資料，就講清楚去邊度搵。evidence_note 寫提醒（例如要查證），冇就留空。
- strategies：3至4個致勝策略（例如定義、比較標準、預計對方、團隊分工）。
- rebuttals：雙方各2個「如果對方話……你可以咁回應……」。
- opening：正方同反方各一段約60至100字（英文約50至80 words）嘅主辯開場白示範。

${HONEST}
${langRule(lang)}
只輸出一個 JSON 物件：

  r = r || {};

    const f = arr(r.scores).find(x => x && x.key === k) || {};

  });

    total, stars: clamp(Math.round(stars), 1, 5), title: str(r.title), summary: str(r.summary), scores,
    strengths: arr(r.strengths).map(str).filter(Boolean),

    const b = $('#settingsBody'); b.innerHTML = '';
    // ---- AI ----
    const url = h('input', { type: 'url', value: S.baseUrl, placeholder: 'https://api.openai.com/v1', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const model = h('input', { type: 'text', value: S.model, placeholder: 'gpt-4o-mini', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const key = h('input', { type: 'password', value: S.apiKey, placeholder: 'sk-…', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const eye = h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { key.type = key.type === 'password' ? 'text' : 'password'; } }, '👁️');
    const status = h('div', { class: 'muted', style: 'margin-top:8px' });
    const saveAI = () => { S.baseUrl = url.value.trim(); S.model = model.value.trim(); S.apiKey = key.value.trim(); saveS(); };
    b.append(h('h3', { style: 'margin:0 0 4px' }, '🤖 AI 設定'),
      h('div', { class: 'muted' }, '支援 OpenAI 格式（/chat/completions）同 Anthropic 格式。揿下面快速填入，再改 Model 名。'),
      h('div', { class: 'presets', style: 'margin-top:10px' }, PRESETS.map(p => h('button', { type: 'button', onclick: () => { url.value = p.url; model.value = p.model; } }, p.n))),
      h('label', { class: 'fl' }, 'Base URL'), url,
      h('label', { class: 'fl' }, 'Model'), model,
      h('label', { class: 'fl' }, 'API Key'), h('div', { class: 'keyrow' }, key, eye),
      h('div', { class: 'row', style: 'margin-top:14px' },
        h('button', { class: 'btn go', onclick: () => { saveAI(); toast('💾 已儲存喺呢部機'); status.textContent = '✅ 已儲存。'; } }, '💾 儲存'),
        h('button', { class: 'btn sky', onclick: async () => {
          saveAI(); status.textContent = '⏳ 測試緊…';
          try { const t = await callAI('You are a connection test.', 'Reply with the single word: OK', { json: false, maxTokens: 20, timeout: 40000 }); status.textContent = '✅ 連線成功！AI 回覆：' + t.slice(0, 40); SFX.play('good'); }
          catch (e) { status.textContent = '❌ ' + (e instanceof NoKeyError ? '請先填齊三格。' : e.message); SFX.play('bad'); }
        } }, '🧪 測試連線'),
        h('button', { class: 'btn ghost', onclick: () => { if (!confirm('確定清除 Base URL、Model 同 API Key？')) return; S.apiKey = ''; S.baseUrl = DEFAULT_SETTINGS.baseUrl; S.model = DEFAULT_SETTINGS.model; saveS(); url.value = S.baseUrl; model.value = S.model; key.value = ''; status.textContent = '🗑️ 已清除。'; } }, '🗑️ 清除')),
      status,
      h('div', { class: 'note' }, '🔒 呢三項只會臨時儲存喺呢部機嘅瀏覽器（Local Storage），唔會寫入程式檔，亦唔會上載去 GitHub。用公用電腦嘅話，用完記得揿「清除」。API Key 請由家長或老師保管。'));
    // ---- voice ----
    const selZh = h('select', { 'aria-label': '廣東話聲音' }), selEn = h('select', { 'aria-label': '英文聲音' });
    this.selZh = selZh; this.selEn = selEn; this.fillVoices();
    selZh.addEventListener('change', () => { S.voiceZh = selZh.value; saveS(); });
    selEn.addEventListener('change', () => { S.voiceEn = selEn.value; saveS(); });
    const rate = h('input', { type: 'range', min: '0.6', max: '1.2', step: '0.05', value: String(S.rate), style: 'width:100%;accent-color:#2bb673' });
    const rateLbl = h('span', {}, S.rate.toFixed(2) + 'x');
    rate.addEventListener('input', () => { S.rate = parseFloat(rate.value); rateLbl.textContent = S.rate.toFixed(2) + 'x'; saveS(); });
    const auto = h('input', { type: 'checkbox' }); auto.checked = S.autoRead; auto.addEventListener('change', () => { S.autoRead = auto.checked; saveS(); });
    const sfx = h('input', { type: 'checkbox' }); sfx.checked = S.sfx; sfx.addEventListener('change', () => { S.sfx = sfx.checked; saveS(); });
    const fb = h('select', {}, h('option', { value: 'en' }, 'English (UK) 英式英語'), h('option', { value: 'zh' }, '廣東話解釋 + 英文示範句'));
    fb.value = S.enFeedback; fb.addEventListener('change', () => { S.enFeedback = fb.value; saveS(); });
    b.append(h('h3', { style: 'margin:26px 0 4px' }, '🔊 語音設定'),
      h('label', { class: 'fl' }, '廣東話聲音（zh-HK）'), h('div', { class: 'keyrow' }, selZh, h('button', { class: 'btn sm ghost', type: 'button', onclick: e => TTS.speak('你好呀！我係阿辯，一齊學辯論啦！', e.currentTarget) }, '🔊 試聽')),
      h('label', { class: 'fl' }, '英文聲音（en-GB）'), h('div', { class: 'keyrow' }, selEn, h('button', { class: 'btn sm ghost', type: 'button', onclick: e => TTS.speak('Hello! Welcome to Debate Island. Shall we practise together?', e.currentTarget) }, '🔊 Test')),
      h('label', { class: 'fl' }, '講嘢速度 ', rateLbl), rate,
      h('label', { class: 'toggle', style: 'margin-top:14px' }, auto, '入到每頁自動朗讀'),
      h('label', { class: 'toggle', style: 'margin-top:10px' }, sfx, '遊戲音效'),
      h('label', { class: 'fl' }, '英文辯題：評語同拆解用咩語言？'), fb,
      h('div', { class: 'note' }, '🍎 iPad 搵唔到廣東話聲音？去「設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文 → 中文（香港）」下載（例如 Sinji），然後重新開呢個網頁。Windows 可以喺「設定 → 時間與語言 → 語音」加入「中文（香港）」。Chrome 電腦版通常有 Google 粵語。'));
    // ---- profile ----
    const nm = h('input', { type: 'text', value: P.name, placeholder: '例如：小明', maxlength: '20' });
    const gr = h('div', { class: 'seg' });
    const drawGr = () => { gr.innerHTML = ''; Object.entries(GRADES).forEach(([k, v]) => gr.append(h('button', { type: 'button', class: P.grade === k ? 'on' : '', style: 'min-width:80px', onclick: () => { P.grade = k; saveP(); drawGr(); } }, v.zh))); };
    drawGr();
    nm.addEventListener('input', () => { P.name = nm.value.trim(); saveP(); });
    b.append(h('h3', { style: 'margin:26px 0 4px' }, '👧 我嘅資料'),
      h('div', { class: 'muted' }, 'AI 會按年級調整問題難度同評分標準。'),
      h('label', { class: 'fl' }, '名（可以用花名）'), nm,
      h('label', { class: 'fl' }, '年級'), gr,
      h('div', { class: 'row', style: 'margin-top:26px' }, h('button', { class: 'btn ghost sm', onclick: () => { if (!confirm('確定重設所有星星、獎章同紀錄？')) return; G = { stars: 0, badges: [], practiceCount: 0, seenLessons: [], history: [] }; saveG(); updateStars(); toast('已重設進度'); } }, '♻️ 重設進度')));
    openModal('settingsModal');
    if (focusAI) setTimeout(() => (S.apiKey ? model : key).focus(), 300);
  },
  fillVoices() {
    if (!this.selZh) return;
    const mk = (sel, list, all, cur, label) => {
      sel.innerHTML = '';
      sel.append(h('option', { value: '' }, label));
      const seen = new Set();
      [...list, ...all].forEach(v => { if (seen.has(v.voiceURI)) return; seen.add(v.voiceURI); sel.append(h('option', { value: v.voiceURI }, `${v.name}（${v.lang}）`)); });
      sel.value = cur || '';
    };
    const zh = TTS.zhVoices(), en = TTS.enVoices();
    mk(this.selZh, zh, TTS.voices.filter(v => /^zh/i.test(v.lang)), S.voiceZh, zh.length ? '自動（' + zh[0].name + '）' : '⚠️ 未搵到廣東話聲音');
    mk(this.selEn, en.filter(v => /GB/i.test(v.lang)), en, S.voiceEn, '自動（英式英語優先）');
  }
};

/* =========================================================
   Badges 獎章
   ========================================================= */
function openBadges() {
  const b = $('#badgeBody'); b.innerHTML = '';
  const got = G.badges.length;
  const txt = `你有 ${G.stars} 粒星星，${got} 個獎章。` + BADGES.map(x => `${x.n}：${x.d}，${G.badges.includes(x.id) ? '已經攞到' : '未攞到'}`).join('。');
  b.append(h('div', { class: 'row' }, h('div', { class: 'big-text', style: 'flex:1' }, `⭐ ${G.stars} 粒星星・🏅 ${got}/${BADGES.length} 個獎章`), spk(txt)),
    h('div', { class: 'badges', style: 'margin-top:14px' }, BADGES.map(x => h('div', { class: 'badge' + (G.badges.includes(x.id) ? '' : ' lock') }, h('div', { class: 'be' }, x.e), h('b', {}, x.n), h('small', {}, x.d)))));
  b.append(h('h3', { style: 'margin:24px 0 0' }, '📒 最近 AI 評分紀錄'));
  if (!G.history.length) b.append(h('p', { class: 'muted' }, '仲未有紀錄，去「辯題挑戰」試下啦！'));
  else b.append(h('div', { class: 'hist' }, G.history.slice(0, 15).map(x => h('div', {}, h('span', {}, `${x.motion}（${x.side === 'pro' ? '正' : '反'}）`), h('span', {}, `${x.total}分 ${'⭐'.repeat(x.stars || 0)}`)))));
  openModal('badgeModal');
}

/* =========================================================
   Init
   ========================================================= */
function init() {
  updateStars();
  World.init();
  $('#homeBtn').addEventListener('click', () => { SFX.play('click'); App.go('home'); });
  $('#settingsBtn').addEventListener('click', () => { SFX.play('click'); Settings.open(); });
  $('#badgeBtn').addEventListener('click', () => { SFX.play('click'); openBadges(); });
  $$('.back').forEach(x => x.addEventListener('click', () => { SFX.play('click'); App.go('home'); }));
  $$('.island-btn').forEach(x => x.addEventListener('click', () => { SFX.play('click'); App.go(x.dataset.go); }));
  $('#learnSpk').append(spk(() => Learn.speakText(LESSONS[Learn.i]), { label: '朗讀呢一課' }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) TTS.stop(); });
  App.go('home');
  if (!P.name && !LS.get('welcomed', false)) {
    LS.set('welcomed', true);
    const nm = h('input', { type: 'text', placeholder: '例如：小明', maxlength: '20' });
    const gr = h('div', { class: 'seg' });
    const draw = () => { gr.innerHTML = ''; Object.entries(GRADES).forEach(([k, v]) => gr.append(h('button', { type: 'button', class: P.grade === k ? 'on' : '', style: 'min-width:80px', onclick: () => { P.grade = k; draw(); } }, v.zh))); };
    draw();
    const hello = '你好呀！我係阿辯，辯辯島嘅島主。你叫咩名？讀幾年級？話俾我知，我就可以幫你揀啱你嘅挑戰！';
    showMsg('🦉 歡迎嚟到辯辯島！', [
      sayRow(hello),
      h('label', { class: 'fl' }, '你叫咩名？'), nm,
      h('label', { class: 'fl' }, '你讀幾年級？'), gr,
      h('div', { class: 'row', style: 'margin-top:18px' }, h('button', { class: 'btn go', onclick: () => { P.name = nm.value.trim(); saveP(); closeModal('msgModal'); SFX.play('win'); World.cheer(2); Home.enter(); } }, '🚀 出發！'))
    ]);
    $('#msgModal .modal-head').style.background = 'var(--sun)';
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
</body>
</html>
