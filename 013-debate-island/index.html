<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="辯辯島">
<meta name="theme-color" content="#86d6ff">
<meta name="description" content="辯辯島 Debate Island：給 6 至 12 歲小朋友嘅辯論訓練遊戲，有廣東話語音、AI 評分同自訂辯題拆解。">
<title>辯辯島 Debate Island｜小學辯論訓練</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#1d2445; --ink2:#4a5480;
  --paper:#fffdf6; --paper2:#fff3d6;
  --sun:#ffd23f; --coral:#ff7a6b; --mint:#3ddc97; --grape:#a898ff; --sky:#6cc8ff;
  --pro:#ff6b6b; --con:#4f8cff;
  --claim:#ffb020; --reason:#3ddc97; --evid:#6cc8ff; --strat:#a898ff; --deliv:#ff8fc2;
  --line:3px solid var(--ink);
  --f:"Noto Sans HK","PingFang HK","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --fd:"Baloo 2","Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);font-size:19px;line-height:1.6;
  background:linear-gradient(180deg,#86d6ff 0%,#bfeaff 48%,#fff0c9 100%);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
textarea,input,select{-webkit-user-select:text;user-select:text;font-family:var(--f)}
button{font-family:var(--f);color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #2b6cff;outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#app{position:fixed;inset:0;z-index:1;pointer-events:none}
.ui{pointer-events:auto}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:5}
.logo{display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--line);border-radius:999px;padding:4px 18px 4px 6px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:21px;cursor:pointer;min-height:54px}
.logo .owl{font-size:30px;line-height:1}
.logo .nm{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.logo small{font-family:var(--fd);font-weight:800;font-size:14px;color:#6b5bd6}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--sun);border:var(--line);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-family:var(--fd);font-weight:800;font-size:22px;min-height:54px}
.pill.bump{animation:bump .5s}
.icon-btn{width:54px;height:54px;border-radius:50%;border:var(--line);background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:25px;cursor:pointer;display:grid;place-items:center;padding:0}
.icon-btn:active,.logo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.home-bottom{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 16px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 14px}
.bubble{position:relative;max-width:780px;width:100%;background:var(--paper);border:var(--line);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:14px 14px 14px 20px;display:flex;gap:12px;align-items:center}
.bubble::before{content:"";position:absolute;top:-17px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom:17px solid var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:12px solid var(--paper);border-top:0}
.bubble p{margin:0;flex:1;font-weight:700;font-size:20px}
.island-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:1040px}
.island-btn{--c:var(--sun);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;border:var(--line);border-radius:26px;background:var(--c);box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .08s}
.island-btn .ib-emoji{font-size:42px;line-height:1.1}
.island-btn b{font-size:23px;font-weight:900;line-height:1.3}
.island-btn small{font-size:15px;font-weight:700;opacity:.85;line-height:1.3;text-align:center}
.island-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.fallback-owl{display:none;position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:150px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(29,36,69,.15))}
.no3d .fallback-owl{display:block}
.no3d #bg{display:none}

/* ---------- sheets ---------- */
.sheet{position:absolute;top:calc(var(--safe-t) + 80px);bottom:calc(var(--safe-b) + 12px);left:12px;right:12px;margin:0 auto;max-width:900px;
  background:rgba(255,253,246,.97);border:var(--line);border-radius:30px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .35s cubic-bezier(.2,1.3,.4,1)}
@media (min-width:1100px){.sheet{left:28px;right:auto;width:min(860px,63vw);margin:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--line);background:var(--hc,var(--sun))}
.sheet-head h2{margin:0;font-size:25px;font-weight:900;flex:1;line-height:1.2}
.sheet-head h2 small{display:block;font-family:var(--fd);font-size:15px;font-weight:800;opacity:.75}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px;overscroll-behavior:contain}

/* ---------- common components ---------- */
.btn{--bc:var(--sun);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--line);border-radius:18px;background:var(--bc);box-shadow:0 5px 0 var(--ink);
  padding:12px 20px;font-size:20px;font-weight:900;min-height:56px;cursor:pointer;transition:transform .08s;line-height:1.25;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{font-size:17px;min-height:46px;padding:8px 14px;border-radius:14px}
.btn.ghost{--bc:#fff}
.btn.go{--bc:var(--mint)}
.btn.pro{--bc:var(--pro);color:#fff}
.btn.con{--bc:var(--con);color:#fff}
.btn.grape{--bc:var(--grape)}
.btn.coral{--bc:var(--coral)}
.btn.sky{--bc:var(--sky)}
.btn.block{width:100%}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:var(--line);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:21px;display:grid;place-items:center;cursor:pointer;padding:0;line-height:1}
.spk.sm{width:38px;height:38px;font-size:17px;border-width:2px}
.spk.playing{background:var(--mint);animation:pulse .9s infinite}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{background:#fff;border:var(--line);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:16px 18px}
.card.tint{background:var(--bg,var(--paper2))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.say{display:flex;gap:10px;align-items:flex-start}
.say>p,.say>div.txt{margin:0;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--c,#fff);font-weight:800;font-size:15px;line-height:1.5}
.chip.big{font-size:17px;padding:5px 14px}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-size:22px;font-weight:900}
.sec-title .e{font-size:28px}
.sec-title .grow{flex:1}
.muted{color:var(--ink2);font-size:16px}
.big-text{font-size:23px;font-weight:900;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lab{font-weight:900;margin-right:4px}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;font-size:19px;border:var(--line);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical;line-height:1.6}
label.fl{display:block;font-weight:900;margin:14px 0 6px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:26px;height:26px;accent-color:#2bb673}

/* ---------- learn ---------- */
.lesson{text-align:center;padding:20px 18px}
.lesson .le{font-size:78px;line-height:1.1;display:inline-block;animation:bob 3s ease-in-out infinite}
.lesson h3{margin:6px 0 0;font-size:30px;font-weight:900}
.lesson .en{font-family:var(--fd);font-weight:800;color:#6b5bd6;font-size:19px}
.lesson .body{text-align:left;margin-top:14px;font-size:21px;font-weight:500}
.lesson .ex{text-align:left;margin-top:14px;background:var(--paper2);border:2px dashed var(--ink);border-radius:16px;padding:12px 14px;font-size:19px}
.dots{display:flex;justify-content:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.dots button{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dots button.on{background:var(--sun);transform:scale(1.35)}
.dots button.seen{background:#ffe89a}

/* ---------- games ---------- */
.game-card{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:var(--c);padding:18px}
.game-card .ge{font-size:52px;line-height:1}
.game-card b{font-size:24px}
.statement{font-size:24px;font-weight:900;background:var(--paper2);border:var(--line);border-radius:20px;padding:16px 18px;position:relative}
.ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:600px){.ans-grid{grid-template-columns:1fr}}
.ans-btn{font-size:22px;min-height:80px;flex-direction:column;gap:0}
.ans-btn small{font-family:var(--fd);font-size:14px;opacity:.8}
.opt-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px;font-size:19px;font-weight:700;cursor:pointer}
.opt-btn .let{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800}
.opt-btn.right{background:#d8ffe9}
.opt-btn.wrong{background:#ffe0dc}
.correct-flash{animation:wiggle .5s}
.feedback{border-left:10px solid var(--c,var(--mint))}
.scoreline{font-family:var(--fd);font-weight:800;font-size:20px}

/* ---------- practice ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:800;cursor:pointer;min-height:44px}
.filters button.on{background:var(--ink);color:#fff}
.motion-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:12px 12px 12px 16px;cursor:pointer}
.motion-card .mt{flex:1;font-size:20px;font-weight:900;line-height:1.4}
.motion-card .mt small{display:block;font-size:15px;font-weight:700;color:var(--ink2)}
.motion-list{display:grid;gap:12px}
.banner{background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.banner .bt{flex:1}
.banner .bt small{display:block;opacity:.75;font-size:15px;font-weight:700}
.banner .bt b{font-size:22px;line-height:1.4;display:block}
.banner .spk{box-shadow:none;border-color:#fff}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side-btn{flex-direction:column;min-height:150px;font-size:26px;border-radius:24px}
.side-btn small{font-size:16px;font-weight:700;opacity:.95}
.side-btn .se{font-size:44px;line-height:1}
.coin{width:120px;height:120px;border-radius:50%;margin:10px auto;border:var(--line);background:radial-gradient(circle at 35% 30%,#fff6c2,var(--sun) 60%,#e0a800);display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 6px 0 var(--ink)}
.coin.flip{animation:flip 1.3s ease-out}
.progress{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pdot{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-family:var(--fd);font-weight:800;font-size:18px;cursor:pointer}
.pdot.done{background:#d8ffe9}
.pdot.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.q-text{font-size:23px;font-weight:900;line-height:1.45}
.q-helper{font-size:17px;color:var(--ink2);font-weight:700;margin-top:8px}
.hint{background:#fffbe6;border:2px dashed var(--ink);border-radius:16px;padding:10px 12px;font-size:18px}
.ta-wrap{position:relative;margin-top:12px}
.ta-wrap textarea{padding-bottom:64px}
.ta-tools{position:absolute;right:10px;bottom:12px;display:flex;gap:8px;align-items:center}
.mic{width:54px;height:54px;border-radius:50%;border:var(--line);background:var(--coral);font-size:24px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.mic.rec{background:#ff3b3b;animation:pulse .8s infinite}
.count{font-size:14px;color:var(--ink2);font-weight:700}
.nav{margin-top:18px;justify-content:space-between}

/* ---------- results ---------- */
.score-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:150px;height:150px;border-radius:50%;border:var(--line);box-shadow:0 6px 0 var(--ink);background:conic-gradient(var(--mint) calc(var(--p)*1%),#ececf4 0);display:grid;place-items:center;flex:none}
.ring>div{width:108px;height:108px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:44px;line-height:1}
.ring>div small{font-size:14px;display:block;text-align:center}
.stars{font-size:40px;letter-spacing:2px;line-height:1.2}
.stars span{display:inline-block;animation:starPop .5s both}
.stars span.off{filter:grayscale(1);opacity:.3}
.rtitle{display:inline-block;background:var(--grape);border:var(--line);border-radius:14px;padding:4px 14px;font-weight:900;font-size:21px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--ink)}
.dim{margin-top:12px}
.dim-top{display:flex;align-items:center;gap:10px;font-weight:900}
.dim-top .nm{flex:1}
.bar{height:18px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;width:0;background:var(--c);transition:width 1.1s cubic-bezier(.2,1,.3,1)}
.list-say{display:grid;gap:10px}
.item{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 12px}
.improve{border-left:10px solid var(--coral)}
.improve .ex{margin-top:6px;background:var(--paper2);border-radius:10px;padding:8px 10px;font-size:18px}
.better{background:#f1edff}

/* ---------- breakdown ---------- */
.tabs{display:flex;gap:10px;margin:8px 0 12px}
.tabs button{flex:1;min-height:54px;border:var(--line);border-radius:16px;font-size:19px;font-weight:900;background:#fff;cursor:pointer}
.tabs button.on.pro{background:var(--pro);color:#fff}
.tabs button.on.con{background:var(--con);color:#fff}
.arg{border-left:12px solid var(--c)}
.arg .rank{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.arg .rank b{font-size:18px}
.arg-row{margin-top:10px}
.arg-row .lbl{display:inline-block;font-size:15px;font-weight:900;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;background:var(--c);margin-bottom:4px}
.warn{font-size:16px;color:#8a4b00;background:#fff4e0;border-radius:10px;padding:6px 10px;margin-top:8px}
.rebut-pair{display:grid;gap:6px}
.rebut-pair .they{background:#f0f2f8;border-radius:14px;padding:8px 12px}
.rebut-pair .you{background:#e3fff0;border-radius:14px;padding:8px 12px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.mode-grid,.side-grid{grid-template-columns:1fr}}
.mode-card{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#fff;position:relative}
.mode-card.on{background:var(--c);transform:translateY(-3px)}
.mode-card .me{font-size:44px;line-height:1}
.mode-card b{font-size:22px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;border:var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:900;min-height:52px;cursor:pointer}
.seg button.on{background:var(--c,var(--sun));box-shadow:0 4px 0 var(--ink)}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,36,69,.45);display:none;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px)}
.modal.open{display:flex}
.modal-box{background:var(--paper);border:var(--line);border-radius:28px;box-shadow:0 8px 0 var(--ink);width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .3s cubic-bezier(.2,1.3,.4,1)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--line);background:var(--sky)}
.modal-head h2{margin:0;flex:1;font-size:24px}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 26px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;font-size:15px;font-weight:800;cursor:pointer;min-height:40px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.note{font-size:15px;background:#eef8ff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:12px;line-height:1.55}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{text-align:center;background:#fff;border:var(--line);border-radius:18px;padding:10px 8px}
.badge .be{font-size:44px;line-height:1.2}
.badge b{display:block;font-size:17px}
.badge small{display:block;font-size:13px;color:var(--ink2);line-height:1.35}
.badge.lock{opacity:.4;filter:grayscale(1)}
.hist{display:grid;gap:8px;margin-top:10px}
.hist div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:16px;display:flex;gap:8px}
.hist div span:first-child{flex:1}
.thinking{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(255,253,246,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-align:center;padding:20px}
.thinking.open{display:flex}
.thinking .to{font-size:110px;animation:think 1.4s ease-in-out infinite;line-height:1}
.thinking p{margin:0;font-size:24px;font-weight:900;background:#fff;border:var(--line);border-radius:18px;padding:10px 18px;box-shadow:0 5px 0 var(--ink)}
.thinking small{font-size:16px;color:var(--ink2);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%) translateY(150%);z-index:80;background:var(--ink);color:#fff;border-radius:18px;padding:12px 20px;font-weight:800;font-size:18px;max-width:92vw;transition:transform .3s cubic-bezier(.2,1.3,.4,1);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetto{position:fixed;top:-20px;z-index:90;width:12px;height:18px;border:2px solid var(--ink);border-radius:3px;pointer-events:none;animation:fall linear forwards}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- storage (Local Storage) ---------- */
const LS = {

const DEFAULT_SETTINGS = { baseUrl: 'https://api.z.ai/api/paas/v4', model: 'glm-5.3', apiKey: '', rate: 0.9, autoRead: false, sfx: true, enFeedback: 'en', voiceZh: '', voiceEn: '' };
let S = Object.assign({}, DEFAULT_SETTINGS, LS.get('settings', {}));
let P = Object.assign({ name: '', grade: 'P3' }, LS.get('profile', {}));
let G = Object.assign({ stars: 0, badges: [], practiceCount: 0, seenLessons: [], history: [] }, LS.get('progress', {}));

/* ---------- toast / confetti / sound ---------- */
let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function confetti(n = 70) {

    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.append(c);
    setTimeout(() => c.remove(), 4300);
  }

}
const SFX = {
  ctx: null,
  play(kind) {
    if (!S.sfx) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const seqs = {
        click: [[660, .06, 'triangle']],
        good: [[660, .09], [880, .09], [1320, .16]],
        bad: [[320, .14, 'sawtooth'], [240, .2, 'sawtooth']],
        win: [[523, .11], [659, .11], [784, .11], [1047, .32]],
        flip: [[400, .05], [500, .05], [600, .05], [700, .05], [800, .05], [900, .08]]

      let t = c.currentTime;
      for (const [f, d, ty] of seqs[kind] || []) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = ty || 'triangle'; o.frequency.value = f;

/* ---------- 廣東話 / 英式英語 語音朗讀 (Text-to-Speech) ---------- */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu;
const TTS = {
  supported: 'speechSynthesis' in window,
  voices: [], token: 0, curBtn: null, unlocked: false,
  load() { if (this.supported) this.voices = speechSynthesis.getVoices() || []; },
  zhVoices() { return this.voices.filter(v => /zh[-_]HK|yue/i.test(v.lang) || /cantonese|粵|廣東|香港|hong ?kong/i.test(v.name)); },
  enVoices() { return this.voices.filter(v => /^en/i.test(v.lang)); },
  pick(lang) {
    const vs = this.voices;
    if (lang === 'zh') {
      return (S.voiceZh && vs.find(v => v.voiceURI === S.voiceZh)) || this.zhVoices()[0] || null;
    }
    return (S.voiceEn && vs.find(v => v.voiceURI === S.voiceEn)) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  clean(t) {
    return str(t).replace(EMOJI_RE, ' ').replace(/[*#_`>~|]/g, ' ').replace(/[「」『』“”"]/g, '').replace(/…+|\.\.\.+/g, '，').replace(/\s+/g, ' ').trim();
  },
  chunks(text) {
    const t = this.clean(text);
    const parts = t.replace(/([。！？!?；;：\n])/g, '$1\u0001').replace(/([.])\s+/g, '$1\u0001').split('\u0001');
    const out = [];
    for (let p of parts) {
      p = p.trim(); if (!p || /^[\s,，、.。:：;；!?！？()（）\-–—]+$/.test(p)) continue;
      while (p.length > 130) {
        let cut = p.lastIndexOf('，', 130);
        if (cut < 30) cut = p.lastIndexOf(',', 130);
        if (cut < 30) cut = p.lastIndexOf(' ', 130);
        if (cut < 30) cut = 130;
        out.push(p.slice(0, cut + 1)); p = p.slice(cut + 1).trim();
      }
      if (p) out.push(p);
    }
    return out.map(x => ({ text: x, lang: /[\u3400-\u9fff]/.test(x) ? 'zh' : 'en' }));
  },
  speak(text, btn, onDone) {
    if (!this.supported) { toast('呢個瀏覽器唔支援語音朗讀 😢'); if (onDone) onDone(false); return; }
    const same = btn && this.curBtn === btn;
    this.stop();
    if (same) return;
    const list = this.chunks(text); if (!list.length) { if (onDone) onDone(true); return; }
    this.cb = onDone || null;
    if (!this.voices.length) this.load();
    if (!this.pick('zh') && list.some(c => c.lang === 'zh') && !this.warned) {
      this.warned = true; toast('搵唔到廣東話聲音，請睇⚙️設定入面嘅教學', 4000);
    }
    const token = this.token;
    this.curBtn = btn || null; if (btn) btn.classList.add('playing');
    World.talk(true);
    setTimeout(() => {
      if (token !== this.token) return;
      list.forEach((c, i) => {
        const u = new SpeechSynthesisUtterance(c.text);
        const v = this.pick(c.lang);
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = c.lang === 'zh' ? 'zh-HK' : 'en-GB';
        u.rate = S.rate; u.pitch = c.lang === 'zh' ? 1.08 : 1.0;
        if (i === list.length - 1) u.onend = u.onerror = () => { if (token === this.token) this.done(true); };
        speechSynthesis.speak(u);
      });
    }, 60);
  },
  done(natural) { if (this.curBtn) this.curBtn.classList.remove('playing'); this.curBtn = null; World.talk(false); const cb = this.cb; this.cb = null; if (cb) cb(!!natural); },
  stop() { this.token++; if (this.supported) { try { speechSynthesis.cancel(); } catch (e) {} } this.done(); },
  unlock() {
    if (this.unlocked || !this.supported) return; this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  }
};

  TTS.load();

/* ---------- 語音輸入 (Speech-to-Text) ---------- */
const STT = {
  R: window.SpeechRecognition || window.webkitSpeechRecognition,

    r.onerror = e => { if (e.error !== 'aborted') toast('聽唔清楚，再試一次？（' + e.error + '）'); };
    r.onend = () => { btn.classList.remove('rec'); this.rec = null; };
    this.rec = r; btn.classList.add('rec');
    try { r.start(); toast(lang === 'en' ? '🎤 Speak now…' : '🎤 請講嘢…', 1600); } catch (e) { btn.classList.remove('rec'); this.rec = null; }
  }
};

/* ---------- AI client (OpenAI-compatible or Anthropic) ---------- */
class NoKeyError extends Error {}
function aiReady() { return !!(S.apiKey && S.baseUrl && S.model); }
async function callAI(system, user, { json = true, maxTokens = 4000, timeout = 150000 } = {}) {
  if (!aiReady()) throw new NoKeyError('NOKEY');
  const base = S.baseUrl.trim().replace(/\/+$/, '');
  const isAnthropic = /anthropic\.com/i.test(base) || /\/messages$/.test(base);
  const isZhipu = /(^|\.|\/)(z\.ai|bigmodel\.cn)(\/|$)/i.test(base.replace(/^https?:\/\//, ''));
  if (isZhipu) timeout = Math.max(timeout * 2, 90000); // GLM-5.3 一定會先「思考」，要耐啲
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), timeout);
  try {
    let res, data, text = '';
    if (isAnthropic) {
      const url = /\/messages$/.test(base) ? base : (/\/v1$/.test(base) ? base + '/messages' : base + '/v1/messages');
      res = await fetch(url, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: S.model.trim(), max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] })
      });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(apiErr(res, data));
      text = arr(data.content).filter(b => b.type === 'text').map(b => b.text).join('\n');
    } else {
      const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
      res = await fetch(url, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.apiKey.trim() },
        body: JSON.stringify(Object.assign({ model: S.model.trim(), messages: [{ role: 'system', content: system }, { role: 'user', content: user }] },
          isZhipu ? Object.assign({ max_tokens: 32768 }, json ? { response_format: { type: 'json_object' } } : {}) : {}))
      });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(apiErr(res, data));
      const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      text = Array.isArray(c) ? c.map(x => x.text || '').join('\n') : str(c);
    }
    if (!text.trim()) throw new Error('AI 冇回覆任何內容，請再試一次。');
    return json ? parseJSON(text) : text;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('等咗太耐（超時），請再試一次。');
    if (e instanceof TypeError) throw new Error('連唔到伺服器（' + e.message + '）。可能係 Base URL 錯咗、冇上網，或者呢個 AI 供應商唔俾瀏覽器直接連接（CORS）。');
    throw e;
  } finally { clearTimeout(tm); }
}
function apiErr(res, data) {
  const m = (data && (data.error && (data.error.message || data.error)) || data.message) || res.statusText;
  const hint = res.status === 401 ? '（API Key 唔啱）' : res.status === 404 ? '（Base URL 或者 Model 名唔啱）' : res.status === 429 ? '（用得太密或者額度用完）' : '';
  return `HTTP ${res.status} ${hint} ${typeof m === 'string' ? m : JSON.stringify(m)}`.trim();
}
function parseJSON(t) {
  let s = str(t).replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e) {
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1').replace(/[\u201c\u201d]/g, '"')); }
    catch (e2) { throw new Error('AI 回覆嘅格式有少少問題，請再試一次。'); }
  }
}
const THINK_MSGS = ['阿辯諗緊…🤔', '翻緊辯論秘笈📖', '搵緊最有力嘅論點💡', '計緊分數🧮', '準備緊貼士✨'];

  if (e instanceof NoKeyError) {

function studentLine() {

function langRule(lang) {
  if (lang === 'zh') return '【語言規則】全部內容用香港繁體中文，唔好用簡體字。解釋、評語、提示用親切嘅廣東話口語（例如：係、嘅、咗、唔、佢哋、點解）；示範發言（例如開場白、反駁句、升級版示範、句子開頭）用適合香港小學辯論比賽嘅正式語體（書面語為主）。';
  if (fbLang('en') === 'en') return '[Language rule] The motion is in English. Write EVERY text field in simple British English suitable for primary pupils in Hong Kong. Use British spelling and vocabulary (e.g. colour, favourite, organise, practise (verb), programme, pupils, mum, maths, adjudicator, Madam Chair).';
  return '【語言規則】辯題係英文。解釋、評語、提示用香港繁體中文廣東話口語；但所有論點句、示範發言、開場白、反駁句、升級版示範、句子開頭都要用簡單嘅英式英文（British spelling，例如 colour, favourite, organise），方便學生直接喺英文比賽用。';
}

2. reasoning 論證：有冇解釋「點解」？因果關係合唔合理？
3. evidence 論據：例子、數據或經驗係咪具體、相關、可信？
4. strategy 反駁與策略：有冇預計對方講法並回應？有冇用定義、比較等策略？

唔好講學生冇寫過嘅嘢係佢寫嘅。建議要具體，最好附示範句子。

  return [sys, user];

  });
  let total = Number(r.total); if (!isFinite(total)) total = scores.reduce((a, x) => a + x.score, 0);
  total = clamp(Math.round(total), 0, 100);
  let stars = Number(r.stars); if (!isFinite(stars) || stars < 1) stars = total >= 90 ? 5 : total >= 75 ? 4 : total >= 60 ? 3 : total >= 40 ? 2 : 1;
  return {
    total, stars: clamp(Math.round(stars), 1, 5), title: str(r.title), summary: str(r.summary), scores,
    strengths: arr(r.strengths).map(str).filter(Boolean),
    improvements: arr(r.improvements).map(x => typeof x === 'string' ? { point: x } : { point: str(x.point), how: str(x.how), example: str(x.example) }),

}

}

    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast('📋 已複製！'), fallback); else fallback();
  }
};

const newId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const esc = s => str(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDate(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const sideTxt = (side, lang) => (side === 'pro' || side === 'con') ? sideName(side, lang) : '未決定立場';

const Library = {
  items: arr(LS.get('library', [])).filter(e => e && e.id),
  list() { return this.items.filter(e => !e.deleted && e.data).sort((a, b) => str(b.createdAt).localeCompare(str(a.createdAt))); },
  get(id) { return this.items.find(e => e.id === id); },
  persist() {
    try { localStorage.setItem('dbi_library', JSON.stringify(this.items)); return true; }
    catch (e) { toast('⚠️ 呢部機嘅儲存空間滿咗！請去「📂 我的收藏」匯出備份，再刪除一啲舊紀錄。', 6000); return false; }
  },
  add(o) {
    const t = nowISO();
    const e = Object.assign({ id: newId(), createdAt: t, updatedAt: t, deleted: false, who: P.name || '', grade: P.grade || '' }, o);
    this.items.unshift(e);
    if (this.persist()) setTimeout(() => toast('💾 已自動儲存到「📂 我的收藏」'), 1800);
    Cloud.put(e); this.changed();
    return e;
  },
  remove(id) {
    const e = this.get(id); if (!e) return;
    Object.assign(e, { deleted: true, data: null, updatedAt: nowISO() });
    this.persist(); Cloud.put(e); this.changed();
  },
  /* 只接受已知欄位（用於匯入同雲端資料） */
  clean(x) {
    if (!x || typeof x !== 'object') return null;
    if (typeof x.id !== 'string' || !/^[A-Za-z0-9_-]{4,64}$/.test(x.id)) return null;
    if (!['breakdown', 'eval', 'sample'].includes(x.type)) return null;
    const e = {
      id: x.id, type: x.type, src: str(x.src).slice(0, 20) || 'custom', motion: str(x.motion).slice(0, 400),
      lang: x.lang === 'en' ? 'en' : 'zh', side: ['pro', 'con', 'none'].includes(x.side) ? x.side : 'none',
      who: str(x.who).slice(0, 40), grade: str(x.grade).slice(0, 4),
      createdAt: str(x.createdAt) || nowISO(), updatedAt: str(x.updatedAt) || str(x.createdAt) || nowISO(),
      deleted: !!x.deleted, data: null
    };
    if (!e.deleted) {
      const d = x.data;
      if (!d || typeof d !== 'object') return null;
      if (e.type === 'breakdown') { if (!d.d || typeof d.d !== 'object') return null; e.data = { d: d.d }; }
      else if (e.type === 'sample') {
        if (!d.s || typeof d.s !== 'object' || !Array.isArray(d.s.segs)) return null;
        const f = d.fmt && typeof d.fmt === 'object' ? d.fmt : {};
        e.data = { s: d.s, fmt: { key: SAMPLE_FORMATS[f.key] ? f.key : (e.lang === 'en' ? 'en3' : 'zh4'), free: !!f.free, mins: clamp(Number(f.mins) || 3, 1, 8), register: str(f.register) } };
      }
      else { if (!d.result || typeof d.result !== 'object') return null; e.data = { steps: arr(d.steps), answers: arr(d.answers).map(str), result: d.result }; }
    }
    return e;
  },
  /* 合併：新啲嘅版本勝出 → 'added' | 'updated' | null */
  merge(x, restore) {
    const e = this.clean(x); if (!e) return null;
    const i = this.items.findIndex(y => y.id === e.id);
    if (i < 0) { if (e.deleted) return null; this.items.push(e); return 'added'; }
    if (restore && this.items[i].deleted && !e.deleted) { e.updatedAt = nowISO(); this.items[i] = e; return 'added'; } // 匯入備份 = 救返已刪除嘅
    if (e.updatedAt > str(this.items[i].updatedAt)) { this.items[i] = e; return 'updated'; }
    return null;
  },
  changed() { if (App.cur === 'library') LibraryScr.drawList(); }
};

/* =========================================================
   Exporter 匯出（.json 備份檔 / .html 閱讀文件）
   ========================================================= */
const Exporter = {
  stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; },
  safe(s) { return str(s).replace(/[\\/:*?"<>|\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 24) || '辯題'; },
  make(entries, kind) {
    const base = entries.length === 1 ? '辯辯島-' + this.safe(entries[0].motion) : `辯辯島-收藏-${entries.length}項`;
    const name = `${base}-${this.stamp()}.${kind}`;
    if (kind === 'json') {
      const clean = entries.map(e => ({ id: e.id, type: e.type, src: e.src, motion: e.motion, lang: e.lang, side: e.side, who: e.who, grade: e.grade, createdAt: e.createdAt, updatedAt: e.updatedAt, data: e.data }));
      const body = JSON.stringify({ app: 'debate-island', format: 1, exportedAt: nowISO(), count: clean.length, entries: clean }, null, 2);
      return { name, mime: 'application/json', blob: new Blob([body], { type: 'application/json' }) };
    }
    return { name, mime: 'text/html', blob: new Blob([this.docHTML(entries)], { type: 'text/html;charset=utf-8' }) };
  },
  download(f) {
    const url = URL.createObjectURL(f.blob);
    const a = h('a', { href: url, download: f.name, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('⬇️ 已下載：' + f.name, 4000); SFX.play('good');
  },
  fileObj(f) { try { return new File([f.blob], f.name, { type: f.mime }); } catch (e) { return null; } },
  canShare(f) { try { const x = this.fileObj(f); return !!(x && navigator.canShare && navigator.share && navigator.canShare({ files: [x] })); } catch (e) { return false; } },
  share(f) {
    navigator.share({ files: [this.fileObj(f)], title: f.name })
      .then(() => SFX.play('good'))
      .catch(e => { if (e && e.name !== 'AbortError') this.download(f); });
  },
  dialog(entries) {
    entries = entries.filter(e => e && !e.deleted && e.data);
    if (!entries.length) { toast('未有收藏可以匯出'); return; }
    const intro = (entries.length === 1 ? `匯出「${entries[0].motion}」。` : `匯出全部 ${entries.length} 項收藏。`) +
      '揀一個格式：備份檔可以喺另一部機匯入返嚟；閱讀文件可以用瀏覽器或者 Word 打開，亦可以列印。';
    const row = (e, t, d, kind) => {
      const f = this.make(entries, kind);
      return h('div', { class: 'exp-row' },
        h('div', { class: 'grow' }, h('b', {}, e + ' ' + t), h('div', { class: 'muted', style: 'font-size:15px' }, d)),
        h('button', { class: 'btn sm go', onclick: () => this.download(f) }, '⬇️ 下載'),
        this.canShare(f) ? h('button', { class: 'btn sm sky', onclick: () => this.share(f) }, '📤 分享') : null);
    };
    showMsg('⬇️ 匯出收藏', [
      sayRow(intro),
      row('📦', '備份檔（.json）', '搬去另一部機：喺嗰部機「📂 我的收藏 → ⬆️ 匯入備份檔」。', 'json'),
      row('📄', '閱讀文件（.html）', '用瀏覽器、Word 打開，或者列印成 PDF。', 'html'),
      h('div', { class: 'note' }, '📱 iPad：「下載」會存入「檔案」App 嘅「下載項目」；「分享」可以用 AirDrop 傳去電腦，或者用電郵寄俾自己。')
    ]);
    $('#msgModal .modal-head').style.background = 'var(--sky)';
  },
  /* 可讀文件 */
  docHTML(entries) {
    const H3 = (t, inner) => inner ? `<h3>${esc(t)}</h3>${inner}` : '';
    const P_ = t => t ? `<p>${esc(t)}</p>` : '';
    const UL = xs => xs.length ? '<ul>' + xs.map(x => `<li>${x}</li>`).join('') + '</ul>' : '';
    const body = entries.map((e, i) => {
      const L = e.lang;
      let out = `<section><h2>${i + 1}. ${esc(e.motion)}</h2><p class="meta">${e.type === 'breakdown' ? '⚡ AI 拆解' : e.type === 'sample' ? '🎬 全場比賽示範' : '🏅 AI 評分'}・${esc(sideTxt(e.side, L))}・${L === 'en' ? 'English motion' : '中文辯題'}・${esc(fmtDate(e.createdAt))}${e.who ? '・' + esc(e.who) : ''}${e.grade && GRADES[e.grade] ? '（' + GRADES[e.grade].zh + '）' : ''}</p>`;
      if (e.type === 'sample') out += Sample.docHTML(e);
      else if (e.type === 'breakdown') {
        const d = e.data.d || {};
        if (d.kid_tip) out += `<p class="tip">🦉 阿辯提提你：${esc(d.kid_tip)}</p>`;
        out += H3('🧒 辯題講乜？', P_(str(d.motion_explained)));
        out += H3('🔑 關鍵字定義', UL(arr(d.key_terms).filter(t => t && t.term).map(t => `<b>${esc(t.term)}</b>：${esc(t.meaning)}`)));
        if (d.burden) out += H3('⚖️ 雙方要證明乜？', UL([`<b>正方：</b>${esc(d.burden.pro)}`, `<b>反方：</b>${esc(d.burden.con)}`]));
        ['pro', 'con'].forEach(k => {
          const list = arr(d[k]).filter(Boolean).slice().sort((a, b) => (Number(b.strength) || 0) - (Number(a.strength) || 0));
          if (!list.length) return;
          out += `<h3 class="${k}">${k === 'pro' ? '🔴' : '🔵'} ${esc(sideName(k, L))}：最有力嘅論點</h3>` + list.map((a, j) =>
            `<div class="arg ${k}"><p><b>論點 ${j + 1}：</b>${esc(a.claim)} <span class="str">${'💪'.repeat(clamp(Math.round(Number(a.strength) || 3), 1, 5))}</span></p><p><b>論證：</b>${esc(a.reasoning)}</p><p><b>論據：</b>${esc(a.evidence)}</p>${a.evidence_note ? `<p class="warn">⚠️ ${esc(a.evidence_note)}</p>` : ''}</div>`).join('');
        });
        out += H3('⚔️ 雙方交鋒位', UL(arr(d.clash).map(str).filter(Boolean).map(esc)));
        out += H3('♟️ 致勝策略', UL(arr(d.strategies).filter(Boolean).map(s => `<b>${esc(s.name)}：</b>${esc(s.detail)}`)));
        out += H3('🛡️ 反駁攻略', UL(arr(d.rebuttals).filter(Boolean).map(r => `（${r.side === 'con' ? '反方' : '正方'}用）如果對方話：${esc(r.they_say)}<br>👉 你可以咁回應：${esc(r.you_reply)}`)));
        if (d.opening && (d.opening.pro || d.opening.con)) out += H3('🎤 主辯開場白示範', (d.opening.pro ? `<div class="arg pro"><b>${esc(sideName('pro', L))}：</b>${esc(d.opening.pro)}</div>` : '') + (d.opening.con ? `<div class="arg con"><b>${esc(sideName('con', L))}：</b>${esc(d.opening.con)}</div>` : ''));
        out += H3('💡 辯論貼士', UL(arr(d.tips).map(str).filter(Boolean).map(esc)));
      } else {
        const raw = e.data.result || {};
        const r = normResult(Object.assign({}, raw, { better_version: raw.better, next_challenge: raw.next }));
        out += `<p class="score">總分 <b>${r.total}</b> / 100　${'⭐'.repeat(r.stars)}${r.title ? '　🏅 ' + esc(r.title) : ''}</p>` + P_(r.summary);
        out += '<table><tr><th>項目</th><th>得分</th><th>評語</th></tr>' + r.scores.map(s => `<tr><td>${DIMS[s.key].e} ${esc(DIMS[s.key].zh)}</td><td>${s.score}/20</td><td>${esc(s.comment)}</td></tr>`).join('') + '</table>';
        out += H3('👍 做得好嘅地方', UL(r.strengths.map(esc)));
        out += H3('🔧 要改善嘅地方', UL(r.improvements.map(x => `<b>${esc(x.point)}</b>${x.how ? '<br>👉 ' + esc(x.how) : ''}${x.example ? '<br>✏️ ' + esc(x.example) : ''}`)));
        if (r.better) out += H3('✨ 升級版示範', `<div class="arg">${esc(r.better)}</div>`);
        out += H3('🚀 下一個挑戰', P_(r.next));
        const qa = arr(e.data.steps).map((s, j) => s && s.q ? `<b>${esc(s.stage)}｜${esc(s.q)}</b><br>${esc(e.data.answers[j] || '（冇作答）')}` : '').filter(Boolean);
        out += H3('📝 我嘅答案', UL(qa));
      }
      return out + '</section>';
    }).join('');
    return `<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>辯辯島・我的收藏</title>
<style>body{font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;color:#1d2445;max-width:860px;margin:0 auto;padding:24px 18px 60px;line-height:1.7;font-size:17px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:23px;margin:34px 0 4px;padding-top:18px;border-top:3px solid #1d2445}h3{font-size:19px;margin:20px 0 6px}
h3.pro{color:#c9302c}h3.con{color:#2f6fe0}.meta{color:#4a5480;font-size:14px;margin:0}.tip{background:#fff5c2;border:2px solid #1d2445;border-radius:12px;padding:8px 12px}
.arg{border-left:8px solid #a898ff;background:#f7f7ff;border-radius:8px;padding:6px 12px;margin:10px 0}.arg.pro{border-color:#ff6b6b;background:#fff4f3}.arg.con{border-color:#4f8cff;background:#f2f7ff}.arg p{margin:3px 0}
.warn{color:#8a5a00;font-size:15px}.line{margin:6px 0;padding:6px 10px;border-radius:10px}.line.pro{background:#fff4f3}.line.con{background:#f2f7ff;margin-left:40px}.str{font-size:13px}.score{font-size:20px}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid #c8cbe0;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef0fb}
.foot{margin-top:40px;color:#4a5480;font-size:14px;border-top:1px dashed #c8cbe0;padding-top:10px}@media print{h2{break-before:page}section:first-of-type h2{break-before:auto}}</style></head>
<body><h1>🦉 辯辯島・我的收藏</h1><p class="meta">匯出時間：${esc(fmtDate(nowISO()))}・共 ${entries.length} 項</p>${body}
<p class="foot">由「辯辯島 Debate Island」匯出。AI 提供嘅數據、研究同例子，請記得查證出處先用喺比賽。</p></body></html>`;
  }
};

/* =========================================================
   Cloud 雲端同步（Firebase：Google 登入 + Firestore，可選）
   資料位置：users/{uid}/library/{entryId}
   ========================================================= */
const FB_VER = '12.19.0';
const Cloud = {
  st: 'off', err: '', user: null, synced: false, remote: {}, lastSync: null, m: null, app: null, auth: null, db: null, col: null, unsub: null,
  fromFile() { return !!(FIREBASE_CONFIG && typeof FIREBASE_CONFIG === 'object' && FIREBASE_CONFIG.apiKey); },
  config() {
    const c = this.fromFile() ? FIREBASE_CONFIG : LS.get('fbConfig', null);
    if (!c || !c.apiKey || !c.projectId || !c.appId) return null;
    return Object.assign({ authDomain: c.projectId + '.firebaseapp.com' }, c);
  },
  parse(t) {
    const o = {}; const re = /["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g;
    let m; while ((m = re.exec(str(t)))) o[m[1]] = m[2].trim();
    return o.apiKey && o.projectId && o.appId ? o : null;
  },
  async loadSDK() {
    const u = n => `https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
    const [app, auth, fs] = await Promise.all([import(u('app')), import(u('auth')), import(u('firestore'))]);
    return { app, auth, fs };
  },
  async init() {
    const cfg = this.config();
    if (!cfg) { this.st = 'off'; this.emit(); return; }
    if (this.app || this.st === 'loading') return;
    if (!/^https?:$/.test(location.protocol)) { this.st = 'error'; this.err = '要用 https 網址（例如 GitHub Pages）打開呢個網頁，先可以登入同步。直接喺電腦雙擊檔案開係唔得嘅。'; this.emit(); return; }
    this.st = 'loading'; this.emit();
    try {
      this.m = await this.loadSDK();
      this.app = this.m.app.initializeApp(cfg);
      this.auth = this.m.auth.getAuth(this.app);
      this.db = this.m.fs.getFirestore(this.app);
      this.st = 'ready'; this.err = '';
      this.m.auth.onAuthStateChanged(this.auth, u => this.onUser(u));
    } catch (e) { this.st = 'error'; this.err = '載入唔到 Firebase：' + ((e && e.message) || e) + '（請檢查上網同 Firebase 設定）'; }
    this.emit();
  },
  /* 要喺撳掣嗰一刻直接開彈出視窗（iPad Safari 規定） */
  signIn() {
    if (this.st !== 'ready') { toast(this.st === 'loading' ? '⏳ 仲連接緊 Firebase，等一陣再撳。' : '☁️ 雲端同步未設定好，請去 ⚙️ 設定。'); return; }
    const p = new this.m.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    this.m.auth.signInWithPopup(this.auth, p).then(() => { SFX.play('good'); toast('✅ 登入成功，開始同步！'); }).catch(e => this.authErr(e));
  },
  signOut() { if (this.auth && confirm('確定登出？（呢部機嘅收藏會保留）')) this.m.auth.signOut(this.auth).then(() => toast('已登出')); },
  authErr(e) {
    const c = str(e && e.code);
    if (/popup-closed-by-user|cancelled-popup-request|user-cancelled/.test(c)) { toast('取消咗登入'); return; }
    const msg = {
      'auth/popup-blocked': '瀏覽器擋咗登入視窗。請再撳一次「用 Google 登入」；如果仍然唔得，iPad 去「設定 → Safari」關閉「阻擋彈出式視窗」。',
      'auth/unauthorized-domain': `呢個網址（${location.hostname}）未加入 Firebase 嘅「Authorized domains」。請去 Firebase Console → Authentication → Settings → Authorized domains 加入「${location.hostname}」。`,
      'auth/operation-not-allowed': 'Firebase 未開啟 Google 登入。請去 Firebase Console → Authentication → Sign-in method 開啟 Google。',
      'auth/network-request-failed': '網絡有問題，請檢查上網再試。',
      'auth/operation-not-supported-in-this-environment': '呢個環境唔支援登入。請用 GitHub Pages 嘅 https 網址，喺 Safari 或 Chrome 打開。',
      'auth/web-storage-unsupported': '瀏覽器封鎖咗網站資料（例如私密瀏覽模式）。請用普通模式打開再試。',
      'auth/invalid-api-key': 'Firebase 設定入面嘅 apiKey 唔啱，請重新複製 firebaseConfig。'
    }[c] || ('登入失敗：' + ((e && e.message) || c));
    showMsg('☁️ 登入唔到', [h('p', {}, msg)]);
  },
  onUser(u) {
    if (this.unsub) { try { this.unsub(); } catch (e) {} this.unsub = null; }
    this.user = u || null; this.synced = false; this.remote = {}; this.err = ''; this.col = null;
    if (u) {
      const { collection, onSnapshot } = this.m.fs;
      this.col = collection(this.db, 'users', u.uid, 'library');
      this.unsub = onSnapshot(this.col, s => this.onSnap(s), e => this.fsErr(e));
    }
    this.emit();
  },
  onSnap(snap) {
    let changed = 0;
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') return;
      const e = this.fromDoc(ch.doc.data()); if (!e) return;
      if (!this.remote[e.id] || e.updatedAt > this.remote[e.id]) this.remote[e.id] = e.updatedAt;
      if (Library.merge(e)) changed++;
    });
    if (changed) { Library.persist(); Library.changed(); }
    this.err = '';
    if (!this.synced) { this.synced = true; this.pushLocal(); }
    this.lastSync = new Date(); this.emit();
  },
  pushLocal() {
    if (!this.synced) return 0;
    let n = 0;
    Library.items.forEach(e => { const r = this.remote[e.id]; if (e.deleted && !r) return; if (!r || r < e.updatedAt) { this.put(e); n++; } });
    return n;
  },
  toDoc(e) {
    return { id: e.id, type: e.type, src: str(e.src), motion: str(e.motion), lang: str(e.lang), side: str(e.side), who: str(e.who), grade: str(e.grade),
      createdAt: str(e.createdAt), updatedAt: str(e.updatedAt), deleted: !!e.deleted, payload: e.deleted ? '' : JSON.stringify(e.data || null), v: 1 };
  },
  fromDoc(d) {
    if (!d) return null;
    let data = null;
    if (!d.deleted) { try { data = JSON.parse(d.payload); } catch (e) { return null; } }
    return Library.clean(Object.assign({}, d, { data }));
  },
  put(e) {
    if (!this.user || !this.synced || !this.col) return;
    const { doc, setDoc } = this.m.fs;
    setDoc(doc(this.col, e.id), this.toDoc(e))

const SAMPLE_FORMATS = {

  第一副辯: () => '先反駁對方主辯，再深化本方第二個論點。',
  第二副辯: () => '反駁對方之前嘅發言，提出或者深化本方第三個論點，鞏固主線。',
  副辯: () => '先反駁對方主辯，再深化本方其餘論點。',
  攻辯: () => '喺攻辯環節向對方提出尖銳問題，亦要答對方嘅問題。',
  結辯: side => (side === 'con' ? '（反方先結辯）' : '（正方最後結辯）') + '唔可以提出新論點；總結全場交鋒位、指出對方謬誤、重申本方立場，有力收結。'

const Sample = {
  opts: Object.assign({ fmtZh: 'zh4', fmtEn: 'en3', free: true, mins: 3, register: 'formal' }, LS.get('sampleOpts', {})),
  st: null, playing: false,
  saveOpts() { LS.set('sampleOpts', this.opts); },
  fmtKey(lang) { const k = lang === 'en' ? this.opts.fmtEn : this.opts.fmtZh; return SAMPLE_FORMATS[k] && SAMPLE_FORMATS[k].lang === lang ? k : (lang === 'en' ? 'en3' : 'zh4'); },
  /* 由賽制砌出發言次序 */
  build(fk, free, mins) {
    const F = SAMPLE_FORMATS[fk], zh = F.lang === 'zh', A = [], B = [];
    let ex = null;
    const sp = (side, role, roleEn, job, m) => ({ t: 'speech', id: `${side}_${roleEn.replace(/\W+/g, '')}`, side, role, roleEn, job, mins: m });
    if (zh) {
      const mids = fk === 'zh4' ? ['第一副辯', '第二副辯'] : ['副辯'];
      const enName = { 主辯: 'Lead', 第一副辯: 'Deputy1', 第二副辯: 'Deputy2', 副辯: 'Deputy', 結辯: 'Closing' };
      ['主辯', ...mids].forEach(r => ['pro', 'con'].forEach(s => A.push(sp(s, (s === 'pro' ? '正方' : '反方') + r, enName[r], ZH_JOB[r](s), mins))));
      if (F.ex === 'cross') ex = { t: 'ex', kind: 'cross', title: '攻辯環節', job: '正方攻辯向反方提問、反方作答；然後反方攻辯向正方提問、正方作答。問題要短而尖銳，答案要直接。' };
      else if (free) ex = { t: 'ex', kind: 'free', title: '自由辯論', job: '由正方開始，雙方輪流發言，每次一至兩句：追問對方弱點、即時回應質疑。' };
      ['con', 'pro'].forEach(s => B.push(sp(s, (s === 'pro' ? '正方' : '反方') + '結辯', 'Closing', ZH_JOB.結辯(s), mins)));
    } else {
      const nm = (s, n) => `${ORD[n]} ${s === 'pro' ? 'Affirmative' : 'Negative'}`;
      const zhn = (s, n) => `${s === 'pro' ? '正方' : '反方'}${'一二三'[n - 1]}辯`;
      [1, 2].forEach(n => ['pro', 'con'].forEach(s => A.push(sp(s, `${nm(s, n)}（${zhn(s, n)}）`, nm(s, n), EN_JOB[n](s), mins))));

        h('label', { class: 'fl' }, '⏱️ 每位辯員發言時間'), mseg,

        h('div', { class: 'note' }, '📋 ' + order),

你而家要為一場香港小學辯論比賽寫「示範逐字稿」，俾學生由頭到尾學習成場比賽點樣打。賽制：${F.name}（${F.sub}）。
寫作要求：

- 用學生年級聽得明嘅詞彙，但要示範良好結構：清楚嘅路標（例如「我方有三個論點」「第一」「第二」）、論點→論證→論據。
- 每篇講稿開頭要有禮貌稱呼（中文例如「多謝主席。各位評判、各位老師、對方辯友、各位同學：」；英文例如 "Thank you, Madam Chair. Adjudicators, ladies and gentlemen,"）。
- 後面嘅辯員一定要真正回應之前對方講過嘅具體內容（先簡述對方講法，再反駁），唔可以自說自話。
- 正反雙方要旗鼓相當，兩邊都要寫得好，唔好刻意令一方弱。
- 結辯、3rd speaker 同 Reply 唔可以提出新論點。
- 講稿入面用 \\n 分段。字數要貼近每篇指定長度（上下 15%）。
- coach 欄：用 1 至 2 句${fbEn ? '簡單英式英文' : '廣東話'}講呢篇示範咗咩技巧，等小朋友學。
${HONEST}
${part === 'A' ? '' : '- 自由辯論／攻辯每句都要短（中文 20 至 60 字；英文 12 至 35 words），雙方輪流，要針對之前講稿嘅內容。'}
只輸出一個 JSON 物件，唔好有其他文字。`;
  },
  list(xs, lang) { return xs.map(x => `[${x.id}] ${x.role}：任務：${x.job}　長度：${this.target(lang, x.mins)}`).join('\n'); },
  head(motion, lang, side, ctx) {
    let s = `${studentLine()}\n辯題：${motion}\n辯題語言：${lang === 'en' ? 'English' : '中文'}`;
    if (side === 'pro' || side === 'con') s += `\n學生屬於：${side === 'pro' ? '正方' : '反方'}（兩方都要寫得好）`;
    if (ctx) {
      const pts = k => arr(ctx[k]).slice(0, 4).map(a => `・${str(a.claim)}`).join('\n');
      s += `\n之前拆解出嚟嘅論點（可以採用）：\n正方：\n${pts('pro')}\n反方：\n${pts('con')}`;
    }
    return s;
  },
  async generate({ motion, lang, side, ctx }) {
    if (!aiReady()) { aiError(new NoKeyError('NOKEY')); return; }
    const fk = this.fmtKey(lang), fmt = { key: fk, free: SAMPLE_FORMATS[fk].ex === 'free' ? !!this.opts.free : false, mins: this.opts.mins, register: lang === 'zh' ? this.opts.register : '' };
    const plan = this.build(fk, fmt.free, fmt.mins);
    this.st = { motion, lang, side, ctx, fk, fmt, plan, a: null };
    return this.runA();
  },
  async runA() {
    const c = this.st, { A } = c.plan;
    try {
      const user = `${this.head(c.motion, c.lang, c.side, c.ctx)}\n\n今次只寫以下 ${A.length} 篇發言（按比賽次序）：\n${this.list(A, c.lang)}\n\n輸出格式：{"plan":{"pro_line":"正方主線（一句）","con_line":"反方主線（一句）","pro_points":["正方論點（短）"],"con_points":["反方論點（短）"]},"speeches":[{"id":"同上面嘅 id","text":"逐字稿","coach":"技巧點評"}]}`;
      const d = await withThinking(`阿辯寫緊上半場講稿（1/2）…`, () => callAI(this.sys(c.lang, c.fk, 'A'), user, { maxTokens: 12000, timeout: 240000 }));
      const got = this.pick(arr(d.speeches), A);
      if (got.filter(x => x.text).length < Math.ceil(A.length / 2)) throw new Error('AI 冇寫齊上半場講稿，請再試一次。');
      c.a = { plan: d.plan && typeof d.plan === 'object' ? d.plan : {}, segs: got };
      return this.runB();
    } catch (e) { aiError(e, () => this.runA()); }
  },
  async runB() {
    const c = this.st, { ex, B } = c.plan;
    try {
      const before = c.a.segs.map(x => `【${x.role}】\n${x.text}`).join('\n\n');
      const exReq = ex ? `先寫「${ex.title}」：${ex.job}大約 ${ex.kind === 'cross' ? 12 : 14} 句。\n然後寫` : '寫';
      const user = `${this.head(c.motion, c.lang, c.side, c.ctx)}\n\n以下係上半場已經講咗嘅講稿：\n${before}\n\n${exReq}以下 ${B.length} 篇發言（按比賽次序），要回應上半場${ex ? '同' + ex.title : ''}嘅具體內容：\n${this.list(B, c.lang)}\n\n最後用${fbLang(c.lang) === 'en' ? '簡單英式英文' : '廣東話'}寫評判點評。\n輸出格式：{${ex ? '"exchange":[{"side":"pro 或 con","speaker":"例如：正方第一副辯","line":"一句發言"}],' : ''}"speeches":[{"id":"同上面嘅 id","text":"逐字稿","coach":"技巧點評"}],"judge":{"clashes":["全場主要交鋒位"],"pro_did_well":"正方做得好嘅地方","con_did_well":"反方做得好嘅地方","lessons":["學生可以學到嘅重點"]}}`;
      const d = await withThinking(`阿辯寫緊${ex ? ex.title + '同' : ''}${c.lang === 'en' ? '下半場' : '結辯'}（2/2）…`, () => callAI(this.sys(c.lang, c.fk, 'B'), user, { maxTokens: 12000, timeout: 240000 }));
      const bs = this.pick(arr(d.speeches), B);
      if (!bs.some(x => x.text)) throw new Error('AI 冇寫到下半場講稿，請再試一次。');
      const segs = [...c.a.segs];
      if (ex) segs.push(Object.assign({}, ex, { lines: arr(d.exchange).filter(l => l && l.line).map(l => ({ side: l.side === 'con' ? 'con' : 'pro', speaker: str(l.speaker), line: str(l.line) })) }));
      segs.push(...bs);
      const s = { plan: c.a.plan, segs, judge: d.judge && typeof d.judge === 'object' ? d.judge : {} };
      award('custom');
      const entry = Library.add({ type: 'sample', src: 'custom', motion: c.motion, lang: c.lang, side: c.side || 'none', data: { s, fmt: c.fmt } });
      Object.assign(Custom.st, { sample: { motion: c.motion, lang: c.lang, side: c.side, s, fmt: c.fmt }, entryId: entry.id, quiet: false, stage: 'sample' });
      if (App.cur !== 'custom') App.go('custom', true); else Custom.render();
      SFX.play('win'); World.cheer(2); confetti(60);
    } catch (e) { aiError(e, () => this.runB()); }
  },
  pick(list, want) {
    return want.map((w, i) => {
      const f = list.find(x => x && x.id === w.id) || list[i] || {};
      return Object.assign({}, w, { text: str(f.text).trim(), coach: str(f.coach).trim() });
    });
  },
  /* 睇示範 */
  render(b, sm, nav) {
    this.stopAll();
    const { motion, lang, s, fmt } = sm, F = SAMPLE_FORMATS[fmt.key] || SAMPLE_FORMATS.zh4, you = sm.side;
    b.innerHTML = ''; b.scrollTop = 0;
    b.append(motionBanner(motion, lang, you === 'pro' || you === 'con' ? you : null));
    const segs = arr(s.segs);
    b.append(h('div', { class: 'card', style: 'margin-top:16px;background:var(--grape)' },
      sayRow(`🎬 全場比賽示範：${F.name}，每人約 ${fmt.mins} 分鐘。由${segs[0] ? segs[0].role || '' : ''}開始，一直去到最後。揿每篇講稿旁邊嘅喇叭可以聽，或者揿「由頭到尾朗讀」聽晒成場。`)));
    const p = s.plan || {};
    if (p.pro_line || p.con_line) {
      const side = (k, c) => h('div', { class: 'item', style: `border-left:10px solid var(--${k})` },
        sayRow(`${k === 'pro' ? '🔴 正方' : '🔵 反方'}主線：${str(p[k + '_line'])}`, '', { small: true }),
        arr(p[k + '_points']).length ? h('ol', { style: 'margin:6px 0 0;padding-left:22px;font-size:17px' }, arr(p[k + '_points']).map(x => h('li', {}, str(x)))) : null);
      b.append(h('div', { class: 'sec-title' }, h('span', { class: 'e' }, '🧭'), h('span', { class: 'grow' }, '雙方主線')), h('div', { class: 'grid2' }, side('pro'), side('con')));
    }
    const playBtn = h('button', { class: 'btn go sm', onclick: () => this.playAll(playBtn, cards) }, '▶️ 由頭到尾朗讀');
    b.append(h('div', { class: 'row no-print', style: 'margin-top:14px' }, playBtn,
      h('button', { class: 'btn sky sm', onclick: () => this.copy(sm) }, '📋 複製全場'),
      sm.entryId ? h('button', { class: 'btn grape sm', onclick: () => Exporter.dialog([Library.get(sm.entryId)]) }, '⬇️ 匯出') : null,
      h('button', { class: 'btn ghost sm', onclick: () => window.print() }, '🖨️ 列印')));
    const cards = [];
    const rundown = h('div', { class: 'rundown no-print' });
    b.append(h('div', { class: 'sec-title' }, h('span', { class: 'e' }, '📋'), h('span', { class: 'grow' }, '發言次序'), spk('發言次序：' + segs.map(x => x.t === 'ex' ? x.title : x.role).join('，'))), rundown);
    segs.forEach((x, i) => {
      const n = i + 1;
      let card, say;
      if (x.t === 'ex') {
        say = x.title + '。' + arr(x.lines).map(l => `${l.speaker || (l.side === 'pro' ? '正方' : '反方')}：${l.line}`).join('。');
        card = h('div', { class: 'card sp-card ex' },
          h('div', { class: 'row' }, h('span', { class: 'chip big', style: '--c:var(--sun)' }, `${n}・${x.title}`), h('span', { class: 'grow' }), spk(say)),
          h('div', { class: 'muted', style: 'font-size:15px;margin-top:6px' }, '任務：' + str(x.job)),
          h('div', { class: 'chat' }, arr(x.lines).map(l => h('div', { class: 'msg ' + l.side },
            h('small', {}, (l.side === 'pro' ? '🔴 ' : '🔵 ') + (l.speaker || (l.side === 'pro' ? '正方' : '反方'))),
            h('div', { class: 'say' }, h('p', {}, l.line), spk(l.line, { small: true }))))));
      } else {
        const paras = str(x.text).split(/\n+/).filter(Boolean);
        const len = lang === 'en' ? (str(x.text).match(/\S+/g) || []).length : str(x.text).replace(/\s/g, '').length;
        const estMin = lang === 'en' ? len / 110 : len / 180;
        say = `${x.role}發言。${x.text}`;
        card = h('div', { class: 'card sp-card ' + x.side },
          h('div', { class: 'row' }, h('span', { class: 'chip big', style: `--c:var(--${x.side});color:#fff` }, `${n}・${x.side === 'pro' ? '🔴' : '🔵'} ${x.role}${you === x.side ? '（你嗰方）' : ''}`), h('span', { class: 'grow' }), spk(say, { label: '朗讀呢篇講稿' })),
          h('div', { class: 'muted', style: 'font-size:15px;margin-top:6px' }, '任務：' + str(x.job)),
          h('div', { class: 'script' }, paras.length ? paras.map(t => h('p', {}, t)) : h('p', { class: 'muted' }, '（AI 冇寫到呢篇，可以再生成一次）')),
          h('div', { class: 'muted', style: 'font-size:14px;margin-top:6px' }, `${lang === 'en' ? len + ' words' : len + ' 字'}・大約 ${estMin.toFixed(1)} 分鐘（目標 ${x.mins} 分鐘）`),
          x.coach ? h('div', { class: 'coach' }, sayRow('🦉 教練點評：' + x.coach, '', { small: true })) : null);
      }
      card.id = 'sp-' + n;
      cards.push({ el: card, text: say });
      rundown.append(h('button', { type: 'button', class: 'rd ' + (x.t === 'ex' ? 'ex' : x.side), onclick: () => { try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {} } }, `${n}. ${x.t === 'ex' ? x.title : x.role.replace(/（.*）/, '')}`));
      b.append(card);
    });
    const j = s.judge || {};
    const jl = [...arr(j.clashes).map(x => '⚔️ ' + str(x)), j.pro_did_well ? '🔴 正方做得好：' + str(j.pro_did_well) : '', j.con_did_well ? '🔵 反方做得好：' + str(j.con_did_well) : '', ...arr(j.lessons).map(x => '💡 ' + str(x))].filter(Boolean);
    if (jl.length) b.append(h('div', { class: 'sec-title' }, h('span', { class: 'e' }, '👩‍⚖️'), h('span', { class: 'grow' }, '評判點評同學習重點'), spk('評判點評：' + jl.join('。'))),
      h('div', { class: 'list-say' }, jl.map(t => h('div', { class: 'item' }, sayRow(t, '', { small: true })))));
    b.append(h('div', { class: 'note' }, '⚠️ 呢份係 AI 寫嘅示範稿，用嚟學結構同技巧。比賽前請用自己嘅說話改寫；入面提到嘅數據同例子，一定要查證出處。'));
    if (nav) b.append(nav);
    autoSay('全場示範準備好！由' + (segs[0] ? segs[0].role : '主辯') + '開始睇啦。');
  },
  playAll(btn, cards) {
    if (this.playing) { this.stopAll(); TTS.stop(); return; }
    if (!cards.length) return;
    this.playing = true; this.btn = btn; btn.textContent = '⏹ 停止朗讀';
    const step = i => {
      $$('.sp-card.reading').forEach(x => x.classList.remove('reading'));
      if (!this.playing || i >= cards.length) { this.stopAll(); return; }
      const c = cards[i]; c.el.classList.add('reading');
      try { c.el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {}
      TTS.speak(c.text, null, natural => natural ? step(i + 1) : this.stopAll());
    };
    step(0);
  },
  stopAll() {
    this.playing = false;
    $$('.sp-card.reading').forEach(x => x.classList.remove('reading'));
    if (this.btn) { this.btn.textContent = '▶️ 由頭到尾朗讀'; this.btn = null; }
  },
  toText(sm) {
    const { motion, s, fmt } = sm, F = SAMPLE_FORMATS[fmt.key] || SAMPLE_FORMATS.zh4, L = [];
    L.push('辯題：' + motion, `賽制：${F.name}（每人約 ${fmt.mins} 分鐘）`, '');
    const p = s.plan || {};
    if (p.pro_line) L.push('【正方主線】' + p.pro_line, ...arr(p.pro_points).map((x, i) => `  ${i + 1}. ${x}`));
    if (p.con_line) L.push('【反方主線】' + p.con_line, ...arr(p.con_points).map((x, i) => `  ${i + 1}. ${x}`));
    arr(s.segs).forEach((x, i) => {
      L.push('', `==== ${i + 1}. ${x.t === 'ex' ? x.title : x.role} ====`);
      if (x.t === 'ex') arr(x.lines).forEach(l => L.push(`${l.speaker || (l.side === 'pro' ? '正方' : '反方')}：${l.line}`));
      else { L.push(str(x.text)); if (x.coach) L.push('（教練點評：' + x.coach + '）'); }
    });
    const j = s.judge || {};
    if (arr(j.clashes).length || arr(j.lessons).length) L.push('', '==== 評判點評 ====', ...arr(j.clashes).map(x => '・交鋒：' + x), j.pro_did_well ? '・正方：' + j.pro_did_well : '', j.con_did_well ? '・反方：' + j.con_did_well : '', ...arr(j.lessons).map(x => '・學習：' + x));
    L.push('', '（AI 示範稿：數據同例子請查證出處）');
    return L.filter(x => x !== '').join('\n').replace(/\n(?====)/g, '\n\n');
  },
  copy(sm) {
    const text = this.toText(sm);
    const fallback = () => { const t = h('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); toast('📋 已複製全場逐字稿！'); } catch (e) { toast('複製唔到，請用匯出'); } t.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast('📋 已複製全場逐字稿！'), fallback); else fallback();
  },
  docHTML(e) {
    const { s, fmt } = e.data, F = SAMPLE_FORMATS[fmt.key] || SAMPLE_FORMATS.zh4, p = s.plan || {};
    let out = `<p class="meta">🎬 ${esc(F.name)}（${esc(F.sub)}）・每人約 ${esc(fmt.mins)} 分鐘</p>`;
    if (p.pro_line || p.con_line) out += `<h3>🧭 雙方主線</h3><div class="arg pro"><b>正方：</b>${esc(p.pro_line)}<ol>${arr(p.pro_points).map(x => `<li>${esc(x)}</li>`).join('')}</ol></div><div class="arg con"><b>反方：</b>${esc(p.con_line)}<ol>${arr(p.con_points).map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
    out += `<h3>📋 發言次序</h3><p>${arr(s.segs).map((x, i) => `${i + 1}. ${esc(x.t === 'ex' ? x.title : x.role)}`).join('　→　')}</p>`;
    arr(s.segs).forEach((x, i) => {
      if (x.t === 'ex') out += `<h3>${i + 1}. ${esc(x.title)}</h3>` + arr(x.lines).map(l => `<p class="line ${l.side === 'con' ? 'con' : 'pro'}"><b>${esc(l.speaker || (l.side === 'pro' ? '正方' : '反方'))}：</b>${esc(l.line)}</p>`).join('');
      else out += `<h3 class="${x.side}">${i + 1}. ${x.side === 'pro' ? '🔴' : '🔵'} ${esc(x.role)}</h3><p class="meta">任務：${esc(x.job)}</p><div class="arg ${x.side}">${str(x.text).split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('')}</div>${x.coach ? `<p class="warn">🦉 教練點評：${esc(x.coach)}</p>` : ''}`;
    });
    const j = s.judge || {};
    const jl = [...arr(j.clashes).map(x => '⚔️ ' + esc(x)), j.pro_did_well ? '🔴 正方做得好：' + esc(j.pro_did_well) : '', j.con_did_well ? '🔵 反方做得好：' + esc(j.con_did_well) : '', ...arr(j.lessons).map(x => '💡 ' + esc(x))].filter(Boolean);
    if (jl.length) out += '<h3>👩‍⚖️ 評判點評同學習重點</h3><ul>' + jl.map(x => `<li>${x}</li>`).join('') + '</ul>';
    return out;
  }
};

function saveEval(src, c, r) {
  return Library.add({ type: 'eval', src, motion: c.motion, lang: c.lang, side: c.side,
    data: { steps: c.steps.map(s => ({ stage: str(s.stage), q: str(s.q), qZh: str(s.qZh), hint: str(s.hint), starter: str(s.starter) })), answers: c.steps.map((_, i) => str(c.answers[i])), result: r } }).id;
}

/* =========================================================
   Init
   ========================================================= */
function init() {
  updateStars();
  World.init();
  $('#homeBtn').addEventListener('click', () => { SFX.play('click'); App.go('home'); });
  $('#settingsBtn').addEventListener('click', () => { SFX.play('click'); Settings.open(); });
  $('#badgeBtn').addEventListener('click', () => { SFX.play('click'); openBadges(); });
  $('#libBtn').addEventListener('click', () => { SFX.play('click'); App.go('library'); });
  $$('.back').forEach(x => x.addEventListener('click', () => { SFX.play('click'); App.go('home'); }));
  $$('.island-btn').forEach(x => x.addEventListener('click', () => { SFX.play('click'); App.go(x.dataset.go); }));
  $('#learnSpk').append(spk(() => Learn.speakText(LESSONS[Learn.i]), { label: '朗讀呢一課' }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) TTS.stop(); });
  App.go('home');
  if (!P.name && !LS.get('welcomed', false)) {
    LS.set('welcomed', true);
    const nm = h('input', { type: 'text', placeholder: '例如：小明', maxlength: '20' });
    const gr = h('div', { class: 'seg' });
    const draw = () => { gr.innerHTML = ''; Object.entries(GRADES).forEach(([k, v]) => gr.append(h('button', { type: 'button', class: P.grade === k ? 'on' : '', style: 'min-width:80px', onclick: () => { P.grade = k; draw(); } }, v.zh))); };
    draw();
    const hello = '你好呀！我係阿辯，辯辯島嘅島主。你叫咩名？讀幾年級？話俾我知，我就可以幫你揀啱你嘅挑戰！';
    showMsg('🦉 歡迎嚟到辯辯島！', [
      sayRow(hello),
      h('label', { class: 'fl' }, '你叫咩名？'), nm,
      h('label', { class: 'fl' }, '你讀幾年級？'), gr,
      h('div', { class: 'row', style: 'margin-top:18px' }, h('button', { class: 'btn go', onclick: () => { P.name = nm.value.trim(); saveP(); closeModal('msgModal'); SFX.play('win'); World.cheer(2); Home.enter(); } }, '🚀 出發！'))
    ]);
    $('#msgModal .modal-head').style.background = 'var(--sun)';
  }
}
function boot() { init(); Cloud.init(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
