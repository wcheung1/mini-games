<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7cc8f5">
<title>成長小島：反思練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   成長小島：反思練習（單一 HTML 檔）
   顏色＝功能：
   橙＝主要行動　紫＝反思／回望亭　綠＝成長／完成
   藍＝語音　粉紅＝求助／安全　灰藍＝家長／設定
   黃色閃動＝「提示你撳」；深色實心＋✓＝「已揀／開咗」
   ========================================================= */
:root{
  --orange:#ff8a3d; --orange-d:#e86a14;
  --purple:#8b6cf6; --purple-d:#6a4bd8; --purple-l:#efeaff;
  --green:#2fb36f; --green-d:#1f8a52; --green-l:#e3f8ec;
  --blue:#2d8cf0; --blue-l:#e5f1ff;
  --pink:#ff4f87; --pink-l:#ffe6ef;
  --slate:#4f5f80; --slate-l:#eef1f7;
  --hint:#ffd23f;
  --ink:#2b2a3a; --ink2:#5d5b72;
  --paper:#fffaf2; --card:#ffffff;
  --topH:52px;
  --font:"Nunito","Noto Sans HK","PingFang HK","PingFang TC","Hiragino Sans CNS","Heiti TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans CJK TC","Source Han Sans TC","Droid Sans Fallback",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#bfe6fb;color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;grid-template-rows:var(--topH) minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* 頂部列 */
#top{grid-row:1;grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fffdf8;border-bottom:3px solid #ffe2b8;z-index:30}
.tb{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;border-radius:14px;border:2px solid #e9e1d4;background:#fff;font-weight:800;font-size:15px;white-space:nowrap;flex:0 0 auto}
.tb .ic{font-size:18px;line-height:1}
.tb:active{transform:scale(.96)}
#prog{flex:1 1 auto;min-width:0;text-align:center;font-weight:800;font-size:14px;color:var(--ink2);overflow:hidden;white-space:nowrap;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;line-height:1.2}
@media (max-width:480px){#prog{flex-direction:column;gap:0;font-size:12.5px}}
#prog b{color:var(--green-d)}
#btnVoice{border-color:var(--blue);color:var(--blue)}
#btnVoice.idle{opacity:.4}
#btnVoice.paused{background:var(--blue);color:#fff}
/* 3D 區 */
#view{grid-row:2;grid-column:1;position:relative;overflow:hidden;min-height:0;background:linear-gradient(#8fd3ff,#dff4ff)}
#c{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#bubbles{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;width:max-content;max-width:min(220px,62%);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 34px 7px 10px;font-size:15px;font-weight:700;line-height:1.35;pointer-events:auto;transform:translate(-50%,-100%);box-shadow:0 3px 0 rgba(0,0,0,.15);transition:opacity .2s}
.bub::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bub.below{transform:translate(-50%,0)}
.bub.side::after{display:none}
.bub.below::after{top:-11px;bottom:auto;border-top:0;border-bottom:8px solid var(--ink)}
.bub .who{display:block;font-size:12px;color:var(--ink2)}
.bub.think{border-style:dashed;border-color:var(--purple);background:var(--purple-l)}
.vbtn{position:absolute;z-index:5;height:38px;padding:0 10px;border-radius:12px;border:2px solid #fff;background:rgba(43,42,58,.72);color:#fff;font-weight:800;font-size:14px}
#btnHome{left:8px;top:8px}
#mini{position:absolute;right:8px;top:8px;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid #fff;opacity:0;transition:opacity .4s;pointer-events:none;z-index:4}
#mini.on{opacity:1}
#gestHint{position:absolute;right:8px;bottom:8px;z-index:4;background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800;color:var(--ink2);pointer-events:none;transition:opacity .5s}
#gestHint.hide{opacity:0}
#load3d{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink2);font-size:16px;text-align:center;padding:16px}
#fallback2d{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
#fallback2d .row{font-size:44px;letter-spacing:6px}
#fallback2d .note{font-size:13px;color:var(--ink2);background:#fff;border-radius:10px;padding:4px 8px}
/* 文字面板（同 3D 區分開，唔會遮住要撳嘅嘢） */
#panel{grid-row:3;grid-column:1;height:46vh;height:46dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--paper);border-top:3px solid #ffe2b8;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:10}
@media (orientation:landscape) and (min-width:700px){
  #app{grid-template-columns:minmax(0,1fr) min(420px,42vw);grid-template-rows:var(--topH) minmax(0,1fr)}
  #panel{grid-row:2;grid-column:2;height:auto;max-height:none;border-top:0;border-left:3px solid #ffe2b8}
}
@media (orientation:landscape) and (max-width:699px){
  #app{grid-template-columns:minmax(0,1fr) 52vw;grid-template-rows:var(--topH) minmax(0,1fr)}
  #panel{grid-row:2;grid-column:2;height:auto;max-height:none;border-top:0;border-left:3px solid #ffe2b8}
}
/* 卡片同文字 */
.card{position:relative;background:var(--card);border-radius:18px;padding:12px 44px 12px 14px;margin:0 0 10px;box-shadow:0 2px 0 #f0e4d2;border:2px solid #f3e7d6}
.card.purple{background:var(--purple-l);border-color:#d9cffd}
.card.green{background:var(--green-l);border-color:#bfe9d1}
.card.pink{background:var(--pink-l);border-color:#ffc6d8}
.card.blue{background:var(--blue-l);border-color:#c5defc}
.card.slate{background:var(--slate-l);border-color:#d6dcea}
.kicker{font-size:13px;font-weight:900;color:var(--purple-d);margin:0 0 2px;letter-spacing:.5px}
.big{font-size:19px;font-weight:900;line-height:1.4;margin:0}
.txt{font-size:16px;font-weight:600;line-height:1.55;margin:4px 0 0}
.small{font-size:13px;color:var(--ink2);line-height:1.5}
h2{margin:0;font-size:18px}
.spk{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.spk.on{background:var(--blue);color:#fff}
.bub .spk{top:5px;right:5px;width:24px;height:24px;font-size:12px}
/* 按鈕 */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:8px 16px;border-radius:16px;border:0;font-weight:900;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.main{background:var(--orange);color:#fff}
.btn.reflect{background:var(--purple);color:#fff}
.btn.grow{background:var(--green);color:#fff}
.btn.help{background:var(--pink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #e3d9c9;box-shadow:0 3px 0 #e8dccb}
.btn.slate{background:var(--slate);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.95),0 4px 0 rgba(0,0,0,.18)}50%{box-shadow:0 0 0 7px rgba(255,210,63,.35),0 4px 0 rgba(0,0,0,.18)}}
.mini-btn{min-height:36px;padding:4px 12px;border-radius:12px;border:2px solid #e3d9c9;background:#fff;font-weight:800;font-size:14px}
.mini-btn.on{background:var(--slate);color:#fff;border-color:var(--slate)}
/* 選項（每個角落有細喇叭） */
.opts{display:grid;gap:8px;margin:8px 0}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;min-height:48px;padding:10px 40px 10px 12px;border-radius:14px;border:3px solid #e3d9c9;background:#fff;font-weight:800;font-size:16px;line-height:1.35;display:flex;align-items:center;gap:8px}
.opt .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#f1ebe0;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--purple-d);background:var(--purple);color:#fff}
.opt.sel .num{background:#fff;color:var(--purple-d)}
.opt.sel::before{content:"✓";position:absolute;left:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.opt.idk{border-style:dashed}
.opt .spk{top:50%;margin-top:-15px}
.opt.dim{opacity:.55}
/* 控制圈拖曳 */
.circles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.circ{min-height:120px;border-radius:50% / 40%;border:4px dashed;padding:20px 8px 10px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;position:relative}
.circ.can{border-color:var(--green);background:var(--green-l)}
.circ.cant{border-color:#9aa3b5;background:#f1f3f7}
.circ .lab{position:absolute;top:4px;left:0;right:0;text-align:center;font-weight:900;font-size:13px}
.circ.over{outline:4px solid var(--hint)}
.piece{touch-action:none;user-select:none;-webkit-user-select:none;padding:7px 10px;border-radius:12px;background:#fff;border:2px solid var(--ink);font-weight:800;font-size:14px;cursor:grab;position:relative}
.piece.picked{background:var(--hint)}
.piece.drag{position:fixed;z-index:200;pointer-events:none;box-shadow:0 8px 16px rgba(0,0,0,.25)}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px;border-radius:12px;background:#fff;border:2px dashed #e3d9c9}
/* 情緒鷹架 */
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.emo .opt{flex-direction:column;align-items:center;text-align:center;padding:8px 6px 8px;font-size:15px}
.emo .opt .em{font-size:28px}
.emo .opt .spk{top:4px;right:4px;margin:0;width:24px;height:24px;font-size:11px}
.meter{display:flex;gap:6px;margin:6px 0}
.meter button{flex:1;height:44px;border-radius:12px;border:3px solid #e3d9c9;background:#fff;font-weight:900;font-size:16px}
.meter button.sel{background:var(--purple);border-color:var(--purple-d);color:#fff}
/* 停一停（按住） */
.holdbtn{width:100%;min-height:64px;border-radius:20px;border:0;background:linear-gradient(90deg,var(--blue) var(--p,0%),#cfe4ff var(--p,0%));color:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.3);touch-action:none;user-select:none;-webkit-user-select:none}
/* 規律線索 */
.days{display:grid;gap:8px}
.day{background:#fff;border-radius:14px;border:2px solid #e3d9c9;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip2{border-radius:999px;border:2px solid #e3d9c9;background:#fff;padding:5px 10px;font-weight:800;font-size:14px}
.chip2.sel{background:var(--purple);color:#fff;border-color:var(--purple-d)}
/* 進度、根 */
.roots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.root{background:#fff;border-radius:14px;padding:8px 10px;border:2px solid #e3d9c9}
.root .bar{height:10px;border-radius:6px;background:#f0e9de;overflow:hidden;margin-top:4px}
.root .bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.grew{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.grew span{background:var(--green-l);border:2px solid #bfe9d1;border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px;color:var(--green-d)}
details.more{margin:8px 0;border-radius:14px;background:#fff;border:2px solid #e3d9c9;padding:0}
details.more summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:900;font-size:15px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:2px dashed #eee3d2}
details.more .in{padding:6px 12px 10px;position:relative}
details.more .in .card{margin:6px 0}
/* 底頁（目錄／設定／日記／傾訴…）喺頂部列下面，唔會遮住暫停掣 */
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--topH) + env(safe-area-inset-top));z-index:40;background:var(--paper);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
.sheetHead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid #ffe2b8;background:#fff}
.sheetHead h2{flex:1;min-width:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
/* 目錄：左學右練 */
.chap{background:#fff;border-radius:18px;border:2px solid #efe3d1;padding:10px;margin-bottom:10px;position:relative}
.chap h3{margin:0 40px 2px 0;font-size:16px}
.chap .one{font-size:14px;color:var(--ink2);margin:0 40px 8px 0;font-weight:600}
.lv2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{position:relative;min-height:62px;border-radius:14px;border:3px solid #e3d9c9;background:#fff;text-align:left;padding:8px 10px;font-weight:800;font-size:14px;line-height:1.3}
.lv small{display:block;font-size:12px;color:var(--ink2);font-weight:700}
.lv.done{border-color:var(--green);background:var(--green-l)}
.lv.done::after{content:"✅ 完成";position:absolute;right:6px;top:6px;font-size:11px;color:var(--green-d)}
.lv.next{border-color:var(--orange)}
.lv.lock{opacity:.5}
.lv.pocket{border-color:var(--purple);border-style:dashed}
.tag{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:1px 7px;margin-right:4px}
.tag.learn{background:var(--purple-l);color:var(--purple-d)}
.tag.prac{background:#fff1e4;color:var(--orange-d)}
.age{font-size:11px;font-weight:900;color:#fff;background:var(--slate);border-radius:999px;padding:1px 7px}
.list{display:grid;gap:8px}
.entry{background:#fff;border-radius:14px;border:2px solid #efe3d1;padding:10px 44px 10px 12px;position:relative}
.entry .when{font-size:12px;color:var(--ink2);font-weight:800}
.form label{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.form input,.form textarea,.form select{width:100%;padding:10px 12px;border-radius:12px;border:2px solid #e3d9c9;background:#fff;font-size:16px}
.form textarea{min-height:110px;resize:vertical}
/* AI 走馬燈 */
.ai-status{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#bbb;flex:0 0 auto}
.dot.ok{background:var(--green)}
.dot.wait{background:var(--hint);animation:blink 1s infinite}
.dot.err{background:#e5484d}
@keyframes blink{50%{opacity:.3}}
.ticker{position:relative;overflow:hidden;white-space:nowrap;background:#2b2a3a;color:#ffe9a8;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;margin:6px 0;min-height:36px}
.ticker .run{display:inline-block;will-change:transform}
.ticker.idle{color:#9a98ad}
.stream{white-space:pre-wrap;font-size:16px;line-height:1.6;font-weight:600}
.caret::after{content:"▍";animation:blink .8s infinite;color:var(--purple)}
.thinkbox{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--ink2);max-height:200px;overflow:auto}
.sec{margin-top:8px}
.sec h4{margin:0 0 4px;font-size:15px;color:var(--purple-d)}
.dialog-line{margin:4px 0;line-height:1.5}
.dialog-line b{color:var(--purple-d)}
/* 對話框（密碼等） */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(30,28,45,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--paper);border-radius:20px;padding:16px;width:min(420px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(var(--topH) + 10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
.drag-ghost{position:fixed;z-index:200;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 小劇場特效 ===== */
#titleCard{position:absolute;left:50%;top:14px;transform:translate(-50%,-30px) scale(.9);opacity:0;z-index:6;pointer-events:none;background:#fff;border-radius:18px;padding:8px 18px 10px;text-align:center;box-shadow:0 6px 0 var(--tc,var(--purple));border:3px solid var(--tc,var(--purple));max-width:86%}
#titleCard small{display:block;font-size:12px;font-weight:900;color:var(--ink2)}
#titleCard b{display:block;font-size:22px;font-weight:900;color:var(--ink)}
#titleCard.on{animation:tcard 3.2s ease forwards}
@keyframes tcard{0%{opacity:0;transform:translate(-50%,-30px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
#fxo{position:absolute;top:0;right:0;bottom:0;left:0;z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;font-weight:900;color:#fff;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#fxo .big3{font-size:64px;line-height:1}
#fxo.on{animation:fxo 1.4s ease forwards}
#fxo.reflect{background:radial-gradient(circle,rgba(139,108,246,.45),rgba(139,108,246,0) 70%)}
#fxo.pause{background:radial-gradient(circle,rgba(45,140,240,.4),rgba(45,140,240,0) 70%)}
#fxo.rewind{background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,rgba(0,0,0,.12) 3px 6px)}
@keyframes fxo{0%{opacity:0;transform:scale(1.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#flash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#tapHint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:var(--hint);color:#4a3200;border-radius:999px;padding:8px 40px 8px 14px;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:pulse 1.2s ease-in-out infinite}
#tapHint .spk{top:50%;margin-top:-14px;right:6px;width:28px;height:28px}
.polaroid{display:block;background:#fff;padding:7px 7px 6px;margin:8px auto;max-width:260px;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:rotate(-2.5deg);border-radius:4px;animation:polo .6s ease}

<script>
/* =========================================================
   第一部分：工具、儲存、密碼雜湊、音效、語音
   ========================================================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const fmtTime = t => { const d = new Date(t); return d.getMonth() + 1 + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

/* ---------- 安全存取 localStorage（私隱模式可能用唔到） ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
  size() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('gi_')) n += (localStorage.getItem(k) || '').length * 2; } } catch (e) { } return n; }
};

/* ---------- 遊戲狀態 ---------- */
const ROOTS = [
  { id: 'aware', name: '覺察', em: '👀', d: '識得講出自己嘅感受' },
  { id: 'empathy', name: '同理', em: '🤝', d: '諗得到人哋可能嘅感受' },
  { id: 'courage', name: '勇氣', em: '🦁', d: '肯試、肯講、肯面對' },
  { id: 'honesty', name: '誠實', em: '💎', d: '講真話，包括講自己錯咗' },
  { id: 'resilience', name: '韌性', em: '🌱', d: '跌倒之後肯再試' },
  { id: 'repair', name: '修補', em: '🌉', d: '錯咗之後識得補返' },
  { id: 'help', name: '求助', em: '🏮', d: '識得搵人幫手' }
];
function freshState() {
  return {
    v: 1, profile: { name: '', age: 0, setupDone: false, introSeen: false },
    settings: { autoVoice: true, charVoices: true, rate: 1, voiceURI: '' },
    progress: { done: {}, pocket: {}, unlockedAll: false, retried: {} },
    roots: Object.fromEntries(ROOTS.map(r => [r.id, 0])),
    garden: [], bridges: [0, 0, 0], light: 0, stones: [], stars: 0, lanterns: 0, butterflies: 0,
    seeds: [], diary: [], chats: [], flags: [], globes: {}, daily: { date: '', letters: [], done: [] },
    parent: { hash: '', salt: '', skipped: false },
    firebase: { config: '' }, updatedAt: Date.now()
  };
}
let S = (() => {
  const s = LS.get('gi_state_v1', null); const f = freshState();
  if (!s) return f;
  // 合併新欄位，保留舊資料
  for (const k in f) if (s[k] === undefined) s[k] = f[k];
  for (const k of ['profile', 'settings', 'progress', 'roots', 'parent', 'daily', 'firebase', 'globes']) s[k] = Object.assign({}, f[k], s[k]);
  return s;
})();
let saveTimer = 0;
function save() { S.updatedAt = Date.now(); clearTimeout(saveTimer); saveTimer = setTimeout(() => { LS.set('gi_state_v1', S); if (typeof Cloud !== 'undefined') Cloud.schedulePush(); }, 250); }
function saveNow() { S.updatedAt = Date.now(); LS.set('gi_state_v1', S); }

/* ---------- AI 設定（獨立存喺 localStorage） ---------- */
const AI_DEFAULT = { baseUrl: 'https://api.z.ai/api/paas/v4', model: 'glm-5.3', key: '', maxTokens: 131072, thinking: true };
let AIC = Object.assign({}, AI_DEFAULT, LS.get('gi_ai', {}));
function saveAI() { LS.set('gi_ai', AIC); }

/* ---------- SHA-256（純 JS，file:// 同舊 Safari 都用得） ---------- */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const bytes = new TextEncoder().encode(ascii);
  const K = [], H = []; let p = 2, n = 0;
  const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (n < 64) { if (isP(p)) { if (n < 8) H[n] = (Math.pow(p, 1 / 2) * 4294967296) | 0; K[n++] = (Math.pow(p, 1 / 3) * 4294967296) | 0; } p++; }
  const l = bytes.length, words = [];
  const m = new Uint8Array(((l + 9 + 63) >> 6) << 6); m.set(bytes); m[l] = 0x80;
  const bl = l * 8; m[m.length - 4] = (bl >>> 24) & 255; m[m.length - 3] = (bl >>> 16) & 255; m[m.length - 2] = (bl >>> 8) & 255; m[m.length - 1] = bl & 255;
  m[m.length - 8] = Math.floor(l / 536870912) & 255;
  for (let i = 0; i < m.length; i += 4) words.push((m[i] << 24) | (m[i + 1] << 16) | (m[i + 2] << 8) | m[i + 3]);
  let h = H.slice();
  for (let j = 0; j < words.length; j += 16) {
    const w = words.slice(j, j + 16); const o = h.slice();
    for (let i = 0; i < 64; i++) {
      if (i >= 16) { const a = w[i - 15], b = w[i - 2]; w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(b, 17) ^ rr(b, 19) ^ (b >>> 10))) | 0; }
      const t1 = (h[7] + (rr(h[4], 6) ^ rr(h[4], 11) ^ rr(h[4], 25)) + ((h[4] & h[5]) ^ (~h[4] & h[6])) + K[i] + w[i]) | 0;
      const t2 = ((rr(h[0], 2) ^ rr(h[0], 13) ^ rr(h[0], 22)) + ((h[0] & h[1]) ^ (h[0] & h[2]) ^ (h[1] & h[2]))) | 0;
      h = [(t1 + t2) | 0].concat(h); h[4] = (h[4] + t1) | 0; h.pop();
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + o[i]) | 0;
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const hashPw = (pw, salt) => { let x = salt + '|' + pw; for (let i = 0; i < 2000; i++) x = sha256(x + salt); return x; };
const Parent = {
  ok: false, // 今次開 App 有冇已經入啱密碼
  isSet() { return !!S.parent.hash; },
  set(pw) { S.parent.salt = uid() + uid(); S.parent.hash = hashPw(pw, S.parent.salt); S.parent.skipped = false; this.ok = true; saveNow(); save(); },
  check(pw) { return this.isSet() && hashPw(pw, S.parent.salt) === S.parent.hash; }
};

/* ---------- 音效（WebAudio 合成，唔使 MP3） ---------- */
const Sfx = {
  ctx: null,
  init() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { } },
  tone(freqs, dur = .12, type = 'sine', vol = .16, gap = .09) {
    if (!this.ctx) return; const t0 = this.ctx.currentTime;
    freqs.forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(this.ctx.destination);
      const t = t0 + i * gap; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      o.start(t); o.stop(t + dur + .02);
    });
  },
  tap() { this.tone([660], .07, 'triangle', .1); },
  grow() { this.tone([523, 659, 784, 1046], .22, 'sine', .14, .08); },
  open() { this.tone([392, 523], .14, 'triangle', .14, .07); },
  soft() { this.tone([440, 554], .18, 'sine', .1, .1); },
  alert() { this.tone([880, 660, 880], .18, 'square', .22, .14); }, // 重要提示：夠大聲
  // 噪音類音效（打爛嘢、水花、咻一聲等）
  noise(dur = .3, f = 1200, q = 1, vol = .25, type = 'lowpass', sweep) {
    if (!this.ctx) return; const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(); s.buffer = b; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, c.currentTime + dur);
    const g = c.createGain(); g.gain.value = vol; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start();
  },
  crash() { this.noise(.6, 2600, .7, .35, 'highpass'); this.tone([220, 180], .2, 'triangle', .12, .05); },
  splash() { this.noise(.7, 900, .8, .3, 'lowpass', 300); },
  whoosh() { this.noise(.45, 400, 2, .28, 'bandpass', 2400); },
  shutter() { this.noise(.05, 4000, 1, .3, 'highpass'); setTimeout(() => this.noise(.06, 3000, 1, .25, 'highpass'), 90); },
  cheer() { this.noise(1.0, 1500, .5, .16, 'bandpass'); this.tone([523, 659, 784, 1046, 1318], .25, 'triangle', .12, .07); },
  whistle() { this.tone([1760, 1760, 1975], .18, 'sine', .14, .12); },
  pop() { this.tone([880, 440], .1, 'sine', .14, .04); },
  thud() { this.tone([110, 80], .25, 'sine', .3, .05); this.noise(.15, 300, 1, .2); },
  magic() { this.tone([784, 988, 1175, 1568, 1976], .3, 'sine', .1, .06); },
  rewind() { this.tone([880, 784, 659, 523, 440, 330], .12, 'sawtooth', .05, .05); },
  bell() { this.tone([1046, 1318, 1046, 1318], .3, 'sine', .12, .25); },
  door() { this.thud(); }
};

/* =========================================================
   語音引擎
   - 一條佇列逐句讀；3D 手勢完全唔會呼叫 cancel()
   - 只有：⏸ 暫停、入新一頁／新一關、撳另一個喇叭，先會轉
   - 回饋：等而家嗰句讀完先插入，讀完再接返原本嗰段
   ========================================================= */
const ROLE_VOICE = {
  narr: { g: 'f', pitch: 1.0, rate: 1.0 },
  me: { g: 'f', pitch: 1.25, rate: 1.05 },
  turtle: { g: 'm', pitch: 0.7, rate: 0.82 },
  rabbit: { g: 'f', pitch: 1.45, rate: 1.05 },
  bear: { g: 'm', pitch: 1.2, rate: 1.0 },
  fox: { g: 'f', pitch: 1.3, rate: 1.05 },
  deer: { g: 'f', pitch: 1.05, rate: 0.95 },
  mom: { g: 'f', pitch: 1.0, rate: 0.95 },
  dad: { g: 'm', pitch: 0.9, rate: 0.95 },
  bro: { g: 'm', pitch: 1.6, rate: 1.08 },
  dog: { g: 'm', pitch: 1.35, rate: 1.05 },
  granny: { g: 'f', pitch: .85, rate: .85 }
};
const Voice = {
  q: [], i: 0, playing: false, paused: false, token: 0, unlocked: false, pending: null,
  all: [], hk: [], fallbackLang: '', warned: false, cur: null, wd: 0, onSpeak: null,
  supported: 'speechSynthesis' in window,
  init() {
    if (!this.supported) return;
    const load = () => {
      this.all = speechSynthesis.getVoices() || [];
      this.hk = this.all.filter(v => /^(zh[-_]HK|yue)/i.test(v.lang) || /cantonese|粵|廣東/i.test(v.name));
      if (!this.hk.length) {
        const zh = this.all.filter(v => /^zh/i.test(v.lang));
        this.fallbackLang = zh.length ? zh[0].lang : '';
      }
      if (typeof UI !== 'undefined' && UI.refreshVoiceInfo) UI.refreshVoiceInfo();
    };
    load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  // 揀聲：先用廣東話；分男／女聲；冇就用調音高做後備
  pick(role) {
    const cfg = ROLE_VOICE[S.settings.charVoices ? role : 'narr'] || ROLE_VOICE.narr;
    let list = this.hk.length ? this.hk : this.all.filter(v => /^zh/i.test(v.lang));
    let v = null;
    if (S.settings.voiceURI) v = list.find(x => x.voiceURI === S.settings.voiceURI) || null;
    if (S.settings.charVoices && list.length > 1) {
      const fem = /sin-?ji|tracy|hiugaai|hiumaan|female|女|siu/i, mal = /danny|wanlung|aasing|male|男/i;
      const want = cfg.g === 'm' ? list.find(x => mal.test(x.name)) : cfg.g === 'f' ? list.find(x => fem.test(x.name) && !/male/i.test(x.name.replace(/female/i, ''))) : null;
      if (want && role !== 'narr') v = want;
    }
    if (!v) v = list.find(x => x.localService) || list[0] || null;
    // 有專屬男聲就唔使將音調壓太低
    let pitch = cfg.pitch;
    if (v && cfg.g === 'm' && /danny|wanlung|male|男/i.test(v.name)) pitch = Math.max(.8, pitch + .15);
    return { v, pitch: S.settings.charVoices ? pitch : 1, rate: (S.settings.charVoices ? cfg.rate : 1) * (S.settings.rate || 1) };
  },
  // 將長文切細（Chrome 讀長句會無故停）
  chunk(text) {
    let t = String(text || '');
    try { t = t.replace(new RegExp('[\\p{Extended_Pictographic}\\uFE0F\\u200D]', 'gu'), ''); } catch (e) { }
    t = t.replace(/[✕▶⏸]/g, '').replace(/\s+/g, ' ').trim();
    if (!t) return [];
    // 唔用 lookbehind（舊 iPad Safari 唔支援）
    const parts = (t.match(/[^。！？!?；;\n]+[。！？!?；;\n]*/g) || [t]).map(s => s.trim()).filter(Boolean);
    const out = [];
    for (const p of parts) {
      if (p.length <= 60) { out.push(p); continue; }
      let buf = '';
      for (const seg of (p.match(/[^，,、：:]+[，,、：:]*/g) || [p])) { if ((buf + seg).length > 60 && buf) { out.push(buf); buf = ''; } buf += seg; }
      if (buf) out.push(buf);
    }
    return out;
  },
  toItems(arr) { // arr: [{text, role, el}] 或者字串
    const items = [];
    for (const a of [].concat(arr)) {
      const o = typeof a === 'string' ? { text: a, role: 'narr' } : a;
      for (const c of this.chunk(o.text)) items.push({ text: c, role: o.role || 'narr', el: o.el || null });
    }
    return items;
  },
  // 撳喇叭或者入新一頁：換成新內容
  play(arr) {
    const items = this.toItems(arr); if (!items.length) return;
    if (!this.unlocked) { this.pending = items; return; }
    this.token++; this.q = items; this.i = 0; this.paused = false;
    if (this.supported) { try { speechSynthesis.cancel(); } catch (e) { } }
    setTimeout(() => this._next(), 60);
    this.ui();
  },
  // 自動朗讀（跟設定）
  auto(arr) { if (S.settings.autoVoice) this.play(arr); },
  // 互動回饋：等而家嗰句讀完先插入
  feedback(arr) {
    if (!S.settings.autoVoice) return;
    const items = this.toItems(arr); if (!items.length) return;
    if (!this.playing || this.paused || !this.unlocked) { this.play(arr); return; }
    this.q.splice(this.i + 1, 0, ...items); this.ui();
  },
  // 撳 3D 物件／角色：唔打斷而家讀緊嘅內容，排喺而家嗰句之後讀
  insert(arr) {
    const items = this.toItems(arr); if (!items.length) return;
    if (!this.playing || this.paused || !this.unlocked) { this.play(arr); return; }
    this.q.splice(this.i + 1, 0, ...items); this.ui();
  },
  _next() {
    clearTimeout(this.wd);
    $$('.spk.on').forEach(b => b.classList.remove('on'));
    if (this.paused) { this.playing = false; this.ui(); return; }
    if (this.i >= this.q.length) { this.playing = false; this.ui(); return; }
    const it = this.q[this.i];
    if (it.el) it.el.classList.add('on');
    if (this.onSpeak) this.onSpeak(it);
    if (!this.supported) { // 冇語音功能：用時間模擬，流程照行
      this.playing = true; const tk = this.token;
      this.wd = setTimeout(() => { if (tk === this.token) { this.i++; this._next(); } }, 300 + it.text.length * 120);
      this.ui(); return;
    }
    const u = new SpeechSynthesisUtterance(it.text);
    const p = this.pick(it.role);
    if (p.v) { u.voice = p.v; u.lang = p.v.lang; } else u.lang = 'zh-HK';
    u.pitch = Math.max(0.1, Math.min(2, p.pitch)); u.rate = Math.max(0.5, Math.min(1.6, p.rate)); u.volume = 1;
    const tk = ++this.token;
    const done = () => { if (tk !== this.token) return; this.i++; this._next(); };
    u.onend = done;
    u.onerror = (e) => { if (tk !== this.token) return; if (e && (e.error === 'interrupted' || e.error === 'canceled')) return; done(); };
    this.cur = u; this.playing = true;
    // 保險：部分瀏覽器唔觸發 onend
    this.wd = setTimeout(() => { if (tk === this.token && this.playing && !this.paused) { if (!speechSynthesis.speaking) done(); else this.wd = setTimeout(() => { if (tk === this.token && !speechSynthesis.speaking) done(); }, 4000); } }, 2500 + it.text.length * 330 / (p.rate || 1));
    try { speechSynthesis.speak(u); } catch (e) { done(); }
    this.ui();
  },
  pause() { if (!this.playing && !this.q.length) return; this.paused = true; this.token++; clearTimeout(this.wd); if (this.supported) try { speechSynthesis.cancel(); } catch (e) { } this.playing = false; $$('.spk.on').forEach(b => b.classList.remove('on')); this.ui(); },
  resume() { if (!this.paused) return; this.paused = false; this._next(); }, // 由停低嗰句重新讀起
  toggle() { if (this.paused) this.resume(); else if (this.playing) this.pause(); },
  stop() { this.token++; this.q = []; this.i = 0; this.paused = false; this.playing = false; clearTimeout(this.wd); if (this.supported) try { speechSynthesis.cancel(); } catch (e) { } this.ui(); },
  // iOS：第一下撳畫面先解鎖
  unlock() {
    if (this.unlocked) return; this.unlocked = true; Sfx.init();
    if (this.supported) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { } }
    if (this.pending && S.settings.autoVoice) { const p = this.pending; this.pending = null; this.token++; this.q = p; this.i = 0; setTimeout(() => this._next(), 120); }
    this.ui();

    const nose = this.mesh(new T.SphereGeometry(.06, 6, 4), o.kind === 'rabbit' ? 0xff8fb1 : 0x3a2a2a); nose.position.set(0, -.08, .58); head.add(nose);

  setMood(id, m) {
    const c = this.chars[id]; if (!c) return; c.mood = m;
    const key = m === 'sad' || m === 'worried' ? 'sad' : m === 'neutral' ? 'neutral' : 'happy';
    for (const k in c.parts.mouth) c.parts.mouth[k].visible = k === key;
    // 眉毛：開心／平靜時收埋，傷心、擔心、嬲先出現，一眼睇得出分別
    [-1, 1].forEach(s => { const b = c.parts['brow' + s]; b.visible = m === 'sad' || m === 'worried' || m === 'angry'; b.rotation.z = m === 'angry' ? s * .35 : s * -.35; });
  },
  setGhost(id, on) {

    c.g.traverse(o => { if (o.isMesh) { if (on) { if (!o.userData.om) o.userData.om = o.material; const m = o.material.clone(); m.transparent = true; m.opacity = .22; m.depthWrite = false; o.material = m; } else if (o.userData.om) { o.material = o.userData.om; delete o.userData.om; } } });
  },

  /* ---------------- 舞台走位 ---------------- */
  // 計出舞台位置：主角喺左，其他人排成弧形，全部面向鏡頭
  castPositions(place, cast) {
    const T = this.T, P = PLACES[place] || PLACES.pav;
    const right = new T.Vector3(Math.cos(P.az), 0, -Math.sin(P.az));
    const fwd = new T.Vector3(Math.sin(P.az), 0, Math.cos(P.az));
    const n = cast.length, gap = 1.45;
    return cast.map((id, i) => { const k = i - (n - 1) / 2; return new T.Vector3(P.c[0], 0, P.c[2]).addScaledVector(right, k * gap).addScaledVector(fwd, -Math.abs(k) * .25); });
  },
  placeView(place, cast, extra = 0) {
    const T = this.T, P = PLACES[place] || PLACES.pav;
    const n = Math.max(cast.length, 2);
    const halfW = (n - 1) * 1.45 / 2 + 1.1;
    const aspect = this.aspect || 1;
    const vf = this.cam.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
    const dW = halfW / Math.tan(hf / 2), dH = 3.3 / Math.tan(vf / 2);
    const radius = Math.max(dW, dH, 6) * 1.1 + extra * 3;
    // 頭頂留位畀對白泡泡：目標點高過角色中間
    return { target: new T.Vector3(P.c[0], 1.55 + extra * .3, P.c[2]), theta: P.az, phi: (P.phi || 1.2) - Math.min(.35, extra * .08), radius };
  },
  stage(place, cast = [], opts = {}) {
    if (!this.ok) return this.stage2D(place, cast);
    this.stageInfo = { place, cast: cast.slice() };
    if (this.demoF && !opts.keepDemo) { this.scene.remove(this.demoF); this.demoF = null; }
    const pos = this.castPositions(place, cast);
    for (const id in this.chars) {
      const c = this.chars[id];
      const i = cast.indexOf(id);
      if (i >= 0) { c.g.visible = true; this.moveChar(id, pos[i], opts.instant); }
      else { const h = CHARS[id].home; c.g.visible = !opts.only; this.moveChar(id, new this.T.Vector3(h[0], h[1], h[2]), true); }
      this.setGhost(id, false);
    }
    const v = this.placeView(place, cast, opts.wide || 0);
    this.view = v; this.flyTo(v, opts.instant ? 0 : 1.2);
    this.clearBubbles();
  },
  overview() { if (!this.ok) return; const v = { target: new this.T.Vector3(0, 0, 0), theta: .35, phi: .82, radius: Math.max(30, 26 / Math.min(1, this.aspect || 1)), fixed: true }; this.view = v; this.flyTo(v, 0); },
  stage2D(place, cast) {
    const f = $('#fbCast'); if (f) f.textContent = (PLACES[place] ? PLACES[place].em + ' ' : '') + cast.map(id => CHARS[id] ? CHARS[id].em : '').join(' ');

/* ---------- 進度計算 ---------- */
const age = () => S.profile.age || 8;
const older = () => age() >= 9;
const visLV = () => LV.filter(l => CH[l.ch].age <= age());
const visCH = () => CH.filter(c => c.age <= age());
const isDone = id => !!S.progress.done[id];
function isUnlocked(id) {
  if (S.progress.unlockedAll) return true;
  const list = visLV(); const i = list.findIndex(l => l.id === id);
  return i <= 0 || list.slice(0, i).every(l => isDone(l.id));
}
function chLearned(c) { const ls = LV.filter(l => l.ch === c.id); return ls.length && ls.every(l => isDone(l.id)); }
function nextLevel() { return visLV().find(l => !isDone(l.id) && isUnlocked(l.id)) || null; }
function updateProg() {
  const L = visLV(), C = visCH(), d = L.filter(l => isDone(l.id)).length, k = C.filter(chLearned).length, gl = Object.keys(S.globes || {}).length;
  if (G.lv) { const i = L.findIndex(l => l.id === G.lv.id); $('#prog').innerHTML = `<span>第 <b>${i + 1}</b>/${L.length} 關</span><span>技巧 <b>${k}</b>/${C.length}</span>`; }
  else $('#prog').innerHTML = `<span>完成 <b>${d}</b>/${L.length} 關</span><span>🔮 <b>${gl}</b> · 技巧 <b>${k}</b>/${C.length}</span>`;
  $('#prog').title = `完成 ${d}/${L.length} 關，學識 ${k}/${C.length} 種技巧，收集咗 ${gl} 個回憶水晶球`;
}
function addRoot(id, n = 1) { S.roots[id] = (S.roots[id] || 0) + n; if (G.grew) G.grew.push(id); save(); World.rootsGrow(); }
function rootName(id) { const r = ROOTS.find(x => x.id === id); return r ? r.em + ' ' + r.name : id; }
function diary(title, lines, photo, lv) {
  S.diary.unshift({ id: uid(), at: Date.now(), title, lines, photo: photo || '', lv: lv || '' });
  if (S.diary.length > 300) S.diary.pop();
  let n = 0; S.diary.forEach(e => { if (e.photo && ++n > 30) e.photo = ''; }); // 相最多留 30 張，唔會長期大量佔用空間
  save();
}

function holdButton(btn, ms, done, onP) {
  let t0 = 0, raf = 0, fin = false;
  const step = () => { const p = Math.min(1, (performance.now() - t0) / ms); btn.style.setProperty('--p', (p * 100) + '%'); if (onP) onP(p); if (p >= 1) { fin = true; done(); return; } raf = requestAnimationFrame(step); };
  const down = e => { e.preventDefault(); if (fin) return; t0 = performance.now(); btn.classList.remove('pulse'); raf = requestAnimationFrame(step); };
  const up = () => { if (fin) return; cancelAnimationFrame(raf); btn.style.setProperty('--p', '0%'); if (onP) onP(0); btn.classList.add('pulse'); };
  btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
  btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!t0 || fin) { t0 = performance.now(); raf = requestAnimationFrame(step); } } });
}

        $('#bDemoN').onclick = () => { k++; if (k < c.demo.length) show(); else stepsRun(G.steps, finishLevel); };

// 每關大約三步，輪流用唔同工具，唔會次次一樣
function buildSteps(lv) {
  const tool = CH[lv.ch].tool, idx = LV.indexOf(lv), s = [];
  const MAIN = { circle: 'circle', seed: 'seedIf', repair: 'repair', help: 'help', gift: 'gift', pattern: 'pattern', carry: 'carry', lookback: 'lookback', free: 'free', care: 'care', weather: 'weather', describe: 'describeFull' };
  if (tool === 'basic') s.push('describe', 'weather');
  else if (tool === 'describe') s.push('describeFull', 'weather');
  else if (tool === 'weather') { if (lv.mode === 'learn') s.push('describe'); s.push('weather'); }
  else if (!['carry', 'free'].includes(tool)) s.push(idx % 2 ? 'weather' : 'describe');
  else s.push('weather');
  if (older() && lv.other && !['glasses', 'free', 'carry'].includes(tool)) s.push('glasses');
  if (tool === 'glasses') s.push('glassesFull');
  if (MAIN[tool] && !s.includes(MAIN[tool])) s.push(MAIN[tool]);
  if (!['seed', 'carry'].includes(tool) && lv.seeds && lv.seeds.length) s.push('seed');
  return s;
}
function stepsRun(steps, done) {
  let i = 0; G.runSteps = steps;
  const next = () => {
    World.onToolPick = null; Stage.cancelTap(); if (World.pov) World.endPov(); World.clearBubbles();

// 控制圈拖曳（手指同滑鼠都得）
function dragPiece(el, onDrop) {
  let st = null, ghost = null, over = null;
  el.addEventListener('pointerdown', e => { if (el.parentElement.id !== 'pool') return; st = { x: e.clientX, y: e.clientY, id: e.pointerId }; el.setPointerCapture && el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    if (!ghost && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 6) { ghost = el.cloneNode(true); ghost.classList.add('drag'); document.body.appendChild(ghost); el.style.opacity = .3; }
    if (ghost) {
      ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + 'px'; ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + 'px';
      const t = document.elementFromPoint(e.clientX, e.clientY); const c = t && t.closest && t.closest('.circ');
      if (over && over !== c) over.classList.remove('over'); over = c; if (c) c.classList.add('over');
    }
  });
  const end = e => {
    if (!st) return; st = null;
    if (ghost) { ghost.remove(); ghost = null; el.style.opacity = ''; if (over) { over.classList.remove('over'); const w = over.dataset.c; over = null; onDrop(w); } }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

          // 輸出上限太大：自動減細再試（避免思考模式爆 token）
          if ((res.status === 400 || res.status === 422) && /max[_ ]?tokens|max_new_tokens|too large|exceed|out of range|範圍|1210|1214/i.test(t) && maxT > 4096) { maxT = Math.floor(maxT / 2); this.tick(`輸出上限太大，自動改做 ${maxT} 再試…`); continue; }
          if ((res.status === 400 || res.status === 422) && /thinking/i.test(t) && useThink) { useThink = false; this.tick('呢個模型唔支援思考模式設定，改用普通模式再試…'); continue; }
          errMsg = res.status === 401 || res.status === 403 ? 'API Key 唔啱，或者冇權限用呢個模型。' : res.status === 404 ? '網址或者模型名稱唔啱（404）。' : res.status === 429 ? '用得太密或者額度用完（429），等一陣再試。' : `伺服器回覆錯誤（${res.status}）：${t.slice(0, 160)}`;
          break;
        }
        this.status('ok', '已連線，樹洞諗緊…');
        const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
        const wd = setInterval(() => { idle++; if (idle > 90) { try { this.ctrl.abort(); } catch (e) { } } }, 1000);
        try {
          while (true) {
            const { value, done } = await rd.read(); if (done) break; idle = 0;
            buf += dec.decode(value, { stream: true });
            let nl; while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
              if (!line.startsWith('data:')) continue; const data = line.slice(5).trim(); if (data === '[DONE]') continue;
              let j; try { j = JSON.parse(data); } catch (e) { continue; }
              const d = (j.choices && j.choices[0] && (j.choices[0].delta || j.choices[0].message)) || {};
              const r = d.reasoning_content || d.reasoning || d.thinking || '';
              if (r) { think += r; this.tick(think); $('#aiThink').textContent = think; $('#aiThinkD').hidden = false; }
              if (d.content) { ans += d.content; $('#aiOut').textContent = ans; this.status('ok', '已連線，回應緊…'); if (!think) this.tick('回應緊：' + ans); }
              if (j.error) { errMsg = 'AI 回覆錯誤：' + (j.error.message || JSON.stringify(j.error)).slice(0, 160); }
            }
          }
        } finally { clearInterval(wd); }
        break;
      } catch (e) {
        if (e.name === 'AbortError') errMsg = ans ? '' : (idle > 90 ? '太耐冇回應，已經停咗。可以再試。' : '已經停咗。');
        else errMsg = '連唔到線：可能冇上網、Base URL 唔啱，或者呢個 AI 服務唔畀瀏覽器直接連（CORS）。';
        break;
      }
    }
    this.busy = false; this.ctrl = null; $('#bAISend').disabled = false; $('#bAIStop').hidden = true; $('#aiOut').classList.remove('caret');
    if (!ans && errMsg) { rec.thinking = think; rec.status = 'error'; rec.error = errMsg; this.keep(rec); this.status('err', errMsg); $('#aiOut').textContent = ''; $('#aiOutCard').hidden = true; this.tick('出錯：' + errMsg); Sfx.alert(); UI.toast(errMsg, 5000); if (/Key|網址|Base/.test(errMsg)) $('#aiSafe').insertAdjacentHTML('beforeend', `<button class="btn slate" id="bGoSet2" style="margin:6px 0">⚙️ 去設定</button>`), $('#bGoSet2').onclick = () => openSettings('ai'); return; }
    if (!ans && think) ans = '（樹洞諗咗好耐，但未講完。可以撳送出再試，或者喺設定加大輸出上限。）';
    this.status('ok', errMsg ? '部分完成：' + errMsg : '完成 ✓');
    rec.thinking = think; rec.answer = ans; rec.status = errMsg ? 'partial' : 'done'; rec.error = errMsg || ''; rec.flagged = rec.flagged || /【需要大人】/.test(ans);
    if (/【需要大人】/.test(ans) && !danger) { S.flags.push({ id: uid(), at: Date.now(), src: 'ai', text: text.slice(0, 200) }); }
    this.keep(rec); $('#aiIn').value = '';
    this.session.push({ role: 'user', content: text }, { role: 'assistant', content: ans });
    this.render(ans);
  },
  // 記低／更新一條對話：本機即刻儲，再即刻上載 Firebase（有登入嘅話）
  keep(rec) {
    rec.updatedAt = Date.now();
    if (!S.chats.some(c => c.id === rec.id)) S.chats.push(rec);
    trimChats(); saveNow();
    Cloud.pushChat(rec); Cloud.schedulePush();

  },
  // 拆成：拆解、可以試吓、自我對話逐字稿（可以播）、問自己
  render(ans) {
    const get = k => { const m = ans.match(new RegExp('【' + k + '】([\\s\\S]*?)(?=【|$)')); return m ? m[1].trim() : ''; };
    const a = get('拆解'), b = get('可以試吓'), c = get('自我對話逐字稿'), d = get('問自己');
    if (!a && !b && !c) { $('#aiSecs').innerHTML = spk(ans); Voice.auto([ans]); return; }
    $('#aiOut').hidden = true;
    const lines = c.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const read = lines.map(l => ({ text: l.replace(/^(我|內心嘅我)[:：]\s*/, ''), role: /^內心/.test(l) ? 'turtle' : 'me' }));
    let h = '';
    if (/【需要大人】/.test(ans)) h += `<div class="card pink"><p class="txt">樹洞覺得呢件事要同大人講。唔係你嘅錯。</p>${spk('樹洞覺得呢件事要同大人講。唔係你嘅錯。')}</div>`;
    if (a) h += `<div class="card"><h4>🔍 拆解</h4><p class="txt" style="white-space:pre-wrap">${esc(a)}</p>${spk(a)}</div>`;
    if (b) h += `<div class="card green"><h4>🌱 可以試吓</h4><p class="txt" style="white-space:pre-wrap">${esc(b)}</p>${spk(b)}</div>`;
    if (c) h += `<div class="card blue"><h4>💬 自我對話逐字稿</h4>${lines.map(l => { const m = l.match(/^(我|內心嘅我)[:：]\s*(.*)$/); return m ? `<p class="dialog-line"><b>${m[1]}：</b>${esc(m[2])}</p>` : `<p class="dialog-line">${esc(l)}</p>`; }).join('')}<button class="btn main" id="bPlayT" style="margin-top:6px">▶ 播逐字稿</button>${spk(c)}</div>`;
    if (d) h += `<div class="card purple"><h4>❓ 問自己</h4><p class="txt">${esc(d)}</p>${spk(d)}</div>`;
    $('#aiSecs').innerHTML = h;
    const p = $('#bPlayT'); if (p) p.onclick = () => Voice.play(read);
    Voice.auto([a].concat(b ? ['可以試吓：' + b] : []).concat(['想聽自我對話逐字稿，可以撳播逐字稿。']));
  }
};

async function testAI() {

  set('wait', '連線中…'); tk.classList.remove('idle'); run.textContent = '連線中…';
  let txt = '';
  try {
    const url = AIC.baseUrl.replace(/\/+$/, '') + (/\/chat\/completions$/.test(AIC.baseUrl) ? '' : '/chat/completions');
    const body = { model: AIC.model, stream: true, max_tokens: 2048, messages: [{ role: 'user', content: '用廣東話講一句「你好，連線成功」。' }] };
    if (AIC.thinking) body.thinking = { type: 'disabled' };
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + AIC.key }, body: JSON.stringify(body) });
    if (!res.ok) { const t = await res.text().catch(() => ''); set('err', `失敗（${res.status}）：${t.slice(0, 120)}`); Sfx.alert(); return; }
    set('ok', '已連線，接收緊…');
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); let nl; while ((nl = buf.indexOf('\n')) >= 0) { const l = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1); if (!l.startsWith('data:') || l.includes('[DONE]')) continue; try { const j = JSON.parse(l.slice(5)); const d = j.choices[0].delta || {}; txt += (d.reasoning_content || '') + (d.content || ''); run.textContent = txt.slice(-120); } catch (e) { } } }
    set('ok', '連線成功 ✓');
  } catch (e) { set('err', '連唔到線：可能 Base URL 唔啱、冇上網，或者服務唔畀瀏覽器直接連（CORS）。'); Sfx.alert(); }
}

    <details class="more"><summary>📖 畀大人：點樣陪小朋友反思</summary><div class="in">${PARENT_TIPS.map(t => `<p class="txt">• ${esc(t)}</p>`).join('')}</div></details>
    <button class="btn help" id="pClear">🧹 清空所有資料</button>`;
  UI.sheet('👪 家長區', h);
  $('#pLock').onclick = () => { Parent.ok = false; UI.closeSheet(); UI.toast('🔒 鎖返喇'); };
  $$('#sheetInner [data-age]').forEach(b => b.onclick = () => { S.profile.age = +b.dataset.age; save(); updateProg(); openParent(); UI.toast('年齡改咗做 ' + b.dataset.age + ' 歲'); });
  $('#pUnlock').onclick = () => { S.progress.unlockedAll = !S.progress.unlockedAll; save(); openParent(); UI.toast(S.progress.unlockedAll ? '🔓 所有關卡已解鎖' : '🔒 已鎖返，要跟次序玩'); };
  $('#pExpT').onclick = () => exportData('txt'); $('#pExpJ').onclick = () => exportData('json');
  $('#fbSave').onclick = () => { const v = $('#fbCfg').value.trim(); if (v) { try { parseCfg(v); } catch (e) { $('#fbSt').textContent = 'JSON 格式唔啱，請貼 { … } 嗰部分。'; return; } } S.firebase.config = v; save(); Cloud.load().then(() => $('#fbSt').textContent = Cloud.statusText()); };
  $('#fbIn').onclick = () => Cloud.login().then(() => { const el = $('#fbSt'); if (el) el.textContent = Cloud.statusText(); });
  $('#fbSync').onclick = () => Cloud.sync().then(() => { const el = $('#fbSt'); if (el) el.textContent = Cloud.statusText(); });
  $('#fbOut').onclick = () => Cloud.logout().then(() => { const el = $('#fbSt'); if (el) el.textContent = Cloud.statusText(); });
  $('#pChg').onclick = () => { const a = $('#c1').value, b = $('#c2').value; if (a.length < 4 || a !== b) { UI.toast('兩次要一樣，最少 4 個字。'); Sfx.alert(); return; } Parent.set(a); UI.toast('🔑 改好喇'); };
  $('#pClear').onclick = clearAll;
  renderParentChats();
  if (Cloud.user) Cloud.sync().then(() => { if ($('#pChats')) renderParentChats(); });
}
// 家長區：完整睇晒小朋友同樹洞講過乜
function renderParentChats(all) {
  const box = $('#pChats'); if (!box || !Parent.ok) return;
  const st = $('#pChatSt'); if (st) st.textContent = Cloud.user ? '☁️ ' + Cloud.statusText() : '📱 只係呢部機嘅紀錄（未登入 Firebase）。';
  const list = S.chats.slice().sort((a, b) => (b.at || 0) - (a.at || 0)), shown = all ? list : list.slice(0, 20);
  const stTxt = c => c.status === 'waiting' ? '⏳ 等緊 AI 回覆…' : c.status === 'error' ? '⚠️ 冇 AI 回覆：' + (c.error || '出錯') : c.status === 'partial' ? '（未講完：' + (c.error || '') + '）' : '';
  box.innerHTML = shown.map(c => `<div class="entry"${c.flagged ? ' style="border-left:4px solid var(--pink);padding-left:8px"' : ''}><span class="when">${fmtTime(c.at)}${c.flagged ? ' 🚩' : ''}</span>
    <p class="txt" style="white-space:pre-wrap;margin:4px 0"><b>小朋友：</b>${esc(c.user || '')}</p>
    ${c.answer ? `<details class="more"><summary>🌳 樹洞回答</summary><div class="in"><p class="small" style="white-space:pre-wrap">${esc(c.answer)}</p></div></details>` : ''}
    ${stTxt(c) ? `<p class="small">${esc(stTxt(c))}</p>` : ''}
    ${c.thinking ? `<details class="more"><summary>🧠 AI 思考過程</summary><div class="in"><p class="small" style="white-space:pre-wrap">${esc(c.thinking)}</p></div></details>` : ''}</div>`).join('') || '<p class="small">未有對話。</p>';
  if (!all && list.length > shown.length) { box.insertAdjacentHTML('beforeend', `<button class="mini-btn" id="pChatAll">顯示全部（${list.length}）</button>`); $('#pChatAll').onclick = () => renderParentChats(true); }
}
// 本機最多留 300 段；舊嘅思考過程喺本機截短（雲端仍然有完整版本）
function trimChats() {
  S.chats.sort((a, b) => (a.at || 0) - (b.at || 0));
  if (S.chats.length > 300) S.chats.splice(0, S.chats.length - 300);
  const n = S.chats.length; S.chats.forEach((c, i) => { if (i < n - 20 && c.thinking && c.thinking.length > 3000) c.thinking = c.thinking.slice(0, 3000) + '…（本機截短，完整版喺雲端／匯出前請先同步）'; });
}
// 合併對話：同一條以較新（updatedAt）為準
function mergeChats(rc) {
  const sent = Cloud.sentMap(); let ch = false;
  for (const r of rc || []) {
    if (!r || !r.id) continue;
    const i = S.chats.findIndex(c => c.id === r.id), l = i >= 0 ? S.chats[i] : null;
    sent[r.id] = Math.max(sent[r.id] || 0, r.updatedAt || r.at || 0);
    if (l && (l.updatedAt || l.at || 0) > (r.updatedAt || r.at || 0)) continue;
    if (l && (l.thinking || '').length > (r.thinking || '').length && (l.updatedAt || 0) === (r.updatedAt || 0)) continue;
    if (l) S.chats[i] = Object.assign({}, l, r); else S.chats.push(r); ch = true;
  }
  LS.set('gi_cloud_sent2', sent);
  if (ch) { trimChats(); saveNow(); if ($('#pChats')) renderParentChats(); }
  return ch;
}
function exportData(kind) {
  if (!Parent.ok) { UI.toast('要先入家長密碼。'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const pack = { app: '成長小島', exportedAt: new Date().toISOString(), profile: S.profile, roots: S.roots, progressDone: Object.keys(S.progress.done), flags: S.flags, chats: S.chats };
  let blob, name;
  if (kind === 'json') { blob = new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }); name = `growth-island-${stamp}.json`; }
  else {
    let t = `成長小島：對話紀錄（${stamp}）\n名：${S.profile.name || '（冇填）'}　年齡：${age()}\n完成關卡：${pack.progressDone.length}\n根：${ROOTS.map(r => r.name + ' ' + (S.roots[r.id] || 0)).join('、')}\n\n`;
    if (S.flags.length) t += '【需要留意】\n' + S.flags.map(f => `- ${fmtTime(f.at)}（${f.src}）：${f.text}`).join('\n') + '\n\n';
    S.chats.forEach((c, i) => { t += `==== 對話 ${i + 1}（${fmtTime(c.at)}）${c.flagged ? ' 🚩' : ''} ====\n小朋友：${c.user}\n\n【AI 思考過程】\n${c.thinking || '（冇）'}\n\n【AI 回應】\n${c.answer}\n\n`; });
    if (!S.chats.length) t += '（暫時未有同樹洞嘅對話）\n';
    blob = new Blob(['﻿' + t], { type: 'text/plain;charset=utf-8' }); name = `growth-island-${stamp}.txt`;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); UI.toast('📤 已經下載：' + name);
}
function clearAll() {
  UI.modal(`<p class="big">🧹 真係要清空晒所有資料？</p><p class="small">進度、日記、對話、花園都會刪走，冇得還原。AI 設定會保留。</p><div class="row"><button class="btn help" id="cY">清空</button><button class="btn ghost" id="cN">取消</button></div>`);
  $('#cN').onclick = UI.closeModal;
  $('#cY').onclick = () => { const keepFb = S.firebase; S = freshState(); S.firebase = keepFb; saveNow(); UI.closeModal(); UI.closeSheet(); World.resetWorld(); Parent.ok = false; UI.toast('🧹 清空咗'); splash(); };
}

/* ---------------- Firebase 跨裝置同步（家長自己嘅戶口） ---------------- */
// 接受純 JSON，或者由 Firebase 網站直接複製嘅 { apiKey: "…" } 物件
function parseCfg(txt) {
  const body = String(txt).slice(String(txt).indexOf('{'), String(txt).lastIndexOf('}') + 1);
  try { return JSON.parse(body); } catch (e) { const o = new Function('return (' + body + ')')(); if (!o || typeof o !== 'object' || !o.apiKey) throw new Error('bad'); return o; }
}
const Cloud = {
  app: null, auth: null, db: null, user: null, err: '', loading: null, pushT: 0,
  statusText() {
    if (!S.firebase.config) return '未設定 Firebase：資料只存喺呢部機。';
    if (this.err) return '⚠️ ' + this.err;
    if (!this.app) return '設定咗，未連接。';
    return this.user ? `✅ 已登入：${this.user.email || this.user.uid}，資料會自動同步。` : '未登入：撳「Google 登入」。';
  },
  loadScript(src) { return new Promise((ok, no) => { if ([...document.scripts].some(s => s.src === src)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('load ' + src)); document.head.appendChild(s); }); },
  async load() {
    if (!S.firebase.config) return; if (this.loading) return this.loading;
    this.loading = (async () => {
      try {
        const cfg = parseCfg(S.firebase.config);
        const v = 'https://www.gstatic.com/firebasejs/10.12.2/';
        await this.loadScript(v + 'firebase-app-compat.js'); await this.loadScript(v + 'firebase-auth-compat.js'); await this.loadScript(v + 'firebase-firestore-compat.js');
        this.app = firebase.apps.find(a => a.name === 'gi') || firebase.initializeApp(cfg, 'gi');
        this.auth = this.app.auth(); this.db = this.app.firestore(); this.err = '';
        if (location.protocol === 'file:') this.err = '用 file:// 打開唔可以 Google 登入，請放上 https 網址（例如 GitHub Pages）。';
        this.auth.getRedirectResult().catch(() => { });
        this.auth.onAuthStateChanged(u => { this.user = u; if (u) { this.sync(); this.listen(); } else this.unlisten(); });
      } catch (e) { this.err = 'Firebase 載入失敗：' + (e.message || e); this.app = null; }
    })();
    const r = await this.loading; this.loading = null; return r;
  },
  async login() {
    await this.load(); if (!this.auth) { UI.toast(this.statusText(), 4000); return; }
    try { await this.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { if (/popup/i.test(e.code || '')) await this.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else { this.err = '登入失敗：' + (e.message || e.code); UI.toast(this.err, 5000); } }
  },
  async logout() { this.unlisten(); if (this.auth) await this.auth.signOut(); this.user = null; },
  sentMap() { return LS.get('gi_cloud_sent2', {}) || {}; },
  // 另一部機一送出，呢部機即刻收到（唔使撳同步）
  listen() {
    this.unlisten(); if (!this.user || !this.db) return;
    this.unsub = this.ref().collection('chats').onSnapshot(snap => {
      const rc = []; snap.docChanges().forEach(d => { if (d.type !== 'removed') rc.push(d.doc.data()); });
      if (rc.length) mergeChats(rc);
    }, e => { this.err = '即時同步失敗：' + (e.message || e); });
  },
  unlisten() { if (this.unsub) { try { this.unsub(); } catch (e) { } this.unsub = null; } },
  async pushChat(c) {
    if (!this.user || !this.db) { if (S.firebase.config && !this.app) this.load(); return; }
    const d = JSON.parse(JSON.stringify(c));
    if ((d.thinking || '').length > 150000) d.thinking = d.thinking.slice(0, 150000) + '…（太長，已截短）';
    if ((d.answer || '').length > 100000) d.answer = d.answer.slice(0, 100000) + '…';
    try {
      await this.ref().collection('chats').doc(c.id).set(d, { merge: true });
      const s = this.sentMap(); s[c.id] = c.updatedAt || c.at; LS.set('gi_cloud_sent2', s); this.err = '';
    } catch (e) { this.err = '上載對話失敗（會再試）：' + (e.message || e); }
  },
  ref() { return this.db.collection('growthIsland').doc(this.user.uid); },
  pack() { const s = JSON.parse(JSON.stringify(S)); delete s.chats; delete s.updatedAt; s.firebase = { config: '' }; return s; },
  async sync() {
    if (!this.user || !this.db) return;
    try {
      const snap = await this.ref().get();
      if (snap.exists) {
        const r = JSON.parse(snap.data().state || '{}');
        const chats = await this.ref().collection('chats').get(); const rc = []; chats.forEach(d => rc.push(d.data()));
        mergeChats(rc); mergeState(r);
      }
      await this.push(); this.err = '';
    } catch (e) { this.err = '同步失敗：' + (e.message || e); }
  },
  schedulePush() { if (!this.user) return; clearTimeout(this.pushT); this.pushT = setTimeout(() => this.push().catch(e => this.err = '上載失敗：' + e.message), 3000); },
  async push() {
    if (!this.user || !this.db) return;
    await this.ref().set({ state: JSON.stringify(this.pack()), updatedAt: Date.now() });
    // 未上載過、或者之後更新過嘅對話（例如斷線時送出）都補上
    const sent = this.sentMap();
    for (const c of S.chats.slice()) if ((sent[c.id] || 0) < (c.updatedAt || c.at || 1)) await this.pushChat(c);
  }
};
// 合併兩部機嘅資料：唔會刪走任何一邊嘅紀錄
function mergeState(r) {
  const byId = (a, b) => { const m = new Map(); [...(a || []), ...(b || [])].forEach(x => m.set(x.id || x.at, Object.assign({}, m.get(x.id || x.at), x))); return [...m.values()].sort((x, y) => (x.at || 0) - (y.at || 0)); };
  S.diary = byId(S.diary, r.diary).reverse(); S.seeds = byId(S.seeds, r.seeds); S.flags = byId(S.flags, r.flags);
  S.progress.done = Object.assign({}, r.progress && r.progress.done, S.progress.done);
  S.globes = Object.assign({}, r.globes, S.globes);
  for (const k in (r.roots || {})) S.roots[k] = Math.max(S.roots[k] || 0, r.roots[k] || 0);
  if ((r.garden || []).length > S.garden.length) S.garden = r.garden;
  ['stars', 'lanterns', 'butterflies', 'light'].forEach(k => S[k] = Math.max(S[k] || 0, r[k] || 0));
  S.bridges = (S.bridges || [0, 0, 0]).map((v, i) => Math.max(v, (r.bridges || [])[i] || 0));
  if (!S.profile.age && r.profile) S.profile = r.profile;
  if (!S.parent.hash && r.parent && r.parent.hash) S.parent = r.parent;
  saveNow(); World.resetWorld(); updateProg();
}

/* ---------------- 啟動 ---------------- */
function boot() {
  Voice.init(); Voice.ui();
  // 第一下撳畫面（任何位置）：解鎖語音（iOS）
  ['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, () => Voice.unlock(), { capture: true, passive: true }));
  $('#btnMap').onclick = () => { Voice.unlock(); openMap(); };
  $('#btnSet').onclick = () => { Voice.unlock(); openSettings(); };
  $('#btnVoice').onclick = () => { Voice.unlock(); Voice.toggle(); };
  $('#sheetClose').onclick = () => UI.closeSheet();
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') UI.closeModal(); });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.opt,.lv')) { e.preventDefault(); e.target.click(); } });
  World.onPick = onWorldPick; World.onGround = onGround; Stage.onTapPrompt = t => UI.tapHint(t);
  updateProg();
  UI.panel('<div class="card"><p class="big">🏝️ 小島整緊，等一陣……</p></div>');
  World.init().then(ok => {
    if (ok) { World.setMailFlag(true); const gh = $('#gestHint'); gh.classList.remove('hide'); setTimeout(() => gh.classList.add('hide'), 7000); }
    splash();
  });
  if (S.firebase.config) Cloud.load();
  window.__GI = { S: () => S, G, Cloud, World, Voice, LV, startLevel, openMap, STEP, AI, Parent, Stage, SETS, hub, ACT }; // 測試用
}
window.addEventListener('error', e => { console.warn('[成長小島]', e.message); });
window.addEventListener('unhandledrejection', e => { console.warn('[成長小島]', e.reason); });
boot();

</script>
