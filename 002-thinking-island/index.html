<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思考小島大冒險 🦉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350;       /* 深葡萄墨色：所有文字同外框 */
  --sky:#8fdcff;
  --sun:#ffc93c;
  --coral:#ff6b6b;
  --leaf:#3fbf6f;
  --sea:#3d7bff;
  --grape:#8c6bff;
  --paper:#ffffff;
  --font:"Chiron GoRound TC","Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:var(--font);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px dashed var(--sea);outline-offset:3px}
.hidden{display:none!important}

/* ---------- 頂部 ---------- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
#top > *{pointer-events:auto}
.title{font-weight:900;font-size:20px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px 6px 10px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.title span{display:inline-block;transform:rotate(-8deg)}
#badges{display:flex;gap:6px;margin-left:auto}
.badge{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#e9e6f5;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);filter:grayscale(1);opacity:.55;transition:transform .3s}
.badge.on{filter:none;opacity:1;background:var(--sun)}
.badge.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(15deg)}100%{transform:scale(1)}}
.topBtn{height:44px;min-width:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);font-size:15px;font-weight:700;padding:0 10px;box-shadow:0 3px 0 var(--ink)}
.topBtn:active{transform:translateY(3px);box-shadow:none}
.topBtn.onState{background:var(--sun)}

/* ---------- 思思老師對話 ---------- */
#dlg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:12px;width:min(620px,calc(100vw - 24px));z-index:6;display:flex;gap:10px;align-items:flex-start}
.avatar{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:#ffe7c2;border:3px solid var(--ink);font-size:40px;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);position:relative}
.avatar small{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.bubble{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:22px 22px 22px 6px;box-shadow:0 5px 0 var(--ink);padding:12px 12px 12px 16px;position:relative;max-height:calc(100vh - 250px);overflow:auto}
.bubbleHead{display:flex;gap:10px;align-items:flex-start}
#dlgText{flex:1;font-size:19px;line-height:1.55;font-weight:700}
#dlgText b{color:#5a3fd6}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btns.vertical{flex-direction:column}
.optWrap{display:flex;align-items:center;gap:6px}
.btns.vertical .optWrap{width:100%}
.btns.vertical .btn{flex:1;text-align:left}
.btn{font-size:18px;font-weight:900;border:3px solid var(--ink);border-radius:16px;background:var(--sun);padding:10px 16px;box-shadow:0 4px 0 var(--ink);line-height:1.35}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:#eef6ff}
.btn.color{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);min-width:92px}
table.att{border-collapse:collapse;margin-top:6px;font-size:15px}
table.att td,table.att th{border:2px solid var(--ink);padding:4px 8px;text-align:center}
table.att th{background:#efeaff}

/* ---------- 小喇叭 ---------- */
.spk{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:26px;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);padding:0}
.spk:active{transform:translateY(4px);box-shadow:none}
.spk.mini{width:40px;height:40px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.spk.sm{width:44px;height:44px;font-size:20px}
.spk.talking{animation:talk .6s infinite alternate;background:#ffe27a}
@keyframes talk{from{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,201,60,.8)}to{box-shadow:0 4px 0 var(--ink),0 0 0 12px rgba(255,201,60,0)}}

/* ---------- 遊戲控制 (底部) ---------- */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;width:min(720px,calc(100vw - 20px))}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-weight:900;font-size:15px;background:var(--ink);color:#fff;border-radius:10px;padding:3px 9px;white-space:nowrap}
.strip{flex:1;display:flex;gap:4px;flex-wrap:wrap;min-height:40px;align-items:center;padding:4px;border:2px dashed #b9b2d9;border-radius:12px}
.strip .empty{color:#8a83ad;font-size:15px;padding-left:4px}
.chip{position:relative;width:34px;height:34px;border-radius:10px;background:#fff4c7;border:2px solid var(--ink);display:grid;place-items:center;font-size:18px}
.chip i{position:absolute;top:-8px;right:-7px;font-style:normal;font-size:10px;font-weight:900;background:var(--coral);color:#fff;border-radius:8px;padding:0 4px}
.ctrl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.key{width:64px;height:62px;border-radius:16px;border:3px solid var(--ink);background:#dff3ff;font-size:24px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.key small{font-size:13px;font-weight:900}
.key:active{transform:translateY(4px);box-shadow:none}
.key.go{background:var(--leaf);color:#fff;width:84px}
.key.go small{color:#fff}
.key.act{background:#ffe3e3}
.key:disabled{opacity:.45;pointer-events:none}
.pat{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:8px;border:3px solid var(--ink)}
.pat .etc{font-weight:900;font-size:18px}
.stopBtn{display:block;width:100%;margin-top:10px;font-size:26px;font-weight:900;border:4px solid var(--ink);border-radius:20px;background:var(--coral);color:#fff;padding:12px;box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.stopBtn:active{transform:translateY(6px);box-shadow:none}
.stopBtn:disabled{opacity:.5}
.stat{font-weight:900;font-size:16px;margin-left:auto}

/* ---------- 開始畫面 / 證書 / 小視窗 ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(43,35,80,.35)}
#start{background:radial-gradient(circle at 50% 120%,#ffe38a 0 22%,transparent 23%),linear-gradient(#8fdcff,#c9f0ff)}
.startCard{text-align:center;max-width:560px}
.bigOwl{font-size:96px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.startCard h1{font-size:clamp(40px,9vw,68px);margin:4px 0 0;font-weight:900;line-height:1.1;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.04em}
.startCard p{font-size:20px;font-weight:700;margin:14px 0}
.startRow{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:16px}
.btn.huge{font-size:26px;padding:14px 28px;border-radius:22px}
.notice{margin:14px auto 0;background:#fff4c7;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-size:15px;font-weight:700;max-width:480px;text-align:left}
.notice button{margin-top:6px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px;max-width:560px;width:100%;max-height:calc(100vh - 40px);overflow:auto}
.card h2{margin:0 0 8px;font-size:26px;font-weight:900}
.card .head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mottos{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.mottos li{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;font-size:18px;font-weight:700;line-height:1.4}
.mottos li span{font-size:30px}
.cert{background:repeating-linear-gradient(45deg,#fff 0 18px,#fff9e0 18px 36px);text-align:center}
.cert h2{font-size:32px}
.cert .mottos li{background:#fff;text-align:left}
.helpText{font-size:16px;line-height:1.6;font-weight:700}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .35s}
#fade.on{opacity:1}
#voiceChip{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;font-size:13px}

@media (max-width:640px){
  #top{gap:5px;padding-left:8px;padding-right:8px}
  .title{font-size:0;padding:4px 8px}
  .title span{font-size:20px}
  .title .long{display:none}
  #badges{gap:3px}
  .badge{width:34px;height:34px;font-size:16px;border-width:2px}
  .topBtn{height:36px;min-width:36px;font-size:15px;padding:0 5px;border-width:2px}
  .topBtn .long{display:none}
  #dlg{top:calc(env(safe-area-inset-top,0px) + 58px)}
  .avatar{width:48px;height:48px;font-size:28px}
  #dlgText{font-size:16px}
  .btn{font-size:16px;padding:8px 12px}
  .ctrl{gap:5px}
  .key{width:41px;height:52px;font-size:18px;border-width:2px}
  .key small{font-size:11px}
  .key.go{width:50px}
  .spk{width:46px;height:46px;font-size:22px}
  .bubble{max-height:calc(100vh - 290px)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hidden">
  <div class="title"><span>🦉</span> 思考小島<span class="long">大冒險</span></div>
  <div id="badges"></div>
  <button class="topBtn" id="homeBtn" title="返小島">🏝️<span class="long"> 返小島</span></button>
  <button class="topBtn" id="mottoBtn" title="思考口訣">💡<span class="long"> 口訣</span></button>
  <button class="topBtn" id="autoBtn" title="自動讀出">🔈<span class="long"> 自動讀：關</span></button>
</div>

<div id="dlg" class="hidden">
  <div class="avatar">🦉<small>思思老師</small></div>
  <div class="bubble">
    <div class="bubbleHead">
      <div id="dlgText"></div>
      <button class="spk" id="dlgSpk" title="聽廣東話">🔊</button>
    </div>
    <div id="dlgBtns" class="btns"></div>
  </div>
</div>

<div id="hud"></div>
<button id="voiceChip" class="topBtn hidden">⚠️ 未有廣東話語音</button>

<div id="start" class="overlay">
  <div class="startCard">
    <div class="bigOwl">🦉</div>
    <h1>思考小島<br>大冒險</h1>
    <p>同思思老師一齊學四招「思考超能力」！<br>唔識字都唔怕，揿 🔊 小喇叭就可以聽。</p>
    <div class="startRow">
      <button class="spk" id="startSpk" title="聽廣東話">🔊</button>
      <button class="btn huge" id="startBtn">開始冒險 ▶</button>
    </div>
    <div id="startNotice" class="notice hidden"></div>
  </div>
</div>

<div id="modal" class="overlay hidden">
  <div class="card" id="modalCard"></div>
</div>

<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================
   小工具
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rand(a,b+1));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const CN = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二'];
const ease = k => k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;

/* =========================================================
   廣東話語音
   ========================================================= */
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}\u{FE0F}\u{200D}\u{20E3}]/gu;
const Speech = {
  supported: 'speechSynthesis' in window,
  voice: null, auto: false, btn: null, token: 0, checked: false,
  init(){
    if(!this.supported){ showVoiceNotice(true); return; }
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if(!vs.length) return;
      this.voice =
        vs.find(v => /^yue/i.test(v.lang)) ||
        vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
        vs.find(v => /cantonese|粵|廣東|hong kong/i.test(v.name)) || null;
      this.checked = true;
      showVoiceNotice(!this.voice);
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
    setTimeout(() => { if(!this.checked){ pick(); if(!this.checked) showVoiceNotice(true);} }, 1800);
  },
  clean(t){
    return String(t)
      .replace(/①/g,'一號，').replace(/②/g,'二號，').replace(/③/g,'三號，').replace(/④/g,'四號，')
      .replace(EMOJI_RE,'').replace(/[「」『』（）()]/g,'').replace(/\s+/g,' ').trim();
  },
  speak(text, btn){
    if(!this.supported) { showVoiceHelp(); return; }
    this.stop();
    const parts = this.clean(text).split(/(?<=[。！？!?；])/).map(s => s.trim()).filter(s => s.replace(/[。！？!?；，,\s]/g,'').length);
    if(!parts.length) return;
    const token = ++this.token;
    if(btn){ this.btn = btn; btn.classList.add('talking'); }
    setTimeout(() => {
      if(token !== this.token) return;
      parts.forEach((p,i) => {
        const u = new SpeechSynthesisUtterance(p);
        u.lang = this.voice ? this.voice.lang : 'zh-HK';
        if(this.voice) u.voice = this.voice;
        u.rate = 0.9; u.pitch = 1.08;
        if(i === parts.length-1) u.onend = u.onerror = () => { if(token === this.token) this.clearBtn(); };
        speechSynthesis.speak(u);
      });
    }, 70);
  },
  stop(){ this.token++; if(this.supported) speechSynthesis.cancel(); this.clearBtn(); },
  clearBtn(){ if(this.btn){ this.btn.classList.remove('talking'); this.btn = null; } }
};
function spkBtn(getText, cls='spk mini'){
  const b = document.createElement('button');
  b.className = cls; b.textContent = '🔊'; b.title = '聽廣東話';
  b.onclick = e => {
    e.stopPropagation(); unlockAudio();
    if(b.classList.contains('talking')){ Speech.stop(); return; }
    Speech.speak(typeof getText === 'function' ? getText() : getText, b);
  };
  return b;
}
const VOICE_HELP_TEXT = '你部機暫時搵唔到廣東話語音。可以咁樣加：用電腦嘅 Chrome 瀏覽器，通常已經有「Google 粵語（香港）」。Windows：設定，時間與語言，語音，加入「中文（香港）」。iPhone 或者 iPad：設定，輔助使用，語音內容，聲音，揀「中文（香港）」。Android：設定，文字轉語音，安裝粵語。加好之後，重新開返呢個遊戲就得。';
function showVoiceNotice(missing){
  const n = $('#startNotice');
  if(missing){
    n.innerHTML = '⚠️ 你部機暫時搵唔到<b>廣東話語音</b>，小喇叭可能會講普通話或者冇聲。<br><button class="btn ghost" id="vh">點樣加廣東話語音？</button>';
    n.classList.remove('hidden');
    $('#vh').onclick = showVoiceHelp;
    if(!$('#top').classList.contains('hidden')) $('#voiceChip').classList.remove('hidden');
  } else {
    n.classList.add('hidden'); $('#voiceChip').classList.add('hidden');
  }
}
function showVoiceHelp(){
  openModal(`<div class="head"><h2>🔊 加廣東話語音</h2></div>
  <div class="helpText">
  • 電腦用 <b>Chrome</b> 瀏覽器，通常已經有「Google 粵語（香港）」。<br>
  • <b>Windows</b>：設定 › 時間與語言 › 語音 › 加入「中文（香港）」。<br>
  • <b>iPhone / iPad</b>：設定 › 輔助使用 › 語音內容 › 聲音 › 中文（香港）。<br>
  • <b>Android</b>：設定 › 文字轉語音 › 安裝粵語。<br>
  加好之後，重新開返呢個遊戲就得。</div>`, VOICE_HELP_TEXT);
}

/* =========================================================
   音效 (WebAudio)
   ========================================================= */
let AC = null;
function unlockAudio(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d=.15, type='sine', v=.16, delay=0){
  if(!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.05);
}
function noise(d=.5, v=.25){
  if(!AC) return;
  const len = AC.sampleRate*d, buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = v;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}
const sfx = {
  click: () => tone(880,.05,'square',.05),
  pop:   () => tone(660,.09,'triangle',.16),
  step:  () => tone(420+Math.random()*120,.06,'sine',.1),
  ok:    () => { tone(523,.12,'triangle'); tone(659,.12,'triangle',.16,.1); tone(784,.22,'triangle',.16,.2); },
  bad:   () => { tone(260,.2,'sawtooth',.08); tone(190,.3,'sawtooth',.08,.14); },
  win:   () => [523,659,784,1047,784,1047].forEach((f,i) => tone(f,.2,'triangle',.16,i*.11)),
  splash:() => noise(.6,.3),
  boing: () => { tone(300,.1,'sine',.18); tone(500,.12,'sine',.12,.08); }
};

/* =========================================================
   Three.js 基本設定
   ========================================================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 300);
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const GROUND = .5;

let camBase = {pos:new THREE.Vector3(0,14,17), look:new THREE.Vector3()};
function setCam(pos, look){ camBase = {pos:pos.clone(), look:look.clone()}; applyCam(); }
function camFactor(){ const a = camera.aspect; return a < 1.3 ? Math.pow(1.3/a, .72) : 1; }
function applyCam(extra){
  const off = camBase.pos.clone().sub(camBase.look).multiplyScalar(camFactor());
  camera.position.copy(camBase.look).add(off);
  if(extra) camera.position.add(extra);
  camera.lookAt(camBase.look);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); applyCam();
});

function M(c, o={}){ return new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.65, metalness:.05}, o)); }
function mesh(geo, c, o){ const m = new THREE.Mesh(geo, (c && c.isMaterial) ? c : M(c,o)); m.castShadow = true; m.receiveShadow = true; return m; }
function addLights(s, hemi=.8, dir=.8){

const FONT = '"Chiron GoRound TC","Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif';
function textSprite(text, {size=60, color='#2b2350', bg='#ffffff', border='#2b2350', h=.8}={}){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = `900 ${size}px ${FONT}`; ctx.font = font;
  const pad = size*.35, w = Math.ceil(ctx.measureText(text).width + pad*2), hh = Math.ceil(size + pad*1.6);
  c.width = w; c.height = hh; ctx.font = font;
  const r = hh/2; ctx.beginPath();
  ctx.moveTo(r,4); ctx.lineTo(w-r,4); ctx.arc(w-r,r,r-4,-Math.PI/2,Math.PI/2); ctx.lineTo(r,hh-4); ctx.arc(r,r,r-4,Math.PI/2,Math.PI*1.5); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = border; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w/2, hh/2 + size*.06);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  s.scale.set(w/hh*h, h, 1); return s;
}
function emojiSprite(e, size=1){

  const ctx = c.getContext('2d');

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, 64, 72);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  s.scale.set(size, size, 1); return s;
}
function makeStar(r=.5){
  const sh = new THREE.Shape();
  for(let i=0;i<10;i++){ const a = i/10*Math.PI*2 + Math.PI/2, rr = i%2 ? r*.45 : r; i ? sh.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : sh.moveTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  const g = new THREE.ExtrudeGeometry(sh, {depth:.16, bevelEnabled:true, bevelThickness:.05, bevelSize:.05, bevelSegments:2});
  g.center();
  return mesh(g, 0xffd23f, {emissive:0xffa000, emissiveIntensity:.45, metalness:.3, roughness:.35});
}

/* =========================================================
   動畫：tween、計時器、彩紙
   ========================================================= */
const tweens = [];
function tween(dur, fn, done){ tweens.push({t:0, dur, fn, done}); }
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t/tw.dur);
    tw.fn(k);
    if(k >= 1){ tweens.splice(i,1); if(tw.done) tw.done(); }
  }
}
let timers = [];
function later(fn, ms){ const id = setTimeout(() => { timers = timers.filter(x => x !== id); fn(); }, ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function hop(obj, to, dur=.38, h=.5, done){
  const from = obj.position.clone();
  tween(dur, k => { obj.position.lerpVectors(from, to, ease(k)); obj.position.y += Math.sin(k*Math.PI)*h; }, done);
}
function face(obj, dx, dz){ if(dx || dz) obj.rotation.y = Math.atan2(dx, dz); }

const particles = [];
const confGeo = new THREE.PlaneGeometry(.16,.26);
function burst(scene, pos, n=70, colors=[0xff6b6b,0xffc93c,0x3fbf6f,0x3d7bff,0x8c6bff,0xffffff]){
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(confGeo, new THREE.MeshBasicMaterial({color:colors[i%colors.length], side:THREE.DoubleSide}));
    m.position.copy(pos);
    m.userData = {v:new THREE.Vector3(rand(-4,4), rand(4,9), rand(-4,4)), r:new THREE.Vector3(rand(-8,8),rand(-8,8),0), life:rand(1.6,2.6), scene};
    scene.add(m); particles.push(m);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i], u = p.userData;
    u.v.y -= 9*dt; p.position.addScaledVector(u.v, dt);
    p.rotation.x += u.r.x*dt; p.rotation.y += u.r.y*dt;
    u.life -= dt;
    if(u.life <= 0){ u.scene.remove(p); p.material.dispose(); particles.splice(i,1); }
  }
}
function clearParticles(){ particles.forEach(p => { p.userData.scene.remove(p); p.material.dispose(); }); particles.length = 0; }

function strip(html){
  return String(html).replace(/<br\s*\/?>/gi,'。').replace(/<\/(tr|p|li)>/gi,'。').replace(/<[^>]+>/g,'')
    .replace(/([。！？，：；])。/g,'$1').replace(/^。/,'');
}
function say(html, opts={}){
  Speech.stop();
  $('#dlg').classList.remove('hidden');
  $('#dlgText').innerHTML = html;
  const box = $('#dlgBtns'); box.innerHTML = '';
  box.className = 'btns' + (opts.vertical ? ' vertical' : '');
  const btns = opts.buttons || [];
  btns.forEach(b => {
    const wrap = document.createElement('div'); wrap.className = 'optWrap';
    const el = document.createElement('button');
    el.className = 'btn ' + (b.kind || ''); el.innerHTML = b.label;
    if(b.style) el.style.cssText = b.style;
    el.onclick = () => { unlockAudio(); sfx.click(); Speech.stop(); if(b.onClick) b.onClick(); };
    wrap.appendChild(el);
    if(btns.length > 1) wrap.appendChild(spkBtn(b.speech || strip(b.label)));
    box.appendChild(wrap);
  });
  let sp = opts.speech || strip(html);
  if(!/[。！？]$/.test(sp)) sp += '。';
  if(btns.length > 1) sp += ' 你可以揀：' + btns.map((b,i) => `${CN[i+1]}，${b.speech || strip(b.label)}`).join('；') + '。';
  else if(btns.length === 1) sp += ` 準備好，就揿「${btns[0].speech || strip(btns[0].label)}」。`;
  dlgSpeech = sp;
  if(Speech.auto) Speech.speak(sp, $('#dlgSpk'));
}

      const ring = mesh(new THREE.TorusGeometry(2.4,.08,8,40), 0xffc93c, {emissive:0xffc93c, emissiveIntensity:.8}); ring.rotation.x = Math.PI/2; ring.position.y = .35; ring.visible = false; g.add(ring);
      g.traverse(o => o.userData.pick = () => this.pickStation(st));
      s.add(g); this.clickables.push(g);
      this.st[st.id] = {g, icon, star, ring, label};
    }
  },
  enter(){
    if(!this.scene) this.build();
    setCam(new THREE.Vector3(0,17,19), new THREE.Vector3(0,0,-1.2));
    this.robot.position.set(1.8,GROUND,1.6); this.robot.rotation.y = 0; this.busy = false;
    for(const st of STATIONS) this.st[st.id].star.visible = done[st.id];
    if(allDone() && !finaleShown){
      finaleShown = true; justEarned = null;
      say('🎉 嘩！你攞齊四個徽章喇！你係<b>思考小英雄</b>！', {buttons:[{label:'睇我嘅證書 🏅', onClick:showFinale}]});
      later(() => { burst(this.scene, new THREE.Vector3(0,4,0), 120); sfx.win(); }, 500);
      later(() => burst(this.scene, new THREE.Vector3(-4,5,-2), 80), 1300);
      later(() => burst(this.scene, new THREE.Vector3(4,5,-2), 80), 2000);
      return;
    }
    if(justEarned){
      const st = STATIONS.find(s => s.id === justEarned); justEarned = null;
      later(() => { sfx.win(); burst(this.scene, new THREE.Vector3(st.pos[0],5,st.pos[1]), 90); }, 400);
      say(`🎉 你攞到「<b>${st.icon} ${st.badge}</b>」喇！<br>${st.motto}<br>${this.nextText()}`);
      return;
    }
    if(hubFirst){
      hubFirst = false;
      say('歡迎嚟到<b>思考小島</b>！我係思思老師 🦉。<br>島上有四個地方，每個地方會教你一招「思考超能力」，幫你讀書同做事都做得更好。<br>揿一間屋仔就可以出發，建議由 ① 計劃港開始！');
    } else say(this.nextText());
  },
  nextText(){
    const nx = STATIONS.find(s => !done[s.id]);
    return nx ? `下一站，建議去 ${nx.num} ${nx.name}。揿佢嘅屋仔就可以出發！` : '你已經完成晒所有地方！可以再玩一次任何一個。';
  },
  greet(){
    if(this.busy) return; sfx.boing();
    say('我係思思老師！記住思考超能力口訣：<br>做之前，諗一諗；做緊時，查一查；<br>有困難，換方法；做完後，想一想！<br>' + this.nextText());
  },
  pickStation(st){
    if(this.busy) return; sfx.pop();
    const again = done[st.id] ? '<br>（你已經完成咗呢度，可以再玩多次！）' : '';
    say(`<b>${st.icon} ${st.num} ${st.name}</b><br>${st.desc}${again}`, {
      speech: `${st.num}${st.name}。${strip(st.desc)}${strip(again)}`,
      buttons:[{label:'出發！🚀', speech:'出發', onClick:() => this.go(st)}, {label:'揀過第二個', kind:'ghost', onClick:() => say(this.nextText())}]
    });
  },
  go(st){
    this.busy = true; hideDialog();
    const target = new THREE.Vector3(st.pos[0]*.78, GROUND, st.pos[1]*.78 + 1.2);
    const from = this.robot.position.clone();
    face(this.robot, target.x-from.x, target.z-from.z);
    const n = 4; let i = 0;
    const next = () => {
      if(i >= n){ switchMode(MODES[st.id]); return; }
      i++; sfx.step();
      hop(this.robot, from.clone().lerp(target, i/n), .25, .35, next);
    };
    next();
  },
  update(dt,t){
    this.owl.position.y = GROUND + .5 + Math.abs(Math.sin(t*2))*.08;
    this.owl.userData.wingL.rotation.z = Math.sin(t*6)*.25; this.owl.userData.wingR.rotation.z = -Math.sin(t*6)*.25;
    this.owl.rotation.y = Math.sin(t*.7)*.3;
    const nx = STATIONS.find(s => !done[s.id]);
    for(const st of STATIONS){
      const o = this.st[st.id];
      o.icon.position.y = 3.6 + Math.sin(t*2 + st.pos[0])*.18;
      o.star.rotation.y = t*2;
      o.ring.visible = nx === st;
      if(o.ring.visible) o.ring.scale.setScalar(1 + Math.sin(t*4)*.05);
    }
    this.clouds.forEach(c => { c.position.x += dt*.6; if(c.position.x > 34) c.position.x = -34; });
    this.boat.position.x += dt*.8; if(this.boat.position.x > 24) this.boat.position.x = -24;
    this.boat.position.z = -15 + Math.sin(this.boat.position.x*.12)*1.5;
    this.boat.rotation.z = Math.sin(t*1.5)*.06;
    if(!this.busy) this.robot.userData.head.rotation.y = Math.sin(t*1.3)*.5;
    applyCam(new THREE.Vector3(Math.sin(t*.25)*.8, 0, 0));
  }
};

/* =========================================================
   ① 計劃港：排好步驟先出發
   ========================================================= */
const PLAN_LEVELS = [
  {map:['.....','.....','S...G','.....','.....'],
   intro:'第一關：幫小波行去⭐星星！<br>揿下面嘅箭嘴，排好小波每一步點樣行。排好之後，揿「出發」。'},
  {map:['.....','..#..','S.#.G','..#..','.....'],
   intro:'第二關：中間有石頭🪨擋住，小波行唔過㗎！<br>出發之前諗一諗：要點樣兜路，先可以去到星星？'},
  {map:['S.~..','..~.#','..~..','#.*..','...~G'],
   intro:'第三關：小心！有水🌊同石頭🪨。試吓順路收埋💎寶石。<br>記住：先諗好成條路，先至出發！'},
];
const DIRS = {
  left:{dx:-1,dz:0,name:'向左',icon:'⬅️',key:'左'}, up:{dx:0,dz:-1,name:'向上',icon:'⬆️',key:'上'},
  down:{dx:0,dz:1,name:'向下',icon:'⬇️',key:'下'}, right:{dx:1,dz:0,name:'向右',icon:'➡️',key:'右'},
};
const TS = 1.25;
const PlanMode = {
  scene:null, clickables:[], plan:[], running:false,
  build(){
    const s = new THREE.Scene(); this.scene = s;
    s.background = new THREE.Color(0x9fe1ff); s.fog = new THREE.Fog(0x9fe1ff, 22, 55);
    addLights(s);
    const sea = mesh(new THREE.CircleGeometry(60,40), 0x49b6f5, {roughness:.3}); sea.rotation.x = -Math.PI/2; sea.position.y = -.9; s.add(sea);
    const isl = mesh(new THREE.CylinderGeometry(5.4,6.2,1,32), 0xf6dca0, {flatShading:true}); isl.position.y = -.6; s.add(isl);
    for(const [x,z] of [[-4.6,-2.2],[4.4,-2.8],[-4.2,2.8],[4.7,2]]){ const t = makeTree(); t.position.set(x,-.1,z); t.scale.multiplyScalar(.7); s.add(t); }
    this.owl = makeOwl(); this.owl.scale.setScalar(.55); this.owl.position.set(-4.3,-.1,.2); this.owl.rotation.y = .7; s.add(this.owl);
    this.grid = new THREE.Group(); s.add(this.grid);
    this.marks = new THREE.Group(); s.add(this.marks);
    this.robot = makeRobot(); this.robot.scale.setScalar(.6); s.add(this.robot);
  },
  cellPos(r,c){ return new THREE.Vector3((c-2)*TS, 0, (r-2)*TS); },
  cell(r,c){ const m = this.map; return (r<0 || c<0 || r>=m.length || c>=m[0].length) ? null : m[r][c]; },
  enter(){
    if(!this.scene) this.build();
    setCam(new THREE.Vector3(0,11.5,7.2), new THREE.Vector3(0,-.3,-.9));
    this.buildHUD(); this.load(0, true);
    say('歡迎嚟到<b>🗺️ 計劃港</b>！第一招思考超能力係「<b>計劃</b>」。<br>做任何事之前，先問自己：<br>第一，我要做啲咩？第二，我要點樣做？', {
      buttons:[{label:'明白！開始 ▶', speech:'明白，開始', onClick:() => this.load(0)}]});
  },
  exit(){},
  buildHUD(){
    $('#hud').innerHTML = `<div class="panel">
      <div class="row"><span class="tag">我嘅計劃</span><div class="strip" id="strip"></div></div>
      <div class="ctrl">
        ${Object.keys(DIRS).map(d => `<button class="key" data-d="${d}" aria-label="${DIRS[d].name}">${DIRS[d].icon}<small>${DIRS[d].key}</small></button>`).join('')}
        <button class="key act" id="undoBtn" aria-label="退一步">↩️<small>退一步</small></button>
        <button class="key act" id="clearBtn" aria-label="全部清除">🗑️<small>清除</small></button>
        <button class="key go" id="goBtn" aria-label="出發">▶️<small>出發</small></button>
      </div></div>`;
    const row = $('#hud .row');
    row.appendChild(spkBtn(() => this.planSpeech(), 'spk sm'));
    $('#hud').querySelectorAll('[data-d]').forEach(b => b.onclick = () => this.add(b.dataset.d));
    $('#undoBtn').onclick = () => { if(this.running) return; this.plan.pop(); sfx.click(); Speech.speak('退一步', null); this.render(); };
    $('#clearBtn').onclick = () => { if(this.running) return; this.plan = []; sfx.click(); Speech.speak('全部清除', null); this.render(); };
    $('#goBtn').onclick = () => this.check();
  },
  hudEnabled(on){ $('#hud').querySelectorAll('.key').forEach(b => b.disabled = !on); },
  planSpeech(){
    if(!this.plan.length) return '我嘅計劃仲係空嘅。揿箭嘴，加入小波要行嘅步。';
    return '我嘅計劃：' + this.plan.map((d,i) => `第${CN[i+1]||i+1}步，${DIRS[d].name}`).join('；') + `。總共${this.plan.length}步。`;
  },
  load(i, silent){
    this.level = i; const L = PLAN_LEVELS[i]; this.map = L.map;
    this.grid.clear(); this.marks.clear(); this.gems = [];
    for(let r=0;r<5;r++) for(let c=0;c<5;c++){
      const ch = L.map[r][c], p = this.cellPos(r,c);
      if(ch === '~'){
        const w = mesh(new THREE.BoxGeometry(TS*.96,.12,TS*.96), 0x2f8cff, {roughness:.15, emissive:0x1060ff, emissiveIntensity:.15}); w.position.set(p.x,-.1,p.z); this.grid.add(w);
        const rip = mesh(new THREE.TorusGeometry(.28,.035,6,20), 0xffffff); rip.rotation.x = Math.PI/2; rip.position.set(p.x,-.03,p.z); this.grid.add(rip);
        continue;
      }
      const col = ch === 'S' ? 0xcfeaff : ch === 'G' ? 0xffe28a : ((r+c)%2 ? 0x8fdc7a : 0x7fd06a);
      const tile = mesh(new THREE.BoxGeometry(TS*.94,.3,TS*.94), col, {flatShading:true}); tile.position.set(p.x,-.15,p.z); this.grid.add(tile);
      if(ch === '#'){ const rock = mesh(new THREE.DodecahedronGeometry(.45,0), 0x9a9aa8, {flatShading:true}); rock.position.set(p.x,.3,p.z); rock.rotation.set(rand(0,3),rand(0,3),0); this.grid.add(rock); }
      if(ch === 'G'){ this.goal = makeStar(.42); this.goal.position.set(p.x,.8,p.z); this.grid.add(this.goal); }
      if(ch === '*'){ const g = mesh(new THREE.OctahedronGeometry(.25,0), 0x55e6ff, {emissive:0x22aaff, emissiveIntensity:.5, flatShading:true}); g.position.set(p.x,.45,p.z); g.userData.rc = [r,c]; this.grid.add(g); this.gems.push(g); }
      if(ch === 'S') this.start = [r,c];
    }
    this.plan = []; this.fails = 0; this.resetRobot(); this.render();
    if(silent){ this.hudEnabled(false); return; }
    this.hudEnabled(true);
    say(`${L.intro}`);
  },
  resetRobot(){
    this.rc = this.start.slice(); const p = this.cellPos(...this.rc);
    this.robot.position.set(p.x, 0, p.z); this.robot.rotation.set(0, Math.PI/2, 0); this.robot.visible = true;
    this.gems.forEach(g => { g.visible = true; g.userData.got = false; });
  },
  add(d){
    if(this.running) return;
    if(this.plan.length >= 12){ sfx.bad(); say('計劃太長喇！最多12步。試吓諗一條短啲嘅路。'); return; }
    this.plan.push(d); sfx.pop(); Speech.speak(DIRS[d].name, null); this.render();
  },
  render(){
    const strip = $('#strip');
    strip.innerHTML = this.plan.length ? this.plan.map((d,i) => `<div class="chip">${DIRS[d].icon}<i>${i+1}</i></div>`).join('') : '<span class="empty">揿箭嘴加入步驟…</span>';
    this.marks.clear();
    let [r,c] = this.start;
    this.plan.forEach((d,i) => {
      r += DIRS[d].dz; c += DIRS[d].dx;
      const p = this.cellPos(r,c);
      const dot = mesh(new THREE.CylinderGeometry(.26,.26,.04,20), 0xffffff, {transparent:true, opacity:.85}); dot.position.set(p.x,.03,p.z); this.marks.add(dot);
      const n = textSprite(String(i+1), {size:48, h:.42, bg:'#fff4c7'}); n.position.set(p.x, .95 + (i%2)*.12, p.z); this.marks.add(n);
    });
  },
  check(){
    if(this.running) return;
    if(!this.plan.length){ sfx.bad(); say('你仲未有計劃喎！先揿箭嘴，排好小波要行嘅步。'); return; }
    say('出發之前，<b>檢查一下計劃</b>：<br>跟住地上嘅號碼腳印睇一睇，會唔會撞到石頭、跌落水？最後係咪去到星星？', {
      buttons:[{label:'檢查好喇，出發！▶️', speech:'檢查好喇，出發', onClick:() => this.exec()}, {label:'我想改一改 ✏️', speech:'我想改一改', kind:'ghost', onClick:() => say('好！改好計劃之後，再揿「出發」。')}]});
  },
  exec(){
    hideDialog(); this.running = true; this.hudEnabled(false); this.resetRobot();
    this.step(0);
  },
  step(i){
    if(i >= this.plan.length) return this.endRun();
    const d = DIRS[this.plan[i]], nr = this.rc[0]+d.dz, nc = this.rc[1]+d.dx, cell = this.cell(nr,nc);
    face(this.robot, d.dx, d.dz);
    const to = this.cellPos(nr,nc);
    if(cell === '#'){
      const back = this.robot.position.clone(), mid = back.clone().lerp(to,.35);
      tween(.18, k => this.robot.position.lerpVectors(back, mid, k), () => { sfx.bad(); tween(.25, k => this.robot.position.lerpVectors(mid, back, k), () => this.fail(i,'撞到石頭🪨')); });
      return;
    }
    if(cell === null || cell === '~'){
      hop(this.robot, new THREE.Vector3(to.x, 0, to.z), .38, .5, () => {
        sfx.splash(); const y0 = this.robot.position.y;
        tween(.5, k => this.robot.position.y = y0 - k*1.4, () => { this.robot.visible = false; this.fail(i, cell === null ? '行出咗地圖，跌咗落海🌊' : '跌咗落水🌊'); });
      });
      return;
    }
    hop(this.robot, new THREE.Vector3(to.x, 0, to.z), .38, .45, () => {
      this.rc = [nr,nc]; sfx.step();
      const g = this.gems.find(g => g.userData.rc[0]===nr && g.userData.rc[1]===nc && !g.userData.got);
      if(g){ g.userData.got = true; g.visible = false; sfx.ok(); burst(this.scene, g.position.clone(), 25, [0x55e6ff,0xffffff]); }
      if(cell === 'G') return this.success(i+1);
      later(() => this.step(i+1), 60);
    });
  },
  fail(i, what){
    this.fails++; this.running = false;
    say(`哎呀！第${i+1}步${what}。<br>唔緊要！搵出第${i+1}個腳印，改一改計劃再試。`, {
      buttons:[{label:'🔧 改計劃', speech:'改計劃', onClick:() => this.backToEdit()}]});
  },
  endRun(){
    this.fails++; this.running = false;
    say('小波行晒所有步，但仲未去到星星⭐。<br>諗一諗：仲差邊幾步？', {buttons:[{label:'🔧 改計劃', speech:'改計劃', onClick:() => this.backToEdit()}]});
  },
  backToEdit(){ this.resetRobot(); this.hudEnabled(true); say('睇住腳印，改好計劃之後，再揿「出發」。'); },
  success(usedSteps){
    this.running = false; sfx.win();
    burst(this.scene, this.goal.position.clone().add(new THREE.Vector3(0,.5,0)), 90);
    const y0 = this.robot.position.y;
    tween(.6, k => this.robot.position.y = y0 + Math.sin(k*Math.PI*2)*.5*(1-k));
    const gems = this.gems.length && this.gems.every(g => g.userData.got) ? '仲收埋💎寶石添！' : '';
    const extra = usedSteps < this.plan.length ? '<br>（計劃多咗幾步喎，下次可以再短啲！）' : '';
    const how = this.fails === 0 ? '一次就成功，計劃得好好！' : '改咗計劃之後成功，好叻！計劃唔啱，可以改㗎。';
    const last = this.level >= PLAN_LEVELS.length-1;
    say(`🎉 成功！小波去到星星喇！你用咗 ${usedSteps} 步。${gems}<br>${how}${extra}`, {
      buttons:[{label: last ? '完成計劃港 🏅' : '下一關 ▶', speech: last ? '完成計劃港' : '下一關', onClick:() => last ? this.finish() : this.load(this.level+1)}]});
  },
  finish(){
    this.hudEnabled(false);
    say('恭喜你學識第一招：<b>🗺️ 計劃</b>！<br>記住：做之前，先諗清楚要做咩、點樣做。<br>例如：做功課之前，先睇晒有咩要做，再決定先做邊樣。', {
      buttons:[{label:'攞徽章，返小島 🏝️', speech:'攞徽章，返小島', onClick:() => completeStation('plan')}]});
  },
  update(dt,t){
    if(this.goal) { this.goal.rotation.y = t*2; this.goal.position.y = .8 + Math.sin(t*3)*.08; }
    this.gems.forEach(g => g.rotation.y = t*3);
    this.owl.position.y = -.1 + Math.abs(Math.sin(t*2))*.05;
  }
};

/* =========================================================

const SLOTS = 8;

const MonitorMode = {
  scene:null, clickables:[],
  build(){

    for(let i=0;i<SLOTS;i++){
      const g = new THREE.Mesh(new THREE.BoxGeometry(1.02,.55,1.5), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.28}));
      g.position.set(slotX(i), .22, 0); s.add(g); this.ghosts.push(g);
    }
    const flagPole = mesh(new THREE.CylinderGeometry(.06,.06,2.4,6), 0x8b5a2b); flagPole.position.set(6.2,1.7,-1.6); s.add(flagPole);
    const flag = mesh(new THREE.BoxGeometry(1,.6,.05), 0xff6b6b); flag.position.set(6.7,2.6,-1.6); s.add(flag); this.flag = flag;
    this.owl = makeOwl(); this.owl.scale.setScalar(.55); this.owl.position.set(-6.6,.5,-1.8); this.owl.rotation.y = .5; s.add(this.owl);
    const duck = new THREE.Group();
    const db = mesh(new THREE.SphereGeometry(.35,14,10), 0xffd23f); db.scale.set(1.3,.8,1); duck.add(db);
    const dh = mesh(new THREE.SphereGeometry(.22,12,10), 0xffd23f); dh.position.set(.3,.35,0); duck.add(dh);

  },
  enter(){

    say('歡迎嚟到<b>🔍 監察橋</b>！第二招係「<b>監察</b>」：做緊嘢嘅時候，停一停、睇一睇，問自己：「我做得啱唔啱？」<br>小波要跟住規律砌一條橋過河，但佢好心急，有時會放錯！你就係<b>監察員</b>。', {

  },
  exit(){ this.placing = false; },
  buildHUD(){
    $('#hud').innerHTML = `<div class="panel">
      <div class="row"><span class="tag">規律</span><div class="pat" id="pat"></div><span class="stat">捉到錯處：<b id="caught">0</b></span></div>
      <button class="stopBtn" id="stopBtn">🛑 停！有錯！</button></div>`;
    $('#hud .row').insertBefore(spkBtn(() => this.patSpeech(), 'spk sm'), $('#hud .stat'));
    $('#stopBtn').onclick = () => this.stop();
  },
  stopEnabled(on){ const b = $('#stopBtn'); if(b) b.disabled = !on; },
  patSpeech(){ const R = MON_ROUNDS[this.round]; return '規律係：' + R.pattern.map(c => COLORS[c].name).join('、') + '，然後一直重複。'; },
  renderPattern(){
    const R = MON_ROUNDS[this.round], seq = R.pattern.concat(R.pattern);
    $('#pat').innerHTML = seq.map(c => `<div class="dot" style="background:${COLORS[c].css}" title="${COLORS[c].name}"></div>`).join('') + '<span class="etc">…一直重複</span>';
  },
  resetBridge(){
    this.blocks.forEach(b => this.scene.remove(b)); this.blocks = []; this.placed = [];
    this.robot.visible = true; this.robot.position.set(-5.3,.5,0); this.robot.rotation.set(0,Math.PI/2,0);
  },
  expected(i){ const p = MON_ROUNDS[this.round].pattern; return p[i % p.length]; },
  startRound(){
    const R = MON_ROUNDS[this.round];
    this.resetBridge(); this.renderPattern(); this.caught = 0; $('#caught').textContent = this.caught;
    this.wrongAt = R.wrong();
    const names = R.pattern.map(c => COLORS[c].name).join('、');
    say(`第${this.round+1}輪（共3輪）：規律係 <b>${names}</b>，一直重複。<br>留心睇住小波放落去嘅每一粒積木，一見到放錯，就即刻揿「🛑 停！有錯！」`, {
      speech:`第${CN[this.round+1]}輪，共三輪。規律係：${names}，一直重複。留心睇住小波放落去嘅每一粒積木，一見到放錯，就即刻揿「停！有錯！」`,
      buttons:[{label:'準備好喇！', onClick:() => this.begin()}]});
  },
  begin(){
    hideDialog(); this.idx = 0; this.pendingWrong = false; this.placing = true; this.stopEnabled(true);
    say('👀 監察緊…… 有錯就揿「🛑 停！有錯！」', {speech:'監察緊。有錯就揿停，有錯。'});
    later(() => this.placeNext(), 900);
  },
  interval(){ return MON_ROUNDS[this.round].interval + this.slow; },
  placeNext(){
    if(!this.placing) return;
    if(this.pendingWrong) return this.miss();
    const i = this.idx, exp = this.expected(i);
    let col = exp;
    if(this.wrongAt.includes(i)){
      const p = MON_ROUNDS[this.round].pattern;
      const pool = shuffle(Object.keys(COLORS).filter(c => c !== exp));
      col = pool.find(c => p.includes(c)) || pool[0];
    }
    const b = mesh(new THREE.BoxGeometry(1.02,.55,1.5), COLORS[col].hex, {roughness:.5});
    b.position.set(slotX(i), 4, 0); this.scene.add(b); this.blocks[i] = b; this.placed[i] = col;
    tween(.35, k => b.position.y = 4 - (4-.22)*k*k, () => {
      sfx.pop();
      hop(this.robot, new THREE.Vector3(slotX(i), .5, 0), .3, .4);
    });
    this.pendingWrong = col !== exp; this.idx++;
    if(this.idx >= SLOTS && !this.pendingWrong) later(() => this.finishRound(), 1200);
    else later(() => this.placeNext(), this.interval() + (this.idx >= SLOTS ? 600 : 0));
  },
  stop(){
    if(!this.placing) return;
    unlockAudio();
    if(this.pendingWrong){
      this.placing = false; clearTimers(); this.stopEnabled(false); sfx.ok();
      const i = this.idx-1, b = this.blocks[i];
      tween(.5, k => b.scale.setScalar(1 + Math.sin(k*Math.PI*3)*.15));
      this.askFix(i, '👏 捉到喇！你發現咗錯處！');
    } else {
      sfx.boing();
      say('呢粒係啱㗎！👍 冇錯都唔緊要，繼續留心睇。', {speech:'呢粒係啱㗎！冇錯都唔緊要，繼續留心睇。'});
    }
  },
  askFix(i, pre){
    const R = MON_ROUNDS[this.round];
    const opts = shuffle(Array.from(new Set(R.pattern.concat([Object.keys(COLORS).find(c => !R.pattern.includes(c))]))));
    say(`${pre}<br>第${i+1}粒應該係咩顏色先啱規律？`, {
      buttons: opts.map(c => ({label:COLORS[c].name, speech:COLORS[c].name, kind:'color', style:`background:${COLORS[c].css}`, onClick:() => this.fix(i, c)}))});
  },
  fix(i, c){
    if(c !== this.expected(i)){
      sfx.bad();
      const R = MON_ROUNDS[this.round];
      this.askFix(i, `唔係${COLORS[c].name}喎。再睇吓規律：${R.pattern.map(x => COLORS[x].name).join('、')}，一直重複。`);
      return;
    }
    const b = this.blocks[i]; b.material.color.setHex(COLORS[c].hex); this.placed[i] = c;
    tween(.4, k => b.scale.setScalar(1 + Math.sin(k*Math.PI)*.3));
    burst(this.scene, b.position.clone().add(new THREE.Vector3(0,.5,0)), 30);
    sfx.ok(); this.pendingWrong = false; this.caught++; this.caughtTotal++; $('#caught').textContent = this.caught;
    say('✅ 修正好喇！早啲發現，早啲改正。繼續監察！');
    this.placing = true; this.stopEnabled(true);
    if(this.idx >= SLOTS) later(() => this.finishRound(), 1200);
    else later(() => this.placeNext(), 1500);
  },
  miss(){
    this.placing = false; this.stopEnabled(false); clearTimers(); sfx.bad();
    const wi = this.placed.findIndex((c,i) => c !== this.expected(i));
    const wb = this.blocks[wi];
    const bx = this.blocks.map(b => b.position.x);
    tween(.8, k => this.blocks.forEach((b,j) => b.position.x = bx[j] + Math.sin(k*40)*.06*(1-k)), () => {
      sfx.splash();
      tween(.7, k => { wb.position.y = .22 - k*2; wb.rotation.z = k*2; });
      hop(this.robot, new THREE.Vector3(-5.3,.5,0), .6, 1.2);
    });
    this.slow += 600;
    later(() => say('哎呀！有一粒放錯咗，我哋冇及時發現，條橋塌咗！😵<br>記住：<b>邊做邊檢查</b>，每放一粒都要對一對規律。<br>我哋再試一次，今次小波會慢啲。', {
      buttons:[{label:'再試一次 🔁', speech:'再試一次', onClick:() => this.startRound()}]}), 1300);
  },
  finishRound(){
    this.placing = false; this.stopEnabled(false);
    hop(this.robot, new THREE.Vector3(5.6,.5,0), .7, .9, () => {
      sfx.win(); burst(this.scene, new THREE.Vector3(5.6,2,0), 80);
      const last = this.round >= MON_ROUNDS.length-1;
      say(`🎉 條橋砌好喇，好穩陣！今輪你捉到 ${this.caught} 個錯處。`, {
        buttons:[{label: last ? '下一步 ▶' : '下一輪 ▶', onClick:() => { if(last) this.reflect(); else { this.round++; this.slow = 0; this.startRound(); } }}]});
    });
  },
  reflect(pre=''){
    const opts = shuffle([
      {t:'可以早啲發現錯處，早啲改正', ok:true},
      {t:'因為檢查好玩，唔使做嘢', ok:false},
      {t:'唔使檢查，做完就算', ok:false}]);
    say(`${pre}想一想：點解做嘢嘅時候，要<b>邊做邊檢查</b>？`, {vertical:true,
      buttons: opts.map(o => ({label:o.t, onClick:() => o.ok ? this.finish() : (sfx.bad(), this.reflect('🤔 再諗吓喎。'))}))});
  },
  finish(){
    sfx.ok();
    say(`答得好！三輪總共捉到 ${this.caughtTotal} 個錯處。<br>你學識咗第二招：<b>🔍 監察</b>！做緊嘢嘅時候，問自己：「我做得啱唔啱？」<br>例如：做數嘅時候，每做完一題就睇返一次。`, {
      buttons:[{label:'攞徽章，返小島 🏝️', speech:'攞徽章，返小島', onClick:() => completeStation('monitor')}]});
  },
  update(dt,t){
    this.duck.position.x = Math.sin(t*.4)*6; this.duck.position.y = -1.15 + Math.sin(t*3)*.05;
    this.duck.rotation.y = Math.cos(t*.4) > 0 ? 0 : Math.PI;
    this.flag.rotation.y = Math.sin(t*3)*.25;
    this.owl.position.y = .5 + Math.abs(Math.sin(t*2))*.05;
  }
};

    setCam(new THREE.Vector3(0,5,11.5), new THREE.Vector3(0,2.4,0));
    this.inputOn = false; this.showing = false; this.renderHUD();
    say('歡迎嚟到<b>💎 評估水晶塔</b>！第四招係「<b>評估</b>」：做完之後，睇返自己做得點，再諗吓下次點樣做得更好。<br>我哋玩記憶遊戲：水晶會一粒一粒咁發光，你要跟住<b>同一個次序</b>揿返。', {
      buttons:[{label:'開始 ▶', onClick:() => this.predict()}]});
  },
  exit(){ this.inputOn = false; },
  renderHUD(extra=''){
    const last = this.attempts[this.attempts.length-1];
    const info = this.inputOn || this.showing ? `今次要記：${this.seq.length} 粒` : (last ? `上次：估 ${last.predict} 粒，記到 ${last.result} 粒` : '先估計，再挑戰！');
    $('#hud').innerHTML = `<div class="panel"><div class="row"><span class="tag">記憶水晶</span>
      <span style="font-weight:900;font-size:17px">${info}</span>
      <span class="stat" id="progress">${extra}</span></div></div>`;
    const row = $('#hud .row');
    row.insertBefore(spkBtn(() => {
      const pg = $('#progress').textContent.split('/').map(x => x.trim());
      return info.replace('6+ 粒','六粒或以上').replace(/ /g,'') + (pg.length === 2 ? `。已經揿啱${pg[0]}粒，總共要揿${pg[1]}粒。` : '。');
    }, 'spk sm'), row.children[1]);
  },
  predict(){
    const again = this.attempts.length ? '今次試吓用<b>另一個方法</b>，比較吓邊個方法好啲！<br>' : '';
    say(`${again}玩之前，<b>先估一估</b>：你覺得自己最多可以記住幾多粒水晶嘅次序？`, {
      buttons:[2,3,4,5,6].map(n => ({label: n===6 ? '6粒或以上' : `${n}粒`, onClick:() => { this.pred = n; this.chooseStrat(); }}))});
  },
  chooseStrat(){
    say('你會用咩方法去記？', {vertical:true,
      buttons:MEM_STRATS.map(s => ({label:s.label, speech:s.short, onClick:() => { this.strat = s; this.play(); }}))});
  },
  play(){
    this.seq = [ri(0,3)]; this.best = 1; this.nextRound();
  },
  nextRound(){
    this.seq.push(ri(0,3));
    this.inputOn = false; this.showing = true; this.pos = 0; this.renderHUD();
    say(`👀 留心睇！記住呢 ${this.seq.length} 粒水晶嘅次序……`, {speech:`留心睇！記住呢${this.seq.length}粒水晶嘅次序。`});
    const gap = this.seq.length > 5 ? 700 : 850;
    this.seq.forEach((c,k) => later(() => this.flash(c), 1600 + k*gap));
    later(() => {
      this.showing = false; this.inputOn = true; this.renderHUD(`0 / ${this.seq.length}`);
      say('到你喇！跟住同一個次序揿水晶。💎');
    }, 1600 + this.seq.length*gap + 200);
  },
  flash(i){
    const c = this.crystals[i]; c.glow = 1; tone(CRYSTALS[i].f, .35, 'triangle', .2);
  },
  press(i){
    if(!this.inputOn) return;
    unlockAudio(); this.flash(i);
    if(i === this.seq[this.pos]){
      this.pos++; $('#progress').textContent = `${this.pos} / ${this.seq.length}`;
      if(this.pos === this.seq.length){
        this.inputOn = false; this.best = this.seq.length;
        later(() => sfx.ok(), 300);
        burst(this.scene, new THREE.Vector3(0,3,0), 30);
        if(this.seq.length >= 9){ later(() => this.result(), 1000); return; }
        say(`✅ 啱晒！你記到 ${this.seq.length} 粒！再嚟，多一粒！`);
        later(() => this.nextRound(), 1600);
      }
    } else {
      this.inputOn = false; later(() => sfx.bad(), 250);
      say(`哎呀，次序唔啱。正確次序係：${this.seq.map(c => CRYSTALS[c].name).join('、')}。`);
      later(() => this.result(), 2600);
    }
  },
  result(){
    const res = this.best, p = this.pred;
    this.attempts.push({strat:this.strat.short, predict: p===6 ? '6+' : p, result:res});
    this.renderHUD();
    let cmp;
    if(p === 6 && res >= 6 || res === p) cmp = '你估得好準！你好了解自己 👍';
    else if(res > p) cmp = '你比自己估嘅更叻！💪';
    else cmp = '原來比你估嘅難少少。冇問題！知道咗，下次就可以諗辦法改進。';
    say(`📊 你估自己記到 <b>${p===6?'6粒或以上':p+'粒'}</b>，結果記到 <b>${res} 粒</b>！<br>${cmp}`, {
      buttons:[{label:'下一步：評估自己 ▶', speech:'下一步，評估自己', onClick:() => this.reflect1()}]});
  },
  reflect1(){
    say('你覺得自己今次做得點？（誠實答就得，冇啱冇錯！）', {
      buttons:[{label:'⭐ 仲要加油', speech:'一粒星，仲要加油'}, {label:'⭐⭐ 幾好', speech:'兩粒星，幾好'}, {label:'⭐⭐⭐ 好好', speech:'三粒星，好好'}]
        .map(b => Object.assign(b, {onClick:() => { sfx.pop(); this.reflect2(); }}))});
  },
  reflect2(pre=''){
    const opts = shuffle([
      {t:'試吓另一個記憶方法', ok:true}, {t:'專心啲、慢慢睇清楚', ok:true}, {t:'唔記喇，靠估', ok:false}]);
    say(`${pre}下次點樣可以做得<b>更好</b>？`, {vertical:true,
      buttons:opts.map(o => ({label:o.t, onClick:() => o.ok ? this.summary(o.t) : (sfx.bad(), this.reflect2('🤔 靠估唔會令你進步㗎，再揀過。<br>'))}))});
  },
  summary(plan){
    sfx.ok();
    const rows = this.attempts.map((a,i) => `<tr><td>${i+1}</td><td>${a.strat}</td><td>${a.predict}</td><td>${a.result}</td></tr>`).join('');
    const rowsSp = this.attempts.map((a,i) => `第${CN[i+1]||i+1}次，用${a.strat}，估${a.predict==='6+'?'六粒或以上':a.predict+'粒'}，記到${a.result}粒`).join('；');
    let bestTxt = '';
    if(this.attempts.length > 1){
      const b = this.attempts.reduce((x,y) => y.result > x.result ? y : x);
      bestTxt = `<br>比較之下，用「${b.strat}」嗰次記得最多！`;
    }
    say(`好計劃：「${plan}」👍<br>我嘅紀錄：<table class="att"><tr><th>次</th><th>方法</th><th>估計</th><th>結果</th></tr>${rows}</table>${bestTxt}`, {
      speech:`好計劃：${plan}。我嘅紀錄：${rowsSp}。${strip(bestTxt)}`,
      buttons:[{label:'🔁 用新方法再玩', speech:'用新方法再玩', onClick:() => this.predict()}, {label:'✅ 完成評估', speech:'完成評估', onClick:() => this.finish()}]});
  },
  finish(){
    sfx.win(); burst(this.scene, new THREE.Vector3(0,3,0), 90);
    say('你學識咗第四招：<b>💎 評估</b>！<br>做完之後問自己：「我做得點？邊個方法最有用？下次點樣做得更好？」<br>例如：派返默書，睇吓錯咗邊度，再諗吓下次點樣溫。', {
      buttons:[{label:'攞徽章，返小島 🏝️', speech:'攞徽章，返小島', onClick:() => completeStation('eval')}]});
  },
  update(dt,t){
    this.crystals.forEach((c,i) => {
      c.glow = Math.max(0, c.glow - dt*1.8);
      c.mesh.material.emissiveIntensity = .15 + c.glow*1.3;
      c.light.intensity = c.glow*2.5;
      c.mesh.rotation.y = t*.8 + i;
      c.mesh.position.y = 2.2 + Math.sin(t*2+i)*.08 + c.glow*.25;
      const s = 1 + c.glow*.25; c.mesh.scale.set(s, 1.6*s, s);
    });
    this.owl.position.y = Math.abs(Math.sin(t*2))*.05;
  }
};

const MODES = {plan:PlanMode, monitor:MonitorMode, tools:ToolsMode, eval:EvalMode};

   證書

/* =========================================================
   點擊 3D 物件
   ========================================================= */
function pickAt(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if(!current || !current.clickables.length) return null;
  const hit = raycaster.intersectObjects(current.clickables, true).find(h => h.object.visible);
  return hit ? hit.object.userData.pick : null;
}
canvas.addEventListener('pointerdown', e => { unlockAudio(); const f = pickAt(e); if(f) f(); });
canvas.addEventListener('pointermove', e => { if(e.pointerType !== 'mouse') return; canvas.style.cursor = pickAt(e) ? 'pointer' : 'default'; });

/* =========================================================
   開始
   ========================================================= */
const START_SPEECH = '思考小島大冒險！同思思老師一齊學四招思考超能力：計劃、監察、調整策略同埋評估。唔識字都唔怕，揿小喇叭就可以聽。準備好，就揿「開始冒險」。';
$('#startSpk').onclick = () => { unlockAudio(); const b = $('#startSpk'); if(b.classList.contains('talking')) Speech.stop(); else Speech.speak(START_SPEECH, b); };
$('#startBtn').onclick = () => {
  unlockAudio(); sfx.win(); Speech.stop();
  $('#start').classList.add('hidden'); $('#top').classList.remove('hidden');
  if(Speech.checked && !Speech.voice) $('#voiceChip').classList.remove('hidden');
  switchMode(Hub);
};
Speech.init();

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updateTweens(dt); updateParticles(dt);
  if(current){ current.update(dt, t); renderer.render(current.scene, camera); }
  else { renderer.setClearColor(0x8fdcff); renderer.clear(); }
}
// 等字型載入，先畫 3D 標籤
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(() => { Hub.build(); loop(); });
