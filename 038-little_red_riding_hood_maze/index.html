<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>小紅帽探外婆 - 手繪卡通迷宮遊戲</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
  }

  body {
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    min-height: 100vh;
    min-height: 100dvh;
    background: #f9f6ef;
    background-image:
      radial-gradient(#e8e0cf 1px, transparent 1px),
      radial-gradient(#efe9dc 1px, #f9f6ef 1px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    font-family: 'Noto Sans TC', 'Fredoka', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #3d2c1e;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  .game-shell {
    width: 100%;
    max-width: 1020px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 12px 36px rgba(102, 74, 42, 0.14), 0 0 0 4px #f3ead8;
    padding: 10px 12px 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Top toolbar */
  .hud-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 2px 4px;
  }

  .hud-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: #fff9e6;
    border: 2px solid #e6b84c;
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 13px;
    font-weight: 700;
    color: #5c3d1e;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 0 #e6b84c;
    white-space: nowrap;
  }

  .hud-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    border: 2px solid #3d2c1e;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: #3d2c1e;
    background: #fff;
    box-shadow: 0 2.5px 0 #3d2c1e;
    touch-action: manipulation;
    white-space: nowrap;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3d2c1e; }

  .btn-pink   { background: #ffd6e6; border-color: #c95b84; box-shadow: 0 2.5px 0 #c95b84; color: #6e2340; }
  .btn-yellow { background: #fff0a8; border-color: #c48c1d; box-shadow: 0 2.5px 0 #c48c1d; color: #5c3d0e; }
  .btn-green  { background: #d4f4be; border-color: #2e8a34; box-shadow: 0 2.5px 0 #2e8a34; color: #19521e; }

  /* 5-Level Difficulty Bar */
  .level-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 2px 2px;
  }

  .level-chip {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    padding: 4px 11px;
    border-radius: 999px;
    border: 2px solid #d4c5b0;
    background: #fbf8f1;
    color: #7c6854;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    touch-action: manipulation;
    white-space: nowrap;
  }

  .level-chip:hover {
    border-color: #e695b2;
    transform: translateY(-1px);
  }

  .level-chip.active {
    background: #ffd6e6;
    border-color: #c95b84;
    color: #6e2340;
    box-shadow: 0 2.5px 0 #c95b84;
  }

  .level-chip.cleared {
    background: #e7f9d9;
    border-color: #3b9c42;
    color: #1f6124;
  }

  .level-chip.active.cleared {
    background: #ffd6e6;
    border-color: #c95b84;
    color: #6e2340;
  }

  /* Main SVG Stage — cleanly preserves exact 1000:680 aspect ratio & fits inside viewport */
  .stage-wrap {
    position: relative;
    width: 100%;
    max-width: calc((100dvh - 210px) * (1000 / 680));
    min-width: min(100%, 300px);
    margin: 0 auto;
    aspect-ratio: 1000 / 680;
    background: #fffefb;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid #f0e6d2;
    touch-action: none;
  }

  svg#gameSvg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  svg#gameSvg:active {
    cursor: grabbing;
  }

  /* Subtle storybook animations */
  @keyframes sunSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes floatCloud {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes smokeRise {
    0% { transform: translate(0, 0) scale(0.7); opacity: 0.75; }
    100% { transform: translate(8px, -22px) scale(1.3); opacity: 0; }
  }
  @keyframes grandmaWave {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  @keyframes wolfBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-2.5px); }
  }
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .sun-rays { transform-origin: 78px 66px; animation: sunSpin 26s linear infinite; }
  .cloud-float-1 { animation: floatCloud 4.6s ease-in-out infinite; }
  .cloud-float-2 { animation: floatCloud 5.4s ease-in-out infinite 1s; }
  .smoke-1 { animation: smokeRise 2.8s ease-out infinite; }
  .smoke-2 { animation: smokeRise 2.8s ease-out infinite 1.4s; }
  .grandma-hand { transform-origin: 481px 350px; animation: grandmaWave 1.4s ease-in-out infinite; }
  .wolf-anim { animation: wolfBob 2.2s ease-in-out infinite; }
  .goal-pulse { animation: badgePulse 2.4s ease-in-out infinite; }

  /* ================= FLOATING 360° ANALOG JOYSTICK OVERLAY ================= */
  .floating-joystick {
    position: fixed;
    width: 116px;
    height: 116px;
    margin-left: -58px;
    margin-top: -58px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 245, 214, 0.52) 0%, rgba(255, 214, 230, 0.42) 100%);
    border: 3.5px dashed rgba(201, 91, 132, 0.78);
    box-shadow: 0 6px 20px rgba(92, 61, 30, 0.16), inset 0 0 14px rgba(255, 255, 255, 0.65);
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transform: scale(0.75);
    transition: opacity 0.12s ease, transform 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .floating-joystick.active {
    opacity: 1;
    transform: scale(1);
  }

  .floating-joystick::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.55);
  }

  .floating-knob {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #ff9eb8 0%, #e6554d 82%);
    border: 3.5px solid #ffffff;
    box-shadow: 0 4px 12px rgba(122, 34, 46, 0.35), 0 0 0 2px #c95b84;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
  }

  /* Toast speech bubble */
  .toast-bubble {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: #fff9e2;
    border: 3px solid #d97a2b;
    color: #5c3310;
    padding: 7px 16px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.16);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 800;
    max-width: 92vw;
    text-align: center;
    line-height: 1.35;
  }
  .toast-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0px);
  }

  /* Bottom Controls Bar with Built-in 360° Thumb Pad */
  .controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 6px 0;
  }

  .tip-text {
    font-size: 13px;
    color: #6b5642;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
  }

  .dock-joystick-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .dock-label {
    font-size: 12px;
    font-weight: 800;
    color: #7a5538;
    text-align: right;
    line-height: 1.3;
  }

  .dock-joystick {
    position: relative;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: radial-gradient(circle, #fffdf4 0%, #e4f9d5 100%);
    border: 3px solid #2e8a34;
    box-shadow: 0 3.5px 0 #2e8a34, inset 0 2px 8px rgba(46, 138, 52, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }

  .dock-joystick:active {
    cursor: grabbing;
  }

  .dock-arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-size: 9px;
    color: rgba(46, 138, 52, 0.55);
    font-weight: 900;
  }
  .dock-arrows span { position: absolute; }
  .dock-arrows .a-up { top: 4px; left: 50%; transform: translateX(-50%); }
  .dock-arrows .a-down { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .dock-arrows .a-left { left: 5px; top: 50%; transform: translateY(-50%); }
  .dock-arrows .a-right { right: 5px; top: 50%; transform: translateY(-50%); }

  .dock-knob {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #ff9eb8 0%, #e6554d 85%);
    border: 3px solid #ffffff;
    box-shadow: 0 3px 8px rgba(122, 34, 46, 0.35), 0 0 0 2px #c95b84;
    pointer-events: none;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  /* ================= FULL-VIEWPORT VICTORY MODAL (NEVER CLIPPED!) ================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    padding: 16px;
    background: rgba(61, 44, 30, 0.48);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: #fffdf5;
    border: 4px solid #f08cae;
    border-radius: 26px;
    padding: 22px 22px 20px;
    max-width: 390px;
    width: 100%;
    max-height: 88dvh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    transform: scale(0.9);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-backdrop.show .modal-card { transform: scale(1); }

  .modal-emoji {
    font-size: 44px;
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .modal-title {
    font-size: 24px;
    font-weight: 900;
    color: #c94672;
    margin: 0 0 8px;
  }

  .modal-sub {
    font-size: 14.5px;
    color: #5c4330;
    margin: 0 0 16px;
    line-height: 1.55;
  }

  .modal-stats {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .modal-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .modal-btns .btn {
    padding: 8px 16px;
    font-size: 14.5px;
  }

  /* ================= MOBILE PORTRAIT OPTIMIZATION ================= */
  @media (max-width: 680px) {
    body {
      padding: max(5px, env(safe-area-inset-top)) 5px max(6px, env(safe-area-inset-bottom)) 5px;
      justify-content: center;
    }
    .game-shell {
      padding: 8px 8px 10px;
      border-radius: 18px;
      gap: 6px;
    }
    .hud-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      padding: 0;
    }
    .hud-stats {
      justify-content: center;
      gap: 5px;
    }
    .hud-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .stat-pill {
      font-size: 11.5px;
      padding: 3px 8px;
    }
    .hud-actions .btn {
      font-size: 11.5px;
      padding: 5px 4px;
      gap: 2px;
    }
    .level-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 0;
    }
    .level-chip {
      font-size: 11px;
      padding: 4px 2px;
      gap: 2px;
    }
    .stage-wrap {
      max-width: 100%;
      border-radius: 14px;
    }
    .controls-bar {
      gap: 8px;
      padding: 2px 2px 0;
    }
    .tip-text {
      font-size: 12px;
      line-height: 1.4;
    }
    .dock-label { display: none; }
    .dock-joystick {
      width: 74px;
      height: 74px;
    }
    .dock-knob {
      width: 32px;
      height: 32px;
      font-size: 14px;
    }
    .modal-card {
      padding: 18px 16px;
      border-radius: 22px;
    }
    .modal-emoji { font-size: 38px; }
    .modal-title { font-size: 21px; }
    .modal-sub { font-size: 13.5px; margin-bottom: 12px; }
  }

  /* Landscape phone / short screen optimization */
  @media (max-height: 520px) and (orientation: landscape) {
    body { padding: 4px 8px; }
    .game-shell { padding: 6px 10px; gap: 4px; }
    .level-bar { padding: 0; }
    .tip-text { font-size: 11.5px; }
    .dock-joystick { width: 64px; height: 64px; }
    .dock-knob { width: 28px; height: 28px; font-size: 13px; }
    .stage-wrap { max-width: calc((100dvh - 145px) * (1000 / 680)); }
  }
</style>
</head>
<body>

<div class="game-shell">
  <!-- Top HUD -->
  <div class="hud-bar">
    <div class="hud-stats">
      <span class="stat-pill">⭐ <span id="levelNameText">第 1 關・輕鬆散步</span></span>
      <span class="stat-pill">⏱️ <span id="timerText">00:00</span></span>
      <span class="stat-pill">👣 <span id="stepsText">0</span> 步</span>
    </div>
    <div class="hud-actions">
      <button class="btn btn-yellow" id="hintBtn" title="顯示避開大灰狼的安全提示路線">💡 提示</button>
      <button class="btn btn-pink" id="resetBtn" title="回到起點重新走一次">🔄 起點</button>
      <button class="btn btn-green" id="rerollBtn" title="重新產生同難度的新迷宮路線">🎲 換圖</button>
      <button class="btn" id="soundBtn" title="開啟或關閉音效">🔊 音效</button>
    </div>
  </div>

  <!-- 5-Level Selector Bar -->
  <div class="level-bar" id="levelBar"></div>

  <!-- Main Illustrated Maze Canvas -->
  <div class="stage-wrap" id="stageWrap">
    <svg id="gameSvg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="crayonSoft" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#5a3f28" flood-opacity="0.18"/>
        </filter>

        <linearGradient id="mazeFloorGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fffbe9"/>
          <stop offset="100%" stop-color="#faf2d2"/>
        </linearGradient>
        <linearGradient id="pinkBannerGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd9e8"/>
          <stop offset="100%" stop-color="#f7b2cc"/>
        </linearGradient>
        <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2948a"/>
          <stop offset="100%" stop-color="#db6b61"/>
        </linearGradient>
        <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c2f078"/>
          <stop offset="100%" stop-color="#8cd147"/>
        </linearGradient>
      </defs>

      <!-- Paper Background -->
      <rect x="0" y="0" width="1000" height="680" fill="#fffefb" />

      <!-- ================= TOP DECORATIONS ================= -->
      <!-- Smiling Sun (Top Left) -->
      <g id="sunGroup" filter="url(#crayonSoft)">
        <g class="sun-rays" stroke="#ffd426" stroke-width="5.5" stroke-linecap="round">
          <line x1="78" y1="12" x2="78" y2="24" />
          <line x1="78" y1="108" x2="78" y2="120" />
          <line x1="24" y1="66" x2="36" y2="66" />
          <line x1="120" y1="66" x2="132" y2="66" />
          <line x1="39" y1="27" x2="48" y2="36" />
          <line x1="108" y1="96" x2="117" y2="105" />
          <line x1="117" y1="27" x2="108" y2="36" />
          <line x1="48" y1="96" x2="39" y2="105" />
          <line x1="56" y1="16" x2="61" y2="26" />
          <line x1="100" y1="16" x2="95" y2="26" />
          <line x1="28" y1="45" x2="38" y2="50" />
          <line x1="28" y1="87" x2="38" y2="82" />
        </g>
        <circle cx="78" cy="66" r="34" fill="#ffe14d" stroke="#f0a51a" stroke-width="4" />
        <ellipse cx="59" cy="70" rx="6" ry="4" fill="#ff9e8a" opacity="0.8" />
        <ellipse cx="97" cy="70" rx="6" ry="4" fill="#ff9e8a" opacity="0.8" />
        <path d="M62 63 Q67 55 72 63" fill="none" stroke="#4a2e14" stroke-width="3" stroke-linecap="round" />
        <path d="M84 63 Q89 55 94 63" fill="none" stroke="#4a2e14" stroke-width="3" stroke-linecap="round" />
        <path d="M70 74 Q78 82 86 74" fill="none" stroke="#4a2e14" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Left Fluffy Cloud -->
      <g class="cloud-float-1" filter="url(#crayonSoft)">
        <path d="M168 78 C154 78 148 66 156 57 C159 46 174 44 181 50 C188 38 210 40 214 54 C227 54 233 66 226 75 C222 81 212 81 204 81 L172 81 Z"
              fill="#ffffff" stroke="#5bb4e5" stroke-width="4" stroke-linejoin="round" />
      </g>

      <!-- Right Fluffy Cloud -->
      <g class="cloud-float-2" filter="url(#crayonSoft)">
        <path d="M862 84 C844 84 836 70 846 58 C849 44 867 42 877 49 C885 33 916 34 922 52 C941 51 951 66 942 78 C936 86 922 86 910 86 L866 86 Z"
              fill="#ffffff" stroke="#5bb4e5" stroke-width="4" stroke-linejoin="round" />
      </g>

      <!-- Center Title Banner: 小紅帽探外婆 -->
      <g id="titleBanner" filter="url(#crayonSoft)">
        <g stroke="#ffd426" stroke-width="5.5" stroke-linecap="round">
          <line x1="255" y1="28" x2="274" y2="38" />
          <line x1="246" y1="53" x2="269" y2="55" />
          <line x1="253" y1="78" x2="273" y2="69" />
          <line x1="745" y1="28" x2="726" y2="38" />
          <line x1="754" y1="53" x2="731" y2="55" />
          <line x1="747" y1="78" x2="727" y2="69" />

  // ================= WEB AUDIO SYNTHESIZER =================
  let audioCtx = null;
  function ensureAudio() {
    if (!soundEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playStepSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(560, ctx.currentTime + 0.045);
    gain.gain.setValueAtTime(0.055, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.055);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.06);
  }

  function playWolfSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.26);
  }

  function playWinSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      const t = ctx.currentTime + i * 0.11;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.34);
    });
  }

  // ================= SMART SPACE-UTILIZING MAZE GENERATOR =================
  function createEmptyAdj(cols, rows) {
    const map = new Map();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) map.set(keyOf(c, r), new Set());
    }
    return map;
  }

  function linkCells(map, c1, r1, c2, r2) {
    map.get(keyOf(c1, r1)).add(keyOf(c2, r2));
    map.get(keyOf(c2, r2)).add(keyOf(c1, r1));
  }

  function findShortestPath(map, from, to, blockedSet) {
    const startK = keyOf(from.c, from.r);
    const goalK = keyOf(to.c, to.r);
    const q = [[from]];
    const vis = new Set([startK]);
    while (q.length) {
      const path = q.shift();
      const cur = path[path.length - 1];
      const ck = keyOf(cur.c, cur.r);
      if (ck === goalK) return path;
      for (const nk of map.get(ck)) {
        if (!vis.has(nk) && !blockedSet.has(nk)) {
          vis.add(nk);
          const [nc, nr] = nk.split(',').map(Number);
          q.push([...path, { c: nc, r: nr }]);
        }
      }
    }
    return [];
  }

  function computeDistFromSet(map, sourceKeys, blockedSet) {
    const dist = new Map();
    const q = [];
    for (const sk of sourceKeys) {
      dist.set(sk, 0);
      q.push(sk);
    }
    while (q.length) {
      const cur = q.shift();
      const d = dist.get(cur);
      for (const nk of map.get(cur)) {
        if (!dist.has(nk) && !blockedSet.has(nk)) {
          dist.set(nk, d + 1);
          q.push(nk);
        }
      }
    }
    return dist;
  }

  function placeWolvesSafely(map, solPath, lv) {
    const solSet = new Set(solPath.map(p => keyOf(p.c, p.r)));
    const startK = keyOf(START_CELL.c, START_CELL.r);
    const goalK = keyOf(GOAL_CELL.c, GOAL_CELL.r);
    const distFromSol = computeDistFromSet(map, solSet, HOUSE_CELLS);

    const deadEnds = [];
    const fallbackOffPath = [];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const k = keyOf(c, r);
        if (HOUSE_CELLS.has(k) || solSet.has(k)) continue;
        const neighbors = map.get(k);
        if (neighbors.has(startK) || neighbors.has(goalK)) continue;
        const dSol = distFromSol.get(k) || 0;
        const item = { c, r, dSol };
        if (neighbors.size === 1) {
          deadEnds.push(item);
        } else if (dSol >= 2) {
          fallbackOffPath.push(item);
        }
      }
    }

    const pool = deadEnds.length >= lv.wolves ? deadEnds : [...deadEnds, ...fallbackOffPath];
    pool.sort((a, b) => (b.dSol - a.dSol) + (Math.random() - 0.5) * 1.2);

    const chosen = [];
    for (const cand of pool) {
      if (chosen.length >= lv.wolves) break;
      const tooClose = chosen.some(w => Math.abs(w.c - cand.c) + Math.abs(w.r - cand.r) <= 2);
      if (!tooClose) chosen.push(cand);
    }
    for (const cand of pool) {
      if (chosen.length >= lv.wolves) break;
      if (!chosen.includes(cand)) chosen.push(cand);
    }

    return chosen.map((p, idx) => ({
      c: p.c,
      r: p.r,
      flip: p.c > COLS / 2,
      msg: WOLF_MSGS[idx % WOLF_MSGS.length]
    }));
  }

  function buildMazeForLevel(lv, forceRandom = false) {
    COLS = lv.cols;
    ROWS = lv.rows;
    CELL_W = MAZE_W / COLS;
    CELL_H = MAZE_H / ROWS;

    const minCell = Math.min(CELL_W, CELL_H);
    WALL_HALF = Math.max(4.4, minCell * 0.092);
    PLAYER_RADIUS = Math.max(9.0, minCell * 0.22);
    SPRITE_SCALE = Math.min(0.86, (minCell / 76.86) * 0.86);

    HOUSE_CELLS = new Set();
    for (const c of lv.houseCols) {
      for (const r of lv.houseRows) HOUSE_CELLS.add(keyOf(c, r));
    }
    START_CELL = { c: 0, r: ROWS - 1 };
    GOAL_CELL = { c: lv.goal.c, r: lv.goal.r };

    if (lv.classic && !forceRandom) {
      adj = createEmptyAdj(COLS, ROWS);
      for (const [[c1, r1], [c2, r2]] of CLASSIC_EDGES) {
        linkCells(adj, c1, r1, c2, r2);
      }
      wolves = [
        { c: 1, r: 4, flip: false, msg: WOLF_MSGS[0] },
        { c: 8, r: 0, flip: true,  msg: WOLF_MSGS[2] }
      ];
      return;
    }

    let bestAdj = null;
    let bestSol = null;
    let bestScore = -1e9;

    const trials = 48;
    for (let t = 0; t < trials; t++) {
      const candAdj = createEmptyAdj(COLS, ROWS);
      const vis = new Set([...HOUSE_CELLS]);
      const stack = [{ c: START_CELL.c, r: START_CELL.r }];
      vis.add(keyOf(START_CELL.c, START_CELL.r));
      let lastDir = null;

      while (stack.length > 0) {
        const cur = stack[stack.length - 1];
        const dirs = [
          { dc: 1, dr: 0 }, { dc: -1, dr: 0 },
          { dc: 0, dr: 1 }, { dc: 0, dr: -1 }
        ].sort(() => Math.random() - 0.5);

        if (lastDir && Math.random() < lv.straightBias) {
          const idx = dirs.findIndex(d => d.dc === lastDir.dc && d.dr === lastDir.dr);
          if (idx > 0) {
            const [d] = dirs.splice(idx, 1);
            dirs.unshift(d);
          }
        }

        let moved = false;
        for (const d of dirs) {
          const nc = cur.c + d.dc, nr = cur.r + d.dr;
          const nk = keyOf(nc, nr);
          if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !vis.has(nk)) {
            linkCells(candAdj, cur.c, cur.r, nc, nr);
            vis.add(nk);
            stack.push({ c: nc, r: nr });
            lastDir = d;
            moved = true;
            break;
          }
        }
        if (!moved) {
          stack.pop();
          lastDir = null;
        }
      }

      const sol = findShortestPath(candAdj, START_CELL, GOAL_CELL, HOUSE_CELLS);
      if (!sol.length) continue;

      const midC = COLS / 2, midR = ROWS / 2;
      const quads = new Set();
      for (const p of sol) quads.add(`${p.c < midC ? 0 : 1},${p.r < midR ? 0 : 1}`);

      const solSet = new Set(sol.map(p => keyOf(p.c, p.r)));
      const startK = keyOf(START_CELL.c, START_CELL.r);
      const goalK = keyOf(GOAL_CELL.c, GOAL_CELL.r);
      let safeDeadEnds = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const k = keyOf(c, r);
          if (HOUSE_CELLS.has(k) || solSet.has(k)) continue;
          const nb = candAdj.get(k);
          if (nb.size === 1 && !nb.has(startK) && !nb.has(goalK)) safeDeadEnds++;
        }
      }

      const plen = sol.length;
      const targetMid = (lv.minPath + lv.maxPath) / 2;
      let score = quads.size * 50;
      if (quads.size >= lv.minQuads) score += 60;
      if (plen >= lv.minPath && plen <= lv.maxPath) {
        score += 120 - Math.abs(plen - targetMid) * 1.2;
      } else {
        score -= Math.abs(plen - targetMid) * 4;
      }
      if (safeDeadEnds >= lv.wolves) {
        score += 80;
      } else {
        score -= (lv.wolves - safeDeadEnds) * 45;
      }

      if (score > bestScore) {
        bestScore = score;
        bestAdj = candAdj;
        bestSol = sol;
      }
    }

    adj = bestAdj;
    wolves = placeWolvesSafely(adj, bestSol, lv);

    const blockedWithWolves = new Set([...HOUSE_CELLS, ...wolves.map(w => keyOf(w.c, w.r))]);
    const verified = findShortestPath(adj, START_CELL, GOAL_CELL, blockedWithWolves);
    if (!verified.length) {
      const safeSet = new Set(bestSol.map(p => keyOf(p.c, p.r)));
      wolves = wolves.filter(w => !safeSet.has(keyOf(w.c, w.r)));
    }
  }

  // ================= RENDER HOUSE, GOAL, WALLS & WOLVES =================
  function positionHouseAndGoal(lv) {
    const minC = Math.min(...lv.houseCols);
    const minR = Math.min(...lv.houseRows);
    const hw = lv.houseCols.length * CELL_W;
    const hh = lv.houseRows.length * CELL_H;
    const hcx = MAZE_X + minC * CELL_W + hw / 2;
    const hcy = MAZE_Y + minR * CELL_H + hh / 2;

    const hScale = Math.min(hw / 246, hh / 154) * 1.02;
    grandmaHouseWrap.setAttribute(
      'transform',
      `translate(${hcx.toFixed(1)}, ${hcy.toFixed(1)}) scale(${hScale.toFixed(3)}) translate(-500, -342)`
    );

    const gp = cellCenter(GOAL_CELL.c, GOAL_CELL.r);
    const gScale = Math.min(0.95, Math.min(CELL_W / 86, CELL_H / 64));
    goalBadgeWrap.setAttribute(
      'transform',
      `translate(${gp.x.toFixed(1)}, ${gp.y.toFixed(1)}) scale(${gScale.toFixed(3)})`
    );
  }

  function buildWallGeometryAndRender(lv) {
    wallsLayer.innerHTML = '';
    wallRects = [];

    const outerStroke = Math.max(10, WALL_HALF * 2.1);
    const innerStroke = Math.max(9, WALL_HALF * 1.9);

    const addWallSegment = (x1, y1, x2, y2, isOuter = false) => {
      const sw = isOuter ? outerStroke : innerStroke;
      wallsLayer.appendChild(svgEl('line', {
        x1, y1, x2, y2,
        stroke: '#197820',
        'stroke-width': sw,
        'stroke-linecap': 'round'
      }));
      wallsLayer.appendChild(svgEl('line', {
        x1, y1, x2, y2,
        stroke: '#2da334',
        'stroke-width': Math.max(4, sw - 4.5),
        'stroke-linecap': 'round'
      }));

      const half = WALL_HALF;
      const minX = Math.min(x1, x2) - half;
      const maxX = Math.max(x1, x2) + half;
      const minY = Math.min(y1, y2) - half;
      const maxY = Math.max(y1, y2) + half;
      wallRects.push({ x: minX, y: minY, w: maxX - minX, h: maxY - minY });
    };

    addWallSegment(MAZE_X, MAZE_Y, MAZE_X + MAZE_W, MAZE_Y, true);
    addWallSegment(MAZE_X + MAZE_W, MAZE_Y, MAZE_X + MAZE_W, MAZE_Y + MAZE_H, true);
    addWallSegment(MAZE_X, MAZE_Y, MAZE_X, MAZE_Y + CELL_H * (ROWS - 1), true);
    addWallSegment(MAZE_X + CELL_W * 0.95, MAZE_Y + MAZE_H, MAZE_X + MAZE_W, MAZE_Y + MAZE_H, true);

    wallRects.push({ x: MAZE_X - 24, y: MAZE_Y + CELL_H * (ROWS - 1), w: 20, h: CELL_H + 20 });
    wallRects.push({ x: MAZE_X - 10, y: MAZE_Y + MAZE_H + 4, w: CELL_W + 10, h: 20 });

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 1; c++) {
        const k1 = keyOf(c, r);
        const k2 = keyOf(c + 1, r);
        if (HOUSE_CELLS.has(k1) && HOUSE_CELLS.has(k2)) continue;
        if (HOUSE_CELLS.has(k1) || HOUSE_CELLS.has(k2)) continue;
        if (!adj.get(k1).has(k2)) {
          const x = MAZE_X + (c + 1) * CELL_W;
          addWallSegment(x, MAZE_Y + r * CELL_H, x, MAZE_Y + (r + 1) * CELL_H);
        }
      }
    }

    for (let r = 0; r < ROWS - 1; r++) {
      for (let c = 0; c < COLS; c++) {
        const k1 = keyOf(c, r);
        const k2 = keyOf(c, r + 1);
        if (HOUSE_CELLS.has(k1) && HOUSE_CELLS.has(k2)) continue;
        if (HOUSE_CELLS.has(k1) || HOUSE_CELLS.has(k2)) continue;
        if (!adj.get(k1).has(k2)) {
          const y = MAZE_Y + (r + 1) * CELL_H;
          addWallSegment(MAZE_X + c * CELL_W, y, MAZE_X + (c + 1) * CELL_W, y);
        }
      }
    }

    const minC = Math.min(...lv.houseCols);
    const minR = Math.min(...lv.houseRows);
    wallRects.push({
      x: MAZE_X + minC * CELL_W + 3,
      y: MAZE_Y + minR * CELL_H + 3,
      w: lv.houseCols.length * CELL_W - 6,
      h: lv.houseRows.length * CELL_H - 6
    });

    positionHouseAndGoal(lv);
    renderWolves();
  }

  // ================= HINT & TRAIL =================
  function renderHint() {
    hintLayer.innerHTML = '';
    if (!hintVisible) return;
    const cur = getCellFromPos(player.x, player.y);
    const blocked = new Set([...HOUSE_CELLS, ...wolves.map(w => keyOf(w.c, w.r))]);
    const path = findShortestPath(adj, cur, GOAL_CELL, blocked);
    if (path.length < 2) return;
    const d = path.map((p, i) => {
      const pt = cellCenter(p.c, p.r);
      return `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
    }).join(' ');
    hintLayer.appendChild(svgEl('path', {
      d,
      fill: 'none',
      stroke: '#f582a7',
      'stroke-width': Math.max(4, Math.min(6, CELL_W * 0.08)),
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      'stroke-dasharray': '9 11',
      opacity: '0.82'
    }));
  }

  function addTrailDot(x, y) {
    const minDist = Math.max(12, Math.min(CELL_W, CELL_H) * 0.28);
    if (trailPoints.length > 0) {
      const last = trailPoints[trailPoints.length - 1];
      if (Math.hypot(x - last.x, y - last.y) < minDist) return;
    }
    trailPoints.push({ x, y });
    trailLayer.appendChild(svgEl('circle', {
      cx: x.toFixed(1),
      cy: (y + 14 * SPRITE_SCALE).toFixed(1),
      r: Math.max(2.5, 3.8 * SPRITE_SCALE),
      fill: '#f28ca8',
      opacity: '0.55'
    }));
    if (trailPoints.length > 260) {
      trailPoints.shift();
      if (trailLayer.firstChild) trailLayer.removeChild(trailLayer.firstChild);
    }
  }

  // ================= COLLISION & PHYSICS =================
  function circleIntersectsRect(cx, cy, r, rect) {
    const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  function collidesWithWalls(x, y) {
    for (const rect of wallRects) {
      if (circleIntersectsRect(x, y, PLAYER_RADIUS, rect)) return true;
    }
    return false;
  }

  function startTimerIfNeeded() {
    if (gameStarted || gameWon) return;
    gameStarted = true;
    timerId = setInterval(() => {
      if (!gameWon) {
        elapsedSec++;
        timerText.textContent = formatTime(elapsedSec);
      }
    }, 1000);
  }

  function releaseJoystick() {
    joy.active = false;
    joy.mode = null;
    joy.touchId = null;
    joy.isMouse = false;
    joy.vecX = 0;
    joy.vecY = 0;
    floatingJoystick.classList.remove('active');
    floatingKnob.style.transform = 'translate3d(0px, 0px, 0)';
    dockKnob.style.transform = 'translate3d(0px, 0px, 0)';
  }

  function resetPlayerToStart() {
    const startPos = cellCenter(START_CELL.c, START_CELL.r);
    player.x = startPos.x;
    player.y = startPos.y;
    player.facing = 1;
    lastCellKey = keyOf(START_CELL.c, START_CELL.r);
    steps = 0;
    elapsedSec = 0;
    gameStarted = false;
    gameWon = false;
    wolfCooldown = 0;
    hintVisible = false;
    trailPoints = [];
    trailLayer.innerHTML = '';
    hintLayer.innerHTML = '';
    confettiLayer.innerHTML = '';
    clearInterval(timerId);
    timerText.textContent = '00:00';
    stepsText.textContent = '0';
    victoryModal.classList.remove('show');
    releaseJoystick();
    updatePlayerTransform(0);
  }

  function updatePlayerTransform(walkBob) {
    const bobY = walkBob ? Math.sin(walkBob) * 3.2 * SPRITE_SCALE : 0;
    playerGroup.setAttribute('transform', `translate(${player.x.toFixed(1)}, ${(player.y + bobY).toFixed(1)})`);
    playerSprite.setAttribute('transform', `scale(${(player.facing * SPRITE_SCALE).toFixed(3)}, ${SPRITE_SCALE.toFixed(3)})`);
  }

  // ================= LEVEL UI & PROGRESSION =================
  function renderLevelBar() {
    levelBar.innerHTML = '';
    LEVELS.forEach((lv, idx) => {
      const btn = document.createElement('button');
      const isCleared = clearedLevels.has(lv.id);
      const isActive = idx === currentLevelIdx;
      btn.className = `level-chip${isActive ? ' active' : ''}${isCleared ? ' cleared' : ''}`;
      btn.textContent = `${isCleared ? '⭐' : '🌲'} ${lv.short}`;
      btn.title = `第 ${lv.id} 關：${lv.name}（${lv.cols}×${lv.rows}，${lv.wolves} 隻大灰狼）`;
      btn.addEventListener('click', () => loadLevel(idx, false));
      levelBar.appendChild(btn);
    });
  }

  function loadLevel(idx, forceRandom = false) {
    currentLevelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
    const lv = LEVELS[currentLevelIdx];
    levelNameText.textContent = `第 ${lv.id} 關・${lv.name}`;
    buildMazeForLevel(lv, forceRandom);
    buildWallGeometryAndRender(lv);
    resetPlayerToStart();
    renderLevelBar();
    showToast(`🌲 第 ${lv.id} 關「${lv.name}」開始！拖曳螢幕任何地方即可操控！`);
  }

  // ================= VICTORY CELEBRATION =================
  function triggerVictory() {
    gameWon = true;
    clearInterval(timerId);
    releaseJoystick();
    playWinSound();

    const lv = LEVELS[currentLevelIdx];
    clearedLevels.add(lv.id);
    renderLevelBar();

    winTime.textContent = formatTime(elapsedSec);
    winSteps.textContent = steps;

    if (currentLevelIdx < LEVELS.length - 1) {
      const nextLv = LEVELS[currentLevelIdx + 1];
      modalEmoji.textContent = '🏠👵🎉';
      modalTitle.textContent = `第 ${lv.id} 關過關成功！`;
      modalSub.textContent = `小紅帽平安避開大灰狼把點心送到外婆家了！準備好挑戰第 ${nextLv.id} 關「${nextLv.name}」嗎？`;
      modalNextBtn.textContent = `⬆️ 挑戰第 ${nextLv.id} 關`;
    } else {
      modalEmoji.textContent = '👑🏠👵🎊';
      modalTitle.textContent = '太強了！全 5 關大滿貫！';
      modalSub.textContent = '你已經征服最高難度的森林大迷宮，小紅帽和外婆都為你拍拍手！';
      modalNextBtn.textContent = '🎲 再挑戰新的專家迷宮';
    }

    spawnConfetti();
    setTimeout(() => victoryModal.classList.add('show'), 420);
  }

  function spawnConfetti() {
    confettiLayer.innerHTML = '';
    const gp = cellCenter(GOAL_CELL.c, GOAL_CELL.r);
    const colors = ['#ff85a2', '#ffd447', '#7fd13b', '#66c2ff', '#c990f2', '#ff9b6a'];
    const particles = [];
    for (let i = 0; i < 48; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 5.5;
      const p = {
        x: gp.x, y: gp.y - 20,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.5,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 14,
        el: svgEl('rect', {
          width: 10 + Math.random() * 6,
          height: 6 + Math.random() * 5,
          rx: 2,
          fill: colors[i % colors.length]
        })
      };
      confettiLayer.appendChild(p.el);
      particles.push(p);
    }
    let frames = 0;
    function animConfetti() {
      frames++;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.rot += p.vrot;
        p.el.setAttribute('transform', `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)})`);
        p.el.setAttribute('opacity', Math.max(0, 1 - frames / 90).toFixed(2));
      });
      if (frames < 90 && gameWon) requestAnimationFrame(animConfetti);
    }
    requestAnimationFrame(animConfetti);
  }

  // ================= MAIN GAME LOOP =================
  let walkPhase = 0;
  function tick() {
    if (!gameWon) {
      let ix = 0, iy = 0;

      if (keys.left)  ix -= 1;
      if (keys.right) ix += 1;
      if (keys.up)    iy -= 1;
      if (keys.down)  iy += 1;
      if (ix !== 0 || iy !== 0) {
        const kLen = Math.hypot(ix, iy);
        ix /= kLen;
        iy /= kLen;
      }

      if (joy.active && (Math.abs(joy.vecX) > 0.08 || Math.abs(joy.vecY) > 0.08)) {
        ix = joy.vecX;
        iy = joy.vecY;
      }

      const mag = Math.hypot(ix, iy);
      if (mag > 0.08) {
        startTimerIfNeeded();
        const maxSpeed = Math.max(3.0, Math.min(4.2, Math.min(CELL_W, CELL_H) * 0.058));
        const clampedMag = Math.min(1, mag);
        const dx = (ix / mag) * maxSpeed * clampedMag;
        const dy = (iy / mag) * maxSpeed * clampedMag;

        if (Math.abs(dx) > 0.15) player.facing = dx >= 0 ? 1 : -1;

        const nx = player.x + dx;
        if (!collidesWithWalls(nx, player.y)) player.x = nx;
        const ny = player.y + dy;
        if (!collidesWithWalls(player.x, ny)) player.y = ny;

        walkPhase += 0.28 * clampedMag;
        addTrailDot(player.x, player.y);

        const cur = getCellFromPos(player.x, player.y);
        const ck = keyOf(cur.c, cur.r);
        if (ck !== lastCellKey && !HOUSE_CELLS.has(ck)) {
          lastCellKey = ck;
          steps++;
          stepsText.textContent = steps;
          playStepSound();
          if (hintVisible) renderHint();
        }

        if (wolfCooldown <= 0) {
          const triggerDist = Math.min(CELL_W, CELL_H) * 0.43;
          for (const w of wolves) {
            const wk = keyOf(w.c, w.r);
            const sameOrConnected = (ck === wk) || adj.get(ck).has(wk);
            if (!sameOrConnected) continue;
            const wp = cellCenter(w.c, w.r);
            if (Math.hypot(player.x - wp.x, player.y - wp.y) < triggerDist) {
              wolfCooldown = 42;
              playWolfSound();
              showToast(w.msg);
              const bx = player.x - wp.x;
              const by = player.y - wp.y;
              const bl = Math.hypot(bx, by) || 1;
              const push = Math.min(CELL_W, CELL_H) * 0.34;
              const pushX = player.x + (bx / bl) * push;
              const pushY = player.y + (by / bl) * push;
              if (!collidesWithWalls(pushX, player.y)) player.x = pushX;
              if (!collidesWithWalls(player.x, pushY)) player.y = pushY;
              break;
            }
          }
        }

        const gp = cellCenter(GOAL_CELL.c, GOAL_CELL.r);
        if (Math.hypot(player.x - gp.x, player.y - gp.y) < Math.min(CELL_W, CELL_H) * 0.45) {
          triggerVictory();
        }
      } else {
        walkPhase = 0;
      }

      if (wolfCooldown > 0) wolfCooldown--;
      updatePlayerTransform(walkPhase);
    }

    requestAnimationFrame(tick);
  }

  // ================= 360° JOYSTICK LOGIC (iOS / iPadOS SAFARI OPTIMIZED) =================
  function isInteractiveUI(target) {
    return !!(target && target.closest && target.closest('button, .modal-backdrop'));
  }

  function startJoystick(clientX, clientY, mode, touchId, isMouse) {
    ensureAudio();
    joy.active = true;
    joy.mode = mode;
    joy.touchId = touchId;
    joy.isMouse = isMouse;

    if (mode === 'dock') {
      const rect = dockJoystick.getBoundingClientRect();
      joy.originX = rect.left + rect.width / 2;
      joy.originY = rect.top + rect.height / 2;
      joy.maxRadius = rect.width * 0.36;
      updateJoystick(clientX, clientY);
    } else {
      joy.originX = clientX;
      joy.originY = clientY;
      joy.maxRadius = 44;
      joy.vecX = 0;
      joy.vecY = 0;
      floatingJoystick.style.left = `${clientX}px`;
      floatingJoystick.style.top = `${clientY}px`;
      floatingKnob.style.transform = 'translate3d(0px, 0px, 0)';
      floatingJoystick.classList.add('active');
    }
  }

  function updateJoystick(clientX, clientY) {
    if (!joy.active) return;
    const rawX = clientX - joy.originX;
    const rawY = clientY - joy.originY;
    const dist = Math.hypot(rawX, rawY);
    const maxR = joy.maxRadius;

    let clampedX = rawX;
    let clampedY = rawY;
    if (dist > maxR) {
      clampedX = (rawX / dist) * maxR;
      clampedY = (rawY / dist) * maxR;
    }

    if (dist < 4) {
      joy.vecX = 0;
      joy.vecY = 0;
    } else {
      joy.vecX = clampedX / maxR;
      joy.vecY = clampedY / maxR;
    }

    if (joy.mode === 'dock') {
      dockKnob.style.transform = `translate3d(${clampedX.toFixed(1)}px, ${clampedY.toFixed(1)}px, 0)`;
    } else {
      floatingKnob.style.transform = `translate3d(${clampedX.toFixed(1)}px, ${clampedY.toFixed(1)}px, 0)`;
    }
  }

  document.addEventListener('touchstart', (e) => {
    if (gameWon) return;
    if (joy.active) return;
    const t = e.changedTouches[0];
    if (!t) return;
    if (isInteractiveUI(e.target)) return;

    const inDock = !!(e.target && e.target.closest && e.target.closest('#dockJoystick'));
    e.preventDefault();
    startJoystick(t.clientX, t.clientY, inDock ? 'dock' : 'floating', t.identifier, false);
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!joy.active || joy.isMouse) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joy.touchId) {
        e.preventDefault();
        updateJoystick(t.clientX, t.clientY);
        break;
      }
    }
  }, { passive: false });

  function handleTouchEnd(e) {
    if (!joy.active || joy.isMouse) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joy.touchId) {
        releaseJoystick();
        break;
      }
    }
  }
  document.addEventListener('touchend', handleTouchEnd, { passive: true });
  document.addEventListener('touchcancel', handleTouchEnd, { passive: true });

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || gameWon) return;
    if (isInteractiveUI(e.target)) return;
    const inDock = !!(e.target && e.target.closest && e.target.closest('#dockJoystick'));
    const inStage = !!(e.target && e.target.closest && e.target.closest('#stageWrap'));
    if (!inDock && !inStage) return;
    e.preventDefault();
    startJoystick(e.clientX, e.clientY, inDock ? 'dock' : 'floating', null, true);
  });

  window.addEventListener('mousemove', (e) => {
    if (!joy.active || !joy.isMouse) return;
    updateJoystick(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', () => {
    if (joy.active && joy.isMouse) releaseJoystick();
  });

  window.addEventListener('blur', releaseJoystick);

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) {
      e.preventDefault();
      if (k === 'arrowup' || k === 'w') keys.up = true;
      if (k === 'arrowdown' || k === 's') keys.down = true;
      if (k === 'arrowleft' || k === 'a') keys.left = true;
      if (k === 'arrowright' || k === 'd') keys.right = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') keys.up = false;
    if (k === 'arrowdown' || k === 's') keys.down = false;
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
  });

  hintBtn.addEventListener('click', () => {
    hintVisible = !hintVisible;
    renderHint();
    if (hintVisible) showToast('💡 已顯示避開大灰狼的粉紅虛線安全路線！');
  });

  resetBtn.addEventListener('click', () => {
    resetPlayerToStart();
    showToast('🔄 小紅帽回到起點囉！');
  });

  rerollBtn.addEventListener('click', () => {
    loadLevel(currentLevelIdx, true);
  });

  modalReplayBtn.addEventListener('click', resetPlayerToStart);

  modalNextBtn.addEventListener('click', () => {
    if (currentLevelIdx < LEVELS.length - 1) {
      loadLevel(currentLevelIdx + 1, false);
    } else {
      loadLevel(LEVELS.length - 1, true);
    }
  });

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 音效' : '🔇 靜音';
  });

  // ================= START AT LEVEL 1 =================
  loadLevel(0, false);
  requestAnimationFrame(tick);
})();
</script>
</body>
