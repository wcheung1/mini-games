<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#231a5c">
<title>問問星球 Question Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{
  --ink:#2b2350; --muted:#6b6590; --purple:#6c4ee3; --purple2:#8b6cff; --pink:#ff6fa8; --yellow:#ffd23f;
  --green:#22b573; --blue:#3fa9f5; --orange:#ff9f1c; --red:#ef476f; --card:rgba(255,255,255,.94);
  --hdr:64px; --tk:48px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Noto Sans HK','Baloo 2',system-ui,-apple-system,"PingFang HK",sans-serif;
  color:var(--ink);
  background:radial-gradient(1200px 800px at 70% 10%,#4b35b5 0%,#2a1f72 45%,#140f3d 100%) fixed;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
button{font-family:inherit;color:inherit}
/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; min-height:var(--hdr);
  background:linear-gradient(180deg,rgba(20,14,60,.85),rgba(20,14,60,.55));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;
}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.brand .logo{font-size:34px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.brand b{font-size:20px;font-weight:900;letter-spacing:1px;display:block;line-height:1.1}
.brand small{font-family:'Baloo 2';opacity:.8;font-size:13px}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;min-width:46px;height:46px;font-size:20px;font-weight:800;cursor:pointer;padding:0 10px}
.hbtn:active{transform:scale(.94)}
.starbox{display:flex;align-items:center;gap:6px;background:rgba(255,210,63,.18);border:2px solid rgba(255,210,63,.6);border-radius:16px;padding:4px 10px;height:46px}
.starbox b{font-size:20px;color:var(--yellow)}
.starbox small{font-size:12px;opacity:.9;max-width:92px;line-height:1.1}
.starbox.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95)}}
/* ---------- layout ---------- */
main{position:relative;z-index:10;max-width:800px;margin:0 auto;padding:calc(var(--hdr) + env(safe-area-inset-top) + 16px) 14px calc(var(--tk) + 40px + env(safe-area-inset-bottom))}
@media (min-width:900px) and (min-aspect-ratio:5/4){ main{margin-left:max(24px,4vw);max-width:min(780px,60vw)} }
.card{background:var(--card);border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.28);border:3px solid #fff;position:relative}
h1,h2,h3,h4{margin:0 0 10px}
h2{font-size:26px;font-weight:900}
p{line-height:1.65;margin:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
/* ---------- buttons ---------- */
.btn{border:none;border-radius:18px;padding:12px 20px;font-size:18px;font-weight:800;min-height:52px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s;color:#fff;background:var(--purple)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.5}
.btn-yellow{background:var(--yellow);color:#3a2c00}
.btn-green{background:var(--green)}
.btn-pink{background:var(--pink)}
.btn-blue{background:var(--blue)}
.btn-ghost{background:#efeafd;color:var(--purple);box-shadow:0 4px 0 #d6cdf7}
.btn-big{font-size:22px;padding:16px 26px;min-height:64px;width:100%}
.spk{flex:none;width:48px;height:48px;border-radius:50%;border:none;background:var(--yellow);font-size:24px;cursor:pointer;box-shadow:0 4px 0 #d8a800;display:inline-grid;place-items:center;vertical-align:middle}
.spk:active{transform:translateY(2px);box-shadow:0 2px 0 #d8a800}
.spk.big{width:64px;height:64px;font-size:32px}
.spk.sm{width:38px;height:38px;font-size:18px}
.spk.playing{animation:pulse 1s infinite;background:#ff9f1c}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,28,.7)}100%{box-shadow:0 0 0 18px rgba(255,159,28,0)}}
.chip{border:2px solid #d8cff9;background:#fff;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;cursor:pointer;min-height:42px}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
/* ---------- home ---------- */
.hero-row{display:flex;gap:14px;align-items:center}
.owl2d{font-size:64px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.bubble{flex:1;background:#f4f0ff;border-radius:20px;padding:12px 16px;position:relative}
.bubble b{font-size:20px}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;justify-content:center}
.step{background:#eef7ff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:17px}
.step.hot{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#3a2200;transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,210,63,.35);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,210,63,.1)}}
.arr{color:#aaa;font-weight:900}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.mcard{border-radius:26px;padding:18px;color:#fff;cursor:pointer;position:relative;min-height:170px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 30px rgba(0,0,0,.25);transition:transform .15s;border:3px solid rgba(255,255,255,.6)}
.mcard:active{transform:scale(.97)}
.mcard .me{font-size:52px;line-height:1}
.mcard h3{font-size:24px;font-weight:900;margin:8px 0 4px}
.mcard p{margin:0;opacity:.95;font-size:16px;padding-right:50px}
.mcard .spk{position:absolute;right:14px;bottom:14px}
.mcard .badge{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800}
.c1{background:linear-gradient(135deg,#ff8a5b,#ff5e8a)}
.c2{background:linear-gradient(135deg,#3fc1f5,#3f7cf5)}
.c3{background:linear-gradient(135deg,#8b6cff,#5b3fd6)}
.c4{background:linear-gradient(135deg,#2ec27e,#1a9c8c)}
/* ---------- learn ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:none;border-radius:16px;padding:10px 14px;font-size:22px;background:rgba(255,255,255,.8);cursor:pointer;position:relative}
.tab.on{background:var(--yellow);transform:scale(1.08)}
.tab .ok{position:absolute;top:-6px;right:-6px;font-size:14px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.lesson-emoji{font-size:72px;text-align:center;animation:bob 2.6s infinite}
.lesson-title{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.lesson-title h2{margin:0}
.lesson-body{font-size:20px;line-height:1.8}
.example{background:#fff8dd;border:3px dashed var(--yellow);border-radius:20px;padding:14px;margin-top:12px;display:flex;gap:10px;align-items:flex-start;font-size:18px}
.example b{display:block;color:#b27b00}
/* ---------- game ---------- */
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:#ddd}
.dots i.done{background:var(--green)} .dots i.bad{background:var(--red)} .dots i.cur{background:var(--purple);transform:scale(1.3)}
.goalbox{background:#e9f7ef;border-radius:18px;padding:12px 14px;font-size:19px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:3px solid #e4ddfb;background:#fff;border-radius:20px;padding:14px;margin:10px 0;font-size:19px;cursor:pointer;min-height:64px;font-weight:600}
.opt .lt{flex:none;width:40px;height:40px;border-radius:12px;background:#efeafd;color:var(--purple);display:grid;place-items:center;font-weight:900;font-family:'Baloo 2'}
.opt.right{border-color:var(--green);background:#e8fbf1}
.opt.right .lt{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff0f3}
.opt.wrong .lt{background:var(--red);color:#fff}
.feedback{border-radius:20px;padding:14px;margin-top:8px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.feedback.good{background:#e8fbf1} .feedback.bad{background:#fff4e0}
.bigscore{font-size:64px;font-weight:900;text-align:center;color:var(--purple);font-family:'Baloo 2'}
/* ---------- lab ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.scard{border:3px solid #eee;background:#fff;border-radius:22px;padding:14px;cursor:pointer;position:relative;min-height:140px;text-align:left}
.scard.on{border-color:var(--purple);background:#f4f0ff;box-shadow:0 0 0 4px rgba(108,78,227,.2)}
.scard .se{font-size:44px}
.scard b{display:block;font-size:18px;margin-top:6px}
.scard .spk{position:absolute;top:10px;right:10px}
textarea,input,select{font-family:inherit;font-size:18px;border:3px solid #e1d9fb;border-radius:16px;padding:12px 14px;width:100%;background:#fff;color:var(--ink);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--purple2)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.qwrap{position:relative}
.mic{position:absolute;right:10px;bottom:12px;width:46px;height:46px;border-radius:50%;border:none;background:var(--pink);color:#fff;font-size:22px;cursor:pointer}
.mic.rec{animation:pulse 1s infinite;background:var(--red)}
.label{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.goal-hdr{display:flex;gap:12px;align-items:center}
.goal-hdr .se{font-size:52px}
.kid{display:flex;justify-content:flex-end;margin:14px 0 8px}
.kid .kb{background:linear-gradient(135deg,var(--blue),#5a8cff);color:#fff;border-radius:22px 22px 6px 22px;padding:12px 16px;max-width:88%;font-size:19px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.kid .kb small{display:block;opacity:.9;font-size:14px;margin-top:6px}
.result{background:var(--card);border-radius:26px 26px 26px 8px;padding:18px;border:3px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.25);margin-bottom:10px}
.res-top{display:flex;gap:14px;align-items:center}
.ring{--p:0;--c:var(--green);flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),#ece8f8 0);display:grid;place-items:center}
.ring span{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:32px}
.stars{font-size:24px;color:var(--yellow);letter-spacing:2px;text-shadow:0 2px 0 #c99a00}
.stars .off{color:#ddd;text-shadow:none}
.verdict{font-weight:800;font-size:19px;margin:4px 0}
.tag{display:inline-block;background:#efeafd;color:var(--purple);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:800}
.dims{margin:14px 0 4px}
.dim{display:grid;grid-template-columns:92px 1fr 26px;gap:8px;align-items:center;margin:6px 0;font-weight:700;font-size:15px}
.bar{height:14px;background:#eee;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--v) * 20%);background:linear-gradient(90deg,var(--blue),var(--purple2));border-radius:10px;transition:width .8s}
.sec{border-radius:18px;padding:12px 14px;margin-top:10px}
.sec h4{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px;margin:0 0 4px}
.sec ul{margin:4px 0 0;padding-left:22px;font-size:17px;line-height:1.7}
.s-good{background:#e8fbf1}.s-fix{background:#fff4e0}.s-soc{background:#f1ecff}.s-goal{background:#e6f5ff}.s-hint{background:#fffbe6}.s-ins{background:#fdeef5}.s-prog{background:#e9fff4;font-weight:700}
.s-soc li{font-weight:700}
.goalopt{display:block;width:100%;text-align:left;border:3px solid #cfe7fb;background:#fff;border-radius:16px;padding:10px 14px;margin:6px 0;font-size:17px;cursor:pointer;font-weight:600}
.goalopt.on{border-color:var(--blue);background:var(--blue);color:#fff}
details summary{cursor:pointer;font-weight:800;font-size:17px;padding:4px 0}
pre.think{white-space:pre-wrap;word-break:break-word;background:#1d1640;color:#d9d0ff;border-radius:14px;padding:12px;font-size:13px;max-height:320px;overflow:auto}
.thinking-card{text-align:center}
.think-owl{font-size:60px;animation:bob 1s infinite}
.live{background:#1d1640;color:#cfc4ff;border-radius:14px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;height:84px;overflow:hidden;text-align:left;display:flex;align-items:flex-end;margin:10px 0;word-break:break-all}
.live .c{color:#8ff0b8}
.chosen{background:#e6f5ff;border-radius:14px;padding:8px 12px;font-weight:700;margin:6px 0}
.summary-bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding:10px 4px;border-bottom:3px solid #eee;margin:10px 0}
.summary-bars div{flex:1;background:linear-gradient(0deg,var(--purple),var(--pink));border-radius:12px 12px 4px 4px;color:#fff;font-weight:900;text-align:center;font-family:'Baloo 2';padding-top:4px;min-height:28px}
.notice{background:#fff4e0;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- notebook ---------- */
.nb-item{display:flex;gap:12px;align-items:center;border-bottom:2px dashed #eee;padding:12px 0;flex-wrap:wrap}
.nb-item .se{font-size:40px}
.nb-item .info{flex:1;min-width:160px}
.nb-item .info b{font-size:18px}
.cloudbox{background:#eef7ff;border-radius:18px;padding:14px;margin-top:12px}
/* ---------- ticker ---------- */
#ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tk) + env(safe-area-inset-bottom));padding:0 10px env(safe-area-inset-bottom);display:flex;align-items:center;gap:10px;background:rgba(18,12,52,.94);color:#fff;border-top:3px solid #3a2f7a;cursor:pointer}
#ticker.stream{border-image:linear-gradient(90deg,var(--yellow),var(--pink),var(--blue),var(--green),var(--yellow)) 1;animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.dot{flex:none;width:14px;height:14px;border-radius:50%;background:#888;box-shadow:0 0 0 3px rgba(255,255,255,.1)}
.dot.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.err{background:var(--red);box-shadow:0 0 10px var(--red)}
.dot.stream{background:var(--yellow);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.3}}
.tk-label{flex:none;font-weight:900;font-family:'Baloo 2';font-size:15px;opacity:.9}
.tk-track{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;justify-content:flex-end;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%);mask-image:linear-gradient(90deg,transparent,#000 10%)}
.tk-text{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.tk-text.r{color:#c9b8ff} .tk-text.c{color:#8ff0b8}
.tk-text .cur{animation:blink .5s infinite alternate;color:var(--yellow)}
.tk-track.idle{justify-content:flex-start}
.tk-track.idle .tk-text{padding-left:100%;animation:marq 16s linear infinite;font-family:inherit;color:#fff}
@keyframes marq{to{transform:translateX(-100%)}}
.tk-stats{flex:none;font-size:12px;opacity:.85;font-family:ui-monospace,Menlo,monospace;text-align:right;line-height:1.2}
@media (max-width:560px){.tk-stats{display:none}}
.tk-btn{flex:none;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;height:34px;min-width:34px;font-size:16px;cursor:pointer}
#tkPanel{position:fixed;left:0;right:0;bottom:calc(var(--tk) + env(safe-area-inset-bottom));z-index:39;max-height:60vh;background:rgba(18,12,52,.97);color:#eee;transform:translateY(110%);transition:transform .3s;padding:12px;overflow:auto;border-top-left-radius:22px;border-top-right-radius:22px}
#tkPanel.open{transform:none}
.tkp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.tkp-grid{grid-template-columns:1fr}}
.tkp-grid pre{white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-size:13px;height:32vh;overflow:auto;margin:6px 0 0}
#tkR{color:#c9b8ff}#tkC{color:#8ff0b8}
#tkMeta{font-family:ui-monospace,Menlo,monospace;font-size:12px;opacity:.85;margin-top:8px}
/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,6,30,.6);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 12px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
#modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead .hbtn{background:#efeafd;color:var(--purple);border-color:#e1d9fb}
.sgroup{border-top:2px dashed #eee;padding:14px 0}
.sgroup h3{font-size:19px}
.sgroup label{display:block;font-weight:700;margin:10px 0 4px;font-size:15px}
.sgroup label input,.sgroup label select,.sgroup label textarea{margin-top:4px}
label.chk{display:flex;gap:10px;align-items:center}
label.chk input{width:24px;height:24px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0}
.seg{display:flex;gap:8px}
.seg button{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translateX(-50%) translateY(-20px);z-index:80;background:#fff;color:var(--ink);border-radius:18px;padding:12px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}}
.screen{pointer-events:none}.screen>*{pointer-events:auto}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<header>
  <button class="hbtn" data-act="home" id="homeBtn" aria-label="Home">🏠</button>
  <div class="brand" data-act="home"><span class="logo">🦉</span><div><b id="brandName">問問星球</b><small id="brandSub">Question Planet</small></div></div>
  <div class="hspace"></div>
  <div class="starbox" id="starBox"><span>⭐</span><b id="starCount">0</b><small id="levelName"></small></div>
  <button class="hbtn" data-act="lang" id="langBtn">EN</button>
  <button class="hbtn" data-act="settings" aria-label="Settings">⚙️</button>
</header>

<main id="view" class="screen"></main>

<div id="tkPanel">
  <div class="row" style="justify-content:space-between">
    <b id="tkpTitle">📡 AI 直播</b>
    <div class="row"><button class="tk-btn" data-act="stop">⏹</button><button class="tk-btn" data-act="copyStream">📋</button><button class="tk-btn" data-act="tkToggle">✕</button></div>
  </div>
  <div class="tkp-grid">
    <div><b id="tkRLabel">💭 思考過程 reasoning</b><pre id="tkR"></pre></div>
    <div><b id="tkCLabel">✍️ 輸出 content</b><pre id="tkC"></pre></div>
  </div>
  <div id="tkMeta"></div>
</div>
<div id="ticker" data-act="tkToggle">
  <span class="dot" id="tkDot"></span>
  <span class="tk-label">AI</span>
  <div class="tk-track idle" id="tkTrack"><div class="tk-text" id="tkText"></div></div>
  <span class="tk-stats" id="tkStats"></span>
  <button class="tk-btn" id="tkArrow" aria-label="expand">▲</button>
</div>

/* =========================================================
   Text-to-speech (Cantonese zh-HK / British English en-GB)
   ========================================================= */
let voices = [];
const hasTTS = 'speechSynthesis' in window;
function loadVoices() { if (hasTTS) voices = speechSynthesis.getVoices(); }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (!$('#modal').hidden) fillVoices(); }; }
const isZhText = t => { const cjk = (t.match(/[\u3400-\u9fff]/g) || []).length; const lat = (t.match(/[A-Za-z]/g) || []).length; return cjk * 3 >= lat; };
function zhVoices() { return voices.filter(v => /zh[-_]HK|yue/i.test(v.lang) || /Cantonese|粵|廣東|Sin-?ji|Hong Kong/i.test(v.name)); }
function enVoices() { return voices.filter(v => /^en[-_]GB/i.test(v.lang)).concat(voices.filter(v => /^en/i.test(v.lang) && !/^en[-_]GB/i.test(v.lang))); }
function pickVoice(lang) {
  const pref = lang === 'zh' ? S.voiceZh : S.voiceEn;
  if (pref) { const v = voices.find(v => v.voiceURI === pref); if (v) return v; }
  return (lang === 'zh' ? zhVoices() : enVoices())[0] || null;
}
function chunkText(t) {
  const parts = t.replace(/([。！？!?；;\n])/g, '$1\u0001').split('\u0001'); const out = []; let cur = '';
  for (const p of parts) { if ((cur + p).length > 110 && cur) { out.push(cur); cur = p; } else cur += p; }
  if (cur.trim()) out.push(cur);
  return out.flatMap(c => c.length > 180 ? c.match(/.{1,160}(\s|，|,|$)/g) || [c] : [c]).filter(s => s.trim());
}
let speakingBtn = null, speakGen = 0;
function stopSpeak() {
  speakGen++;
  if (hasTTS) speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.classList.remove('playing');
  speakingBtn = null; scene3d?.setTalking(false);
}
function speak(text, btn) {
  if (!hasTTS) { toast(L('呢部機唔支援語音朗讀', 'Speech is not supported on this device')); return; }
  if (btn && speakingBtn === btn) { stopSpeak(); return; }
  const wasSpeaking = speechSynthesis.speaking || speechSynthesis.pending;
  stopSpeak();
  const clean = String(text).replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu, '').replace(/[*#_`>|]/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  const lang = isZhText(clean) ? 'zh' : 'en';
  const v = pickVoice(lang);
  if (lang === 'zh' && !v && !speak.warned) { speak.warned = true; toast(L('搵唔到廣東話聲音，請睇 ⚙️ 設定入面嘅語音提示', 'No Cantonese voice found — see tips in ⚙️ Settings'), 4000); }
  const gen = speakGen; speakingBtn = btn || null; btn?.classList.add('playing'); scene3d?.setTalking(true);
  const go = () => {
    if (gen !== speakGen) return;
    const chunks = chunkText(clean);
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = lang === 'zh' ? 'zh-HK' : 'en-GB'; if (v) u.voice = v;
      u.rate = S.ttsRate; u.pitch = 1.05;
      if (i === chunks.length - 1) u.onend = u.onerror = () => { if (gen === speakGen) { btn?.classList.remove('playing'); speakingBtn = null; scene3d?.setTalking(false); } };
      speechSynthesis.speak(u);
    });
  };
  wasSpeaking ? setTimeout(go, 80) : go();
}

const spk = (text, cls = '') => { if (!text) return ''; SAY.push(text); return `<button class="spk ${cls}" data-act="say" data-i="${SAY.length - 1}" aria-label="listen">🔊</button>`; };

/* ---------------- speech recognition (optional) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function toggleMic(btn) {
  const ta = $('#' + btn.dataset.target); if (!SR || !ta) return;
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = S.lang === 'en' ? 'en-GB' : 'zh-HK'; rec.interimResults = true; rec.continuous = false;
  const base = ta.value;
  rec.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript; ta.value = (base ? base + ' ' : '') + s; };
  rec.onerror = e => toast('🎤 ' + e.error);
  rec.onend = () => { btn.classList.remove('rec'); rec = null; };
  btn.classList.add('rec'); stopSpeak(); rec.start();
}
const micBtn = id => SR ? `<button class="mic" data-act="mic" data-target="${id}" aria-label="mic">🎤</button>` : '';

/* =========================================================
   Three.js scene — Question Planet + Dr Hoot the owl
   ========================================================= */
let scene3d = null;
async function init3D() {
  let THREE;
  try { THREE = await import('three'); } catch (e) { console.warn('Three.js failed to load', e); return; }
  const canvas = $('#bg');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); } catch (e) { console.warn(e); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
  camera.position.set(0, 1.2, 14);
  scene.add(new THREE.HemisphereLight(0xfff6e0, 0x5a3cb0, 1.4));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 10, 8); scene.add(sun);
  const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });

  const world = new THREE.Group(); scene.add(world);

  // planet
  const planet = new THREE.Group(); world.add(planet);
  const pg = new THREE.IcosahedronGeometry(2.6, 3);
  const pos = pg.attributes.position, v3 = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) { v3.fromBufferAttribute(pos, i); const k = 1 + (Math.sin(v3.x * 3) + Math.cos(v3.y * 4) + Math.sin(v3.z * 5)) * 0.018; v3.multiplyScalar(k); pos.setXYZ(i, v3.x, v3.y, v3.z); }
  pg.computeVertexNormals();
  planet.add(new THREE.Mesh(pg, M(0x6fd3a0, { flatShading: true })));
  // decorations on surface
  const up = new THREE.Vector3(0, 1, 0);
  const treeM = M(0x2e9e6b, { flatShading: true }), trunkM = M(0x8a5a36), mushM = M(0xff6f8e), dotM = M(0xffffff), flowerM = M(0xffd23f);
  for (let i = 0; i < 26; i++) {
    const n = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
    if (n.y > 0.78) continue;
    const g = new THREE.Group(); const kind = i % 3;
    if (kind === 0) { const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.3, 6), trunkM); tr.position.y = 0.15; g.add(tr); const c = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 7), treeM); c.position.y = 0.55; g.add(c); }
    else if (kind === 1) { const st = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.2, 6), dotM); st.position.y = 0.1; g.add(st); const cap = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), mushM); cap.position.y = 0.2; g.add(cap); }
    else { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), flowerM); f.position.y = 0.12; g.add(f); }
    g.position.copy(n).multiplyScalar(2.58); g.quaternion.setFromUnitVectors(up, n); planet.add(g);
  }
  // ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.9, 0.07, 8, 96), M(0xffd23f, { emissive: 0x6a4a00, emissiveIntensity: 0.6 }));
  ring.rotation.x = 1.25; world.add(ring);
  const moon = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 1), M(0xbfd8ff, { flatShading: true })); world.add(moon);

  // owl
  function makeOwl() {
    const g = new THREE.Group();
    const brown = M(0x9b6b43), belly = M(0xf3d9b1), white = M(0xffffff, { roughness: 0.3 }), black = M(0x1c1c2a, { roughness: 0.2 }), orange = M(0xffa531), capM = M(0x2b2350);
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 28, 20), brown); body.scale.set(1, 1.15, 0.95); g.add(body);
    const bel = new THREE.Mesh(new THREE.SphereGeometry(0.66, 24, 18), belly); bel.position.set(0, -0.15, 0.45); bel.scale.set(1, 1.1, 0.6); g.add(bel);
    const head = new THREE.Group(); head.position.y = 1.05; g.add(head);
    const hm = new THREE.Mesh(new THREE.SphereGeometry(0.74, 28, 20), brown); hm.scale.set(1.12, 0.95, 1); head.add(hm);
    const face = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 18), belly); face.position.set(0, -0.02, 0.32); face.scale.set(1.2, 0.85, 0.6); head.add(face);
    const eyes = [];
    for (const s of [-1, 1]) {
      const ew = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 16), white); ew.position.set(s * 0.29, 0.06, 0.62); head.add(ew);
      const pu = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), black); pu.position.set(s * 0.29, 0.06, 0.84); head.add(pu);
      const hl = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), white); hl.position.set(s * 0.29 + 0.04, 0.11, 0.95); head.add(hl);
      eyes.push(ew, pu, hl);
      const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.42, 8), brown); tuft.position.set(s * 0.52, 0.62, 0); tuft.rotation.z = -s * 0.45; head.add(tuft);
    }
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.26, 8), orange); beak.position.set(0, -0.14, 0.8); beak.rotation.x = Math.PI + 0.35; head.add(beak);
    const board = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.07, 1.0), capM); board.position.y = 0.78; board.rotation.y = Math.PI / 4; head.add(board);
    const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.22, 16), capM); capBase.position.y = 0.66; head.add(capBase);
    const tassel = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), M(0xffd23f)); tassel.position.set(0.42, 0.72, 0.1); head.add(tassel);
    const wings = [];
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group(); pivot.position.set(s * 0.82, 0.25, 0); g.add(pivot);
      const w = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), M(0x7d5232)); w.scale.set(0.35, 0.95, 0.6); w.position.y = -0.4; pivot.add(w);
      wings.push(pivot);
      const foot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), orange); foot.position.set(s * 0.32, -1.02, 0.32); foot.scale.set(1.2, 0.5, 1.4); g.add(foot);
    }
    return { g, head, eyes, wings };
  }
  const owl = makeOwl(); owl.g.scale.setScalar(0.78);
  const OWL_Y = 3.35; owl.g.position.set(0, OWL_Y, 0.2); world.add(owl.g);
  const thinkRing = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.05, 8, 64), new THREE.MeshBasicMaterial({ color: 0x7ff0ff, transparent: true, opacity: 0.85 }));
  thinkRing.position.copy(owl.g.position); thinkRing.visible = false; world.add(thinkRing);
  const thinkRing2 = thinkRing.clone(); thinkRing2.scale.setScalar(0.75); world.add(thinkRing2);

  // orbiting question marks
  function makeQ(color) {
    const g = new THREE.Group(); const m = M(color, { emissive: color, emissiveIntensity: 0.3 });
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.1, 10, 28, Math.PI * 1.5), m); arc.rotation.z = -Math.PI / 2; arc.position.y = 0.45; g.add(arc);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.3, 10), m); stem.position.y = 0; g.add(stem);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), m); dot.position.y = -0.38; g.add(dot);
    return g;
  }
  const qGroup = new THREE.Group(); world.add(qGroup);
  const qColors = [0xff6fa8, 0x3fa9f5, 0xffd23f, 0x8b6cff, 0xff9f1c, 0x2ec27e];
  const qs = qColors.map((c, i) => { const q = makeQ(c); const a = i / qColors.length * Math.PI * 2; q.userData.y = Math.sin(i * 1.7) * 1.2; q.position.set(Math.cos(a) * 4.7, q.userData.y, Math.sin(a) * 4.7); q.scale.setScalar(0.9); qGroup.add(q); return q; });

  // background stars
  const sg = new THREE.BufferGeometry(); const sp = [];
  for (let i = 0; i < 700; i++) { const r = 40 + Math.random() * 60, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 2 - 1); sp.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), -Math.abs(r * Math.sin(ph) * Math.sin(th)) - 10); }
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  const starPts = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.9 })); scene.add(starPts);

  // confetti pool
  const confMats = qColors.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
  const confGeo = new THREE.PlaneGeometry(0.16, 0.24);
  const conf = [];
  for (let i = 0; i < 160; i++) { const m = new THREE.Mesh(confGeo, confMats[i % confMats.length]); m.visible = false; world.add(m); conf.push({ m, v: new THREE.Vector3(), life: 0, spin: new THREE.Vector3() }); }

  let mood = 'idle', moodT = 0, jumpT = 0, talking = false, blinkT = 2, elapsed = 0;
  const clock = new THREE.Clock();

  function layout() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    const halfH = Math.tan(THREE.MathUtils.degToRad(22.5)) * camera.position.z, halfW = halfH * camera.aspect;
    if (w >= 900 && w / h >= 1.25) { world.position.set(halfW * 0.62, -0.9, 0); world.scale.setScalar(1); }
    else { world.position.set(halfW * 0.3, -halfH * 0.55, -3); world.scale.setScalar(0.85); }
  }
  addEventListener('resize', layout); layout();

  renderer.setAnimationLoop(() => {
    if (document.hidden) return;
    const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt; const t = elapsed;
    planet.rotation.y += dt * 0.12; ring.rotation.z += dt * 0.15;
    moon.position.set(Math.cos(t * 0.4) * 5.6, Math.sin(t * 0.4) * 1.5 + 0.5, Math.sin(t * 0.4) * 5.6);
    qGroup.rotation.y += dt * 0.28;
    qs.forEach((q, i) => { q.rotation.y += dt * 1.3; q.position.y = q.userData.y + Math.sin(t * 1.5 + i) * 0.25; });
    starPts.rotation.z += dt * 0.004;
    if (moodT > 0) { moodT -= dt; if (moodT <= 0) mood = 'idle'; }
    let y = OWL_Y + Math.sin(t * 2) * 0.06;
    if (jumpT > 0) { jumpT -= dt; y += Math.sin((1 - jumpT / 0.8) * Math.PI) * 1.1; }
    owl.g.position.y = y;
    let tilt = 0, yaw = Math.sin(t * 0.5) * 0.25, nod = 0;
    if (mood === 'thinking') { tilt = Math.sin(t * 2.5) * 0.28; yaw = Math.sin(t * 1.2) * 0.6; }
    if (mood === 'sad') tilt = 0.38;
    if (talking) nod = Math.sin(t * 13) * 0.07;
    owl.head.rotation.z += (tilt - owl.head.rotation.z) * 0.1;
    owl.head.rotation.y += (yaw - owl.head.rotation.y) * 0.06;
    owl.head.rotation.x = nod;
    const flap = (mood === 'happy' || jumpT > 0) ? Math.abs(Math.sin(t * 18)) * 0.9 : Math.sin(t * 2) * 0.05;
    owl.wings[0].rotation.z = -0.1 - flap; owl.wings[1].rotation.z = 0.1 + flap;
    blinkT -= dt; if (blinkT < 0) blinkT = 2.5 + Math.random() * 3;
    const bl = blinkT < 0.12 ? 0.1 : 1; owl.eyes.forEach(e => e.scale.y = bl);
    thinkRing.visible = thinkRing2.visible = mood === 'thinking';
    if (thinkRing.visible) {
      thinkRing.position.y = thinkRing2.position.y = y + 0.4;
      thinkRing.rotation.x = t * 2; thinkRing.rotation.y = t * 1.3; thinkRing2.rotation.x = -t * 2.4; thinkRing2.rotation.z = t;
      thinkRing.material.opacity = 0.5 + Math.sin(t * 6) * 0.35;
    }
    for (const c of conf) {
      if (c.life <= 0) continue;
      c.life -= dt; c.v.y -= 6 * dt; c.m.position.addScaledVector(c.v, dt);
      c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt;
      if (c.life <= 0) c.m.visible = false;
    }
    renderer.render(scene, camera);
  });

  const ray = new THREE.Raycaster(), pt = new THREE.Vector2();
  canvas.addEventListener('pointerdown', e => {
    pt.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(pt, camera);
    if (ray.intersectObject(owl.g, true).length) { api.hop(); const tips = TIPS[S.lang]; speak(tips[Math.floor(Math.random() * tips.length)]); }
  });

  const api = {
    setMood(m, dur = 0) { mood = m; moodT = dur; },
    hop() { jumpT = 0.8; },
    setTalking(b) { talking = b; },
    celebrate() {
      jumpT = 0.8; mood = 'happy'; moodT = 3;
      const o = owl.g.position;
      conf.forEach(c => { c.m.visible = true; c.life = 2.2 + Math.random(); c.m.position.set(o.x, o.y + 0.6, o.z); c.v.set((Math.random() - 0.5) * 7, 4 + Math.random() * 5, (Math.random() - 0.5) * 7); c.spin.set(Math.random() * 10, Math.random() * 10, 0); });
    }
  };
  scene3d = api;
}

/* ---------------- GAME ---------------- */
function newGame() {
  const items = shuffle([...GAME]).slice(0, 6).map(q => {
    const d = q[S.lang]; return { g: d.g, w: d.w, opts: shuffle(d.o.map((t, i) => ({ t, ok: i === q.a }))) };
  });
  state.game = { items, i: 0, score: 0, pick: -1, results: [], lang: S.lang };
}
function gameSayText(it) {
  const letters = 'ABC';

const TK = { reasoning: '', content: '', status: 'idle', t0: 0, t1: 0, finish: '', usage: null, err: '', model: '', pending: false, open: false };

const tail = (s, n) => s.length > n ? '…' + s.slice(-n) : s;
function drawTicker() {

  dot.className = 'dot ' + (TK.status === 'stream' ? 'stream' : TK.status === 'ok' ? 'ok' : TK.status === 'err' ? 'err' : '');
  tk.classList.toggle('stream', TK.status === 'stream');
  const secs = ((TK.status === 'stream' ? performance.now() : TK.t1) - TK.t0) / 1000;
  const chars = TK.reasoning.length + TK.content.length;
  if (TK.status === 'stream') {
    track.classList.remove('idle');
    const writing = TK.content.length > 0;
    txt.className = 'tk-text ' + (writing ? 'c' : 'r');
    const body = (writing ? '✍️ ' + tail(TK.content, 260) : '💭 ' + tail(TK.reasoning || L('連接緊……', 'Connecting…'), 260)).replace(/\s*\n\s*/g, ' ⏎ ');
    txt.innerHTML = esc(body) + '<span class="cur">▌</span>';
    stats.innerHTML = `💭${TK.reasoning.length} ✍️${TK.content.length}<br>${secs.toFixed(1)}s · ${secs > 0 ? Math.round(chars / secs) : 0}${L('字/秒', ' ch/s')}`;
  } else {

    let msg;
    if (TK.status === 'ok') msg = L(`✅ AI 已連線 · ${TK.model} · 上次：思考 ${TK.reasoning.length} 字，輸出 ${TK.content.length} 字，${secs.toFixed(1)} 秒${TK.usage?.completion_tokens ? ` · ${TK.usage.completion_tokens} tokens` : ''} · finish=${TK.finish || '-'} · 撳呢度睇完整直播`, `✅ AI connected · ${TK.model} · last run: ${TK.reasoning.length} thinking chars, ${TK.content.length} output chars, ${secs.toFixed(1)}s${TK.usage?.completion_tokens ? ` · ${TK.usage.completion_tokens} tokens` : ''} · finish=${TK.finish || '-'} · tap to see the full stream`);
    else if (TK.status === 'err') msg = L('❌ AI 連線出錯：', '❌ AI error: ') + TK.err;
    else msg = (S.apiKey ? L(`🤖 AI 準備好 · ${S.model} · 撳 ⚙️ 設定可以測試連線`, `🤖 AI ready · ${S.model} · test the connection in ⚙️ Settings`) : L('🤖 未設定 AI · 撳 ⚙️ 設定填 Base URL、Model、API Key', '🤖 AI not set up · open ⚙️ Settings to add Base URL, Model and API Key'));

}

function splitThink(raw) {
  const m = raw.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if (!m) return { r: '', c: raw };
  return { r: m[1], c: m[2] ? raw.slice(m[0].length) : '' };
}
let currentAbort = null;
async function callAI(messages, ov = {}) {
  let url = S.baseUrl.trim().replace(/\/+$/, '');
  if (!/\/chat\/completions$/.test(url)) url += '/chat/completions';
  const body = { model: S.model.trim(), messages, stream: true, max_tokens: ov.maxTokens ?? S.maxTokens, temperature: S.temperature };
  const th = ov.thinking ?? S.thinking; if (th === 'enabled' || th === 'disabled') body.thinking = { type: th };
  const ef = ov.effort ?? S.effort; if (ef && ef !== 'auto') body.reasoning_effort = ef;
  const ctrl = new AbortController(); currentAbort = ctrl;
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.apiKey.trim() }, body: JSON.stringify(body), signal: ctrl.signal });
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`HTTP ${res.status} ${t.slice(0, 500)}`); }
  let rField = '', raw = '', finish = '', usage = null;
  const ct = res.headers.get('content-type') || '';
  const emit = () => { const sp = splitThink(raw); TK.reasoning = rField + sp.r; TK.content = sp.c; tkUpdate(); };
  if (ct.includes('application/json')) { // server ignored stream
    const j = await res.json(); const m = j.choices?.[0]?.message || {};
    rField = m.reasoning_content || m.reasoning || ''; raw = m.content || ''; finish = j.choices?.[0]?.finish_reason || ''; usage = j.usage || null; emit();
  } else {
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;

function systemPrompt(age) {
  if (S.lang === 'en') return `You are "Dr Hoot" 🦉, a patient and encouraging owl teacher who trains children aged ${age} to ask good questions.

MOST IMPORTANT RULES
1. Never answer the content of the child's question (e.g. if they ask "Why is the sky blue?", do NOT explain why). Only evaluate how good the question is, then use Socratic questioning to help them clarify what they really want to know or do.
2. Language: if the child writes in English, reply in British English (colour, favourite, practise, realise, maths). If the child writes in Chinese, reply in Hong Kong Cantonese written in Traditional Chinese (係、唔係、嘅、咗、啲、點解). Short sentences, simple words suitable for age ${age}. Warm and positive — praise first, then teach.
3. Scores (1–5 each): clarity (easy to understand, no vague words); goal (links to and helps the challenge goal); specific (says what, where, when, what to compare); explore (can be answered by observing, experimenting, measuring or researching); curious (depth, sparks more thinking — open questions usually score higher). Overall score 0–100; stars 1–5 (90+ = 5, 75–89 = 4, 60–74 = 3, 40–59 = 2, below 40 = 1).
4. socratic: 2–3 short Socratic questions that clarify goal, meaning and method, e.g. "What do you mean by 'good'?", "Do you want to know why, or how?", "How could you test it?", "What would you compare?"
5. goalOptions: 3 possible real goals starting with "A. ", "B. ", "C. " for the child to choose from.
6. hint: one small hint on how to improve — do NOT write the full improved question.
7. If there were earlier rounds, progress must say specifically what improved (or got worse) since last time; otherwise use an empty string.
8. insights: 1–2 key learning points about HOW to ask good questions (not the answer to the question), worth saving in a notebook.
9. speech: a 40–90 word spoken script to be read aloud to the child: the score, one thing done well, one thing to improve, and one Socratic question. No emoji or symbols.
10. If the content is unsuitable or unsafe for children, gently steer towards a safe, worthwhile line of enquiry without scolding. If it is not a question, set type to "notQuestion" and show how to turn it into one.
11. Keep your reasoning brief and quick, then output.

OUTPUT: output ONLY one JSON object — no markdown, no code fences, no other text:
{"score":72,"stars":3,"scores":{"clarity":4,"goal":3,"specific":3,"explore":4,"curious":4},"type":"open","verdict":"one short verdict","praise":["..."],"improve":["...","..."],"socratic":["...","..."],"goalOptions":["A. ...","B. ...","C. ..."],"hint":"...","progress":"","insights":["..."],"speech":"..."}
type must be one of "open", "closed", "unclear", "notQuestion".`;
  return `你係「問問博士」🦉，一位好有耐性、好識鼓勵人嘅貓頭鷹老師，專門訓練 ${age} 歲嘅小朋友「問好問題」。

1. 絕對唔好直接回答小朋友問題嘅內容或者知識答案（例如佢問「點解天空係藍色」，你唔可以解釋原因）。你只係評價「呢條問題問得好唔好」，再用蘇格拉底提問法反問佢，幫佢澄清自己真正想知乜、想做乜。
2. 語言：如果小朋友用中文，就用香港廣東話口語（繁體字，例如：係、唔係、嘅、咗、啲、佢哋、點解、點樣）；如果小朋友用英文，就用英式英文（British English，例如 colour、favourite、practise）。句子要短、用字要淺，適合 ${age} 歲。語氣溫暖、正面，先讚後教。
3. 評分（每項 1-5 分）：clarity 清晰（一聽就明、冇含糊字眼）；goal 貼合目標（同挑戰目標有關、幫到佢達成目標）；specific 具體（講清楚對象、情況、要比較乜）；explore 可探究（可以透過觀察、實驗、量度或者搵資料搵答案）；curious 好奇心（有深度、會引發更多思考，開放式問題通常較高）。總分 score 0-100；stars 1-5（90 以上=5、75-89=4、60-74=3、40-59=2、40 以下=1）。
4. socratic：2-3 條短嘅蘇格拉底式反問，幫佢澄清目標、定義同方法。例如「你講嘅『好』係指咩呢？」「你係想知原因，定係想知方法？」「你可以點樣試吓搵答案？」「你會比較啲乜？」

8. insights：1-2 個關於「點樣問好問題」嘅學習重點（唔係問題嘅答案），值得記落問題簿。
9. speech：一段 50-110 字嘅廣東話口語講稿，用嚟讀俾小朋友聽：講分數、讚一樣嘢、教一樣嘢、再問一條反問。唔好用 emoji 同符號。
10. 如果內容唔適合小朋友或者唔安全，溫柔咁引導佢轉去一個安全、有益嘅探究方向，唔好責罵。如果佢寫嘅唔係問題，type 用 "notQuestion"，教佢點樣變成一條問題。
11. 思考要精簡快捷，唔好諗太耐，然後直接輸出。

【輸出格式】只可以輸出一個 JSON 物件，唔好有 markdown、唔好有 \`\`\`、唔好有其他文字：
{"score":72,"stars":3,"scores":{"clarity":4,"goal":3,"specific":3,"explore":4,"curious":4},"type":"open","verdict":"一句短評","praise":["……"],"improve":["……","……"],"socratic":["……","……"],"goalOptions":["A. ……","B. ……","C. ……"],"hint":"……","progress":"","insights":["……"],"speech":"……"}
type 只可以係 "open"、"closed"、"unclear" 或 "notQuestion"。`;
}

function matchBrace(s, i) {

    if (c === '"') inS = true; else if (c === '{') d++; else if (c === '}') { d--; if (d === 0) return j; }

}

  for (let i = 0; i < text.length; i++) {
    if (text[i] !== '{') continue;

    const s = text.slice(i, end + 1);
    let o = null; try { o = JSON.parse(s); } catch { try { o = JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); } catch { } }

}

  const scores = {}; DIMS.forEach(d => scores[d] = clamp(o.scores?.[d], 1, 5, 3));
  const stars = clamp(o.stars, 1, 5, score >= 90 ? 5 : score >= 75 ? 4 : score >= 60 ? 3 : score >= 40 ? 2 : 1);

let lastAsk = null;
async function ask(retry = false) {
  const ses = curSession(); if (!ses || state.busy) return;
  let q, clarify, goal;
  if (retry && lastAsk) ({ q, clarify, goal } = lastAsk);
  else {
    captureDrafts();
    q = (state.draftQ || '').trim(); clarify = (state.draftC || '').trim(); goal = state.chosenGoal || '';
    if (!q) { toast(L('請先寫低你嘅問題 ✏️', 'Please write your question first ✏️')); speak(L('請先寫低你嘅問題', 'Please write your question first')); return; }
  }
  if (!S.apiKey || !S.baseUrl || !S.model) { toast(L('請先喺 ⚙️ 設定填好 AI 資料', 'Please set up the AI in ⚙️ Settings first')); openSettings(); return; }
  lastAsk = { q, clarify, goal };
  stopSpeak(); state.busy = true; state.error = null; render(); scene3d?.setMood('thinking');
  $('#liveBox')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const msgs = buildMessages(ses, q, clarify, goal);
  let r, res = null;
  try {
    r = await runAI(msgs);
    res = extractResult(r.content);
    if (!res && S.autoRescue && !r.aborted) {
      const why = r.finish === 'length' ? L('AI 諗得太多，用晒 token 上限！自動用「低推理強度」再試一次……', 'The AI thought too much and hit the token limit! Retrying with low reasoning effort…') : L('AI 回覆格式唔啱，自動再試一次……', 'The reply was not in the right format — retrying…');
      toast('🛟 ' + why, 4000);
      const ov = { effort: S.effort === 'auto' ? undefined : 'low' };
      if (S.thinking !== 'auto') ov.thinking = 'disabled';
      const msgs2 = msgs.concat([{ role: 'user', content: L('唔好諗太耐，即刻只輸出 JSON。', 'Do not think for long — output only the JSON now.') }]);
      const r2 = await runAI(msgs2, ov);
      res = extractResult(r2.content);
      r2.reasoning = (r.reasoning ? r.reasoning + '\n\n—— rescue ——\n\n' : '') + r2.reasoning; r = r2;
    }
    if (!res) throw new Error(r.finish === 'length'
      ? L('AI 用晒 token 上限都未寫完。請喺 ⚙️ 設定提高「最大輸出 tokens」或者揀較低嘅推理強度。', 'The AI hit its token limit before finishing. Raise "max output tokens" or lower the reasoning effort in ⚙️ Settings.')
      : L('AI 嘅回覆格式唔啱（冇 JSON）。撳下面 📡 走馬燈可以睇佢寫咗乜。', 'The AI reply was not valid JSON. Tap the 📡 ticker below to see what it wrote.'));
  } catch (e) {
    state.busy = false; state.error = e.message; scene3d?.setMood('sad', 2.5); render();
    if (!e.aborted) speak(L('哎呀，連線有啲問題，請大人幫手睇吓設定。', 'Oops, there is a connection problem. Please ask a grown-up to check the settings.'));
    return;
  }
  const prev = ses.turns[ses.turns.length - 1];
  const turn = { q, clarify, goal, res, reasoning: S.saveReasoning ? r.reasoning.slice(0, 20000) : '', usage: r.usage, finish: r.finish, model: S.model, elapsed: Math.round(r.elapsed || 0), ts: Date.now() };
  ses.turns.push(turn); ses.best = Math.max(ses.best || 0, res.score); ses.updated = Date.now();
  saveSessions(); cloudSaveSession(ses);
  state.busy = false; state.chosenGoal = ''; state.draftQ = null; state.draftC = '';
  let bonus = 0; if (prev?.res && res.score - prev.res.score >= 10) bonus = 2;
  render();
  addStars(res.stars + bonus);
  if (bonus) toast(L(`📈 進步咗 ${res.score - prev.res.score} 分！額外 +2⭐`, `📈 Up ${res.score - prev.res.score} points! Bonus +2⭐`), 3000);
  if (res.score >= 80) scene3d?.celebrate(); else if (res.score >= 60) { scene3d?.hop(); scene3d?.setMood('happy', 2); } else scene3d?.setMood('sad', 2.5);
  const results = $$('.result'); results[results.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (S.autoSpeak) speak(res.speech || res.verdict);
}

function mergeSessions(incoming) {
  let added = 0, updated = 0;
  for (const s of incoming) {
    if (!s?.id || !s.scenario || !Array.isArray(s.turns)) continue;
    const i = sessions.findIndex(x => x.id === s.id);
    if (i < 0) { sessions.push(s); added++; }
    else if ((s.updated || 0) > (sessions[i].updated || 0)) { sessions[i] = s; updated++; }
  }
  saveSessions(); return { added, updated };
}

const FB = { app: null, auth: null, db: null, user: null, m: null, loading: false };
function parseFbConfig(txt) {
  if (!txt || !txt.trim()) return null;
  try { const j = JSON.parse(txt); if (j.apiKey) return j; } catch { }
  const o = {}; txt.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (_, k, v) => { o[k] = v; });
  return o.apiKey ? o : null;
}
async function fbInit(silent = false) {
  if (FB.app) return true;
  const cfg = parseFbConfig(S.firebaseConfig);
  if (!cfg?.apiKey || !cfg?.projectId) { if (!silent) toast(L('請先喺 ⚙️ 設定貼上 Firebase config', 'Paste your Firebase config in ⚙️ Settings first')); return false; }
  if (FB.loading) return false; FB.loading = true;
  try {
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [a, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    FB.m = { ...a, ...au, ...fs };
    FB.app = a.initializeApp(cfg, 'qp-' + Date.now()); FB.auth = au.getAuth(FB.app); FB.db = fs.getFirestore(FB.app);

}

    render(); scene3d?.celebrate(); addStars(1);
    const sc = ses.turns.map(t => t.res?.score || 0);
    speak(L(`好叻呀！你一共問咗${sc.length}輪，由${sc[0]}分進步到最高${Math.max(...sc)}分。記住，好問題係練出嚟㗎！`, `Brilliant! You asked ${sc.length} round(s) and went from ${sc[0]} to a best of ${Math.max(...sc)} points. Remember, great questions come from practice!`));
    scrollTo({ top: 0, behavior: 'smooth' });
  },
  reopenSes: () => { const ses = curSession(); if (ses) { ses.done = false; saveSessions(); render(); } },
  viewSes: el => { state.viewId = el.dataset.id; go('book'); },
  bookBack: () => { state.viewId = null; render(); },
  contSes: el => { const ses = sessions.find(s => s.id === el.dataset.id); if (!ses) return; ses.done = false; Object.assign(state, { cur: ses.id, chosenGoal: '', draftQ: null, draftC: '', viewId: null }); go('lab'); },
  delSes: async el => {
    if (!confirm(L('確定刪除呢個挑戰？', 'Delete this challenge?'))) return;
    const id = el.dataset.id; sessions = sessions.filter(s => s.id !== id); saveSessions();
    if (state.cur === id) state.cur = null;
    if (FB.user) FB.m.deleteDoc(FB.m.doc(FB.db, 'users', FB.user.uid, 'sessions', id)).catch(() => { });
    render();
  },
  expJSON: () => exportJSON(),
  expMD: () => download(`question-planet-${stamp()}.md`, allMD(sessions), 'text/markdown'),
  expOneMD: el => { const s = sessions.find(x => x.id === el.dataset.id); if (s) download(`question-${s.scenario.id}-${stamp()}.md`, allMD([s]), 'text/markdown'); },
  impJSON: () => $('#fileIn').click(),
  wipe: () => { if (!confirm(L('真係要清除呢部機所有紀錄同星星？（雲端唔受影響）', 'Really delete all local records and stars? (The cloud is not affected)'))) return; sessions = []; stars = 0; readLessons = []; saveSessions(); LS.set('qp_stars', 0); LS.set('qp_read', []); state.cur = null; updateHeader(); toast(L('已清除', 'Cleared')); },
  fbIn: () => fbSignIn(), fbOut: () => fbSignOut(), cloudUp: () => cloudUpload(), cloudDown: () => cloudDownload(),
  testAI: () => testAI(),
  clearKey: () => { S.apiKey = ''; saveS(); renderSettings(); tkUpdate(); toast(L('已清除 API Key', 'API Key cleared')); },
  toggleKey: () => { const k = $('#keyIn'); k.type = k.type === 'password' ? 'text' : 'password'; },
  setTok: el => { S.maxTokens = Number(el.dataset.v); saveS(); renderSettings(); },
  testVoice: el => speak(el.dataset.v === 'zh' ? '你好呀！我係問問博士。一齊學識問好問題啦！' : "Hello! I'm Dr Hoot. Let's learn to ask brilliant questions!", el),
  tkToggle: () => { TK.open = !TK.open; $('#tkPanel').classList.toggle('open', TK.open); $('#tkArrow').textContent = TK.open ? '▼' : '▲'; drawTicker(); },
  copyStream: () => { navigator.clipboard?.writeText(`# reasoning\n${TK.reasoning}\n\n# content\n${TK.content}`).then(() => toast(L('已複製', 'Copied'))); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.dataset.act !== 'tkToggle' && el.closest('#ticker') && el !== $('#ticker')) return;
  e.stopPropagation(); f(el, e);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') ACT.closeModal(); });
addEventListener('beforeunload', () => captureDrafts());

/* ---------------- boot ---------------- */
render(); drawTicker(); init3D();
if (parseFbConfig(S.firebaseConfig)) fbInit(true);
</script>
</body>
</html>
