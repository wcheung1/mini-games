<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9dcff">
<meta name="description" content="馬路安全大使：俾 6 至 12 歲小朋友玩嘅 3D 香港過馬路安全訓練遊戲，有廣東話語音。">
<title>馬路安全大使：3D 過馬路大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b4f; --ink2:#44527a; --paper:#fff8ec; --paper2:#ffefd2; --line:#f0dcb8;
  --yellow:#ffc93c; --yellow-d:#e0a400; --red:#e2342d; --red-soft:#ffe1df; --green:#21a366; --green-d:#16804f; --green-soft:#dcf5e8;
  --blue:#2f7de1; --blue-soft:#dcebff; --orange:#ff8a1f; --sky:#9fd8ff;
  --shadow:0 6px 18px rgba(29,43,79,.18);
  --font:"Huninn","Yuanti TC","PingFang HK","Noto Sans HK","Microsoft JhengHei UI","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .6s}
#c.gray{filter:grayscale(1) brightness(.75)}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button,#ui input,#ui a,#ui .sheet,#ui .scroll{pointer-events:auto}

/* ---------- 共用按鈕 ---------- */
.btn{position:relative;border:0;border-radius:16px;padding:12px 18px;font-size:18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,43,79,.22);transition:transform .08s,box-shadow .08s,background .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,43,79,.22)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.warm{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}
.btn.soft{background:var(--paper2)}
.btn.big{font-size:22px;padding:16px 26px;border-radius:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.has-spk{padding-right:44px}
/* 喇叭：內嵌喺右上角，預留位，唔會蓋住字 */
.spk{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:rgba(255,201,60,.95);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.15);cursor:pointer}
.spk svg{width:16px;height:16px}
.spk.playing{background:var(--orange);color:#fff;animation:pulse .8s infinite}
.btn.go .spk,.btn.warm .spk{background:rgba(255,255,255,.92)}
@keyframes pulse{50%{transform:scale(1.12)}}
.attn{animation:attn 1.1s ease-in-out infinite}
@keyframes attn{0%,100%{box-shadow:0 4px 0 var(--green-d),0 0 0 0 rgba(33,163,102,.55)}50%{box-shadow:0 4px 0 var(--green-d),0 0 0 10px rgba(33,163,102,0)}}

/* ---------- 頂部 HUD ---------- */
.top{position:absolute;z-index:3;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));display:flex;gap:8px;align-items:flex-start}
.pill{position:relative;flex:1;min-width:0;max-width:520px;background:rgba(255,248,236,.95);border-radius:18px;padding:10px 44px 10px 14px;box-shadow:var(--shadow)}
.pill .t{font-size:17px;font-weight:700;line-height:1.25}
.pill .k{font-size:15px;line-height:1.35;color:var(--ink2);margin-top:2px}
.pill .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.chip{font-size:13.5px;border-radius:999px;padding:3px 10px;background:#efe3cc;color:var(--ink2);white-space:nowrap;font-weight:700}
.chip.ok{background:var(--green);color:#fff}
.chip.ok::before{content:"✓ "}
.chip.clock{background:var(--ink);color:#fff}
.chip.clock.low{background:var(--red)}
.chip.stars{background:#fff3c4;color:#8a5a00}
.tbtns{display:flex;gap:8px;flex:none}
.tbtn{border:0;border-radius:14px;min-width:54px;height:48px;padding:0 12px;font-size:15px;font-weight:700;background:#fff;box-shadow:0 3px 0 rgba(29,43,79,.22);display:flex;align-items:center;gap:6px}
.tbtn.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1d5bb0}
.tbtn svg{width:20px;height:20px}
@media (max-width:640px){
  .top{flex-direction:column}
  .tbtns{position:absolute;top:0;right:0}
  .pill{max-width:none;width:calc(100% - 0px);margin-top:56px}
  .pill.nospace{margin-top:56px}
}

/* ---------- 回饋 toast ---------- */
#toasts{position:absolute;z-index:5;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
.toast{font-size:clamp(17px,3.6vw,23px);font-weight:700;padding:8px 18px;border-radius:999px;color:#fff;box-shadow:var(--shadow);animation:toast 2.2s forwards;text-align:center}
.toast.good{background:var(--green)}
.toast.bad{background:var(--red)}
.toast.info{background:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- 控制掣 ---------- */
.ctrl{position:absolute;bottom:calc(12px + var(--safe-b));display:grid;gap:8px}
.ctrl>button{border:0;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 4px 0 rgba(29,43,79,.25);font-weight:700;color:var(--ink);position:relative}
.ctrl>button:active,.ctrl>button.held{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,43,79,.25);background:#e8f0ff}
#pad{left:calc(12px + var(--safe-l));grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px)}
#pad>button{font-size:26px;width:58px;height:58px}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#looks{right:calc(12px + var(--safe-r));grid-template-columns:repeat(2,74px)}
#looks>button{height:58px;font-size:16px;line-height:1.1;padding:12px 4px 4px}
#looks>button .spk{top:3px;right:3px;width:20px;height:20px}#looks>button .spk svg{width:12px;height:12px}
#looks>button.on{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1d5bb0}
#looks>button.hint{outline:4px solid var(--yellow);outline-offset:2px;animation:pulse 1s infinite}
#looks .key,#pad .key{position:absolute;bottom:3px;right:6px;font-size:10px;opacity:.55;font-weight:700}
@media (hover:none){#looks .key,#pad .key{display:none}}
body.modal .ctrl, body.modal #toasts{display:none}
body.nogame .ctrl, body.nogame .pill{display:none}

/* ---------- 彈出卡 ---------- */
#veil{position:absolute;inset:0;z-index:2;background:rgba(29,43,79,.35);opacity:0;pointer-events:none;transition:opacity .25s}
body.modal #veil{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:4;left:50%;top:calc(50% + 32px);transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100% - 80px - var(--safe-t) - var(--safe-b));display:none;flex-direction:column;background:var(--paper);border-radius:26px;box-shadow:0 20px 50px rgba(29,43,79,.35);overflow:hidden}
.sheet.show{display:flex;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.sheet .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 22px 8px}
.sheet .foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:12px 22px 18px;border-top:2px dashed var(--line);background:var(--paper)}
.sheet .foot .grow{flex:1}
.sheet h1{font-size:clamp(30px,7vw,44px);margin:0;line-height:1.15}
.sheet h2{font-size:26px;margin:0 0 6px;line-height:1.25}
.sheet h3{font-size:19px;margin:16px 0 6px}
.sheet p{font-size:17px;line-height:1.6;margin:8px 0}
.lead{font-size:19px!important;font-weight:700;color:var(--ink)}
.say{position:relative;padding-right:40px}
.say>.spk{top:2px;right:0}
.muted{color:var(--ink2);font-size:15px!important}
.kicker{display:inline-block;font-size:14px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.tips{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.tips li{position:relative;display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px 44px 12px 12px;font-size:17px;line-height:1.5}
.tips li .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--paper2)}
.tips li .spk{top:8px;right:8px}
.case{position:relative;background:#fff;border-left:6px solid var(--red);border-radius:14px;padding:12px 44px 12px 14px;margin:12px 0}
.case.adapt{border-left-color:var(--orange)}
.case .tag{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:1px 8px;background:var(--red-soft);color:#a02018;margin-bottom:4px}
.case.adapt .tag{background:#ffe9d1;color:#9a4a00}
.case p{font-size:16px!important;margin:4px 0!important}
.case a{color:var(--blue);font-size:14px;word-break:break-all}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0;color:#f5b301;text-shadow:0 2px 0 #c98a00}
.stars .off{color:#c9c2b5;text-shadow:none}
.stars .off{opacity:.2}
.list{display:grid;gap:10px;margin-top:12px}
.lvl{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:18px;background:#fff;padding:12px 48px 12px 12px;box-shadow:0 3px 0 rgba(29,43,79,.15)}
.lvl .no{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--yellow)}
.lvl .nm{font-size:18px;font-weight:700;line-height:1.3}
.lvl .ds{font-size:14.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.lvl .st{font-size:14px;font-weight:700;margin-top:4px}
.lvl.done .no{background:var(--green);color:#fff}
.lvl.locked{opacity:.55}
.lvl.locked .no{background:#ddd}
.lvl.next{outline:3px solid var(--green);outline-offset:2px}
.pick{display:flex;gap:10px;margin:14px 0}
.pick>button{flex:1;border:3px solid transparent;border-radius:18px;background:#fff;padding:12px 40px 12px 12px;font-size:19px;font-weight:700;position:relative;text-align:left;box-shadow:0 3px 0 rgba(29,43,79,.15)}
.pick>button small{display:block;font-size:14px;font-weight:400;color:var(--ink2)}
.pick>button.on{border-color:var(--blue);background:var(--blue-soft)}
.pick>button.on small::after{content:"  ✓ 已揀";color:var(--blue);font-weight:700}
.why{background:var(--red-soft);border-radius:14px;padding:10px 14px;margin:10px 0}
.good{background:var(--green-soft);border-radius:14px;padding:10px 14px;margin:10px 0}
.good li,.why li{font-size:16px;line-height:1.55;margin:3px 0}
.good ul,.why ul{margin:4px 0;padding-left:22px}
.conseq{background:#2b2f3a;color:#f4f4f6}
.conseq h2,.conseq p{color:#f4f4f6}
.conseq .muted{color:#c9cbd4}
.conseq .foot{background:#2b2f3a;border-top-color:#444a5a}
.conseq svg{display:block;margin:4px auto 8px;max-width:100%}
.hero{text-align:center}
.hero .badge{display:inline-block;background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:15px}
.hero h1{margin:10px 0 4px}
.hero .hook{font-size:21px!important;font-weight:700;line-height:1.5}
.read-sec{position:relative;background:#fff;border-radius:16px;padding:12px 44px 12px 14px;margin:10px 0}
.read-sec h3{margin:0 0 4px}
.read-sec p,.read-sec li{font-size:16px;line-height:1.6}
.read-sec ol,.read-sec ul{margin:4px 0;padding-left:22px}
.read-sec a{color:var(--blue);font-size:14px;word-break:break-all}
.cert-wrap{text-align:center}
.cert-wrap canvas{width:100%;height:auto;border-radius:12px;box-shadow:var(--shadow);background:#fff}
.namebox{display:flex;gap:8px;margin:12px 0;align-items:center}
.namebox input{flex:1;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;-webkit-user-select:text;user-select:text}
#voiceNote{position:absolute;z-index:6;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:6px 12px;font-size:13px;line-height:1.5;max-width:min(92vw,560px);display:none;text-align:center;pointer-events:auto}
#voiceNote.show{display:block}
#tapHint{position:absolute;z-index:6;left:50%;top:calc(66px + var(--safe-t));transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;border-radius:999px;padding:8px 16px;font-size:16px;box-shadow:var(--shadow);display:none}
#tapHint.show{display:block;animation:pulse 1.2s infinite}
#keys{position:absolute;padding-right:44px!important;top:calc(64px + var(--safe-t));right:calc(8px + var(--safe-r));background:var(--paper);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);font-size:15px;line-height:1.8;display:none;pointer-events:auto}
#keys.show{display:block}
#keys b{display:inline-block;min-width:34px;text-align:center;background:#fff;border-radius:6px;padding:0 6px;margin-right:6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);z-index:9;font-size:22px;font-weight:700;color:var(--ink)}
@media print{body *{visibility:hidden}#printCert,#printCert *{visibility:visible}#printCert{position:fixed;inset:0;display:block!important}#printCert img{width:100%}}
#printCert{display:none}

</style>
</head>
<body>
<div id="loading">載入緊街道…</div>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top">
    <div class="pill" id="pill">
      <div class="t" id="pillTitle">馬路安全大使</div>
      <div class="k" id="pillKey">幾趕都好，安全行先。</div>
      <div class="row" id="pillRow"></div>
      <button class="spk" id="pillSpk" aria-label="讀出重點"></button>
    </div>
    <div class="tbtns">
      <button class="tbtn on" id="btnVoice" aria-pressed="true" aria-label="語音開關"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3z"/><path id="voiceWave" fill="none" stroke="currentColor" stroke-width="2" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg><span id="voiceLbl">語音開</span></button>
      <button class="tbtn" id="btnKeys" aria-pressed="false">按鍵</button>
      <button class="tbtn" id="btnMenu" aria-label="暫停同目錄">☰ 目錄</button>
    </div>
  </div>
  <div id="keys">
    <div><b>↑↓←→</b>或者 <b>WASD</b>行路</div>
    <div><b>E</b>望右　<b>Q</b>望左</div>
    <div><b>R</b>返正面　<b>F</b>伸頭</div>
    <div><b>Esc</b>暫停／目錄</div>
    <div>用滑鼠或者手指拖畫面，都可以轉頭望。</div>
  </div>
  <div id="toasts"></div>
  <div class="ctrl" id="pad">
    <button class="u" data-dir="up" aria-label="向前行">↑<span class="key">W</span></button>
    <button class="l" data-dir="left" aria-label="向左行">←<span class="key">A</span></button>
    <button class="d" data-dir="down" aria-label="向後行">↓<span class="key">S</span></button>
    <button class="r" data-dir="right" aria-label="向右行">→<span class="key">D</span></button>
  </div>
  <div class="ctrl" id="looks">
    <button id="lkL" data-look="left">望左<span class="key">Q</span></button>
    <button id="lkR" data-look="right">望右<span class="key">E</span></button>
    <button id="lkF" data-look="front">返正面<span class="key">R</span></button>
    <button id="lkP" data-look="peek">伸頭<span class="key">F</span></button>
  </div>
  <div id="veil"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="scroll" id="sheetBody"></div>
    <div class="foot" id="sheetFoot"></div>
  </div>
  <div id="voiceNote"></div>
  <div id="tapHint">撳一下畫面，開始聽廣東話講解 🔊</div>
</div>
<div id="printCert"><img id="printImg" alt="證書"></div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   小工具
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const now = () => performance.now() / 1000;
const isTouch = matchMedia('(hover: none)').matches;
const SPK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3z"/><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M15.5 9a4.5 4.5 0 0 1 0 6"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 私隱模式之類，照玩 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* =====================================================================
   進度儲存（localStorage）
   ===================================================================== */
const SAVE_KEY = 'hkRoadAmbassador.v1';
const SAVE_DEFAULT = { gender: 'girl', voice: true, stars: {}, name: '', certDate: '' };
const save = Object.assign({}, SAVE_DEFAULT, LS.get(SAVE_KEY) || {});
save.stars = save.stars || {};
function persist() { LS.set(SAVE_KEY, save); }

/* =====================================================================
   音效（WebAudio 合成，唔使外部檔案）
   ===================================================================== */
const Sfx = {
  ctx: null, master: null, rumble: null, rumbleGain: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  _env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  tone(freq, dur, { type = 'sine', vol = 0.2, when = 0, to = null, attack = 0.01 } = {}) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    this._env(g, t, attack, vol, dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + attack + dur + 0.05);
  },
  _noiseBuf() {
    if (this._nb) return this._nb;
    const c = this.ctx, b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    return (this._nb = b);
  },

const Voice = {

  voice: null,

  pending: null,
  activeBtn: null,
  token: 0,
  supported: 'speechSynthesis' in window,
  init() {
    if (!this.supported) return;
    const choose = () => {
      const vs = speechSynthesis.getVoices();
      const v = vs.find((v) => /zh[-_]HK/i.test(v.lang)) || vs.find((v) => /yue|cantonese|粵|廣東/i.test(v.name + ' ' + v.lang));

  clean(t) {

  speak(text, btn = null) {
    if (!this.supported) { showVoiceNote(); return; }

        u.rate = 1.0; u.pitch = 1.05; u.volume = 1;
        if (i === list.length - 1) u.onend = u.onerror = () => { if (my === this.token) this._clearBtn(); };
        speechSynthesis.speak(u);

    }, 60);

  },
  _clearBtn() { if (this.activeBtn) this.activeBtn.classList.remove('playing'); this.activeBtn = null; },
  stop() { if (!this.supported) return; this.token++; speechSynthesis.cancel(); this._clearBtn(); },
  /* 自動讀：開咗自動播放先讀；未解鎖（iPad 未撳過）就等撳完先讀 */
  auto(text) {
    if (!this.on) return;

    this.speak(text);
  },
  unlock() {
    if (this.unlocked) return;
    this.unlocked = true;
    $('#tapHint').classList.remove('show');
    if (this.supported) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    Sfx.ensure();
    if (this.pending && this.on) { const p = this.pending; this.pending = null; setTimeout(() => this.speak(p), 120); }
  },
  setOn(v) {
    this.on = v; save.voice = v; persist();
    const b = $('#btnVoice'); b.classList.toggle('on', v); b.setAttribute('aria-pressed', String(v));
    $('#voiceLbl').textContent = v ? '語音開' : '語音關';
    $('#voiceWave').style.display = v ? '' : 'none';

  },
};
let voiceNoteShown = false;
function showVoiceNote() {
  if (voiceNoteShown) return; voiceNoteShown = true;
  const n = $('#voiceNote');
  const more = 'iPhone／iPad：設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文（香港）。<br>Android：設定 → 文字轉語音 → 揀「粵語（香港）」。';
  n.innerHTML = Voice.supported ? '你部機未有廣東話語音 <u>點樣加？</u>' : '呢個瀏覽器唔支援語音，請用 Chrome／Safari 開。';

/* =====================================================================

/* 每格更新姿勢：walk 0-1、yaw 頭轉角（+ = 望左）、lean 伸頭、fall 跌低 0-1、wave 揮手 */
function poseKid(kid, dt, s) {
  const u = kid.userData;
  u.walk = lerp(u.walk, s.walking ? 1 : 0, 1 - Math.exp(-dt * 10));
  if (s.walking) u.phase += dt * 9;
  const sw = Math.sin(u.phase) * 0.6 * u.walk;
  u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
  u.arms[0].rotation.x = -sw * 0.9; u.arms[1].rotation.x = sw * 0.9;
  u.hips.position.y = 0.52 + Math.abs(Math.cos(u.phase)) * 0.025 * u.walk;
  u.yaw = lerp(u.yaw, s.yaw || 0, 1 - Math.exp(-dt * 8));

  u.fall = lerp(u.fall, s.fall ? 1 : 0, 1 - Math.exp(-dt * (s.fall ? 7 : 12)));
  u.body.rotation.z = u.fall * 1.45; u.body.position.y = u.fall * 0.16; u.body.position.x = -u.fall * 0.35;

}

/* 共用：兩線雙程路 */
const H2 = 3.2;
const laneNear = (o = {}) => Object.assign({ id: 'n', pts: [[75, 1.6], [-75, 1.6]], spawn: { gap: [3.5, 7], types: ['car', 'car', 'taxi', 'minibus', 'van'], v: [7.5, 9.5] } }, o);
const laneFar = (o = {}) => Object.assign({ id: 'f', pts: [[-75, -1.6], [75, -1.6]], spawn: { gap: [3.5, 7], types: ['car', 'taxi', 'minibus', 'van', 'car'], v: [7.5, 9.5] } }, o);
const rails = (H, cx, w, x0 = -40, x1 = 40) => [[x0, cx - w / 2 - 0.3, H + 0.3], [cx + w / 2 + 0.3, x1, H + 0.3], [x0, cx - w / 2 - 0.3, -H - 0.3], [cx + w / 2 + 0.3, x1, -H - 0.3]];

/* 一般直路：行人可以企嘅地方 */
function straightArea(H, cx, w, W = 5, island = 0) {
  return (x, z) => {
    const inCorr = Math.abs(x - cx) <= w / 2;
    if (Math.abs(x) > 24) return null;
    if (z >= H) return (inCorr || z >= H + 0.55) && z <= H + W - 0.7 ? 'near' : null;
    if (z <= -H) return (inCorr || z <= -H - 0.55) && z >= -H - W + 0.7 ? 'far' : null;
    if (!inCorr) return null;
    if (island && Math.abs(z) <= island) return 'island';
    return 'road';
  };
}

/* 第三關：模擬大車轉彎，計出車身掃過嘅行人路範圍（紅色斜線） */

    for (let x = 2; x < 11; x += step) for (let z = 3.2; z < 10; z += step) {
      const px = x + step / 2, pz = z + step / 2;
      const ax = (px - cx) * hx + (pz - cz) * hz, ac = -(px - cx) * hz + (pz - cz) * hx;
      if (Math.abs(ax) <= d.len / 2 + 0.35 && Math.abs(ac) <= d.wid / 2 + 0.35 && L.area(px, pz) === 'near') cells.add(Math.round(x / step) + ',' + Math.round(z / step));
    }

function nearCells(cells, x, z, step, rad = 2) { for (let dx = -rad; dx <= rad; dx++) for (let dz = -rad; dz <= rad; dz++) if (cells.has(Math.round((x - step / 2) / step + dx) + ',' + Math.round((z - step / 2) / step + dz))) return true; return false; }

const SPEED = 2.1;
function updatePlayer(dt) {
  const P = G.P, I = G.input, L = G.L;
  let mx = (I.right ? 1 : 0) - (I.left ? 1 : 0), mz = (I.down ? 1 : 0) - (I.up ? 1 : 0);
  const len = Math.hypot(mx, mz);
  P.prevZ = P.z;
  P.moving = len > 0;
  if (P.moving) {
    mx /= len; mz /= len;
    if (G.look.lean) { G.look.lean = false; updateLookButtons(); }
    const step = SPEED * dt;
    const tryMove = (nx, nz) => {
      if (!L.area(nx, nz)) return false;
      for (const v of G.world.vehicles) if (v.v < 0.6 && v.contains(nx, nz, 0.28)) return false;
      return true;
    };
    let nx = P.x + mx * step, nz = P.z + mz * step;
    if (tryMove(nx, nz)) { P.x = nx; P.z = nz; }
    else if (mx && tryMove(P.x + mx * step, P.z)) P.x += mx * step;
    else if (mz && tryMove(P.x, P.z + mz * step)) P.z += mz * step;
    else bumpHint();
    P.face = Math.atan2(-mx, -mz);
    P.still = 0;
    G.idleT = 0;
  } else { P.still += dt; P.face = lerpAngle(P.face, 0, 1 - Math.exp(-dt * 3)); G.idleT += dt; }

  P.inRoad = P.area === 'road';
  P.speed = P.moving ? SPEED : 0;
  if (P.inRoad && Math.abs(G.look.phi) > 0.85) G.lookInRoad = true;
}
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; }
let bumpT = 0;
function bumpHint() {
  if (now() - bumpT < 2.5) return; bumpT = now();
  const P = G.P;
  if (Math.abs(P.z) < G.L.map.H + 1.2) toast('有欄杆，要喺過路處先過到 🚸', 'info');
}

}

  else if (side) lk.sideT += dt;
  if (side && lk.sideT > 0.35 && !lk.logged) { lk.logged = true; registerLook(side); }
  if (side === 'R' && lk.lean && lk.sideT > 0.45 && !lk.leanLogged) { lk.leanLogged = true; registerPeek(); }
}
function registerLook(side) {
  for (const c of G.L.checks) {
    const r = G.recs[c.id];
    if (!r.inside) continue;
    r.looks.push({ side, t: now() });
    const word = side === 'R' ? '望咗右' : '望咗左';
    const cnt = r.looks.length;
    if (cnt <= 4) { toast('✓ ' + word, 'good'); addScore(5); }
    event(side === 'R' ? 'lookR' : 'lookL');
  }
}
function registerPeek() {
  for (const c of G.L.checks) {
    const r = G.recs[c.id];
    if (!r.inside || !c.req.includes('peek')) continue;
    if (!r.peek) { r.peek = true; event('peek', '✓ 伸頭望清楚喇'); }
  }
}

/* =====================================================================
   規則檢查
   ===================================================================== */
const hasSeq = (looks, seq) => { let i = 0; for (const l of looks) if (l.side === seq[i]) { i++; if (i === seq.length) return true; } return false; };
const REQ = {
  look: (r) => (r.looks.some((l) => l.side === 'R') && r.looks.some((l) => l.side === 'L')) ? null : 'look',
  signal: () => (G.world.pedLight === 'green' ? null : G.world.pedLight === 'flash' ? 'flash' : 'red'),
  lookAfterGreen: (r) => { const t = G.world.pedGreenAt; if (t < 0) return 'lookAfterGreen'; const a = r.looks.filter((l) => l.t >= t - 0.2); return a.some((l) => l.side === 'R') && a.some((l) => l.side === 'L') ? null : 'lookAfterGreen'; },
  peek: (r) => (r.peek ? null : 'peek'),
  stop: (r) => (r.still >= 0.8 ? null : 'stop'),
};
const BONUS = {
  look: (r) => !REQ.look(r), rlr: (r) => hasSeq(r.looks, ['R', 'L', 'R']), lrl: (r) => hasSeq(r.looks, ['L', 'R', 'L']),
};
function inRect(P, q) { return P.x >= q.x0 && P.x <= q.x1 && P.z >= q.z0 && P.z <= q.z1; }
function updateChecks(dt) {
  const P = G.P;
  for (const c of G.L.checks) {
    const r = G.recs[c.id];
    const inside = inRect(P, c.wait);
    if (inside && !r.inside) {
      if (now() - r.leftT > 2) { r.looks = []; r.peek = false; r.still = 0; }
      if (c.id === 'k1') event('kerb', null);
      if (c.id === 'k2') { event(G.L.script === 'busBlind' ? 'edge' : 'island', G.L.script === 'busBlind' ? '✓ 停喺巴士邊' : '✓ 到咗安全島'); if (G.L.script === 'busBlind') cue('伸頭望右，睇清楚第二條線。'); else cue('喺安全島停低，再望左望右。'); }
    }
    if (!inside && r.inside) r.leftT = now();
    r.inside = inside;
    if (inside && !P.moving) { r.still += dt; if (c.req.includes('stop') && r.still >= 0.8) event('stop', '✓ 停低咗'); }
    // 步驟提示（chips）
    if (inside && c.id === 'k1') {
      const okLook = c.req.includes('lookAfterGreen') ? !REQ.lookAfterGreen(r) : !REQ.look(r);
      if (okLook) event('look', '✓ 兩邊都望清楚');
      if (G.world.pedLight === 'green') event('green', '✓ 綠人喇');
    }
    // 跨過界線 = 落馬路／離開等候位：檢查守則
    if (P.prevZ >= c.line && P.z < c.line && !r.passed) {
      r.passed = true;
      let fail = null;
      for (const q of c.req) { fail = REQ[q](r); if (fail) break; }
      if (fail) { unsafe(fail, c); return; }
      r.bonusOK = c.bonus ? BONUS[c.bonus](r) : true;
      addScore(10);
    }
    if (r.passed && P.z > c.line + 0.3) r.passed = false;
  }
  // 提示：企喺等候位太耐都未望
  for (const c of G.L.checks) {
    const r = G.recs[c.id];
    if (r.inside && G.idleT > 5 && !G.hinted[c.id]) {
      G.hinted[c.id] = true;
      if (c.req.includes('signal') && G.world.pedLight !== 'green') { cue('等綠人先過。'); continue; }
      if (c.req.includes('peek') && !r.peek) { $('#lkP').classList.add('hint'); cue('撳伸頭，望右邊第二條線。'); continue; }
      if (REQ.look(r)) { $('#lkR').classList.add('hint'); $('#lkL').classList.add('hint'); cue('撳望右同望左，睇清楚有冇車。'); }
    }
  }
}
function event(id, msg) {
  if (G.events.has(id)) return;
  G.events.add(id);
  if (msg) { toast(msg, 'good'); Sfx.good(); addScore(10); }
  renderChips();
}
function addScore(n) { G.score = Math.max(0, G.score + n); }

function onScare(v) {

/* =====================================================================
   鏡頭
   ===================================================================== */
function updateCamera(dt) {
  const P = G.P, lk = G.look, kid = G.kid;
  let pos, tgt;
  const hx = P.x, hz = P.z;
  if (G.mode === 'title' || G.mode === 'menu' || G.mode === 'intro' || G.mode === 'result') {
    // 介紹畫面：鏡頭喺行人路側面，小朋友塊面向鏡頭
    const t = now() * 0.25, sw = Math.sin(t) * 0.35;
    const back = G.mode === 'result' ? 2.6 : 3.2;
    pos = new THREE.Vector3(hx - back * Math.cos(sw), 1.45, hz + back * Math.sin(sw) * 0.6 + 0.2);
    tgt = new THREE.Vector3(hx, 0.95, hz);
    if (window.innerWidth > window.innerHeight * 1.15) { pos.set(hx - 3.9, 1.55, hz - 0.3 + Math.sin(t) * 0.4); tgt.set(hx, 1.0, hz + 1.9); }   // 橫向：小朋友喺卡片左邊
  } else {
    const phi = lk.phi, dx = Math.sin(phi), dz = -Math.cos(phi);
    const t = clamp(Math.abs(phi) / 1.3, 0, 1);
    if (lk.lean) {
      const head = new THREE.Vector3(hx, 1.3, headZ());
      pos = head.clone().add(new THREE.Vector3(dx * 0.3, 0, dz * 0.3));
      tgt = head.clone().add(new THREE.Vector3(dx * 30, -0.5, dz * 30));
    } else {
      const dist = lerp(5.4, 3.0, t), h = lerp(3.1, 1.75, t), ahead = lerp(4, 24, t);
      pos = new THREE.Vector3(hx - dx * dist, h, hz - dz * dist);
      tgt = new THREE.Vector3(hx + dx * ahead, lerp(0.4, 0.9, t), hz + dz * ahead);
      if (G.mode === 'crash') { pos = new THREE.Vector3(hx + 2.5, 4.5, hz + 4.2); tgt = new THREE.Vector3(hx, 0.4, hz); }
    }
  }
  // 鏡頭唔可以入咗大廈
  const SBz = G.L.map.H + (G.L.map.setback || 9) - 0.7;
  if (Math.abs(pos.z) > SBz) { pos.y += (Math.abs(pos.z) - SBz) * 0.8; pos.z = Math.sign(pos.z) * SBz; }
  const k = 1 - Math.exp(-dt * (G.mode === 'crash' ? 2 : 6));
  if (G.snapCam) { camPos.copy(pos); camTgt.copy(tgt); G.snapCam = false; } else { camPos.lerp(pos, k); camTgt.lerp(tgt, k); }
  camera.position.copy(camPos); camera.lookAt(camTgt);
  sun.position.set(hx + 25, 45, hz + 18); sun.target.position.set(hx, 0, hz);
}

/* =====================================================================
   主迴圈
   ===================================================================== */
let lastT = now();
function loop() {
  requestAnimationFrame(loop);
  const t = now(); let dt = Math.min(0.05, t - lastT) * TS; lastT = t;
  if (G.mode === 'paused') { renderer.render(scene, camera); return; }
  const sdt = dt * G.slow;
  if (G.mode === 'crash') { G.crashT += dt; if (G.crashT > 1.2) G.slow = lerp(G.slow, 1, 0.05); }
  if (G.world) {
    G.world.pedWantsZebra = G.mode === 'play' && (G.recs.k1?.inside || G.recs.k2?.inside || G.P.inRoad);
    G.world.update(sdt, { traffic: true, playing: G.mode === 'play' });
  }
  if (G.mode === 'play') {
    updatePlayer(sdt); updateLook(sdt); updateChecks(sdt);
    if (G.mode === 'play') { updateScript(sdt); updateTimer(sdt); checkHits(); }
    if (G.mode === 'play') checkGoal();
  }
  // 角色姿勢
  if (G.kid) {
    const P = G.P, k = G.kid;
    k.position.set(P.x, 0.15, P.z);
    const presenting = ['title', 'menu', 'intro', 'result'].includes(G.mode);
    const targetRot = presenting ? Math.PI / 2 : P.face;
    k.rotation.y = lerpAngle(k.rotation.y, targetRot, 1 - Math.exp(-dt * 8));
    const yawHead = presenting ? 0 : clamp(-G.look.phi + (P.moving ? 0 : P.face), -1.3, 1.3);
    poseKid(k, sdt, { walking: P.moving && G.mode === 'play', yaw: presenting ? 0 : clamp(-G.look.phi, -1.3, 1.3), lean: G.look.lean && G.mode === 'play', fall: G.mode === 'crash', wave: presenting || G.mode === 'win' });
  }
  if (G.kid) G.kid.visible = !(G.look.lean && G.mode === 'play' && camPos.distanceTo(new THREE.Vector3(G.P.x, 1.3, headZ())) < 1.2);
  if (G.safeLabel) G.safeLabel.lookAt(camera.position);
  updateCamera(dt);
  // 車聲：最近嗰架車越近越大聲
  if (Sfx.ctx && G.world) {
    let dmin = 99; for (const v of G.world.vehicles) if (v.v > 1) dmin = Math.min(dmin, Math.hypot(v.center.x - G.P.x, v.center.y - G.P.z));
    const lvl = ['play', 'intro', 'crash'].includes(G.mode) ? clamp(1 - dmin / 30, 0, 1) * 0.22 : 0.04;
    Sfx.setRumble(lvl);
  }
  renderer.render(scene, camera);
}

  showSheet([head, el('p', { class: 'muted' }, '每關先睇一張教學卡，再落街練。過咗一關先開下一關。'), list], foot);
  if (!paused) Voice.auto('揀一關。每一關都係先學、後練。');
}
function resume() { hideSheet(); G.mode = 'play'; document.body.classList.remove('nogame'); lastT = now(); }

/* ---------- 每關：學 ---------- */
function startLevel(i) {
  loadLevel(LEVELS[i]);
  showIntro();
}
function showIntro() {
  const L = G.L; G.mode = 'intro'; document.body.classList.add('nogame');
  const tips = el('ul', { class: 'tips' });
  L.tips.forEach(([ico, t]) => { const li = el('li', {}, el('span', { class: 'ico' }, ico), el('span', {}, t)); li.append(spkBtn(t)); tips.append(li); });
  showSheet([
    el('span', { class: 'kicker' }, `第 ${L.id} 關 · 學`),

    el('h3', {}, '點樣玩'),

  ], [mkBtn('目錄', 'soft', () => showMenu()), el('span', { class: 'grow' }), mkBtn('開始練習 ▶', 'go big attn', startPlay, '開始練習。')]);
  Voice.auto(L.key + L.tips.map((t) => t[1]).join(''));
}
function startPlay() {
  hideSheet(); Voice.stop();
  G.mode = 'play'; document.body.classList.remove('nogame');
  renderPill(); lastT = now();
  if (G.L.script === 'turningTruck') G.scriptState.t0 = now();
}
function retry() { loadLevel(G.L); startPlay(); }

/* ---------- 過關 ---------- */
function caseCard(c) {
  const box = el('div', { class: 'case' + (c.kind === 'fact' ? ' adapt' : '') });
  box.append(el('span', { class: 'tag' }, c.kind === 'real' ? '真實個案' : '真實數字'), el('h3', { style: 'margin:2px 0 4px' }, c.title), el('p', {}, c.text));
  c.src.forEach((s) => box.append(el('div', {}, el('a', { href: s.u, target: '_blank', rel: 'noopener' }, '來源：' + s.t))));
  box.append(el('p', { class: 'muted' }, '遊戲入面嘅「學堂街」係虛構地方。'));
  box.append(spkBtn(c.title + '。' + c.text));
  return box;
}
function showResult(stars, bonusOK) {
  const L = G.L; G.mode = 'result'; document.body.classList.add('nogame');
  const good = el('div', { class: 'good' }, el('b', {}, '你做啱咗：'));
  const ul = el('ul');
  L.steps.forEach(([id]) => { if (G.events.has(id)) ul.append(el('li', {}, '✓ ' + (EVENT_TEXT[id] || id))); });
  if (G.lookInRoad) ul.append(el('li', {}, '✓ 過馬路嗰陣繼續望'));
  good.append(ul);
  const tips = [];
  if (!bonusOK) tips.push(L.checks.some((c) => c.bonus === 'rlr') ? '喺路邊試吓「望右、望左、再望右」' : L.checks.some((c) => c.bonus === 'lrl') ? '喺安全島試吓「望左、望右、再望左」' : L.checks.some((c) => c.bonus === 'look') ? '綠人亮咗之後，都望吓右、望吓左' : '過馬路嗰陣都繼續望吓');
  if (G.nearMiss) tips.push('有車要為你急煞，下次等車停定或者過咗先行');
  if (G.timeUp) tips.push('熟練之後，可以喺返學時間之前到');
  const nodes = [
    el('span', { class: 'kicker', style: 'background:var(--green)' }, `第 ${L.id} 關 · 過關！`),
    el('h2', {}, '做得好！你安全過咗馬路'),
    el('div', { class: 'stars', 'aria-label': `${stars} 粒星` , html: '★'.repeat(stars) + `<span class="off">${'★'.repeat(3 - stars)}</span>` }),
    good,
  ];
  if (tips.length) { const w = el('div', { class: 'why' }, el('b', {}, '想攞滿三粒星：')); const u2 = el('ul'); tips.forEach((t) => u2.append(el('li', {}, t))); w.append(u2); nodes.push(w); }
  nodes.push(sayBlock('p', '記住：' + L.key, 'lead'), caseCard(L.case));
  const i = LEVELS.indexOf(L), last = i === LEVELS.length - 1;
  const all = LEVELS.every((x) => save.stars[x.id] > 0);
  const foot = [mkBtn('目錄', 'soft', () => showMenu()), mkBtn('再玩一次', 'soft', retry), el('span', { class: 'grow' })];
  if (all && (last || !LEVELS.slice(i + 1).some((x) => !save.stars[x.id]))) foot.push(mkBtn('攞證書 🏅', 'warm big attn', showCert, '攞證書。'));
  if (!last) foot.push(mkBtn('下一關 ▶', 'go big' + (all ? '' : ' attn'), () => startLevel(i + 1), '下一關。'));
  showSheet(nodes, foot);
  Voice.auto(`做得好！你攞到 ${stars} 粒星。記住：${L.key}`);
}

/* ---------- 唔安全（冇撞到但唔合格） ---------- */

/* ---------- 延伸閱讀／聽書 ---------- */
function showRead() {
  const back = G.mode;
  const nodes = [el('span', { class: 'kicker' }, '延伸閱讀／聽書'), sayBlock('h2', '想知多啲？逐段撳喇叭聽。', '', '想知多啲？')];

  cases.append(spkBtn('真實個案。' + LEVELS.filter((L) => L.case.kind === 'real').map((L) => L.case.text).join('')));
  nodes.push(cases);
  showSheet(nodes, [el('span', { class: 'grow' }), mkBtn('返回', 'go', () => (back === 'title' ? showTitle() : showMenu()))]);

}

/* ---------- 證書 ---------- */
function drawCert(cv, name) {
  const W = 1400, Hh = 990; cv.width = W; cv.height = Hh;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff8ec'; g.fillRect(0, 0, W, Hh);
  // 斑馬線邊
  for (let i = 0; i < W; i += 60) { g.fillStyle = (i / 60) % 2 ? '#1d2b4f' : '#ffffff'; g.fillRect(i, 0, 60, 26); g.fillRect(i, Hh - 26, 60, 26); }
  g.strokeStyle = '#ffc93c'; g.lineWidth = 14; g.strokeRect(46, 52, W - 92, Hh - 104);
  g.strokeStyle = '#1d2b4f'; g.lineWidth = 3; g.strokeRect(66, 72, W - 132, Hh - 144);
  g.textAlign = 'center'; g.fillStyle = '#1d2b4f';
  g.font = `bold 92px ${FONT_CANVAS}`; g.fillText('馬路安全大使', W / 2, 210);
  g.font = `bold 44px ${FONT_CANVAS}`; g.fillStyle = '#e2342d'; g.fillText('證 書', W / 2, 280);
  g.fillStyle = '#1d2b4f'; g.font = `40px ${FONT_CANVAS}`; g.fillText('恭喜', W / 2, 370);
  g.font = `bold 86px ${FONT_CANVAS}`; g.fillText(name || '＿＿＿＿＿＿', W / 2, 470);
  g.fillRect(W / 2 - 300, 492, 600, 4);
  g.font = `36px ${FONT_CANVAS}`;
  g.fillText('完成「學堂街」六關過馬路訓練：', W / 2, 570);
  g.fillText('識得等綠人、望清楚、避開大車轉彎同死角、喺安全島停低再望。', W / 2, 625);
  g.font = `bold 40px ${FONT_CANVAS}`; g.fillStyle = '#21a366'; g.fillText('幾趕都好，安全行先。生命冇得 take two。', W / 2, 705);
  const total = LEVELS.reduce((a, L) => a + (save.stars[L.id] || 0), 0);
  g.fillStyle = '#e0a400'; g.font = `bold 46px ${FONT_CANVAS}`; g.fillText(`★ ${total} ／ 18`, W / 2, 780);
  const d = new Date(), ds = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  g.fillStyle = '#44527a'; g.font = `32px ${FONT_CANVAS}`; g.textAlign = 'left'; g.fillText('日期：' + ds, 130, 880);
  g.textAlign = 'right'; g.fillText('「馬路安全大使」訓練遊戲', W - 130, 880);
  // 徽章：綠色人像
  g.save(); g.translate(W - 230, 250); g.fillStyle = '#21a366'; g.beginPath(); g.arc(0, 0, 92, 0, 7); g.fill(); g.strokeStyle = '#ffc93c'; g.lineWidth = 10; g.stroke(); g.scale(2.6, 2.6); drawMan(g, 0, 4, '#ffffff', true); g.restore();
  g.save(); g.translate(230, 250); g.fillStyle = '#e2342d'; g.beginPath(); g.arc(0, 0, 92, 0, 7); g.fill(); g.strokeStyle = '#ffc93c'; g.lineWidth = 10; g.stroke(); g.fillStyle = '#fff'; g.font = `bold 64px ${FONT_CANVAS}`; g.textAlign = 'center'; g.fillText('🚸', 0, 24); g.restore();
}
function showCert() {
  G.mode = 'menu'; document.body.classList.add('nogame');
  const cv = el('canvas', { 'aria-label': '馬路安全大使證書' });
  const input = el('input', { type: 'text', maxlength: '14', placeholder: '寫低你個名', value: save.name || '' });
  input.addEventListener('input', () => { save.name = input.value.trim(); persist(); drawCert(cv, save.name); });
  drawCert(cv, save.name);
  const nb = el('div', { class: 'namebox' }, input);
  showSheet([
    el('span', { class: 'kicker', style: 'background:var(--yellow);color:var(--ink)' }, '🏅 你做到喇！'),
    sayBlock('h2', '恭喜你成為馬路安全大使！記住：幾趕都好，安全行先。', '', '恭喜你成為馬路安全大使！'),
    nb, el('div', { class: 'cert-wrap' }, cv),
    el('p', { class: 'muted' }, 'iPad／手機下載唔到嘅話，可以撳「列印」，或者截圖留念。'),
  ], [mkBtn('目錄', 'soft', () => showMenu()), el('span', { class: 'grow' }), mkBtn('列印', 'soft', () => { $('#printImg').src = cv.toDataURL('image/png'); setTimeout(() => window.print(), 200); }), mkBtn('下載證書', 'warm', () => {
    cv.toBlob((blob) => { const a = el('a', { href: URL.createObjectURL(blob), download: '馬路安全大使證書.png' }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); });
  })]);
  Voice.auto('恭喜你成為馬路安全大使！寫低你個名，就可以下載證書。');
  Sfx.win();
}

/* =====================================================================
   輸入
   ===================================================================== */
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
window.addEventListener('keydown', (e) => {
  Voice.unlock();
  if (e.target.tagName === 'INPUT') return;
  if (KEYMAP[e.code]) { if (G.mode === 'play') { G.input[KEYMAP[e.code]] = true; e.preventDefault(); } return; }
  if (G.mode === 'play') {
    if (e.code === 'KeyQ') setLook('left');
    if (e.code === 'KeyE') setLook('right');
    if (e.code === 'KeyR') setLook('front');
    if (e.code === 'KeyF' && G.L.script === 'busBlind') setLook('peek');
  }
  if (e.code === 'Escape') { if (G.mode === 'play') showMenu({ paused: true }); else if (G.mode === 'paused') resume(); }
  if (e.code === 'Enter' && $('#sheet').classList.contains('show')) { const b = $('#sheetFoot .btn.go:not([disabled]), #sheetFoot .btn.warm:not([disabled])'); if (b) b.click(); }
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) G.input[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { G.input.up = G.input.down = G.input.left = G.input.right = false; });
document.querySelectorAll('#pad button').forEach((b) => {
  const d = b.dataset.dir;
  const on = (e) => { e.preventDefault(); Voice.unlock(); if (G.mode !== 'play') return; G.input[d] = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { G.input[d] = false; b.classList.remove('held'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
const LOOK_SAY = { left: '望左：睇吓左邊有冇車。再撳一次返正面。', right: '望右：睇吓右邊有冇車。香港車靠左行，近你嗰條線嘅車由右邊嚟。再撳一次返正面。', front: '返正面：望返前面。', peek: '伸頭：喺巴士邊伸個頭出去，睇清楚第二條線有冇車。' };
document.querySelectorAll('#looks > button').forEach((b) => {
  b.append(spkBtn(LOOK_SAY[b.dataset.look]));
  b.addEventListener('click', (e) => { if (e.target.closest('.spk')) return; Voice.unlock(); if (G.mode === 'play') setLook(b.dataset.look); });
});
$('#keys').append(spkBtn('按鍵：方向鍵或者 W A S D 行路。E 望右，Q 望左，R 返正面，F 伸頭。Esc 暫停。用滑鼠或者手指拖畫面，都可以轉頭望。'));
// 拖畫面轉頭望
let drag = null;
canvas.addEventListener('pointerdown', (e) => { Voice.unlock(); if (G.mode !== 'play') return; drag = { x: e.clientX, id: e.pointerId }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x; drag.x = e.clientX;
  if (Math.abs(dx) < 0.5) return;
  const lk = G.look; lk.dragging = true; lk.phi = clamp(lk.phi + dx * 0.006, -1.5, 1.5); lk.target = lk.phi;
  lk.mode = lk.phi > 0.85 ? 'right' : lk.phi < -0.85 ? 'left' : 'drag'; updateLookButtons();
});
const endDrag = () => { drag = null; G.look.dragging = false; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
// 第一下撳畫面：解鎖語音（iPad Safari 規定）
window.addEventListener('pointerdown', () => Voice.unlock(), { capture: true });
$('#btnVoice').addEventListener('click', () => { Voice.unlock(); Voice.setOn(!Voice.on); toast(Voice.on ? '自動語音開咗' : '自動語音關咗', 'info'); });
$('#btnKeys').addEventListener('click', () => { const k = $('#keys'); k.classList.toggle('show'); $('#btnKeys').classList.toggle('on', k.classList.contains('show')); $('#btnKeys').setAttribute('aria-pressed', String(k.classList.contains('show'))); });
$('#btnMenu').addEventListener('click', () => { Voice.unlock(); if (G.mode === 'play') showMenu({ paused: true }); else if (G.mode === 'paused') resume(); else if (!['crash'].includes(G.mode)) showMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') showMenu({ paused: true }); });

/* =====================================================================
   開始
   ===================================================================== */
function boot() {
  makeTextures();
  Voice.init(); Voice.setOn(save.voice !== false);
  resize();
  loadLevel(LEVELS[0], { forTitle: true });
  camPos.set(-12, 2, 7); camTgt.set(-5, 1, 6);
  $('#loading').remove();
  showTitle();
  loop();
  window.__game = { G, LEVELS, startLevel, startPlay, setLook, showMenu, save };
  window.__perf = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures, veh: G.world.vehicles.length });
}
try { boot(); } catch (err) {
  console.error(err);
  const l = $('#loading'); if (l) l.textContent = '載入唔到：' + err.message + '（請用新版 Chrome／Safari 開）';
}
