<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="扭計骰小博士">
<meta name="theme-color" content="#FFF6E8">
<meta name="description" content="用第一性原理同廣東話語音，一步一步教小朋友由零開始還原 3×3 扭計骰，附填色解骰器。">
<title>扭計骰小博士 · 由零開始學扭計骰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E8; --bg2:#FFEFD6; --ink:#23263A; --muted:#62687E; --line:#EADFCB; --card:#FFFFFF;
  --pri:#5B5BF7; --pri-d:#3F3FD1; --pink:#FF4FA3; --pink-d:#D93584; --ok:#12B886; --ok-d:#0C8F68;
  --warn:#FFB020; --sky:#E9F0FF; --sky2:#D6E3FF;
  --r:20px; --shadow:0 2px 0 rgba(35,38,58,.05),0 10px 28px rgba(35,38,58,.09);
  --font:"Noto Sans HK","PingFang HK","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
  --topbar:60px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{overflow:hidden;background:radial-gradient(circle at 12% -10%,#FFE3B8 0,transparent 40%),radial-gradient(circle at 110% 10%,#E3E8FF 0,transparent 38%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,.mchip,.hcard{user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
b,strong{font-weight:800}

/* top bar */
#topbar{height:calc(var(--topbar) + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;border-radius:12px;font-size:19px;font-weight:900;letter-spacing:.5px}
.brand-logo{width:36px;height:36px;display:block}
.brand-logo svg{width:100%;height:100%}
#topTitle{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:8px}
.star-total{background:#FFF3C4;border:2px solid #FFD95A;border-radius:999px;padding:4px 12px;font-weight:800}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.icon-btn.off{opacity:.45}

#app{height:100%;display:flex;flex-direction:column}
#topbar{flex:none}
main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{border:0;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:800;background:#fff;color:var(--ink);box-shadow:0 4px 0 #D9CFBD,inset 0 0 0 2px var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9CFBD,inset 0 0 0 2px var(--line)}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.btn.pri:active{box-shadow:0 1px 0 var(--pri-d)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.btn.pink:active{box-shadow:0 1px 0 var(--pink-d)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.soft{background:var(--sky);box-shadow:0 4px 0 var(--sky2)}
.btn.big{font-size:20px;padding:16px 28px;min-height:60px;border-radius:20px}
.btn.sm{font-size:14px;padding:8px 12px;min-height:40px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wiggle{animation:wiggle 1s ease 3}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg) scale(1.05)}40%{transform:rotate(4deg) scale(1.05)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* speaker */
.spk{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #FFD2E8;background:#FFF0F7;display:inline-grid;place-items:center;font-size:18px;box-shadow:0 3px 0 #FFD2E8;vertical-align:middle}
.spk:active{transform:translateY(2px);box-shadow:none}
.spk.speaking{background:var(--pink);border-color:var(--pink);animation:pulse 1s infinite}
.spk.speaking .spk-ico{filter:brightness(10)}
.spk.small{width:32px;height:32px;font-size:14px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,79,163,.5)}100%{box-shadow:0 0 0 12px rgba(255,79,163,0)}}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #F1E7D6}
.card h3{margin:0 0 8px;font-size:19px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title h3{flex:1;margin:0}

/* HOME */
.home-wrap{max-width:980px;margin:0 auto;padding:22px 18px 40px}
.hero{display:flex;align-items:center;gap:18px;margin:8px 0 22px}
.hero-mascot{width:150px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.hero-bubble{position:relative;background:#fff;border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);font-size:19px;line-height:1.65;flex:1;display:flex;gap:10px;align-items:flex-start}
.hero-bubble p{margin:0;flex:1}
.hero-bubble:before{content:"";position:absolute;left:-12px;top:44px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hcard{border:0;border-radius:24px;padding:22px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.07),0 14px 30px rgba(35,38,58,.08);transition:transform .15s}
.hcard:active{transform:translateY(4px) scale(.99)}
.hcard .hc-ico{font-size:42px;line-height:1}
.hcard b{font-size:21px}
.hcard small{font-size:15px;color:var(--muted);line-height:1.4}
.c-learn{background:linear-gradient(160deg,#FFF1C9,#FFE08A)}
.c-play{background:linear-gradient(160deg,#DDF8EC,#AEEBD1)}
.c-solver{background:linear-gradient(160deg,#E5E6FF,#C7C9FF)}
.c-badge{background:linear-gradient(160deg,#FFE3EF,#FFC3DC)}
.c-parent{background:linear-gradient(160deg,#EAF3FF,#CFE3FF)}
.c-learn{grid-column:span 2}
.home-foot{text-align:center;color:var(--muted);margin-top:22px;font-size:15px}

/* MAP */
.map-wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.map-intro{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.map-intro h2{margin:0 0 4px}
.map-intro p{margin:0;color:var(--muted);line-height:1.6}
.mi-mascot{width:74px;flex:none}
.map-path{position:relative;display:flex;flex-direction:column;gap:14px}
.map-node{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border:3px solid transparent;width:min(560px,92%);text-align:left}
.map-node:nth-child(odd){align-self:flex-start}
.map-node:nth-child(even){align-self:flex-end}
.map-node.next{border-color:var(--pink);box-shadow:0 0 0 6px rgba(255,79,163,.15),var(--shadow)}
.map-node .mn-ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;background:var(--sky)}
.map-node.done .mn-ico{background:#D8F6E9}
.map-node .mn-txt{flex:1;min-width:0}
.map-node .mn-txt b{display:block;font-size:18px}
.map-node .mn-txt small{color:var(--muted);font-size:14px}
.mn-stars{font-size:16px;letter-spacing:1px;margin-top:3px}
.mn-go{font-size:24px;color:var(--pri)}
.next-tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;margin-left:6px;vertical-align:middle}

/* PLAY layout */
.play-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:14px;height:100%;padding:12px;max-width:1500px;margin:0 auto}
.stage-col{display:flex;flex-direction:column;gap:10px;min-height:0}
.side-col{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:30px;min-height:0;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.cube-box{position:relative;flex:1;min-height:260px;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 88%,rgba(35,38,58,.16) 0,rgba(35,38,58,0) 32%),radial-gradient(circle at 50% 35%,#FDFEFF 0,#E6EEFF 60%,#D5E1FF 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),var(--shadow)}
.cube-host{position:absolute;inset:0}
.cube-canvas{width:100%!important;height:100%!important;display:block;touch-action:none}
.hud-tl{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:60%;pointer-events:none}
.hud-tr{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.hud-btn{border:0;background:rgba(255,255,255,.9);border-radius:14px;min-width:54px;padding:6px 6px 4px;font-size:18px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 rgba(35,38,58,.12)}
.hud-btn span{font-size:11px;font-weight:700;color:var(--muted)}
.hud-btn.on{background:var(--pri);color:#fff}
.hud-btn.on span{color:#fff}
.chip-soft{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 0 rgba(35,38,58,.1)}
.net-mini{position:absolute;left:10px;bottom:10px;width:150px;background:rgba(255,255,255,.85);border-radius:14px;padding:6px;box-shadow:0 3px 0 rgba(35,38,58,.1)}
.net-mini:before{content:"展開圖";display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 2px 2px}
.net{width:100%;display:block}
.net rect.bad{stroke:#ff2d8a;stroke-width:2.5}
.net-lbl{fill:rgba(0,0,0,.35);font-weight:900;text-anchor:middle;pointer-events:none}
.move-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) scale(.8);background:rgba(35,38,58,.88);color:#fff;border-radius:18px;padding:8px 16px;font-size:18px;font-weight:800;opacity:0;transition:all .2s;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.move-toast b{font-size:26px;font-family:ui-rounded,system-ui,sans-serif}
.move-toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);background:#fff;border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 8px 24px rgba(35,38,58,.18);opacity:0;transition:all .25s;pointer-events:none;max-width:80%;text-align:center;line-height:1.5;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.swipe-hint{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;pointer-events:none;animation:hintbob 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes hintbob{50%{transform:translate(-50%,-6px)}}

/* controls */
.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.mv{border:0;border-radius:14px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative;line-height:1.05}
.mv b{font-size:20px;font-family:ui-rounded,system-ui,sans-serif}
.mv i{font-style:normal;font-size:15px;opacity:.9}
.mv small{font-size:10px;font-weight:700;opacity:.85}
.mv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.mv.dark{color:#fff}
.mv.light{color:#23263A}
.mv.rot{background:linear-gradient(135deg,#8B7CFF,#5B5BF7);color:#fff}
.mv.hl{outline:4px solid var(--pink);outline-offset:2px;animation:hlp 1s infinite}
@keyframes hlp{50%{outline-color:rgba(255,79,163,.3)}}
.ctrl-row{grid-column:1/-1;display:flex;gap:8px}
.ctrl-row .btn{flex:1;min-height:46px;font-size:15px}
.controls.collapsed .mv{display:none}

/* side: lesson */
.lesson-head{display:flex;gap:12px;align-items:center}
.lesson-head .lh-ico{width:54px;height:54px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:30px;flex:none}
.lesson-head h2{margin:0;font-size:21px}
.lesson-head small{color:var(--muted)}
.lh-stars{margin-left:auto;font-size:18px;white-space:nowrap}
.tabs{display:flex;gap:6px;background:#F6EFE3;border-radius:16px;padding:5px}
.tab{flex:1;border:0;background:none;border-radius:12px;padding:9px 6px;font-weight:800;font-size:15px;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.slide h3{font-size:21px;margin:4px 0 10px;line-height:1.35}
.slide-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slide-no{font-weight:800;color:var(--muted);font-size:14px;background:#F6EFE3;border-radius:999px;padding:3px 10px}
.slide-body{font-size:18px;line-height:1.8}
.slide-body b{color:#3434C9}
.slide-body .li{display:block;padding-left:1.1em;text-indent:-1.1em}
.slide-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
.slide-nav .btn{flex:1}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#E3D8C4}
.dots i.on{background:var(--pri);width:20px;border-radius:6px}
.formula{border:2px dashed #C9C9FF;background:#F3F3FF;border-radius:12px;padding:2px 6px;display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin:2px 0;flex-wrap:wrap;text-indent:0}
.formula:after{content:"▶";font-size:11px;color:var(--pri);margin-left:2px}
.mchip{display:inline-flex;align-items:center;gap:1px;background:#fff;border:2px solid #DADAF7;border-radius:9px;padding:1px 6px;font-size:15px;line-height:1.4;text-indent:0;white-space:nowrap}
.mchip b{font-family:ui-rounded,system-ui,sans-serif;color:var(--ink)!important}
.mchip i{font-style:normal;font-size:12px;color:var(--muted)}
.mchip.done{background:#D8F6E9;border-color:#9FE3C6;opacity:.75}
.mchip.cur{background:var(--pink);border-color:var(--pink);transform:scale(1.12)}
.mchip.cur b,.mchip.cur i{color:#fff!important}
.fig{margin:6px 0 10px;text-align:center}
.fig svg.iso{width:150px;height:auto}
.fig svg.face2d{width:130px;height:auto}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.fig .mascot.big{width:120px}
.fig.row3,.fig.row4,.fig.pieces2,.fig.clocks{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
.fig.row3>div,.fig.row4>div,.fig.clocks>div{display:flex;flex-direction:column;align-items:center}
.fig.row3 svg.iso{width:92px}
.fig.row4 svg.face2d{width:62px}
.fig.row4 i{font-style:normal;color:var(--muted)}
.fig.clocks svg{width:80px}
.fig small{font-weight:700;font-size:13px}
.fig.bignum div{font-size:22px;font-weight:900;color:var(--pri);letter-spacing:.5px;word-break:break-all}
.fig.layers{display:flex;flex-direction:column;gap:4px;max-width:280px;margin:6px auto 12px}
.ly{border-radius:10px;padding:8px;font-weight:800;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.ly small{font-weight:600;color:rgba(0,0,0,.55)}
.l3{background:#FFE26B}.l2{background:#C9D6FF}.l1{background:#fff;border:2px solid #d6d9e0}
.fig.swipe .hand{font-size:52px;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.fig.cyc{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}
.fig.cyc span{width:30px;height:30px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:900}
.fig.cyc i{font-style:normal;color:var(--muted)}
.fig.cyc b{background:#D8F6E9;border-radius:10px;padding:4px 8px}
.fig.pieces2>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tile{display:inline-block;width:28px;height:28px;border-radius:6px;border:3px solid #1c1f27;margin:0 1px}
.iso-lbl{font-size:16px;font-weight:900;fill:rgba(0,0,0,.55);text-anchor:middle}
.widget-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.move-chart{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.move-chart .mv{min-height:50px}

/* mission */
.mission .m-desc{font-size:16px;line-height:1.6;margin:0 0 10px;color:var(--muted)}
.m-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-btns .btn{flex-direction:column;font-size:14px;padding:10px 6px;min-height:70px}
.m-btns .btn .e{font-size:24px}
.m-step{font-size:12px;font-weight:700;opacity:.8}
.task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task-list li{display:flex;gap:10px;align-items:center;background:#FAF6EE;border-radius:14px;padding:10px 12px;font-weight:700}
.task-list li .ck{width:28px;height:28px;border-radius:50%;border:3px solid #DCCFB8;display:grid;place-items:center;flex:none;background:#fff}
.task-list li.done{background:#E3F8EF}
.task-list li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.follow-now{display:flex;align-items:center;gap:12px;background:#F3F3FF;border-radius:18px;padding:12px;margin:8px 0}
.follow-now .big-chip{font-size:40px;font-weight:900;font-family:ui-rounded,system-ui,sans-serif;background:#fff;border-radius:14px;min-width:84px;text-align:center;padding:6px 10px;box-shadow:0 3px 0 #DADAF7}
.follow-now .fw{flex:1;font-size:19px;font-weight:800;line-height:1.4}
.follow-now .fw small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.pbar{height:12px;background:#F1E8D8;border-radius:999px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#52D6A6);border-radius:999px;transition:width .3s}
.done-box{background:linear-gradient(135deg,#E3F8EF,#FFF6D6);border-radius:18px;padding:14px;text-align:center;margin-top:10px}
.done-box .big{font-size:26px;font-weight:900}

/* brain */
.brain{border:3px solid #E6E0FF;background:linear-gradient(180deg,#FBFAFF,#fff 30%)}
.brain-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brain-ico{width:46px;height:46px;border-radius:50%;background:#EEE9FF;display:grid;place-items:center;font-size:26px;flex:none;position:relative}
.brain.thinking .brain-ico{animation:think 1.2s ease-in-out infinite}
@keyframes think{50%{transform:scale(1.1) rotate(-6deg)}}
.brain-head b{font-size:18px;display:block}
.brain-head small{color:var(--muted);font-size:13px}
.brain-head .grow{flex:1}
.brain-stage{display:flex;align-items:center;gap:8px;background:#EEE9FF;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.brain-stage .pips{display:flex;gap:4px}
.brain-stage .pips i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #B9AEFF}
.brain-stage .pips i.on{background:var(--ok);border-color:var(--ok)}
.thought{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:10px 10px 10px 8px;margin:0;position:relative;animation:pop .35s ease both}
.thought + .thought{margin-top:14px}
.thought + .thought:before{content:"";position:absolute;left:25px;top:-14px;height:14px;border-left:3px dotted #C8BEFF}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.th-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.th-body{flex:1;min-width:0}
.th-body b{font-size:13px;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:2px}
.th-body p{margin:0;font-size:16.5px;line-height:1.65}
.t-see{background:#FFF7DD}.t-goal{background:#E8F7FF}.t-think{background:#F1ECFF}.t-do{background:#FFEFF6}
.thought.locked{background:#F6F4FA;color:var(--muted);border:2px dashed #DDD6F0}
.thought.locked p{font-size:15px}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.step{background:#fff;border-radius:12px;padding:8px}
.step .sw{font-size:14px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.step .sw .n{width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.step.done .sw .n{background:var(--ok)}
.step .chips{display:flex;flex-wrap:wrap;gap:5px}
.brain-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.brain-actions .btn{font-size:14px;padding:8px 6px;flex-direction:column;gap:2px;min-height:58px}
.brain-actions .btn .e{font-size:20px}
.brain-msg{margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.55;display:none}
.brain-msg.show{display:block;animation:pop .3s ease}
.brain-msg.good{background:#E3F8EF;color:#0b6b4f}
.brain-msg.info{background:#EEF3FF;color:#2f3f8f}
.brain-msg.warn{background:#FFF1DB;color:#8a4b00}
.brain-msg .row{margin-top:8px}
.brain-off{color:var(--muted);text-align:center;padding:10px}

/* roadmap */
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rm{border-radius:12px;padding:6px 4px;background:#F6EFE3;text-align:center;font-size:12px;font-weight:800;line-height:1.3;border:2px solid transparent}
.rm .n{display:block;font-size:18px}
.rm.done{background:#D8F6E9}
.rm.cur{border-color:var(--pink);background:#FFF0F7}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;background:#23263A;color:#fff;border-radius:12px;padding:4px 10px}

/* solver */
.palette{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.pal{width:62px;height:62px;border-radius:16px;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 2px #d9cfbd;display:flex;align-items:flex-end;justify-content:center;font-weight:900;font-size:13px;padding-bottom:3px;position:relative}
.pal.sel{transform:translateY(-4px);box-shadow:0 0 0 4px var(--pink),0 8px 0 rgba(0,0,0,.15)}
.pal .cnt{background:rgba(255,255,255,.9);color:#23263A;border-radius:999px;padding:0 6px;font-size:12px}
.pal .cnt.ok{background:#12B886;color:#fff}
.pal .cnt.over{background:#ff2d8a;color:#fff}
.pal.eraser{background:repeating-linear-gradient(45deg,#e7e9ee 0 8px,#fff 8px 16px)}
.net-big{max-width:430px;margin:6px auto}
.net-big rect[data-i]{cursor:pointer}
.net-big rect.ctr{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
.sol-now{display:flex;align-items:center;gap:12px;background:#F3F3FF;border-radius:18px;padding:12px;margin:10px 0}
.sol-now .big-chip{font-size:38px;font-weight:900;font-family:ui-rounded,system-ui,sans-serif;background:#fff;border-radius:14px;min-width:84px;text-align:center;padding:6px 10px;box-shadow:0 3px 0 #DADAF7}
.sol-now .fw{flex:1;font-size:18px;font-weight:800;line-height:1.4}
.sol-now .fw small{display:block;color:var(--muted);font-weight:600;font-size:14px}
.sol-list{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:4px}
.sol-list .mchip{cursor:pointer;font-size:16px}
.sol-group{width:100%;font-size:13px;font-weight:800;color:var(--pri);margin-top:6px}
.sol-ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.sol-ctrl .btn{padding:8px 4px;font-size:20px}
.errs{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.errs li{background:#FFF1DB;border-radius:12px;padding:8px 10px;font-weight:700;line-height:1.5}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:#F6EFE3}
.status-pill.ok{background:#D8F6E9;color:#0b6b4f}

/* pages */
.page-wrap{max-width:880px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.page-wrap h2{margin:0 0 6px}
.page-wrap p,.page-wrap li{line-height:1.75;font-size:16.5px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);border:2px solid #F1E7D6}
.bdg .bi{font-size:40px;display:block;filter:grayscale(1);opacity:.35}
.bdg.got .bi{filter:none;opacity:1}
.bdg b{display:block;margin-top:4px}
.bdg small{color:var(--muted)}
.principle{display:flex;gap:12px;align-items:flex-start;background:#FAF6EE;border-radius:16px;padding:12px}
.principle .pi{font-size:28px;flex:none}
.principle b{display:block;font-size:17px}
.principle p{margin:2px 0 0}
code,kbd{background:#F1ECFF;border-radius:6px;padding:1px 6px;font-size:.92em}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(35,38,58,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fadeIn .2s}
.welcome-card,.modal-card{background:#fff;border-radius:28px;padding:26px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
#welcome{background:radial-gradient(circle at 30% 20%,#FFE3B8,transparent 50%),radial-gradient(circle at 80% 90%,#DCE3FF,transparent 50%),var(--bg)}
.welcome-card h1{margin:6px 0 4px;font-size:34px;letter-spacing:1px}
.wc-mascot{width:150px;margin:0 auto;animation:bob 3s ease-in-out infinite}
.wc-sub{color:var(--muted);margin:0 0 20px;line-height:1.6;font-size:17px}
.wc-note{color:var(--muted);font-size:14px;margin:14px 0 0}
.modal-card{text-align:left}
.modal-card h2{margin:0 0 10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #F1E7D6;font-weight:700}
.set-row small{display:block;color:var(--muted);font-weight:500}
.switch{width:58px;height:34px;border-radius:999px;border:0;background:#DCD3C4;position:relative;flex:none}
.switch:after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on:after{left:28px}
.seg{display:flex;background:#F6EFE3;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:800}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.voice-warn{background:#FFF1DB;border-radius:14px;padding:12px;line-height:1.6;font-size:15px;text-align:left;margin-top:12px}
.cert{border:6px double #E0B000;border-radius:20px;padding:22px;text-align:center;background:linear-gradient(160deg,#FFFBEA,#FFF)}
.cert h2{font-size:28px;margin:6px 0}
.cert .who{font-size:30px;font-weight:900;color:var(--pri);border-bottom:3px dashed #E0B000;display:inline-block;min-width:200px;padding:4px 10px;margin:6px 0}
.cert input{font-size:22px;text-align:center;border:2px solid #E0B000;border-radius:12px;padding:6px;width:80%;font-family:inherit}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.mascot{display:block;width:100%;height:auto}

/* responsive: portrait / narrow */
@media (max-width:900px), (orientation:portrait){
  body{overflow:hidden}
  .play-wrap{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100%}
  .stage-col{position:relative}
  .cube-box{flex:none;height:min(50vh,560px)}
  .side-col{overflow:visible}
  #scr-play,#scr-solver{overflow:auto}
  .home-cards{grid-template-columns:1fr 1fr}
  .c-learn{grid-column:span 2}
}
@media (max-width:560px){
  .hero{flex-direction:column;text-align:center}
  .hero-mascot{width:110px}
  .hero-bubble:before{display:none}
  .home-cards{grid-template-columns:1fr}
  .c-learn{grid-column:auto}
  .brand-name{display:none}
  .controls{grid-template-columns:repeat(4,1fr)}
  .net-mini{width:112px}
  .m-btns{grid-template-columns:1fr}
  .map-node{width:100%}
  .hud-btn span{display:none}
}
@media print{
  body *{visibility:hidden}
  #modal,#modal *{visibility:visible}
  #modal{position:absolute;inset:0;background:#fff}
  .no-print{display:none!important}
}

/* v2: solver explanations + view pad */
.fig.cmp{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:8px auto 12px;text-align:left}
.fig.cmp div{display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:14px}
.fig.cmp i{display:block;font-style:normal;background:linear-gradient(90deg,#FFB020,#FF6A00);color:#fff;border-radius:8px;padding:4px 8px;white-space:nowrap;min-width:54px}
.fig.cmp div:last-child i{background:linear-gradient(90deg,#5B5BF7,#8B7CFF)}
.fig.route{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fig.route div{display:flex;flex-direction:column;align-items:center;background:#F6EFE3;border-radius:14px;padding:8px 10px;min-width:64px}
.fig.route div.stop{background:#FFF1C4;border:2px dashed #E0B000}
.fig.route b{font-size:28px}
.fig.route small{font-size:12px;line-height:1.3}
.fig.route i{font-style:normal;font-size:12px;font-weight:800;color:var(--pri);text-align:center}
.fig.safe{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:320px;margin:8px auto}
.fig.safe figcaption{width:100%}
.meters{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.meter{background:#FAF6EE;border-radius:14px;padding:8px 10px;border:2px solid transparent}
.meter.on{border-color:var(--pri);background:#F3F3FF}
.meter.ok{background:#E3F8EF}
.meter b{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.meter .mrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:5px}
.meter .mrow span{width:96px;flex:none;white-space:nowrap}
.meter .mrow em{font-style:normal;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.meter .mb{flex:1;height:9px;background:#E9E1D2;border-radius:999px;overflow:hidden}
.meter .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#8B7CFF);border-radius:999px;transition:width .35s}
.meter.ok .mb i,.meter .mb i.full{background:linear-gradient(90deg,var(--ok),#52D6A6)}
.why{border-radius:16px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.why p{margin:0;line-height:1.65;font-size:16px}
.why .wt{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:2px}
.why.k-up{background:#E3F8EF}.why.k-setup{background:#FFF7DD}.why.k-back{background:#FFEFF6}.why.k-goal{background:linear-gradient(135deg,#E3F8EF,#FFF6D6)}.why.k-next{background:#F1ECFF}.why.k-intro{background:#EEF3FF}
.why .wi{font-size:22px;flex:none;line-height:1.2}
.why .grow{flex:1;min-width:0}
.phase-tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:#EEE9FF;color:#4b3fd1;margin-left:6px;vertical-align:middle}
.phase-tag.p2{background:#D8F6E9;color:#0b6b4f}
.sol-group.p1{color:#4b3fd1}.sol-group.p2{color:#0b6b4f}
.mchip.p2:not(.cur):not(.done){border-color:#9FE3C6}
.view-pad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px;z-index:3}
.view-pad button{border:0;border-radius:12px;background:rgba(255,255,255,.92);font-size:18px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 rgba(35,38,58,.13);display:grid;place-items:center;padding:0}
.view-pad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,38,58,.13)}
.view-pad .vp-c{background:rgba(91,91,247,.14);font-size:16px;box-shadow:none}
.view-pad .vp-u{grid-column:2;grid-row:1}.view-pad .vp-l{grid-column:1;grid-row:2}.view-pad .vp-c{grid-column:2;grid-row:2}.view-pad .vp-r{grid-column:3;grid-row:2}.view-pad .vp-d{grid-column:2;grid-row:3}
.slides-modal .slide-body{font-size:17px}
.slides-modal{max-width:620px}
@media (max-width:560px){
  .view-pad{grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px)}
  .view-pad button{font-size:15px;border-radius:10px}
  .meters{grid-template-columns:1fr}
  .swipe-hint{bottom:132px}
}

/* v3: speedcubing lesson */
.fig.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;text-align:center}
.fig.recs figcaption{grid-column:1/-1;font-size:12px}
.rec{background:#FAF6EE;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.rec .ri{font-size:26px}
.rec b{font-size:24px;color:var(--pri);font-weight:900}
.rec em{font-style:normal;font-weight:700;font-size:13px;line-height:1.35}
.rec small{color:var(--muted);font-size:12px}
.fig.cfop{display:flex;flex-direction:column;gap:5px;max-width:340px;margin:8px auto 12px;text-align:left}
.fig.cfop div{display:flex;align-items:center;gap:10px;border-radius:12px;padding:6px 10px;border:2px solid #E6E0D4}
.fig.cfop b{font-size:24px;font-weight:900;width:26px;text-align:center;font-family:ui-rounded,system-ui,sans-serif}
.fig.cfop span{font-weight:800;flex:1}
.fig.cfop small{color:#5a5f70;font-weight:700;font-size:12px}
.fig.inspect{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.clock15{width:80px;height:80px;border-radius:50%;border:6px solid var(--pink);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--pink)}
.fig.inspect figcaption{width:100%}
.fig.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.fig.path span{border-radius:10px;padding:5px 8px;font-weight:800;font-size:13px;background:#F6EFE3}
.fig.path .pv0{background:#FFF1C4}.fig.path .pv4{background:#E5E6FF}
.fig.path i{font-style:normal;color:var(--muted)}
.cross-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.cross-board div{background:#FAF6EE;border-radius:14px;padding:8px;text-align:center}
.cross-board b{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.cross-board small{font-size:12px;font-weight:700;color:var(--muted)}
.cross-board .insp b{color:var(--pink)}
.cross-board .opt b{color:var(--pri)}
.cross-board .you b{color:var(--ok)}
.tps-big{font-size:44px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums}

/* v4: CFOP textbook */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.case-card{position:relative;background:#FAF6EE;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;border:2px solid #F1E7D6}
.case-card .cc-fig{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:6px}
.case-card .cc-fig svg{width:120px;height:auto}
.case-card > b{font-size:16px;padding-right:36px}
.case-card p{margin:0;font-size:14px;line-height:1.55;color:#4b5064}
.case-card .cc-alg{display:flex;flex-wrap:wrap;gap:4px}
.case-card .cc-alg .mchip{font-size:13px;padding:0 5px}
.case-card .cc-btns{display:flex;gap:6px;margin-top:auto}
.case-card .cc-btns .btn{flex:1}
.case-card .cc-spk{position:absolute;right:8px;top:8px}
.quiz p{margin:8px 0;font-size:16px}
.quiz-fig{display:flex;justify-content:center;margin:8px 0}
.quiz-fig svg{width:170px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-opts .btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.quiz-opts .btn.no{background:#FFD6E7}
.quiz-opts .btn[disabled]{opacity:1}
.map-chapter{display:flex;align-items:center;gap:12px;margin:14px 0 2px;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#FFF1C4,#FFE08A);font-weight:900;font-size:18px}
.map-chapter.cf{background:linear-gradient(135deg,#E5E6FF,#C7C9FF)}
.map-chapter small{display:block;font-weight:700;font-size:13px;color:#5a5f70}
.map-chapter .mc-ico{font-size:30px}
.roadmap.cf{grid-template-columns:repeat(3,1fr)}
.ctrl-extra{grid-column:1/-1;display:flex;gap:7px;align-items:center;background:#F1ECFF;border-radius:14px;padding:5px}
.ctrl-extra .ce-lbl{font-size:12px;font-weight:800;color:#4b3fd1;writing-mode:horizontal-tb;padding:0 4px}
.ctrl-extra .mv{flex:1;min-height:50px}

</style>

<body>
<div id="app">
  <header id="topbar">
    <button id="btnBack" class="icon-btn hidden" aria-label="返回">◀</button>
    <button class="brand" id="brand" aria-label="返主頁"><span class="brand-logo"></span><span class="brand-name">扭計骰小博士</span></button>
    <div id="topTitle"></div>
    <div class="top-right">
      <span class="star-total" title="你嘅星星">⭐ <b id="starTotal">0</b></span>
      <button id="btnMute" class="icon-btn" aria-label="自動讀出開關" title="自動讀出">🔊</button>
      <button id="btnSettings" class="icon-btn" aria-label="設定" title="設定">⚙️</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="scr-home" class="screen active">
      <div class="home-wrap">
        <div class="hero">
          <div class="hero-mascot" id="heroMascot"></div>
          <div class="hero-bubble">
            <p id="heroText">你好！我係<b>骰仔博士</b> 🎓<br>我會陪你由零開始，用「<b>思考</b>」嚟還原扭計骰！<br>唔使驚扭錯，每一步我都會幫你。</p>
            <div class="hero-spk" id="heroSpk"></div>
          </div>
        </div>
        <div class="home-cards">
          <button class="hcard c-learn" data-go="map"><span class="hc-ico">📚</span><b>一步一步學</b><small>由零開始・19 站・有語音</small></button>
          <button class="hcard c-play" data-go="practice"><span class="hc-ico">🎮</span><b>自由練習</b><small>打亂佢，教練陪你解</small></button>
          <button class="hcard c-solver" data-go="solver"><span class="hc-ico">🎨</span><b>填色解骰器</b><small>填上你個骰嘅顏色，計出最快解法</small></button>
          <button class="hcard c-badge" data-go="badges"><span class="hc-ico">🏅</span><b>我的獎章</b><small>睇吓你儲咗幾多粒星</small></button>
          <button class="hcard c-parent" data-go="parents"><span class="hc-ico">👨‍👩‍👧</span><b>家長・老師</b><small>設計理念、語音設定、上載 GitHub</small></button>
        </div>
        <p class="home-foot" id="homeFoot"></p>
      </div>
    </section>

    <!-- LESSON MAP -->
    <section id="scr-map" class="screen">
      <div class="map-wrap">
        <div class="map-intro card">
          <div class="mi-mascot" id="mapMascot"></div>

          <div id="mapSpk"></div>
        </div>
        <div class="map-path" id="mapPath"></div>
      </div>
    </section>

    <!-- PLAY (lessons + practice) -->
    <section id="scr-play" class="screen">
      <div class="play-wrap">
        <div class="stage-col">
          <div class="cube-box" id="cubeBox">

              <button class="hud-btn" id="btnBottom" title="睇底部">👀<span>睇底</span></button>

            </div>
            <div class="net-mini" id="netMini" title="展開圖：一次過睇晒 6 個面"></div>
            <div class="move-toast" id="moveToast"></div>
            <div class="toast" id="toast"></div>
            <div class="swipe-hint" id="swipeHint">👆 喺扭計骰上面掃一下就可以扭</div>
          </div>
          <div class="controls" id="controls"></div>
        </div>
        <aside class="side-col" id="sideCol"></aside>
      </div>
    </section>

    <!-- SOLVER -->
    <section id="scr-solver" class="screen">
      <div class="play-wrap">
        <div class="stage-col">
          <div class="cube-box" id="solverBox">

            <div class="hud-tr"><button class="hud-btn" id="sBtnView">🎯<span>返正</span></button><button class="hud-btn" id="sBtnBottom">👀<span>睇底</span></button></div>
            <div class="toast" id="sToast"></div>
            <div class="move-toast" id="sMoveToast"></div>
          </div>
          <div class="palette" id="palette"></div>
        </div>
        <aside class="side-col" id="solverSide"></aside>
      </div>
    </section>

    <!-- BADGES -->
    <section id="scr-badges" class="screen"><div class="page-wrap" id="badgesWrap"></div></section>

    <!-- PARENTS -->
    <section id="scr-parents" class="screen"><div class="page-wrap" id="parentsWrap"></div></section>
  </main>
</div>

      if (/Google/i.test(v.name)) sc += 2;
      if (/Sinji|Sin-ji|HiuGaai|HiuMaan/i.test(v.name)) sc += 1;
      if (sc > bestScore) { bestScore = sc; best = v; }

  function speechify(t) {

    t = t.replace(/(^|[^A-Za-z])([URFDLBxyz])(2|')?(?![A-Za-z])(?!\s*字)/g, function (m, pre, f, suf) {

  var Kociemba = {
    ready: false, p: null, worker: null, seq: 0, waits: {},
    init: function () {
      var self = this;
      if (this.p) return this.p;
      var src = $('#solverSrc').textContent;
      var tail = '\nvar __inited=false;self.onmessage=function(ev){var a=ev.data;if(a.cmd==="init"){if(!__inited){Cube.initSolver();__inited=true;}self.postMessage({cmd:"init"});}else if(a.cmd==="solve"){try{var c=Cube.fromString(a.cube);var s=c.solve();self.postMessage({cmd:"solve",id:a.id,alg:s});}catch(e){self.postMessage({cmd:"solve",id:a.id,error:String(e)});}}};';
      this.p = new Promise(function (res) {
        function mainThread() {
          self.worker = null;
          if (!window.Cube) { var s = document.createElement('script'); s.textContent = src; document.head.appendChild(s); }
          setTimeout(function () { window.Cube.initSolver(); self.ready = true; res(); }, 50);
        }
        try {
          var url = URL.createObjectURL(new Blob([src + tail], { type: 'text/javascript' }));
          var w = new Worker(url);
          var ok = false;
          w.onmessage = function (e) {
            var d = e.data;
            if (d.cmd === 'init') { ok = true; self.ready = true; res(); }
            if (d.cmd === 'solve' && self.waits[d.id]) { self.waits[d.id](d); delete self.waits[d.id]; }
          };
          w.onerror = function () { if (!ok) mainThread(); };
          w.postMessage({ cmd: 'init' });
          self.worker = w;
        } catch (e) { mainThread(); }
      });
      return this.p;
    },
    solve: function (str) {
      var self = this;
      return this.init().then(function () {
        if (!self.worker) {
          return new Promise(function (res) { setTimeout(function () { try { res({ alg: window.Cube.fromString(str).solve() }); } catch (e) { res({ error: String(e) }); } }, 30); });
        }
        return new Promise(function (res) { var id = ++self.seq; self.waits[id] = res; self.worker.postMessage({ cmd: 'solve', id: id, cube: str }); });
      });
    }
  };

  function validateColors(st) {

    if (unknown) { errs.push('仲有 <b>' + unknown + '</b> 格未填色。要填晒 54 格先可以計㗎！'); return { errs: errs, bad: st.map(function (c, i) { return c === '?' ? i : -1; }).filter(function (i) { return i >= 0; }) }; }

      errs.push('仲有 <b>' + (cnt.W - 9) + '</b> 格未填色（佢哋而家係白色）：' + short.join('、') + '。繼續填啦，就快得喇！');

      else if (n !== 9) errs.push(COLOR_ZH[c] + '有 <b>' + n + '</b> 格（應該要啱啱好 9 格）。');

      if (found < 0) { errs.push('有一粒邊塊係「' + COLOR_ZH[a] + ' + ' + COLOR_ZH[b] + '」，但係真嘅扭計骰冇呢個組合（' + (a === b ? '同一隻色唔會喺同一粒' : '呢兩隻係相對面嘅顏色') + '）。'); bad = bad.concat(f); continue; }

    }
    for (var k = 0; k < 8; k++) {
      var cf = M.CORNERS[k], cols = cf.map(function (x) { return st[x]; }), fc = -1, ori = 0, mirror = false;
      for (var q = 0; q < 8; q++) {

        } else {
          var st = an.steps[i - 1];
          html += '<div class="why k-' + st.kind + '"><span class="wi">' + ICO[st.kind] + '</span><div class="grow"><div class="wt">點解要咁轉？第 ' + i + ' 步 ' + esc(st.move) + '・' + LBL[st.kind] + '</div><p>' + esc(st.text) + '</p>' + (st.good.length ? '<p style="font-size:13px;color:var(--muted);margin-top:4px">✨ 閃動嘅格仔＝呢步整好咗嘅小方塊</p>' : '') + '</div><span id="whySpk"></span></div>';
        }
        if (i < n) {
          var nx = an.steps[i];
          html += '<div class="why k-next"><span class="wi">👉</span><div class="grow"><div class="wt">下一步 ' + esc(nx.move) + ' 會點？</div><p>' + esc(nx.short) + '</p></div></div>';
        }
        $('#solWhy').innerHTML = html;
        var sp = spk(function () {
          if (self.idx === 0) return $('#solWhy .k-intro p').textContent;
          var s2 = self.an.steps[self.idx - 1]; return '第' + self.idx + '步，' + s2.move + '。' + s2.text;
        }, 'small');
        $('#whySpk').appendChild(sp);
        $('#solMeters').innerHTML = this.meterHTML(an.infos[i], i);
      }
      if (this.groups) {
        var g = null; this.groups.forEach(function (x) { if (x.at <= i) g = x; });
        if (g) $('#solThink').innerHTML = '<div class="thought t-see" style="margin-top:10px"><div class="th-ico">👀</div><div class="th-body"><b>第 ' + g.stage + ' 步・' + esc(CO.STAGE_NAMES[g.stage]) + '</b><p>' + esc(g.see) + '</p></div></div><div class="thought t-think" style="margin-top:8px"><div class="th-ico">🤔</div><div class="th-body"><b>我諗到</b><p>' + esc(g.think) + '</p></div></div>';
      }
    },
    backToEdit: function () { this.stopAuto(); this.mode = 'paint'; this.view.hardSet(this.state); this.view.clearArrow(); this.renderEdit(); }
  };

  /* =====================================================================
     BOOT
     ===================================================================== */
  function boot() {
    $('.brand-logo').innerHTML = mascotSVG();
    $('#heroMascot').innerHTML = mascotSVG();
    $('#mapMascot').innerHTML = mascotSVG();
    $('#wcMascot').innerHTML = mascotSVG('', 'wow');
    $('#heroSpk').appendChild(spk(function () { return $('#heroText').textContent; }));
    $$('[data-go]').forEach(function (b) { b.onclick = function () { Sfx.unlock(); Nav.go(b.dataset.go); }; });
    $('#btnBack').onclick = function () { Nav.back(); };
    $('#brand').onclick = function () { Nav.go('home'); };
    $('#btnSettings').onclick = openSettings;
    $('#btnMute').onclick = function () { Store.s.autoRead = !Store.s.autoRead; Store.save(); updateMuteBtn(); if (!Store.s.autoRead) Voice.stop(); toast(Store.s.autoRead ? '🔊 自動讀出：開' : '🔈 自動讀出：關'); };
    updateMuteBtn(); refreshStars(); renderHome();
    try { Play.init(); Solver.init(); } catch (e) { console.error(e); $('#heroText').innerHTML = '⚠️ 3D 引擎啟動唔到：' + esc(e.message) + '<br>請用新版 Safari / Chrome / Edge 開。'; }
    renderParents();
    Voice.onChange(function () { if (Nav.cur === 'parents') renderParents(); });
    $('#btnStart').onclick = function () {
      Sfx.unlock(); Voice.unlock();
      $('#welcome').classList.remove('show');
      setTimeout(function () { Voice.auto($('#heroText').textContent, $('#heroSpk .spk')); }, 200);
      setTimeout(function () {
        Voice.pick();
        if (!Voice.hasCantonese && !Store.data.noVoiceWarn) {
          var c = modal('<h2>🔈 搵唔到廣東話聲音</h2><p>你部機暫時未有廣東話語音，所以讀出嚟可能唔係廣東話（或者冇聲）。</p><div class="voice-warn"><b>iPad：</b>設定 → 輔助使用 → 語音內容 → 聲音 → 中文 → 中文（香港）<br><b>Windows：</b>用 Microsoft Edge 開呢個檔案<br><b>Chrome：</b>通常有「Google 粵語（香港）」</div><div class="row" style="margin-top:14px"><button class="btn" id="vwNo" style="flex:1">唔再提我</button><button class="btn pri" id="vwOk" style="flex:1">知道喇</button></div>');
          $('#vwOk', c).onclick = closeModal;
          $('#vwNo', c).onclick = function () { Store.data.noVoiceWarn = true; Store.save(); closeModal(); };
        }
      }, 2500);
      setTimeout(function () { Kociemba.init(); }, 4000);
    };
    window.addEventListener('beforeunload', function () { Voice.stop(); });
    // expose for debugging/tests
    window.__app = { Play: Play, Brain: Brain, Missions: Missions, Solver: Solver, Nav: Nav, Gen: Gen, validateColors: validateColors, Kociemba: Kociemba };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
