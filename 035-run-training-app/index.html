<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e88e5">
<title>小飛人跑步學堂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>:root{
  --sky:#1e88e5; --sky2:#64b5f6; --sun:#ffca28; --coral:#ff7043; --mint:#26a69a; --ink:#17324d; --ink2:#46607a;
  --card:#ffffff; --bg:#eaf5ff; --ok:#2e7d32; --bad:#d32f2f; --line:#dbe7f3;
  --r:20px; --shadow:0 10px 30px rgba(20,50,90,.18);
  --font:"PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
  --panelW:410px; --panelH:46vh; --top:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block}
.hidden{display:none!important}

/* ---------- 頂部 ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:var(--top);padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
.tb{height:42px;min-width:42px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb.wide{font-size:15px;font-weight:700}
.tb:active{transform:scale(.95)}
#crumb{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
#voiceBox{display:flex;align-items:center;gap:6px}
.vdot{width:12px;height:12px;border-radius:50%;background:#b0bec5;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.vdot.on{background:#43a047;animation:pulse 1s infinite}
.vdot.paused{background:#ffa000}
#btnPause.paused{background:#fff3e0;color:#e65100}
@keyframes pulse{50%{transform:scale(1.35)}}

/* ---------- 工具列 ---------- */
#toolbar{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(var(--top) + 4px);display:flex;flex-direction:column;gap:8px;z-index:20}
#toolbar button{min-width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:19px;padding:0 8px;display:flex;align-items:center;gap:4px}
#toolbar button b{font-size:13px}
#toolbar button.on{background:#fff59d;box-shadow:0 0 0 3px #fbc02d inset}

/* ---------- 方向掣 ---------- */
#navpad{position:absolute;z-index:20;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:5px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));opacity:.9}
#navpad button{border-radius:12px;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:17px;font-weight:800}
#navpad button:active,#navpad button.held{background:#ffe082}
#navpad .np-c{font-size:16px}

/* ---------- 課堂面板 ---------- */
#panel{position:absolute;z-index:25;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
body.land #panel{top:calc(var(--top) + 4px);right:max(10px,env(safe-area-inset-right));bottom:12px;width:var(--panelW);border-radius:var(--r)}
body.port #panel{left:0;right:0;bottom:0;height:var(--panelH);border-radius:var(--r) var(--r) 0 0;padding-bottom:env(safe-area-inset-bottom)}
#panel.collapsed{height:auto!important;bottom:auto}
body.port #panel.collapsed{bottom:0;top:auto}
#panel.collapsed #panelBody,#panel.collapsed #panelFoot{display:none}
body.land #navpad{right:calc(var(--panelW) + 22px)}
body.land.collapsed-panel #navpad{right:max(12px,env(safe-area-inset-right))}
body.port #navpad{bottom:calc(var(--panelH) + 10px)}
body.port.collapsed-panel #navpad{bottom:70px}
#panelHead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.mini{width:34px;height:34px;border-radius:10px;background:#eef4fb;font-size:18px}
#stepDots{flex:1;display:flex;gap:4px;flex-wrap:wrap}
#stepDots i{width:10px;height:10px;border-radius:5px;background:#d5e3f1;display:block}
#stepDots i.done{background:#90caf9}
#stepDots i.cur{background:var(--sky);width:22px}
#stepCount{font-size:13px;color:var(--ink2);font-weight:700}
#panelBody{flex:1;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
#panelFoot{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.navb{flex:1;height:52px;border-radius:16px;background:#eef4fb;font-size:17px;font-weight:800}
.navb.primary{background:linear-gradient(180deg,#42a5f5,#1e88e5);color:#fff;box-shadow:0 4px 0 #1565c0}
.navb.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #1565c0}
.navb.glow{animation:glow 1.1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,202,40,.7),0 4px 0 #1565c0}}
.navb:disabled{opacity:.4}

h2.st{font-size:21px;margin:2px 0 10px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
h2.st .tx{flex:1}
.para{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:8px 10px;border-radius:14px;background:#f6faff;font-size:17px;line-height:1.65;transition:background .3s}
.para .tx{flex:1}
.para.speaking{background:#fff8d6;box-shadow:0 0 0 2px #ffd54f inset}
.para .ck.now{background:#ffe082;border-radius:4px}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:#e3f2fd;font-size:17px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #bbdefb}
.spk:active{transform:scale(.92)}
.spk.on{background:#ffca28;animation:pulse 1s infinite}
.tip{display:flex;gap:8px;align-items:flex-start;margin:6px 0 10px;padding:10px 12px;border-radius:14px;background:#e8f5e9;border-left:5px solid #43a047;font-size:16px;line-height:1.6}
.tip .tx{flex:1}
.tip b{color:#2e7d32}
.cmp-legend{display:flex;gap:10px;margin:2px 0 10px;font-size:14px;font-weight:700}
.cmp-legend span{padding:4px 10px;border-radius:20px}
.cmp-legend .g{background:#e8f5e9;color:var(--ok)} .cmp-legend .b{background:#ffebee;color:var(--bad)}

/* 任務 */
.task{margin:10px 0;padding:12px;border-radius:16px;background:#fff8e1;border:2px dashed #ffca28;text-align:center}
.task .big{font-size:17px;font-weight:800;padding:12px 18px;border-radius:16px;background:linear-gradient(180deg,#ffd54f,#ffb300);box-shadow:0 4px 0 #f57f17;margin:4px}
.task .big:active{transform:translateY(2px);box-shadow:0 2px 0 #f57f17}
.task.done{background:#e8f5e9;border-color:#66bb6a}
.timer{position:relative;width:120px;height:120px;margin:6px auto}
.timer svg{transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.timer .lab{position:absolute;left:0;right:0;bottom:-4px;font-size:13px;font-weight:700;color:var(--ink2)}
.breath{width:150px;height:150px;margin:8px auto;border-radius:50%;background:radial-gradient(circle,#f8bbd0,#ec407a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900;transform:scale(.55);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.check{display:grid;gap:6px;text-align:left}
.check label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.check input{width:24px;height:24px;accent-color:#43a047}

/* 測驗 */
.quiz{margin:6px 0}
.quiz .q{font-size:18px;font-weight:800;margin:6px 0 10px;display:flex;gap:8px;align-items:flex-start}
.quiz .q .tx{flex:1}
.opt{display:flex;width:100%;text-align:left;align-items:center;gap:10px;margin:8px 0;padding:12px 14px;border-radius:14px;background:#f1f6fc;font-size:17px;font-weight:600;border:2px solid transparent}
.opt .n{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.opt.right{background:#e8f5e9;border-color:#43a047}
.opt.wrong{background:#ffebee;border-color:#e57373;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{padding:10px 12px;border-radius:14px;font-size:16px;line-height:1.6;display:flex;gap:8px}
.fb.ok{background:#e8f5e9} .fb.no{background:#fff3e0}
.fb .tx{flex:1}

/* 視覺圖 */
.vis{margin:8px 0 12px;padding:10px;border-radius:14px;background:#f6faff}
.vis h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.vis h4 .tx{flex:1}
.week{display:grid;gap:6px}
.wd{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:12px;background:#fff}
.wd .d{width:34px;height:34px;border-radius:10px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.wd .nm{font-weight:800;font-size:15px}
.wd .it{font-size:13px;color:var(--ink2);line-height:1.5}
.wd.today{box-shadow:0 0 0 3px #ffca28}
.bar{display:flex;align-items:flex-end;gap:4px;height:110px;padding:6px 4px;border-bottom:2px solid #b0bec5}
.bar div{flex:1;border-radius:6px 6px 0 0;position:relative}
.bar div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.legend{font-size:13px;color:var(--ink2);margin-top:24px;line-height:1.6}
.effort{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.effort div{height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.effort div small{font-size:10px}
.urine{display:flex;gap:4px}
.urine div{flex:1;height:44px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:3px;font-weight:700}
.day{display:grid;gap:4px}
.day div{display:flex;gap:10px;font-size:14px;padding:6px 8px;background:#fff;border-radius:10px}
.day b{width:54px;flex:none;color:var(--sky)}

/* ---------- 物件資訊卡 ---------- */
#infoCard{position:absolute;z-index:28;left:50%;transform:translateX(-50%);top:calc(var(--top) + 8px);max-width:min(520px,86vw);background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;border:3px solid #ffca28;animation:pop .35s}
body.land #infoCard{left:calc(50% - var(--panelW)/2)}
#infoCard .tx{flex:1}
#infoCard b{display:block;font-size:17px;margin-bottom:2px}
#infoCard .q{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;background:#fff3e0;color:#e65100}
#infoCard .q.now{background:#e8f5e9;color:#2e7d32}
#infoCard .x{width:30px;height:30px;border-radius:50%;background:#eee;font-size:14px}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}

/* ---------- 3D 標籤 / 對白泡泡 ---------- */
#labels{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);padding:4px 10px;border-radius:12px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.lbl.g{background:#e8f5e9;color:var(--ok);border:2px solid #66bb6a}
.lbl.b{background:#ffebee;color:var(--bad);border:2px solid #e57373}
.lbl.y{background:#fffde7;color:#8d6e00;border:2px solid #fbc02d;font-size:12px}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:min(300px,60vw);background:#fff;border-radius:18px;padding:9px 12px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:15px;line-height:1.5;pointer-events:auto;display:flex;gap:8px;align-items:flex-start;border:2px solid #90caf9}
.bubble:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .who{font-size:12px;font-weight:900;color:var(--sky)}
.bubble .tx{flex:1}
.bubble .spk{width:30px;height:30px;font-size:14px}
.bubble.kid{border-color:#ffcc80}

/* ---------- 覆蓋頁 ---------- */
#overlay{position:absolute;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 6px) max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
#overlay.dim{background:linear-gradient(180deg,rgba(234,245,255,.55),rgba(234,245,255,.92) 40%)}
.wrap{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hero h1{margin:0;font-size:clamp(26px,4.4vw,42px);line-height:1.15;background:linear-gradient(90deg,#1565c0,#ef6c00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;font-size:16px;color:var(--ink2)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{position:relative;text-align:left;padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(20,60,100,.12);display:flex;gap:12px;align-items:center;min-height:88px;border:3px solid transparent;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ic{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.card .t{font-weight:900;font-size:17px}
.card .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.card .no{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:#90a4ae}
.card .star{position:absolute;bottom:8px;right:10px;font-size:18px}
.card.next{border-color:#ffca28;animation:glowc 1.6s infinite}
@keyframes glowc{50%{box-shadow:0 0 0 6px rgba(255,202,40,.35),0 6px 18px rgba(20,60,100,.12)}}
.sec{margin:20px 0 10px;font-size:19px;font-weight:900;display:flex;gap:8px;align-items:center}
.sec .tx{flex:1}
.box{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(20,60,100,.1);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:12px 18px;border-radius:16px;background:#eef4fb;font-size:17px;font-weight:800;border:3px solid transparent}
.pill.on{background:#e3f2fd;border-color:var(--sky)}
.go{padding:16px 28px;border-radius:20px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff8a65,#f4511e);box-shadow:0 5px 0 #bf360c}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #bf360c}
.inp{font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-family:inherit;width:100%;max-width:280px;-webkit-user-select:text;user-select:text}
.warn{background:#fff3e0;border-left:5px solid #ff9800;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.6}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{width:96px;text-align:center;padding:10px 6px;border-radius:16px;background:#f5f5f5;font-size:12px;font-weight:800;color:#9e9e9e}
.badge .e{font-size:34px;filter:grayscale(1);opacity:.4}
.badge.got{background:#fff8e1;color:#8d6e00}
.badge.got .e{filter:none;opacity:1}
.chart{width:100%;height:170px}
.close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:20px;z-index:2}

/* ---------- 遊戲 HUD ---------- */
#hud{position:absolute;inset:0;z-index:22;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-top{position:absolute;top:calc(var(--top) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.hud-chip{background:rgba(255,255,255,.94);border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.hud-bottom{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;padding:0 12px;flex-wrap:wrap}
.hbtn{min-width:120px;height:92px;border-radius:26px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(180deg,#42a5f5,#1e88e5);box-shadow:0 6px 0 #1565c0;touch-action:none}
.hbtn.l{background:linear-gradient(180deg,#66bb6a,#43a047);box-shadow:0 6px 0 #2e7d32}
.hbtn.r{background:linear-gradient(180deg,#ffa726,#fb8c00);box-shadow:0 6px 0 #e65100}
.hbtn.red{background:linear-gradient(180deg,#ef5350,#e53935);box-shadow:0 6px 0 #b71c1c}
.hbtn.sm{min-width:86px;height:70px;font-size:17px}
.hbtn.on{outline:5px solid #ffeb3b}
.hbtn:active,.hbtn.press{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.hbtn:disabled{opacity:.35}
.meter{width:min(340px,70vw);height:22px;border-radius:12px;background:rgba(255,255,255,.8);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative}
.meter i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#ef5350,#ffca28 35%,#66bb6a 70%);transition:width .15s}
.meter span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.bigmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(34px,7vw,68px);font-weight:900;color:#fff;text-shadow:0 4px 0 #1565c0,0 0 20px rgba(0,0,0,.3);white-space:nowrap;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(211,47,47,.6);opacity:0;transition:opacity .4s}

#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%) translateY(20px);background:#17324d;color:#fff;padding:12px 20px;border-radius:18px;font-size:18px;font-weight:800;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:61;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#loading{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#90caf9,#e3f2fd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:800;color:#1565c0;transition:opacity .5s}
.ld-runner{font-size:64px;animation:run .5s infinite alternate}
@keyframes run{to{transform:translateX(30px) rotate(-6deg)}}

@media (max-width:700px){
  :root{--top:54px}
  .tb.wide{font-size:13px;padding:0 8px}
  #crumb{font-size:14px;max-width:38vw}
  .para{font-size:16px}
  h2.st{font-size:19px}
  #navpad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px}
  .hbtn{min-width:100px;height:80px;font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <header id="topbar">

縮細。兩隻手指一齊拖，就可以移動畫面。","畫面右下角有方向掣，可以前、後、左、右、上、下咁行。試吓轉去睇小飛對腳！"],demo:{run:"jog",cam:"threeq",coach:"point"}},{t:"撳一撳，有驚喜！",p:["3D 入面好多嘢都撳得：寶箱會打開、雪糕筒會彈起、水樽個蓋會掀起，連小飛身上嘅肌肉都撳得！","有啲嘢仲可以用手指拖住郁，例如雪糕筒。依家試吓撳一撳旁邊嗰個寶箱。"],demo:{run:"stand",cam:"threeq",props:["chest","cones","bottle"],coach:"point"},task:{type:"tap",target:"chest",label:"撳一撳寶箱 🎁"}},{t:"小喇叭同暫停掣",p:["每段字旁邊都有一個小喇叭，撳一下就會用廣東話讀出嚟。","你轉角度、放大縮細，老師都會繼續講，唔會停。想停嘅話，就撳上面嘅「暫停語音」掣。","撳物件嘅講解會即刻出喺畫面，等老師講完先至讀出嚟，咁就唔會亂晒。"],demo:{run:"stand",cam:"home",coach:"talk"}},{t:"點樣學得最好？",p:["第一，一次學一樣嘢就夠，唔使貪心。第二，學完即刻起身試吓做，身體記得最快。","第三，睇示範嗰陣，留意綠色剔號係啱嘅做法，紅色交叉係唔啱嘅做法，比較吓有咩唔同。","第四，聽日再嚟溫多次，重溫會令你記得更加實。準備好未？我哋去第一站：跑步心法！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}}]},{id:"mind",icon:"🧠",title:"跑步心法",sub:"個心同身體一齊練",color:"#ec407a",steps:[{t:"個心同身體，係一齊練㗎",p:["有人以為要先練好個心，個人先至可以練。其實唔係咁㗎！個心同身體係一齊大、一齊進步嘅。","每一次你準時嚟練習、試吓新動作、攰嗰陣都完成最後一組，你個心就已經練緊。","所以唔使等「準備好」先開始。開始咗，信心就會慢慢生出嚟。"],tip:"信心唔係等返嚟，係「做」返嚟嘅。",demo:{run:"jog",cam:"threeq",coach:"talk"}},{t:"神奇嘅兩隻字：「仲未」",p:["如果你話「我跑唔快」，可以加兩隻字：「我仲未跑得快」。","「仲未」即係話：我依家未得，但係我練緊，遲啲就得。科學家發現，咁樣諗嘅小朋友會更加肯練習，進步更快。","做錯唔緊要，錯咗就係話畀你知下次可以點樣改，個腦會因為咁而變得更勁。"],demo:{run:"think",cam:"upper",coach:"talk"}},{t:"同自己比，唔好同人比",p:["每個人嘅身高、年紀、練咗幾耐都唔同，所以同人比冇咩意思。","最好係同「昨日嘅自己」比：今日快咗零點一秒？今日跑多咗一個燈柱？呢啲都係進步！","你最好嘅成績叫做「個人最佳」，英文叫 PB。每次打破自己嘅紀錄，就值得慶祝。"],tip:"喺「我的進步」頁可以記低你嘅紀錄，睇住條線向上升。",demo:{run:"jog",cam:"side",coach:"thumbs"}},{t:"專心：一次諗一樣嘢",p:["跑步嗰陣，個腦唔可以諗晒所有嘢。揀一個「提示字」就夠，例如「推地」、「手肘向後」或者「放鬆」。","如果你發覺自己諗咗第二啲嘢，例如望人、擔心輸，唔緊要，喺心入面講一聲「返嚟」，再諗返你個提示字。","對眼望住前面嘅目標，例如終點線，或者前面嗰支燈柱。"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.6}},{t:"同自己講好說話",p:["我哋個腦入面成日有把聲。如果把聲講「我唔得㗎喇」，雙腳都會軟晒。","試吓換成：「我得㗎！」「放鬆，快！」「一步一步嚟！」「我練過㗎！」","揀一句你最鍾意嘅，攰嗰陣喺心入面講三次。呢個叫做「自我對話」，奧運選手個個都用。"],demo:{run:"cheer",cam:"upper",coach:"thumbs"}},{t:"呼吸定驚法：聞花、吹蠟燭",p:["比賽之前緊張，心跳得好快，係正常㗎，代表你個身體準備緊！","用鼻慢慢吸氣，好似聞一朵好香嘅花，數一、二、三、四。再用口慢慢呼氣，好似吹熄生日蠟燭，數一、二、三、四。","做三至五次，你會覺得個心靜咗。依家撳下面個掣，跟住個圈圈一齊做。"],demo:{run:"breathe",cam:"upper",coach:"breathe"},task:{type:"breath",cycles:4,label:"開始呼吸練習 🌸"}},{t:"閉埋眼「睇」自己跑",p:["閉埋眼，想像自己企喺起點，聽到槍聲，雙腳用力推地衝出去，手擺得好有力，越跑越順，最後衝過終點線。","呢個叫做「想像練習」。個腦好似睇咗一次真嘅示範，到你真係跑嗰陣，身體就會更加識做。","每晚瞓覺前，閉埋眼想像一次就夠。"],demo:{run:"eyesClosed",cam:"upper",coach:"talk"},task:{type:"timer",secs:20,label:"閉埋眼想像 20 秒 👀"}},{t:"小測驗：心法",quiz:[{q:"你今次 50 米跑輸咗畀同學，最好點諗？",o:["我好差，唔想跑喇","我仲未跑得快，但係我練緊","一定係對鞋唔好"],a:1,ex:"加「仲未」兩隻字，代表你會繼續進步！"},{q:"跑步嗰陣，個腦應該諗幾多樣嘢？",o:["越多越好","一個提示字就夠","乜都唔好諗"],a:1,ex:"揀一個提示字，例如「推地」或者「放鬆」，專心做好佢。"},{q:"要等個心完全準備好先開始練習，啱唔啱？",o:["啱，一定要等","唔啱，心同身體係一齊練、一齊進步"],a:1,ex:"開始咗，信心就會慢慢跟住嚟。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"warm",icon:"🔥",title:"熱身",sub:"郁起身先，唔好冷車開跑",color:"#ff7043",steps:[{t:"點解要熱身？",p:["你個身體好似一部車，冷車即刻開到最快，好容易壞。熱身就係慢慢預熱部車。","熱身會令心跳快啲、肌肉暖啲、軟啲，關節好似加咗油咁順，跑得快之餘又唔易受傷。","跑步前做「郁動式熱身」：一路郁一路熱。[[大約 8 至 10 分鐘|大約 10 至 15 分鐘]]就夠。靜止咁拉筋留返跑完先做。"],tip:"熱身做完，應該覺得身體暖咗、少少出汗，但唔攰。",demo:{run:"jogInPlace",cam:"threeq",coach:"talk"}},{t:"① 輕鬆慢跑",p:["慢慢跑，慢到可以同朋友傾偈都唔會喘。喺海旁，可以由一支燈柱跑去下一支燈柱，再慢慢跑返轉頭。","[[跑大約 2 至 3 分鐘|跑大約 3 至 5 分鐘]]。手放鬆擺，望前面。"],demo:{run:"jog",cam:"side",coach:"talk"},task:{type:"timer",secs:60,label:"原地慢跑 60 秒 🏃"}},{t:"② 手臂畫圈",p:["雙手伸直打開，好似飛機翼咁。先向前細細個圈，再慢慢畫大圈，然後向後畫。","向前 10 次，向後 10 次。熱完膊頭，擺手就會擺得順。"],demo:{run:"armCircles",cam:"front",coach:"talk",hl:["shoulder"]},task:{type:"timer",secs:30,label:"手臂畫圈 30 秒"}},{t:"③ 前後擺腿",p:["一隻手扶住欄杆或者牆，企直身，外面嗰隻腳好似鐘擺咁前後擺。","由細細擺開始，慢慢擺高啲。身體企直，唔好跟住隻腳搖。每邊 10 下。"],demo:{run:"legSwing",cam:"side",coach:"talk",hl:["hamstring","hipflexor"],props:["wall"]},task:{type:"timer",secs:20,sides:2,label:"擺腿：每邊 20 秒"}},{t:"④ 高抬腿",p:["原地或者慢慢向前，膝頭輪流抬高到差唔多同腰一樣高，腳尖勾起，用前腳掌輕輕落地。","手肘彎住，前後擺。想像地下好熱，要快快提腳！做 [[15|20]] 米，或者原地 20 秒。"],demo:{run:"highKnees",cam:"side",coach:"talk",hl:["hipflexor"]},task:{type:"timer",secs:20,label:"高抬腿 20 秒"}},{t:"⑤ 踢屁股",p:["膝頭向下，腳跟輪流向後踢去碰自己個屁股。","身體企直，用前腳掌落地，節奏要快。熱咗大腿前面嘅肌肉，跑步收腳就會快啲。"],demo:{run:"buttKicks",cam:"side",coach:"talk",hl:["hamstring","quad"]},task:{type:"timer",secs:20,label:"踢屁股 20 秒"}},{t:"⑥ 弓步行",p:["向前踏一大步，後面個膝頭慢慢落到差唔多掂地，前面個膝頭唔好超過腳尖太多。","身體企直，再起身踏另一隻腳。行 [[6|10]] 步。"],demo:{run:"lunges",cam:"side",coach:"talk",hl:["quad","glute","hipflexor"]},task:{type:"timer",secs:30,label:"弓步行 30 秒"}},{t:"⑦ A 步（跑步技術操）",p:["A 步係短跑選手每日都做嘅練習。一隻膝頭抬高，腳尖勾起，然後用前腳掌「啪」一聲踩落身體下面。","先慢慢「行」，叫 A 踏步；熟咗就加跳，叫 A 跳步。手同腳要相反：左腳上，右手向前。"],demo:{run:"aMarch",cam:"side",coach:"talk",hl:["hipflexor","calf"]},task:{type:"timer",secs:30,label:"A 踏步 30 秒"}},{t:"⑧ 腳踝彈跳",p:["雙腳併埋，用前腳掌好似彈簧咁原地細細跳。膝頭差唔多伸直，腳踝要「硬淨」，好似彈彈波。","落地要靜，好似貓仔咁。呢個練習會令你跑步嗰陣更加彈、重心更加高。跳 [[10|15]] 下。"],demo:{run:"pogo",cam:"side",coach:"talk",hl:["calf","achilles"],com:!0},task:{type:"timer",secs:15,label:"腳踝彈跳 15 秒"}},{t:"⑨ 加速跑",p:["熱身最後一樣：加速跑。由慢慢跑開始，越跑越快，去到大約七至八成快，再慢慢停。","跑大約 [[30|40 至 60]] 米，做兩至三次，每次行返轉頭休息。做完，你個身體就準備好去跑快喇！"],demo:{run:"accelToSprint",cam:"sideFar",coach:"point",travel:!0}},{t:"小測驗：熱身",quiz:[{q:"跑步之前應該做邊種熱身？",o:["坐喺度拉筋 5 分鐘","郁動式熱身：慢跑、擺腿、高抬腿","唔使熱身"],a:1,ex:"跑步前要一路郁一路熱，靜止拉筋留返跑完先做。"},{q:"熱身做完應該覺得點？",o:["暖咗、少少汗、唔攰","攰到唔想郁","同未做一樣凍"],a:0,ex:"熱身係預熱部車，唔係用晒啲油。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"stretch",icon:"🧘",title:"拉筋放鬆",sub:"跑完要好好照顧肌肉",color:"#26a69a",steps:[{t:"拉筋嘅規則",p:["跑完步先慢慢行或者慢跑三至五分鐘，等心跳慢落嚟，然後先拉筋。","每個拉筋停住 [[15 至 20|20 至 30]] 秒，慢慢呼吸。感覺應該係「緊緊地、但係舒服」，唔可以痛。","唔好彈、唔好扯，好似拉橡筋糖咁慢慢拉。左右兩邊都要做。"],tip:"撳小飛身上嘅肌肉，可以睇吓佢叫咩名、做咩用。",demo:{run:"breathe",cam:"threeq",coach:"talk",muscle:!0}},{t:"① 小腿拉筋",p:["雙手扶住欄杆或者牆，一隻腳向後踏，後腳伸直，腳跟貼實地，腳尖向前。","身體慢慢向前傾，你會覺得後面隻腳嘅小腿緊緊地。小腿係你嘅彈弓，用前腳掌跑步嗰陣佢好辛苦，要好好拉一拉。"],demo:{run:"calfStretch",cam:"side",muscle:!0,hl:["calf","achilles"],props:["wall"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"小腿：每邊 20 秒"}},{t:"② 大腿前面",p:["企直，一隻手捉住同一邊隻腳嘅腳背，將腳跟拉近屁股。兩個膝頭盡量貼埋，向下指。","企唔穩可以用另一隻手扶住欄杆。唔好彎腰，個肚要收住。"],demo:{run:"quadStretch",cam:"side",muscle:!0,hl:["quad"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"大腿前面：每邊 20 秒"}},{t:"③ 大腿後面",p:["一隻腳向前放，腳跟掂地、腳尖勾起，膝頭伸直。後面隻腳微微屈膝。","背脊保持直，好似一塊板咁，由屁股開始向前摺，雙手放喺大腿上面。你會覺得前面隻腳嘅大腿後面拉緊。"],tip:"大腿後面嘅肌肉係短跑嘅「扒地」肌肉，好重要！",demo:{run:"hamStretch",cam:"side",muscle:!0,hl:["hamstring"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"大腿後面：每邊 20 秒"}},{t:"④ 跪低弓步：髖屈肌",p:["一隻膝頭跪喺地（可以墊條毛巾），另一隻腳喺前面踩地，膝頭屈成直角。","身體企直，屁股慢慢向前推，雙手可以舉高。你會覺得跪低嗰隻腳嘅大腿頂、近個肚嗰度拉緊。呢度係負責抬膝頭嘅肌肉。"],demo:{run:"hipFlexorStretch",cam:"side",muscle:!0,hl:["hipflexor","quad"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"髖屈肌：每邊 20 秒"}},{t:"⑤ 屁股拉筋（4 字拉筋）",p:["瞓喺地下，雙膝屈起。將一隻腳嘅腳踝擱喺另一隻腳嘅膝頭上面，好似一個「4」字。","然後雙手捉住底下嗰隻大腿，慢慢拉近心口。你會覺得屁股入面拉緊。屁股肌肉係你跑步嘅大引擎。"],demo:{run:"glute4",cam:"floor",muscle:!0,hl:["glute"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"屁股：每邊 20 秒"}},{t:"⑥ 蝴蝶式",p:["坐喺地下，兩隻腳板對住腳板，膝頭向兩邊打開，好似蝴蝶翼。","雙手捉住腳，背脊企直，慢慢向前傾少少。唔好用手大力壓膝頭。"],demo:{run:"butterfly",cam:"front",muscle:!0,hl:["adductor"],coach:"talk"},task:{type:"timer",secs:20,label:"蝴蝶式 20 秒"}},{t:"⑦ 肩膊同手臂",p:["一隻手打橫伸過心口，另一隻手勾住佢個手肘，輕輕拉近身體，膊頭要放鬆。","跟住將手舉高，屈手肘令隻手跌落背脊，另一隻手輕輕推住手肘。擺手擺得好，靠嘅就係呢度。"],demo:{run:"shoulderStretch",cam:"front",muscle:!0,hl:["shoulder","triceps"],coach:"talk"},task:{type:"timer",secs:15,sides:2,label:"肩膊：每邊 15 秒"}},{t:"⑧ 嬰兒式：放鬆背脊",p:["跪低，屁股坐落腳跟，身體向前趴落大腿，雙手向前伸直貼地。","慢慢深呼吸，每次呼氣都覺得自己鬆多啲。呢個係完成訓練最舒服嘅一個動作！"],demo:{run:"childPose",cam:"floor",muscle:!0,hl:["back"],coach:"talk"},task:{type:"timer",secs:20,label:"嬰兒式 20 秒"}},{t:"小測驗：拉筋",quiz:[{q:"拉筋嗰陣應該有咩感覺？",o:["好痛先至有用","緊緊地但係舒服","冇感覺"],a:1,ex:"痛就代表拉得太盡，要鬆返少少。"},{q:"靜止拉筋最好喺幾時做？",o:["跑完、身體暖咗嗰陣","一起身未郁之前","比賽起跑前一秒"],a:0,ex:"跑完步肌肉暖，拉筋最安全、效果最好。"},{q:"拉筋時應該點樣？",o:["用力彈嚟彈去","慢慢拉、停住、深呼吸"],a:1,ex:"好似拉橡筋糖，慢慢拉，唔好彈。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"form",icon:"🏃",title:"跑步姿勢",sub:"高、鬆、快三個字",color:"#1e88e5",steps:[{t:"靚姿勢三個字：高、鬆、快",p:["高：身體企高高，好似頭頂有條繩吊住你。鬆：面、膊頭、手都要放鬆。快：腳步快快、輕輕。","整個人好似一個彈簧，每一步都向前彈出去，唔係向上跳，亦唔係拖住隻腳行。","你可以由唔同角度睇吓小飛跑，留意佢個頭、手、腰同腳。"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.5}},{t:"對眼望邊？",p:["跑短跑：起跑時望住前面地下，跑起之後慢慢抬頭，對眼望住自己條跑道嘅終點。","跑長跑：望前面大約十至二十米，即係大約前面一兩支燈柱嘅位置。","下巴保持平，唔好低頭望自己對腳，亦唔好仰起頭。低頭會令身體縮埋，仰頭會令身體向後拗。","仲有：唔好轉頭望隔籬！一轉頭，身體就會歪，速度即刻慢。"],demo:{compare:["jog","lookDown"],cam:"side",coach:"talk"}},{t:"個精神 focus 喺邊？",p:["你嘅精神要放喺「自己」同「前面」：自己嘅動作、自己嘅呼吸、前面嘅目標。","最好用一個「向外」嘅提示，例如「推開個地」、「手肘向後撞門」、「好似踩喺熱鑊上面」。研究發現，咁樣諗比諗「我要用大腿肌肉」更有效。","面要鬆，可以微微笑。牙唔好咬實，膊頭唔好聳起，咁樣身體先跑得順。"],demo:{compare:["jog","tense"],cam:"front",coach:"talk"}},{t:"手點樣擺？",p:["手肘屈成大約九十度，好似一個「L」字。由膊頭開始前後擺，好似鐘擺咁。","短跑：隻手由屁股旁邊擺到大約下巴或者面珠墩咁高，擺得大、擺得有力。長跑：擺細啲，由腰旁邊擺到心口咁高就得。","手指輕輕握住，好似揸住一塊薯片，唔好整碎佢。","最重要：手要前後擺，唔好橫過身體中間。手橫擺會令身體左右扭，浪費力。"],demo:{compare:["armsGood","armsCross"],cam:"front",coach:"talk",hl:["shoulder"]}},{t:"點樣練擺手？",p:["練習一：坐喺地下，雙腳伸直，用跑步咁樣擺手。擺得啱嘅話，個身唔會左搖右擺；擺得太橫，個屁股會搖嚟搖去。","練習二：企喺鏡前面擺手，睇吓手有冇橫過身體中間，膊頭有冇聳起。","小秘密：手擺得快，腳就會跟住快；手擺得大，步就會跨得大。手同腳係好朋友！"],demo:{run:"seatedArms",cam:"front",coach:"talk",hl:["shoulder","triceps"]},task:{type:"timer",secs:20,label:"坐地擺手 20 秒"}},{t:"腳點樣擺？幅度幾大？",p:["短跑：膝頭向前向上抬，抬到大腿差唔多同地面平衡。腳尖勾起，好似有條繩拉住腳趾向上。然後隻腳好似車轆咁，向下、向後「扒」個地。","腳要落喺身體下面，唔好伸長隻腳去踩前面好遠嘅地方，咁樣好似踩咗煞車掣。","長跑：膝頭唔使抬咁高，步細啲、快啲，輕輕鬆鬆咁行前就得。"],demo:{compare:["jog","overstride"],cam:"side",coach:"talk",hl:["hipflexor","hamstring"]}},{t:"用腳邊度落地？",p:["你講得啱！跑短跑要用前腳掌落地，即係腳趾後面、肉肉嗰度。腳跟可以輕輕掂一掂地，但係唔好成隻腳「拍」落去。","成隻腳掌踩落去，膝頭會屈得深，個人沉落去，好似坐低咗咁，接住再加速就慢咗。","不過跑長跑唔同：用腳掌中間平平咁落地就得，落喺身體下面，唔使刻意踮腳。成日踮腳跑長途，小腿同腳跟筋會好辛苦，甚至受傷。"],tip:"短跑：前腳掌。長跑：腳掌中間，輕輕、靜靜咁落地。",demo:{compare:["sprint","sprintLow"],cam:"feet",coach:"talk",hl:["calf"],com:!0,slow:.35}},{t:"重心要高！",p:["重心就係你身體重量嘅中心，大約喺肚臍下面、盤骨入面。睇吓個黃色波波，就係小飛嘅重心。","跑得快嘅人，重心保持高：膝頭唔會屈得太深，屁股唔會「坐低」。咁樣每一步都好似彈簧咁彈出去。","重心低嘅人，好似坐低咗跑，每一步都要用力撐返起身，好嘥力。比較吓兩個人個波波高度！"],demo:{compare:["sprint","sprintLow"],cam:"side",coach:"point",com:!0,slow:.5}},{t:"點樣練到重心高？",p:["遊戲一「熱鑊」：想像地下係好熱嘅鑊，腳一掂地就要彈起，用前腳掌、快快咁提腳。","遊戲二「安靜腳」：跑嗰陣聽吓自己對腳，越靜越好。成隻腳拍落地會好嘈。","練習三：腳踝彈跳、踮腳行、跳繩，全部都會令小腿同腳踝好似彈簧咁。","練習四：撐牆跑。雙手撐住牆，身體斜斜成一條直線，輪流抬膝頭。學識咗用前腳掌撐住身體。"],demo:{run:"pogo",cam:"side",coach:"talk",hl:["calf","achilles"],com:!0},task:{type:"timer",secs:20,label:"試吓：熱鑊彈跳 20 秒 🔥"}},{t:"撐牆跑練習",p:["企喺牆或者欄杆前面，雙手伸直撐住，身體由頭到腳斜斜咁成一條直線，好似一塊木板。","用前腳掌企，然後輪流將膝頭抬起，腳尖勾起，再踩返落身體下面。","呢個練習教你：身體向前傾，腳要喺身體下面推地。係短跑起跑嘅秘密武器！"],demo:{run:"wallDrill",cam:"side",coach:"talk",props:["wall"],hl:["hipflexor","glute"]},task:{type:"timer",secs:20,label:"撐牆跑 20 秒"}},{t:"條腰點樣？",p:["腰板要直，好似一條硬淨嘅柱。個肚輕輕收住，好似準備有人輕輕篤一篤你個肚咁。","身體由腳踝開始少少向前傾，好似一棵樹微微向前，唔係由條腰度彎落去。","唔好寒背，亦唔好挺住個肚向後拗。腰軟咗，腳推地嘅力就會漏走晒。"],demo:{compare:["jog","slouch"],cam:"side",coach:"talk",hl:["abs","back"],muscle:!0}},{t:"點樣呼吸？",p:["用鼻同口一齊呼吸，吸得多啲氣。用個肚呼吸：吸氣個肚好似氣球脹起，呼氣個肚縮返。","長跑：試吓配合腳步，兩步吸、兩步呼。輕鬆跑嗰陣，應該仲可以講到一句完整嘅說話，呢個叫「講說話測試」。","短跑：唔好閉氣！自然咁呼吸，呼氣時順便放鬆膊頭。","肚側邊痛？慢少少，深呼吸，用手輕輕按住痛嘅位置，呼氣時慢慢講「呼——」。"],demo:{run:"jog",cam:"upper",coach:"breathe",hl:["abs"]}},{t:"整體動作：好似車轆咁轉",p:["將所有嘢砌埋：頭平、眼望前、膊頭鬆、手肘九十度前後擺、腰板直、身體微微前傾、膝頭向前、腳落喺身體下面、前腳掌推地。","成個人嘅動作要順、要有節奏，好似車轆咁一圈一圈咁轉，唔係一下一下咁跳。","左右兩邊要一樣，好似照鏡咁。轉吓角度，由前面睇，小飛係唔係行直線？"],demo:{run:"sprint",cam:"threeq",coach:"thumbs",slow:.5}},{t:"小測驗：姿勢",quiz:[{q:"跑短跑應該用腳邊度落地？",o:["腳跟","前腳掌","成隻腳掌拍落地"],a:1,ex:"前腳掌落地令重心保持高，好似彈簧咁彈出去。"},{q:"手應該點樣擺？",o:["橫過身體中間","手肘九十度，前後擺","唔使擺"],a:1,ex:"前後擺，好似鐘擺，唔好橫擺。"},{q:"跑長跑應該望邊？",o:["望自己對腳","前面十至二十米","望天"],a:1,ex:"下巴平，望前面一兩支燈柱咁遠。"},{q:"點樣知道自己跑緊「輕鬆跑」？",o:["喘到講唔到嘢","仲可以講一句完整嘅說話"],a:1,ex:"呢個叫講說話測試。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"sprint",icon:"⚡",title:"短跑",sub:"起跑、加速、衝線",color:"#fbc02d",steps:[{t:"短跑有四部分",p:["短跑好似一架飛機：一、起跑；二、加速，好似飛機喺跑道衝；三、最高速，好似飛上咗天；四、保持速度同衝線。","小朋友比賽通常跑 [[50 或 60 米|60 至 100 米]]。全程都要用盡力，但係用盡力唔等於繃緊，要「快而鬆」。"],demo:{run:"accelToSprint",cam:"sideFar",coach:"talk",travel:!0}},{t:"站立式起跑",p:["初學最好用站立式起跑。強啲嗰隻腳放前，腳尖喺起跑線後面；另一隻腳放後，相隔大約一隻腳半。","雙膝微屈，身體向前傾，重心放喺前面隻腳。手同腳相反：前腳係左腳，就右手放前。","對眼望住前面兩三米嘅地下，等槍聲。"],demo:{run:"standingStartSeq",cam:"side",coach:"talk",travel:!0}},{t:"蹲踞式起跑：「各就位」",p:["聽到「各就位」：雙手放喺起跑線後面，打開同膊頭一樣闊，手指撐起好似一座橋。","前腳放喺起跑線後面大約一隻半腳嘅位置，後面隻腳嘅膝頭跪喺前腳旁邊。","頭放鬆，對眼望住雙手前面嘅地下。"],demo:{run:"marks",cam:"side",coach:"talk",props:["startLine"]}},{t:"「預備」：屁股升起",p:["聽到「預備」：屁股慢慢升起，升到比膊頭高少少。","前面隻腳嘅膝頭大約屈成直角，後面隻腳嘅膝頭打開啲。膊頭喺雙手正上面，甚至前少少。","保持唔郁！呢一刻要專心聽，唔好估幾時開槍。"],demo:{run:"set",cam:"side",coach:"talk",props:["startLine"],hl:["glute","quad"]}},{t:"「砰！」第一步",p:["槍一響，兩隻腳一齊用力推地，後腳先衝出去，手大力前後擺，好似用手肘撞開後面道門。","頭幾步要短、要快、要用力向後推地，好似推一架好重嘅車。","身體保持斜斜向前，由頭到後腳成一條直線。"],demo:{run:"crouchStart",cam:"side",coach:"point",travel:!0,props:["startLine"]}},{t:"加速：好似飛機起飛",p:["起跑後身體係斜嘅，然後一步一步慢慢企直，好似飛機慢慢升上天。","[[大約頭 10 至 15 米|大約頭 15 至 25 米]]係加速段。千祈唔好一起步就即刻企直，咁樣會浪費咗推力。","步幅會由細細步，慢慢變大步。"],demo:{run:"accelToSprint",cam:"sideFar",coach:"talk",travel:!0,slow:.6}},{t:"點樣唔會仆親？",p:["起跑仆倒，通常有三個原因：一、身體傾得太前，但係隻腳踏唔夠快；二、第一步跨得太大，隻腳踩唔到喺身體下面；三、太早抬頭企直，或者手唔擺。","解決方法：頭幾步要細步、快步，腳落喺身體下面，手大力擺嚟保持平衡，慢慢先企直。","練習「大樹倒下」：企直身，成個人好似一棵樹咁慢慢向前傾，傾到就快跌嗰陣，即刻快步衝出去。咁樣就學識身體同腳點樣配合。"],tip:"跑之前檢查地面：濕滑、有沙、凹凸唔平嘅地方唔好做起跑練習。",demo:{run:"fallingStart",cam:"side",coach:"talk",travel:!0},task:{type:"confirm",label:"我試咗「大樹倒下」起跑 🌳"}},{t:"最高速：企高、放鬆",p:["加速完，身體已經企直，好似頭頂有條繩吊住你。用前腳掌快快咁踩，膝頭向前抬。","呢個時候最重要係「放鬆」：面、膊頭、手都要鬆。越想用力去跑，身體越繃緊，反而越慢。","世界最快嘅短跑選手跑嗰陣，塊面都係鬆晒㗎！"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.6}},{t:"望自己條跑道",p:["跑短跑，對眼要望住自己條跑道嘅終點，唔好望隔籬。","一轉頭望人，你個身體就會跟住扭，條線就跑歪咗，又會令你分心。","隔籬條跑道發生咩事都唔關你事，你只需要做好自己。"],demo:{run:"sprint",cam:"back",coach:"talk",rivals:!0,travel:!0}},{t:"如果有人跑贏你……",p:["見到有人喺前面，唔好慌！最多人犯嘅錯誤係：太想追，結果全身繃緊，手腳亂晒，反而越跑越慢。","你要做嘅係：保持放鬆，繼續用你嘅姿勢跑。所有人去到後半段都會慢落嚟，邊個慢得少，邊個就贏。","所以後半段，好多人係可以追返嘅！講句自己嘅提示字：「鬆、快！」"],demo:{run:"sprint",cam:"race",coach:"talk",rivals:"ahead",travel:!0}},{t:"如果你跑贏緊……",p:["你領先咗，好叻！但係千祈唔好望後面，亦唔好減速。","好多人以為贏定，喺終點前慢落嚟，結果最後一步畀人追過。","你要一直衝，衝過終點線之後再跑多五米先慢落嚟。終點線唔係你停嘅地方，係你衝過嘅地方。"],demo:{run:"sprint",cam:"race",coach:"talk",rivals:"behind",travel:!0}},{t:"衝線技巧",p:["去到終點前一兩步，可以用心口向前「壓」過終點線，雙手向後擺。","計時係計你個身體軀幹過線，唔係計手或者頭。","不過唔好太早壓，太早會失平衡仆倒。初學嘅話，最緊要係用全速衝過終點線。"],demo:{run:"finishLine",cam:"side",coach:"point",travel:!0}},{t:"點樣練短跑？",p:["短跑練習要「快、短、休息足」。每次跑[[ 15 至 30 米| 20 至 60 米]]，用九成以上嘅速度。","每跑完一次，慢慢行返轉頭，休息一至兩分鐘。休息足夠，下一次先可以真係跑得快。","做 [[4 至 6|5 至 8]] 次就夠。當你發覺自己慢咗、姿勢亂咗，就係時候收工。練「快」唔可以喺攰嘅時候練。"],tip:"短跑練習最好放喺熱身之後、身體最精神嘅時候。",demo:{run:"accelToSprint",cam:"sideFar",coach:"talk",travel:!0}},{t:"小測驗：短跑",quiz:[{q:"起跑之後應該點？",o:["即刻企直身","身體斜斜，慢慢先企直","望住隔籬"],a:1,ex:"好似飛機起飛，慢慢升起。"},{q:"起跑點樣唔會仆親？",o:["第一步跨到最大","頭幾步細步、快步，腳落喺身體下面","閉埋眼跑"],a:1,ex:"細步快步，加上大力擺手保持平衡。"},{q:"你領先緊，應該點？",o:["望後面睇吓佢哋","終點前慢落嚟","一直衝，衝過終點線先慢"],a:2,ex:"衝過終點後再跑多五米。"},{q:"短跑練習之間應該休息幾耐？",o:["唔使休息","一至兩分鐘，行返轉頭"],a:1,ex:"休息足夠先可以真係練到快。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"distance",icon:"🌊",title:"長跑策略",sub:"配速、跟車、衝刺",color:"#00acc1",steps:[{t:"長跑就好似分配零用錢",p:["你嘅體力好似一份零用錢。如果一開始就用晒，後面就乜都冇得用。","小朋友比賽嘅長跑通常係 [[400 米至 1 公里|800 米至 2 公里]]，越野賽可能更長。","長跑最重要嘅唔係最快，而係「識分配」：前面穩陣，後面先加快。"],demo:{run:"jog",cam:"side",coach:"talk",travel:!0}},{t:"配速：勻速跑",p:["配速就係每一段跑幾快。最好嘅方法係「勻速」：每一段差唔多一樣快，甚至後半段快少少。","最多小朋友犯嘅錯誤：槍聲一響就衝到盡，跑咗一陣就喘到唔掂，最後行都行唔郁。","練習時用海旁啲燈柱幫手：試吓每兩支燈柱之間用差唔多一樣嘅時間跑完。"],tip:"頭段應該覺得「有啲輕鬆、好似太慢」，咁就啱喇。",visual:"pace",demo:{run:"jog",cam:"sideFar",coach:"talk",travel:!0}},{t:"第一梯隊定第二梯隊？",p:["開跑之後，通常會分成一堆一堆，最前嗰堆叫第一梯隊。","應該跟邊堆？答案係：跟住同你「計劃速度」差唔多嘅嗰堆。如果你嘅實力喺最前，就跟第一梯隊；如果唔係，喺第二梯隊跑得舒服、穩陣，後面先追，好過硬跟第一梯隊然後爆。","喺跑道上，盡量跑喺第一線道或者人哋膊頭外面少少，唔好被人困喺中間出唔到嚟。"],demo:{run:"jog",cam:"race",coach:"talk",rivals:"pack",travel:!0}},{t:"跟領跑者，定跑自己？",p:["兩樣都要！主要係跑自己嘅速度，用呼吸同感覺去判斷。","如果領跑者嘅速度同你計劃差唔多，你可以跟喺佢後面或者斜後面，佢幫你擋風，你仲可以慳返啲力，呢個叫「跟車」。","但如果你發覺自己喘到講唔到嘢、手腳開始繃緊，即係佢太快喇。放手畀佢走，跑返你自己嘅速度。好多時，嗰啲衝得太快嘅人，後面你會追返。"],demo:{run:"jog",cam:"race",coach:"talk",rivals:"draft",travel:!0}},{t:"咩叫「撞牆」？",p:["「撞牆」本來係講跑馬拉松嘅人，跑到三十幾公里，身體儲落嘅能量用晒，好似撞埋一幅牆咁，突然跑唔郁。","小朋友跑短啲嘅長跑，比較常見嘅係「一開始太快，然後爆咗」。特徵係：雙腳好似灌咗鉛咁重、呼吸亂晒、膊頭聳起、姿勢散晒、好想停。","有時仲會頭暈、肚痛、好口渴。如果頭暈或者唔舒服，要即刻停低，話畀大人知。"],demo:{run:"tense",cam:"side",coach:"talk"}},{t:"點樣防止撞牆？",p:["一、開頭唔好衝，用勻速跑。二、平時有練耐力，慢慢加長跑嘅時間。三、比賽前一晚同當日早餐食夠飯、麵、麵包，即係身體嘅燃料。","四、瞓得夠、飲水夠。五、如果真係好攰：步細啲、手擺細啲、深呼吸、膊頭放鬆。","六、將條路切細：唔好諗仲有幾遠，淨係諗「跑到下一支燈柱」。到咗，再揀下一支。"],demo:{run:"jog",cam:"side",coach:"talk",travel:!0}},{t:"有人超越你，點諗？",p:["佢跑佢嘅，我跑我嘅。先問自己：我嘅呼吸同感覺仲係唔係同計劃一樣？","如果你仲好舒服，可以試吓跟住佢，好似有塊磁石吸住你咁。","如果你已經好盡，就唔好追。佢可能係衝得太早，等陣你會再見返佢。"],demo:{run:"jog",cam:"race",coach:"talk",rivals:"passing",travel:!0}},{t:"超越人嘅秘訣",p:["一、「釣魚法」：揀前面一個人做目標，好似釣魚咁慢慢收線，一個一個咁追。","二、要超就超得果斷：加速經過佢，再跑多一段先返回正常速度，咁佢就難跟住你。","三、喺直路超越，唔好喺彎位外面超，因為要跑多啲路。","四、最好嘅超越方法，其實係「前慢後快」：前半段慳力，後半段你自然會一個一個咁追過人。"],demo:{run:"jog",cam:"race",coach:"point",rivals:"overtake",travel:!0}},{t:"最後衝刺點分配？",p:["將比賽分三份：頭三分之一：穩陣，放鬆跑；中間三分之一：保持速度，專心；最後三分之一：慢慢加速。","最後 [[100|150 至 200]] 米：用盡剩低嘅力衝刺！手擺大啲、膝頭抬高啲。","比賽前揀定一個「衝刺記號」，例如最後一支燈柱或者最後一個彎。去到就衝，唔使諗。"],visual:"energy",demo:{run:"finishLine",cam:"sideFar",coach:"talk",travel:!0}},{t:"比賽中飲水同天氣",p:["天氣熱，比賽前半個鐘飲幾啖水，唔好一次過飲好多。","長過二十分鐘嘅跑步，中途可以飲幾啖水。","好熱嘅日子，戴帽、搽防曬，速度要放慢少少。身體唔舒服，一定要停。"],demo:{run:"stand",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"小測驗：長跑",quiz:[{q:"長跑最好嘅配速係？",o:["一開始衝到盡","勻速，後半段快少少","跑跑停停"],a:1,ex:"好似分配零用錢，唔好一開始用晒。"},{q:"你跟住領跑者，但係開始喘到講唔到嘢，應該點？",o:["死都要跟","放手，跑返自己嘅速度"],a:1,ex:"佢太快喇，跑返自己速度，後面可能追返。"},{q:"好攰嘅時候，邊個方法有用？",o:["淨係諗「跑到下一支燈柱」","諗住仲有好遠好遠"],a:0,ex:"將條路切細，一段一段完成。"},{q:"超越人應該點？",o:["喺彎位外面慢慢超","喺直路果斷加速超過"],a:1,ex:"果斷超越，對手就難跟住。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"elite",icon:"🥇",title:"奧運選手點樣練？",sub:"頂尖運動員嘅秘密",color:"#8d6e63",steps:[{t:"佢哋都係由細練到大",p:["奧運選手唔係一日變出嚟嘅，佢哋練咗好多好多年。","好多頂尖運動員細個嗰陣，玩過好多種運動：踢波、游水、跳繩、捉迷藏。咁樣令佢哋身體好靈活、好協調，大個先專心跑步。","佢哋最大嘅秘密係「堅持」：每星期都練，一年又一年。"],demo:{run:"jog",cam:"threeq",coach:"talk"}},{t:"一年有四個季節",p:["選手嘅一年好似植物：一、打底期，好似種子生根，練基礎、練耐力；二、強化期，好似生枝葉，練速度同力量；三、比賽期，好似開花，用最好狀態比賽；四、休息期，好似冬天，休息同玩其他運動。","你都可以咁樣：學期中慢慢練，有比賽前練得精啲，比賽完放鬆一兩個星期。"],demo:{run:"stand",cam:"home",coach:"talk"}},{t:"大部分時間跑得好輕鬆！",p:["你可能估唔到：世界級長跑選手，大約八成嘅練習都係用輕鬆速度跑，即係可以傾偈嘅速度。","只有大約兩成嘅時間先係跑得好辛苦。呢個叫「八二法則」。","點解？因為身體係喺休息嗰陣先至變強。日日都跑到好攰，身體冇時間修補，反而會退步或者受傷。"],tip:"慢，係為咗之後可以更快。",demo:{run:"jog",cam:"side",coach:"talk",travel:!0}},{t:"短跑選手點樣練？",p:["一、技術操：A 步、B 步、高抬腿，日日都做，令動作變成習慣。","二、起跑同加速：練好多次起跑，每次只跑一小段。","三、極速跑：跑得好快，但係每次都休息得好足。","四、力量同彈跳：做深蹲、跳躍練習。成年選手會舉重，小朋友就用自己身體重量練，例如深蹲、弓步、跳繩，已經好足夠。"],demo:{run:"aSkip",cam:"side",coach:"talk"}},{t:"長跑選手點樣練？",p:["一、輕鬆跑：大部分時間都係慢慢跑，打好耐力底。","二、節奏跑：用「有啲辛苦但控制到」嘅速度跑一段。","三、間歇跑：快跑一段，慢跑休息，再快跑，重複幾次。","四、長課：每星期一次跑長啲，但係速度好輕鬆。小朋友可以用遊戲代替，例如「燈柱遊戲」：一支燈柱快，兩支燈柱慢。"],demo:{run:"jog",cam:"sideFar",coach:"talk",travel:!0}},{t:"休息同瞓覺都係訓練",p:["奧運選手好重視瞓覺，好多人每晚瞓八至十個鐘，有啲仲會晏晝瞓一陣。","你嘅身體係喺瞓覺嗰陣修補肌肉、長高長大。","[[六至十二歲嘅小朋友，每晚要瞓九至十二個鐘|你呢個年紀，每晚要瞓九至十二個鐘]]，比大人仲要多！"],demo:{run:"childPose",cam:"floor",coach:"talk"}},{t:"佢哋都會練個腦",p:["選手會同教練一齊訂目標，寫低每次練習做咗咩、感覺點。","比賽前，佢哋有固定嘅「準備程序」，例如同一個熱身、同一句提示字，咁樣就唔會慌。","佢哋亦會做想像練習，同埋睇自己跑步嘅片，搵出可以改進嘅地方。"],tip:"叫爸爸媽媽幫你拍片，慢鏡睇吓自己嘅姿勢！",demo:{run:"think",cam:"upper",coach:"talk"}},{t:"我哋可以學到咩？",p:["一、玩多啲唔同嘅運動。二、大部分時間輕鬆跑，少少時間跑快。三、練快之前休息足。四、用自己身體重量練力量。五、瞓得夠、食得好。六、記錄自己嘅進步。七、最重要：開心先會堅持！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}},{t:"小測驗：奧運選手",quiz:[{q:"世界級長跑選手大部分練習用咩速度？",o:["全速","輕鬆、可以傾偈嘅速度"],a:1,ex:"大約八成時間都係輕鬆跑，叫八二法則。"},{q:"小朋友練力量最好用？",o:["好重嘅啞鈴","自己身體重量，例如深蹲、跳繩"],a:1,ex:"安全又有效。"},{q:"身體幾時變強？",o:["練習之後休息、瞓覺嘅時候","練到最攰嗰一刻"],a:0,ex:"休息同瞓覺都係訓練嘅一部分。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"food",icon:"🍎",title:"食得好、瞓得好",sub:"運動員嘅生活規律",color:"#43a047",steps:[{t:"你個身體係一部跑車",p:["飯、麵、麵包、麥皮、番薯：係「燃料」，令你有力跑。","雞蛋、魚、雞肉、豆腐、奶：係「磚頭」，幫你修補同建立肌肉。","菜同生果：係「保護罩」，有好多維他命，令你少啲病。","奶、芝士、豆腐、深綠色菜：有鈣，令骨頭強壯。"],demo:{run:"stand",cam:"threeq",coach:"talk",props:["food"]}},{t:"砌一個健康餐盤",p:["一個好嘅餐盤：一半係菜同生果，四分一係飯麵等燃料，四分一係蛋白質，再加一杯水或者奶。","依家輪到你！用手指將食物拖去餐盤度，砌一個運動員餐。汽水、糖果、炸薯條就……你諗吓應唔應該擺入去？"],demo:{run:"stand",cam:"food",coach:"point",props:["food"]},task:{type:"plate",label:"將食物拖去碟度 🍽️"}},{t:"練習之前食咩？",p:["練習前兩至三個鐘：可以食一餐正常飯，例如飯、菜、雞肉。","練習前半個至一個鐘：如果肚餓，食少少好消化嘅小食，例如香蕉、一片麵包、幾塊梳打餅。","練習前唔好食得太飽，亦唔好食煎炸油膩嘢，唔係跑嗰陣肚會痛。"],demo:{run:"stand",cam:"food",coach:"talk",props:["food"]}},{t:"練習之後食咩？",p:["練完之後大約一個鐘之內，食啲有「燃料」又有「磚頭」嘅嘢，幫身體修補。","例如：一杯奶加一條香蕉、乳酪、雞蛋三文治、飯糰。","然後正常食晚飯。唔好因為想「瘦啲」而唔食，成長中嘅身體需要足夠營養。"],demo:{run:"stand",cam:"food",coach:"talk",props:["food"]}},{t:"飲水嘅學問",p:["練習前：飲一杯水。練習中：每十五至二十分鐘飲幾啖。練習後：飲水補返。","睇吓小便嘅顏色：淡淡嘅檸檬黃色就啱；好深色即係要飲多啲水。","大部分時間飲清水就夠。運動飲品只係好長、好熱嘅運動先需要。能量飲品有咖啡因，小朋友千祈唔好飲。"],visual:"urine",demo:{run:"stand",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"瞓覺：最強嘅秘密武器",p:["[[六至十二歲|你呢個年紀]]每晚要瞓九至十二個鐘。","每日盡量同一個時間瞓同起身。瞓覺前一個鐘唔好睇手機同電視，因為啲光會令個腦以為仲係日頭。","瞓得好，跑得快、記得實、唔易嬲、唔易病。"],demo:{run:"childPose",cam:"floor",coach:"talk"}},{t:"小運動員嘅一日",p:["睇吓下面呢個例子，你可以同爸爸媽媽一齊整一個屬於你嘅時間表。","重點：早餐一定要食、放學有小食、練習之後有晚飯、做完功課要早啲瞓。"],visual:"day",demo:{run:"stand",cam:"home",coach:"talk"}},{t:"小測驗：飲食",quiz:[{q:"邊樣係身體嘅「燃料」？",o:["飯、麵、麵包","汽水","糖果"],a:0,ex:"碳水化合物係跑步最主要嘅燃料。"},{q:"練習前半個鐘肚餓，食咩好？",o:["一大碟炸雞","一條香蕉","唔食，餓住跑"],a:1,ex:"好消化、細份嘅小食最好。"},{q:"小朋友可以飲能量飲品嗎？",o:["可以，飲完好有力","唔可以，入面有咖啡因"],a:1,ex:"清水最好。"},{q:"你呢個年紀每晚要瞓幾耐？",o:["六個鐘","九至十二個鐘"],a:1,ex:"身體喺瞓覺時修補同長高。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"plan",icon:"📅",title:"訓練計劃",sub:"幾時練乜、用幾成力",color:"#5c6bc0",steps:[{t:"用幾成力去練？",p:["用一至十分嚟形容辛苦程度：一分好似坐喺梳化，十分係用盡全力。","大部分練習用四至六分：輕鬆、可以講說話。技術練習大約六至七分，專心做靚動作。","短跑衝刺用九至十分，但係每次好短，休息好足。","每次練完，最好覺得「仲有少少力、想再嚟」，而唔係攰到唔想郁。咁先會越練越生猛，越練越想練！"],visual:"effort",tip:"如果十次練習有八次做得到、做得好，嗰個難度就啱啱好。",demo:{run:"jog",cam:"side",coach:"talk"}},{t:"你問得好好：咁點先會有進步？",p:["身體進步嘅秘密係：練少少、休息、再練多少少。每星期只加一點點，大約唔好多過一成。","好似砌積木，一舊一舊咁砌，唔好一次砌太高，會冧㗎。","練完記低感覺：好開心、OK、好攰。如果連續幾次都好攰，下一次就輕鬆啲。"],demo:{run:"jog",cam:"threeq",coach:"talk"}},{t:"每星期點樣分配？",p:["下面係一個[[六至八歲|九至十二歲]]嘅每週安排例子。每日練習時間 [[30 至 45|45 至 60]] 分鐘就夠。","原則：練「快」放喺休息完之後、最精神嘅日子；練「力」同練「快」可以同一日，但係快嘅放先；辛苦嘅日子之後，一定係輕鬆日或者休息日。","「練氣」即係耐力，用輕鬆跑同遊戲去練；「練力」即係力量，用深蹲、弓步、平板支撐。"],visual:"week",demo:{run:"stand",cam:"home",coach:"talk"}},{t:"兩星期一個循環",p:["第一個星期：學新技術、慢慢加量。第二個星期：重複練熟，最後一日做「小測試」，睇吓進步咗幾多。","每四個星期，有一個星期練得輕鬆啲，好似充電咁，等身體吸收晒之前嘅訓練。","測試項目：二十米衝刺時間、一分鐘跳繩、平板支撐秒數、唔停輕鬆跑幾多分鐘。記低喺「我的進步」度！"],demo:{run:"stand",cam:"home",coach:"talk"}},{t:"由頭到腳點樣練？",p:["腳同腳踝：腳踝彈跳、提踵、跳繩，令你好似彈簧。","大腿同屁股：深蹲、弓步、臀橋，係你嘅引擎。","腰同肚：平板支撐、超人式，令你腰板硬淨。","手同膊頭：擺手練習、跪地掌上壓，令擺手更有力。","平衡：單腳企，[[開眼|試吓閉埋眼]]。每次練力量，揀三至四個動作，每個做兩組。"],demo:{run:"squat",cam:"side",coach:"talk",muscle:!0,hl:["quad","glute"]}},{t:"力量動作示範：平板支撐",p:["手肘喺膊頭正下面，用前臂同腳尖撐住，身體由頭到腳成一條直線，屁股唔好翹高，亦唔好跌落去。","個肚收緊，正常呼吸。[[撐 15 至 20 秒|撐 20 至 40 秒]]，做兩次。"],demo:{run:"plank",cam:"side",coach:"talk",muscle:!0,hl:["abs","oblique"]},task:{type:"timer",secs:20,label:"平板支撐 20 秒 💪"}},{t:"力量動作示範：臀橋",p:["瞓喺地下，雙膝屈起，腳板踩地。用屁股出力，將屁股推高，直到膊頭、屁股、膝頭成一條直線。","停一秒，慢慢放低。做 [[8 至 10|10 至 15]] 下，兩組。"],demo:{run:"bridge",cam:"floor",coach:"talk",muscle:!0,hl:["glute","hamstring"]},task:{type:"timer",secs:30,label:"臀橋 30 秒"}},{t:"幾時跑運動場？幾時跑街？",p:["運動場：地面平、有距離標記，最適合練短跑、做測試、練配速。可以兩三個星期去一次，做測試日。","海旁：平坦又開揚，好適合輕鬆跑、技術操、燈柱遊戲。","你可以用捲尺或者手機地圖量一次距離，記住由邊支燈柱去邊支燈柱係幾多米，以後就係你嘅專屬跑道！"],demo:{run:"jog",cam:"wide",coach:"point",travel:!0}},{t:"海旁訓練要注意",p:["揀人少嘅時間，例如朝早或者傍晚。小心單車、狗仔同行人，唔好戴耳筒。","地面濕或者有青苔就唔好跑快，好易滑倒。唔好貼近海邊欄杆做遊戲。","天氣熱就揀陰涼嘅時間，帶水、戴帽。一定要有大人陪同！"],demo:{run:"jog",cam:"wide",coach:"talk",travel:!0}},{t:"太攰嘅警號",p:["如果有以下情況，就要休息或者減少練習：成日都好攰、瞓唔好、唔想練、成績退步、某個位置持續痛。","休息唔係偷懶，休息係訓練嘅一部分。","記住：練得開心、想再練，先係最好嘅訓練。"],demo:{run:"breathe",cam:"upper",coach:"talk"}},{t:"小測驗：訓練計劃",quiz:[{q:"大部分練習應該用幾辛苦？",o:["十分，用盡全力","四至六分，可以講說話"],a:1,ex:"大部分輕鬆，少少時間跑快。"},{q:"練「快」最好放喺幾時？",o:["熱身之後、精神嘅時候","練到好攰之後"],a:0,ex:"攰嘅時候練唔到真正嘅快。"},{q:"練完應該有咩感覺先最好？",o:["仲有少少力、想再嚟","攰到唔想再練"],a:0,ex:"咁先會越練越生猛、越練越想練。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"race",icon:"🏁",title:"比賽前準備",sub:"由一星期前到衝過終點",color:"#e53935",steps:[{t:"比賽前一星期",p:["比賽前一星期，練習要減少，但係唔好完全唔練。可以做幾次短短嘅快跑，保持雙腳醒醒定定。","每晚早啲瞓。練習起跑同衝線。同大人一齊睇清楚比賽時間、地點同規則。"],demo:{run:"jog",cam:"side",coach:"talk"}},{t:"前一晚：執好運動袋",p:["前一晚執好運動袋，第二朝就唔會手忙腳亂。剔晒以下嘅嘢先好瞓覺！","晚餐食你熟悉嘅嘢，有飯或者麵。記住：比賽前唔好試新嘢，新鞋、新食物都留返比賽後先試。"],demo:{run:"stand",cam:"threeq",coach:"talk",props:["bottle","chest"]},task:{type:"check",label:"執運動袋",items:["跑鞋（已經著慣嗰對）","襪","運動衫褲","號碼布同扣針","水樽","小食（香蕉、麵包）","毛巾","外套","帽同防曬","膠布"]}},{t:"比賽當日早上",p:["比賽前兩至三個鐘食早餐，例如麥皮、麵包、香蕉、奶。","早啲出門口，提早到場，熟悉環境，搵定洗手間。","如果比賽前肚餓，可以食少少香蕉或者麵包。"],demo:{run:"stand",cam:"home",coach:"talk"}},{t:"比賽前熱身",p:["比賽前大約半個鐘開始熱身，做十五至二十分鐘：慢跑、郁動熱身、技術操、兩三次加速跑。","熱身完大約十分鐘就要比賽，唔好熱完身等太耐，身體又會凍返。","最後做幾次呼吸定驚法，講自己嘅提示字。"],demo:{run:"highKnees",cam:"side",coach:"talk"}},{t:"好緊張點算？",p:["比賽前個肚好似有蝴蝶飛嚟飛去，手心出汗，心跳好快——好正常！代表你個身體準備緊衝刺。","試吓同自己講：「我唔係驚，我係興奮！」","然後做「聞花、吹蠟燭」，想像自己跑得好靚嘅樣，諗住你嘅提示字。你練過㗎，相信自己！"],demo:{run:"breathe",cam:"upper",coach:"breathe"},task:{type:"breath",cycles:3,label:"比賽前呼吸 🌸"}},{t:"比賽之後",p:["衝過終點後唔好即刻坐低或者瞓喺地下，慢慢行或者慢跑幾分鐘，然後拉筋。","飲水、食少少嘢。同對手握手講聲「多謝」。","最後諗三樣做得好嘅嘢，同一樣下次可以改進嘅嘢。無論贏定輸，你都已經學到嘢！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}},{t:"小測驗：比賽準備",quiz:[{q:"比賽日可唔可以著新買嘅跑鞋？",o:["可以，新鞋最快","唔好，著慣嗰對最安全"],a:1,ex:"比賽前唔好試新嘢。"},{q:"比賽前好緊張，代表咩？",o:["我一定會輸","身體準備緊，係正常嘅"],a:1,ex:"緊張係身體幫你準備衝刺。"},{q:"衝過終點後應該點？",o:["即刻瞓喺地下","慢慢行、拉筋、飲水"],a:1,ex:"慢慢收操，身體恢復得更快。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"safe",icon:"🛡️",title:"保護身體",sub:"你可能遺漏咗嘅重要事",color:"#6d4c41",steps:[{t:"痠同痛唔同",p:["痠：肌肉攰攰哋、痠痠哋，通常一兩日就好返，係正常嘅。","痛：好尖、好刺、一郁就痛、行路一拐一拐、腫咗，呢啲係警號！要即刻停，話畀大人知。","唔好「頂硬上」。早啲休息，好得快好多。"],demo:{run:"stand",cam:"threeq",coach:"talk",muscle:!0}},{t:"成長中嘅身體",p:["你嘅骨頭仲喺度長緊，骨頭兩頭有啲叫「生長板」嘅地方，比較脆弱。","[[八至十四歲|你呢個年紀]]嘅小朋友，有時腳跟會痛，或者膝頭下面會痛，通常同長高同運動量有關。如果持續痛，要睇醫生或者物理治療師。","所以：唔好舉太重嘅嘢，唔好突然練好多，玩多種運動，唔好日日都做同一樣嘢。"],demo:{run:"stand",cam:"feet",coach:"talk",muscle:!0,hl:["achilles","quad"]}},{t:"一對好跑鞋",p:["跑鞋要啱腳：著好之後，腳趾前面要留大約一隻手指公咁闊嘅位。","鞋要輕、鞋底要有彈性、要綁好鞋帶。你長得快，要成日檢查對鞋係咪細咗或者爛咗。","著運動襪，唔好著棉質厚襪，可以減少起水泡。"],demo:{run:"stand",cam:"feet",coach:"talk"}},{t:"天氣同安全",p:["好熱：揀朝早或者傍晚，戴帽、搽防曬、多飲水。如果頭暈、頭痛、想嘔、冇汗，即刻去陰涼地方休息、飲水、話畀大人知。","好凍：著多件外套，熱身做耐啲。落雨：地滑，跑慢啲。行雷就唔好喺戶外跑。","空氣唔好嘅日子，改喺室內做伸展同力量練習。"],demo:{run:"stand",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"玩多種運動",p:["淨係跑步，身體只會用同一種方法郁。玩多種運動，例如游水、踩單車、打波、跳舞、爬山，令全身更協調、更唔易受傷。","研究發現，細個玩多種運動嘅小朋友，大個反而更容易成為好運動員。","每星期至少有一兩日玩其他運動，或者自由咁玩。"],demo:{run:"skipping",cam:"threeq",coach:"talk",props:["rope"]}},{t:"開心最重要",p:["你知唔知，小朋友放棄運動最大嘅原因係咩？係「唔開心」。","所以每次練習都要有遊戲、有笑聲。可以同朋友、爸爸媽媽一齊跑，可以玩捉人、接力、燈柱遊戲。","輸咗唔緊要，學到嘢就係贏。最緊要係你鍾意跑步，跑一世！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}},{t:"小測驗：保護身體",quiz:[{q:"跑步時突然好尖嘅痛，行路一拐一拐，應該點？",o:["頂硬上","即刻停，話畀大人知"],a:1,ex:"痛係身體嘅警號。"},{q:"跑鞋前面應該留幾多位？",o:["唔使留","大約一隻手指公咁闊"],a:1,ex:"咁先唔會頂腳。"},{q:"好熱天氣跑步頭暈想嘔，應該？",o:["跑快啲完成佢","去陰涼地方休息、飲水、話畀大人知"],a:1,ex:"熱嘅時候要特別小心。"}],demo:{run:"stand",cam:"home",coach:"think"}}]}],Ku=[{t:"你嘅問題，我嘅修正",p:["你問嘅問題好全面，大部分都啱，以下有幾點想同你修正或者補充。"]},{t:"一、前腳掌落地提重心：短跑啱，長跑要調整",p:["短跑用前腳掌落地，令重心保持高、觸地時間短，完全正確。但係重點唔單止係「前腳掌」，而係隻腳落喺身體重心下面，唔好向前伸。向前伸長隻腳，就算用前腳掌都會煞車。","長跑唔建議刻意用前腳掌。用腳掌中間平穩咁落地、步頻快少少、唔好跨大步，已經可以保持重心穩定。小朋友長時間踮腳跑，會增加小腿同跟腱負荷，而八至十四歲常見嘅腳跟痛，同呢個負荷有關。"]},{t:"二、「先練心，心 ready 先練身」：要修正",p:["心理同身體係同步發展嘅。小朋友嘅自信大部分嚟自「做到」嘅經驗，所以應該喺每次練習入面加少少心理技巧：呼吸、提示字、自我對話、想像練習、訂細目標。唔需要等心理準備好先開始身體訓練。"]},{t:"三、幾多成力？",p:["你嘅方向完全正確：要有成功感、覺得自己越嚟越生猛，而唔係越嚟越攰。具體建議：","大約八成嘅練習用輕鬆至中等強度，即係一至十分入面嘅四至六分，可以講說話。","短跑速度練習要用九成以上速度，但係距離短，[[十五至三十米|二十至六十米]]，每次之間休息一至兩分鐘，速度明顯跌就停。","每次練完要「留返少少」，令佢想再練。成功率大約八成：十次有八次做得到，難度就啱啱好。","每星期總量增加唔好多過一成左右。"]},{t:"四、練氣、練力、練快點樣排？",p:["速度同技術要喺精神好嘅時候練，即係熱身之後、休息日之後。","力量可以同速度同一日，但係速度放先；或者分開日子。","耐力用輕鬆跑同遊戲。辛苦日之後安排輕鬆日或者休息日。","唔建議分開「練手」、「練腳」咁練，小朋友最好用全身性嘅動作：深蹲、弓步、跳、平板支撐、擺手。"]},{t:"五、「撞牆」嘅正確理解",p:["真正嘅撞牆係耐力賽事後段肝醣耗盡，例如馬拉松三十公里後。小朋友嘅賽事距離短，較少出現真正嘅撞牆，常見嘅係「起步太快而爆缸」。所以教識佢哋勻速同負分段，即係後半段快過前半段，比教「點樣捱過撞牆」更重要。"]},{t:"六、你可能遺漏咗嘅重要事",p:["一、多元運動：專項化太早會增加受傷同放棄嘅風險。","二、生長期痛症：腳跟痛同膝頭下面痛要留意，持續痛就睇醫生或者物理治療師。","三、充足瞓眠：六至十二歲建議每晚九至十二個鐘。","四、讚「努力」唔好淨係讚「成績」：例如「你今日擺手好認真」，好過「你好叻，贏咗」。","五、唔好用跑步做懲罰，咁樣會令小朋友討厭跑步。","六、記錄同慶祝進步，例如每兩星期做一次小測試。","七、有興趣嘅話，可以參加學校田徑隊或者附近嘅田徑會，有合資格教練會更安全、更有系統。"]},{t:"七、安全提示",p:["本 App 嘅內容係一般運動教育資料，唔係醫療建議。小朋友如果有心臟、哮喘或者其他健康問題，開始訓練前請先諮詢醫生。訓練時請有大人陪同，留意天氣同地面情況。"]}],bi={young:[{d:"一",tag:"rest",name:"休息 / 自由玩",items:["自由玩、行公園"]},{d:"二",tag:"speed",name:"快腳日",items:["熱身 10 分鐘","技術操：A 踏步、高抬腿","起跑遊戲：大樹倒下 × 4","15–20 米快跑 × 4（行返轉頭休息）","收操拉筋"]},{d:"三",tag:"play",name:"遊戲日",items:["捉人遊戲 / 接力","跳繩 3 × 30 秒","單腳企平衡"]},{d:"四",tag:"strength",name:"小力士日",items:["熱身","深蹲 2 × 8","臀橋 2 × 8","平板支撐 2 × 15 秒","腳踝彈跳 2 × 10","輕鬆跑 5 分鐘"]},{d:"五",tag:"rest",name:"休息",items:["早啲瞓 😴"]},{d:"六",tag:"endurance",name:"海旁燈柱日",items:["熱身","燈柱遊戲：1 支燈柱快、2 支燈柱慢 × 5","輕鬆跑 8–10 分鐘","收操拉筋"]},{d:"日",tag:"family",name:"家庭運動日",items:["游水 / 踩單車 / 行山（自由揀）"]}],older:[{d:"一",tag:"rest",name:"休息",items:["拉筋 / 輕鬆散步"]},{d:"二",tag:"speed",name:"速度日",items:["熱身 15 分鐘","技術操：A 跳步、高抬腿、踢屁股","起跑練習 × 5（10–15 米）","30–40 米快跑 × 5（休息 2 分鐘）","收操拉筋"]},{d:"三",tag:"endurance",name:"耐力日",items:["熱身","輕鬆跑 12–20 分鐘（講說話測試）","加速跑 × 3","拉筋"]},{d:"四",tag:"strength",name:"力量 + 技術日",items:["熱身","深蹲 2 × 12","弓步 2 × 8 每邊","臀橋 2 × 12","平板支撐 2 × 30 秒","單腳平衡（閉眼）","跳繩 3 × 45 秒"]},{d:"五",tag:"rest",name:"休息 / 其他運動",items:["游水、打波或者休息"]},{d:"六",tag:"tempo",name:"海旁變速日",items:["熱身","燈柱變速：1 支快、1 支慢 × 6–8","輕鬆跑 10 分鐘","收操拉筋"]},{d:"日",tag:"family",name:"家庭 / 長慢跑",items:["20–30 分鐘輕鬆跑或者行山"]}]},Zn={rest:["休息","
