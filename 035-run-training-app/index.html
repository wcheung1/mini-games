<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e88e5">
<title>小飛人跑步學堂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>:root{
  --sky:#1e88e5; --sky2:#64b5f6; --sun:#ffca28; --coral:#ff7043; --mint:#26a69a; --ink:#17324d; --ink2:#46607a;
  --card:#ffffff; --bg:#eaf5ff; --ok:#2e7d32; --bad:#d32f2f; --line:#dbe7f3;
  --r:20px; --shadow:0 10px 30px rgba(20,50,90,.18);
  --font:"PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
  --panelW:410px; --panelH:46vh; --top:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block}
.hidden{display:none!important}

/* ---------- 頂部 ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:var(--top);padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
.tb{height:42px;min-width:42px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb.wide{font-size:15px;font-weight:700}
.tb:active{transform:scale(.95)}
#crumb{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
#voiceBox{display:flex;align-items:center;gap:6px}
.vdot{width:12px;height:12px;border-radius:50%;background:#b0bec5;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.vdot.on{background:#43a047;animation:pulse 1s infinite}
.vdot.paused{background:#ffa000}
#btnPause.paused{background:#fff3e0;color:#e65100}
@keyframes pulse{50%{transform:scale(1.35)}}

/* ---------- 工具列 ---------- */
#toolbar{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(var(--top) + 4px);display:flex;flex-direction:column;gap:8px;z-index:20}
#toolbar button{min-width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:19px;padding:0 8px;display:flex;align-items:center;gap:4px}
#toolbar button b{font-size:13px}
#toolbar button.on{background:#fff59d;box-shadow:0 0 0 3px #fbc02d inset}

/* ---------- 方向掣 ---------- */
#navpad{position:absolute;z-index:20;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:5px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));opacity:.9}
#navpad button{border-radius:12px;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:17px;font-weight:800}
#navpad button:active,#navpad button.held{background:#ffe082}
#navpad .np-c{font-size:16px}

/* ---------- 課堂面板 ---------- */
#panel{position:absolute;z-index:25;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
body.land #panel{top:calc(var(--top) + 4px);right:max(10px,env(safe-area-inset-right));bottom:12px;width:var(--panelW);border-radius:var(--r)}
body.port #panel{left:0;right:0;bottom:0;height:var(--panelH);border-radius:var(--r) var(--r) 0 0;padding-bottom:env(safe-area-inset-bottom)}
#panel.collapsed{height:auto!important;bottom:auto}
body.port #panel.collapsed{bottom:0;top:auto}
#panel.collapsed #panelBody,#panel.collapsed #panelFoot{display:none}
body.land #navpad{right:calc(var(--panelW) + 22px)}
body.land.collapsed-panel #navpad{right:max(12px,env(safe-area-inset-right))}
body.port #navpad{bottom:calc(var(--panelH) + 10px)}
body.port.collapsed-panel #navpad{bottom:70px}
#panelHead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.mini{width:34px;height:34px;border-radius:10px;background:#eef4fb;font-size:18px}
#stepDots{flex:1;display:flex;gap:4px;flex-wrap:wrap}
#stepDots i{width:10px;height:10px;border-radius:5px;background:#d5e3f1;display:block}
#stepDots i.done{background:#90caf9}
#stepDots i.cur{background:var(--sky);width:22px}
#stepCount{font-size:13px;color:var(--ink2);font-weight:700}
#panelBody{flex:1;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
#panelFoot{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.navb{flex:1;height:52px;border-radius:16px;background:#eef4fb;font-size:17px;font-weight:800}
.navb.primary{background:linear-gradient(180deg,#42a5f5,#1e88e5);color:#fff;box-shadow:0 4px 0 #1565c0}
.navb.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #1565c0}
.navb.glow{animation:glow 1.1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,202,40,.7),0 4px 0 #1565c0}}
.navb:disabled{opacity:.4}

h2.st{font-size:21px;margin:2px 0 10px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
h2.st .tx{flex:1}
.para{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:8px 10px;border-radius:14px;background:#f6faff;font-size:17px;line-height:1.65;transition:background .3s}
.para .tx{flex:1}
.para.speaking{background:#fff8d6;box-shadow:0 0 0 2px #ffd54f inset}
.para .ck.now{background:#ffe082;border-radius:4px}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:#e3f2fd;font-size:17px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #bbdefb}
.spk:active{transform:scale(.92)}
.spk.on{background:#ffca28;animation:pulse 1s infinite}
.tip{display:flex;gap:8px;align-items:flex-start;margin:6px 0 10px;padding:10px 12px;border-radius:14px;background:#e8f5e9;border-left:5px solid #43a047;font-size:16px;line-height:1.6}
.tip .tx{flex:1}
.tip b{color:#2e7d32}
.cmp-legend{display:flex;gap:10px;margin:2px 0 10px;font-size:14px;font-weight:700}
.cmp-legend span{padding:4px 10px;border-radius:20px}
.cmp-legend .g{background:#e8f5e9;color:var(--ok)} .cmp-legend .b{background:#ffebee;color:var(--bad)}

/* 任務 */
.task{margin:10px 0;padding:12px;border-radius:16px;background:#fff8e1;border:2px dashed #ffca28;text-align:center}
.task .big{font-size:17px;font-weight:800;padding:12px 18px;border-radius:16px;background:linear-gradient(180deg,#ffd54f,#ffb300);box-shadow:0 4px 0 #f57f17;margin:4px}
.task .big:active{transform:translateY(2px);box-shadow:0 2px 0 #f57f17}
.task.done{background:#e8f5e9;border-color:#66bb6a}
.timer{position:relative;width:120px;height:120px;margin:6px auto}
.timer svg{transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.timer .lab{position:absolute;left:0;right:0;bottom:-4px;font-size:13px;font-weight:700;color:var(--ink2)}
.breath{width:150px;height:150px;margin:8px auto;border-radius:50%;background:radial-gradient(circle,#f8bbd0,#ec407a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900;transform:scale(.55);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.check{display:grid;gap:6px;text-align:left}
.check label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.check input{width:24px;height:24px;accent-color:#43a047}

/* 測驗 */
.quiz{margin:6px 0}
.quiz .q{font-size:18px;font-weight:800;margin:6px 0 10px;display:flex;gap:8px;align-items:flex-start}
.quiz .q .tx{flex:1}
.opt{display:flex;width:100%;text-align:left;align-items:center;gap:10px;margin:8px 0;padding:12px 14px;border-radius:14px;background:#f1f6fc;font-size:17px;font-weight:600;border:2px solid transparent}
.opt .n{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.opt.right{background:#e8f5e9;border-color:#43a047}
.opt.wrong{background:#ffebee;border-color:#e57373;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{padding:10px 12px;border-radius:14px;font-size:16px;line-height:1.6;display:flex;gap:8px}
.fb.ok{background:#e8f5e9} .fb.no{background:#fff3e0}
.fb .tx{flex:1}

/* 視覺圖 */
.vis{margin:8px 0 12px;padding:10px;border-radius:14px;background:#f6faff}
.vis h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.vis h4 .tx{flex:1}
.week{display:grid;gap:6px}
.wd{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:12px;background:#fff}
.wd .d{width:34px;height:34px;border-radius:10px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.wd .nm{font-weight:800;font-size:15px}
.wd .it{font-size:13px;color:var(--ink2);line-height:1.5}
.wd.today{box-shadow:0 0 0 3px #ffca28}
.bar{display:flex;align-items:flex-end;gap:4px;height:110px;padding:6px 4px;border-bottom:2px solid #b0bec5}
.bar div{flex:1;border-radius:6px 6px 0 0;position:relative}
.bar div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.legend{font-size:13px;color:var(--ink2);margin-top:24px;line-height:1.6}
.effort{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.effort div{height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.effort div small{font-size:10px}
.urine{display:flex;gap:4px}
.urine div{flex:1;height:44px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:3px;font-weight:700}
.day{display:grid;gap:4px}
.day div{display:flex;gap:10px;font-size:14px;padding:6px 8px;background:#fff;border-radius:10px}
.day b{width:54px;flex:none;color:var(--sky)}

/* ---------- 物件資訊卡 ---------- */
#infoCard{position:absolute;z-index:28;left:50%;transform:translateX(-50%);top:calc(var(--top) + 8px);max-width:min(520px,86vw);background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;border:3px solid #ffca28;animation:pop .35s}
body.land #infoCard{left:calc(50% - var(--panelW)/2)}
#infoCard .tx{flex:1}
#infoCard b{display:block;font-size:17px;margin-bottom:2px}
#infoCard .q{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;background:#fff3e0;color:#e65100}
#infoCard .q.now{background:#e8f5e9;color:#2e7d32}
#infoCard .x{width:30px;height:30px;border-radius:50%;background:#eee;font-size:14px}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}

/* ---------- 3D 標籤 / 對白泡泡 ---------- */
#labels{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);padding:4px 10px;border-radius:12px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.18);background:#fff;color:#17324d;border:2px solid #90caf9}
.lbl.g{background:#e8f5e9;color:var(--ok);border:2px solid #66bb6a}
.lbl.b{background:#ffebee;color:var(--bad);border:2px solid #e57373}
.lbl.y{background:#fffde7;color:#8d6e00;border:2px solid #fbc02d;font-size:12px}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:min(300px,60vw);background:#fff;border-radius:18px;padding:9px 12px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:15px;line-height:1.5;pointer-events:auto;display:flex;gap:8px;align-items:flex-start;border:2px solid #90caf9}
.bubble:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .who{font-size:12px;font-weight:900;color:var(--sky)}
.bubble .tx{flex:1}
.bubble .spk{width:30px;height:30px;font-size:14px}
.bubble.kid{border-color:#ffcc80}

/* ---------- 覆蓋頁 ---------- */
#overlay{position:absolute;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 6px) max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
#overlay.dim{background:linear-gradient(180deg,rgba(234,245,255,.55),rgba(234,245,255,.92) 40%)}
.wrap{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hero h1{margin:0;font-size:clamp(26px,4.4vw,42px);line-height:1.15;background:linear-gradient(90deg,#1565c0,#ef6c00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;font-size:16px;color:var(--ink2)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{position:relative;text-align:left;padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(20,60,100,.12);display:flex;gap:12px;align-items:center;min-height:88px;border:3px solid transparent;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ic{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.card .t{font-weight:900;font-size:17px}
.card .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.card .no{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:#90a4ae}
.card .star{position:absolute;bottom:8px;right:10px;font-size:18px}
.card.next{border-color:#ffca28;animation:glowc 1.6s infinite}
@keyframes glowc{50%{box-shadow:0 0 0 6px rgba(255,202,40,.35),0 6px 18px rgba(20,60,100,.12)}}
.sec{margin:20px 0 10px;font-size:19px;font-weight:900;display:flex;gap:8px;align-items:center}
.sec .tx{flex:1}
.box{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(20,60,100,.1);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:12px 18px;border-radius:16px;background:#eef4fb;font-size:17px;font-weight:800;border:3px solid transparent}
.pill.on{background:#e3f2fd;border-color:var(--sky)}
.go{padding:16px 28px;border-radius:20px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff8a65,#f4511e);box-shadow:0 5px 0 #bf360c}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #bf360c}
.inp{font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-family:inherit;width:100%;max-width:280px;-webkit-user-select:text;user-select:text}
.warn{background:#fff3e0;border-left:5px solid #ff9800;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.6}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{width:96px;text-align:center;padding:10px 6px;border-radius:16px;background:#f5f5f5;font-size:12px;font-weight:800;color:#9e9e9e}
.badge .e{font-size:34px;filter:grayscale(1);opacity:.4}
.badge.got{background:#fff8e1;color:#8d6e00}
.badge.got .e{filter:none;opacity:1}
.chart{width:100%;height:170px}
.close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:20px;z-index:2}

/* ---------- 遊戲 HUD ---------- */
#hud{position:absolute;inset:0;z-index:22;pointer-events:none}
#hud>*{pointer-events:auto}
#hud>.flash,#hud>.bigmsg,#hud>.vign{pointer-events:none}
.hud-top{position:absolute;top:calc(var(--top) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.hud-chip{background:rgba(255,255,255,.94);border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.hud-bottom{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;padding:0 12px;flex-wrap:wrap}
.hbtn{min-width:120px;height:92px;border-radius:26px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(180deg,#42a5f5,#1e88e5);box-shadow:0 6px 0 #1565c0;touch-action:none}
.hbtn.l{background:linear-gradient(180deg,#66bb6a,#43a047);box-shadow:0 6px 0 #2e7d32}
.hbtn.r{background:linear-gradient(180deg,#ffa726,#fb8c00);box-shadow:0 6px 0 #e65100}
.hbtn.red{background:linear-gradient(180deg,#ef5350,#e53935);box-shadow:0 6px 0 #b71c1c}
.hbtn.sm{min-width:86px;height:70px;font-size:17px}
.hbtn.on{outline:5px solid #ffeb3b}
.hbtn:active,.hbtn.press{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.hbtn:disabled{opacity:.35}
.meter{width:min(340px,70vw);height:22px;border-radius:12px;background:rgba(255,255,255,.8);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative}
.meter i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#ef5350,#ffca28 35%,#66bb6a 70%);transition:width .15s}
.meter span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.bigmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(34px,7vw,68px);font-weight:900;color:#fff;text-shadow:0 4px 0 #1565c0,0 0 20px rgba(0,0,0,.3);white-space:nowrap;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(211,47,47,.6);opacity:0;transition:opacity .4s}

#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%) translateY(20px);background:#17324d;color:#fff;padding:12px 20px;border-radius:18px;font-size:18px;font-weight:800;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:61;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#loading{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#90caf9,#e3f2fd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:800;color:#1565c0;transition:opacity .5s}
.ld-runner{font-size:64px;animation:run .5s infinite alternate}
@keyframes run{to{transform:translateX(30px) rotate(-6deg)}}

@media (max-width:700px){
  :root{--top:54px}
  .tb.wide{font-size:13px;padding:0 8px}
  #crumb{font-size:14px;max-width:38vw}
  .para{font-size:16px}
  h2.st{font-size:19px}
  #navpad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px}
  .hbtn{min-width:100px;height:80px;font-size:19px}
}

.navb.locked{opacity:.55;background:#cfd8dc;box-shadow:0 4px 0 #90a4ae;color:#455a64}
.navb.locked:after{content:" 🔒"}
.shake{animation:shake .45s}
.ask{margin:10px 0;padding:10px 12px;border-radius:16px;background:#f3e5f5;border:2px solid #ce93d8}
.ask-h{font-weight:900;color:#6a1b9a;font-size:15px}
.has-beat{cursor:pointer;position:relative}
.has-beat:before{content:"🎬";position:absolute;left:-4px;top:-6px;font-size:13px}
.lbl.big{font-size:17px;padding:6px 14px}
.lbl.o{background:#fff3e0;color:#e65100;border:2px solid #ffa726}
.lbl.bl{background:#e3f2fd;color:#1565c0;border:2px solid #64b5f6}
.lbl{transition:none}
.timeline{display:grid;gap:6px}
.timeline .tr{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;background:#fff;border-radius:12px;font-size:14px;line-height:1.5}
.timeline .tr b{flex:none;width:76px;color:#1565c0}
.timeline .tr i{font-style:normal;flex:none}
.pain{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pain div{border-radius:12px;padding:8px;font-size:13px;font-weight:700;line-height:1.5;color:#fff}

.steps2{display:flex;gap:8px;justify-content:center;margin:10px 0}
.steps2 span{width:54px;height:54px;border-radius:14px;background:#eceff1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;transition:all .12s}
.steps2 span.on{background:#ffca28;transform:scale(1.15)}
.st2lab{font-size:22px;font-weight:900;margin-bottom:6px}
.st2lab.in{color:#1565c0}.st2lab.out{color:#2e7d32}
/* 間歇計時 / 反應口令 */
.ivbox{margin:8px auto;max-width:300px;padding:12px;border-radius:18px;background:#fff;border:3px solid #90caf9;transition:background .3s,border-color .3s}
.ivbox.work{background:#ffebee;border-color:#e53935}
.ivbox.rest,.ivbox.setRest{background:#e8f5e9;border-color:#43a047}
.ivph{font-size:24px;font-weight:900}
.ivn{font-size:52px;font-weight:900;line-height:1.1}
.ivr{font-size:14px;font-weight:700;color:var(--ink2)}
.ivbar{height:10px;border-radius:6px;background:#eceff1;overflow:hidden;margin-top:8px}
.ivbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb300,#e53935);transition:width 1s linear}
.ivsum{font-size:13px;color:var(--ink2);margin-top:6px}
.cobox{margin:8px auto;max-width:300px;padding:12px;border-radius:18px;background:#fff;border:3px solid #ab47bc}
.cobox.pop{animation:copop .35s ease-out}
@keyframes copop{0%{transform:scale(.8);background:#f3e5f5}100%{transform:scale(1);background:#fff}}
.coi{font-size:64px;line-height:1.1}
.cot{font-size:30px;font-weight:900}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <header id="topbar">
    <button id="btnHome" class="tb" title="主頁" aria-label="主頁">🏠</button>
    <div id="crumb"><span id="crumbIcon">🏃</span><span id="crumbTitle">小飛人跑步學堂</span></div>
    <div class="grow"></div>
    <div id="voiceBox">
      <span id="voiceDot" class="vdot"></span>
      <button id="btnPause" class="tb wide" aria-label="暫停語音">⏸ 暫停語音</button>
    </div>
    <button id="btnSettings" class="tb" title="設定" aria-label="設定">⚙️</button>
  </header>

  <div id="toolbar" class="hidden">
    <button data-tool="play" title="暫停/播放動作">⏯</button>
    <button data-tool="slow" title="慢鏡">🐢 <b>1x</b></button>
    <button data-tool="muscle" title="肌肉模式">💪</button>
    <button data-tool="com" title="重心">🎯</button>
    <button data-tool="view" title="轉角度">📷 <b>側</b></button>
  </div>

  <div id="navpad" class="hidden">
    <button data-nav="u" class="np-u" aria-label="上">⤒</button>
    <button data-nav="f" class="np-f" aria-label="前">▲</button>
    <button data-nav="d" class="np-d" aria-label="下">⤓</button>
    <button data-nav="l" class="np-l" aria-label="左">◀</button>
    <button data-nav="c" class="np-c" aria-label="重設角度">🎯</button>
    <button data-nav="r" class="np-r" aria-label="右">▶</button>
    <button data-nav="zi" class="np-zi" aria-label="放大">＋</button>
    <button data-nav="b" class="np-b" aria-label="後">▼</button>
    <button data-nav="zo" class="np-zo" aria-label="縮細">－</button>
  </div>

  <aside id="panel" class="hidden">
    <div id="panelHead">
      <button id="btnCollapse" class="mini" aria-label="收埋">▾</button>
      <div id="stepDots"></div>
      <div id="stepCount"></div>
    </div>
    <div id="panelBody"></div>
    <div id="panelFoot">
      <button id="btnPrev" class="navb">◀ 上一步</button>
      <button id="btnNext" class="navb primary">下一步 ▶</button>
    </div>
  </aside>

  <div id="infoCard" class="hidden"></div>
  <div id="hud" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
  <div id="toast"></div>
  <div id="confetti"></div>
  <div id="loading"><div class="ld-runner">🏃</div><div>小飛人跑步學堂 準備緊……</div></div>
</div>

跑步學堂！",p:["你好！我係林教練。由今日開始，我會陪你一齊學跑步：跑得快、跑得耐、仲要跑得開心！","每一站都有四樣嘢：睇 3D 示範、聽廣東話講解、跟住做、答小問題。完成一站就有一粒星星。"],demo:{run:"wave",cam:"home",coach:"wave"},beats:{1:{run:"cheer"}}},{t:"點樣睇 3D 畫面",p:["一隻手指喺畫面上面掃，就可以轉角度，由前面、側面、後面、上面睇都得。","兩隻手指撥開或者縮埋，就可以放大縮細。兩隻手指一齊拖，就可以移動畫面。","畫面右下角有方向掣，可以前、後、左、右、上、下咁行。試吓轉去睇小飛對腳！"],demo:{run:"highKnees",cam:"threeq",coach:"point",label:"高抬腿"}},{t:"撳一撳，有驚喜！",p:["3D 入面好多嘢都撳得：寶箱會打開、雪糕筒會彈起、水樽個蓋會掀起，連小飛身上嘅肌肉都撳得！","有啲嘢仲可以用手指拖住郁，例如雪糕筒。依家試吓撳一撳旁邊嗰個寶箱。"],demo:{run:"stand",cam:"threeq",props:["chest","cones","bottle"],coach:"point"},task:{type:"tap",target:"chest",label:"撳一撳寶箱 🎁"}},{t:"小喇叭、暫停掣同 🎬",p:["每段字旁邊都有一個小喇叭，撳一下就會用廣東話讀出嚟。","有 🎬 嘅段落，老師讀到嗰陣，3D 小飛就會做返嗰段講緊嘅動作。你亦可以直接撳嗰段字，叫小飛再做一次。","你轉角度、放大縮細，老師都會繼續講，唔會停。想停嘅話，就撳上面嘅「暫停語音」掣。"],demo:{run:"stand",cam:"home",coach:"talk"},beats:{1:{run:"aMarch",label:"🎬 A 步"},2:{run:"stand",label:null}}},{t:"點樣學得最好？",p:["第一，一次學一樣嘢就夠，唔使貪心。第二，學完即刻起身試吓做，身體記得最快。","第三，睇示範嗰陣，留意綠色剔號係啱嘅做法，紅色交叉係唔啱嘅做法，比較吓有咩唔同。","第四，有問題就要答，答啱先可以去下一步。聽日再嚟溫多次，會記得更加實。準備好未？"],demo:{run:"cheer",cam:"home",coach:"thumbs"},ask:{q:"見到綠色剔號 ✅ 嘅示範，代表咩？",o:["錯誤做法","正確做法","唔使理"],a:1,ex:"綠色剔號係啱嘅做法，紅色交叉係錯嘅，比較吓就識。"}}]},{id:"mind",icon:"🧠",title:"跑步心法",sub:"個心同身體一齊練",color:"#ec407a",steps:[{t:"個心同身體，係一齊練㗎",p:["有人以為要先練好個心，個人先至可以練。其實唔係咁㗎！個心同身體係一齊大、一齊進步嘅。","每一次你準時嚟練習、試吓新動作、攰嗰陣都完成最後一組，你個心就已經練緊。","所以唔使等「準備好」先開始。開始咗，信心就會慢慢生出嚟。"],tip:"信心唔係等返嚟，係「做」返嚟嘅。",demo:{run:"jog",cam:"sideFar",coach:"talk"}},{t:"神奇嘅兩隻字：「仲未」",p:["如果你話「我跑唔快」，可以加兩隻字：「我仲未跑得快」。","「仲未」即係話：我依家未得，但係我練緊，遲啲就得。咁樣諗嘅小朋友會更加肯練習，進步更快。","做錯唔緊要，錯咗就係話畀你知下次可以點樣改，個腦會因為咁而變得更勁。"],demo:{run:"think",cam:"upper",coach:"talk"},beats:{2:{run:"thumbs"}}},{t:"同自己比，唔好同人比",p:["每個人嘅身高、年紀、練咗幾耐都唔同，所以同人比冇咩意思。","最好係同「昨日嘅自己」比：今日快咗零點一秒？今日跑多咗一個燈柱？呢啲都係進步！","你最好嘅成績叫做「個人最佳」，英文叫 PB。每次打破自己嘅紀錄，就值得慶祝。"],tip:"喺「我的進步」頁可以記低你嘅紀錄，睇住條線向上升。",demo:{run:"stand",cam:"threeq",coach:"thumbs",props:["bottle"]},beats:{2:{run:"cheer"}}},{t:"專心：一次諗一樣嘢",p:["跑步嗰陣，個腦唔可以諗晒所有嘢。揀一個「提示字」就夠，例如「推地」、「手肘向後」或者「放鬆」。","如果你發覺自己諗咗第二啲嘢，例如望人、擔心輸，唔緊要，喺心入面講一聲「返嚟」，再諗返你個提示字。","對眼望住前面嘅目標，例如終點線，或者前面嗰支燈柱。"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.6,label:"💭「推地！」"},beats:{1:{label:"💭「返嚟！放鬆！」"},2:{label:"👀 望住終點"}}},{t:"同自己講好說話（自我對話）",p:["我哋個腦入面成日有把聲。如果把聲講「我唔得㗎喇」，雙腳都會軟晒。","試吓換成：「我得㗎！」「放鬆，快！」「一步一步嚟！」「我練過㗎！」","揀一句你最鍾意嘅，攰嗰陣喺心入面講三次。呢個叫做「自我對話」，好多奧運選手都用。"],demo:{run:"breathe",cam:"upper",coach:"talk",label:"😟「我唔得…」"},beats:{1:{run:"heroPose",label:"😄「我得㗎！」"}}},{t:"呼吸定驚法：聞花、吹蠟燭",p:["比賽之前緊張，心跳得好快，係正常㗎，代表你個身體準備緊！","用鼻慢慢吸氣，好似聞一朵好香嘅花，數一、二、三、四。再用口慢慢呼氣，好似吹熄生日蠟燭，數一、二、三、四。","睇吓小飛個肚：吸氣時個肚脹起，呼氣時個肚縮返。做三至五次，個心就會靜啲。"],demo:{scene:"breath",mode:"calm",cam:"upper",coach:"breathe"},task:{type:"breath",cycles:4,label:"開始呼吸練習 🌸"}},{t:"想像練習：閉埋眼「睇」自己跑",p:["閉埋眼，想像自己企喺起點，聽到槍聲，雙腳用力推地衝出去，手擺得好有力，越跑越順，最後衝過終點線。","睇吓小飛頭頂嗰舊雲：入面就係佢想像緊嘅自己。佢「睇」到自己做得好，感受到成功嘅感覺。","運動心理學叫呢個做「意象訓練」或者「想像練習」。個腦好似預先綵排咗一次，到你真係跑嗰陣，身體就更加識做，亦冇咁驚。","每晚瞓覺前，閉埋眼想像一次，大約一分鐘就夠。記住要想像「做得好」嘅樣，唔好想像跌低。"],tip:"想像時要用晒五感：聽到槍聲、感覺到腳推地、見到終點線。",demo:{scene:"imagine",coach:"talk"},task:{type:"timer",secs:20,label:"閉埋眼想像 20 秒 👀"}},{t:"賽前「招牌程序」：好似保特咁",p:["世界紀錄保持者保特（Usain Bolt），每次比賽前都會好輕鬆咁同觀眾玩、做鬼臉、擺佢嘅「閃電」招牌動作。","佢唔係玩玩吓咁簡單：呢套固定嘅動作，令佢放鬆、唔緊張，又提醒自己「準備好喇」。運動心理學叫呢個做「賽前例行程序」。","你都可以整一套自己嘅：① 抖鬆手腳；② 聳起膊頭，數三聲，再「啪」一聲放低；③ 慢慢深呼吸兩次；④ 做你嘅招牌動作，講你嘅提示字；⑤ 預備，專心聽槍聲。","每次比賽、每次測試都用同一套，個腦就會記得：做完呢套，就係「出發模式」。"],demo:{scene:"routine",cam:"threeq",coach:"talk"},beats:{2:{drill:0},3:{drill:3}}},{t:"小測驗：心法",quiz:[{q:"你今次 50 米跑輸咗畀同學，最好點諗？",o:["我好差，唔想跑喇","我仲未跑得快，但係我練緊","一定係對鞋唔好"],a:1,ex:"加「仲未」兩隻字，代表你會繼續進步！"},{q:"跑步嗰陣，個腦應該諗幾多樣嘢？",o:["越多越好","一個提示字就夠","乜都唔好諗"],a:1,ex:"揀一個提示字，例如「推地」或者「放鬆」，專心做好佢。"},{q:"閉埋眼「睇」自己跑得好，叫做咩練習？",o:["意象訓練（想像練習）","自我實現","飲水練習"],a:0,ex:"意象訓練令個腦預先綵排，身體更識做。"},{q:"保特比賽前做招牌動作，係為咗咩？",o:["嚇對手","放鬆同進入狀態","冇原因"],a:1,ex:"固定嘅賽前程序幫佢放鬆、專心。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"warm",icon:"🔥",title:"熱身",sub:"郁起身先，唔好冷車開跑",color:"#ff7043",steps:[{t:"點解要熱身？",p:["你個身體好似一部車，冷車即刻開到最快，好容易壞。熱身就係慢慢預熱部車。","熱身會令心跳快啲、肌肉暖啲、軟啲，關節好似加咗油咁順，跑得快之餘又唔易受傷。","跑步前做「郁動式熱身」：一路郁一路熱。[[大約 8 至 10 分鐘|大約 10 至 15 分鐘]]就夠。靜止咁拉筋留返跑完先做。"],tip:"熱身做完，應該覺得身體暖咗、少少出汗，但唔攰。",demo:{run:"jogInPlace",cam:"threeq",coach:"talk",label:"原地慢跑"}},{t:"① 輕鬆慢跑",p:["慢慢跑，慢到可以同朋友傾偈都唔會喘。喺海旁，可以由一支燈柱跑去下一支燈柱，再慢慢跑返轉頭。","[[跑大約 2 至 3 分鐘|跑大約 3 至 5 分鐘]]。手放鬆擺，望前面。"],demo:{run:"easy",cam:"sideFar",coach:"talk",label:"輕鬆慢跑"},task:{type:"timer",secs:60,label:"原地慢跑 60 秒 🏃"}},{t:"② 手臂畫圈",p:["雙手伸直打開，好似飛機翼咁。先向前細細個圈，再慢慢畫大圈，然後向後畫。","向前 10 次，向後 10 次。熱完膊頭，擺手就會擺得順。"],demo:{run:"armCircles",cam:"front",coach:"talk",hl:["shoulder"],label:"手臂畫圈"},task:{type:"timer",secs:30,label:"手臂畫圈 30 秒"}},{t:"③ 前後擺腿",p:["一隻手扶住欄杆，企直身，外面嗰隻腳好似鐘擺咁前後擺。","由細細擺開始，慢慢擺高啲。身體企直，唔好跟住隻腳搖。每邊 10 下。"],demo:{run:"legSwing",cam:"side",coach:"talk",hl:["hamstring","hipflexor"],label:"前後擺腿"},task:{type:"timer",secs:20,sides:2,label:"擺腿：每邊 20 秒"}},{t:"④ 高抬腿",p:["原地或者慢慢向前，膝頭輪流抬高到差唔多同腰一樣高，腳尖勾起，用前腳掌輕輕落地。","手肘彎住，前後擺。想像地下好熱，要快快提腳！做 [[15|20]] 米，或者原地 20 秒。"],demo:{run:"highKnees",cam:"side",coach:"talk",hl:["hipflexor"],label:"高抬腿"},task:{type:"timer",secs:20,label:"高抬腿 20 秒"}},{t:"⑤ 踢屁股",p:["膝頭向下，腳跟輪流向後踢去碰自己個屁股。","身體企直，用前腳掌落地，節奏要快。熱咗大腿前面嘅肌肉，跑步收腳就會快啲。"],demo:{run:"buttKicks",cam:"side",coach:"talk",hl:["hamstring","quad"],label:"踢屁股"},task:{type:"timer",secs:20,label:"踢屁股 20 秒"}},{t:"⑥ 弓步",p:["向前踏一大步，後面個膝頭慢慢落到差唔多掂地，前面個膝頭唔好超過腳尖太多。","身體企直，再起身踏返轉頭，換另一隻腳。每邊做 [[4|6]] 次。"],demo:{run:"lunges",cam:"side",coach:"talk",hl:["quad","glute","hipflexor"],label:"弓步"},task:{type:"timer",secs:30,label:"弓步 30 秒"}},{t:"⑦ A 步（跑步技術操）",p:["A 步係短跑選手每日都做嘅練習。一隻膝頭抬高到大腿差唔多打橫，腳尖勾起，然後用前腳掌「啪」一聲踩落身體下面。","先慢慢「行」，叫 A 踏步；熟咗就加細細跳，叫 A 跳步。手同腳要相反：左腳上，右手向前。"],demo:{run:"aMarch",cam:"side",coach:"talk",hl:["hipflexor","calf"],label:"A 踏步"},beats:{1:{run:"aSkip",label:"A 跳步"}},task:{type:"timer",secs:30,label:"A 踏步 30 秒"}},{t:"⑧ 腳踝彈跳",p:["雙腳併埋，用前腳掌好似彈簧咁原地細細跳。膝頭差唔多伸直，腳踝要「硬淨」，好似彈彈波。","落地要靜，好似貓仔咁。呢個練習會令你跑步嗰陣更加彈、重心更加高。跳 [[10|15]] 下。"],demo:{run:"pogo",cam:"side",coach:"talk",hl:["calf","achilles"],com:!0,label:"腳踝彈跳"},task:{type:"timer",secs:15,label:"腳踝彈跳 15 秒"}},{t:"⑨ 加速跑",p:["熱身最後一樣：加速跑。由慢慢跑開始，越跑越快，去到大約七至八成快，再慢慢停。","跑大約 [[30|40 至 60]] 米，做兩至三次，每次行返轉頭休息。做完，你個身體就準備好去跑快喇！"],demo:{run:"standingStartSeq",cam:"sideFar",coach:"point",label:"加速跑"}},{t:"小測驗：熱身",quiz:[{q:"跑步之前應該做邊種熱身？",o:["坐喺度拉筋 5 分鐘","郁動式熱身：慢跑、擺腿、高抬腿","唔使熱身"],a:1,ex:"跑步前要一路郁一路熱，靜止拉筋留返跑完先做。"},{q:"熱身做完應該覺得點？",o:["暖咗、少少汗、唔攰","攰到唔想郁","同未做一樣凍"],a:0,ex:"熱身係預熱部車，唔係用晒啲油。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"stretch",icon:"🧘",title:"拉筋放鬆",sub:"跑完要好好照顧肌肉",color:"#26a69a",steps:[{t:"拉筋嘅規則",p:["跑完步先慢慢行或者慢跑三至五分鐘，等心跳慢落嚟，然後先拉筋。","每個拉筋停住 [[15 至 20|20 至 30]] 秒，慢慢呼吸。感覺應該係「緊緊地、但係舒服」，唔可以痛。","唔好彈、唔好扯，好似拉橡筋糖咁慢慢拉。左右兩邊都要做。"],tip:"撳小飛身上嘅肌肉，可以睇吓佢叫咩名、做咩用。",demo:{run:"breathe",cam:"threeq",coach:"talk",muscle:!0}},{t:"① 小腿拉筋",p:["雙手撐住牆，一隻腳向後踏，後腳伸直，腳跟貼實地，腳尖向前。前面隻腳屈膝。","身體由頭到後腳跟成一條斜線，慢慢向前傾，你會覺得後面隻腳嘅小腿緊緊地。用前腳掌跑步嗰陣小腿好辛苦，要好好拉一拉。"],demo:{run:"calfStretch",cam:"side",muscle:!0,hl:["calf","achilles"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"小腿：每邊 20 秒"}},{t:"② 大腿前面",p:["企直，一隻手捉住同一邊隻腳嘅腳背，將腳跟拉近屁股。兩個膝頭盡量貼埋，向下指。","企唔穩可以用另一隻手扶住欄杆。唔好彎腰，個肚要收住。"],demo:{run:"quadStretch",cam:"side",muscle:!0,hl:["quad"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"大腿前面：每邊 20 秒"}},{t:"③ 大腿後面",p:["一隻腳向前放，腳跟掂地、腳尖勾起，膝頭伸直。後面隻腳微微屈膝。","背脊保持直，好似一塊板咁，由屁股開始向前摺，雙手放喺前面隻腳嘅大腿上面。你會覺得大腿後面拉緊。"],tip:"大腿後面嘅肌肉係短跑嘅「扒地」肌肉，好重要！",demo:{run:"hamStretch",cam:"side",muscle:!0,hl:["hamstring"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"大腿後面：每邊 20 秒"}},{t:"④ 跪低弓步：髖屈肌",p:["一隻膝頭跪喺地（可以墊條毛巾），腳背平放喺地。另一隻腳喺前面踩地，膝頭屈成直角。","身體企直，屁股慢慢向前推，雙手可以舉高。你會覺得跪低嗰隻腳嘅大腿頂、近個肚嗰度拉緊。呢度係負責抬膝頭嘅肌肉。"],demo:{run:"hipFlexorStretch",cam:"side",muscle:!0,hl:["hipflexor","quad"],coach:"talk"},task:{type:"timer",secs:20,sides:2,label:"髖屈肌：每邊 20 秒"}},{t:"⑤ 屁股拉筋（坐地 4 字）",p:["坐喺地下，雙手放喺屁股後面撐住地，一隻腳屈膝踩地。","將另一隻腳嘅腳踝擱喺踩地嗰隻腳嘅膝頭上面，兩隻腳好似一個「4」字。","背脊坐直，心口慢慢向前少少，你會覺得屁股入面拉緊。屁股肌肉係你跑步嘅大引擎。"],demo:{run:"glute4",cam:"threeq",muscle:!0,hl:["glute"],coach:"talk",dist:.8},task:{type:"timer",secs:20,sides:2,label:"屁股：每邊 20 秒"}},{t:"⑥ 蝴蝶式",p:["坐喺地下，兩隻腳板對住腳板，膝頭向兩邊打開，好似蝴蝶翼。","雙手捉住腳，背脊企直，慢慢向前傾少少。唔好用手大力壓膝頭。"],demo:{run:"butterfly",cam:"front",muscle:!0,hl:["adductor"],coach:"talk",dist:.8},task:{type:"timer",secs:20,label:"蝴蝶式 20 秒"}},{t:"⑦ 肩膊同手臂",p:["一隻手打橫伸過心口，另一隻手勾住佢個手肘，輕輕拉近身體，膊頭要放鬆。","跟住將手舉高，屈手肘令隻手跌落背脊，另一隻手輕輕推住手肘。擺手擺得好，靠嘅就係呢度。"],demo:{run:"shoulderStretch",cam:"front",muscle:!0,hl:["shoulder","triceps"],coach:"talk"},beats:{1:{run:"tricepsStretch"}},task:{type:"timer",secs:15,sides:2,label:"肩膊：每邊 15 秒"}},{t:"⑧ 嬰兒式：放鬆背脊",p:["跪低，屁股坐落腳跟，身體向前趴落大腿，雙手向前伸直，手掌貼地。","慢慢深呼吸，每次呼氣都覺得自己鬆多啲。呢個係完成訓練最舒服嘅一個動作！"],demo:{run:"childPose",cam:"floor",muscle:!0,hl:["back"],coach:"talk"},task:{type:"timer",secs:20,label:"嬰兒式 20 秒"}},{t:"小測驗：拉筋",quiz:[{q:"拉筋嗰陣應該有咩感覺？",o:["好痛先至有用","緊緊地但係舒服","冇感覺"],a:1,ex:"痛就代表拉得太盡，要鬆返少少。"},{q:"靜止拉筋最好喺幾時做？",o:["跑完、身體暖咗嗰陣","一起身未郁之前","比賽起跑前一秒"],a:0,ex:"跑完步肌肉暖，拉筋最安全、效果最好。"},{q:"坐地 4 字拉筋，隻腳踝擱喺邊？",o:["另一隻腳嘅膝頭上面","地下","屁股下面"],a:0,ex:"腳踝擱喺膝頭上面，兩隻腳成一個 4 字。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"form",icon:"🏃",title:"跑步姿勢",sub:"高、鬆、快三個字",color:"#1e88e5",steps:[{t:"靚姿勢三個字：高、鬆、快",p:["高：身體企高高，好似頭頂有條繩吊住你。鬆：面、膊頭、手都要放鬆。快：腳步快快、輕輕。","整個人好似一個彈簧，每一步都向前彈出去，唔係向上跳，亦唔係拖住隻腳行。","你可以由唔同角度睇吓小飛跑，留意佢個頭、手、腰同腳。"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.5},beats:{2:{cam:"threeq"}}},{t:"對眼望邊？",p:["跑短跑：起跑時望住前面地下，跑起之後慢慢抬頭，對眼望住自己條跑道嘅終點。","跑長跑：望前面大約十至二十米，即係大約前面一兩支燈柱嘅位置。","下巴保持平，唔好低頭望自己對腳，亦唔好仰起頭。低頭會令身體縮埋，仰頭會令身體向後拗。","仲有：唔好轉頭望隔籬！一轉頭，身體就會歪，速度即刻慢。"],demo:{compare:["jog","lookDown"],cam:"sideFar",coach:"talk"}},{t:"個精神 focus 喺邊？",p:["你嘅精神要放喺「自己」同「前面」：自己嘅動作、自己嘅呼吸、前面嘅目標。","最好用一個「向外」嘅提示，例如「推開個地」、「手肘向後撞門」、「好似踩喺熱鑊上面」。研究發現，咁樣諗比諗「我要用大腿肌肉」更有效。","面要鬆，可以微微笑。牙唔好咬實，膊頭唔好聳起，咁樣身體先跑得順。"],demo:{compare:["jog","tense"],cam:"sideFar",coach:"talk"}},{t:"手點樣擺？前同後一樣大",p:["手肘屈成大約九十度，好似一個「L」字。由膊頭開始前後擺，好似鐘擺咁。","向前同向後嘅幅度差唔多一樣大：短跑時，向前擺到手大約喺下巴咁高；向後擺到手經過屁股旁邊，手肘喺身體後面。長跑就擺細啲。","向後擺嗰陣手肘會打開少少，所以睇落隻手好似細啲，其實個膊頭轉嘅角度差唔多。教練成日講：「手肘向後撞，同手向前一樣用力」。","最重要：手要前後擺，唔好橫過身體中間。手橫擺會令身體左右扭，浪費力。"],demo:{compare:["armsGood","armsCross"],cam:"front",coach:"talk",hl:["shoulder"]}},{t:"點樣練擺手？",p:["練習一：坐喺地下，雙腳伸直，用跑步咁樣擺手。擺得啱嘅話，個身唔會左搖右擺；擺得太橫，個屁股會搖嚟搖去。","練習二：企喺鏡前面擺手，睇吓手有冇橫過身體中間，膊頭有冇聳起。","小秘密：手擺得快，腳就會跟住快；手擺得大，步就會跨得大。手同腳係好朋友！"],demo:{run:"seatedArms",cam:"front",coach:"talk",hl:["shoulder","triceps"],label:"坐地擺手"},beats:{1:{run:"armsGood",label:"企定擺手"}},task:{type:"timer",secs:20,label:"坐地擺手 20 秒"}},{t:"腳點樣擺？幅度幾大？",p:["短跑：膝頭向前向上抬，抬到大腿差唔多同地面平衡。腳尖勾起，好似有條繩拉住腳趾向上。然後隻腳好似車轆咁，向下、向後「扒」個地。","腳要落喺身體附近，唔好伸長隻腳去踩前面好遠嘅地方，咁樣好似踩咗煞車掣。","長跑：膝頭唔使抬咁高，步細啲、快啲，輕輕鬆鬆咁行前就得。"],demo:{compare:["jog","overstride"],cam:"sideFar",coach:"talk",hl:["hipflexor","hamstring"],axis:!0}},{t:"觸地位置：貼住重心垂直線",p:["想像由小飛個重心（黃色波波）垂直咁拉一條線落地，呢條就係「重心垂直線」。","最高速跑嗰陣，身體條軸差唔多企直，隻腳要喺呢條線「差少少前」甚至正下面著地，著地嗰陣隻腳仲要向後扒。睇吓地上：綠色 = 好貼近，橙色 = 前咗少少，紅色 = 太前。","腳伸到好前先著地，條腳就好似一支斜斜嘅棍撐住個身，等於踩煞車，好嘥力。紅衫嗰個就係咁。","你可能會問：可唔可以永遠都喺後面著地？加速嗰陣可以，而且應該咁做；但係去到最高速，如果每一步都喺後面著地，你就會一直加速落去，所以最高速時要喺正下面或者前少少著地，咁先保持到速度。"],tip:"口訣：加速 —— 腳喺重心後面推；全速 —— 腳喺重心下面扒。",demo:{compare:["sprint","overstride"],cam:"side",coach:"point",axis:!0,slow:.3},ask:{q:"最高速跑嗰陣，隻腳應該喺邊度著地？",o:["伸到好前面先著地","重心垂直線正下面或者差少少前","好後面"],a:1,ex:"貼住重心垂直線著地，再向後扒地，就唔會踩煞車。"}},{t:"重心幾時最低？好似彈簧咁",p:["睇吓黃色虛線，佢係小飛重心行過嘅路線：每一步都好似一條拋物線。","腳著地之後，身體好似壓落一個彈簧，重心再跌少少，去到條腳喺重心正下面嗰一刻，重心最低，條腳受力最大。","跟住條腳好似彈簧咁彈返直，推個身向前向上，離地之後重心飛出一條拋物線，再落去下一步。","跑得越快、越好嘅跑手，條彈簧越「硬淨」：重心最低點都企得高高，上落好少，唔會一壓就坐低。"],demo:{run:"sprint",cam:"side",coach:"talk",axis:!0,trail:!0,slow:.25}},{t:"用腳邊度落地？",p:["跑短跑要用前腳掌落地，即係腳趾後面、肉肉嗰度。腳跟可以輕輕掂一掂地，但係唔好成隻腳「拍」落去。","成隻腳掌踩落去，膝頭會屈得深，個人沉落去，好似坐低咗咁，接住再加速就慢咗。","不過跑長跑唔同：用腳掌中間平平咁落地就得，落喺身體下面，唔使刻意踮腳。成日踮腳跑長途，小腿同腳跟筋會好辛苦，甚至受傷。"],tip:"短跑：前腳掌。長跑：腳掌中間，輕輕、靜靜咁落地。",demo:{compare:["sprint","sprintLow"],cam:"side",coach:"talk",hl:["calf"],com:!0,slow:.35}},{t:"重心要高！",p:["重心就係你身體重量嘅中心，大約喺肚臍下面、盤骨入面。睇吓個黃色波波，就係小飛嘅重心。","跑得快嘅人，重心保持高：膝頭唔會屈得太深，屁股唔會「坐低」。咁樣每一步都好似彈簧咁彈出去。睇吓黃色箭嘴 ⬆。","重心低嘅人，好似坐低咗跑，每一步都要用力撐返起身，好嘥力。紅色箭嘴 ⬇ 就係話佢重心太低。比較吓兩個人個波波高度！"],demo:{compare:["sprint","sprintLow"],cam:"side",coach:"point",com:!0,comUp:"compare",slow:.5},ask:{q:"跑得快嘅人，重心係點？",o:["好低，好似坐低咁","保持高，好似彈簧","冇所謂"],a:1,ex:"重心高，每一步都好似彈簧咁彈出去。"}},{t:"點樣練到重心高？",p:["遊戲一「熱鑊」：想像地下係好熱嘅鑊，腳一掂地就要彈起，用前腳掌、快快咁提腳。","遊戲二「安靜腳」：跑嗰陣聽吓自己對腳，越靜越好。成隻腳拍落地會好嘈。","練習三：腳踝彈跳、踮腳行、跳繩，全部都會令小腿同腳踝好似彈簧咁。","練習四：撐牆跑。雙手撐住牆，身體斜斜成一條直線，輪流抬膝頭。學識咗用前腳掌撐住身體。"],demo:{run:"pogo",cam:"side",coach:"talk",hl:["calf","achilles"],com:!0,comUp:!0,label:"熱鑊彈跳"},beats:{2:{run:"skipping",label:"跳繩",props:[]},3:{run:"wallDrill",label:"撐牆跑",comUp:!1}},task:{type:"timer",secs:20,label:"試吓：熱鑊彈跳 20 秒 🔥"}},{t:"撐牆跑練習",p:["企喺牆前面，雙手伸直撐住，身體由頭到腳斜斜咁成一條直線，好似一塊木板。","用前腳掌企，然後輪流將膝頭抬起，腳尖勾起，再踩返落身體下面。個身唔使上上落落。","呢個練習教你：身體向前傾，腳要喺身體下面推地。係短跑起跑嘅秘密武器！"],demo:{run:"wallDrill",cam:"side",coach:"talk",hl:["hipflexor","glute"],label:"撐牆跑"},task:{type:"timer",secs:20,label:"撐牆跑 20 秒"}},{t:"條腰點樣？",p:["腰板要直，好似一條硬淨嘅柱。個肚輕輕收住，好似準備有人輕輕篤一篤你個肚咁。","身體由腳踝開始少少向前傾，好似一棵樹微微向前，唔係由條腰度彎落去。","唔好寒背，亦唔好挺住個肚向後拗。腰軟咗，腳推地嘅力就會漏走晒。"],demo:{compare:["jog","slouch"],cam:"sideFar",coach:"talk",hl:["abs","back"],muscle:!0}},{t:"整體動作：好似車轆咁轉",p:["將所有嘢砌埋：頭平、眼望前、膊頭鬆、手肘九十度前後擺、腰板直、身體微微前傾、膝頭向前、腳落喺身體下面、前腳掌推地。","成個人嘅動作要順、要有節奏，好似車轆咁一圈一圈咁轉，唔係一下一下咁跳。","左右兩邊要一樣，好似照鏡咁。轉吓角度，由前面睇，小飛係唔係行直線？"],demo:{run:"sprint",cam:"side",coach:"thumbs",slow:.5},beats:{2:{cam:"back"}}},{t:"小測驗：姿勢",quiz:[{q:"跑短跑應該用腳邊度落地？",o:["腳跟","前腳掌","成隻腳掌拍落地"],a:1,ex:"前腳掌落地令重心保持高，好似彈簧咁彈出去。"},{q:"手應該點樣擺？",o:["橫過身體中間","手肘九十度，前後擺，前後幅度差唔多","只係向前擺"],a:1,ex:"前後擺，好似鐘擺，向前同向後差唔多一樣大。"},{q:"跑長跑應該望邊？",o:["望自己對腳","前面十至二十米","望天"],a:1,ex:"下巴平，望前面一兩支燈柱咁遠。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"breath",icon:"🌬️",title:"呼吸調氣",sub:"跑前、跑中、跑後點樣呼吸",color:"#29b6f6",steps:[{t:"點解跑步要識呼吸？",p:["每吸一啖氣，你個肺就將「氧氣」送入血，血再帶去肌肉，好似幫引擎加油。每呼一啖氣，就將用完嘅「二氧化碳」排出去。","跑得越辛苦，肌肉要嘅氧氣越多，所以你會喘、心跳會快，呢個係身體自動加大油門。","跑短短嘅一百米，肌肉主要用住佢入面本身儲住嘅「快速能量」，所以十幾秒都可以好快。但係都唔好谷住氣，要自然呼吸。跑長跑就好靠氧氣，呼吸方法更加重要。"],demo:{scene:"breath",mode:"calm",coach:"talk"}},{t:"你諗嘅「儲定氧氣」，係真定假？",p:["好多人以為跑之前大力深呼吸好多次，可以「儲定」啲氧氣。其實你平時個血入面嘅氧氣已經差唔多滿晒，儲唔到幾多。","如果急急咁大力呼吸好多次，反而會呼走太多二氧化碳，令你頭暈、手指麻痺，咁就唔好喇。","跑之前最好係：慢慢、深深咁呼吸幾次，呼氣長過吸氣，令個心靜落嚟、肌肉放鬆。咁樣先係真正嘅「準備好」。"],tip:"跑前：慢、深、呼氣長啲。唔好急急咁大力喘氣。",demo:{scene:"breath",mode:"calm",coach:"talk"},ask:{q:"比賽前急急咁大力深呼吸好多次，會點？",o:["儲到好多氧氣","可能頭暈、手指麻","跑快一倍"],a:1,ex:"血入面氧氣本身差唔多滿，大力喘氣反而會頭暈。"}},{t:"用個肚呼吸（腹式呼吸）",p:["將一隻手放喺個肚。用鼻吸氣，個肚好似波波咁脹起；用口慢慢呼氣，個肚縮返入去。","睇吓小飛：吸氣時個肚脹起，有藍色嘅空氣入去；呼氣時白色嘅氣出返嚟。","用個肚呼吸，可以吸得深啲，膊頭又唔會聳起。每日練三分鐘，跑步嗰陣就自然識。"],demo:{scene:"breath",mode:"calm",coach:"breathe"},task:{type:"breath",cycles:4,label:"一齊用個肚呼吸 🌸"}},{t:"短跑嗰陣點樣呼吸？",p:["「預備」嗰陣，可以輕輕吸一啖氣，專心聽槍聲。","起跑之後，唔好成程谷住啖氣。口微微打開，自然咁呼吸，好多選手跑一百米都會換幾次氣。","呼氣嗰陣順便放鬆膊頭同塊面。谷住氣會令全身繃緊，反而跑慢咗。"],demo:{run:"crouchStart",cam:"sideFar",coach:"talk"}},{t:"長跑嗰陣：跟住腳步呼吸",p:["長跑可以用「數步呼吸」：輕鬆跑嗰陣，兩步吸氣、兩步呼氣。即係「左、右」吸，「左、右」呼。","跑得辛苦啲，可以變成兩步吸、一步呼，換氣快啲。","用鼻同口一齊呼吸，吸得多啲氣。輕鬆跑時，應該仲可以講到一句完整嘅說話，呢個叫「講說話測試」。"],demo:{scene:"breath",mode:"run",coach:"talk"},beats:{1:{scene:"breath",mode:"hard"}},task:{type:"breath2",label:"跟住拍子：2 步吸、2 步呼 👟"}},{t:"跑完：慢慢恢復",p:["衝完唔好即刻坐低或者瞓喺地下。慢慢行一兩分鐘，令心跳慢慢落返嚟。","有研究發現，雙手撐住膝頭、微微彎腰，呼吸會恢復得快啲。企直、雙手擺頭頂都得，最緊要係慢慢行、慢慢呼吸。","用「吸三下、呼五下」：呼氣長過吸氣，身體就會慢慢放鬆。喘定之後，就去飲水同拉筋。"],demo:{scene:"breath",mode:"recover",coach:"breathe"},beats:{1:{run:"handsOnKnees",label:"雙手撐膝頭"}}},{t:"肚側痛（岔氣）點算？",p:["跑跑吓肚側邊好似針拮咁痛，叫做「岔氣」。佢唔係真正嘅抽筋，通常同食完飯太快跑、呼吸太急有關。","處理方法：跑慢啲或者行一陣，深深咁用個肚呼吸，用手輕輕按住痛嘅位置，呼氣時慢慢講「呼——」。","預防：練習前一個鐘唔好食太飽，熱身要做足，呼吸要有節奏。"],demo:{run:"handsOnKnees",cam:"threeq",coach:"talk",hl:["oblique"]}},{t:"小測驗：呼吸",quiz:[{q:"長跑輕鬆跑嗰陣，可以點樣呼吸？",o:["谷住氣","兩步吸、兩步呼","只用口急急咁喘"],a:1,ex:"數步呼吸令呼吸有節奏。"},{q:"跑一百米應唔應該成程谷住氣？",o:["應該","唔應該，要自然呼吸"],a:1,ex:"谷氣會令全身繃緊。"},{q:"衝完之後點樣恢復最好？",o:["即刻瞓喺地下","慢慢行，呼氣長過吸氣"],a:1,ex:"慢慢行、慢慢呼，心跳會平穩落返嚟。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"sprint",icon:"⚡",title:"短跑",sub:"起跑、加速、衝線",color:"#fbc02d",steps:[{t:"短跑有四部分",p:["短跑好似一架飛機：一、起跑；二、加速，好似飛機喺跑道衝；三、最高速，好似飛上咗天；四、保持速度同衝線。","小朋友比賽通常跑 [[50 或 60 米|60 至 100 米]]。全程都要用盡力，但係用盡力唔等於繃緊，要「快而鬆」。"],demo:{run:"accelToSprint",cam:"sideFar",coach:"talk"}},{t:"起跑器係咩？",p:["正式比賽同奧運會用「起跑器」：地上有兩塊斜斜嘅踏板，前腳同後腳踩住佢，起跑時可以大力向後推。","前面塊踏板斜啲（大約四十五度），後面塊企身啲。腳尖要掂住地，腳板貼住踏板。","平時喺海旁練習冇起跑器都完全唔緊要：用站立式起跑，或者蹲低用腳尖撐地起跑，一樣練到推地同加速。"],demo:{run:"setHold",cam:"threeq",coach:"point",dist:.75}},{t:"站立式起跑（練習時最常用）",p:["強啲嗰隻腳放前，腳尖喺起跑線後面；另一隻腳放後，相隔大約一隻腳半。","雙膝微屈，身體向前傾，重心放喺前面隻腳。手同腳相反：前腳係左腳，就右手放前。","對眼望住前面兩三米嘅地下，等口令。"],demo:{run:"standingStartSeq",cam:"side",coach:"talk"}},{t:"蹲踞式起跑：「各就位」",p:["聽到「各就位」：雙手放喺起跑線後面，打開同膊頭一樣闊，手指撐起好似一座橋，手指同大拇指掂住地。","前腳踩前面嘅踏板，後腳踩後面嘅踏板，兩隻腳尖都要掂地。後面隻腳嘅膝頭跪喺地上，喺前腳旁邊。","頭放鬆，對眼望住雙手前面嘅地下。"],demo:{run:"marksHold",cam:"crouch",coach:"talk"},beats:{1:{cam:"feet"},2:{cam:"crouch"}}},{t:"「預備」：屁股升起",p:["聽到「預備」：屁股慢慢升起，升到比膊頭高少少。後面個膝頭離開地面。","前面隻腳嘅膝頭大約屈成直角，後面隻腳嘅膝頭打開啲。膊頭喺雙手正上面，甚至前少少，雙手伸直。","保持唔郁！呢一刻要專心聽，唔好估幾時開槍。"],demo:{run:"crouchStart",cam:"crouch",coach:"talk",slow:.6}},{t:"「砰！」第一步：用力撐地",p:["槍一響，兩隻腳一齊大力推踏板，後腳先離開，向前低低咁擺出去；手大力前後擺，好似用手肘撞開後面道門。","前腳一直推到成隻腳伸直先離開踏板。睇吓條橙色線：嗰個就係「撐地角度」，起步時大約四十五度，好似一支斜斜嘅竹篙撐住個身。","頭幾步要短、要快，腳落喺身體後面少少，用力向後推地，好似推一架好重嘅車。"],demo:{run:"blockGo",cam:"side",coach:"point",push:!0,slow:.35}},{t:"加速：身體由斜慢慢企直，重心逐步升高",p:["起跑後身體係斜嘅，好似就快向前仆，但係因為腳一步接一步咁及時撐住，所以唔會仆，仲會越嚟越快。呢個就係加速嘅秘密。","睇吓地上嘅綠色線：加速嗰陣，每一步隻腳都喺重心垂直線「後面」著地，條腳好似一支斜斜嘅竹篙向後撐，推個身向前。千祈唔好伸前去踩。","睇吓黃色虛線：佢係小飛重心行過嘅路線。每一步，撐地角度都大咗少少，身體條軸企直少少，重心就升高少少，好似飛機慢慢升空。去到全速，條軸差唔多垂直，隻腳就喺重心正下面著地。","[[你哋呢個年紀，大約頭 15 至 20 米|你哋呢個年紀，大約頭 18 至 25 米]]係加速段；奧運選手要跑三四十米先完全企直。千祈唔好一起步就抬頭企直，咁樣會浪費咗推力。頭要跟住身體條線，眼望前面地下幾米，身體一步一步慢慢企直，頭先慢慢抬起。步幅會由細細步，慢慢變大步。"],demo:{run:"blockGo",cam:"side",coach:"talk",trail:!0,push:!0,axis:!0,slow:.5},ask:{q:"加速嘅時候，重心係點樣變？",o:["一下子跳到最高","一步一步慢慢升高","越跑越低"],a:1,ex:"撐地角度越嚟越大，身體慢慢企直，重心逐步升高。"}},{t:"點樣唔會仆親？",p:["起跑仆倒，通常有三個原因：一、身體傾得太前，但係隻腳踏唔夠快；二、第一步跨得太大，隻腳踩唔到喺身體附近；三、太早抬頭企直，或者手唔擺。","解決方法：頭幾步要細步、快步，手大力擺嚟保持平衡，慢慢先企直。","練習「大樹倒下」：企直身，成個人好似一棵樹咁慢慢向前傾，傾到就快跌嗰陣，即刻快步衝出去。咁樣就學識身體同腳點樣配合。"],tip:"跑之前檢查地面：濕滑、有沙、凹凸唔平嘅地方唔好做起跑練習。",demo:{run:"fallingStart",cam:"side",coach:"talk"},task:{type:"confirm",label:"我試咗「大樹倒下」起跑 🌳"}},{t:"最高速：企高、放鬆",p:["加速完，身體條軸已經差唔多垂直，好似頭頂有條繩吊住你。用前腳掌快快咁踩，隻腳喺重心下面著地，膝頭向前抬。","呢個時候最重要係「放鬆」：面、膊頭、手都要鬆。越想用力去跑，身體越繃緊，反而越慢。","世界最快嘅短跑選手跑嗰陣，塊面都係鬆晒㗎！"],demo:{run:"sprint",cam:"side",coach:"talk",slow:.6,axis:!0}},{t:"望自己條跑道",p:["跑短跑，對眼要望住自己條跑道嘅終點，唔好望隔籬。","一轉頭望人，你個身體就會跟住扭，條線就跑歪咗，又會令你分心。","隔籬條跑道發生咩事都唔關你事，你只需要做好自己。"],demo:{scene:"race",mode:"lane",cam:"back",coach:"talk"}},{t:"如果有人跑贏你……",p:["見到有人喺前面，唔好慌！最多人犯嘅錯誤係：太想追，結果全身繃緊，手腳亂晒，反而越跑越慢。","你要做嘅係：保持放鬆，繼續用你嘅姿勢跑。所有人去到後半段都會慢落嚟，邊個慢得少，邊個就贏。","所以後半段，好多人係可以追返嘅！講句自己嘅提示字：「鬆、快！」"],demo:{scene:"race",mode:"ahead",cam:"race",coach:"talk"}},{t:"如果你跑贏緊……",p:["你領先咗，好叻！但係千祈唔好望後面，亦唔好減速。","好多人以為贏定，喺終點前慢落嚟，結果最後一步畀人追過。","你要一直衝，衝過終點線之後再跑多幾米先慢落嚟。終點線唔係你停嘅地方，係你衝過嘅地方。"],demo:{scene:"race",mode:"behind",cam:"race",coach:"talk"}},{t:"衝線技巧：真係衝過終點線",p:["睇吓前面：地上有黑白格嘅終點線，仲有一條黃色終點帶。","去到終點前一步，用心口向前「壓」過終點線，雙手向後擺。計時係計你嘅身體軀幹過線，唔係計手、腳或者頭。","唔好太早壓，太早會失平衡仆倒。初學嘅話，最緊要係用全速衝過終點線，再跑多幾米先慢慢停。"],demo:{run:"finishLine",cam:"side",coach:"point",finishZ:13},beats:{1:{slow:.5}}},{t:"點樣練短跑？",p:["短跑練習要「快、短、休息足」。每次跑[[ 15 至 30 米| 20 至 60 米]]，用九成以上嘅速度。","每跑完一次，慢慢行返轉頭，休息一至兩分鐘。休息足夠，下一次先可以真係跑得快。","做 [[4 至 6|5 至 8]] 次就夠。當你發覺自己慢咗、姿勢亂咗，就係時候收工。練「快」唔可以喺攰嘅時候練。"],tip:"短跑練習最好放喺熱身之後、身體最精神嘅時候。",demo:{run:"accelToSprint",cam:"sideFar",coach:"talk"}},{t:"小測驗：短跑",quiz:[{q:"蹲踞式「各就位」，雙手應該點？",o:["舉高","撐喺起跑線後面嘅地上","放喺膝頭"],a:1,ex:"手指撐地好似一座橋，喺起跑線後面。"},{q:"加速時身體應該點？",o:["即刻企直身","斜斜咁，一步一步慢慢企直","向後挨"],a:1,ex:"好似飛機起飛，重心逐步升高。"},{q:"你領先緊，應該點？",o:["望後面睇吓佢哋","終點前慢落嚟","一直衝，衝過終點線先慢"],a:2,ex:"衝過終點線再跑多幾米。"},{q:"計時係計身體邊個部分過終點線？",o:["手","頭","軀幹（心口）"],a:2,ex:"所以衝線時用心口向前壓。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"distance",icon:"🌊",title:"長跑策略",sub:"配速、梯隊、跟車、衝刺",color:"#00acc1",steps:[{t:"長跑就好似分配零用錢",p:["你嘅體力好似一份零用錢。如果一開始就用晒，後面就乜都冇得用。","小朋友比賽嘅長跑通常係 [[400 米至 1 公里|800 米至 2 公里]]，越野賽可能更長。","長跑最重要嘅唔係一開始最快，而係「識分配」：前面穩陣，後面先加快。"],demo:{run:"tempo",cam:"sideFar",coach:"talk"}},{t:"配速：勻速跑 ✅ 定衝到盡 ❌？",p:["睇吓兩個小朋友：紅衫嗰個 ❌ 一開始衝到盡，好快就拋離咗藍衫。","但係佢好快就攰：膊頭聳起、手擺唔起、速度越嚟越慢，好似「爆咗」咁。","藍衫嗰個 ✅ 用勻速跑：頭段好似落後少少，但係佢一直穩定，最後後來居上，仲有力衝刺！","練習時用海旁啲燈柱幫手：試吓每兩支燈柱之間用差唔多一樣嘅時間跑完。"],tip:"頭段應該覺得「有啲輕鬆、好似太慢」，咁就啱喇。",visual:"pace",demo:{scene:"pace",coach:"talk"}},{t:"第一梯隊定第二梯隊？",p:["開跑之後，啲人會自然分成一堆一堆。睇吓：前面橙色框嗰堆係「第一梯隊」，後面藍色框嗰堆係「第二梯隊」。每堆入面啲人都係散散地，唔會黐埋一齊。","應該跟邊堆？答案係：跟住同你「計劃速度」差唔多嘅嗰堆。如果你嘅實力喺最前，就跟第一梯隊；如果唔係，喺第二梯隊跑得舒服、穩陣，後面先追，好過硬跟第一梯隊然後爆。","喺跑道上，盡量唔好被人困喺中間出唔到嚟，要留意自己外面有冇位。"],demo:{scene:"packs",coach:"talk"},ask:{q:"你實力普通，最好跟邊個梯隊？",o:["硬跟第一梯隊","跟同自己速度差唔多嘅梯隊，後面先追"],a:1,ex:"跑自己嘅速度，後面先追，好過一開始爆咗。"}},{t:"跟領跑者，定跑自己？",p:["兩樣都要！主要係跑自己嘅速度，用呼吸同感覺去判斷。","如果前面嗰個人嘅速度同你計劃差唔多，你可以跟喺佢後面，佢幫你擋風，你仲可以慳返啲力，呢個叫「跟車」。","但如果你發覺自己喘到講唔到嘢、手腳開始繃緊，即係佢太快喇。放手畀佢走，跑返你自己嘅速度。好多時，嗰啲衝得太快嘅人，後面你會追返。"],demo:{scene:"race",mode:"draft",cam:"race",coach:"talk"}},{t:"咩叫「撞牆」？",p:["「撞牆」本來係講跑馬拉松嘅人，跑到三十幾公里，身體儲落嘅能量用晒，好似撞埋一幅牆咁，突然跑唔郁。","小朋友跑短啲嘅長跑，比較常見嘅係「一開始太快，然後爆咗」。特徵係：雙腳好似灌咗鉛咁重、呼吸亂晒、膊頭聳起、姿勢散晒、好想停。","有時仲會頭暈、肚痛、好口渴。如果頭暈或者唔舒服，要即刻停低，話畀大人知。"],demo:{run:"tense",cam:"sideFar",coach:"talk"}},{t:"點樣防止撞牆？",p:["一、開頭唔好衝，用勻速跑。二、平時有練耐力，慢慢加長跑嘅時間。三、比賽前一晚同當日早餐食夠飯、麵、麵包，即係身體嘅燃料。","四、瞓得夠、飲水夠。五、如果真係好攰：步細啲、手擺細啲、深呼吸、膊頭放鬆。","六、將條路切細：唔好諗仲有幾遠，淨係諗「跑到下一支燈柱」。到咗，再揀下一支。"],demo:{run:"jog",cam:"sideFar",coach:"talk"}},{t:"有人超越你，點諗？",p:["佢跑佢嘅，我跑我嘅。先問自己：我嘅呼吸同感覺仲係唔係同計劃一樣？","如果你仲好舒服，可以試吓跟住佢，好似有塊磁石吸住你咁。","如果你已經好盡，就唔好追。佢可能係衝得太早，等陣你會再見返佢。"],demo:{scene:"race",mode:"passing",cam:"race",coach:"talk"}},{t:"超越人嘅秘訣",p:["一、「釣魚法」：揀前面一個人做目標，好似釣魚咁慢慢收線，一個一個咁追。","二、要超就超得果斷：加速經過佢，再跑多一段先返回正常速度，咁佢就難跟住你。","三、喺直路超越，唔好喺彎位外面超，因為要跑多啲路。","四、最好嘅超越方法，其實係「前慢後快」：前半段慳力，後半段你自然會一個一個咁追過人。"],demo:{scene:"race",mode:"overtake",cam:"race",coach:"point"}},{t:"最後衝刺點分配？",p:["將比賽分三份：頭三分之一：穩陣，放鬆跑；中間三分之一：保持速度，專心；最後三分之一：慢慢加速。","最後 [[100|150 至 200]] 米：用盡剩低嘅力衝刺！手擺大啲、膝頭抬高啲。","比賽前揀定一個「衝刺記號」，例如最後一支燈柱或者最後一個彎。去到就衝，唔使諗。"],visual:"energy",demo:{run:"tempo",cam:"sideFar",coach:"talk"},beats:{1:{run:"sprint"}}},{t:"比賽中要唔要飲水？",p:["老實講：跑步時揸住支水好唔方便，亦唔可以期望一定有人遞水畀你。","[[小朋友嘅比賽通常幾分鐘到十幾分鐘，只要比賽前飲夠水，中途根本唔使飲。|短嘅比賽（三公里以內）中途唔使飲。十公里嘅比賽，天氣唔熱、出發前飲夠水嘅話，大部分人都唔使喺中途飲。]]","如果有水站而天氣好熱，可以飲兩三啖，或者淋少少水喺頭同頸降溫，唔好一路狂飲。專業馬拉松選手跑四十二公里，就會喺水站攞自己預備嘅水樽同運動飲品，邊跑邊飲，仲會用水淋身降溫。","平時喺海旁跑耐啲，可以將水樽擺喺長櫈，繞圈跑經過就飲幾啖，唔使揸住。"],demo:{run:"drink",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"小測驗：長跑",quiz:[{q:"紅衫一開始衝到盡，後面點？",o:["越跑越快","好快就攰、慢落嚟","一樣"],a:1,ex:"一開始用晒體力，後面就爆咗。"},{q:"你跟住前面嘅人，但係開始喘到講唔到嘢，應該點？",o:["死都要跟","放手，跑返自己嘅速度"],a:1,ex:"佢太快喇，跑返自己速度，後面可能追返。"},{q:"十公里以內、天氣唔熱，中途一定要飲水？",o:["一定要","通常唔使，出發前飲夠就得"],a:1,ex:"比賽前飲夠，中途通常唔使；好熱就飲兩三啖或者淋水降溫。"},{q:"超越人應該點？",o:["喺彎位外面慢慢超","喺直路果斷加速超過"],a:1,ex:"果斷超越，對手就難跟住。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"elite",icon:"🥇",title:"奧運選手點樣練？",sub:"頂尖運動員嘅秘密",color:"#8d6e63",steps:[{t:"佢哋都係由細練到大",p:["奧運選手唔係一日變出嚟嘅，佢哋練咗好多好多年。","好多頂尖運動員細個嗰陣，玩過好多種運動：踢波、游水、跳繩、捉迷藏。咁樣令佢哋身體好靈活、好協調，大個先專心跑步。","佢哋最大嘅秘密係「堅持」：每星期都練，一年又一年。"],demo:{run:"skipping",cam:"threeq",coach:"talk",props:[]}},{t:"一年有四個季節",p:["選手嘅一年好似植物：一、打底期，好似種子生根，練基礎、練耐力；二、強化期，好似生枝葉，練速度同力量；三、比賽期，好似開花，用最好狀態比賽；四、休息期，好似冬天，休息同玩其他運動。","你都可以咁樣：學期中慢慢練，有比賽前練得精啲，比賽完放鬆一兩個星期。"],demo:{run:"stand",cam:"home",coach:"talk"}},{t:"大部分時間跑得好輕鬆！",p:["你可能估唔到：世界級長跑選手，大約八成嘅練習都係用輕鬆速度跑，即係可以傾偈嘅速度。","只有大約兩成嘅時間先係跑得好辛苦。呢個叫「八二法則」。","點解？因為身體係喺休息嗰陣先至變強。日日都跑到好攰，身體冇時間修補，反而會退步或者受傷。"],tip:"慢，係為咗之後可以更快。",demo:{run:"easy",cam:"sideFar",coach:"talk",label:"😊 輕鬆跑（八成時間）"},beats:{1:{run:"sprint",label:"🔥 辛苦跑（兩成時間）"},2:{run:"easy",label:"😊 輕鬆跑"}}},{t:"短跑選手點樣練？",p:["一、技術操：A 步、B 步、高抬腿、踢屁股，日日都做，令動作變成習慣。睇吓小飛頭頂嘅名牌，就知道佢做緊邊個。","二、起跑同加速：練好多次起跑，每次只跑一小段。","三、極速跑：跑得好快，但係每次都休息得好足。","四、力量同彈跳：做深蹲、弓步、跳躍練習。成年選手會舉重，小朋友就用自己身體重量練，已經好足夠。"],demo:{scene:"drills",list:[["aMarch","A 步：膝頭抬高，踩落身體下面"],["bStep","B 步：抬膝 → 伸前 → 向後扒地"],["highKnees","高抬腿：快快咁抬膝"],["buttKicks","踢屁股：腳跟踢屁股"]],cam:"side",coach:"talk"},beats:{1:{scene:"none",run:"crouchStart",label:"起跑練習"},2:{run:"sprint",label:"極速跑（休息要足）"},3:{scene:"drills",list:[["squat","深蹲：屁股向後坐"],["lunge","弓步：後膝差唔多掂地"],["squatJump","跳躍：蹲低再跳高"],["pogo","腳踝彈跳"]]}}},{t:"長跑選手點樣練？",p:["一、輕鬆跑：大部分時間都係慢慢跑，打好耐力底。","二、節奏跑：用「有啲辛苦但控制到」嘅速度跑一段。","三、間歇跑：快跑一段，慢跑休息，再快跑，重複幾次。","四、長課：每星期一次跑長啲，但係速度好輕鬆。小朋友可以用遊戲代替，例如「燈柱遊戲」：一支燈柱快，兩支燈柱慢。"],demo:{run:"easy",cam:"sideFar",coach:"talk",label:"輕鬆跑"},beats:{1:{run:"tempo",label:"節奏跑"},2:{run:"sprint",label:"間歇跑：快一段"},3:{run:"easy",label:"長課：慢慢跑耐啲"}}},{t:"休息同瞓覺都係訓練",p:["奧運選手好重視瞓覺，好多人每晚瞓八至十個鐘，有啲仲會晏晝瞓一陣。","你嘅身體係喺瞓覺嗰陣修補肌肉、長高長大。","[[六至十二歲嘅小朋友，每晚要瞓九至十二個鐘|你呢個年紀，每晚要瞓九至十二個鐘]]，比大人仲要多！"],demo:{scene:"sleep",coach:"talk"}},{t:"佢哋都會練個腦：訂目標、寫日記",p:["睇吓白板：選手會同教練一齊寫低目標。好嘅目標要清楚、量度到、有限期，例如：「六星期內，五十米快零點三秒」。","大目標之下，再拆細：今個星期練咩、今日做咩。做完就打一個剔，好有成功感！","每次練完，寫低「訓練日記」：今日練咗咩、感覺點、下次改進咩。咁樣就睇到自己點樣一步一步進步。","佢哋亦會睇自己跑步嘅片，搵出可以改進嘅地方。你都可以叫爸爸媽媽幫你拍片，慢鏡睇吓自己嘅姿勢！"],demo:{scene:"goals",coach:"write",show:1},beats:{0:{board:2},1:{board:4},2:{board:7}}},{t:"我哋可以學到咩？",p:["一、玩多啲唔同嘅運動。二、大部分時間輕鬆跑，少少時間跑快。三、練快之前休息足。四、用自己身體重量練力量。五、瞓得夠、食得好。六、記錄自己嘅進步。七、最重要：開心先會堅持！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}},{t:"小測驗：奧運選手",quiz:[{q:"世界級長跑選手大部分練習用咩速度？",o:["全速","輕鬆、可以傾偈嘅速度"],a:1,ex:"大約八成時間都係輕鬆跑，叫八二法則。"},{q:"邊個係「好目標」？",o:["我要好快","六星期內五十米快零點三秒"],a:1,ex:"好目標要清楚、量度到、有限期。"},{q:"身體幾時變強？",o:["練習之後休息、瞓覺嘅時候","練到最攰嗰一刻"],a:0,ex:"休息同瞓覺都係訓練嘅一部分。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"food",icon:"🍎",title:"食得好、瞓得好",sub:"運動員嘅生活規律",color:"#43a047",steps:[{t:"你個身體係一部跑車",p:["飯、麵、麵包、麥皮、番薯：係「燃料」，令你有力跑。","雞蛋、魚、雞肉、豆腐、奶：係「磚頭」，幫你修補同建立肌肉。","菜同生果：係「保護罩」，有好多維他命，令你少啲病。","奶、芝士、豆腐、深綠色菜：有鈣，令骨頭強壯。"],demo:{run:"stand",cam:"food",coach:"talk",props:["food"]}},{t:"砌一個健康餐盤",p:["一個好嘅餐盤：一半係菜同生果，四分一係飯麵等燃料，四分一係蛋白質，再加一杯水或者奶。","依家輪到你！用手指將食物拖去餐盤度，砌一個運動員餐。汽水、糖果、炸薯條就……你諗吓應唔應該擺入去？"],demo:{run:"stand",cam:"food",coach:"point",props:["food"]},task:{type:"plate",label:"將食物拖去碟度 🍽️"}},{t:"練習之前食咩？",p:["練習前兩至三個鐘：可以食一餐正常飯，例如飯、菜、雞肉。","練習前半個至一個鐘：如果肚餓，食少少好消化嘅小食，例如香蕉、一片麵包、幾塊梳打餅。","練習前唔好食得太飽，亦唔好食煎炸油膩嘢，唔係跑嗰陣肚會痛。"],demo:{run:"stand",cam:"food",coach:"talk",props:["food"]}},{t:"練習之後食咩？",p:["練完之後大約一個鐘之內，食啲有「燃料」又有「磚頭」嘅嘢，幫身體修補。","例如：一杯奶加一條香蕉、乳酪、雞蛋三文治、飯糰。","然後正常食晚飯。唔好因為想「瘦啲」而唔食，成長中嘅身體需要足夠營養。"],demo:{run:"drink",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"飲水嘅學問",p:["練習前一至兩個鐘：飲一杯水，等身體有時間吸收，多出嚟嘅會喺出發前變成尿。","練習中：短嘅練習唔使飲；練超過半個鐘、天氣熱，休息時飲幾啖。練習後：飲水補返。","你知唔知？運動嗰陣，身體會自動減少製造小便，因為水要留嚟出汗散熱。所以跑緊步通常唔會想去廁所，但係臨跑前一刻先大量飲水，就可能跑到一半想去。","睇吓小便嘅顏色：淡淡嘅檸檬黃色就啱；好深色即係要飲多啲水。大部分時間飲清水就夠，能量飲品有咖啡因，小朋友千祈唔好飲。"],visual:"urine",demo:{run:"drink",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"瞓覺：最強嘅秘密武器",p:["[[六至十二歲|你呢個年紀]]每晚要瞓九至十二個鐘。","每日盡量同一個時間瞓同起身。瞓覺前一個鐘唔好睇手機同電視，因為啲光會令個腦以為仲係日頭。","瞓得好，跑得快、記得實、唔易嬲、唔易病。"],demo:{scene:"sleep",coach:"talk"}},{t:"小運動員嘅一日",p:["睇吓下面呢個例子，你可以同爸爸媽媽一齊整一個屬於你嘅時間表。","重點：早餐一定要食、放學有小食、練習之後有晚飯、做完功課要早啲瞓。"],visual:"day",demo:{run:"stand",cam:"home",coach:"talk"}},{t:"小測驗：飲食",quiz:[{q:"邊樣係身體嘅「燃料」？",o:["飯、麵、麵包","汽水","糖果"],a:0,ex:"碳水化合物係跑步最主要嘅燃料。"},{q:"練習前半個鐘肚餓，食咩好？",o:["一大碟炸雞","一條香蕉","唔食，餓住跑"],a:1,ex:"好消化、細份嘅小食最好。"},{q:"點解運動時通常唔會好想去廁所？",o:["身體會減少製造小便，留水嚟出汗","因為冇飲水"],a:0,ex:"所以要提早飲水，唔好臨跑先大量飲。"},{q:"你呢個年紀每晚要瞓幾耐？",o:["六個鐘","九至十二個鐘"],a:1,ex:"身體喺瞓覺時修補同長高。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"plan",icon:"📅",title:"訓練計劃",sub:"幾時練乜、用幾成力",color:"#5c6bc0",steps:[{t:"用幾成力去練？",p:["用一至十分嚟形容辛苦程度：一分好似坐喺梳化，十分係用盡全力。","大部分練習用四至六分：輕鬆、可以講說話。技術練習大約六至七分，專心做靚動作。","短跑衝刺用九至十分，但係每次好短，休息好足。","每次練完，最好覺得「仲有少少力、想再嚟」，而唔係攰到唔想郁。咁先會越練越生猛，越練越想練！"],visual:"effort",tip:"如果十次練習有八次做得到、做得好，嗰個難度就啱啱好。",demo:{run:"easy",cam:"sideFar",coach:"talk",label:"4 至 6 分：輕鬆跑"},beats:{1:{run:"aMarch",label:"6 至 7 分：技術操"},2:{run:"accelToSprint",label:"9 至 10 分：短衝"},3:{run:"cheer",label:"😄 仲想再嚟！"}}},{t:"咁點先會有進步？",p:["身體進步嘅秘密係：練少少、休息、再練多少少。每星期只加一點點，大約唔好多過一成。","好似砌積木，一舊一舊咁砌，唔好一次砌太高，會冧㗎。","練完記低感覺：好開心、OK、好攰。如果連續幾次都好攰，下一次就輕鬆啲。"],demo:{run:"jogInPlace",cam:"threeq",coach:"talk"}},{t:"每星期點樣分配？",p:["下面係一個[[六至八歲|九至十二歲]]嘅每週安排例子。每日練習時間 [[30 至 45|45 至 60]] 分鐘就夠。","原則：練「快」放喺休息完之後、最精神嘅日子；練「力」同練「快」可以同一日，但係快嘅放先；辛苦嘅日子之後，一定係輕鬆日或者休息日。","「練氣」即係耐力，用輕鬆跑同遊戲去練；「練力」即係力量，用深蹲、弓步、平板支撐。"],visual:"week",demo:{run:"stand",cam:"home",coach:"talk"}},{t:"兩星期一個循環",p:["第一個星期：學新技術、慢慢加量。第二個星期：重複練熟，最後一日做「小測試」，睇吓進步咗幾多。","每四個星期，有一個星期練得輕鬆啲，好似充電咁，等身體吸收晒之前嘅訓練。","測試項目：二十米衝刺時間、一分鐘跳繩、平板支撐秒數、唔停輕鬆跑幾多分鐘。記低喺「我的進步」度！"],demo:{run:"stand",cam:"home",coach:"talk",props:["bottle"]}},{t:"由頭到腳點樣練？",p:["腳同腳踝：腳踝彈跳、提踵、跳繩，令你好似彈簧。","大腿同屁股：深蹲、弓步、臀橋，係你嘅引擎。","腰同肚：平板支撐、超人式，令你腰板硬淨。","手同膊頭：擺手練習，令擺手更有力。平衡：單腳企，[[開眼|試吓閉埋眼]]。每次練力量，揀三至四個動作，每個做兩組。"],demo:{run:"calfRaise",cam:"side",coach:"talk",muscle:!0,hl:["calf"],label:"提踵"},beats:{1:{run:"squat",hl:["quad","glute"],label:"深蹲"},2:{run:"plank",hl:["abs"],label:"平板支撐",cam:"side"},3:{run:"balance",hl:[],label:"單腳企"}}},{t:"力量動作示範：平板支撐",p:["手肘喺膊頭正下面，用前臂同腳尖撐住，身體由頭到腳成一條直線，屁股唔好翹高，亦唔好跌落去。","個肚收緊，正常呼吸。[[撐 15 至 20 秒|撐 20 至 40 秒]]，做兩次。"],demo:{run:"plank",cam:"side",coach:"talk",muscle:!0,hl:["abs","oblique"]},task:{type:"timer",secs:20,label:"平板支撐 20 秒 💪"}},{t:"力量動作示範：臀橋",p:["瞓喺地下，雙膝屈起，腳板踩地。用屁股出力，將屁股推高，直到膊頭、屁股、膝頭成一條直線。","停一秒，慢慢放低。做 [[8 至 10|10 至 15]] 下，兩組。"],demo:{run:"bridge",cam:"floor",coach:"talk",muscle:!0,hl:["glute","hamstring"]},task:{type:"timer",secs:30,label:"臀橋 30 秒"}},{t:"幾時跑運動場？幾時跑街？",p:["運動場：地面平、有距離標記，最適合練短跑、做測試、練配速。可以兩三個星期去一次，做測試日。","海旁：平坦又開揚，好適合輕鬆跑、技術操、燈柱遊戲。","你可以用捲尺或者手機地圖量一次距離，記住由邊支燈柱去邊支燈柱係幾多米，以後就係你嘅專屬跑道！"],demo:{run:"easy",cam:"wide",coach:"point"}},{t:"海旁訓練要注意",p:["揀人少嘅時間，例如朝早或者傍晚。小心單車、狗仔同行人，唔好戴耳筒。","地面濕或者有青苔就唔好跑快，好易滑倒。唔好貼近海邊欄杆做遊戲。","天氣熱就揀陰涼嘅時間，帶水、戴帽。一定要有大人陪同！"],demo:{run:"jog",cam:"wide",coach:"talk"}},{t:"太攰嘅警號",p:["如果有以下情況，就要休息或者減少練習：成日都好攰、瞓唔好、唔想練、成績退步、某個位置持續痛。","休息唔係偷懶，休息係訓練嘅一部分。","記住：練得開心、想再練，先係最好嘅訓練。"],demo:{run:"breathe",cam:"upper",coach:"talk"}},{t:"小測驗：訓練計劃",quiz:[{q:"大部分練習應該用幾辛苦？",o:["十分，用盡全力","四至六分，可以講說話"],a:1,ex:"大部分輕鬆，少少時間跑快。"},{q:"練「快」最好放喺幾時？",o:["熱身之後、精神嘅時候","練到好攰之後"],a:0,ex:"攰嘅時候練唔到真正嘅快。"},{q:"練完應該有咩感覺先最好？",o:["仲有少少力、想再嚟","攰到唔想再練"],a:0,ex:"咁先會越練越生猛、越練越想練。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"train",icon:"🧰",title:"訓練百寶袋",sub:"技術操、力量、反應、練氣、間歇跑",color:"#3949ab",steps:[{t:"百寶袋入面有咩？",p:["專業運動員唔係淨係跑，佢哋會用好多唔同嘅練習。呢一站幫你揀咗最啱小朋友嘅幾類：","一、技術操：令跑步動作更靚、更快。二、力量同彈跳：令你嘅「引擎」同「彈簧」更勁。三、反應同靈活：聽到、睇到就即刻郁。四、練氣：耐力。五、間歇跑：快一段、慢一段。","最重要嘅規則：動作做靚先，數量其次。做到動作變形、好攰，就停一停。"],tip:"每次訓練唔使樣樣都做，喺每一類揀一兩個就夠。",demo:{scene:"drills",list:[["legCycle","扶欄杆抓地畫圈"],["mountainClimber","登山者"],["sidePlank","側平板"],["quickFeet","快腳"],["lateralHops","左右跳線"]],cam:"threeq",coach:"talk",each:4}},{t:"技術操①：扶欄杆抓地畫圈",p:["你講嘅呢個練習好專業，叫「腿部畫圈」或者「抓地練習」，短跑選手好常做。一隻手扶住欄杆，企高，支撐腳膝頭微曲。","另一隻腳：膝頭抬起，大腿差唔多打橫，腳尖勾起；小腿向前伸少少，然後隻腳好似爪咁向下、向後「扒」地，前腳掌喺身體正下面擦過地面。","扒完之後，腳跟即刻向上收，差唔多掂到屁股，膝頭再向前帶，跨過支撐腳個膝頭，返去大腿打橫。睇吓個腳掌，佢喺空中畫緊一個圈！","先慢慢做，熟咗先快啲。每邊 [[10|10 至 20]] 秒，換腳。練到嘅肌肉：大腿後面（膕繩肌）、屁股、髖屈肌。"],tip:"扒地要喺身體下面，唔好伸到好前先踩落去；腳跟收起時膝頭要向前，唔好只係向後踢。",demo:{run:"legCycle",cam:"side",coach:"talk",hl:["hamstring","glute","hipflexor"],label:"慢慢畫圈"},beats:{3:{run:"legCycleFast",label:"熟咗：快啲畫圈"}},task:{type:"timer",secs:15,sides:2,label:"抓地畫圈：每邊 15 秒"}},{t:"技術操②：高抬腿同 B 步",p:["高抬腿：膝頭輪流抬到同腰差唔多高，即係大腿打橫，腳尖勾起，前腳掌快快落地。身體企直，唔好向後挨。","B 步：膝頭抬起之後，小腿向前伸出去，再向下向後扒返落身體下面。佢同剛才嘅「畫圈」好似，不過係兩隻腳輪流向前行住做。","每樣做 [[15|20 至 30]] 米，或者原地 [[15|20]] 秒，行返轉頭休息。"],demo:{run:"highKnees",cam:"side",coach:"talk",hl:["hipflexor"],label:"高抬腿：大腿打橫"},beats:{1:{run:"bStep",label:"B 步：抬 → 伸 → 扒"}},task:{type:"timer",secs:15,label:"高抬腿 15 秒"}},{t:"技術操③：直腿踢（玩具兵）",p:["企直，一隻腳伸直向前踢起，腳尖勾起；對面隻手向前伸，去摸腳尖。左右輪流，可以原地或者慢慢向前行。","要唔要踢到對眼咁高？唔使！直腿踢係用嚟熱身大腿後面嘅肌肉，唔係比高。只要膝頭伸直、背脊挺直，踢到腰至心口嘅高度已經好好。","踢到對眼咁高係舞蹈員練柔軟度嘅目標。如果硬係用力甩上去，大腿後面好容易拉傷。正確做法：頭幾下踢低啲，慢慢一下比一下高，踢到「有拉緊感覺但唔痛」就啱。每邊 [[6 至 8|8 至 10]] 下。"],tip:"寧願踢低啲但係膝頭伸直、背脊直，都唔好彎腰屈膝去扮高。",demo:{run:"straightKick",cam:"side",coach:"talk",hl:["hamstring"],label:"直腿踢：腰至心口高就夠"},ask:{q:"直腿踢要踢幾高？",o:["一定要踢到對眼咁高","膝頭伸直、背脊直，踢到腰至心口，慢慢加高","愈用力甩愈好"],a:1,ex:"目的係熱身，唔係比高。硬甩上去容易拉傷大腿後面。"}},{t:"技術操④：後蹬跑",p:["後蹬跑係好多田徑隊都做嘅練習，有時叫「跨步跳跑」。重點係後面隻腳：髖、膝頭、腳踝三個位一齊用力伸直，好似彈弓咁向後推地。","前面隻腳：大腿抬高到差唔多打橫，膝頭向前「帶」個身體飛出去。每一步都有一段騰空時間，步幅大過平時跑步。","落地用前腳掌，落喺身體下面附近，唔好伸到好前用腳跟踩。手要大力前後擺，幫身體飛前。","做 [[15 至 20|20 至 30]] 米，[[兩|三]]次，行返轉頭休息。最好喺草地或者運動場做；海旁石屎地好硬，做少啲。"],tip:"後蹬跑係「彈」出去，唔係「跳」上天。眼望前面，身體微微前傾。",demo:{run:"bound",cam:"sideFar",coach:"point",hl:["glute","calf","quad"],push:!0,label:"後蹬跑：後腳推直、前腿打橫"},task:{type:"reps",reps:2,label:"後蹬跑：做 2 次（每次 15–30 米）"}},{t:"力量①：核心（腰同肚）",p:["跑步嗰陣，腰同肚要好似一條硬淨嘅柱，手腳先可以好好發力。呢度有三個核心練習：","側平板：側身瞓，用手肘同腳撐起，由頭到腳成一條直線，屁股唔好跌。登山者：手撐地，膝頭輪流快快拉向心口，好似爬山咁。平板支撐你之前已經學過。","每個做 [[15 至 20|20 至 30]] 秒，休息一分鐘，再做下一個。"],demo:{run:"sidePlank",cam:"front",coach:"talk",muscle:!0,hl:["oblique","abs"],label:"側平板"},beats:{1:{run:"mountainClimber",cam:"side",hl:["abs","hipflexor"],label:"登山者"}},task:{type:"timer",secs:15,sides:2,label:"側平板：每邊 15 秒"}},{t:"力量②：單腳練習（屁股同大腿後面）",p:["跑步其實係一連串「單腳跳」，所以單腳嘅力量同平衡好重要。","單腳臀橋：瞓地，一隻腳踩地，另一隻腳伸直，用屁股推高。每邊 [[6|8 至 10]] 下。","單腳硬拉：單腳企，身體慢慢向前摺，後面隻腳向後伸直，好似一個「T」字，再慢慢返企直。手可以扶牆。每邊 [[5|6 至 8]] 下。","國際青少年力量訓練共識指出：小朋友做啱技術、有大人指導嘅力量訓練係安全嘅，唔會影響長高。每星期兩至三次，唔好連續兩日。"],demo:{run:"singleLegBridge",cam:"floor",coach:"talk",muscle:!0,hl:["glute","hamstring"],label:"單腳臀橋"},beats:{2:{run:"singleLegRDL",cam:"side",hl:["hamstring","glute"],label:"單腳硬拉：T 字"}},task:{type:"timer",secs:20,sides:2,label:"單腳臀橋：每邊 20 秒"}},{t:"彈跳：令你好似彈簧",p:["彈跳練習又叫「增強式訓練」，練嘅係肌肉同筋腱好似彈簧咁「壓落去即刻彈返起身」。","腳踝彈跳：雙腳細細跳，膝頭差唔多直。左右跳線：雙腳併埋，左右跳過地上一條線。蹲跳：蹲低再盡力跳高。","規則：落地要輕、要靜，膝頭對住腳尖，唔好向內塌。每樣 [[5 至 8|8 至 10]] 下或者 10 秒，質素比數量重要。每組之間休息一至兩分鐘。"],tip:"如果落地好大聲、膝頭向內，就係太攰或者太難，減少次數。",demo:{scene:"drills",list:[["pogo","腳踝彈跳"],["lateralHops","左右跳線"],["squatJump","蹲跳：落地要輕"]],cam:"threeq",coach:"talk",each:5},task:{type:"timer",secs:10,label:"左右跳線 10 秒"}},{t:"反應：聽到、睇到就即刻郁",p:["反應快唔快，係可以練嘅！教練會用唔同嘅「信號」：拍手、吹雞、叫顏色、舉手指方向。","仲會用唔同嘅起跑姿勢：企、跪、坐、趴喺地下，甚至背向前面，一聽到信號就轉身衝。咁樣練你嘅身體快速起身同加速。","而家玩「口令遊戲」：企好準備姿勢，原地快腳踏。聽到「左」就向左踏，「右」就向右踏，「跳」就跳，「蹲」就蹲低，「快腳」就繼續快腳踏！"],tip:"準備姿勢：雙腳打開同膊頭差唔多闊，膝頭微曲，用前腳掌企，身體微微向前。",demo:{run:"readyStance",cam:"front",coach:"talk",label:"準備姿勢"},beats:{1:{run:"fallingStart",cam:"side",label:"唔同起跑姿勢"},2:{run:"quickFeet",cam:"front",label:"快腳"}},task:{type:"callout",secs:[25,35],label:"口令遊戲 👂"}},{t:"靈活：快腳、側併步、折返跑",p:["靈活度即係可以好快咁停、轉方向、再起步。","快腳：半蹲，用前腳掌好快咁原地踏，好似踩喺熱鑊上面。側併步：身體面向前，向左右橫行，兩隻腳唔好交叉，唔好企直。","折返跑：喺兩個雪糕筒（或者兩支燈柱）之間來回跑，到咗就低身、用外面隻腳踩停，再轉身衝返去。","仲可以喺海旁地下用粉筆畫一條「梯」，玩快腳梯：每格踩一下或者兩下。"],demo:{run:"quickFeet",cam:"front",coach:"talk",label:"快腳"},beats:{1:{run:"lateralShuffle",label:"側併步：唔交叉腳"}},task:{type:"timer",secs:15,label:"快腳 15 秒"}},{t:"練氣：耐力點樣練？",p:["練氣即係練耐力，令心肺同肌肉可以長時間工作。六至十二歲最好嘅練氣方法，其實係玩：捉人、踢波、游水、踩單車、跳繩，玩得耐就係練氣。","跑步方面：輕鬆跑，用「講說話測試」，跑緊都講到完整句子，就啱速度。[[由 8 至 10 分鐘開始|由 12 至 15 分鐘開始，慢慢加到 20 至 30 分鐘]]。","仲有「法特萊克」，意思係「速度遊戲」：喺海旁，揀一支燈柱跑快啲，再慢跑兩支燈柱，隨心變化，好似玩遊戲咁。"],demo:{run:"easy",cam:"sideFar",coach:"talk",label:"輕鬆跑：講到說話"},beats:{2:{run:"jog",iv:{fast:5.4,slow:2.8,auto:[5,7],fastLab:"🏮 一支燈柱快啲",slowLab:"🙂 兩支燈柱慢跑"}}}},{t:"試吓：燈柱法特萊克",p:["跟住計時器做：「快啲」嘅時候用大約六七成力，唔係衝到盡；「慢跑」嘅時候慢到可以講說話。","冇燈柱都唔緊要，原地跑或者喺公園都得。"],demo:{run:"jog",cam:"sideFar",coach:"point",iv:{fast:5.4,slow:2.8,auto:[5,7],fastLab:"🏮 快啲（六七成）",slowLab:"🙂 慢跑"}},task:{type:"interval",work:[15,20],rest:[30,30],reps:[4,6],workLab:"🏮 快啲！",restLab:"🙂 慢跑",workName:"快啲",restName:"慢跑",workSay:"快啲，六七成力！",restSay:"慢跑，可以講說話。",label:"燈柱法特萊克 🏮"}},{t:"間歇跑同「乳酸」係咩？",p:["你講嘅「快跑一段、慢跑一段、再快跑」，就係間歇跑，係專業訓練好重要嘅一部分。","跑得好快好耐，腳會覺得好重、好似燒住咁。好多人話係「乳酸」。其實乳酸唔係垃圾，身體會將佢當燃料用返；燒嘅感覺主要係肌肉入面酸性物質多咗。第二日腳痠，主要係肌肉細微受傷再修補，都唔係乳酸。","研究發現：十歲左右嘅小朋友做短衝刺間歇，血入面嘅乳酸比大人少，清除得快、恢復得快，覺得冇咁辛苦。所以小朋友適合做「短、快、休息足」嘅間歇。","大人或者大哥哥姐姐會做「練乳酸」：例如三四百米好快、休息好短，咁樣好辛苦。你呢個年紀唔需要專登咁練，等大個啲教練會慢慢加。"],tip:"小朋友嘅間歇跑：快嘅一段短，休息嘅一段長，練完仲笑得出。",demo:{run:"jog",cam:"sideFar",coach:"talk",iv:{fast:7,slow:2.4,auto:[3,8],fastLab:"🔥 快一段",slowLab:"😮‍💨 慢慢恢復"}},ask:{q:"你呢個年紀最啱做邊種間歇跑？",o:["四百米衝到盡、休息三十秒，做十次","短短快跑、休息足夠，練完仲有力","唔使休息，一路衝"],a:1,ex:"小朋友恢復得快，但係都要短、快、休息足，先練到速度又唔會練到怕。"}},{t:"間歇跑①：五秒火箭",p:["[[最啱六至九歲|全部年紀都啱]]：用九成力快跑五秒，然後慢慢行四十秒，等呼吸返正常。做五次係一組。","研究入面，十歲小朋友就係做類似嘅練習：五秒衝刺、休息四十秒，五次一組，做兩組，組之間休息兩分鐘。"],tip:"快嗰五秒要真係快、姿勢要靚；行嗰四十秒要真係休息。",demo:{run:"jog",cam:"sideFar",coach:"point",iv:{fast:7.4,slow:1.8,auto:[2.5,6],fastLab:"🚀 五秒火箭",slowLab:"🚶 慢慢行"}},task:{type:"interval",work:5,rest:40,reps:5,sets:[1,2],setRest:120,workLab:"🚀 衝！",restLab:"🚶 慢慢行",workName:"快跑",restName:"慢行",workSay:"衝！",restSay:"慢慢行，深呼吸。",label:"五秒火箭 🚀"}},{t:"間歇跑②：一百米快、慢跑返轉頭",p:["[[大個啲先做（大約十歲以上）|最啱十至十二歲]]：用七八成力跑一百米（唔係衝到盡），跑完慢慢跑或者行返起點，大約一至一分半鐘，呼吸差唔多正常先再嚟。","做 [[三至四|四至六]] 次。每星期最多一次，而且第二日要係輕鬆日或者休息日。","喺海旁可以用燈柱量好一百米。冇咁長嘅位，就用二三十秒代替一百米。"],tip:"每一次嘅時間應該差唔多。如果最後幾次慢咗好多、姿勢變形，就停，今日夠喇。",demo:{run:"jog",cam:"sideFar",coach:"point",iv:{fast:6.4,slow:2.2,auto:[4,9],fastLab:"💨 一百米：七八成力",slowLab:"🔁 慢跑返起點"}},task:{type:"interval",work:[20,20],rest:[75,70],reps:[3,5],workLab:"💨 七八成力！",restLab:"🔁 慢跑返起點",workName:"快跑（約一百米）",restName:"慢跑返轉頭",workSay:"七八成力，放鬆跑！",restSay:"慢跑返起點，深呼吸。",label:"一百米間歇 💨"}},{t:"點樣放入每星期？",p:["每次訓練開始：熱身加兩三個技術操，例如抓地畫圈、高抬腿、直腿踢。","每星期：[[一|一至兩]]次練快（短衝、起跑、反應遊戲）；兩次練力同彈跳（唔好連續兩日）；兩至三次練氣（遊戲、輕鬆跑、法特萊克）；間歇跑最多一次。","辛苦嘅日子之後，一定係輕鬆日或者休息日。「今日訓練」嗰度已經幫你加咗呢啲新練習。"],visual:"week",demo:{run:"stand",cam:"home",coach:"talk"}},{t:"小測驗：訓練百寶袋",quiz:[{q:"扶欄杆抓地畫圈，隻腳應該喺邊度扒地？",o:["伸到好前先踩落去","身體正下面，向後扒"],a:1,ex:"喺身體下面扒地，同跑步著地點一樣。"},{q:"後蹬跑最重要係？",o:["後腳用力伸直推地，前腳大腿抬高","盡量跳得高"],a:0,ex:"係向前「彈」，唔係向上跳。"},{q:"彈跳練習落地應該點？",o:["好大聲、膝頭向內","輕輕、靜靜，膝頭對住腳尖"],a:1,ex:"落地輕同膝頭對準腳尖，可以保護膝頭。"},{q:"間歇跑之後應該點？",o:["即刻坐低唔郁","慢慢行一陣、飲水，等呼吸返正常"],a:1,ex:"慢慢行可以幫身體恢復。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"race",icon:"🏁",title:"比賽前準備",sub:"食、飲、廁所、熱身、心情",color:"#e53935",steps:[{t:"比賽前一星期",p:["比賽前一星期，練習要減少，但係唔好完全唔練。可以做幾次短短嘅快跑，保持雙腳醒醒定定。","每晚早啲瞓。練習起跑同衝線。同大人一齊睇清楚比賽時間、地點同規則。"],demo:{run:"standingStartSeq",cam:"sideFar",coach:"talk"}},{t:"前一晚：執好運動袋",p:["前一晚執好運動袋，第二朝就唔會手忙腳亂。剔晒以下嘅嘢先好瞓覺！","晚餐食你熟悉嘅嘢，有飯或者麵。記住：比賽前唔好試新嘢，新鞋、新食物都留返比賽後先試。"],demo:{run:"stand",cam:"threeq",coach:"talk",props:["bottle","chest"]},task:{type:"check",label:"執運動袋",items:["跑鞋（已經著慣嗰對）","襪","運動衫褲","號碼布同扣針","水樽","小食（香蕉、麵包）","毛巾","外套","帽同防曬","膠布"]}},{t:"比賽日：幾時食、幾時飲、幾時去廁所？",p:["睇吓下面嘅時間表。最大嗰餐要喺比賽前三至四個鐘食；之後只食細份、好消化嘅小食。","飲水要「提早飲、分開飲」：比賽前兩至三個鐘飲一至兩杯水，等身體有時間吸收，多出嚟嘅水會喺出發前變成尿排走。","出發前半個鐘至四十五分鐘，就唔好再大量飲水，口乾飲一兩啖就得。最後十五分鐘唔好再食嘢。","去廁所：熱身前去一次，出發前十至十五分鐘再去一次，將膀胱同個肚清空晒。廁所要排隊，所以預早去！"],visual:"raceday",demo:{run:"drink",cam:"threeq",coach:"talk",props:["bottle"]},ask:{q:"出發前十分鐘先一啖氣飲晒一大樽水，會點？",o:["跑得更快","可能跑到一半想去廁所、肚脹","冇分別"],a:1,ex:"要提早飲、分開飲，臨跑前只飲一兩啖。"}},{t:"跑十公里或以上點算？",p:["[[呢段係畀大哥哥大姐姐同爸爸媽媽參考。|如果你或者爸爸媽媽跑十公里以上，可以咁做：]]","比賽前一兩日，每餐食多少少飯、麵、麵包，幫身體儲定燃料。比賽當日照樣三至四個鐘前食早餐。","出發前飲夠水，十公里以內天氣唔熱，大部分人中途都唔使飲。跑一個鐘以上，可以喺水站飲幾啖，或者食少少能量補給；天熱就淋水降溫。","最重要：唔好一路狂飲。飲太多水都會有危險。口渴就飲幾啖，唔口渴就唔使逼自己飲。"],demo:{run:"tempo",cam:"sideFar",coach:"talk"}},{t:"比賽前熱身",p:["比賽前大約半個鐘開始熱身，做十五至二十分鐘：慢跑、郁動熱身、技術操、兩三次加速跑。","熱身完大約十分鐘就要比賽，唔好熱完身等太耐，身體又會凍返。","最後做你嘅賽前招牌程序，講自己嘅提示字。"],demo:{run:"highKnees",cam:"side",coach:"talk",label:"技術操"},beats:{2:{scene:"routine"}}},{t:"好緊張點算？",p:["比賽前個肚好似有蝴蝶飛嚟飛去，手心出汗，心跳好快——好正常！代表你個身體準備緊衝刺。","試吓同自己講：「我唔係驚，我係興奮！」","然後做「聞花、吹蠟燭」，抖鬆手腳，做你嘅招牌動作。你練過㗎，相信自己！"],demo:{scene:"routine",cam:"threeq",coach:"breathe"},task:{type:"breath",cycles:3,label:"比賽前呼吸 🌸"}},{t:"比賽之後",p:["衝過終點後唔好即刻坐低或者瞓喺地下，慢慢行或者慢跑幾分鐘，然後拉筋。","飲水、食少少嘢。同對手握手講聲「多謝」。","最後諗三樣做得好嘅嘢，同一樣下次可以改進嘅嘢。無論贏定輸，你都已經學到嘢！"],demo:{scene:"breath",mode:"recover",coach:"thumbs"}},{t:"小測驗：比賽準備",quiz:[{q:"比賽日最大嗰餐應該喺幾時食？",o:["出發前十分鐘","比賽前三至四個鐘"],a:1,ex:"要畀時間個肚消化。"},{q:"比賽前幾時要去廁所？",o:["熱身前一次，出發前十至十五分鐘再一次","唔使去"],a:0,ex:"清空膀胱同個肚，跑得舒服啲。"},{q:"比賽日可唔可以著新買嘅跑鞋？",o:["可以，新鞋最快","唔好，著慣嗰對最安全"],a:1,ex:"比賽前唔好試新嘢。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"safe",icon:"🛡️",title:"保護身體",sub:"痠定痛、成長、跑鞋、天氣",color:"#6d4c41",steps:[{t:"痠同痛唔同",p:["痠：肌肉攰攰哋、痠痠哋，通常一兩日就好返，係正常嘅。","痛：好尖、好刺、一郁就痛、行路一拐一拐、腫咗，呢啲係警號！要即刻停，話畀大人知。","唔好「頂硬上」。早啲休息，好得快好多。"],demo:{run:"stand",cam:"threeq",coach:"talk",muscle:!0}},{t:"成長中嘅身體",p:["你嘅骨頭仲喺度長緊，骨頭兩頭有啲叫「生長板」嘅地方，比較脆弱。","[[八至十四歲|你呢個年紀]]嘅小朋友，有時腳跟會痛，或者膝頭下面會痛，通常同長高同運動量有關。如果持續痛，要睇醫生或者物理治療師。","所以：唔好舉太重嘅嘢，唔好突然練好多，玩多種運動，唔好日日都做同一樣嘢。"],demo:{run:"stand",cam:"feet",coach:"talk",muscle:!0,hl:["achilles","quad"]}},{t:"一對好跑鞋",p:["跑鞋要啱腳：著好之後，腳趾前面要留大約一隻手指公咁闊嘅位。","鞋要輕、鞋底要有彈性、要綁好鞋帶。你長得快，要成日檢查對鞋係咪細咗或者爛咗。","著運動襪，唔好著棉質厚襪，可以減少起水泡。"],demo:{run:"stand",cam:"feet",coach:"talk"}},{t:"天氣同安全",p:["好熱：揀朝早或者傍晚，戴帽、搽防曬、多飲水。如果頭暈、頭痛、想嘔、冇汗，即刻去陰涼地方休息、飲水、話畀大人知。","好凍：著多件外套，熱身做耐啲。落雨：地滑，跑慢啲。行雷就唔好喺戶外跑。","空氣唔好嘅日子，改喺室內做伸展同力量練習。"],demo:{run:"drink",cam:"threeq",coach:"talk",props:["bottle"]}},{t:"玩多種運動",p:["淨係跑步，身體只會用同一種方法郁。玩多種運動，例如游水、踩單車、打波、跳舞、爬山，令全身更協調、更唔易受傷。","細個玩多種運動嘅小朋友，大個反而更容易成為好運動員。","每星期至少有一兩日玩其他運動，或者自由咁玩。"],demo:{run:"skipping",cam:"threeq",coach:"talk"}},{t:"開心最重要",p:["你知唔知，小朋友放棄運動最大嘅原因係咩？係「唔開心」。","所以每次練習都要有遊戲、有笑聲。可以同朋友、爸爸媽媽一齊跑，可以玩捉人、接力、燈柱遊戲。","輸咗唔緊要，學到嘢就係贏。最緊要係你鍾意跑步，跑一世！"],demo:{run:"cheer",cam:"home",coach:"thumbs"}},{t:"小測驗：保護身體",quiz:[{q:"跑步時突然好尖嘅痛，行路一拐一拐，應該點？",o:["頂硬上","即刻停，話畀大人知"],a:1,ex:"痛係身體嘅警號。"},{q:"跑鞋前面應該留幾多位？",o:["唔使留","大約一隻手指公咁闊"],a:1,ex:"咁先唔會頂腳。"}],demo:{run:"stand",cam:"home",coach:"think"}}]},{id:"injury",icon:"🩹",title:"抽筋同受傷",sub:"預防、處理、復健",color:"#ef5350",steps:[{t:"咩係抽筋？",p:["抽筋即係一舊肌肉突然自己縮實，硬繃繃，好痛，你控制唔到佢放鬆。通常維持幾秒到幾分鐘。","睇吓小飛：跑跑吓，佢條小腿突然紅晒，抽筋喇！","最常見嘅係小腿抽筋，其次係大腿後面、腳板底同腳趾。至於跑步時肚側邊痛（岔氣），其實唔係真正嘅抽筋。"],demo:{scene:"cramp",coach:"talk"}},{t:"點解會抽筋？",p:["最主要嘅原因係肌肉太攰：練得太耐、太大力、或者突然練多咗。","天氣熱、出好多汗、冇飲夠水、熱身唔夠，都可能令抽筋更容易出現。","好多小朋友半夜瞓覺時小腿都會抽筋，通常同日頭郁得多有關，一般唔使太擔心。"],demo:{run:"tense",cam:"sideFar",coach:"talk"}},{t:"抽筋點算？",p:["一、即刻停低，唔好繼續跑。","二、慢慢拉長嗰舊肌肉：小腿抽筋就坐低，伸直隻腳，用手或者毛巾將腳尖輕輕拉向自己。","三、輕輕按摩，慢慢行，飲啲水。唔好大力扯，亦唔好即刻再衝。","四、如果經常抽筋、好耐都唔鬆、或者腫痛，就要話畀大人知，睇醫生。"],demo:{run:"seatedCalf",cam:"threeq",coach:"talk",muscle:!0,hl:["calf"],dist:.85},ask:{q:"小腿抽筋，第一時間應該點？",o:["繼續跑，頂硬上","停低，慢慢將腳尖拉向自己","大力踢腳"],a:1,ex:"停低，慢慢拉長嗰舊肌肉。"}},{t:"點樣預防抽筋？",p:["熱身做足，練習量每星期慢慢加，唔好突然練好多。","練完要拉筋，瞓夠覺，飲夠水。天氣熱就跑慢啲、休息多啲。","練習前唔好餓住肚，亦唔好食得太飽。"],demo:{run:"calfStretch",cam:"side",coach:"talk",muscle:!0,hl:["calf"]}},{t:"常見嘅跑步受傷",p:["扭傷腳踝：踩到石仔或者唔平嘅地，隻腳向內屈。","跌傷擦傷：跌親，膝頭或者手掌損皮。","起水泡：鞋太緊、太鬆或者襪濕，磨到起泡。","肌肉拉傷：衝刺時大腿後面突然「啪」一下好痛。還有生長期嘅腳跟痛同膝頭下面痛、同埋天熱嘅中暑。"],demo:{scene:"sprain",stage:"roll",cam:"threeq",coach:"talk"}},{t:"扭傷腳踝點處理？",p:["一、即刻停，唔好頂住痛繼續跑。坐低休息，保護隻腳唔好再受力。","二、將隻腳擱高，最好高過心口，咁樣可以減少腫。","三、用毛巾包住冰袋冷敷十至十五分鐘，幫手止痛，唔好將冰直接貼住皮膚。用彈性繃帶輕輕包住，唔好包得太實。","四、話畀大人知。如果好腫、好痛、唔行得，或者聽到「啪」一聲，就要睇醫生，可能要照 X 光。"],demo:{scene:"sprain",stage:"care",cam:"threeq",coach:"talk",dist:.9}},{t:"跌傷、水泡、拉傷",p:["擦傷：用清水沖乾淨啲沙，再貼膠布或者紗布。如果撞親個頭，一定要即刻話畀大人知。","水泡：唔好自己篤爆佢，用膠布保護。預防方法係著啱腳嘅鞋同運動襪。","肌肉拉傷：即刻停，唔好拉筋、唔好按摩嗰度，休息同冷敷，然後搵醫生或者物理治療師睇。"],demo:{run:"handsOnKnees",cam:"threeq",coach:"talk",muscle:!0,hl:["hamstring"]}},{t:"受傷之後點樣復健？",p:["復健好似打機升級，要一關一關咁過，唔可以跳關！","第一關：休息同保護，等痛同腫慢慢減。第二關：喺唔痛嘅範圍輕輕郁，例如郁腳踝畫圈。","第三關：練力同平衡，例如單腳企、提踵。睇吓小飛做緊單腳企練平衡。第四關：由行開始，再慢跑，最後先加速同跳。","用「痛楚紅綠燈」：零至二分係綠燈，可以繼續；三至五分係黃燈，要減少；六分以上係紅燈，要停。一定要聽醫生或者物理治療師嘅意見。"],visual:"pain",demo:{scene:"sprain",stage:"rehab",cam:"threeq",coach:"talk"},beats:{2:{run:"calfRaise",label:"提踵：練返小腿力"}}},{t:"小測驗：抽筋同受傷",quiz:[{q:"抽筋最主要嘅原因係？",o:["肌肉太攰","跑得太慢","著錯衫"],a:0,ex:"肌肉太攰最常見，熱同缺水都有關。"},{q:"扭傷腳踝後，應該點樣放隻腳？",o:["擱高，高過心口","繼續企住"],a:0,ex:"擱高可以減少腫。"},{q:"冷敷應該點做？",o:["冰直接貼皮膚一個鐘","毛巾包住冰袋，十至十五分鐘"],a:1,ex:"唔好凍傷皮膚。"},{q:"痛楚紅綠燈：痛到七分應該點？",o:["繼續練","停低，問醫生或物理治療師"],a:1,ex:"六分以上係紅燈。"}],demo:{run:"stand",cam:"home",coach:"think"}}]}],n0=[{t:"你嘅問題，我嘅修正",p:["你問嘅問題好全面，大部分方向都啱。以下按專業教學指引，逐點修正或者補充。"]},{t:"一、前腳掌落地提重心：短跑啱，長跑要調整",p:["短跑用前腳掌落地，令重心保持高、觸地時間短，完全正確。但重點唔單止係「前腳掌」，而係隻腳要落喺身體附近，唔好向前伸。向前伸長隻腳，就算用前腳掌都會煞車。","長跑唔建議刻意用前腳掌。用腳掌中間平穩咁落地、步頻快少少、唔好跨大步，已經可以保持重心穩定。小朋友長時間踮腳跑，會增加小腿同跟腱負荷，而八至十四歲常見嘅腳跟痛，同呢個負荷有關。"]},{t:"二、加速時「身體前傾、重心逐步升高」",p:["你嘅描述好準確：起跑後身體前傾，似乎就快向前仆，但係每一步腳都及時撐住地，所以會一路加速而唔會仆。頭幾步腳甚至落喺重心後面。","撐地角度（腳掌到髖部嘅連線同地面嘅夾角）起步時大約四十五度，之後一步一步變大；身體逐步企直，重心逐步升高。App 入面用橙色線顯示撐地角度、黃色虛線顯示重心路線。","起跑器係正式比賽用嘅，平時練習用站立式、蹲踞式（腳尖撐地）或者「大樹倒下」起跑已經足夠。","加速段有幾長？你嘅估計「十幾米以上」係啱嘅。研究量度到十至十一歲男童嘅加速段大約十九米，十八至十九歲大約二十四米；精英成人要大約三十至四十米先去到最高速、身體先差唔多企直。所以身體前傾唔係只維持幾步，而係逐步、平順咁企直；頭同身體保持一條線，唔好一出閘就抬頭。App 而家按距離計：加速大約十八米先完全企直，頭部跟住軀幹慢慢抬起。"]},{t:"三、觸地位置、重心垂直線同重心最低點（你嘅問題）",p:["你講得啱嘅部分：加速期身體條軸前傾，腳應該喺重心垂直線後面著地，先推得到向前；全速時條軸接近垂直；跑得快嘅人「彈簧」較硬，重心最低點相對身高較高；短跑用前腳掌，重心比長跑高。腳伸到好前先著地（overstriding）會產生較大煞車力，亦係錯嘅。","要修正兩點。第一，「全速時任何情況下腳都唔會前過重心垂直線」喺物理上做唔到：速度不變時，一步入面向前同向後嘅水平衝量要抵銷，所以必須有一段短短嘅煞車期，即係腳要喺重心正下面或者差少少前著地。研究量度到精英短跑手全速時，觸地點通常喺重心前大約三十幾厘米（成人），佢哋靠著地前隻腳已經向後扒，將煞車減到好細。教學重點係「盡量貼近、腳向後扒」，令煞車又細又短，而唔係完全冇。","第二，重心最低點唔係觸地嗰一刻，而係觸地之後、條腳喺重心正下面嗰一刻（大約觸地期嘅頭三成至一半，視乎觸地點有幾前）。觸地嗰陣身體仲向下跌，條腿好似彈簧壓縮，到最低點再彈返起身。如果腳差唔多喺重心下面著地，觸地同最低點就會好接近，所以你嘅感覺都唔算錯。","App 入面已經按呢個模型重做。為咗教學清楚，全速時觸地點刻意畫得比精英數據更貼近：大約喺重心前兩三厘米（小朋友身高比例）；加速頭幾步喺重心後大約十幾厘米，之後一步一步移到正下面；身體軸由大約四十度慢慢企直；重心最低點同腳喺重心下面嘅時刻對齊；快跑嘅重心最低點比慢跑高。地上嘅顏色線同「👣 觸地」標籤會即時顯示每一步。"]},{t:"三之二、擺手：前後幅度應該差唔多",p:["你嘅記憶係啱嘅。以膊頭為軸，向前同向後擺嘅角度大致相同。短跑時手向前去到大約下巴高度，向後去到手經過臀部、手肘喺身體後面。","向後擺時手肘角度會打開少少，所以「隻手」睇落好似細啲，但膊頭轉動幅度差唔多。舊版動畫向後擺嘅幅度細咗，新版已經改正。"]},{t:"四、呼吸：「儲氧」嘅講法要修正",p:["平時動脈血嘅含氧量已經大約百分之九十七至九十九，比賽前大力深呼吸好多次並唔會「儲」到額外氧氣，反而會呼走太多二氧化碳（過度換氣），引致頭暈、手指麻痺。","一百米主要靠肌肉內儲存嘅磷酸肌酸同無氧糖解供能，有氧系統只佔少部分，好多精英短跑手全程只換幾次氣。對小朋友，最實用嘅教法係「唔好谷氣、自然呼吸、呼氣時放鬆膊頭」。","長跑先係真正靠氧氣：教腹式呼吸、跟步伐嘅節奏呼吸（輕鬆時兩步吸兩步呼，辛苦時兩步吸一步呼）、講說話測試。跑後恢復：慢慢行、呼氣長過吸氣；有研究顯示，彎腰雙手撐膝頭比雙手放頭頂恢復得快啲。"]},{t:"五、飲水同廁所：你對身體機制嘅理解係啱嘅",p:["運動時腎臟血流減少，身體分泌較多抗利尿激素，所以跑步期間尿量會明顯減少，水分優先用嚟出汗散熱。","因此策略係「提早飲、分開飲」：比賽前約四個鐘，按每公斤體重約五至七毫升飲水（三十公斤嘅小朋友即大約一杯）；如果冇小便或者尿色好深，兩個鐘前再補少少。出發前三十至四十五分鐘停止大量飲水，只飲一兩啖；熱身前同出發前十至十五分鐘各去一次廁所。","十公里以內、天氣唔熱，大部分人中途唔需要飲水。精英馬拉松選手確實會喺水站攞自己預備嘅水樽同運動飲品補充水分同糖分，亦會用水或者海綿淋身降溫。另外要提醒：飲水過量都有危險（低鈉血症），口渴就飲，唔好狂飲。"]},{t:"六、想像練習同賽前程序嘅正確名稱",p:["閉眼想像自己比賽、感受成功，運動心理學稱為「意象訓練／心像練習」（imagery、visualisation 或 mental rehearsal）。佢唔係「自我肯定」（self-affirmation，即講正面說話，屬於自我對話嘅一種），亦唔係「自我實現」（self-actualisation，係馬斯洛需求層次理論嘅最高層次）。","保特（Usain Bolt）賽前同觀眾互動、擺招牌姿勢，屬於「賽前例行程序」（pre-performance routine），作用係調節喚醒水平（唔好太緊張或者太散漫）同進入狀態。配合嘅技巧包括：漸進式肌肉放鬆（先繃緊再放鬆，例如聳膊再放低）、抖鬆手腳、腹式呼吸、提示字。"]},{t:"七、腹肌定肚肌？",p:["正式名稱係「腹肌」，最主要係腹直肌，旁邊仲有腹斜肌。「肚肌」係口語講法，講緊同一組肌肉。App 入面肌肉名稱已經改為「正式名稱（日常講法）」嘅格式。"]},{t:"八、幾多成力？",p:["你嘅方向完全正確：要有成功感、覺得自己越嚟越生猛，而唔係越嚟越攰。具體建議：","大約八成嘅練習用輕鬆至中等強度，即係一至十分入面嘅四至六分，可以講說話。","短跑速度練習要用九成以上速度，但係距離短，[[十五至三十米|二十至六十米]]，每次之間休息一至兩分鐘，速度明顯跌就停。","每次練完要「留返少少」，令佢想再練。成功率大約八成：十次有八次做得到，難度就啱啱好。每星期總量增加唔好多過一成左右。"]},{t:"九、練氣、練力、練快點樣排？",p:["速度同技術要喺精神好嘅時候練，即係熱身之後、休息日之後。","力量可以同速度同一日，但係速度放先；或者分開日子。耐力用輕鬆跑同遊戲。辛苦日之後安排輕鬆日或者休息日。","唔建議分開「練手」、「練腳」咁練，小朋友最好用全身性嘅動作：深蹲、弓步、跳、平板支撐、擺手。"]},{t:"九之二、訓練百寶袋：你提議嘅練習同專業做法",p:["「扶欄杆抓地畫圈」：你描述得好準確，呢個係短跑常用嘅「腿部畫圈」（leg cycling）：大腿抬到打橫、向下向後扒地、前腳掌喺身體下面擦地、腳跟收向屁股、膝頭向前帶返上去。教練資料建議每邊 10 至 20 秒。要留意兩點：扒地位置喺身體正下面，唔係伸好前；腳跟收起時膝頭要向前，唔係單純向後踢。","「直腿踢要唔要踢到對眼咁高」：唔需要。佢嘅作用係郁動式熱身大腿後面肌肉，應該膝頭伸直、背脊挺直，踢到腰至心口高度，再一下比一下慢慢加高，有拉緊感覺但唔痛就啱。踢到對眼咁高屬於舞蹈員級嘅柔軟度；用力甩上去超過自己嘅活動幅度，反而容易拉傷膕繩肌。","「後蹬跑」：重點係後腳髖、膝、踝完全伸直推地，前腳大腿抬到接近水平，有騰空期。佢對跟腱同小腿負荷大，小朋友每次 15 至 30 米、兩三次已經足夠，最好喺草地或運動場做。","原地高抬腿（膝頭到腰）已經喺熱身同百寶袋入面。另外加咗：B 步、側平板、登山者、單腳臀橋、單腳硬拉、彈跳（腳踝彈跳、左右跳線、蹲跳）、反應口令遊戲、快腳、側併步、法特萊克、五秒火箭同一百米間歇，全部有 3D 示範同計時器，亦已經加入「今日訓練」。"]},{t:"九之三、練力、練反應、練氣、練乳酸：適合小朋友嘅做法",p:["練力：2014 年國際青少年力量訓練共識指出，小朋友喺合格指導下、以正確技術做力量訓練係安全有效，冇證據顯示會損害生長板或者影響長高。建議每星期兩至三次、唔好連續兩日；先用自己體重練好深蹲、弓步、推、拉等基本動作。彈跳練習要重質素，落地輕、膝頭對準腳尖，每組之間休息足。","練反應同靈活：世界欖球青少年體能教材用唔同起跑姿勢（企、跪、趴）加信號去練加速。App 加咗口令遊戲（左、右、跳、蹲、快腳），訓練聽到即郁。","練氣：研究綜述建議六至十二歲主要透過多種運動同遊戲發展耐力，再加輕鬆跑同法特萊克（速度遊戲），唔使大量長距離訓練。","練乳酸：你講嘅「快跑一百米、慢跑、再快跑」係間歇訓練，觀念正確。不過有一個常見誤解要修正：乳酸唔係令第二日腳痠嘅「廢物」，身體會將佢當燃料再用；第二日痠痛主要係肌肉細微損傷。研究比較十歲兒童同成人做 10 次 5 秒衝刺（休息 40 秒，五次一組、組間 2 分鐘），發現兒童嘅血乳酸較低、清除較快、主觀辛苦程度較低。所以小朋友可以做短而快、休息足夠嘅間歇；真正嘅「乳酸耐受訓練」（例如 300 至 400 米高強度、休息好短）留待青少年期由教練逐步加入。App 建議：六至九歲做「五秒火箭」；十至十二歲加「一百米七八成力、慢跑返起點」四至六次，每星期最多一次，翌日輕鬆。","以上係一般教育資料，具體份量請以孩子嘅教練或體育老師判斷為準，尤其係有傷患或者特別疲勞嘅時候。"]},{t:"十、抽筋同受傷",p:["抽筋（運動相關肌肉痙攣）目前主流解釋係神經肌肉疲勞，熱同脫水係附加因素。處理：停止、溫和拉長、輕按、補水；經常發生要求醫。","扭傷嘅最新處理建議係「PEACE & LOVE」：急性期保護、抬高、避免消炎藥同過度冰敷、壓迫包紮、了解病情；之後逐步加負荷、保持積極、做帶氧運動、做針對性練習。冰敷主要用嚟止痛，每次十至十五分鐘，唔好直接貼皮膚。","復健要循序漸進（休息保護 → 無痛活動 → 力量同平衡 → 行 → 慢跑 → 加速跳躍），用痛楚分數控制，最好由醫生或物理治療師跟進。"]},{t:"十一、你可能遺漏咗嘅重要事",p:["一、多元運動：專項化太早會增加受傷同放棄嘅風險。二、生長期痛症：腳跟痛同膝頭下面痛要留意。三、充足瞓眠：六至十二歲建議每晚九至十二個鐘。","四、讚「努力」唔好淨係讚「成績」。五、唔好用跑步做懲罰。六、記錄同慶祝進步。七、有興趣嘅話，可以參加學校田徑隊或者田徑會，有合資格教練會更安全、更有系統。"]},{t:"十二、安全提示",p:["本 App 嘅內容係一般運動教育資料，唔係醫療建議。小朋友如果有心臟、哮喘或者其他健康問題，開始訓練前請先諮詢醫生。訓練時請有大人陪同，留意天氣同地面情況。"]}],qi={young:[{d:"一",tag:"rest",name:"休息 / 自由玩",items:["自由玩、行公園"]},{d:"二",tag:"speed",name:"快腳日",items:["熱身 10 分鐘","技術操：抓地畫圈、高抬腿、直腿踢","口令反應遊戲","五秒火箭 × 5（慢行 40 秒）","收操拉筋"]},{d:"三",tag:"play",name:"遊戲日",items:["捉人遊戲 / 接力","快腳、側併步","跳繩 3 × 30 秒","單腳企平衡"]},{d:"四",tag:"strength",name:"小力士日",items:["熱身","深蹲 2 × 8","單腳臀橋 2 × 6","側平板 2 × 15 秒","腳踝彈跳、左右跳線","輕鬆跑 5 分鐘"]},{d:"五",tag:"rest",name:"休息",items:["早啲瞓 😴"]},{d:"六",tag:"endurance",name:"海旁燈柱日",items:["熱身","燈柱法特萊克：快 15 秒、慢 30 秒 × 4","輕鬆跑 8–10 分鐘","收操拉筋"]},{d:"日",tag:"family",name:"家庭運動日",items:["游水 / 踩單車 / 行山（自由揀）"]}],older:[{d:"一",tag:"rest",name:"休息",items:["拉筋 / 輕鬆散步"]},{d:"二",tag:"speed",name:"速度日",items:["熱身 15 分鐘","技術操：抓地畫圈、A 跳步、直腿踢、後蹬跑","反應起跑 × 5（唔同姿勢、聽信號）","五秒火箭（約 30 米快跑）× 5（慢行 40 秒）","收操拉筋"]},{d:"三",tag:"endurance",name:"耐力日",items:["熱身","輕鬆跑 12–20 分鐘（講說話測試）","加速跑 × 3","拉筋"]},{d:"四",tag:"strength",name:"力量 + 彈跳日",items:["熱身","深蹲 2 × 12","單腳硬拉 2 × 6 每邊","單腳臀橋 2 × 8 每邊","側平板 / 登山者 2 × 20 秒","彈跳：腳踝彈跳、左右跳線、蹲跳","快腳、側併步"]},{d:"五",tag:"rest",name:"休息 / 其他運動",items:["游水、打波或者休息"]},{d:"六",tag:"tempo",name:"海旁間歇日",items:["熱身 + 技術操","一百米間歇：七八成力 × 4–6（慢跑返轉頭）","輕鬆跑 10 分鐘","收操拉筋"]},{d:"日",tag:"family",name:"家庭 / 長慢跑",items:["20–30 分鐘輕鬆跑或者行山"]}]},bi={rest:["休息","#90a4ae"],speed:["練快","#fbc02d"],play:["遊戲","#ab47bc"],strength:["練力","#ef5350"],endurance:["練氣","#26c6da"],family:["家庭","#66bb6a"],tempo:["練氣+快","#42a5f5"]},i0={jog:{n:"輕鬆慢跑",run:"jog",cam:"side",secs:[90,180],say:"輕輕鬆鬆咁跑，可以講說話嘅速度。"},armCircles:{n:"手臂畫圈",run:"armCircles",cam:"front",secs:[30,30],say:"向前十次，向後十次。"},legSwing:{n:"前後擺腿",run:"legSwing",cam:"side",secs:[20,25],sides:2,props:["wall"],say:"扶住欄杆，隻腳好似鐘擺咁擺。"},high
