<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<title>成語小鎮：3D 廣東話成語學習遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8E7; --ink:#2D2A26; --soft:#6B645C; --card:#FFFFFF;
  --blue:#1E88E5; --blue-l:#E3F2FD; --orange:#F57C00; --orange-l:#FFF3E0;
  --green:#2E7D32; --green-l:#E8F5E9; --purple:#6A1B9A; --purple-l:#F3E5F5;
  --pink:#C2185B; --pink-l:#FCE4EC; --star:#FFB300; --line:#EADFC8;
  --top:56px; --bot:72px; --r:18px;
  --font:"Noto Sans HK","PingFang HK","PingFang TC","Yuanti TC","Microsoft JhengHei UI","Microsoft JhengHei","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans HK",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;background:#fff;border-bottom:2px solid var(--line);z-index:50}
#topbar .tb{flex:0 0 auto;height:42px;min-width:42px;border:0;border-radius:12px;background:var(--blue-l);color:#0D47A1;font-weight:700;font-size:15px;padding:0 10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
#topbar .tb .ic{font-size:18px}
#tbTitle{flex:1 1 auto;min-width:0;text-align:center;font-weight:800;font-size:16px;line-height:1.2;overflow:hidden}
#tbTitle small{display:block;font-weight:600;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbTitle span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnPause.idle{opacity:.45}
#btnPause.on{background:var(--orange);color:#fff}
@media (max-width:420px){#topbar .tb .tx{display:none}#topbar .tb{padding:0 8px}}

/* ---------- screens ---------- */
.screen{display:none;min-height:100vh;min-height:100dvh;padding:calc(var(--top) + env(safe-area-inset-top) + 12px) 14px calc(var(--bot) + env(safe-area-inset-bottom) + 16px)}
.screen.on{display:block}
.screen.nobar{padding-top:16px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.3}
h2{font-size:24px}
h3{font-size:20px}
.lead{font-size:19px;font-weight:700;margin:4px 0 12px;padding-right:40px;position:relative}
.muted{color:var(--soft);font-size:15px}

/* speaker icon */
.spk{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--orange-l);color:var(--orange);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;z-index:2}
.spk:active{transform:scale(.92)}
.spk.inline{position:static;display:inline-flex;vertical-align:middle;margin-left:6px;width:30px;height:30px;font-size:14px}
.has-spk{position:relative;padding-right:46px!important}

.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:0 2px 0 var(--line),0 4px 14px rgba(120,90,40,.08);position:relative}

/* buttons */
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--blue);color:#fff;box-shadow:0 4px 0 #0D47A1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0D47A1}
.btn.main{background:var(--orange);box-shadow:0 4px 0 #BF360C}
.btn.main:active{box-shadow:0 2px 0 #BF360C}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1B5E20}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 #4A148C}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #880E4F}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#CFC8BC;box-shadow:0 4px 0 #ABA395;color:#fff;cursor:not-allowed}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #BF360C,0 0 0 0 rgba(245,124,0,.55)}50%{box-shadow:0 4px 0 #BF360C,0 0 0 10px rgba(245,124,0,0)}}
.btn.big{font-size:22px;padding:14px 34px;min-height:62px}

/* bottom action bar */
#botbar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:2px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:40}
#botbar .btn{flex:1 1 0;max-width:320px;font-size:17px;padding:10px 12px}

/* ---------- start ---------- */
#scrStart{display:none;position:relative;overflow:hidden;padding:0}
#scrStart.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#8FD3FF 0%,#C9ECFF 55%,#9BE08F 55%,#7CCB6B 100%)}
#startArt{width:min(92vw,520px);height:auto;margin-top:12px}
.startT{font-size:clamp(40px,11vw,68px);font-weight:900;color:#fff;text-shadow:0 4px 0 #E65100,0 8px 18px rgba(0,0,0,.18);letter-spacing:4px;margin:0}
.startS{display:inline-block;background:#fff;border-radius:20px;padding:8px 46px 8px 18px;font-size:clamp(17px,4.6vw,22px);font-weight:800;margin:10px 12px 18px;position:relative;max-width:92vw}
#startHint{margin-top:14px;font-size:15px;color:#1B5E20;font-weight:700;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:12px}

/* ---------- avatar ---------- */
.avatars{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.av{width:150px;border:4px solid var(--line);border-radius:22px;background:#fff;padding:8px;text-align:center;font-weight:800;position:relative}
.av svg{width:100%;height:150px}
.av.sel{border-color:var(--orange);background:var(--orange-l)}
.av .tick{position:absolute;top:6px;left:8px;font-size:20px;display:none}
.av.sel .tick{display:block}
.namebox{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.namebox input{border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-size:20px;width:min(340px,90vw)}

/* ---------- town ---------- */
#scrTown{padding:0}
#townWrap{position:fixed;left:0;right:0;top:calc(var(--top) + env(safe-area-inset-top));bottom:calc(var(--bot) + 64px + env(safe-area-inset-bottom))}
.stage3d{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#9AD8FF,#E1F5FE)}
.stage3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.ctl3d{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctl3d button{border:0;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 2px 6px rgba(0,0,0,.18);font-weight:800;font-size:14px;padding:6px 10px;min-height:40px;white-space:nowrap}
.compass{position:absolute;left:8px;bottom:8px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.2);opacity:0;transition:opacity .4s;pointer-events:none;z-index:4}
.compass.show{opacity:1}
.gesture{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:14px;padding:6px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:6;max-width:94%;text-align:center;transition:opacity .5s}
.bubble3d{position:absolute;z-index:6;background:#fff;border-radius:16px;padding:8px 44px 8px 12px;font-size:15px;font-weight:700;max-width:min(260px,70%);box-shadow:0 3px 10px rgba(0,0,0,.2);pointer-events:auto;transform:translate(-50%,-100%)}
.bubble3d:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble3d .who{color:var(--orange);font-size:13px;display:block}
#townDock{position:fixed;left:0;right:0;bottom:calc(var(--bot) + env(safe-area-inset-bottom));height:64px;display:flex;gap:8px;padding:8px;justify-content:center;background:#fff;border-top:2px solid var(--line);z-index:39}
#townDock .btn{flex:1 1 0;max-width:200px;font-size:15px;padding:6px;min-height:46px}
.noti{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + env(safe-area-inset-top) + 8px);z-index:80;background:#263238;color:#fff;border-radius:14px;padding:8px 14px;font-size:15px;font-weight:700;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .4s}
#banner3d{background:#FFEBEE;color:#B71C1C;border:2px solid #EF9A9A;border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;margin:8px auto;max-width:860px}

/* ---------- catalog ---------- */
.prog{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.prog .pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.chapter{margin:18px 0 8px}
.chapter h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chapter .cbadge{font-size:13px;background:var(--blue-l);color:#0D47A1;border-radius:999px;padding:2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.icard{border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px 10px 8px;text-align:left;position:relative;min-height:96px;display:flex;flex-direction:column;gap:2px;width:100%}
.icard .no{font-size:12px;font-weight:800;color:var(--soft);line-height:1.2}
.icard .w{font-size:22px;font-weight:900;letter-spacing:1px}
.icard .m{font-size:13px;color:var(--soft);line-height:1.35}
.icard .st{font-size:15px;margin-top:auto}
.icard.new{border-color:var(--orange);background:var(--orange-l)}
.icard.done{border-color:#A5D6A7;background:#F1F8E9}
.icard.lock{opacity:.55;background:#F4F1EA}
.icard .tag{position:absolute;top:8px;right:8px;font-size:12px;font-weight:800;border-radius:8px;padding:1px 6px;background:var(--orange);color:#fff}
.icard.done .tag{background:var(--green)}
.icard.lock .tag{background:#9E9E9E}

/* ---------- idiom hub (學/練) ---------- */
.hubw{font-size:clamp(40px,12vw,64px);font-weight:900;text-align:center;letter-spacing:6px;margin:10px 0 0}
.hubj{text-align:center;color:var(--soft);font-size:15px;margin-bottom:6px}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.lr .btn{min-height:110px;flex-direction:column;font-size:22px;border-radius:22px}
.lr .btn small{font-size:14px;font-weight:600;opacity:.95}
.starhow{font-size:15px}
.starhow b{color:#E65100}

/* ---------- lesson ---------- */
.stepper{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}
.stepper button{flex:1 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 8px;font-size:14px;font-weight:800;color:var(--soft)}
.stepper button.cur{border-color:var(--orange);background:var(--orange);color:#fff}
.stepper button.ok{border-color:#A5D6A7;color:var(--green)}
.stepper button[disabled]{opacity:.5}
.storybox{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 2px 0 var(--line),0 4px 14px rgba(120,90,40,.08);position:relative}
.storybox svg.stage{display:block;width:100%;height:auto;aspect-ratio:2/1;background:#BFE6FF}
.storynav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-top:2px solid var(--line);background:#FFFDF6}
.storynav button{border:0;background:var(--blue-l);color:#0D47A1;border-radius:10px;font-weight:800;padding:6px 10px;font-size:14px;min-height:38px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#D7CCB8;display:block}
.dots i.on{background:var(--orange);transform:scale(1.25)}
.dots i.past{background:#FFCC80}
.storytext{font-size:19px;line-height:1.85}
.storytext .sen{border-radius:6px;padding:1px 2px;transition:background .3s}
.storytext .sen.on{background:#FFE082;box-shadow:0 0 0 2px #FFE082}
.caption{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 10px;font-size:15px;font-weight:700;line-height:1.45;text-align:center;pointer-events:none}
.meanbox .big{font-size:21px;font-weight:800}
.lit{background:var(--blue-l);border-radius:12px;padding:8px 12px;font-size:16px;margin-top:8px}
.tone{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:800;margin-left:4px}
.tone.p{background:#E8F5E9;color:#1B5E20}.tone.n{background:#FCE4EC;color:#880E4F}.tone.z{background:#ECEFF1;color:#37474F}
#d3box{height:min(56vh,440px);border-radius:var(--r);overflow:hidden;position:relative}
.d3task{background:var(--orange-l);border:2px dashed var(--orange);border-radius:14px;padding:8px 46px 8px 12px;font-weight:800;margin:8px 0;position:relative}
.d3task.done{background:var(--green-l);border-color:var(--green)}
.ex .ctx{display:inline-block;font-size:13px;font-weight:800;background:var(--purple-l);color:var(--purple);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.ex .s{font-size:19px;font-weight:700}
.ex .s mark{background:#FFE082;border-radius:4px;padding:0 2px}
.ex .e{margin-top:6px;background:#FAF6EC;border-radius:10px;padding:6px 10px;font-size:16px}
.ex .e b{color:var(--purple)}

/* quiz */
.qcard .q{font-size:19px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 46px 10px 10px;font-size:17px;font-weight:700;position:relative;width:100%;min-height:54px}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.right .k{background:var(--green)}
.opt.tried{border-color:#FFCC80;background:#FFF8E1;opacity:.8}
.opt.tried .k{background:#FFA726}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:10px 46px 10px 14px;margin-top:10px;font-size:17px;font-weight:700;position:relative}
.fb.ok{background:var(--green-l);border:2px solid #81C784}
.fb.no{background:#FFF8E1;border:2px solid #FFD54F}
.fb .head{font-size:19px;font-weight:900}
.qprog{font-size:14px;font-weight:800;color:var(--soft)}
.hintbtn{border:2px solid #FFD54F;background:#FFFDE7;border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px;margin-top:8px}
.hintbox{background:#FFFDE7;border-radius:12px;padding:8px 46px 8px 12px;margin-top:8px;font-size:16px;position:relative}
.guide{background:var(--purple-l);border-radius:14px;padding:8px 46px 8px 12px;margin:8px 0;position:relative;font-size:16px}
.guide b{color:var(--purple)}
.scene{background:#FFFDF6;border-left:6px solid var(--purple);border-radius:12px;padding:8px 46px 8px 12px;margin:8px 0;position:relative;font-size:17px}

/* done */
.done{text-align:center}
.done .stars{font-size:54px;letter-spacing:6px}
.done .stars .off{filter:grayscale(1);opacity:.3}
.done .why{text-align:left;max-width:520px;margin:8px auto}
.done .why div{padding:4px 0;font-size:16px}

/* skills */
.skill{display:flex;gap:12px;align-items:center;border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px;margin:8px 0;width:100%;text-align:left;position:relative}
.skill .ico{font-size:30px;flex:0 0 40px;text-align:center}
.skill .t{font-weight:900;font-size:18px}
.skill .d{font-size:14px;color:var(--soft);line-height:1.4}
.skill .ck{margin-left:auto;font-size:14px;font-weight:800;white-space:nowrap;text-align:right}
.skill.full{border-color:#A5D6A7;background:#F1F8E9}
.chip{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:17px;margin:4px}
.chip.sel{border-color:var(--orange);background:var(--orange-l)}
textarea{width:100%;min-height:90px;border:3px solid var(--line);border-radius:14px;padding:10px;font-size:18px;font-family:inherit}

/* dex */
.flip{perspective:900px;min-height:170px;border:0;background:transparent;padding:0;width:100%}
.flip .in{position:relative;display:grid;width:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid var(--line);background:#fff}
.flip .fa,.flip .fb2{padding:46px 10px 12px!important}.flip .fa .w{font-size:26px;font-weight:900;white-space:nowrap}
.flip .fb2{transform:rotateY(180deg);background:#FFFDE7;font-size:15px;font-weight:700;line-height:1.45}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dexwrap{position:relative}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}
#modalBox{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:16px 16px 18px;position:relative}
#modalBox h3{padding-right:44px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row label{font-weight:800}
.tog{border:0;border-radius:999px;padding:6px 14px;font-weight:800;min-width:84px;min-height:40px;background:#CFD8DC;color:#37474F}
.tog.on{background:var(--green);color:#fff}
.seg{display:flex;gap:4px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;min-height:40px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
details{background:#fff;border-radius:14px;padding:8px 12px;margin:8px 0;border:2px solid var(--line)}
details summary{font-weight:800;cursor:pointer}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* story svg helpers */
.stage .bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.stage .sway{animation:sway 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.stage .drift{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(860px)}}
.stage text{font-family:var(--font)}

@media (min-width:900px){
  .screen{padding-left:24px;padding-right:24px}
  .storytext{font-size:20px}
}
@media (orientation:landscape) and (max-height:520px){
  #d3box{height:62vh}
  .storybox svg.stage{max-height:58vh}
}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}}
/* 小鎮版面（冇底部列） */
#townWrap{bottom:calc(64px + env(safe-area-inset-bottom))}
#townDock{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom));height:calc(64px + env(safe-area-inset-bottom))}
/* 故事動畫 */
.stage .mot{transform-box:fill-box;transform-origin:50% 100%}
.stage .swing{animation:swing .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 0%}
@keyframes swing{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
.stage .spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

.dexwrap .save{width:100%;margin-top:6px;min-height:40px;font-size:15px;padding:6px}
.lr.wrapbtn{display:flex;flex-wrap:wrap;gap:8px}.wrapbtn .btn{min-height:44px;padding:8px 14px;font-size:16px}

    stage(items, opt) { stopNow(); st.q = norm(items); st.idx = 0; st.side = []; st.loud = !!(opt && opt.loud); st.paused = false; run(); },
    say(items) { stopNow(); st.q = norm(items); st.idx = 0; st.side = []; st.loud = true; st.paused = false; if (!st.unlocked) api.unlock(); run(true); },
    aside(items) {
      const n = norm(items);
      if (st.playing && !st.paused) { st.side.push(...n); ui(); return; }
      if (st.paused) { st.side.push(...n); ui(); return; }
      st.q = n; st.idx = 0; st.loud = false; run();
    },
    pause() { if (!(st.playing || st.q.length > st.idx || st.side.length)) return; st.paused = true; stopNow(); st.playing = false; ui(); },
    resume() { if (!st.paused) return; st.paused = false; run(); },
    toggle() { st.paused ? api.resume() : api.pause(); },
    cut() { stopNow(); st.q = []; st.idx = 0; st.side = []; st.playing = false; st.paused = false; ui(); },
    unlock() {
      if (st.unlocked) return; st.unlocked = true;
      if (S) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; S.speak(u); } catch (e) { } loadVoices(); warnIfNoHK(); }
      if (st.q.length > st.idx && !st.paused) run();
    },
    splitSentences, ui
  };
  return api;
})();

const Sfx = (() => {

function cardImage(title, sub, rows, file) {

  const wrap = (t, size, maxW) => { g.font = `700 ${size}px ${F}`; const out = []; let line = ''; for (const ch of t) { if (g.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; } if (line) out.push(line); return out; };
  const blocks = rows.map(r => ({ h: r.h, hl: wrap(r.h, 52, W - pad * 2), b: wrap(r.b, 38, W - pad * 2 - 20) }));
  let H = 300 + blocks.reduce((a, b) => a + b.hl.length * 66 + b.b.length * 54 + 50, 0) + 90;
  cv.width = W; cv.height = H;
  g.fillStyle = '#FFF8E7'; g.fillRect(0, 0, W, H); g.fillStyle = '#FFB74D'; g.fillRect(0, 0, W, 210);
  g.fillStyle = '#3E2723'; g.font = `900 80px ${F}`; g.fillText(title, pad, 120); g.font = `700 38px ${F}`; g.fillText(sub, pad, 180);
  let y = 290;
  blocks.forEach(b => { g.fillStyle = '#E65100'; g.font = `900 52px ${F}`; b.hl.forEach(l => { g.fillText(l, pad, y); y += 66; }); g.fillStyle = '#4E342E'; g.font = `700 38px ${F}`; b.b.forEach(l => { g.fillText(l, pad + 20, y); y += 54; }); y += 50; });
  g.fillStyle = '#8D6E63'; g.font = `700 30px ${F}`; g.fillText('成語小鎮・温習卡', pad, H - 40);

    const tip = '想喺 iPad 或者手機儲存：長按張圖，揀「加入『相片』」，之後喺「相片」App 就搵到。' + (canShare ? '或者撳「分享」，再揀「儲存影像」。' : '') + '撳「下載」嘅話，檔案會喺「檔案」App 嘅「下載項目」資料夾。';

}
