<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>成語小鎮</title>
<style>
:root{
  --sky:#87CEEB;--ground:#7CB342;--panel:#fffef8;--ink:#2c2416;--accent:#e67e22;
  --good:#27ae60;--soft:#f39c12;--bad:#c0392b;--hud:rgba(255,254,248,.94);
  --radius:14px;--shadow:0 8px 24px rgba(44,36,22,.18);--font:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:#f5efe4;overflow:hidden}
button,input,select{font:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#f5efe4}
canvas#c3d,#compass,#minimap,#bubble,#cdnBanner{display:none!important}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;max-width:520px;width:100%}
h1.title{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 8px;text-align:center;color:#c0392b;letter-spacing:.06em}
.tagline{text-align:center;margin:0 0 18px;font-size:1rem;opacity:.85}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 22px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #b85c0f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b85c0f}
.btn.secondary{background:#3498db;box-shadow:0 4px 0 #1f6fa5}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #ddd;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.char-pick{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.char-card{width:140px;padding:16px;border:3px solid #eee;border-radius:16px;text-align:center;cursor:pointer;background:#fff}
.char-card.selected{border-color:var(--accent);background:#fff5eb}
.char-avatar{font-size:3rem;line-height:1}
.hud{position:absolute;z-index:30;pointer-events:none}
.hud>*{pointer-events:auto}
.topbar{top:8px;left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--hud);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow);font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--hud);box-shadow:var(--shadow);cursor:pointer;font-size:1.2rem}
.bottombar{bottom:10px;left:8px;right:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.panel{position:absolute;z-index:40;inset:0;left:0;right:0;top:0;bottom:0;width:100%;max-width:none;height:100%;max-height:none;height:100dvh;max-height:100dvh;transform:none;border-radius:0;box-shadow:none;background:var(--panel);padding:12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;display:flex;flex-direction:column}
.panel.hidden,.hidden{display:none!important}
.panel h2{margin:0 0 8px;font-size:1.15rem}
.panel p{margin:0 0 8px;line-height:1.55;font-size:.95rem}
.speak{border:0;background:#ffe8cc;border-radius:8px;padding:2px 8px;cursor:pointer;margin-left:4px;font-size:.85rem}
.speak:hover{background:#ffd199}
.stars{color:#f1c40f;letter-spacing:2px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.list li:active{background:#fff8ee}
.badge{font-size:.75rem;background:#eee;border-radius:6px;padding:2px 6px}
.badge.warn{background:#ffe0a3}
.badge.ok{background:#d5f5e3}
.progress-bar{height:10px;background:#eee;border-radius:999px;overflow:hidden;margin:8px 0}
.progress-bar>i{display:block;height:100%;background:linear-gradient(90deg,#f39c12,#e67e22);width:0}

.quiz-opt.correct{border-color:var(--good);background:#eafaf1}
.quiz-opt.softwrong{border-color:var(--soft);background:#fef5e7}
.feedback{padding:10px;border-radius:10px;margin-top:8px;background:#eafaf1}
.feedback.soft{background:#fef9e7}
#compass{position:absolute;top:60px;right:12px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;z-index:25;font-weight:700;color:#c0392b}
#compass.show{display:flex}
#minimap{position:absolute;bottom:80px;right:12px;width:90px;height:90px;border-radius:12px;background:rgba(255,255,255,.8);box-shadow:var(--shadow);display:none;z-index:25;overflow:hidden}
#minimap.show{display:block}
#minimap canvas{width:100%;height:100%}
.bubble{position:absolute;z-index:28;background:#fff;border-radius:12px;padding:8px 10px;max-width:200px;box-shadow:var(--shadow);font-size:.85rem;pointer-events:auto;transform:translate(-50%,-100%)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff}
#cdnBanner{position:absolute;top:0;left:0;right:0;z-index:100;background:#c0392b;color:#fff;padding:10px;text-align:center;display:none}
#cdnBanner.show{display:block}
.settings-grid{display:grid;gap:10px}
.settings-grid label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:999px;border:2px solid #eee;background:#fff;cursor:pointer}
.tab.on{border-color:var(--accent);background:#fff5eb}
.skill-check{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.skill-check label{display:flex;align-items:flex-start;gap:8px;font-size:.9rem}
.detail{font-size:.85rem;opacity:.85;border-left:3px solid #f39c12;padding-left:8px;margin:8px 0}
.ex-block{margin:10px 0 14px;padding:8px 10px;border-radius:10px;background:#faf6ef}
.ex-sent{margin:0 0 6px;line-height:1.55}
.ex-note{font-size:.88rem;opacity:.9;border-left:3px solid #f39c12;padding:6px 8px;margin:0;background:#fff9f0;border-radius:0 8px 8px 0;line-height:1.45}

.chapter{margin:8px 0;padding:10px;border-radius:10px;background:#faf6ef}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{padding:8px 10px;border-radius:8px;border:2px solid #ddd;width:100%}
.toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#2c2416;color:#fff;padding:10px 16px;border-radius:999px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

#pauseBtn.live{opacity:1}

.quiz-opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;margin:8px 0;padding:14px 14px;border-radius:12px;border:2px solid #eee;background:#fff;cursor:pointer;font-size:1rem;line-height:1.4;min-height:48px}
.quiz-opt .opt-lab{flex:0 0 auto;font-weight:800;color:#e67e22;min-width:1.6em}
.quiz-opt .opt-txt{flex:1}
.nav-row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.nav-row .btn{flex:1;min-width:110px}
.exhibit-cap{font-size:.85rem;background:#fff5eb;border-radius:10px;padding:8px 10px;margin:8px 0;border-left:4px solid #e67e22}

/* ---- Story scene multi-beat player ---- */
#storyScene{
  width:100%;
  min-height:220px;
  height:clamp(200px,32vh,280px);
  margin:8px 0 12px;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 0 0 2px rgba(44,36,22,.08),0 4px 14px rgba(44,36,22,.12);
  background:linear-gradient(180deg,#87CEEB 0%,#c8e8ff 48%,#b8d98a 48.2%,#8bc34a 100%);
}
#storyScene .ss-stage-host{
  position:absolute;inset:0 0 52px 0;
  --ss-p:0;--ss-e:0;--ss-punch:0;--ss-drift:0;
  transform:scale(calc(1 + var(--ss-punch, 0)));
  transform-origin:center center;
  will-change:transform;
}
#storyScene .ss-stage-host::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    radial-gradient(ellipse at center, transparent 42%, rgba(44,36,22,.18) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 2px);
  mix-blend-mode:multiply;
  opacity:.55;
}
#storyScene .ss-stage{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;
  opacity:0;
  transition:opacity .48s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
#storyScene .ss-stage.on{opacity:1;z-index:2}
#storyScene .ss-stage.out{opacity:0;z-index:1}
#storyScene .ss-ui{
  position:absolute;left:0;right:0;bottom:0;
  padding:6px 8px 8px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.82) 28%,rgba(255,252,245,.94));
  z-index:5;
}
#storyScene .ss-caption{
  font-size:.78rem;line-height:1.45;color:#2c2416;
  text-shadow:0 1px 0 #fff;
  min-height:2.8em;
  max-height:5.2em;
  overflow:auto;
  word-break:break-word;
}
#storyScene .ss-beat-lab{
  display:inline-block;
  font-size:.68rem;font-weight:700;
  background:#f39c12;color:#fff;
  border-radius:999px;padding:1px 8px;margin-right:6px;
  vertical-align:1px;
}
#storyScene .ss-controls{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-top:4px;
}
#storyScene .ss-dots{display:flex;gap:6px;align-items:center}
#storyScene .ss-dot{
  width:10px;height:10px;border-radius:50%;
  border:2px solid #c0392b;background:transparent;
  padding:0;cursor:pointer;
}
#storyScene .ss-dot.on{background:#e74c3c}
#storyScene .ss-pause{
  border:none;background:rgba(44,36,22,.08);
  border-radius:8px;padding:2px 8px;cursor:pointer;
  font-size:.9rem;line-height:1.2;
}
@keyframes ss-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ss-hop{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(6px,-10px) rotate(-8deg)}50%{transform:translate(12px,0) rotate(0)}75%{transform:translate(18px,-8px) rotate(6deg)}}
@keyframes ss-hop-loop{0%{transform:translate(0,0)}20%{transform:translate(8px,-14px)}40%{transform:translate(16px,0)}60%{transform:translate(24px,-12px)}80%{transform:translate(32px,0)}100%{transform:translate(0,0)}}
@keyframes ss-drift{0%{transform:translateX(0)}100%{transform:translateX(28px)}}
@keyframes ss-sun{0%{transform:translate(0,0)}50%{transform:translate(10px,4px)}100%{transform:translate(0,0)}}
@keyframes ss-dust{0%{opacity:.15;transform:translate(0,0) scale(.8)}50%{opacity:.55;transform:translate(8px,-6px) scale(1.1)}100%{opacity:.1;transform:translate(16px,-2px) scale(.7)}}
@keyframes ss-wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ss-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes ss-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ss-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ss-spin-slow{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.ss-anim-bob,.ss-anim-hop,.ss-anim-sway,.ss-anim-wave,.ss-anim-float,.ss-anim-pulse,.ss-anim-spin,.ss-anim-sun,.ss-anim-drift,.ss-anim-dust{transform-box:fill-box}
.ss-anim-bob{animation:ss-bob 2.4s ease-in-out infinite;transform-origin:center bottom}
.ss-anim-hop{animation:ss-hop-loop 2.8s ease-in-out infinite;transform-origin:center bottom}
.ss-anim-drift{animation:ss-drift 12s linear infinite alternate}
.ss-anim-sun{animation:ss-sun 8s ease-in-out infinite}
.ss-anim-dust{animation:ss-dust 2.2s ease-in-out infinite}
.ss-anim-wave{animation:ss-wave 1.8s ease-in-out infinite}
.ss-anim-sway{animation:ss-sway 3s ease-in-out infinite;transform-origin:center bottom}
.ss-anim-pulse{animation:ss-pulse 2s ease-in-out infinite}
.ss-anim-float{animation:ss-float 3.2s ease-in-out infinite}
.ss-anim-spin{animation:ss-spin-slow 14s linear infinite;transform-origin:center}




/* ---- seek(p) progress-driven motion (claude-motion-design adapted) ---- */
#storyScene .ss-m{
  transform-box:fill-box;
  transform-origin:center bottom;
  will-change:transform,opacity;
}
/* crash: rabbit flies in toward stump as --ss-e rises */
#storyScene .ss-m[data-m="crash"]{
  transform:
    translate(
      calc((1 - var(--ss-e, 0)) * -90px),
      calc((1 - var(--ss-e, 0)) * -18px + var(--ss-drift, 0) * 1px)
    )
    rotate(calc((1 - var(--ss-e, 0)) * -18deg));
}
/* hop: parabolic-ish lift then settle */
#storyScene .ss-m[data-m="hop"]{
  transform:
    translate(
      calc(var(--ss-e, 0) * 18px),
      calc(var(--ss-e, 0) * (var(--ss-e, 0) - 1) * 36px)
    );
}
/* wait: gentle bob from micro-drift — no cartoon bounce */
#storyScene .ss-m[data-m="wait"]{
  transform: translateY(calc(var(--ss-drift, 0) * 2.2px));
}
/* bob: soft vertical accent tied to progress ease */
#storyScene .ss-m[data-m="bob"]{
  transform: translateY(calc((1 - var(--ss-e, 0)) * -3px + var(--ss-drift, 0) * 1.4px));
}
/* drift: horizontal ease */
#storyScene .ss-m[data-m="drift"]{
  transform: translate(calc(var(--ss-e, 0) * 14px), calc(var(--ss-drift, 0) * 1.5px));
}
/* punch: quick scale nudge at utterance start via host --ss-punch; local kick too */
#storyScene .ss-m[data-m="punch"]{
  transform:
    translateY(calc(var(--ss-drift, 0) * 1px))
    scale(calc(1 + var(--ss-punch, 0) * 8));
}
/* wither: desaturate + fade in weeds */
#storyScene .ss-m[data-m="wither"]{
  opacity: calc(0.25 + var(--ss-e, 0) * 0.75);
  filter: saturate(calc(1.1 - var(--ss-e, 0) * 0.55));
}
/* sink: drop downward */
#storyScene .ss-m[data-m="sink"]{
  transform: translateY(calc(var(--ss-e, 0) * 28px));
  opacity: calc(1 - var(--ss-e, 0) * 0.25);
}
/* draw: slight scale-in of the embellishment */
#storyScene .ss-m[data-m="draw"]{
  transform: scale(calc(0.55 + var(--ss-e, 0) * 0.55));
  opacity: calc(0.35 + var(--ss-e, 0) * 0.65);
}
/* laugh: tiny side sway (one accent) */
#storyScene .ss-m[data-m="laugh"]{
  transform: translate(calc(var(--ss-drift, 0) * 3px), calc(var(--ss-drift, 0) * -1px))
    rotate(calc(var(--ss-drift, 0) * 2deg));
}
#storyScene .ss-static{transform-box:fill-box}
/* Prefer one accent: mute leftover CSS keyframe bounce on plot-motion children */
#storyScene .ss-m[data-m] .ss-anim-hop,
#storyScene .ss-m[data-m] .ss-anim-bob{
  animation:none;
}

/* ---- Catalog fills viewport (desktop + phone + iPad) ---- */
.panel.catalog-mode{
  inset:0;
  left:0; right:0; top:0; bottom:0;
  width:100%;
  max-width:none;
  height:100%;
  max-height:none;
  height:100dvh;
  max-height:100dvh;
  transform:none;
  border-radius:0;
  padding:12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
}
.panel.catalog-mode .cat-head{flex-shrink:0}
.panel.catalog-mode .cat-hint{font-size:.85rem;opacity:.8;margin:4px 0 8px}
.panel.catalog-mode .cat-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}
.panel.catalog-mode .chapter{margin:0;padding:0;background:transparent;border-radius:0}
.panel.catalog-mode .chapter-meta{margin:0 0 10px;font-size:.85rem}
.panel.catalog-mode h2{font-size:clamp(1.15rem,2.5vw,1.5rem);margin:0 0 4px}
.panel.catalog-mode > .btn-row{flex-shrink:0;margin-top:8px}

.idiom-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  padding-bottom:12px;
}
@media (min-width:560px){
  .idiom-grid{grid-template-columns:1fr 1fr}
}
@media (min-width:900px){
  .idiom-grid{grid-template-columns:1fr 1fr 1fr}
}
@media (min-width:1200px){
  .idiom-grid{grid-template-columns:1fr 1fr 1fr 1fr}
}
.idiom-card{
  appearance:none;
  border:2px solid #f0e6d6;
  background:#fff;
  border-radius:14px;
  padding:14px 14px 12px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(44,36,22,.06);
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:108px;
  width:100%;
  font:inherit;
  color:inherit;
  transition:border-color .15s, transform .12s, box-shadow .15s;
}
.idiom-card:hover,.idiom-card:focus-visible{
  border-color:var(--accent);
  box-shadow:0 6px 16px rgba(230,126,34,.18);
  outline:none;
}
.idiom-card:active{transform:scale(.98);background:#fff8ee}
.idiom-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idiom-card-top b{font-size:1.15rem;letter-spacing:.04em}
.idiom-card-meta{font-size:.8rem;opacity:.85}
.idiom-card-jp{font-size:.78rem;opacity:.65}
.idiom-card-go{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--accent)}
.idiom-gate-actions{flex-direction:column;align-items:stretch}
.idiom-gate-actions .btn{width:100%}

/* ---- Lesson sticky star progress ---- */
.lesson-stars-sticky{
  position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,#fffef8 70%,rgba(255,254,248,.85));
  padding:6px 4px 8px;margin:0 0 8px;
  border-bottom:1px dashed #f0e0c8;
  font-size:.95rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
}
.lesson-stars-sticky .stars{font-size:1.25rem;letter-spacing:3px}
.lesson-stars-sticky small{opacity:.75;font-size:.78rem}
.panel.lesson-mode,.panel.catalog-mode{
  /* full-page already on .panel */
}
.panel.lesson-mode > *:not(.btn-row):not(.nav-row):not(.lesson-stars-sticky){max-width:720px;width:100%;margin-left:auto;margin-right:auto}
.panel.lesson-mode .lesson-stars-sticky,.panel.lesson-mode .nav-row,.panel.lesson-mode > .btn-row{max-width:720px;width:100%;margin-left:auto;margin-right:auto}
.panel.lesson-mode #storyScene{max-width:720px;margin-left:auto;margin-right:auto;height:clamp(220px,38vh,360px);min-height:220px}
.hub .bottombar #btnResetCam{display:none!important}
#hubUI .bottombar{bottom:max(10px, env(safe-area-inset-bottom))}
/* Learned catalog cards: slightly deeper tint, still readable */
.idiom-card.learned{
  background:#ebe3d6;
  border-color:#d4c4ae;
  box-shadow:inset 0 0 0 1px rgba(44,36,22,.04),0 2px 8px rgba(44,36,22,.06);
}
.idiom-card.learned:hover,.idiom-card.learned:focus-visible{
  border-color:#c47830;
  background:#e6ddd0;
}
.idiom-card.learned .idiom-card-go{color:#a65d18}
.cat-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.cat-tools .btn{padding:8px 14px;font-size:.9rem}

/* Keep pause / settings above full-page panels */
#hubUI{z-index:50!important}
#hubUI .topbar{z-index:51}

</style>

<body>
<div id="app">
  <div id="toast" class="toast"></div>

  <div id="screen-start" class="screen active"></div>
  <div id="screen-char" class="screen"></div>
  <div id="screen-hub" class="screen" style="display:none!important"></div>

  <div id="hubUI" class="hud" style="display:none;position:absolute;inset:0;pointer-events:none;z-index:35">
    <div class="hud topbar">
      <span class="pill" id="progPill">進度 0/0</span>
      <button type="button" class="iconbtn" id="pauseBtn" title="暫停朗讀">⏸</button>
      <button type="button" class="iconbtn" id="btnSettings" title="設定">⚙️</button>
    </div>
  </div>

  <div id="panel" class="panel hidden"></div>
</div>

<script>
let IDIOMS = [{"id":"001","idiom":"守株待兔","jyutping":"sau2 zyu1 doi6 tou3","source":"《韓非子》","story":"古時宋國有個農夫喺田邊耕種。有一日，隻兔子慌到撞埋樹樁，暈咗喺度。農夫唔使費力就攞到野味，開心到第二日唔再耕田，成日坐喺樹樁邊等第二隻兔子嚟撞。日子一日一日過，田地荒廢，兔子亦都冇再嚟。鄰居見佢咁懶，笑住話佢「守株待兔」。後人用呢個成語提醒：唔好淨空想好運，要靠勤力先有收成。","meaning":"比喻唔肯努力，淨空想好運送上門。","examples":["小明成日守株待兔，唔溫習又想考滿分。","做生意唔可以守株待兔，要主動搵客。"],"difficulty":1,"objectType":"tree","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["古時宋國有個農夫喺田邊耕種","農夫唔使費力就攞到野味，開心到第二日唔再耕田","鄰居見佢咁懶，笑住話佢「守株待兔」","記住：唔肯努力，淨空想好運送上門——唔好學！"],"exampleNotes":["小明唔肯溫習，淨係空想考滿分，就係『守株待兔』——空等好運。","做生意被動等客上門唔得；呢句提醒要主動出擊，唔好『守株待兔』。"]},{"id":"002","idiom":"畫蛇添足","jyutping":"waak6 se4 tim1 zuk1","source":"《戰國策》","story":"戰國時候，一班人比賽畫蛇，講定邊個最先畫完就可以飲賞酒。有個人畫得最快，得意到仲喺蛇身上加多兩隻腳。其他人話：蛇根本冇腳，你加咗反而唔係蛇啦！結果佢輸咗，酒畀第二個人飲。大家笑佢多此一舉。呢個故事叫我哋記住：事情做到剛好就好，唔好多餘加嘢反而搞壞，就係「畫蛇添足」。","meaning":"比喻多此一舉，反而壞事。","examples":["作文寫得好齊就交，唔好畫蛇添足。","蛋糕已經靚，再加多餘裝飾反而畫蛇添足。"],"difficulty":1,"objectType":"scroll","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["戰國時候，一班人比賽畫蛇，講定邊個最先畫完就可以飲賞酒","其他人話：蛇根本冇腳，你加咗反而唔係蛇啦","呢個故事叫我哋記住：事情做到剛好就好","記住：多此一舉，反而壞事——唔好學！"],"exampleNotes":["作文已經齊整仲加多餘嘢，反而弄巧成拙——勸你唔好『畫蛇添足』。","蛋糕夠靚仲堆裝飾，生活場合同樣講：多此一舉反而壞事。"]},{"id":"003","idiom":"亡羊補牢","jyutping":"mong4 joeng4 bou2 lou4","source":"《戰國策》","story":"從前有個人養羊，羊圈破咗個窿，羊走失咗。鄰居勸佢快啲補好羊圈，佢初頭覺得羊已經冇咗，補嚟都遲。後來再諗清楚：雖然走失嘅羊返唔嚟，但如果而家補好，以後就唔會再走失。於是佢連夜修好羊圈，之後羊群安穩。故事教我哋：出咗錯及時改正仍然唔算遲，呢個就係「亡羊補牢」嘅道理。","meaning":"出咗錯及時改正，仍然唔算遲。","examples":["測驗唔理想，亡羊補牢而家溫書仲趕得切。","玩具整爛先收好，亡羊補牢好過繼續亂擺。"],"difficulty":1,"objectType":"gate","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["從前有個人養羊，羊圈破咗個窿，羊走失咗","後來再諗清楚：雖然走失嘅羊返唔嚟，但如果而家補好","故事教我哋：出咗錯及時改正仍然唔算遲","精髓：出咗錯及時改正，仍然唔算遲——要學！"],"exampleNotes":["測驗差咗即刻補溫，強調「及時改」仍然趕得切，正合『亡羊補牢』。","玩具整爛先收好：出咗錯即補救，好過放任——生活版亡羊補牢。"]},{"id":"004","idiom":"井底之蛙","jyutping":"zeng2 dai2 zi1 waa1","source":"《莊子》","story":"一口淺井入面住住隻青蛙，佢以為成個天得井口咁大，好得意。有一日東海大鱉探訪，講大海幾咁闊、幾咁深，風雨波浪都見過。青蛙聽完嚇一跳，先知自己見識好少。莊子用呢個寓言提醒人：唔好困喺自己細世界，要走出去多睇多學。後人就話見識狹窄嘅人好似「井底之蛙」。","meaning":"比喻見識狹窄，冇見過世面。","examples":["唔好做井底之蛙，多睇書就知世界大。","去圖書館之後，小華先發現以前好似井底之蛙。"],"difficulty":1,"objectType":"well","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["一口淺井入面住住隻青蛙，佢以為成個天得井口咁大，好得意","有一日東海大鱉探訪，講大海幾咁闊、幾咁深，風雨波浪都見過","青蛙聽完嚇一跳，先知自己見識好少","精髓：見識狹窄，冇見過世面，要小心！"],"exampleNotes":["勸人多睇書開眼界，唔好做『井底之蛙』——見識狹窄。","小華去圖書館先醒覺以前眼界窄，呢度用成語自嘲醒悟。"]},{"id":"005","idiom":"掩耳盜鈴","jyutping":"jim2 ji5 dou6 ling4","source":"《呂氏春秋》","story":"從前有人睇中人家門口個銅鈴，想偷走。又驚鈴聲響會畀人發現，於是塞住自己隻耳，以為自己聽唔到，別人就一樣聽唔到。結果一拉鈴，聲照響，即刻畀人捉住。呢個笑話教我哋：自己騙自己冇用，事實唔會因為你唔聽就消失。後人叫呢種做法做「掩耳盜鈴」。","meaning":"自己騙自己，以為別人唔知。","examples":["抄功課蓋住答案本，其實係掩耳盜鈴。","食咗餅唔認，真係掩耳盜鈴。"],"difficulty":1,"objectType":"bell","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["從前有人睇中人家門口個銅鈴，想偷走","又驚鈴聲響會畀人發現，於是塞住自己隻耳，以為自己聽唔到","呢個笑話教我哋：自己騙自己冇用，事實唔會因為你唔聽就消失","記住：自己騙自己，以為別人唔知——唔好學！"],"exampleNotes":["抄功課仲遮住答案本，以為冇人知，其實係自己騙自己。","食咗餅唔認帳，屋企場面一樣係『掩耳盜鈴』式自欺。"]},{"id":"006","idiom":"坐井觀天","jyutping":"zo6 zeng2 gun1 tin1","source":"《韓愈》","story":"有人坐喺井底望上天，見到嘅天只有井口咁圓、咁細，就以為全世界嘅天都係咁大。其實只要爬出井口，就會見到無邊無際嘅藍天白雲。古人用呢個畫面形容眼界狹窄、見識唔夠嘅人。我哋讀書遊歷，就係為咗唔好永遠「坐井觀天」，而要打開視野睇更大世界。","meaning":"比喻眼界好窄，見識唔夠。","examples":["淨睇屋企附近，就好似坐井觀天。","參加交流營之後，唔再坐井觀天。"],"difficulty":1,"objectType":"well","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["有人坐喺井底望上天，見到嘅天只有井口咁圓、咁細","其實只要爬出井口，就會見到無邊無際嘅藍天白雲","我哋讀書遊歷，就係為咗唔好永遠「坐井觀天」","精髓：眼界好窄，見識唔夠，要小心！"],"exampleNotes":["『坐井觀天』幫你一眼睇明場面（淨睇屋企附近，就好似）：眼界好窄，見識唔夠。","場面係「參加交流營之後，唔再」；成語說明「眼界好窄，見識唔夠」。"]},{"id":"007","idiom":"一石二鳥","jyutping":"jat1 sek6 ji6 niu5","source":"相傳外來漢譯","story":"關於「一石二鳥」，古人流傳咗咁樣嘅講法：相傳擲一塊石頭可以嚇走兩隻雀，後人用來講一次做兩件好事。出處同相傳外來漢譯有關。後來大家用呢四個字，意思係做一件事同時得到兩方面好處。呢個成語多數用嚟讚人或者講正面情況。小朋友可以想像故事畫面，再對照例句——好似「步行返學一石二鳥：運動又慳車費。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"做一件事同時得到兩方面好處。","examples":["步行返學一石二鳥：運動又慳車費。","整理書包順便溫生字，真係一石二鳥。"],"difficulty":1,"objectType":"stone","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["出處同相傳外來漢譯有關","小朋友可以想像故事畫面，再對照例句——好似「步行返學一石…","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：做一件事同時得到兩方面好處——要學！"],"exampleNotes":["值得學嘅用法：用成語讚／鼓勵「步行返學，運動又慳車費」（做一件事同時得到兩方面好處）。","整理書包順便溫生字，真係，就係『一石二鳥』想教嘅態度：做一件事同時得到兩方面好處。"]},{"id":"008","idiom":"半途而廢","jyutping":"bun3 tou4 ji4 fai3","source":"《禮記》","story":"關於「半途而廢」，古人流傳咗咁樣嘅講法：做事做到一半就停低，好似行路行到半路放棄。出處同《禮記》有關。後來大家用呢四個字，意思係做事冇恆心，做到一半就放棄。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「學琴三個月就半途而廢，好可惜。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"做事冇恆心，做到一半就放棄。","examples":["學琴三個月就半途而廢，好可惜。","拼圖拼到一半唔好半途而廢。"],"difficulty":1,"objectType":"bridge","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「半途而廢」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係做事冇恆心，做到一半就放棄","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：做事冇恆心，做到一半就放棄，要小心！"],"exampleNotes":["孩子易明版：呢句講學琴三個月就，好可惜，成語＝做事冇恆心，做到一半就放棄。","把「拼圖拼到一半唔好」標成反面教材，成語即做事冇恆心，做到一半就放棄。"]},{"id":"009","idiom":"三心兩意","jyutping":"saam1 sam1 loeng5 ji3","source":"相傳","story":"關於「三心兩意」，古人流傳咗咁樣嘅講法：相傳人做事時心思散亂，又想呢樣又想嗰樣，後人叫三心兩意。出處同相傳有關。後來大家用呢四個字，意思係做事唔專心，主意唔定。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「做功課唔好三心兩意，專心先做得快。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"做事唔專心，主意唔定。","examples":["做功課唔好三心兩意，專心先做得快。","選興趣班唔好三心兩意，揀定就堅持。"],"difficulty":1,"objectType":"mirror","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["出處同相傳有關","小朋友可以想像故事畫面，再對照例句——好似「做功課唔好三…","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：做事唔專心，主意唔定，要小心！"],"exampleNotes":["把「做功課唔好，專心先做得快」標成反面教材，成語即做事唔專心，主意唔定。","『三心兩意』喺度係警告——選興趣班唔好，揀定就堅持會變成做事唔專心，主意唔定。"]},{"id":"010","idiom":"一五一十","jyutping":"jat1 ng5 jat1 sap6","source":"相傳","story":"關於「一五一十」，古人流傳咗咁樣嘅講法：相傳數東西由一數到十咁清楚，後來用來講完整如實講出事實。出處同相傳有關。後來大家用呢四個字，意思係照事實完整講清楚，冇隱瞞。呢個成語可以中性咁描述情況。小朋友可以想像故事畫面，再對照例句——好似「老師問發生咩事，小明一五一十講晒。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"照事實完整講清楚，冇隱瞞。","examples":["老師問發生咩事，小明一五一十講晒。","同屋企人一五一十交代成績，唔好瞞。"],"difficulty":1,"objectType":"scroll","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「一五一十」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係照事實完整講清楚，冇隱瞞","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：照事實完整講清楚，冇隱瞞"],"exampleNotes":["老師追問時，小明照事實完整講晒，冇隱瞞——『一五一十』。","同屋企交代成績要完整坦白；成語喺度強調「講清、唔瞞」。"]},{"id":"011","idiom":"人山人海","jyutping":"jan4 saan1 jan4 hoi2","source":"相傳","story":"關於「人山人海」，古人流傳咗咁樣嘅講法：好多人聚集一齊，好似山同海咁多。出處同相傳有關。後來大家用呢四個字，意思係形容人非常多。呢個成語可以中性咁描述情況。小朋友可以想像故事畫面，再對照例句——好似「新年花市人山人海，要小心跟實大人。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"形容人非常多。","examples":["新年花市人山人海，要小心跟實大人。","開幕日商場人山人海，我哋提早出門。"],"difficulty":1,"objectType":"crowd","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「人山人海」，古人流傳咗咁樣嘅講法：好多人聚集一齊","後來大家用呢四個字，意思係形容人非常多","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：人非常多"],"exampleNotes":["引申場合可見——「新年花市，要小心跟實大人」用『人山人海』概括為人非常多。","唔好淨背定義：連住「開幕日商場，我哋提早出門」先明成語指人非常多。"]},{"id":"012","idiom":"獨一無二","jyutping":"duk6 jat1 mou4 ji6","source":"相傳","story":"關於「獨一無二」，古人流傳咗咁樣嘅講法：世界上只有一個，冇第二個一樣。出處同相傳有關。後來大家用呢四個字，意思係非常特別，冇嘢可以相比。呢個成語多數用嚟讚人或者講正面情況。小朋友可以想像故事畫面，再對照例句——好似「每個人嘅笑容都獨一無二。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"非常特別，冇嘢可以相比。","examples":["每個人嘅笑容都獨一無二。","呢幅手作卡片獨一無二，係你親手整。"],"difficulty":1,"objectType":"lantern","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「獨一無二」，古人流傳咗咁樣嘅講法：世界上只有一個","後來大家用呢四個字，意思係非常特別，冇嘢可以相比","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：非常特別，冇嘢可以相比——要學！"],"exampleNotes":["話每個人笑容都獨特，用『獨一無二』讚獨特性。","手作卡片親手整，強調冇第二張一樣——成語突出珍貴。"]},{"id":"013","idiom":"一心一意","jyutping":"jat1 sam1 jat1 ji3","source":"相傳","story":"「一心一意」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：心同意都集中喺一件事上面。準確意思係好專心，冇分心。呢個成語多數用嚟讚人或者講正面情況。課堂同日常都可以用，例如：佢一心一意練習寫字，進步好快。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"好專心，冇分心。","examples":["佢一心一意練習寫字，進步好快。","專心聽課要一心一意，收埋電話。"],"difficulty":1 "polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「五花八門」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係種類繁多，式樣齊全","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：種類繁多，式樣齊全"],"exampleNotes":["孩子易明版：呢句講書展攤位，唔知揀邊本，成語＝種類繁多，式樣齊全。","午後點心，每樣少少試入面用『五花八門』，即種類繁多，式樣齊全。"]},{"id":"017","idiom":"七嘴八舌","jyutping":"cat1 zeoi2 baat3 sit3","source":"相傳","story":"「七嘴八舌」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：好多人同時講話，好嘈亂。準確意思係大家搶住講，意見好亂。呢個成語可以中性咁描述情況。課堂同日常都可以用，例如：班會七嘴八舌，老師要舉手提問。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"大家搶住講，意見好亂。","examples":["班會七嘴八舌，老師要舉手提問。","討論時唔好七嘴八舌，輪流講。"],"difficulty":1,"objectType":"crowd","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「七嘴八舌」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係大家搶住講，意見好亂","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：大家搶住講，意見好亂"],"exampleNotes":["引申場合可見——「班會，老師要舉手提問」用『七嘴八舌』概括為大家搶住講，意見好亂。","場面係「討論時唔好，輪流講」；成語說明「大家搶住講，意見好亂」。"]},{"id":"018","idiom":"十全十美","jyutping":"sap6 cyun4 sap6 mei5","source":"相傳","story":"「十全十美」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：各方面都完美，冇缺點。準確意思係非常完美。呢個成語多數用嚟讚人或者講正面情況。課堂同日常都可以用，例如：世上難有十全十美嘅人，努力改善就好。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"非常完美。","examples":["世上難有十全十美嘅人，努力改善就好。","今次表演唔係十全十美，但大家盡力。"],"difficulty":1,"objectType":"mirror","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「十全十美」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係非常完美","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：非常完美——要學！"],"exampleNotes":["場合偏正面；『十全十美』點出非常完美。","結合句子「今次表演唔係，但大家盡力」理解『十全十美』＝非常完美。"]},{"id":"019","idiom":"手忙腳亂","jyutping":"sau2 mong4 goek3 lyun6","source":"相傳","story":"關於「手忙腳亂」，古人流傳咗咁樣嘅講法：手同腳都忙到亂晒，做事冇秩序。出處同相傳有關。後來大家用呢四個字，意思係做事慌張，秩序大亂。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「臨出門先搵書，當然手忙腳亂。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"做事慌張，秩序大亂。","examples":["臨出門先搵書同水壺，小明當然手忙腳亂。","頭晚執好書包，朝早就唔使手忙腳亂。"],"difficulty":1,"objectType":"cart","polarity":"貶","skills":["literal","polarity","context","near","grammar", 。","而家用電腦溫書，仲死守舊法好似刻舟求劍。"],"difficulty":2,"objectType":"boat","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《呂氏春秋》講有人坐船時劍掉落河中，立刻喺船舷刻記號","」船靠岸之後，佢按記號跳下水搵","做事要靈活變通，唔好「刻舟求劍」","精髓：情況變咗仲死守舊方法，要小心！"],"exampleNotes":["定性用法：用地圖舊版搵路等於＝情況變咗仲死守舊方法。","說話者話呢就係『刻舟求劍』：情況變咗仲死守舊方法。"]},{"id":"033","idiom":"對牛彈琴","jyutping":"deoi3 ngau4 taan4 kam4","source":"相傳《牟子》","story":"關於「對牛彈琴」，古人流傳咗咁樣嘅講法：相傳有人對牛彈琴，牛完全唔理會，因為聽唔明音樂。出處同相傳《牟子》有關。後來大家用呢四個字，意思係對唔明事理嘅人講道理，白費功夫。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「同細佬講化學公式好似對牛彈琴。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"對唔明事理嘅人講道理，白費功夫。","examples":["同細佬講化學公式好似對牛彈琴。","解釋前先問清楚，唔好對牛彈琴。"],"difficulty":2,"objectType":"drum","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「對牛彈琴」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係對唔明事理嘅人講道理，白費功夫","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：對唔明事理嘅人講道理，白費功夫，要小心！"],"exampleNotes":["定性用法：同細佬講化學公式好似＝對唔明事理嘅人講道理，白費功夫。","呢句勸人唔好『對牛彈琴』：解釋前先問清楚，唔好——即對唔明事理嘅人講道理，白費功夫。"]},{"id":"034","idiom":"拔苗助長","jyutping":"bat6 miu4 zo6 zoeng2","source":"《孟子》","story":"《孟子》講宋國有人嫌禾苗長得慢，就一棵棵用手拔高，返屋企誇口話幫苗快咗。兒子跑去田睇，禾苗全部枯死。因為生長有規律，勉強催快反而害咗佢哋。呢個寓言提醒家長同學：學習同成長要按步驟，唔好「拔苗助長」，急於求成會得不償失。","meaning":"違反規律勉強求快，反而搞壞。","examples":["逼細路日日背廿篇古文等於拔苗助長。","學琴要按進度，唔好拔苗助長。"],"difficulty":2,"objectType":"tree","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《孟子》講宋國有人嫌禾苗長得慢，就一棵棵用手拔高","兒子跑去田睇，禾苗全部枯死","因為生長有規律，勉強催快反而害咗佢哋","記住：違反規律勉強求快，反而搞壞——唔好學！"],"exampleNotes":["用成語替「逼細路日日背廿篇古文等於」下標籤：違反規律勉強求快，反而搞壞。","把「學琴要按進度，唔好」標成反面教材，成語即違反規律勉強求快，反而搞壞。"]},{"id":"035","idiom":"愚公移山","jyutping":"jyu4 gung1 ji4 saan1","source":"《列子》","story":"《列子》裡愚公屋前有太行、王屋兩座大山擋路，出入好辛苦。九十歲嘅愚公決定同子孫一代代搬山。智叟笑佢傻，愚公話：「我死有子，子又有孫，山唔會加高，總有一日搬得晒。」天帝感動，派人搬走大山。故事讚有決心毅力，再難都可以做到，就係「愚公移山」精神。","meaning":"有決心毅力，再難都可以做到。","examples":["溫晒學期筆記好似愚公移山，一日少少。","重建球場大家用愚公移山精神一齊做。"],"difficulty":2,"objectType":"mountain","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《列子》裡愚公屋前有太行、王屋兩座大山擋路，出入好辛苦","智叟笑佢傻，愚公話：「我死有子，子又有孫，山唔會加高","故事讚有決心毅力，再難都可以做到，就係「愚公移山」精神","精髓：有決心毅力，再難都可以做到——要學！"],"exampleNotes":["溫晒學期筆記好似，一日少少，就係『愚公移山』想教嘅態度：有決心毅力，再難都可以做到。","呢度正面用『愚公移山』：重建球場大家用精神一齊做，意思係有決心毅力，再難都可以做到。"]},{"id":"036","idiom":"濫竽充數","jyutping":"laam5 jyu1 cung1 sou3","source":"《韓非子》","story":"齊宣王喜歡聽三百人一齊吹竽，南郭先生唔識吹，卻混入樂隊食俸祿。後來湣王要逐個吹，南郭先生怕曝光就溜走。韓非子用呢個故事講冇真本事、混喺人群充場面嘅人。我哋做小組報告、合唱團都要有真貢獻，唔好「濫竽充數」。","meaning":"冇真本事，混喺人群充場面。","examples":["小組報告唔好濫竽充數，每人要有貢獻。","合唱團面試要真唱，唔可以濫竽充數。"],"difficulty":2,"objectType":"drum","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["齊宣王喜歡聽三百人一齊吹竽，南郭先生唔識吹","後來湣王要逐個吹，南郭先生怕曝光就溜走","我哋做小組報告、合唱團都要有真貢獻，唔好「濫竽充數」","精髓：冇真本事，混喺人群充場面，要小心！"],"exampleNotes":["提醒：小組報告唔好，每人要有貢獻；『濫竽充數』屬貶義，指冇真本事，混喺人群充場面。","唔好學『濫竽充數』（冇真本事，混喺人群充場面），好似句中所講。"]},{"id":"037","idiom":"自相矛盾","jyutping":"zi6 soeng1 maau4 deon6","source":"《韓非子》","story":"有人同時賣矛同盾，吹噓佢嘅矛銳利無敵、盾堅固到冇嘢刺得穿。有人問：「用你嘅矛刺你嘅盾，點算？」佢即刻答唔出，攤檔都冇人信。韓非子用呢個笑話講說話前後衝突。我哋講話做事要一致，唔好「自相矛盾」，否則好難取信於人，測驗寫作都一樣。","meaning":"說話或行為前後衝突。","examples":["先話鍾意跑步又話憎運動，自相矛盾。","規矩同執行唔一致，令人覺得自相矛盾。"],"difficulty":2,"objectType":"shield","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["有人同時賣矛同盾，吹噓佢嘅矛銳利無敵、盾堅固到冇嘢刺得穿","」佢即刻答唔出，攤檔都冇人信","我哋講話做事要一致，唔好「自相矛盾」，否則好難取信於人","精髓：說話或行為前後衝突，要小心！"],"exampleNotes":["孩子易明版：呢句講先話鍾意跑步又話憎運動，成語＝說話或行為前後衝突。","場面係「規矩同執行唔一致，令人覺得」；成語說明「說話或行為前後衝突」。"]},{"id":"038","idiom":"朝三暮四","jyutping":"ziu1 saam1 mou6 sei3","source":"《莊子》","story":"《莊子》講養猴人分橡子，話「朝三暮四」，猴子唔開心；改口「朝四暮三」，猴子就開心，但其實總數一樣。故事本來講名實、喜怒被表面數字帶動。後來多用「朝三暮四」形容人反覆無常、主意不定。培養興趣要有恆心，唔好今日樣樣、聽日樣樣。","meaning":"反覆無常，或者只顧表面數字。","examples":["今日學小提琴、聽日又轉結他，興趣唔好朝三暮四。","訂咗溫書時間表就要跟，唔好朝三暮四亂改。"],"difficulty":2,"objectType":"lantern","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《莊子》講養猴人分橡子，話「朝三暮四」","故事本來講名實、喜怒被表面數字帶動","培養興趣要有恆心，唔好今日樣樣、聽日樣樣","精髓：反覆無常，或者只顧表面數字，要小心！"],"exampleNotes":["呢句勸人唔好『朝三暮四』：今日學小提琴，聽日又轉結他，興趣唔好——即反覆無常，或者只顧表面數字。","把「訂咗溫書時間表就要跟，唔好亂改」標成反面教材，成語即反覆無常，或者只顧表面數字。"]},{"id":"039","idiom":"杞人憂天","jyutping":"gei2 jan4 jau1 tin1","source":"《列子》","story":"《列子》講杞國有人成日擔心天會冧落嚟、地會崩，嚇到食唔落飯、瞓唔着覺。朋友解釋天地運行道理，先令佢安心。後人用「杞人憂天」形容為唔必要或者好唔可能發生嘅事過度擔心。適當小心好，但唔好畀空想嚇窒自己，影響日常生活同學習。","meaning":"為唔必要或好唔可能嘅事過度擔心。","examples":["擔心月球撞地球而不出門，就係杞人憂天。","小測驗都當世界末日，未免杞人憂天。"],"difficulty":2,"objectType":"cloud","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《列子》講杞國有人成日擔心天會冧落嚟、地會崩","朋友解釋天地運行道理，先令佢安心","適當小心好，但唔好畀空想嚇窒自己，影響日常生活同學習","精髓：為唔必要或好唔可能嘅事過度擔心，要小心！"],"exampleNotes":["指出「擔心月球撞地球而不出門，就係」屬『杞人憂天』——為唔必要或好唔可能嘅事過度擔心。","講緊「小測驗都當世界末日，未免」，『杞人憂天』表達為唔必要或好唔可能嘅事過度擔心。"]},{"id":"040","idiom":"紙上談兵","jyutping":"zi2 soeng6 taam4 bing1","source":"《史記》","story":"《史記》講趙括熟讀兵書，講戰略頭頭是道，但缺少實戰經驗。後來帶兵打仗大敗。父親趙奢早已擔心佢紙上談兵。成語提醒我哋：光會背理論唔夠，要透過練習同實踐先識應用。溫書做題、做實驗，都係避免「紙上談兵」嘅好方法。","meaning":"空談理論，唔識實際應用。","examples":["淨背公式唔做題，就係紙上談兵。","講好多方法從唔實行，紙上談兵冇用。"],"difficulty":2,"objectType":"book","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《史記》講趙括熟讀兵書，講戰略頭頭是道，但缺少實戰經驗","後來帶兵打仗大敗","溫書做題、做實驗，都係避免「紙上談兵」嘅好方法","精髓：空談理論，唔識實際應用，要小心！"],"exampleNotes":["指出「淨背公式唔做題，就係」屬『紙上談兵』——空談理論，唔識實際應用。","場面係「講好多方法從唔實行，冇用」；成語說明「空談理論，唔識實際應用」。"]},{"id":"041","idiom":"一鳴驚人","jyutping":"jat1 ming4 ging1 jan4","source":"《史記》","story":"楚莊王登位三年好似唔理朝政，有人用「三年唔鳴嘅鳥」比喻問佢。莊王答：「唔鳴則已，一鳴驚人。」之後改革政治，令楚國強盛。成語讚平時低調、一行動就令人驚嘆嘅表現。默默練習、厚積薄發，往往比成日自誇更有力量。","meaning":"平時低調，一行動就令人驚嘆。","examples":["少發言嘅同學比賽一鳴驚人攞冠軍。","默默練習半年，表演一鳴驚人。"],"difficulty":2,"objectType":"bell","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["楚莊王登位三年好似唔理朝政","」之後改革政治，令楚國強盛","默默練習、厚積薄發，往往比成日自誇更有力量","精髓：平時低調，一行動就令人驚嘆——要學！"],"exampleNotes":["少發言嘅同學比賽攞冠軍，就係『一鳴驚人』想教嘅態度：平時低調，一行動就令人驚嘆。","場合偏正面；『一鳴驚人』點出平時低調，一行動就令人驚嘆。"]},{"id":"042","idiom":"口是心非","jyutping":"hau2 si6 sam1 fei1","source":"相傳","story":"「口是心非」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：嘴講一套，心諗另一套。準確意思係表面同意，心裡唔係咁諗。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：答應幫忙又唔做，就係口是心非。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"表面同意，心裡唔係咁諗。","examples":["答應幫忙又唔做，就係口是心非。","交朋友要真心，唔好口是心非。"],"difficulty":2,"objectType":"mirror","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「口是心非」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係表面同意，心裡唔係咁諗","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：表面同意，心裡唔係咁諗，要小心！"],"exampleNotes":["用成語替「答應幫忙又唔做，就係」下標籤：表面同意，心裡唔係咁諗。","呢句勸人唔好『口是心非』：交朋友要真心，唔好——即表面同意，心裡唔係咁諗。"]},{"id":"043","idiom":"心驚膽戰","jyutping":"sam1 ging1 daam2 zin3","source":"相傳","story":"「心驚膽戰」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：心同膽都驚到震。準確意思係非常害怕。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：第一次登台心驚膽戰，後來就慣。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"非常害怕。","examples":["第一次登台心驚膽戰，後來就慣。","行吊橋時人人心驚膽戰。"],"difficulty":2,"objectType":"bridge","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「心驚膽戰」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係非常害怕","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：非常害怕，要小心！"],"exampleNotes":["場面係「第一次登台，後來就慣」；成語說明「非常害怕」。","『心驚膽戰』點用？睇句中「行吊橋時人人」——非常害怕。"]},{"id":"044","idiom":"提心吊膽","jyutping":"tai4 sam1 diu3 daam2","source":"相傳","story":"「提心吊膽」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：心好似吊起，好驚。準確意思係一直擔心害怕。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：等成績公布時提心吊膽。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"一直擔心害怕。","examples":["等成績公布時提心吊膽。","佢過馬路唔望，媽咪提心吊膽。"],"difficulty":2,"objectType":"bell","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「提心吊膽」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係一直擔心害怕","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：一直擔心害怕，要小心！"],"exampleNotes":["孩子易明版：呢句講等成績公布時，成語＝一直擔心害怕。","唔好淨背定義：連住「佢過馬路唔望，媽咪」先明成語指一直擔心害怕。"]},{"id":"045","idiom":"全神貫注","jyutping":"cyun4 san4 gun3 zyu3","source":"相傳","story":"「全神貫注」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：精神 :"相傳","story":"「堅持不懈」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：一直堅持，唔鬆懈。準確意思係長時間努力唔放棄。呢個成語多數用嚟讚人或者講正面情況。課堂同日常都可以用，例如：每日跑步堅持不懈，體能變好。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"長時間努力唔放棄。","examples":["每日跑步堅持不懈，體能變好。","背唐詩堅持不懈就記得。"],"difficulty":2,"objectType":"mountain","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「堅持不懈」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係長時間努力唔放棄","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：長時間努力唔放棄——要學！"],"exampleNotes":["每日跑步，體能變好，就係『堅持不懈』想教嘅態度：長時間努力唔放棄。","呢度正面用『堅持不懈』：背唐詩就記得，意思係長時間努力唔放棄。"]},{"id":"068","idiom":"視而不見","jyutping":"si6 ji4 bat1 gin3","source":"《禮記》","story":"「視而不見」係大家成日聽到嘅四字成語，來源同《禮記》有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：眼睛望住但當冇見過。準確意思係故意或習慣性忽視。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：規則貼牆上，有人視而不見。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"故意或習慣性忽視。","examples":["規則貼牆上，有人視而不見。","媽媽提示視而不見，結果遲到。"],"difficulty":2,"objectType":"mirror","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「視而不見」係大家成日聽到嘅四字成語，來源同《禮記》有關","準確意思係故意或習慣性忽視","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：故意或習慣性忽視，要小心！"],"exampleNotes":["唔好淨背定義：連住「規則貼牆上，有人」先明成語指故意或習慣性忽視。","『視而不見』點用？睇句中「媽媽提示，結果遲到」——故意或習慣性忽視。"]},{"id":"069","idiom":"聽而不聞","jyutping":"ting3 ji4 bat1 man4","source":"《禮記》","story":"「聽而不聞」係大家成日聽到嘅四字成語，來源同《禮記》有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：耳朵聽到當聽唔到。準確意思係不理會別人說話。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：提醒帶水，佢聽而不聞。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"不理會別人說話。","examples":["媽咪提醒帶水，佢戴住耳機聽而不聞。","消防演習嘅安全指示，絕對唔好聽而不聞。"],"difficulty":2,"objectType":"bell","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「聽而不聞」係大家成日聽到嘅四字成語，來源同《禮記》有關","細路初初可能淨係識讀音，其實佢有清楚畫面同道理","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：不理會別人說話，要小心！"],"exampleNotes":["場面係「媽咪提醒帶水，佢戴住耳機」；成語說明「不理會別人說話」。","把「消防演習嘅安全指示，絕對唔好」標成反面教材，成語即不理會別人說話。"]},{"id":"070","idiom":"將信將疑","jyutping":"zoeng1 seon3 zoeng1 ji4","source":"相傳","story":"「將信將疑」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：又信又疑。準確意思係半信半疑。呢個成語可以中性咁描述情況。課堂同日常都可以用，例如：神奇魔術令觀眾將信將疑。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"半信半疑。","examples":["神奇魔術令觀眾將信將疑。","同學話見到流星，我將信將疑。"],"difficulty":2,"objectType":"cloud","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「將信將疑」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係半信半疑","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：半信半疑"],"exampleNotes":["神奇魔術令觀眾入面用『將信將疑』，即半信半疑。","孩子易明版：呢句講同學話見到流星，我，成語＝半信半疑。"]},{"id":"071","idiom":"精衛填海","jyutping":"zing1 wai6 tin4 hoi2","source":"《山海經》","story":"《山海經》講炎帝個女喺東海溺水，化成精衛兵鳥，每日叼石同樹枝投落海，想填平東海，永不放棄。雖然海好大，但佢嘅意志感動後人。成語比喻意志堅定、唔怕困難。做長期目標——溫書、練琴、環保——都可以學精衛咁日日進步少少。","meaning":"比喻意志堅定，唔怕困難。","examples":["雖然成績差，小美用精衛填海精神每日溫半小時。","清潔海灘要持之以恆，好似精衛填海一樣。"],"difficulty":3,"objectType":"boat","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《山海經》講炎帝個女喺東海溺水，化成精衛兵鳥","成語比喻意志堅定、唔怕困難","做長期目標——溫書、練琴","精髓：意志堅定，唔怕困難——要學！"],"exampleNotes":["呢度正面用『精衛填海』：雖然成績差，小美用精神每日溫半小時，意思係意志堅定，唔怕困難。","值得學嘅用法：用成語讚／鼓勵「清潔海灘要持之以恆，好似一樣」（意志堅定，唔怕困難）。"]},{"id":"072","idiom":"葉公好龍","jyutping":"jip6 gung1 hou3 lung4","source":"《新序》","story":"葉公成日話好鍾意龍，屋企樑柱到處雕龍畫龍。真龍知道後來探佢，葉公嚇到面青逃跑。原來佢鍾意嘅只係假龍。成語諷刺表面鍾意、實際害怕或唔真心。話鍾意運動就要真係出門跑；話愛閱讀就要真係揭書，唔好「葉公好龍」。","meaning":"表面鍾意，實際害怕或唔真心。","examples":["話鍾意運動但其實唔肯出門，就係葉公好龍。","自稱愛動物又唔敢摸狗，有啲葉公好龍。"],"difficulty":3,"objectType":"scroll","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["葉公成日話好鍾意龍，屋企樑柱到處雕龍畫龍","原來佢鍾意嘅只係假龍","話鍾意運動就要真係出門跑；話愛閱讀就要真係揭書","精髓：表面鍾意，實際害怕或唔真心，要小心！"],"exampleNotes":["口口聲聲鍾意運動又唔出門，表面愛實際怕——葉公好龍。","自稱愛動物又唔敢摸狗，用生活趣事講「口頭愛好」。"]},{"id":"073","idiom":"杯弓蛇影","jyutping":"bui1 gung1 se4 jing2","source":"《晉書》","story":"有人去朋友家飲酒，杯裡映住牆上掛弓嘅影子，以為酒中有蛇，嚇到回家生病。後來朋友解釋係弓影，佢先釋然病好。成語講疑神疑鬼、自己嚇自己。聽到風聲就當鬼、睇錯題目就驚到瞓唔着，都可能係「杯弓蛇影」，要查清楚再判斷。","meaning":"疑神疑鬼，自己嚇自己。","examples":["聽到風聲就以為有鬼，真係杯弓蛇影。","測驗聽錯題目就驚到瞓唔着，有少少杯弓蛇影。"],"difficulty":3,"objectType":"mirror","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["有人去朋友家飲酒，杯裡映住牆上掛弓嘅影子，以為酒中有蛇","後來朋友解釋係弓影，佢先釋然病好","聽到風聲就當鬼、睇錯題目就驚到瞓唔着","精髓：疑神疑鬼，自己嚇自己，要小心！"],"exampleNotes":["『杯弓蛇影』幫你一眼睇明場面（聽到風聲就以為有鬼，真係）：疑神疑鬼，自己嚇自己。","孩子易明版：呢句講測驗聽錯題目就驚到瞓唔着，有少少，成語＝疑神疑鬼，自己嚇自己。"]},{"id":"074","idiom":"買櫝還珠","jyutping":"maai5 duk6 waan4 zyu1","source":"《韓非子》","story":"《韓非子》講楚人賣珍珠，用香木雕花盒子裝得靚到不得了。鄭人付錢後只要木盒，把珍珠退返畀賣家。盒子本來只係包裝，珍珠先係重點。成語諷刺唔識分輕重、取捨錯誤。我哋揀書、揀工具要睇實用同內容，唔好只被漂亮包裝吸引而「買櫝還珠」。","meaning":"唔識分輕重，取捨錯誤。","examples":["淨係睇封面唔睇內容，好似買櫝還珠。","選書包淨睇貼紙多唔理實用，有啲買櫝還珠。"],"difficulty":3,"objectType":"box","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《韓非子》講楚人賣珍珠，用香木雕花盒子裝得靚到不得了","盒子本來只係包裝，珍珠先係重點","我哋揀書、揀工具要睇實用同內容","記住：唔識分輕重，取捨錯誤——唔好學！"],"exampleNotes":["用成語替「淨係睇封面唔睇內容，好似」下標籤：唔識分輕重，取捨錯誤。","唔好淨背定義：連住「選書包淨睇貼紙多唔理實用，有啲」先明成語指唔識分輕重，取捨錯誤。"]},{"id":"075","idiom":"邯鄲學步","jyutping":"hon4 daan1 hok6 bou6","source":"《莊子》","story":"《莊子》講燕國人去趙國邯鄲學當地人優美步姿，結果新步未學好，自己本來行路方法又唔記得，唯有爬返屋企。成語提醒：可以學習別人優點，但唔好盲目模仿到丢掉自己。寫字、打球、做人，都要喺吸收長處同時保持自己風格。","meaning":"盲目模仿別人，連自己原有嘅都唔記得。","examples":["寫字唔好邯鄲學步，學人字體連自己都寫亂。","打球要吸收優點，但唔好邯鄲學步丢掉自己風格。"],"difficulty":3,"objectType":"bridge","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《莊子》講燕國人去趙國邯鄲學當地人優美步姿","成語提醒：可以學習別人優點，但唔好盲目模仿到丢掉自己","寫字、打球、做人，都要喺吸收長處同時保持自己風格","精髓：盲目模仿別人，連自己原有嘅都唔記得，要小心！"],"exampleNotes":["呢句勸人唔好『邯鄲學步』：寫字唔好，學人字體連自己都寫亂——即盲目模仿別人，連自己原有嘅都唔記得。","把「打球要吸收優點，但唔好丢掉自己風格」標成反面教材，成語即盲目模仿別人，連自己原有嘅都唔記得。"]},{"id":"076","idiom":"塞翁失馬","jyutping":"coi3 jung1 sat1 maa5","source":"《淮南子》","story":"《淮南子》講邊塞老人嘅馬走失，鄰居安慰；後來馬帶住好馬返嚟，大家祝賀。兒子騎新馬跌傷腳，大家又安慰；結果傷腳反而令佢避過征兵。禍福互相轉化，唔好太早下結論。呢個智慧故事叫「塞翁失馬，焉知非福」，教我哋遇挫折時保持平常心。","meaning":"壞事可能變成好事，唔好太早下結論。","examples":["比賽落選好似塞翁失馬，結果有更多時間溫書。","淋濕校服先發現帶備換衫，真係塞翁失馬。"],"difficulty":3,"objectType":"horse","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《淮南子》講邊塞老人嘅馬走 "sentence"],"storyBeats":["《史記》講秦國想用城換趙國和氏璧","成語「完璧歸趙」後嚟泛指把原物完好無缺交返主人","借書、借文具，用完記得完好交還，就係生活裡嘅完璧歸趙","精髓：把原物完好無缺交返畀主人——要學！"],"exampleNotes":["借嚟嘅圖書要，唔好摺角，就係『完璧歸趙』想教嘅態度：把原物完好無缺交返畀主人。","呢度正面用『完璧歸趙』：借用同學顏色筆，用完記得，意思係把原物完好無缺交返畀主人。"]},{"id":"080","idiom":"負荊請罪","jyutping":"fu6 ging1 cing2 zeoi6","source":"《史記》","story":"《史記》講廉頗妒忌藺相如位高，揚言要羞辱佢；後來明白藺相如係為咗國家先忍讓，就背住荊條登門謝罪。藺相如原諒佢，兩人成為好友。成語讚真誠認錯。同朋友嘈完，勇敢講「對唔住」並改正，就係「負荊請罪」嘅精神。","meaning":"真誠認錯請求原諒。","examples":["同朋友嘈完之後，小明負荊請罪講對唔住。","撞倒同學要負荊請罪，唔好走避。"],"difficulty":3,"objectType":"sword","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《史記》講廉頗妒忌藺相如位高","藺相如原諒佢，兩人成為好友","同朋友嘈完，勇敢講「對唔住」並改正","精髓：真誠認錯請求原諒——要學！"],"exampleNotes":["呢度正面用『負荊請罪』：同朋友嘈完之後，小明講對唔住，意思係真誠認錯請求原諒。","結合句子「撞倒同學要，唔好走避」理解『負荊請罪』＝真誠認錯請求原諒。"]},{"id":"081","idiom":"破釜沉舟","jyutping":"po3 fu2 cam4 zau1","source":"《史記》","story":"《史記》講項羽帶兵渡河攻秦，過河後砸破飯鍋、鑿沉船隻，令士兵冇退路，唯有奮戰，結果大勝。成語比喻下定決心、唔留退路去做一件事。用喺學習上，可以係限定時間專心攻克難關；但記住要量力而為，決心之外仲要有計劃。","meaning":"下定決心，唔留退路去做一件事。","examples":["考試前一個月破釜沉舟，每日專心溫書。","為咗學會游水，暑假破釜沉舟每日練。"],"difficulty":3,"objectType":"boat","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《史記》講項羽帶兵渡河攻秦，過河後砸破飯鍋、鑿沉船隻","成語比喻下定決心、唔留退路去做一件事","用喺學習上，可以係限定時間專心攻克難關；但記住要量力而為…","精髓：下定決心，唔留退路去做一件事——要學！"],"exampleNotes":["值得學嘅用法：用成語讚／鼓勵「考試前一個月，每日專心溫書」（下定決心，唔留退路去做一件事）。","為咗學會游水，暑假每日練，就係『破釜沉舟』想教嘅態度：下定決心，唔留退路去做一件事。"]},{"id":"082","idiom":"指鹿為馬","jyutping":"zi2 luk6 wai4 maa5","source":"《史記》","story":"《史記》講趙高想試群臣怕唔怕佢，呈上一隻鹿卻硬講係馬。有人附和，有人講真話；趙高之後就對付講真話嘅人。成語指故意顛倒黑白、混淆是非。我哋要勇於講事實，唔好跟風指鹿為馬，亦唔好被人嚇到不敢講真話。後人傳誦「指鹿為馬」，就係想我哋記住呢個道理：故意顛倒黑白，混淆是非。","meaning":"故意顛倒黑白，混淆是非。","examples":["明明抄襲仲話係原創，等於指鹿為馬。","裁判唔可以指鹿為馬，球出界就要講出界。"],"difficulty":3,"objectType":"horse","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["《史記》講趙高想試群臣怕唔怕佢，呈上一隻鹿卻硬講係馬","有人附和，有人講真話；趙高之後就對付講真話嘅人","我哋要勇於講事實，唔好跟風指鹿為馬","精髓：故意顛倒黑白，混淆是非，要小心！"],"exampleNotes":["指出「明明抄襲仲話係原創，等於」屬『指鹿為馬』——故意顛倒黑白，混淆是非。","呢句勸人唔好『指鹿為馬』：裁判唔可以，球出界就要講出界——即故意顛倒黑白，混淆是非。"]},{"id":"083","idiom":"毛遂自薦","jyutping":"mou4 seoi6 zi6 zin3","source":"《史記》","story":"平原君要揀門客出使楚國，名額未滿。毛遂站出嚟自我推薦，眾人半信半疑。去到楚國，毛遂憑膽識促成協議，立下大功。成語鼓勵有能力時主動承擔。班會缺幹事、活動缺幫手，你有把握就可以「毛遂自薦」，同時要用成績證明自己。","meaning":"主動自我推薦去承擔責任。","examples":["班會選舉，小芬毛遂自薦做文藝幹事。","義工缺人，哥哥毛遂自薦幫手派傳單。"],"difficulty":3,"objectType":"scroll","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["平原君要揀門客出使楚國，名額未滿","去到楚國，毛遂憑膽識促成協議，立下大功","班會缺幹事、活動缺幫手，你有把握就可以「毛遂自薦」","精髓：主動自我推薦去承擔責任——要學！"],"exampleNotes":["場合偏正面；『毛遂自薦』點出主動自我推薦去承擔責任。","值得學嘅用法：用成語讚／鼓勵「義工缺人，哥哥幫手派傳單」（主動自我推薦去承擔責任）。"]},{"id":"084","idiom":"畫龍點睛","jyutping":"waak6 lung4 dim2 zing1","source":"《歷代名畫記》","story":"相傳畫師張僧繇喺寺廟壁上畫龍，故意唔點眼睛；有人央求佢點睛，一點完，龍就破壁飛走。後人用「畫龍點睛」講關鍵一筆、一句令整幅作品突然生動出色。寫作文加一句點題金句、畫圖加重點細節，都可以係你嘅「點睛」之筆，令全篇更有神。","meaning":"加關鍵一句令整體生動出色。","examples":["作文最後金句畫龍點睛。","海報標題畫龍點睛，主題即刻出。"],"difficulty":3,"objectType":"scroll","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["相傳畫師張僧繇喺寺廟壁上畫龍","後人用「畫龍點睛」講關鍵一筆、一句令整幅作品突然生動出色","寫作文加一句點題金句、畫圖加重點細節","精髓：加關鍵一句令整體生動出色——要學！"],"exampleNotes":["值得學嘅用法：用成語讚／鼓勵「作文最後金句」（加關鍵一句令整體生動出色）。","「海報標題，主題即刻出」正合『畫龍點睛』——加關鍵一句令整體生動出色。"]},{"id":"085","idiom":"點石成金","jyutping":"dim2 sek6 sing4 gam1","source":"相傳","story":"關於「點石成金」，古人流傳咗咁樣嘅講法：相傳神仙手指一點，石頭變成黃金。出處同相傳有關。後來大家用呢四個字，意思係略加改動就令作品出色。呢個成語多數用嚟讚人或者講正面情況。小朋友可以想像故事畫面，再對照例句——好似「老師改一句，文章好似點石成金。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"略加改動就令作品出色。","examples":["老師改一句，文章好似點石成金。","舊物改造點石成金，變靚裝飾。"],"difficulty":3,"objectType":"stone","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「點石成金」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係略加改動就令作品出色","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：略加改動就令作品出色——要學！"],"exampleNotes":["「老師改一句，文章好似」正合『點石成金』——略加改動就令作品出色。","場合偏正面；『點石成金』點出略加改動就令作品出色。"]},{"id":"086","idiom":"班門弄斧","jyutping":"baan1 mun4 lung6 fu2","source":"相傳","story" y":4,"objectType":"house","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["越王勾踐被吳國打敗之後，睡喺柴草上、天天嘗苦膽","後世寫作「臥薪嘗膽」，比喻刻苦自勵、立志圖強","後人傳誦呢個成語，就係想我哋記住：刻苦自勵，立志圖強","精髓：刻苦自勵，立志圖強——要學！"],"exampleNotes":["場合偏正面；『臥薪嘗膽』點出刻苦自勵，立志圖強。","值得學嘅用法：用成語讚／鼓勵「用精神補底，成績慢慢追返」（刻苦自勵，立志圖強）。"]},{"id":"096","idiom":"四面楚歌","jyutping":"sei3 min6 co2 go1","source":"《史記》","story":"關於「四面楚歌」，古人流傳咗咁樣嘅講法：項羽軍隊被圍，夜晚聽到四周都係楚地歌聲，以為楚地全失，軍心動搖。出處同《史記》有關。後來大家用呢四個字，意思係四面受敵，處境孤立。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「意見冇人支持，討論時好似四面楚歌。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"四面受敵，處境孤立。","examples":["討論時個個反對佢，意見冇人撐，好似四面楚歌。","比賽連輸三場，隊友又受傷，教練覺得四面楚歌。"],"difficulty":4,"objectType":"drum","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「四面楚歌」，古人流傳咗咁樣嘅講法：項羽軍隊被圍","後來大家用呢四個字，意思係四面受敵，處境孤立","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：四面受敵，處境孤立，要小心！"],"exampleNotes":["說話者話呢就係『四面楚歌』：四面受敵，處境孤立。","講緊「比賽連輸三場，隊友又受傷，教練覺得」，『四面楚歌』表達四面受敵，處境孤立。"]},{"id":"097","idiom":"一諾千金","jyutping":"jat1 nok6 cin1 gam1","source":"《史記》","story":"關於「一諾千金」，古人流傳咗咁樣嘅講法：季布講出承諾就好似值千金咁可靠，人人信服。出處同《史記》有關。後來大家用呢四個字，意思係承諾一定守信，好有信用。呢個成語多數用嚟讚人或者講正面情況。小朋友可以想像故事畫面，再對照例句——好似「答應幫手就要一諾千金，唔好反口。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"承諾一定守信，好有信用。","examples":["答應幫手就要一諾千金，唔好反口。","借物還期要一諾千金，準時交還。"],"difficulty":3,"objectType":"scroll","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「一諾千金」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係承諾一定守信，好有信用","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：承諾一定守信，好有信用——要學！"],"exampleNotes":["答應幫手就要，唔好反口，就係『一諾千金』想教嘅態度：承諾一定守信，好有信用。","呢度正面用『一諾千金』：借物還期要，準時交還，意思係承諾一定守信，好有信用。"]},{"id":"098","idiom":"價值連城","jyutping":"gaa3 zik6 lin4 sing4","source":"《史記》","story":"「價值連城」係大家成日聽到嘅四字成語，來源同《史記》有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：和氏璧價值可以換連串城池。準確意思係非常珍貴值錢。呢個成語多數用嚟讚人或者講正面情況。課堂同日常都可以用，例如：呢幅祖傳書法價值連城，要小心保存。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"非常珍貴值錢。","examples":["呢幅祖傳書法價值連城，要小心保存。","誠實品格比珠寶更價值連城。"],"difficulty":3,"objectType":"box","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「價值連城」係大家成日聽到嘅四字成語，來源同《史記》有關","準確意思係非常珍貴值錢","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：非常珍貴值錢——要學！"],"exampleNotes":["祖傳書法要小心保存，『價值連城』指文物極珍貴。","把誠實品格比珠寶更『價值連城』，引申貴重唔單指錢。"]},{"id":"099","idiom":"兩敗俱傷","jyutping":"loeng5 baai6 keoi1 soeng1","source":"《戰國策》","story":"關於「兩敗俱傷」，古人流傳咗咁樣嘅講法：雙方相爭，最後兩邊都受傷失敗。出處同《戰國策》有關。後來大家用呢四個字，意思係爭執結果兩邊都損失。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「惡性競爭令兩間店兩敗俱傷。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"爭執結果兩邊都損失。","examples":["惡性競爭令兩間店兩敗俱傷。","同學打斗兩敗俱傷，不如傾計。"],"difficulty":3,"objectType":"sword","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「兩敗俱傷」，古人流傳咗咁樣嘅講法：雙方相爭","後來大家用呢四個字，意思係爭執結果兩邊都損失","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：爭執結果兩邊都損失，要小心！"],"exampleNotes":["惡性競爭令兩間店入面用『兩敗俱傷』，即爭執結果兩邊都損失。","同學打斗，不如傾計入面用『兩敗俱傷』，即爭執結果兩邊都損失。"]},{"id":"100","idiom":"三顧茅廬","jyutping":"saam1 gu3 maau4 lou4","source":"《三國志》","story":"三國時劉備想請諸葛亮出山幫忙，一連三次去到隆中茅屋拜訪。第三次諸葛亮先見佢，被誠意打動，答應出山。成語「三顧茅廬」形容誠心多次邀請有才能嘅人。請教別人、邀請幫手，都要有耐性同尊重，唔好一次唔得就放棄。","meaning":"誠心多次邀請有才能嘅人。","examples":["校長三顧茅廬請退休老師返嚟指導合唱團。","請教練要有三顧茅廬嘅誠意。"],"difficulty":4,"objectType":"house","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["三國時劉備想請諸葛亮出山幫忙，一連三次去到隆中茅屋拜訪","第三次諸葛亮先見佢，被誠意打動，答應出山","請教別人、邀請幫手，都要有耐性同尊重，唔好一次唔得就放棄","精髓：誠心多次邀請有才能嘅人——要學！"],"exampleNotes":["校長再三誠心請退休老師返嚟指導，就係『三顧茅廬』。","請教練都要有再三誠意；成語讚「真心多次邀請人才」。"]},{"id":"101","idiom":"草木皆兵","jyutping":"cou2 muk6 gaai1 bing1","source":"《晉書》","story":"關於「草木皆兵」，古人流傳咗咁樣嘅講法：淝水之戰，前秦軍隊見到八公山草木都以為係敵兵，嚇到好驚。出處同《晉書》有關。後來大家用呢四個字，意思係緊張到風吹草動都當敵人。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「聽到怪聲就草木皆兵，其實係冷氣聲。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"緊張到風吹草動都當敵人。","examples":["聽到怪聲就草木皆兵，其實係冷氣聲。","考前草木皆兵，見到老師都驚。"],"difficulty":4,"objectType":"tree","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「草木皆兵」，古人流傳咗咁樣嘅講法：淝水之戰","後來大家用呢四個字，意思係緊張到風吹草動都當敵人","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：緊張到風吹草動都當敵人，要小心！"],"exampleNotes":["場面係「聽到怪聲就，其實係冷氣聲」；成語說明「緊張到風吹草動都當敵人」。","捉住用法：描寫／評論「考前，見到老師都驚」時用『草木皆兵』（緊張到風吹草動都當敵人）。"]},{"id":"102","idiom":"風聲鶴唳","jyutping":"fung1 sing1 hok6 leoi6","source":"《晉書》","story":"關於「風聲鶴唳」，古人流傳咗咁樣嘅講法：戰敗士兵聽到風聲同鶴叫都以為敵軍嚟追。出處同《晉書》有關。後來大家用呢四個字，意思係驚慌疑懼，一有風吹草動就驚。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「輸波之後風聲鶴唳，哨子一響就緊張。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"驚慌疑懼，一有風吹草動就驚。","examples":["輸波之後風聲鶴唳，哨子一響就緊張。","講鬼故後風聲鶴唳，不敢獨自走廊。"],"difficulty":4,"objectType":"cloud","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「風聲鶴唳」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係驚慌疑懼，一有風吹草動就驚","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：驚慌疑懼，一有風吹草動就驚，要小心！"],"exampleNotes":["『風聲鶴唳』點用？睇句中「輸波之後，哨子一響就緊張」——驚慌疑懼，一有風吹草動就驚。","唔好淨背定義：連住「講鬼故後，不敢獨自走廊」先明成語指驚慌疑懼，一有風吹草動就驚。"]},{"id":"103","idiom":"投鼠忌器","jyutping":"tau4 syu2 gei6 hei3","source":"《漢書》","story":"「投鼠忌器」係大家成日聽到嘅四字成語，來源同《漢書》有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：想打老鼠又怕打爛旁邊嘅器物。準確意思係想懲罰壞人又怕連累無辜。呢個成語可以中性咁描述情況。課堂同日常都可以用，例如：批評朋友要小心，唔好投鼠忌器唔敢講。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"想懲罰壞人又怕連累無辜。","examples":["想指出朋友錯處，又怕傷和氣，一時投鼠忌器。","處理糾紛要小心投鼠忌器，唔好連累無辜同學。"],"difficulty":4,"objectType":"box","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「投鼠忌器」係大家成日聽到嘅四字成語，來源同《漢書》有關","準確意思係想懲罰壞人又怕連累無辜","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：想懲罰壞人又怕連累無辜"],"exampleNotes":["引申場合可見——「想指出朋友錯處，又怕傷和氣，一時」用『投鼠忌器』概括為想懲罰壞人又怕連累無辜。","唔好淨背定義：連住「處理糾紛要小心，唔好連累無辜同學」先明成語指想懲罰壞人又怕連累無辜。"]},{"id":"104","idiom":"囫圇吞棗","jyutping":"wat6 leon4 tan1 zou2","source":"相傳","story":"「囫圇吞棗」係大家成日聽到嘅四字成語，來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：把棗連核一口吞落，唔慢慢咬。準確意思係學習唔求甚解，死記硬背。呢個成語多數帶批評或者提醒人唔好咁做。課堂同日常都可以用，例如：讀課文囫圇吞棗，默書就錯晒。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"學習唔求甚解，死記硬背。","examples":["讀課文囫圇吞棗，默書就錯晒。","睇說明書唔好囫圇吞棗，要逐句明。"],"difficulty":3,"objectType":"box","polarity 來源同相傳有關。細路初初可能淨係識讀音，其實佢有清楚畫面同道理：品德同學業都優秀。準確意思係品行成績都好。呢個成語多數用嚟讚人或者講正面情況。課堂同日常都可以用，例如：獎學金頒畀品學兼優同學。把誰、喺邊、發生咩事、結果點樣喺腦入面播一次，成語就會變成你自己嘅語言工具，唔再係死記硬背嘅符號。","meaning":"品行成績都好。","examples":["獎學金頒畀品學兼優嘅同學，鼓勵德智並進。","目標係做個品學兼優嘅小學生，成績品行一齊顧。"],"difficulty":2,"objectType":"book","polarity":"褒","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["「品學兼優」係大家成日聽到嘅四字成語，來源同相傳有關","準確意思係品行成績都好","把誰、喺邊、發生咩事、結果點樣喺腦入面播一次","精髓：品行成績都好——要學！"],"exampleNotes":["值得學嘅用法：用成語讚／鼓勵「獎學金頒畀嘅同學，鼓勵德智並進」（品行成績都好）。","「目標係做個嘅小學生，成績品行一齊顧」正合『品學兼優』——品行成績都好。"]},{"id":"212","idiom":"畫餅充飢","jyutping":"waak6 beng2 cung1 gei1","source":"《三國志》","story":"關於「畫餅充飢」，古人流傳咗咁樣嘅講法：魏人盧毓話選舉唔可以只靠虛名，好似畫餅唔可以真正充飢。出處同《三國志》有關。後來大家用呢四個字，意思係用空想安慰自己，解決唔到實際問題。呢個成語多數帶批評或者提醒人唔好咁做。小朋友可以想像故事畫面，再對照例句——好似「淨係幻想考滿分唔溫書，畫餅充飢。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"用空想安慰自己，解決唔到實際問題。","examples":["淨係幻想考滿分唔溫書，畫餅充飢。","計劃要可行，唔好畫餅充飢。"],"difficulty":3,"objectType":"scroll","polarity":"貶","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「畫餅充飢」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係用空想安慰自己","學成語唔係死背，而係連故事、意思同用法一齊記","記住：用空想安慰自己，解決唔到實際問題——唔好學！"],"exampleNotes":["『畫餅充飢』點用？睇句中「淨係幻想考滿分唔溫書」——用空想安慰自己，解決唔到實際問題。","唔好學『畫餅充飢』（用空想安慰自己，解決唔到實際問題），好似句中所講。"]},{"id":"213","idiom":"望梅止渴","jyutping":"mong6 mui4 zi2 hot3","source":"《世說新語》","story":"關於「望梅止渴」，古人流傳咗咁樣嘅講法：曹操行軍士兵口渴，佢話前面有梅林，士兵想像梅酸就生津，暫時解渴。出處同《世說新語》有關。後來大家用呢四個字，意思係用空想安慰，暫時緩解慾望。呢個成語可以中性咁描述情況。小朋友可以想像故事畫面，再對照例句——好似「考試前望梅止渴咁幻想成績無用，要實幹。」——就會明點樣用得自然。學成語唔係死背，而係連故事、意思同用法一齊記。","meaning":"用空想安慰，暫時緩解慾望。","examples":["考試前望梅止渴咁幻想成績無用，要實幹。","可以有夢想，但唔好淨係望梅止渴，要實際行動。"],"difficulty":3,"objectType":"tree","polarity":"中","skills":["literal","polarity","context","near","grammar","error","sentence"],"storyBeats":["關於「望梅止渴」，古人流傳咗咁樣嘅講法","後來大家用呢四個字，意思係用空想安慰，暫時緩解慾望","學成語唔係死背，而係連故事、意思同用法一齊記","精髓：用空想安慰，暫時緩解慾望"],"exampleNotes":["淨幻想成績卻唔實幹，『望梅止渴』講空想安慰冇用。","可以有夢想，但要配合行動；成語提醒唔好停留幻想。"]},{"id":"214","idiom":"掩人耳目","jyutping":"jim2 jan4 ji5 muk6","source":"相傳","story":"「掩人 const Voice = (() => {
  const state = {
    autoPlay: true,
    rate: 1.05,
    pitchRoles: true,
    unlocked: false,
    paused: false,
    queue: [],
    speaking: false,
    currentUtter: null,
    pauseCharIndex: 0,
    pauseText: '',
    pauseMeta: null,
    stageId: 0,
    tipShown: false,
    preferred: null,
  };
  function voices() {
    try { return speechSynthesis.getVoices() || []; } catch(e){ return []; }
  }
  function pickVoice() {
    const vs = voices();
    if (!vs.length) return null;
    const hk = vs.find(v => /zh[-_]HK|yue|cantonese/i.test(v.lang+v.name));
    if (hk) { state.preferred = 'zh-HK'; return hk; }
    const tw = vs.find(v => /zh[-_]TW/i.test(v.lang));
    if (tw) { state.preferred = 'zh-TW'; return tw; }
    const cn = vs.find(v => /zh[-_]CN|zh[-_]Hans/i.test(v.lang));
    if (cn) { state.preferred = 'zh-CN'; return cn; }
    const any = vs.find(v => /^zh/i.test(v.lang));
    if (any) { state.preferred = any.lang; return any; }
    state.preferred = null; return null;
  }
  function tipIfNeeded() {
    if (state.tipShown) return;
    const v = pickVoice();
    if (!v || state.preferred !== 'zh-HK') {
      state.tipShown = true;
      if (typeof showToast === 'function')
        showToast('呢部裝置未必有廣東話語音，會用其他中文聲。可喺設定再試。');
    }
  }
  function unlock() {
    if (state.unlocked) return;
    state.unlocked = true;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; speechSynthesis.speak(u); speechSynthesis.cancel();
    } catch(e){}
    tipIfNeeded();
  }
  function cut() {
    state.queue = [];
    state.speaking = false;
    state.paused = false;
    state.pauseText = '';
    state.currentUtter = null;
    try { speechSynthesis.cancel(); } catch(e){}
    updatePauseBtn();
  }
  function stageCut() {
    state.stageId++;
    cut();
  }
  function enqueue(text, meta = {}) {
    if (!text || !String(text).trim()) return;
    unlock();
    state.queue.push({ text: String(text).trim(), meta, stage: state.stageId });
    if (!state.speaking && !state.paused) pump();
    updatePauseBtn();
  }
  function speakNow(text, meta = {}) {
    cut();
    enqueue(text, meta);
  }
  function queueAfterTeacher(text, meta = {}) {
    if (!text) return;
    unlock();
    state.queue.push({ text: String(text).trim(), meta: { ...meta, kind: 'object' }, stage: state.stageId });
    if (!state.speaking && !state.paused) pump();
    updatePauseBtn();
  }
  function pump() {
    if (state.paused || state.speaking) return;
    while (state.queue.length && state.queue[0].stage !== state.stageId) state.queue.shift();
    const job = state.queue.shift();
    if (!job) { updatePauseBtn(); return; }
    const u = new SpeechSynthesisUtterance(job.text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'zh-HK';
    u.rate = state.rate;
    let pitch = 1;
    if (state.pitchRoles && job.meta.role === 'girl') pitch = 1.15;
    if (state.pitchRoles && job.meta.role === 'boy') pitch = 0.95;
    if (state.pitchRoles && job.meta.role === 'teacher') pitch = 1.05;
    u.pitch = pitch;
    state.speaking = true;
    state.currentUtter = u;
    state.pauseText = job.text;
    state.pauseMeta = job.meta;
    state.pauseCharIndex = 0;
    const fireProgress = (p) => {
      const pp = Math.max(0, Math.min(1, p));
      try {
        if (typeof state.onProgress === 'function') state.onProgress(pp, job.meta || {});
      } catch (e) {}
    };
    u.onboundary = (ev) => {
      if (typeof ev.charIndex === 'number') {
        state.pauseCharIndex = ev.charIndex;
        const len = Math.max(1, (job.text || '').length);
        fireProgress(ev.charIndex / len);
      }
    };
    const fireStart = () => {
      try {
        if (job.meta && typeof job.meta.onStart === 'function') job.meta.onStart(job.meta);
        if (typeof state.onJobStart === 'function') state.onJobStart(job.meta || {});
      } catch (e) {}
      fireProgress(0);
    };
    u.onstart = fireStart;
    u.onend = () => {
      state.speaking = false;
      state.currentUtter = null;
      fireProgress(1);
      try {
        if (job.meta && typeof job.meta.onEnd === 'function') job.meta.onEnd(job.meta);
      } catch (e) {}
      updatePauseBtn();
      pump();
    };
    u.onerror = () => {
      state.speaking = false;
      state.currentUtter = null;
      updatePauseBtn();
      pump();
    };
    fireStart(); // sync scene before audio (engines often delay/skip onstart)
    try { speechSynthesis.speak(u); } catch(e){ state.speaking = false; }
    updatePauseBtn();
  }
  function pause() {
    if (!state.speaking && !state.queue.length) return;
    state.paused = true;
    try { speechSynthesis.cancel(); } catch(e){}
    state.speaking = false;
    if (state.pauseText && state.pauseCharIndex > 0) {
      const rest = state.pauseText.slice(state.pauseCharIndex);
      if (rest) state.queue.unshift({ text: rest, meta: state.pauseMeta || {}, stage: state.stageId });
    } else if (state.pauseText) {
      state.queue.unshift({ text: state.pauseText, meta: state.pauseMeta || {}, stage: state.stageId });
    }
    updatePauseBtn();
  }
  function resume() {
    if (!state.paused) return;
    state.paused = false;
    pump();
    updatePauseBtn();
  }
  function togglePause() {
    if (state.paused) resume(); else pause();
  }
  function updatePauseBtn() {
    const btn = document.getElementById('pauseBtn');
    if (!btn) return;
    const live = state.speaking || state.queue.length || state.paused;
    btn.classList.toggle('live', !!live);
    btn.textContent = state.paused ? '▶️' : '⏸';
    btn.title = state.paused ? '繼續朗讀' : '暫停朗讀';
    btn.style.opacity = live ? '1' : '0.35';
  }
  const OPT_LABELS = ['A','B','C','D','E'];
  function speakOptions(options) {
    // options: plain text without letter prefix
    const parts = options.map((t,i) => {
      const lab = OPT_LABELS[i] || String(i+1);
      const clean = String(t).replace(/^[A-E][.、．]\s*/, '');
      return `${lab}……${clean}`;
    });
    speakNow(parts.join('、'), { role: 'teacher' });
  }
  function speakQuestion(prompt, options) {
    // Full question + A/B/C options for quiz / drill
    const cleanOpts = (options || []).map(t => String(t).replace(/^[A-E][.、．]\s*/, ''));
    let text = String(prompt || '').trim();
    if (cleanOpts.length) {
      text += '。' + cleanOpts.map((t,i) => `${OPT_LABELS[i] || (i+1)}……${t}`).join('、');
    }
    speakNow(text, { role: 'teacher' });
  }
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.onvoiceschanged = () => pickVoice();
  }
  return {
    state, unlock, cut, stageCut, enqueue, speakNow, queueAfterTeacher,
    pause, resume, togglePause, speakOptions, speakQuestion, pickVoice, tipIfNeeded, updatePauseBtn
  };
})();

/** iOS / autoplay: unlock on gesture; only auto-start screenSpeech on the *first* unlock. Never restart narration on later clicks (e.g. 3D objects). */
function onUserGestureForVoice(ev) {
  const wasLocked = !Voice.state.unlocked;
  Voice.unlock();
  if (!state.settings.autoPlay) return;
  if (Voice.state.paused) { Voice.resume(); return; }
  // Already unlocked earlier — do not speakNow / restart from background 3D clicks
  if (!wasLocked) return;
  const text = state.screenSpeech;
  if (!text) return;
  if (!Voice.state.speaking && !(Voice.state.queue && Voice.state.queue.length)) {
    Voice.speakNow(text, { role: state.screenSpeechRole || 'teacher' });
  }
}
function wireVoiceGestures() {
  if (wireVoiceGestures._done) return;
  wireVoiceGestures._done = true;
  const opts = { capture: true, passive: true };
  document.addEventListener('pointerdown', onUserGestureForVoice, opts);
  document.addEventListener('touchstart', onUserGestureForVoice, opts);
  document.addEventListener('click', onUserGestureForVoice, opts);
}

        <div class="idiom-card-jp">${jp}</div>
        <div class="idiom-card-go">撳入去 →</div>
      </button>`;
    }).join('')}</div></div>`;
    list.querySelectorAll('.idiom-card').forEach(card => {
      card.onclick = () => {
        const idiom = IDIOMS.find(x => x.id === card.dataset.id);
        if (idiom) openIdiomGate(idiom);
      };
    });
  }
  document.querySelectorAll('#catTabs .tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('#catTabs .tab').forEach(x=>x.classList.remove('on'));

  });
  fill(chapters[0].d);
  autoSpeak(celebrate ? '太叻啦！全部成語都學晒，返目錄再温習啦。' : '呢度係成語目錄，撳一張卡就入去啦。','teacher');

function openIdiomGate(idiom) {
  Voice.stageCut();
  const st = starsFor(idiom.id);
  const html = `<h2>${idiom.idiom} ${speakBtn(idiomSpeakText(idiom))}</h2>
    <p><small>${idiomMetaLine(idiom)}</small></p>
    <p class="stars" style="font-size:1.4rem">${'★'.repeat(st)}${'☆'.repeat(3-st)}</p>
    <p>${idiom.meaning.slice(0, 48)}${idiom.meaning.length>48?'…':''}</p>
    <div class="btn-row idiom-gate-actions">
      <button type="button" class="btn" id="gateLearn">開始學習</button>
      <button type="button" class="btn secondary" id="gatePrac">練習</button>
      <button type="button" class="btn ghost" id="gateBack">返回目錄</button>
    </div>`;
  openPanel(html, { mode: 'lesson' });
  document.getElementById('gateLearn').onclick = () => startLesson(idiom);
  document.getElementById('gatePrac').onclick = () => startPractice(idiom);
  document.getElementById('gateBack').onclick = () => openCatalog();
  autoSpeak(`${idiomSpeakText(idiom)}。你可以開始學習，或者先做練習。`, 'teacher');
}

function startLesson(idiom) {
  Voice.stageCut();
  state.lesson = idiom; state.lessonStep = 0;
  state.lessonStars = { story:false, meaning:false, practice:false };
  state.skillBack = null;
  const p = document.getElementById('panel');
  p.classList.add('hidden');
  p.classList.remove('catalog-mode');
  state.twoD = [];
  showLessonStep();
}

function lessonStarCount() {
  const ls = state.lessonStars || {};
  let n = 0;
  if (ls.story) n++;
  if (ls.meaning) n++;
  if (ls.practice) n++;
  return n;
}
function lessonStarsHeader() {
  const n = lessonStarCount();
  return `<div class="lesson-stars-sticky"><span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>
    <small>聽完故事 · 明意思 · 答啱練習 → 三粒星</small></div>`;
}
function findNextUnlearned(current) {
  if (!current) return IDIOMS.find(x => starsFor(x.id) < 3) || null;
  const same = IDIOMS.filter(x => x.difficulty === current.difficulty);
  const idx = same.findIndex(x => x.id === current.id);
  for (let i = idx + 1; i < same.length; i++) {
    if (starsFor(same[i].id) < 3) return same[i];
  }
  for (let d = current.difficulty + 1; d <= 5; d++) {
    const hit = IDIOMS.find(x => x.difficulty === d && starsFor(x.id) < 3);
    if (hit) return hit;
  }
  for (let d = 1; d < current.difficulty; d++) {
    const hit = IDIOMS.find(x => x.difficulty === d && starsFor(x.id) < 3);
    if (hit) return hit;
  }
  // same chapter wrap (other unlearned before current)
  for (let i = 0; i < idx; i++) {
    if (starsFor(same[i].id) < 3) return same[i];
  }
  return null;
}

function closeLessonToCatalog() {
  Voice.stageCut();
  if (Town3D.clearIdiomExhibit) Town3D.clearIdiomExhibit();
  document.getElementById('panel').classList.add('hidden');
  openCatalog();
}

function lessonNavRow(cur, stepsLen) {
  const backLabel = '返回';
  const nextLabel = cur==='reward' ? '下一個成語' : '下一頁';
  if (cur==='practice') {
    return `<div class="nav-row"><button type="button" class="btn ghost" id="lessonBack">${backLabel}</button></div>`;
  }
  if (cur==='reward') {
    const n = lessonStarCount();
    const disabled = n < 3 ? ' disabled' : '';
    return `<div class="nav-row"><button type="button" class="btn ghost" id="lessonBack">${backLabel}</button><button type="button" class="btn" id="lessonNext"${disabled}>${nextLabel}</button></div>`;
  }
  return `<div class="nav-row"><button type="button" class="btn ghost" id="lessonBack">${backLabel}</button><button type="button" class="btn" id="lessonNext">${nextLabel}</button></div>`;
}

function bindLessonBack(step) {
  const b = document.getElementById('lessonBack');
  if (!b) return;
  b.onclick = () => {
    Voice.stageCut();
    const steps = ['story','meaning','examples','practice','reward'];
    if (step <= 0 || steps[step] === 'reward') {
      closeLessonToCatalog();
      return;
    }
    state.lessonStep = step - 1;
    showLessonStep();
  };
}

  // Spread N story sentences across visual stages 0→1→2
  return Math.min(2, Math.floor((i * 3) / n));

function shortenBeat(s, max) {
  s = String(s || '').replace(/\s+/g, '').trim();
  if (!s) return '';
  if (s.length <= max) return s;
  const cut = s.slice(0, max);
  const idx = Math.max(cut.lastIndexOf('，'), cut.lastIndexOf('、'), cut.lastIndexOf('：'));
  if (idx >= 10) return cut.slice(0, idx);
  return cut + '…';
}
function moralFromMeaning(meaning, idiom) {
  let m = String(meaning || '')
    .replace(/^比喻[：:]?/, '')
    .replace(/^形容[：:]?/, '')
    .replace(/^指[：:]?/, '')
    .replace(/[。．！!？?]+$/g, '')
    .trim();
  if (/^唔好|^不要|^勿|^別|^記住|^精髓/.test(m)) return shortenBeat(m + (m.endsWith('！') ? '' : '！'), 32);
  if (idiom && idiom.polarity === '貶') return shortenBeat('記住：' + m + '——唔好學！', 32);
  if (idiom && idiom.polarity === '褒') return shortenBeat('精髓：' + m + '——要學！', 32);
  return shortenBeat('精髓：' + m, 30);
}
function isMoralLine(s) {
  return /後人|提醒|所以用|教訓|告誡|呢個成語|後世|引申|用嚟|用來形容|用嚟講|就係話/.test(s);
}

/** Split the full continuous story into consecutive sentences — captions ≡ narration ≡ story. */
function splitStorySentences(story) {
  const raw = String(story || '').replace(/\s+/g, '').trim();
  if (!raw) return [];
  const parts = raw.match(/[^。！？!?]+[。！？!?]?/g);
  return (parts || [raw]).map(s => s.trim()).filter(Boolean);
}
function getStoryBeats(idiom) {
  if (!idiom) return ['故事開始。', '跟住發生咗轉變。', '最後有咗結果。'];
  const beats = splitStorySentences(idiom.story);
  if (beats.length >= 2) return beats;
  // Extremely short fallback only
  const one = String(idiom.story || '').trim() || ((idiom.idiom || '成語') + '嘅故事。');
  return [one];
}


/** Wrap a sprite group with progress-driven motion tag (CSS reads --ss-e / --ss-drift). */
function ssM(motion, html) {
  if (!motion) return html;
  return `<g class="ss-m" data-m="${motion}">${html}</g>`;
}
