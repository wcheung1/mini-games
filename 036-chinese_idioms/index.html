/** Render one hard-scripted shot into SVG fragments (no sky). */
function composeShot(shot, p, seed) {
  if (!shot) return { propsHtml: '', actorsHtml: '', moral: false, accent: '', mood: 'calm' };
  const props = [];
  const actors = [];
  const propSet = new Set(shot.props || []);
  if (propSet.has('tree')) props.push(ssTree(70, 110, p));
  if (propSet.has('stump')) props.push(ssStump(200, 150, p));
  if (propSet.has('weeds')) {
    const weed = ssWeed(170, 155) + ssWeed(230, 158) + ssWeed(200, 160);
    props.push(shot.accent === 'wither' ? ssM('wither', weed) : `<g opacity=".85">${weed}</g>`);
  }
  if (propSet.has('water')) props.push(`<ellipse cx="200" cy="165" rx="160" ry="22" fill="#64b5f6" opacity=".5" class="ss-anim-wave"/>`);
  if (propSet.has('boat')) props.push(ssM(shot.accent === 'sink' || shot.accent === 'drift' ? shot.accent : '', ssBoat(160, 150, p)));
  if (propSet.has('gate')) props.push(ssGate(200, 140, p));
  if (propSet.has('hole')) props.push(ssHole(200, 145, p));
  if (propSet.has('sheepPen') || propSet.has('pen')) props.push(ssSheepPen(200, 145, p, { gap: false }));
  if (propSet.has('sheepPenGap') || propSet.has('penGap')) props.push(ssSheepPen(200, 145, p, { gap: true }));
  if (propSet.has('bell')) props.push(ssM(shot.accent === 'punch' ? 'punch' : 'bob', ssBell(200, 105, p)));
  if (propSet.has('well')) props.push(ssWell(200, 140, p));
  if (propSet.has('drum')) props.push(ssDrum(200, 135, p));
  if (propSet.has('qin') && !(shot.actors || []).some(a => a.who === 'qin')) props.push(ssQin(200, 145, p));
  if (propSet.has('stone')) props.push(ssStone(240, 130, p));
  if (propSet.has('cart')) props.push(ssCart(200, 145, p));
  if (propSet.has('mountain')) props.push(ssMountain(300, 140, p));
  if (propSet.has('house')) props.push(ssHouse(240, 135, p));
  if (propSet.has('bridge')) props.push(ssBridge(200, 130, p));
  if (propSet.has('book')) props.push(ssBook(240, 140, p));
  if (propSet.has('scroll')) props.push(ssScroll(300, 110, p));
  if (propSet.has('box')) { /* actor may also place */ }
  if (propSet.has('shield')) props.push(ssShield(260, 120, p));
  if (propSet.has('sword') && !(shot.actors || []).some(a => a.who === 'sword')) props.push(ssSword(300, 110, p));
  if (propSet.has('flag')) props.push(ssFlag(200, 100, p));
  if (propSet.has('arrow')) props.push(ssArrow(280, 100, p));
  if (propSet.has('lantern')) props.push(ssLantern(140, 90, p));
  if (propSet.has('crowdset')) {
    props.push(ssScroll(60, 100, p));
  }

  const fx = new Set(shot.fx || []);
  if (fx.has('dust')) actors.push(ssDust(200, 150));
  if (fx.has('spark')) actors.push(ssSpark(200, 130, p));
  if (fx.has('mend')) actors.push(ssMendSpark(200, 100, p));

  for (const a of (shot.actors || [])) {
    const anim = a.anim || '';
    let html = '';
    switch (a.who) {
      case 'farmer': html = ssFarmer(a.x|0, a.y|0, p, 'ss-static'); break;
      case 'kid': html = ssKid(a.x|0, a.y|0, p, 'ss-static'); break;
      case 'rabbit': html = ssRabbit(a.x|0, a.y|0, { limp: !!a.limp }); break;
      case 'sheep': html = ssSheep(a.x|0, a.y|0, p); break;
      case 'snake': html = ssSnake(a.x|0, a.y|0, p, { legs: !!a.legs }); break;
      case 'frog': html = ssFrog(a.x|0, a.y|0, p); break;
      case 'fox': html = ssFox(a.x|0, a.y|0, p); break;
      case 'tiger': html = ssTiger(a.x|0, a.y|0, p); break;
      case 'cow': html = ssCow(a.x|0, a.y|0, p); break;
      case 'deer': html = ssDeer(a.x|0, a.y|0, p); break;
      case 'bird': html = ssBird(a.x|0, a.y|0, p); break;
      case 'horse': html = ssHorse(a.x|0, a.y|0, p); break;
      case 'turtle': html = ssTurtle(a.x|0, a.y|0, p); break;
      case 'crowd': html = ssCrowd(a.x|0, a.y|0, p); break;
      case 'winejar': html = ssWineJar(a.x|0, a.y|0, p); break;
      case 'earhands': html = ssEarHands(a.x|0, a.y|0, p); break;
      case 'dragon': html = ssDragon(a.x|0, a.y|0, p); break;
      case 'qin': html = ssQin(a.x|0, a.y|0, p); break;
      case 'cup': html = ssCup(a.x|0, a.y|0, p); break;
      case 'bow': html = ssBow(a.x|0, a.y|0, p); break;
      case 'sword': html = ssSword(a.x|0, a.y|0, p); break;
      case 'box': html = ssBox(a.x|0, a.y|0, p); break;
      case 'lantern': html = ssLantern(a.x|0, a.y|0, p); break;
      case 'hole': html = ssHole(a.x|0, a.y|0, p); break;
      default: break;
    }
    if (html) actors.push(anim ? ssM(anim, html) : html);
  }

  // box prop if listed and not drawn as actor
  if (propSet.has('box') && !(shot.actors || []).some(a => a.who === 'box')) {
    props.push(ssBox(230, 140, p));
  }

  return {
    propsHtml: props.join(''),
    actorsHtml: actors.join(''),
    moral: !!shot.moral,
    accent: shot.accent || '',
    mood: shot.accent === 'laugh' ? 'joy' : (shot.accent === 'crash' || shot.accent === 'sink' ? 'shock' : (shot.accent === 'wither' ? 'sad' : (shot.accent === 'wait' ? 'wait' : (shot.moral ? 'moral' : 'calm')))),
  };
}

/**
 * Keyword plot flags for one Cantonese story sentence.
 * Drives per-beat tableau so the on-screen moment matches the spoken line.
 */
function analyzePlotBeat(sentence, idiom) {
  const s = String(sentence || '');
  const idiomStr = (idiom && (idiom.idiom || '')) || '';
  const flags = {
    rabbit: /兔/.test(s),
    sheep: /羊/.test(s),
    snake: /蛇/.test(s),
    sword: /劍|刀/.test(s),
    boat: /船|舟/.test(s),
    bell: /鈴|鐘/.test(s),
    ear: /耳/.test(s),
    horse: /馬/.test(s),
    bridge: /橋/.test(s),
    well: /井/.test(s),
    drum: /鼓|竽/.test(s),
    arrow: /箭|弓/.test(s),
    mirror: /鏡/.test(s),
    book: /書|卷|琴|兵書/.test(s),
    wine: /酒/.test(s),
    farmer: /農夫|農人|農|樵夫|漁夫|主人|老人|愚公|葉公|叶公|勾踐|項羽|劉備|曹操/.test(s),
    neighbor: /鄰居|旁人|村人|鄉里|人哋|眾人|大家|其他人|群臣|士兵/.test(s),
    kid: /小孩|細路|童|仔|細佬|子孫|兒子/.test(s),
    stump: /樹樁|樁|株/.test(s),
    tree: /樹|林|木|禾苗|梅/.test(s),
    crash: /撞|撞擊|碰|撞埋/.test(s),
    dazed: /暈|懵|跌親|仆街|暈咗/.test(s),
    wait: /等待|坐等|成日坐|守株|守住|等第二|坐喺/.test(s),
    sit: /坐/.test(s),
    wither: /荒|廢|荒廢|乾枯|枯萎|枯死/.test(s),
    rabbitGone: /兔子?(?:亦都)?(?:冇再|唔再嚟|唔再來|無再|唔會再|沒再)/.test(s) || ( /兔/.test(s) && /走失|走咗|冇咗/.test(s) && !/等/.test(s) ),
    sheepGone: /羊/.test(s) && /走失|冇咗|冇再|唔會再|返唔嚟|走咗/.test(s),
    horseGone: /馬/.test(s) && /走失|失|冇咗|走咗/.test(s),
    horseBack: /馬/.test(s) && /返|帶住|得馬|好馬/.test(s),
    mend: /補|修|補好|修好|補鑊/.test(s),
    draw: /畫蛇|添足|比賽畫/.test(s) || ((/畫|添/.test(s)) && (/蛇|足|腳/.test(s) || idiomStr.indexOf('畫蛇') >= 0)),
    foot: /腳|足/.test(s),
    drop: /掉|跌|甩|掉落/.test(s),
    sink: /沉|溺|浸|跳下水|下水|鑿沉/.test(s),
    carve: /刻|記號/.test(s),
    plug: /塞|掩|捂/.test(s),
    pull: /拉|拖|扯/.test(s),
    laugh: /笑|嘲笑|譏笑|笑住/.test(s),
    lose: /輸|敗/.test(s),
    win: /贏|勝|最快/.test(s),
    remind: /提醒|告誡|教訓|後人|所以用|引申|叫我哋|教我哋|叫呢種/.test(s),
    moral: /道理|精髓|唔好學|要學|記住|白費|靈活/.test(s) || isMoralLine(s),
    farm: /耕|種|田|田邊/.test(s),
    joy: /開心|高興|歡喜|得意|樂/.test(s),
    sad: /傷心|哭|慘|可憐|懶/.test(s),
    steal: /偷|盜/.test(s),
    play: /彈|奏|琴/.test(s),
    cow: /牛/.test(s),
    frog: /蛙|青蛙/.test(s),
    fox: /狐|狐狸/.test(s),
    tiger: /虎|老虎/.test(s),
    dragon: /龍/.test(s),
    gate: /門(?!口)/.test(s) || (/牢/.test(s) && !/補牢|亡羊/.test(s)),
    pen: /羊圈|補牢|補好羊圈|修好羊圈/.test(s) || (idiomStr.indexOf('亡羊') >= 0 && /圈|補|窿|缺口/.test(s)),
    deer: /鹿/.test(s),
    bird: /鳥|雀/.test(s),
    turtle: /鱉|龜|鱉/.test(s),
    stone: /石|石頭/.test(s),
  };
  let mood = 'calm';
  if (flags.remind || flags.moral) mood = 'moral';
  else if (flags.laugh || flags.joy || flags.win) mood = 'joy';
  else if ((flags.crash || flags.dazed) && !(flags.wait || flags.sit)) mood = 'shock';
  else if (flags.drop || flags.sink) mood = 'shock';
  else if (flags.wither || flags.sad || flags.lose || flags.rabbitGone) mood = 'sad';
  else if (flags.wait || flags.sit) mood = 'wait';
  else if (flags.crash || flags.dazed) mood = 'shock';
  flags.mood = mood;
  return flags;
}

/** Accumulate world state across beats 0..beatIndex (props stay once introduced; absence clears). */
function accumulatePlotWorld(beats, beatIndex, idiom) {
  const world = {
    farmer: false, rabbit: false, rabbitHit: false, rabbitGone: false, stump: false, tree: false,
    weeds: false, crowd: false, horse: false, boat: false, bell: false,
    bridge: false, well: false, drum: false, sword: false, arrow: false,
    mirror: false, book: false, sheep: false, sheepGone: false, snake: false, kid: false,
    wait: false, wither: false, carve: false, sink: false, mend: false,
    draw: false, foot: false, plug: false, pull: false, ear: false,
    wine: false, cow: false, play: false, steal: false, drop: false,
    gate: false, house: false, cart: false, flag: false, heart: false,
    stone: false, box: false, broom: false, fan: false, shield: false,
    compass: false, ball: false, sun: false, scroll: false, lantern: false,
    mountain: false, cloud: false, storm: false,
    frog: false, fox: false, tiger: false, dragon: false,
    horseGone: false, deer: false, bird: false, pen: false, penGap: false,
    turtle: false, stone: false,
  };
  const list = Array.isArray(beats) ? beats : [];
  const bi = Math.max(0, Math.min(Math.max(0, list.length - 1), beatIndex | 0));
  let now = analyzePlotBeat(list[bi] || '', idiom);
  const ot = (idiom && idiom.objectType) || '';
  const idiomHasRabbit = /兔/.test((idiom && idiom.idiom) || '');
  for (let i = 0; i <= bi; i++) {
    const a = analyzePlotBeat(list[i] || '', idiom);
    if (i === bi) now = a;
    if (a.farmer || a.farm) world.farmer = true;
    if (a.rabbit) world.rabbit = true;
    if (a.crash || a.dazed) {
      world.stump = true;
      if (a.rabbit || idiomHasRabbit || (ot === 'tree' && a.crash)) {
        world.rabbitHit = true;
        world.rabbit = true;
      }
    }
    if (a.rabbitGone) world.rabbitGone = true;
    if (a.sheepGone) world.sheepGone = true;
    if (a.horseGone) world.horseGone = true;
    if (a.horseBack) { world.horseGone = false; world.horse = true; }
    if (a.stump) world.stump = true;
    if (a.tree) world.tree = true;
    if (a.wither) { world.weeds = true; world.wither = true; }
    if (a.neighbor || a.laugh) world.crowd = true;
    if (a.wait || a.sit) world.wait = true;
    if (a.horse) world.horse = true;
    if (a.boat) world.boat = true;
    if (a.bell) world.bell = true;
    if (a.bridge) world.bridge = true;
    if (a.well) world.well = true;
    if (a.drum) world.drum = true;
    if (a.sword) world.sword = true;
    if (a.arrow) world.arrow = true;
    if (a.mirror) world.mirror = true;
    if (a.book) world.book = true;
    if (a.sheep) world.sheep = true;
    if (a.snake) world.snake = true;
    if (a.kid) world.kid = true;
    if (a.carve) world.carve = true;
    if (a.sink) world.sink = true;
    if (a.mend) world.mend = true;
    if (a.draw) world.draw = true;
    if (a.foot) world.foot = true;
    if (a.plug) world.plug = true;
    if (a.pull) world.pull = true;
    if (a.ear) world.ear = true;
    if (a.wine) world.wine = true;
    if (a.cow) world.cow = true;
    if (a.play) world.play = true;
    if (a.steal) world.steal = true;
    if (a.drop) world.drop = true;
    if (a.frog) world.frog = true;
    if (a.fox) world.fox = true;
    if (a.tiger) world.tiger = true;
    if (a.dragon) world.dragon = true;
    if (a.gate) world.gate = true;
    if (a.pen) { world.pen = true; world.penGap = !a.mend; }
    if (a.mend && world.pen) world.penGap = false;
    if (a.deer) world.deer = true;
    if (a.bird) world.bird = true;
    if (a.turtle) world.turtle = true;
    if (a.stone) world.stone = true;
  }
  if (world.rabbitGone) world.rabbit = false;
  if (world.sheepGone) world.sheep = false;
  if (world.horseGone) world.horse = false;
  return { world, now, bi };
}

/** Accent motion for THIS beat only (anti-AI-motion: one primary action). */
function plotAccentMotion(now) {
  if (!now) return '';
  if (now.laugh) return 'laugh';
  if (now.wither) return 'wither';
  if (now.rabbitGone) return 'wither';
  if (now.drop || now.sink) return 'sink';
  if (now.dazed || (now.crash && !now.wait && !now.sit)) return 'crash';
  if (now.wait || now.sit) return 'wait';
  if (now.crash) return 'crash';
  if (now.pull) return 'punch';
  if (now.draw || now.foot) return 'draw';
  if (now.farm) return 'bob';
  if (now.horse || (now.rabbit && !now.crash && !now.rabbitGone)) return 'hop';
  if (now.boat) return 'drift';
  if (now.mend) return 'bob';
  return '';
}

/** Setting-only décor for objectType (no actors). */
function settingPropForOt(ot, p, seed, world) {
  const props = [];
  switch (ot) {
    case 'tree': props.push(ssTree(70, 110, p)); props.push(ssStump(210, 150, p)); break;
    case 'boat':
      props.push(`<ellipse cx="200" cy="165" rx="160" ry="22" fill="#64b5f6" opacity=".5" class="ss-anim-wave"/>`);
      props.push(ssBoat(160, 150, p));
      break;
    case 'horse': props.push(ssMountain(300, 140, p)); break;
    case 'bridge': props.push(ssBridge(200, 130, p)); break;
    case 'gate': props.push(ssGate(200, 140, p)); break;
    case 'bell': props.push(ssGate(200, 150, p)); props.push(ssBell(200, 105, p)); break;
    case 'drum': props.push(ssDrum(200, 135, p)); break;
    case 'well': props.push(ssWell(200, 140, p)); break;
    case 'house': props.push(ssHouse(220, 135, p)); break;
    case 'lantern': props.push(ssHouse(220, 140, p)); props.push(ssLantern(140, 90, p)); break;
    case 'mountain': props.push(ssMountain(160, 130, p)); break;
    case 'cloud': props.push(ssCloud(180, 60, p)); break;
    case 'stone': props.push(ssStone(200, 145, p)); break;
    case 'box': props.push(ssBox(210, 140, p)); break;
    case 'cart': props.push(ssCart(220, 140, p)); break;
    case 'flag': props.push(ssFlag(200, 100, p)); break;
    case 'heart': props.push(ssHeart(200, 110, p)); break;
    case 'sun': props.push(ssSunProp(200, 85, p)); break;
    case 'compass': props.push(ssMountain(300, 145, p)); props.push(ssCompass(210, 120, p)); break;
    case 'broom': props.push(ssHouse(250, 130, p)); props.push(ssBroom(180, 120, p)); break;
    case 'fan': props.push(ssFan(250, 120, p)); break;
    case 'shield': props.push(ssShield(240, 120, p)); break;
    case 'sword': props.push(ssSword(250, 110, p)); break;
    case 'arrow': props.push(ssTree(70, 110, p)); props.push(ssArrow(250, 100, p)); break;
    case 'mirror': props.push(ssMirror(250, 120, p)); break;
    case 'book': props.push(ssBook(240, 140, p)); break;
    case 'scroll': props.push(ssScroll(300, 110, p)); break;
    case 'ball': props.push(ssBall(220, 145, p)); break;
    default: props.push(ssScroll(300, 110, p)); break;
  }
  return props;
}

/**
 * Plot-aware scene: IDIOM_SHOTS hard script OR cumulative keyword world.
 * Never injects STORY_BUILDERS full actor tableau as fallback.
 */
function composePlotScene(idiom, beatIndex, beats) {
  const ot = (idiom && idiom.objectType) || 'scroll';
  const seed = hashStr((idiom && (idiom.id || idiom.idiom)) || ot);
  const p = storyPalette(seed);
  const list = Array.isArray(beats) ? beats : [];
  const n = Math.max(1, list.length || _storyBeatTotal || 1);
  _storyBeatTotal = n;
  const bi = Math.max(0, Math.min(n - 1, beatIndex | 0));
  const idiomKey = (idiom && idiom.idiom) || '';
  const shots = IDIOM_SHOTS[idiomKey];

  if (shots && shots.length) {
    const shot = shots[Math.min(bi, shots.length - 1)];
    const rendered = composeShot(shot, p, seed);
    const moral = rendered.moral || bi >= n - 1;
    const parts = [];
    parts.push(`<g class="ss-layer ss-bg" data-mood="${rendered.mood}">${ssSky(p, seed)}</g>`);
    parts.push(`<g class="ss-layer ss-props">${rendered.propsHtml}</g>`);
    parts.push(`<g class="ss-layer ss-actors">${rendered.actorsHtml}</g>`);
    const grade = [];
    if (moral) grade.push(ssMoralBadge(p));
    grade.push(`<rect class="ss-grade" x="0" y="0" width="400" height="200" fill="transparent" pointer-events="none"/>`);
    parts.push(`<g class="ss-layer ss-grade-layer">${grade.join('')}</g>`);
    const extra = seed % 3 === 0 ? ssCloud(320, 40, p) : (seed % 3 === 1 ? ssDust(100, 160) : ssBirdish(60, 50, p));
    parts.push(extra);
    return parts.join('');
  }

  const { world, now } = accumulatePlotWorld(list, beatIndex, idiom);
  const moral = (bi >= n - 1) || !!(now && (now.remind || now.moral) && bi >= Math.max(0, n - 2));
  const accent = plotAccentMotion(now);
  const mood = (now && now.mood) || 'calm';

  const parts = [];
  parts.push(`<g class="ss-layer ss-bg" data-mood="${mood}">${ssSky(p, seed)}</g>`);

  const skipGateSetting = /亡羊/.test(idiomKey) || world.pen || world.sheep || world.sheepGone;
  const props = settingPropForOt(skipGateSetting && ot === 'gate' ? 'scroll' : ot, p, seed, world);
  if (skipGateSetting && ot === 'gate') {
    // remove bare scroll if we only swapped to avoid gate — prefer empty then pen
    props.length = 0;
  }

  // Extra cumulative props beyond setting
  if (world.tree && ot !== 'tree' && ot !== 'arrow') props.push(ssTree(70, 110, p));
  if (world.stump && ot !== 'tree') props.push(ssStump(200, 150, p));
  if (world.boat && ot !== 'boat') {
    props.push(`<ellipse cx="200" cy="165" rx="160" ry="22" fill="#64b5f6" opacity=".5" class="ss-anim-wave"/>`);
    props.push(ssBoat(160, 150, p));
  }
  if (world.bell && ot !== 'bell') props.push(ssBell(200, 105, p));
  if (world.well && ot !== 'well') props.push(ssWell(200, 140, p));
  if (world.drum && ot !== 'drum') props.push(ssDrum(200, 135, p));
  if (world.sword && ot !== 'sword') {
    props.push(ssM(world.drop || world.sink ? 'sink' : '', ssSword(world.carve ? 180 : 250, world.drop || world.sink ? 160 : 110, p)));
  }
  if ((ot === 'boat' || world.boat) && (world.sword || world.drop)) {
    // ensure sword visible for 刻舟-like
    if (ot === 'boat') props.push(ssM(accent === 'sink' || world.sink || world.drop ? 'sink' : '', ssSword(200, world.drop || world.sink ? 165 : 120, p)));
  }
  if (world.carve && (ot === 'boat' || world.boat)) props.push(ssM('draw', ssSpark(170, 145, p)));
  if (world.gate && ot !== 'gate' && !world.pen && !/亡羊/.test(idiomKey)) props.push(ssGate(200, 140, p));
  // 亡羊補牢 / sheep pen: oval fence with optional gap (not a rectangular gate)
  if (world.pen || (ot === 'gate' && (world.sheep || world.sheepGone || /亡羊|羊圈/.test(idiomKey)))) {
    const gap = !!(world.penGap || (world.sheepGone && !world.mend));
    props.push(ssSheepPen(200, 145, p, { gap }));
  } else if (ot === 'gate' && !world.pen) {
    // keep setting gate from settingPropForOt
  }
  if (world.stone) props.push(ssStone(240, 130, p));
  if (world.weeds || world.wither) {
    const weed = ssWeed(170, 155) + ssWeed(230, 158) + ssWeed(200, 160);
    props.push(accent === 'wither' ? ssM('wither', weed) : `<g opacity=".85">${weed}</g>`);
  }
  // scroll + snake: prefer snake over bare scroll spark
  if ((ot === 'scroll' || world.scroll || world.snake || world.draw) && world.snake) {
    // snake drawn in actors
  } else if (ot === 'scroll' && !world.snake) {
    // setting already has scroll
  }

  parts.push(`<g class="ss-layer ss-props">${props.join('')}</g>`);

  const actors = [];
  // Farmer positions: farming left; watching crash mid-left; waiting ON stump; never hug rabbit
  const needFarmer = world.farmer || now.farm || now.farmer || (bi === 0 && !world.frog && !world.fox);
  if (needFarmer) {
    let fx = 110, fy = 130, fAnim = '';
    if (world.wait || (now && (now.wait || now.sit))) { fx = 200; fy = 138; fAnim = accent === 'wait' || world.wait ? 'wait' : ''; }
    else if (now && now.farm) { fx = 110; fy = 130; fAnim = accent === 'bob' ? 'bob' : 'bob'; }
    else if (now && (now.crash || now.dazed)) { fx = 95; fy = 128; }
    else if (world.rabbitHit && !(now && (now.wait || now.sit))) { fx = 95; fy = 128; }
    else if (now && now.joy) { fx = 150; fy = 130; fAnim = 'bob'; }
    else if (ot === 'boat') { fx = world.sink ? 240 : 160; fy = world.sink ? 147 : 132; fAnim = 'drift'; }
    else if (ot === 'bell' && (world.steal || world.plug)) { fx = 140; fy = 140; fAnim = accent || 'bob'; }
    else { fx = 120 + (seed % 30); fy = 135; }
    const farmer = ssFarmer(fx, fy, p, 'ss-static');
    actors.push(fAnim ? ssM(fAnim, farmer) : farmer);
  }

  // Rabbit — never if gone; crash vs limp vs absent
  if (world.rabbit && !world.rabbitGone) {
    if (world.rabbitHit || (now && (now.crash || now.dazed))) {
      const rabbit = ssRabbit(205, 148, { limp: !(accent === 'crash' || (now && now.crash)) });
      if (accent === 'crash' || (now && now.crash)) {
        actors.push(ssM('crash', ssRabbit(205, 148)));
        actors.push(ssDust(200, 150));
        actors.push(ssSpark(200, 130, p));
      } else {
        actors.push(rabbit);
      }
    } else if (!(now && now.rabbitGone)) {
      actors.push(ssM(accent === 'hop' ? 'hop' : '', ssRabbit(310, 145)));
    }
  }

  // Sheep (pen drawn in props layer above)
  if (world.sheep && !world.sheepGone) {
    actors.push(ssM(world.mend ? 'bob' : 'hop', ssSheep(world.mend ? 190 : 280, 145, p)));
  }
  if (world.mend) actors.push(ssMendSpark(200, 100, p));

  // Snake — real SVG; legs when foot
  if (world.snake || (now && now.snake) || (ot === 'scroll' && world.draw && /蛇/.test(idiomKey + (list[bi] || '')))) {
    const legs = !!(world.foot || (now && now.foot));
    actors.push(ssM(accent === 'draw' || (now && now.draw) ? 'draw' : '', ssSnake(230, 120, p, { legs })));
  }

  if (world.frog) actors.push(ssFrog(200, 130, p));
  if (world.fox) actors.push(ssFox(150, 145, p));
  if (world.tiger) actors.push(ssTiger(250, 140, p));
  if (world.dragon) actors.push(ssDragon(260, 100, p));

  if (world.crowd || (now && (now.neighbor || now.laugh))) {
    actors.push(ssM(accent === 'laugh' || (now && now.laugh) ? 'laugh' : 'bob', ssCrowd(300, 150, p)));
  }
  if (world.kid || ot === 'ball') {
    actors.push(ssKid(ot === 'ball' ? 140 : 290, 145, p, 'ss-static'));
  }
  if (world.cow) {
    actors.push(ssM(now && now.play ? 'wait' : '', ssCow(280, 150, p)));
  }
  if (world.deer) actors.push(ssDeer(180, 145, p));
  if (world.bird) actors.push(ssM(accent === 'hop' ? 'hop' : 'float', ssBird(240, 80, p)));
  if (world.turtle) actors.push(ssTurtle(280, 145, p));
  if (world.horse && !world.horseGone) {
    const hx = world.wait ? 260 : (bi === 0 ? 120 : 200);
    if (ot !== 'horse') actors.push(ssM(accent === 'hop' ? 'hop' : '', ssHorse(hx, 140, p)));
    else {
      // setting didn't add horse — add as actor for horse ot
      actors.push(ssM(accent === 'hop' ? 'hop' : '', ssHorse(hx, 140, p)));
    }
  }
  if (world.ear || world.plug) {
    actors.push(ssEarHands(150, 100, p));
  }
  if (world.wine) {
    const wx = (now && now.lose) ? 280 : 320;
    actors.push(ssWineJar(wx, 140, p));
  }
  if (world.play) actors.push(ssQin(160, 150, p));

  if (!actors.length) {
    actors.push(ssFarmer(140, 135, p, 'ss-static'));
  }
  parts.push(`<g class="ss-layer ss-actors">${actors.join('')}</g>`);

  const grade = [];
  if (moral) grade.push(ssMoralBadge(p));
  grade.push(`<rect class="ss-grade" x="0" y="0" width="400" height="200" fill="transparent" pointer-events="none"/>`);
  parts.push(`<g class="ss-layer ss-grade-layer">${grade.join('')}</g>`);

  const extra = seed % 3 === 0 ? ssCloud(320, 40, p) : (seed % 3 === 1 ? ssDust(100, 160) : ssBirdish(60, 50, p));
  parts.push(extra);

  return parts.join('');
}

function buildStageSvg(idiom, beatIndex, totalBeats) {
  const beats = getStoryBeats(idiom);
  if (typeof totalBeats === 'number' && totalBeats > 0) _storyBeatTotal = totalBeats;
  else if (beats && beats.length) _storyBeatTotal = beats.length;
  try {
    return composePlotScene(idiom, beatIndex, beats);
  } catch (e) {
    const ot = (idiom && idiom.objectType) || 'scroll';
    const seed = hashStr((idiom && (idiom.id || idiom.idiom)) || ot);
    const p = storyPalette(seed);
    try {
      const fn = STORY_BUILDERS[ot] || ssGeneric;
      return fn(p, seed, beatIndex);
    } catch (e2) {
      return ssGeneric(p, seed, beatIndex);
    }
  }
}

let _storyPlayer = null;

function unmountStoryPlayer() {
  if (_storyPlayer) {
    if (_storyPlayer.timer) clearInterval(_storyPlayer.timer);
    if (_storyPlayer.fallbackTimer) clearTimeout(_storyPlayer.fallbackTimer);
    if (_storyPlayer.driftRaf) cancelAnimationFrame(_storyPlayer.driftRaf);
    _storyPlayer = null;
  }
  if (Voice && Voice.state) {
    Voice.state.onJobStart = null;
    Voice.state.onProgress = null;
  }
}

function renderStoryScene(idiom) {
  const beats = getStoryBeats(idiom);
  const ot = (idiom && idiom.objectType) || 'scroll';
  const title = (idiom && idiom.idiom) ? idiom.idiom : '';
  const n = beats.length;
  const dots = beats.map((_, i) => `<button type="button" class="ss-dot${i===0?' on':''}" data-beat="${i}" aria-label="第${i+1}句"></button>`).join('');
  const svg0 = buildStageSvg(idiom, 0, n);
  return `<div id="storyScene" class="ss-player" data-ot="${ot}" data-beats="${n}" aria-label="${title}故事動畫">
    <div class="ss-stage-host">
      <svg class="ss-stage ss-stage-a on" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}第1幕">${svg0}</svg>
      <svg class="ss-stage ss-stage-b" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"></svg>
    </div>
    <div class="ss-ui">
      <div class="ss-caption" id="ssCaption"><span class="ss-beat-lab">第1句</span> <span class="ss-beat-txt">${beats[0] || ''}</span></div>
      <div class="ss-controls">
        <div class="ss-dots" id="ssDots">${dots}</div>
        <button type="button" class="ss-pause" id="ssPause" title="暫停／繼續場面" aria-label="暫停場面">⏸</button>
      </div>
    </div>
  </div>`;
}

function mountStoryPlayer(root, idiom) {
  unmountStoryPlayer();
  if (!root || !idiom) return;
  const beats = getStoryBeats(idiom);
  const n = beats.length;
  _storyBeatTotal = n;
  const stageA = root.querySelector('.ss-stage-a');
  const stageB = root.querySelector('.ss-stage-b');
  const host = root.querySelector('.ss-stage-host') || root;
  const caption = root.querySelector('#ssCaption');
  const dots = root.querySelector('#ssDots');
  const pauseBtn = root.querySelector('#ssPause');
  let idx = 0;
  let flip = false;
  let driftRaf = 0;

  function seek(p) {
    p = Math.max(0, Math.min(1, p));
    const punch = Math.exp(-3.2 * p) * Math.sin(12 * p) * (p < 0.35 ? 1 : 0);
    const e = 1 - Math.pow(1 - p, 3);
    host.style.setProperty('--ss-p', String(p));
    host.style.setProperty('--ss-punch', String(punch * 0.018));
    host.style.setProperty('--ss-e', String(e));
    root.style.setProperty('--ss-p', String(p));
    root.style.setProperty('--ss-punch', String(punch * 0.018));
    root.style.setProperty('--ss-e', String(e));
  }

  function driftTick(t) {
    if (!_storyPlayer || !_storyPlayer.voiceSync) return;
    const speaking = Voice && Voice.state && Voice.state.speaking && !Voice.state.paused;
    if (speaking) {
      const drift = Math.sin(t / 900) * 0.35;
      host.style.setProperty('--ss-drift', String(drift));
      root.style.setProperty('--ss-drift', String(drift));
    }
    driftRaf = requestAnimationFrame(driftTick);
    if (_storyPlayer) _storyPlayer.driftRaf = driftRaf;
  }
  driftRaf = requestAnimationFrame(driftTick);

  function paint(i, animate) {
    const next = Math.max(0, Math.min(n - 1, i));
    const changed = next !== idx;
    idx = next;
    const svg = buildStageSvg(idiom, idx, n);
    const incoming = flip ? stageA : stageB;
    const outgoing = flip ? stageB : stageA;
    if (incoming) {
      incoming.innerHTML = svg;
      incoming.setAttribute('aria-label', (idiom.idiom || '') + '第' + (idx + 1) + '幕');
      incoming.setAttribute('aria-hidden', 'false');
    }
    if (animate && changed && outgoing && incoming) {
      outgoing.classList.remove('on');
      outgoing.classList.add('out');
      incoming.classList.remove('out');
      incoming.classList.add('on');
      flip = !flip;
      setTimeout(() => { if (outgoing) outgoing.classList.remove('out'); }, 500);
    } else if (incoming) {
      incoming.classList.add('on');
      if (outgoing) outgoing.classList.remove('on', 'out');
      if (changed) flip = !flip;
    }
    if (caption) {
      caption.innerHTML = `<span class="ss-beat-lab">第${idx+1}句</span> <span class="ss-beat-txt">${beats[idx] || ''}</span>`;
    }
    if (dots) {
      dots.querySelectorAll('.ss-dot').forEach((d, di) => d.classList.toggle('on', di === idx));
    }
    seek(0);
  }

  function goToBeat(i, animate) {
    paint(i, animate !== false);
  }

  if (dots) {
    dots.querySelectorAll('.ss-dot').forEach(d => {
      d.onclick = (ev) => {
        ev.preventDefault();
        const bi = parseInt(d.dataset.beat, 10);
        if (!Number.isFinite(bi)) return;
        goToBeat(bi, true);
      };
    });
  }
  if (pauseBtn) {
    pauseBtn.title = '暫停／繼續朗讀';
    pauseBtn.setAttribute('aria-label', '暫停朗讀');
    pauseBtn.onclick = (ev) => {
      ev.preventDefault();
      Voice.togglePause();
      const paused = Voice.state.paused;
      pauseBtn.textContent = paused ? '▶️' : '⏸';
      pauseBtn.setAttribute('aria-label', paused ? '繼續朗讀' : '暫停朗讀');
    };
  }

  // Drive scenes from speech jobs (beatIndex), not a fast timer
  Voice.state.onJobStart = (meta) => {
    if (!_storyPlayer || !_storyPlayer.voiceSync) return;
    if (meta && typeof meta.beatIndex === 'number') {
      goToBeat(meta.beatIndex, true);
    }
  };
  Voice.state.onProgress = (p, meta) => {
    if (!_storyPlayer || !_storyPlayer.voiceSync) return;
    if (meta && typeof meta.beatIndex === 'number' && meta.beatIndex !== idx) return;
    seek(p);
  };

  _storyPlayer = {
    timer: null,
    fallbackTimer: null,
    driftRaf,
    idiomId: idiom.id,
    voiceSync: true,
    goToBeat,
    seek,
    beats,
  };
  paint(0, false);
}

/** Speak the full continuous story sentence-by-sentence; each line = caption = scene. */
function speakStorySynced(idiom) {
  const beats = getStoryBeats(idiom);
  Voice.stageCut();
  if (!state.settings.autoPlay) {
    setScreenSpeech(`${idiom.idiom}。${idiom.story}`, 'teacher');
    return;
  }
  Voice.unlock();
  // Title first (stay on sentence 0)
  Voice.enqueue(`${idiom.idiom}。聽故事啦。`, {
    role: 'teacher',
    beatIndex: 0,
    onStart: () => { if (_storyPlayer && _storyPlayer.goToBeat) _storyPlayer.goToBeat(0, false); }
  });
  beats.forEach((line, i) => {
    const t = String(line || '').trim();
    if (!t) return;
    Voice.enqueue(t, {
      role: 'teacher',
      beatIndex: i,
      onStart: () => { if (_storyPlayer && _storyPlayer.goToBeat) _storyPlayer.goToBeat(i, true); }
    });
  });
  setScreenSpeech(String(idiom.story || beats.join('')), 'teacher');
}


function showLessonStep() {
  const idiom = state.lesson;
  const step = state.lessonStep;
  unmountStoryPlayer();
  Voice.stageCut();
  const steps = ['story','meaning','examples','practice','reward'];
  const cur = steps[step];
  let body = '';
  if (cur==='story') {
    body = `<h2>${idiom.idiom} ${speakBtn(idiomSpeakText(idiom))}</h2>
      <p><small>${idiomMetaLine(idiom)}</small></p>
      ${renderStoryScene(idiom)}
      <p><b>故事</b> ${speakBtn(idiom.story)}</p>
      <p>${idiom.story}</p>
      <p class="detail">💡 出處：${idiom.source}</p>`;
    // voice + scenes synced in mountStoryPlayer via speakStorySynced
  } else if (cur==='meaning') {
    body = `<h2>意思 ${speakBtn('呢個成語嘅意思')}</h2>
      <p>${idiom.meaning} ${speakBtn(idiom.meaning)}</p>
      <p>感情色彩：<b>${idiom.polarity}</b> ${speakBtn('感情色彩係'+idiom.polarity)}</p>`;
    autoSpeak(idiom.meaning + '。感情色彩係' + idiom.polarity,'teacher');
  } else if (cur==='examples') {
    const n0 = (idiom.exampleNotes && idiom.exampleNotes[0]) || '';
    const n1 = (idiom.exampleNotes && idiom.exampleNotes[1]) || '';
    const note0 = n0 ? `<p class="ex-note">👉 意思：${n0} ${speakBtn(n0)}</p>` : '';
    const note1 = n1 ? `<p class="ex-note">👉 意思：${n1} ${speakBtn(n1)}</p>` : '';
    body = `<h2>例句 ${speakBtn('兩個唔同場合嘅例句')}</h2>
      <div class="ex-block">
        <p class="ex-sent">① ${idiom.examples[0]} ${speakBtn(idiom.examples[0])}</p>
        ${note0}
      </div>
      <div class="ex-block">
        <p class="ex-sent">② ${idiom.examples[1]} ${speakBtn(idiom.examples[1])}</p>
        ${note1}
      </div>`;
    const speakParts = [`第一句，${idiom.examples[0]}`];
    if (n0) speakParts.push(`意思：${n0}`);
    speakParts.push(`第二句，${idiom.examples[1]}`);
    if (n1) speakParts.push(`意思：${n1}`);
    autoSpeak(speakParts.join('。'),'teacher');
  } else if (cur==='practice') {
    body = miniQuizHTML(idiom);
  } else {
    const earned = lessonStarCount();
    const prev = state.progress.learned[idiom.id];
    const prevStars = (prev && prev.stars) || 0;
    const stars = Math.max(prevStars, Math.min(3, earned));
    state.progress.learned[idiom.id] = { stars, t: Date.now() };
    state.progress.stars += Math.max(0, stars - prevStars);
    if (!state.progress.review.includes(idiom.id)) state.progress.review.push(idiom.id);
    save(); refreshHub();
    const missing = [];
    if (!state.lessonStars.story) missing.push('聽完故事');
    if (!state.lessonStars.meaning) missing.push('明意思同例句');
    if (!state.lessonStars.practice) missing.push('答啱練習');
    const missTxt = missing.length ? `仲欠：${missing.join('、')}。` : '三粒星齊晒！';
    body = `<h2>做得好！ ${speakBtn('做得好')}</h2>
      <p>聽完故事、明意思、答啱練習 → 三粒星。你呢次攞到 <b>${earned}</b> 粒星。</p>
      <p class="stars" style="font-size:1.6rem">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
      <p>${missTxt}「${idiom.idiom}」而家記錄 ${stars}★ · 總進度 ${learnedCount()}/${IDIOMS.length}。</p>`;
    autoSpeak(earned>=3
      ? `做得好！你攞齊三粒星，學咗${idiom.idiom}。`
      : `今次攞到${earned}粒星。${missTxt}`,'teacher');
  }
  const head = (cur === 'reward') ? '' : lessonStarsHeader();
  openPanel(head + body + lessonNavRow(cur, steps.length), { mode: 'lesson', hideClose: true });
  bindLessonBack(step);
  if (cur === 'story') {
    const ss = document.getElementById('storyScene');
    if (ss) {
      mountStoryPlayer(ss, idiom);
      speakStorySynced(idiom);
    }
  }
  if (cur!=='practice') {
    const next = document.getElementById('lessonNext');
    if (next) next.onclick = () => {
      if (cur==='reward') {
        if (lessonStarCount() < 3) {
          showToast('攞齊三粒星先可以去下一個成語');
          return;
        }
        Voice.stageCut();
        if (Town3D.clearIdiomExhibit) Town3D.clearIdiomExhibit();
        const nxt = findNextUnlearned(idiom);
        if (!nxt) {
          openCatalog({ celebrate: true });
          return;
        }
        startLesson(nxt);
        return;
      }
      // Award stars when leaving the relevant steps
      if (cur==='story') state.lessonStars.story = true;
      if (cur==='examples') state.lessonStars.meaning = true;
      state.lessonStep++; showLessonStep();
    };
  } else bindMiniQuiz(idiom);
}

function miniQuizHTML(idiom) {
  const wrong = IDIOMS.filter(x => x.id!==idiom.id && x.polarity!==idiom.polarity).slice(0,2);
  const opts = shuffle([idiom.meaning, ...wrong.map(w=>w.meaning)]).slice(0,3);
  while (opts.length<3) opts.push('完全唔相關嘅意思');
  const prompt = `「${idiom.idiom}」嘅意思係？`;
  const labeled = opts.map(o => ({t:o, ok:o===idiom.meaning}));
  return `<h2>小練習 ${speakBtn(prompt)}</h2>
    <p>${prompt}</p>
    <div id="qopts">${renderOptions(labeled)}</div>
    <div id="qfeed"></div>`;
}
function bindMiniQuiz(idiom) {
  const opts = [...document.querySelectorAll('#qopts .quiz-opt')];
  const prompt = `「${idiom.idiom}」嘅意思係？`;
  const texts = optionTextsFromButtons(opts);
  speakQuiz(prompt, texts);
  const speakAll = document.querySelector('#panel h2 .speak');
  if (speakAll) {
    speakAll.dataset.speak = encodeURIComponent(prompt + '。' + texts.map((t,i)=>optLabel(i)+'……'+t).join('、'));
  }
  function wireOpts() {
    opts.forEach(btn => btn.onclick = () => {
      const ok = btn.dataset.ok==='true';
      opts.forEach(o => o.disabled = true);
      btn.classList.add(ok?'correct':'softwrong');
      const feed = document.getElementById('qfeed');
      if (ok) {
        state.lessonStars.practice = true;
        feed.className = 'feedback';
        const praise = praiseKid();
        feed.innerHTML = `${praise}！答啱咗，攞到第 ★3 粒星！ ${speakBtn(praise + '，答啱咗')}`;
        speakFeedback(`${praise}！答啱咗，三粒星齊啦。`,'teacher');
        bindSpeak(feed);
        const row = document.createElement('div'); row.className='nav-row';
        row.innerHTML = `<button type="button" class="btn ghost" id="lessonBack">返回</button><button type="button" class="btn" id="lessonNext">下一頁</button>`;
        feed.appendChild(row);
        bindLessonBack(state.lessonStep);
        document.getElementById('lessonNext').onclick = () => { state.lessonStep++; showLessonStep(); };
      } else {
        feed.className = 'feedback soft';
        feed.innerHTML = `唔緊要，再試一次啦！唔好急。 <button type="button" class="btn secondary" id="qretry" style="margin-top:6px">再試一次</button>`;
        speakFeedback('唔緊要，再試一次啦！','teacher');
        const retry = document.getElementById('qretry');
        if (retry) retry.onclick = () => {
          opts.forEach(o => { o.disabled = false; o.classList.remove('softwrong','correct'); });
          feed.innerHTML = '';
          speakQuiz(prompt, texts);
          wireOpts();
        };
      }
    });
  }
  wireOpts();
}

function startPractice(idiom) {

/* Skill gym */
function openSkillGym() {
  Voice.stageCut();
  let html = `<h2>技巧健身房 ${speakBtn('成語技巧健身房')}</h2>
    <p>成語高手要識嘅技巧：</p><div class="skill-check">`;
  SKILL_DEFS.forEach(s => {
    const mastered = !!state.progress.skills[s.id];
    html += `<label><input type="checkbox" disabled ${mastered?'checked':''}> <span><b>${s.name}</b><br>${s.kid} ${speakBtn(s.kid)}</span>
      <button class="btn secondary" data-skill="${s.id}" style="padding:4px 10px;font-size:.8rem;margin-left:auto">練</button></label>`;
  });
  html += `</div><p class="detail">📖 延伸：間隔重複（Spaced repetition）——心理學家 Ebbinghaus（1885）發現，隔一段時間再温習，記得更耐。我哋嘅圖鑑同温習卡就係幫手。</p>`;
  openPanel(html + `<div class="nav-row"><button type="button" class="btn ghost" id="gymBack">返回</button></div>`);
  document.getElementById('gymBack').onclick = () => {
    Voice.stageCut();
    openCatalog();
  };
  document.querySelectorAll('[data-skill]').forEach(b => b.onclick = () => {
    const idiom = pickSkillIdiom();
    openSkillDrill(idiom, b.dataset.skill);
  });
  autoSpeak('呢度係技巧健身房，逐樣練成語高手技巧。','teacher');
}
function pickSkillIdiom() {
  const learned = Object.keys(state.progress.learned);
  if (learned.length) return IDIOMS.find(x=>x.id===learned[learned.length-1]) || IDIOMS[0];
  return IDIOMS[Math.floor(Math.random()*Math.min(40,IDIOMS.length))];
}

function openSkillDrill(idiom, skillId) {
  Voice.stageCut();
  const skill = SKILL_DEFS.find(s=>s.id===skillId) || SKILL_DEFS[0];
  const drills = buildDrills(idiom, skill.id);
  let di = 0;
  state.skillBack = { idiom, skillId };
  if (Town3D.showIdiomExhibit) Town3D.showIdiomExhibit(idiom);

  function showDrill() {
    Voice.stageCut();
    const d = drills[di];
    const phase = di===0 ? '引導' : '獨立';
    let html = `<h2>${skill.name} · ${phase} ${speakBtn(d.prompt)}</h2>
      <p>成語：<b>${idiom.idiom}</b></p>
      <p>${d.prompt}</p>
      <div id="dopts">${renderOptions(d.options)}</div>
      <div id="dfeed"></div>
      <div class="nav-row"><button type="button" class="btn ghost" id="drillBack">返回</button></div>`;
    if (d.input) html = `<h2>${skill.name} · ${phase} ${speakBtn(d.prompt)}</h2><p>${d.prompt}</p>
      <input type="text" id="dinput" placeholder="寫你嘅句子"><div class="nav-row"><button type="button" class="btn ghost" id="drillBack">返回</button><button type="button" class="btn" id="dsubmit">提交</button></div><div id="dfeed"></div>`;
    openPanel(html);
    document.getElementById('drillBack').onclick = () => {
      Voice.stageCut();
      if (di > 0) { di--; showDrill(); return; }
      // leave drill → skill gym
      if (Town3D.clearIdiomExhibit) Town3D.clearIdiomExhibit();
      openSkillGym();
    };
    if (d.input) {
      autoSpeak(d.prompt,'teacher');
      document.getElementById('dsubmit').onclick = () => {
        const v = document.getElementById('dinput').value.trim();
        const feed = document.getElementById('dfeed');
        if (v.length>=4 && v.includes(idiom.idiom)) {
          feed.className='feedback'; feed.textContent='好靚嘅句子！你用對咗成語。';
          speakFeedback('好靚嘅句子！','teacher'); finishDrill(true);
        } else {
          feed.className='feedback soft'; feed.textContent=`試吓句子入面用「${idiom.idiom}」，再寫長少少啦。`;
          speakFeedback('試吓句子入面用呢個成語。','teacher');
        }
      };
    } else {
      const opts=[...document.querySelectorAll('#dopts .quiz-opt')];
      const texts = optionTextsFromButtons(opts);
      speakQuiz(d.prompt, texts);
      opts.forEach(btn => btn.onclick = () => {
        const ok = btn.dataset.ok==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(ok?'correct':'softwrong');
        const feed=document.getElementById('dfeed');
        feed.className = ok?'feedback':'feedback soft';
        feed.innerHTML = (ok?d.okMsg:d.badMsg) + ' ' + speakBtn(ok?d.okMsg:d.badMsg);
        bindSpeak(feed);
        speakFeedback(ok?d.okMsg:d.badMsg,'teacher');
        finishDrill(ok);
      });
    }
  }
  function finishDrill(ok) {
    const row=document.createElement('div'); row.className='nav-row';
    const next = di < drills.length-1;
    row.innerHTML = `<button type="button" class="btn ghost" id="drillBack2">返回</button><button type="button" class="btn" id="dnext">${next?'下一題':'完成'}</button>`;
    document.getElementById('dfeed').appendChild(row);
    document.getElementById('drillBack2').onclick = () => {
      Voice.stageCut();
      if (di > 0) { di--; showDrill(); }
      else {
        if (Town3D.clearIdiomExhibit) Town3D.clearIdiomExhibit();
        openSkillGym();
      }
    };
    document.getElementById('dnext').onclick = () => {
      if (next) { di++; showDrill(); }
      else {
        if (ok || di>0) {
          state.progress.skills[skill.id] = true; save();
          showToast(`技巧「${skill.name}」記低咗！`);
        }
        Voice.stageCut();
        openCatalog();
      }
    };
  }
  showDrill();
}

function buildDrills(idiom, skill) {
  const near = IDIOMS.find(x => x.id!==idiom.id && x.polarity===idiom.polarity) || IDIOMS[1];
  if (skill==='literal') return [
    {prompt:`「${idiom.idiom}」而家多用邊種意思？`, options:[
      {t:'引申／比喻意思：'+idiom.meaning, ok:true},
      {t:'淨係字面，唔使想深層', ok:false},
      {t:'完全冇意思', ok:false}
    ], okMsg:'啱！成語多數用引申意思。', badMsg:'再諗：成語通常唔係淨睇字面。'},
    {prompt:`下面邊句用咗引申義？`, options:[
      {t:idiom.examples[0], ok:true},
      {t:`我喺度讀「${idiom.idiom}」四個字`, ok:false},
      {t:'今日天氣好好', ok:false}
    ], okMsg:'叻！呢句用咗比喻義。', badMsg:'搵用咗比喻嘅句子。'}
  ];
  if (skill==='polarity') return [
    {prompt:`「${idiom.idiom}」感情色彩？`, options:[
      {t:idiom.polarity, ok:true},
      {t:idiom.polarity==='褒'?'貶':'褒', ok:false},
      {t:'無法判斷', ok:false}
    ], okMsg:'正確！', badMsg:`參考：呢個成語偏「${idiom.polarity}」。`},
    {prompt:`邊個場合啱用「${idiom.idiom}」？`, options:[
      {t:idiom.polarity==='貶'?'勸人改錯時':'讚人或者中性描述時', ok:true},
      {t:idiom.polarity==='貶'?'隆重頒獎讚人':'當眾羞辱朋友', ok:false},
      {t:'任何場合亂用都得', ok:false}
    ], okMsg:'好，注意場合。', badMsg:'要配合褒貶同場合。'}
  ];
  if (skill==='context') return [
    {prompt:`「${idiom.idiom}」比較啱用喺？`, options:[
      {t:'學校或者屋企日常生活（例句情境）', ok:true},
      {t:'完全無關嘅化學公式', ok:false},
      {t:'對住石頭講就得', ok:false}
    ], okMsg:'明白對象同場合好重要。', badMsg:'睇返例句嘅場合。'},
    {prompt:`邊句場合更自然？`, options:[
      {t:idiom.examples[1], ok:true},
      {t:'我食咗一碗「'+idiom.idiom+'」麵', ok:false},
      {t:'成語可當人名呼叫', ok:false}
    ], okMsg:'呢句場合啱。', badMsg:'揀自然嘅場合。'}
  ];
  if (skill==='near') return [
    {prompt:`「${idiom.idiom}」同「${near.idiom}」一齊出現，邊個更貼近：${idiom.meaning.slice(0,24)}…`, options:[
      {t:idiom.idiom, ok:true},
      {t:near.idiom, ok:false},
      {t:'兩個完全一樣', ok:false}
    ], okMsg:'辨析成功！', badMsg:'對照兩個意思再揀。'},
    {prompt:`要用「${idiom.idiom}」唔好用近義亂換，點解？`, options:[
      {t:'對象、程度或者褒貶可能唔同', ok:true},
      {t:'因為字數一樣就可以換', ok:false},
      {t:'近義永遠可以亂換', ok:false}
    ], okMsg:'啱，近義都要辨析。', badMsg:'近義唔等於完全相等。'}
  ];
  if (skill==='grammar') return [
    {prompt:`「${idiom.idiom}」常見配搭，邊句較自然？`, options:[
      {t:idiom.examples[0], ok:true},
      {t:`好${idiom.idiom}咗三次飯`, ok:false},
      {t:`${idiom.idiom}係一隻鉛筆`, ok:false}
    ], okMsg:'配搭自然。', badMsg:'跟例句學配搭。'},
    {prompt:`成語多數係？`, options:[
      {t:'獨立使用嘅固定四字語，少改字', ok:true},
      {t:'可以隨便拆開加字', ok:false},
      {t:'一定要放句尾', ok:false}
    ], okMsg:'記住固定結構。', badMsg:'成語一般唔亂拆。'}
  ];
  if (skill==='error') return [
    {prompt:`改錯：佢「${idiom.idiom}」同埋意思重複再寫一次「${idiom.meaning.slice(0,8)}…」`, options:[
      {t:'刪重複解釋，淨留成語或淨留解釋', ok:true},
      {t:'再重複多兩次加強語氣', ok:false},
      {t:'唔使改', ok:false}
    ], okMsg:'避重複語意，叻！', badMsg:'病句常見係重複語意。'},
    {prompt:`邊句有語意重複問題？`, options:[
      {t:`大家齊心協力同心合力一齊做（重複）`, ok:true},
      {t:idiom.examples[0], ok:false},
      {t:'今日天氣晴朗', ok:false}
    ], okMsg:'搵到病句！', badMsg:'搵重複嘅嗰句。'}
  ];
  // sentence
  return [
    {prompt:`引導：用「${idiom.idiom}」仿寫——參考「${idiom.examples[0]}」改人物。`, input:true},
    {prompt:`獨立：寫一句全新情境，用「${idiom.idiom}」（學校／屋企／朋友都得）。`, input:true}
  ];
}

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }

function openDex() {
  Voice.stageCut();
  const ids = Object.keys(state.progress.learned);
  let html = `<h2>成語圖鑑 ${speakBtn('成語圖鑑')}</h2>
    <p>已收集 ${ids.length} 個。可以温習或者匯出温習卡。</p>
    <ul class="list">${ids.slice(-50).reverse().map(id=>{
      const it=IDIOMS.find(x=>x.id===id); if(!it) return '';
      return `<li><span><b>${it.idiom}</b><br><small>${it.meaning.slice(0,28)}…</small></span>
        <button class="btn ghost" data-rev="${id}" style="padding:4px 8px">温習</button></li>`;
    }).join('')||'<li>仲未有，去目錄學第一個啦！</li>'}</ul>
    <div class="btn-row"><button class="btn secondary" id="btnExportCard">匯出温習卡圖片</button></div>`;
  openPanel(html);
  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => {
    const it = IDIOMS.find(x=>x.id===b.dataset.rev);
    if (it) startLesson(it);
  });
  document.getElementById('btnExportCard').onclick = exportReviewCard;
  autoSpeak('呢度係圖鑑，可以温習同匯出温習卡。','teacher');
}

async function exportReviewCard() {
  const ids = Object.keys(state.progress.learned).slice(-6);
  const canvas = document.createElement('canvas');
  canvas.width = 720; canvas.height = 960;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff8ef'; ctx.fillRect(0,0,720,960);
  ctx.fillStyle = '#c0392b'; ctx.font = 'bold 36px sans-serif';
  ctx.fillText('成語小鎮 · 温習卡', 40, 60);
  ctx.fillStyle = '#2c2416'; ctx.font = '22px sans-serif';
  ctx.fillText(`${state.player.name} · ${new Date().toLocaleDateString('zh-HK')}`, 40, 100);
  let y = 150;
  ids.forEach(id => {
    const it = IDIOMS.find(x=>x.id===id); if(!it) return;
    ctx.font = 'bold 28px sans-serif'; ctx.fillText(it.idiom, 40, y);
    ctx.font = '20px sans-serif';
    wrapText(ctx, it.meaning, 40, y+32, 640, 28);
    y += 130;
  });
  if (!ids.length) { ctx.fillText('仲未有收集，去學成語啦！', 40, 180); }
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], 'chengyu-review.png', {type:'image/png'});
  if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({ files:[file], title:'成語温習卡' }); return; } catch(e){}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'chengyu-review.png'; a.click();
  showToast('温習卡已下載');
}
function wrapText(ctx, text, x, y, maxW, lh) {
  let line='', yy=y;
  for (const ch of text) {
    const test = line+ch;
    if (ctx.measureText(test).width > maxW) { ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line=test;
  }
  if (line) ctx.fillText(line,x,yy);
}

function openSettings() {
  Voice.stageCut();
  const twoDtxt = state.twoD.length ? state.twoD.join(', ') : '無（全部優先 3D）';
  openPanel(`<h2>設定 ${speakBtn('設定')}</h2>
    <div class="settings-grid">
      <label>自動朗讀 <input type="checkbox" id="sAuto" ${state.settings.autoPlay?'checked':''}></label>
      <label>語速 <input type="range" id="sRate" min="0.7" max="1.4" step="0.05" value="${state.settings.rate}"></label>
      <label>角色聲線微調（音高） <input type="checkbox" id="sPitch" ${state.settings.pitchRoles?'checked':''}></label>
    </div>
    <p class="detail">💬 語音：優先 zh-HK；冇廣東話會退回 zh-TW／zh-CN。裝置對 pitch／rate 支援唔一緻，有啲手機改音高效果好細——呢點係系統限制。</p>
    <p class="detail">2D 後備成語 id：${twoDtxt}</p>
    <p class="detail">📖 關於：成語小鎮 · 本地進度鍵 chengyuTown.v1 · Three.js CDN</p>
    <div class="btn-row">
      <button class="btn ghost" id="sReset">重設進度</button>
      <button class="btn secondary" id="sTheory">延伸閱讀</button>
    </div>`);
  document.getElementById('sAuto').onchange = e => { state.settings.autoPlay=e.target.checked; Voice.state.autoPlay=e.target.checked; save(); };
  document.getElementById('sRate').oninput = e => { state.settings.rate=+e.target.value; Voice.state.rate=+e.target.value; save(); };
  document.getElementById('sPitch').onchange = e => { state.settings.pitchRoles=e.target.checked; Voice.state.pitchRoles=e.target.checked; save(); };
  document.getElementById('sReset').onclick = () => {
    if (confirm('確定清晒進度？')) {
      state.progress = { learned:{}, stars:0, skills:{}, review:[] };
      save(); refreshHub(); showToast('進度已重設');
    }
  };
  document.getElementById('sTheory').onclick = () => {
    openPanel(`<h2>延伸閱讀 ${speakBtn('延伸閱讀')}</h2>
      <p>間隔重複：Ebbinghaus（1885）發現記憶會隨時間減退，定時温習記得更耐。圖鑑同温習卡就係幫你「隔陣再睇」。</p>
      <p>多元練習：VanPatten 等語言教學研究強調，要喺唔同情境用先記得牢——所以我哋有七種技巧操練。</p>
      <p>寓言故事：經典成語多出自《史記》《戰國策》《韓非子》等，聽故事再記意思，對小朋友特別啱。</p>
      <div class="btn-row"><button class="btn" id="backSet">返設定</button></div>`);
    document.getElementById('backSet').onclick = openSettings;
  };
}

function wireHub() {
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  bind('btnCatalog', () => openCatalog());
  bind('btnSkills', openSkillGym);
  bind('btnDex', openDex);
  bind('btnSettings', openSettings);
  bind('pauseBtn', () => Voice.togglePause());
  wireVoiceGestures();
}

function boot(idioms) {
  IDIOMS = idioms;
  // runtime verify
  if (!IDIOMS || IDIOMS.length < 200) {
    showToast('成語資料不足，請重新載入');
  }
  load();
  wireVoiceGestures();
  wireHub();
  renderStart();
  showScreen('start');
  // 3D town hidden — catalog / lesson are full-page UI only.
  state.twoD = [];
  const banner = document.getElementById('cdnBanner');
  if (banner) banner.classList.remove('show');
}

window.__chengyuBoot = boot;

window.addEventListener('DOMContentLoaded', function(){
  window.__chengyuBoot(IDIOMS);
});
</script>
