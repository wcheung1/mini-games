<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="優雅學院">
<meta name="theme-color" content="#1a0f33">
<title>星光優雅學院 Grace Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1a0f33;--night2:#2d1a52;--gold:#e8c46a;--gold2:#b48a2c;--goldlite:#fff3d6;
  --cream:#fffaf2;--ink:#3b2a4d;--ink2:#6d5a80;--rose:#f6c7d3;--rose2:#d9829a;
  --mint:#d7f1e4;--ok:#2f8a63;--no:#b9536a;--lav:#efe6fb;--sky:#e4eeff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% -10%,#4a2a7e 0%,#24134a 45%,#120a26 100%) fixed;
  color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;
  font-size:18px;line-height:1.65;touch-action:manipulation;overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
.serif{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(26,15,51,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(232,196,106,.3);color:var(--gold)}
.tb{width:46px;height:46px;border-radius:14px;border:1px solid rgba(232,196,106,.45);background:rgba(255,255,255,.06);
  color:var(--gold);font-size:22px;cursor:pointer;flex:none}
.tbtitle{flex:1;font-size:19px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbstars{font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(232,196,106,.15);white-space:nowrap}
#app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:18px 16px 90px}
h1,h2,h3{margin:.3em 0 .5em;line-height:1.35}
h2{font-size:26px}h3{font-size:20px}
.card{background:var(--cream);border-radius:24px;padding:22px;margin:0 0 18px;
  box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 0 0 1.5px rgba(232,196,106,.55)}
.center{text-align:center}
.small{font-size:15px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:10px 24px;
  border-radius:999px;border:none;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .15s, box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35}
.btn.gold{background:linear-gradient(135deg,#f8de94,#e0b44f 55%,#c4952f);color:#3a2610;box-shadow:0 6px 18px rgba(224,180,79,.45)}
.btn.rose{background:linear-gradient(135deg,#ffd5df,#e99ab0);color:#4a1f2c}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(180,138,44,.6)}
.btn.link{background:none;color:var(--gold);text-decoration:underline;min-height:44px}
.btn.xl{font-size:22px;min-height:64px;padding:12px 34px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin:8px 0}
.navrow .btn{flex:1}
/* speaker */
.spk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  border:none;background:var(--goldlite);box-shadow:inset 0 0 0 1.5px var(--gold2);font-size:17px;
  margin:0 8px 0 0;vertical-align:middle;cursor:pointer;flex:none;padding:0;line-height:1;position:relative;top:-2px}
.spk.playing{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,196,106,.7)}50%{box-shadow:0 0 0 8px rgba(232,196,106,0)}}
/* splash */
.splash{text-align:center;color:#fff;padding:30px 6px 10px;min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emblem{position:relative;width:190px;height:190px;margin:0 auto 14px}
.halo{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(248,222,148,.55),rgba(248,222,148,0) 65%);animation:breathe 4s ease-in-out infinite}
.ring2{position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 30px rgba(232,196,106,.6),inset 0 0 30px rgba(232,196,106,.35)}
.ring2::before{content:'';position:absolute;inset:10px;border-radius:50%;border:1.5px dashed rgba(232,196,106,.7);animation:spin 40s linear infinite}
.ring2::after{content:'✦';position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:24px}
.swan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;animation:float 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.shimmer{font-size:clamp(38px,8vw,64px);margin:6px 0 0;letter-spacing:6px;
  background:linear-gradient(100deg,#c79a3a 10%,#fff6d8 30%,#e8c46a 50%,#fff6d8 70%,#c79a3a 90%);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% center}}
.en{letter-spacing:8px;color:var(--gold);font-size:15px;margin-bottom:18px}
.lead{font-size:clamp(20px,3.6vw,26px);max-width:620px;margin:0 auto 18px;color:#fff8ea}
.pillars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 26px}
.pillar{background:rgba(255,255,255,.08);border:1px solid rgba(232,196,106,.45);border-radius:18px;padding:12px 14px;width:180px;color:#fff;font-size:15px;text-align:left}
.pillar b{display:block;color:var(--gold);font-size:19px}
.hint{color:#e9dcff;font-size:15px;margin-top:18px}
.doors{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex}
.door{flex:1;background:linear-gradient(135deg,#2d1a52,#1a0f33);border:3px solid var(--gold);transition:transform 1.3s cubic-bezier(.7,0,.3,1)}
.door.l{border-right-width:1.5px}.door.r{border-left-width:1.5px}
.doors.open .door.l{transform:translateX(-102%)}.doors.open .door.r{transform:translateX(102%)}
/* home */
.hello{display:flex;gap:14px;align-items:center}
.avatar{width:70px;height:70px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#f4e2b0);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 0 3px var(--gold)}
.bubble{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px rgba(180,138,44,.35);flex:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.qbtn{background:rgba(255,255,255,.09);border:1px solid rgba(232,196,106,.45);border-radius:20px;color:#fff;
  padding:14px 6px;text-align:center;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit}
.qbtn span{display:block;font-size:34px;margin-bottom:4px}
.maptitle{color:var(--gold);text-align:center;font-size:24px;letter-spacing:3px;margin:16px 0 4px}
.map{position:relative;padding:10px 0}
.map::before{content:'';position:absolute;left:50%;top:30px;bottom:30px;border-left:3px dashed rgba(232,196,106,.45)}
.node{position:relative;display:flex;align-items:center;gap:14px;width:78%;margin:14px 0;cursor:pointer;
  background:var(--cream);border-radius:22px;padding:14px 16px;box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 0 0 1.5px rgba(232,196,106,.6)}
.node.r{margin-left:auto}
.node.locked{filter:grayscale(.85);opacity:.7}
.medal{width:70px;height:70px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,#fffbea,#f1d48a 60%,#c99a35);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.node.done .medal{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold),0 0 22px rgba(232,196,106,.9)}
.ntitle{font-weight:700;font-size:19px}
.nsub{font-size:14px;color:var(--ink2)}
.nstars{color:#d9a520;letter-spacing:2px;font-size:18px}
.personamini{display:flex;align-items:center;gap:12px;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bdg{background:var(--goldlite);border-radius:999px;padding:4px 12px;font-size:14px;box-shadow:inset 0 0 0 1px var(--gold2)}
.warn{background:#fff0f3;border-radius:16px;padding:12px 14px;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--rose2);margin-bottom:16px}
/* lesson */
.chhead{display:flex;gap:12px;align-items:center;color:#fff;margin-bottom:8px}
.chicon{font-size:44px}
.chtitle{font-size:24px;color:var(--gold)}
.chsub{color:#e7dbff;font-size:15px}
.dots{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:8px;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold)}
.lesson{position:relative;padding-top:26px;min-height:300px}
.mascot{position:absolute;top:-18px;right:18px;background:#fff;border-radius:999px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 0 0 1.5px var(--gold)}
.mascot span{font-size:28px}.mascot small{font-weight:700;color:var(--gold2)}
.lemoji{font-size:76px;text-align:center;line-height:1.1;margin:8px 0 10px}
.ltext{font-size:clamp(20px,3.3vw,25px);line-height:1.75}
.ex{background:var(--lav);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:19px;line-height:1.8}
.tip{background:var(--goldlite);border-radius:16px;padding:12px 16px;margin-top:12px;font-weight:700;font-size:18px;box-shadow:inset 0 0 0 1.5px rgba(180,138,44,.4)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:none;opacity:1}}
/* games */
.prog{display:inline-block;background:var(--lav);border-radius:999px;padding:3px 14px;font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.scen{font-size:21px;font-weight:500;background:var(--sky);border-radius:16px;padding:14px 16px}
.choice{display:block;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer;
  font-size:19px;box-shadow:0 3px 0 rgba(180,138,44,.35),inset 0 0 0 2px rgba(180,138,44,.45);transition:transform .12s;user-select:none;-webkit-user-select:none}
.choice:active{transform:scale(.98)}
.choice.right{background:var(--mint);box-shadow:inset 0 0 0 3px var(--ok)}
.choice.wrong{background:#fde8ed;box-shadow:inset 0 0 0 2px var(--no);opacity:.7}
.choice.meh{background:#fff4e2;box-shadow:inset 0 0 0 3px #d39a3a}
.choice.off{opacity:.45}
.fb{display:none;border-radius:16px;padding:14px 16px;margin-top:10px;font-size:18px}
.fb.show{display:block;animation:pop .35s}
.fb.ok{background:var(--mint)}
.fb.no{background:#fff1e6}
.fb .btn{margin-top:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.slot{min-height:100px;border-radius:18px;border:2.5px dashed rgba(180,138,44,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;color:rgba(180,138,44,.6);text-align:center;padding:6px}
.slot.filled{border-style:solid;background:var(--goldlite);color:var(--ink);font-size:22px}
.slot small{font-size:13px;line-height:1.3;color:var(--ink2)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
.tile{background:#fff;border-radius:16px;padding:12px 18px;font-size:22px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:0 4px 0 rgba(180,138,44,.45),inset 0 0 0 2px rgba(180,138,44,.55)}
.tile:active{transform:translateY(2px)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hold{text-align:center;margin:10px 0}
.ring{width:160px;height:160px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:conic-gradient(var(--gold) var(--p,0deg),#eadff5 0);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s}
.ring.on{transform:scale(1.07)}
.ringin{width:128px;height:128px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--gold2);pointer-events:none}
.radar{display:flex;gap:12px;justify-content:center;margin:10px 0}
.rad{width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-size:18px;font-weight:700;
  background:radial-gradient(circle,#fff 40%,#d9ecff);box-shadow:0 0 0 3px #8db7e8;color:var(--ink)}
.rad span{display:block;font-size:30px}
.rad.done{background:radial-gradient(circle,#fff 40%,#d6f2e4);box-shadow:0 0 0 3px var(--ok)}
.clue{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:inset 0 0 0 1.5px #8db7e8;animation:pop .35s}
.scale{position:relative;height:96px;margin:4px auto 10px;width:260px}
.beam{position:absolute;left:10px;right:10px;top:26px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.pan{position:absolute;top:6px;font-size:36px}.pan.l{left:-6px}.pan.r{right:-6px}
.pivot{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:56px solid var(--gold2)}
.sortcard{background:#fff;border-radius:20px;padding:20px;font-size:23px;font-weight:500;margin:6px auto 14px;max-width:600px;box-shadow:0 8px 20px rgba(0,0,0,.12),inset 0 0 0 2px var(--gold);animation:pop .4s;text-align:left}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{text-align:center;font-weight:700;font-size:22px}
.sbtn small{font-weight:400;font-size:15px}
.scene{position:relative;width:100%;padding-top:66%;border-radius:20px;overflow:hidden;margin:10px 0;box-shadow:inset 0 0 0 2px rgba(180,138,44,.5)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:rgba(255,255,255,.45)}
.scene .it{position:absolute;transform:translate(-50%,-50%);font-size:clamp(38px,7.5vw,60px);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .2s;line-height:1}
.scene .it:active{transform:translate(-50%,-50%) scale(1.15)}
.scene .it.found{filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 4px #ffd34d)}
.scene .it.found::after{content:'✔';position:absolute;right:-10px;top:-10px;font-size:18px;background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.gates{display:flex;justify-content:center;gap:12px;margin:12px 0}
.gate{width:90px;padding:8px 4px;border-radius:40px 40px 10px 10px;background:#f2ebfa;text-align:center;font-weight:700;box-shadow:inset 0 0 0 2px #b9a6d6}
.gate span{display:block;font-size:30px}
.gate.pass{background:var(--mint);box-shadow:inset 0 0 0 3px var(--ok)}
.gate.block{background:#fde8ed;box-shadow:inset 0 0 0 3px var(--no)}
.line{min-height:76px;border-radius:18px;background:#fff;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:inset 0 0 0 2px var(--gold);margin:10px 0}
.line .tile{font-size:19px;padding:10px 14px}
.pool .tile{font-size:19px;padding:10px 14px}
.chip{display:inline-block;background:#fff;border-radius:999px;padding:10px 18px;margin:6px;cursor:pointer;font-size:18px;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 2px rgba(180,138,44,.5)}
.chip.on{background:linear-gradient(135deg,#f8de94,#e7bd5c);box-shadow:inset 0 0 0 2px var(--gold2);font-weight:700}
.input{width:100%;font-size:20px;padding:12px 16px;border-radius:14px;border:2px solid rgba(180,138,44,.5);font-family:inherit;background:#fff}
.pcard{position:relative;border-radius:26px;padding:28px 22px 22px;text-align:center;color:#3a2610;
  background:linear-gradient(160deg,#fffaf0,#fdeec8 60%,#f7dca0);box-shadow:0 14px 40px rgba(0,0,0,.3),inset 0 0 0 3px var(--gold),inset 0 0 0 7px #fffaf0,inset 0 0 0 8.5px var(--gold2)}
.pcard .crown{font-size:56px}
.pcard .pname{font-size:32px;margin:4px 0}
.pcard .words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.pcard .words b{background:#fff;border-radius:999px;padding:4px 14px;box-shadow:inset 0 0 0 1.5px var(--gold2)}
.ptext{text-align:left;font-size:19px;line-height:1.8}
.meters{display:grid;gap:6px;margin:8px 0 12px}
.meter{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.meter span{width:78px;flex:none}
.bar{flex:1;height:14px;border-radius:14px;background:#eee4f7;overflow:hidden}
.bar b{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,#f6b5c6,#e8c46a);transition:width .6s}
.scene-emoji{font-size:64px;text-align:center}
.sq{font-size:21px}
.storylist{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.storycard{background:var(--cream);border-radius:22px;padding:18px;cursor:pointer;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 0 0 1.5px var(--gold)}
.sicon{font-size:56px}.stitle{font-weight:700;font-size:20px}.ssub{font-size:15px;color:var(--ink2)}
.done{color:var(--ok);font-weight:700}
.reward .badge{font-size:90px;animation:float 3s ease-in-out infinite}
.starsbig{font-size:46px;color:#e2ac22;letter-spacing:6px}
.starsbig .dim{color:#e5dccf}
ul.learned{text-align:left;max-width:560px;margin:8px auto;padding-left:0;list-style:none}
ul.learned li{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:inset 0 0 0 1.5px rgba(180,138,44,.35)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px rgba(180,138,44,.45)}
.vcard.lock{background:#f1ecf5;color:#998aa8}
.vcard h3{font-size:19px;margin:2px 0 6px}
.vcard .how{background:var(--goldlite);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:16px}
.basic{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.basic div{background:#fff;border-radius:14px;padding:10px 14px;font-size:16px;box-shadow:inset 0 0 0 1px rgba(180,138,44,.35)}
.balloon{width:150px;height:150px;margin:30px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f6c7d3 45%,#d9829a);
  box-shadow:0 10px 30px rgba(217,130,154,.5);transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#5a2234}
.emos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.emo{background:#fff;border-radius:18px;padding:12px 4px;text-align:center;cursor:pointer;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(180,138,44,.45)}
.emo span{display:block;font-size:40px}
.jlist{font-size:15px}
.jlist div{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;box-shadow:inset 0 0 0 1px rgba(180,138,44,.3)}
.pg h3{color:var(--gold2)}
.pg p,.pg li{font-size:17px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;visibility:hidden;z-index:70;max-width:92vw;
  background:#2d1a52;color:#fff;border:1.5px solid var(--gold);border-radius:18px;padding:12px 18px;font-size:17px;transition:transform .35s,opacity .35s,visibility .35s;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

<script>

'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const app=$('#app');
const KEY='graceAcademy_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
const S=Object.assign({stars:{},badges:[],persona:null,journal:[],flowers:0,rate:0.95,auto:true,unlockAll:false,storyBest:{},entered:false},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function nl(s){return String(s).replace(/\n/g,'<br>')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------------- 廣東話語音 ---------------- */
const TTS={voice:null,ok:false,cur:null,token:0,
  init(){
    if(!('speechSynthesis' in window))return;
    const pick=()=>{
      const vs=speechSynthesis.getVoices()||[];
      this.voice=vs.find(v=>/^(zh[-_]HK|yue)/i.test(v.lang))||vs.find(v=>/cantonese|粵|廣東|sin-?ji|善怡|hiugaai|hiumaan|wanlung|tracy|danny/i.test(v.name))||null;
      this.ok=!!this.voice;
    };
    pick();
    try{speechSynthesis.addEventListener('voiceschanged',pick)}catch(e){speechSynthesis.onvoiceschanged=pick}
  },
  clean(t){
    return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{1F1E6}-\u{1F1FF}]/gu,' ')
      .replace(/[＿_]{2,}/g,'某某').replace(/[✦★☆✔]/g,' ').replace(/\s+/g,' ').trim();
  },
  chunks(t){
    const parts=t.match(/[^。！？!?；\n]+[。！？!?；\n]*/g)||[t];
    const out=[];let buf='';
    parts.forEach(p=>{if((buf+p).length>120&&buf){out.push(buf);buf=p}else buf+=p});
    if(buf.trim())out.push(buf);return out;
  },
  speak(text,btn,onend){
    if(!('speechSynthesis' in window)){toast('呢部機唔支援語音朗讀',false);return}
    const wasBtn=this.cur;
    const wasSpeaking=speechSynthesis.speaking||speechSynthesis.pending;
    this.stop();
    if(btn&&wasBtn===btn)return;
    const t=this.clean(text);if(!t)return;
    const cs=this.chunks(t);const token=++this.token;
    this.cur=btn||null;if(btn)btn.classList.add('playing');
    const run=()=>{
      if(token!==this.token)return;
      cs.forEach((c,i)=>{
        const u=new SpeechSynthesisUtterance(c);
        u.lang='zh-HK';if(this.voice)u.voice=this.voice;u.rate=S.rate;u.pitch=1.05;
        if(i===cs.length-1){
          u.onend=()=>{if(token===this.token){this.done();if(onend)onend()}};
          u.onerror=()=>{if(token===this.token)this.done()};
        }
        speechSynthesis.speak(u);
      });
    };
    if(wasSpeaking)setTimeout(run,80);else run();
  },
  done(){if(this.cur)this.cur.classList.remove('playing');this.cur=null},
  stop(){this.token++;try{speechSynthesis.cancel()}catch(e){}this.done()}
};
TTS.init();
document.addEventListener('pointerdown',function unlock(){
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='zh-HK';speechSynthesis.speak(u)}catch(e){}
  document.removeEventListener('pointerdown',unlock);
});
function textOf(el){if(!el)return '';const c=el.cloneNode(true);$$('.spk,.nosay',c).forEach(x=>x.remove());return c.textContent}
function addSpk(root){
  $$('.say',root||document).forEach(el=>{
    if(el.querySelector(':scope > .spk'))return;
    const b=document.createElement('button');b.className='spk';b.type='button';b.setAttribute('aria-label','播放廣東話');b.textContent='🔈';
    el.insertBefore(b,el.firstChild);
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.spk');if(!b)return;
  e.stopPropagation();e.preventDefault();
  TTS.speak(b.dataset.t||textOf(b.closest('.say')),b);
},true);
function autoSay(el){if(S.auto&&el)TTS.speak(textOf(el),el.querySelector('.spk'))}

/* ---------------- 音效 ---------------- */
let AC=null;
function tone(fs,dur,type,vol){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;dur=dur||.12;vol=vol||.07;
    fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
      const s=t0+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur*2.4);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur*2.6)});
  }catch(e){}
}
const SFX={ok:()=>tone([660,880,1320],.1),no:()=>tone([392,330],.13,'triangle',.05),tap:()=>tone([988],.05,'sine',.04),win:()=>tone([523,659,784,1047,1319],.11)};

/* ---------------- 小工具 ---------------- */
function render(html){app.innerHTML=html;addSpk(app)}
function toast(m,sp){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3400);if(sp!==false&&S.auto)TTS.speak(m)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function confetti(){const box=document.createElement('div');box.className='confetti';const em=['✨','⭐','🌸','💎','🎀','💫','🌟'];
  for(let i=0;i<46;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';
    s.style.animationDelay=Math.random()*.9+'s';s.style.fontSize=(16+Math.random()*22)+'px';box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4500)}
function starsHtml(n){let h='';for(let i=0;i<3;i++)h+=i<n?'★':'<span class="dim">★</span>';return h}

function unlocked(i){return i===0||S.unlockAll||!!S.stars[CH[i-1].id]}

/* 按住三秒（深呼吸）元件 */
function holdButton(el,ms,label,onDone,icon,words){
  icon=icon||'🛑';if(words===undefined)words=['吸…','停…','呼…'];
  el.innerHTML='<div class="hold"><div class="ring"><div class="ringin">'+icon+'</div></div><div class="say small">'+label+'</div></div>';addSpk(el);
  const ring=$('.ring',el),inner=$('.ringin',el);let start=0,raf=0,done=false;
  const tick=()=>{const p=Math.min(1,(performance.now()-start)/ms);ring.style.setProperty('--p',(p*360)+'deg');
    if(words)inner.textContent=p<.34?words[0]:p<.67?words[1]:words[2];
    if(p>=1){done=true;ring.classList.remove('on');inner.textContent='✨';SFX.ok();onDone();return}raf=requestAnimationFrame(tick)};
  const down=e=>{if(done)return;e.preventDefault();start=performance.now();ring.classList.add('on');SFX.tap();raf=requestAnimationFrame(tick)};
  const up=()=>{if(done)return;cancelAnimationFrame(raf);ring.classList.remove('on');ring.style.setProperty('--p','0deg');inner.textContent=icon};
  ring.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>ring.addEventListener(ev,up));
  ring.addEventListener('contextmenu',e=>e.preventDefault());
}

/* 選擇題元件（可以再試，答錯唔扣分） */
function choiceSet(box,list,done,noShuffle){
  let wrong=0;const arr=noShuffle?list.map((c,i)=>Object.assign({},c,{i:i})):shuffle(list.map((c,i)=>Object.assign({},c,{i:i})));
  box.innerHTML=arr.map(c=>'<div class="choice say" role="button" tabindex="0" data-i="'+c.i+'">'+c.t+'</div>').join('')+'<div class="fb"></div>';
  addSpk(box);
  $$('.choice',box).forEach(b=>b.onclick=()=>{
    if(b.classList.contains('off'))return;
    const c=list[+b.dataset.i];const fb=$('.fb',box);
    fb.className='fb show '+(c.ok?'ok':'no');
    fb.innerHTML='<p class="say" style="margin:0">'+(c.ok?'✨ 好有 class！':'🤍 唔緊要，再諗多一次。')+c.fb+'</p>';addSpk(fb);autoSay(fb.firstChild);
    if(c.ok){SFX.ok();b.classList.add('right');$$('.choice',box).forEach(x=>x.classList.add('off'));
      const n=document.createElement('button');n.className='btn gold';n.textContent='下一步 ▶';n.onclick=()=>done(wrong===0);fb.appendChild(n);
      setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'center'}),100);
    }else{SFX.no();b.classList.add('wrong','off');wrong++}
  });
}

/* 第一關 A：排次序 */
function g1(i){
  const steps=[['🛑','停','停三秒，深呼吸'],['👀','睇','雷達：人、時、地'],['🤔','諗','大事定小事？'],['💎','揀','最大方得體']];

  let nx=0;
  render(`<div class="card"><span class="prog">練習一</span><h2 class="serif say">優雅四步排排隊</h2>

   <div id="g1done"></div></div>`);
  autoSay($('.card p.say'));
  $$('.pool .tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
    if(j===nx){SFX.ok();const sl=$('#slot'+j);sl.innerHTML=`<b>${steps[j][0]} ${steps[j][1]}</b><small>${steps[j][2]}</small>`;sl.classList.add('filled');b.remove();nx++;
      if(nx===4){const d=$('#g1done');d.innerHTML=`<div class="fb show ok"><p class="say" style="margin:0">✨ 完全正確！停、睇、諗、揀。下一個練習，我哋要喺真實情境入面用佢！</p><button class="btn gold" id="g1n">下一個練習 ▶</button></div>`;addSpk(d);autoSay($('p',d));$('#g1n').onclick=()=>g1b(i)}
    }else{SFX.no();shake(b);toast(hint[nx])}

/* 第一關 B：真實情境（按住停→雷達→諗→揀） */
function g1b(i){
  let k=0,score=0;
  const show=()=>{const s=G1[k];
    render(`<div class="card"><span class="prog">練習二・情境 ${k+1} / ${G1.length}</span>
     <p class="say scen">${s.q}</p><div id="area"></div></div>`);
    autoSay($('.scen'));
    const area=$('#area');
    area.innerHTML='<h3 class="say">第一步：🛑 停</h3><div id="hold"></div>';addSpk(area);
    holdButton($('#hold'),3000,'按住個圈三秒，跟住慢慢深呼吸。',radar);
    function radar(){
      area.innerHTML=`<h3 class="say">第二步：👀 睇 —— 撳雷達三個位置，搵線索</h3>
       <div class="radar">${['人','時','地'].map((n,j)=>`<button class="rad" data-j="${j}"><span>${['👥','⏰','📍'][j]}</span>${n}</button>`).join('')}</div><div id="clues"></div>`;
      addSpk(area);autoSay($('h3',area));
      const seen={};let cnt=0;
      $$('.rad',area).forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(seen[j])return;seen[j]=1;cnt++;b.classList.add('done');SFX.tap();
        const p=document.createElement('p');p.className='say clue';p.textContent=['👥 人','⏰ 時','📍 地'][j]+'：'+s.r[j];$('#clues').appendChild(p);addSpk(p);autoSay(p);
        if(cnt===3)setTimeout(think,1200)});
    }
    function think(){
      const d=document.createElement('div');
      d.innerHTML=`<h3 class="say">第三步：🤔 諗 —— ${s.think}</h3><h3 class="say">第四步：💎 揀 —— 你會點做？</h3><div id="opts"></div>`;
      area.appendChild(d);addSpk(d);autoSay(d);
      choiceSet($('#opts'),s.c,first=>{if(first)score++;k++;if(k<G1.length)show();else finishGame(i,score>=4?3:score>=2?2:1)});

    }

}

        $('#nx').onclick=()=>{k++;if(k<items.length)show();else finishGame(i,score>=11?3:score>=8?2:1)};
      }else{SFX.no();first=false;b.classList.add('wrong','off');fb.innerHTML='<p class="say" style="margin:0">🤍 再用魔法三問秤一次：有冇人受傷？一個禮拜之後仲重唔重要？</p>';addSpk(fb);autoSay($('p',fb))}

/* 第三關：偵探搵線索 */
function g3(i){
  let k=0,score=0;
  const show=()=>{const s=G3[k];const need=s.items.filter(x=>x.clue).length;let found=0,miss=0;
    render(`<div class="card"><span class="prog">場景 ${k+1} / ${G3.length}：${s.title}</span>
     <p class="say">偵探任務：喺圖入面搵出 ${need} 個重要線索！唔重要嘅嘢唔使理。</p>
     <div class="scene" style="background:${s.bg}"><div class="floor"></div>${s.items.map((x,j)=>`<div class="it" role="button" data-j="${j}" style="left:${x.x}%;top:${x.y}%">${x.e}</div>`).join('')}</div>
     <div class="small" id="cnt">🔍 線索：0 / ${need}</div><div id="clues"></div><div id="ded"></div></div>`);
    autoSay($('.card p.say'));
    $$('.scene .it').forEach(el=>el.onclick=()=>{const x=s.items[+el.dataset.j];

      if(el.classList.contains('found'))return;
      el.classList.add('found');found++;SFX.ok();$('#cnt').textContent='🔍 線索：'+found+' / '+need;
      const p=document.createElement('p');p.className='say clue';p.textContent=x.e+' '+x.clue;$('#clues').appendChild(p);addSpk(p);autoSay(p);
      if(found===need)setTimeout(()=>{
        const d=$('#ded');d.innerHTML=`<h3 class="say">🧩 推斷時間：${s.ask}</h3><div id="opts"></div>`;addSpk(d);autoSay($('h3',d));
        choiceSet($('#opts'),s.c,first=>{if(first)score++;k++;if(k<G3.length)show();else finishGame(i,Math.max(1,score))});
        setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),150);
      },1400);
    });
  };
  show();
}

/* 第四關：三道魔法門 + 砌句子 */
function g4(i){
  let k=0,score=0;
  const show=()=>{const g=GATES[k];
    render(`<div class="card"><span class="prog">練習一・三道魔法門 ${k+1} / ${GATES.length}</span>
     <p class="say small">呢句說話，過唔過到三道門？如果過唔到，佢會卡喺邊一道？</p>
     <div class="sortcard say">${g.s}</div>
     <div class="gates"><div class="gate" id="gt0"><span>🚪</span>真</div><div class="gate" id="gt1"><span>🚪</span>善</div><div class="gate" id="gt2"><span>🚪</span>需要</div></div>
     <div id="opts"></div></div>`);
    autoSay($('.sortcard'));
    const list=GATE_OPTS.map((t,j)=>({t:t,ok:j===g.a,fb:g.fb}));
    choiceSet($('#opts'),list,first=>{if(first)score++;k++;if(k<GATES.length)show();else build(score)},true);
    $$('#opts .choice').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.i!==g.a)return;
      for(let j=0;j<3;j++){const e=$('#gt'+j);if(j<g.a||g.a===3)e.classList.add('pass');else if(j===g.a)e.classList.add('block')}}));
  };
  const build=gScore=>{
    let k2=0,bScore=0;
    const showB=()=>{const b=BUILD[k2];let line=[],mist=0;
      const pool=shuffle(b.ans.map(t=>({t:t,trap:false})).concat(b.trap.map(t=>({t:t,trap:true}))));
      render(`<div class="card"><span class="prog">練習二・魔法句子砌砌樂 ${k2+1} / ${BUILD.length}</span>
       <p class="say scen">情境：${b.sit}</p>
       <p class="say small">撳下面嘅字卡，砌一句最有禮貌嘅說話。小心！有啲字卡係「陷阱」，會令句說話變得冇禮貌。</p>
       <div class="line" id="line"><span class="small" id="ph">（喺度砌句子）</span></div>
       <div class="pool" id="pool"></div><div class="center" style="margin-top:12px"><button class="btn ghost" id="reset">↺ 重新嚟過</button></div><div class="fb" id="bfb"></div></div>`);
      autoSay($('.scen'));
      const drawPool=()=>{$('#pool').innerHTML=pool.map((p,j)=>p.used?'':`<div class="tile" role="button" data-j="${j}">${p.t}</div>`).join('');
        $('#line').innerHTML=line.length?line.map((j,n)=>`<div class="tile" role="button" data-n="${n}">${pool[j].t}</div>`).join(''):'<span class="small">（喺度砌句子）</span>';
        $$('#pool .tile').forEach(t=>t.onclick=()=>{const p=pool[+t.dataset.j];
          if(p.trap){SFX.no();shake(t);mist++;toast('「'+p.t+'」係陷阱字卡！佢會令人唔舒服，唔要佢。');return}
          SFX.tap();p.used=true;line.push(+t.dataset.j);drawPool();check()});
        $$('#line .tile').forEach(t=>t.onclick=()=>{const n=+t.dataset.n;pool[line[n]].used=false;line.splice(n,1);drawPool()});
      };
      const check=()=>{if(line.length<b.ans.length)return;
        const sent=line.map(j=>pool[j].t).join('');
        if(sent===b.ans.join('')){SFX.ok();if(mist===0)bScore++;const fb=$('#bfb');fb.className='fb show ok';
          fb.innerHTML=`<p class="say" style="margin:0">✨ 「${sent}」${b.fb}</p><button class="btn gold" id="bn">下一句 ▶</button>`;addSpk(fb);autoSay($('p',fb));
          $$('#pool .tile,#line .tile').forEach(t=>t.onclick=null);
          $('#bn').onclick=()=>{k2++;if(k2<BUILD.length)showB();else{const tot=gScore+bScore;finishGame(i,tot>=9?3:tot>=6?2:1)}};
        }else{SFX.no();mist++;toast('次序好似唔係好順，讀一讀，再試多次！');shake($('#line'))}
      };
      $('#reset').onclick=()=>{line=[];pool.forEach(p=>p.used=false);drawPool()};
      drawPool();
    };
    showB();
  };
  show();
}

function g6(i){
  render(`<div class="card"><h2 class="serif say">揀一個故事挑戰</h2><p class="say">每個選擇都會改變故事。用心諗清楚，再揀！完成任何一個故事就可以過關。</p></div>

  autoSay($('.card p.say'));

function playStory(s,i){
  let k=0,best=0;const m=[5,5,5];
  const bars=()=>`<div class="meters">${['💗 友誼','💎 尊重','🌟 優雅'].map((n,j)=>`<div class="meter"><span>${n}</span><div class="bar"><b style="width:${m[j]*10}%"></b></div></div>`).join('')}</div>`;
  const show=()=>{const n=s.nodes[k];
    render(`<div class="card"><span class="prog">${s.icon} ${s.title}・第 ${k+1} / ${s.nodes.length} 幕</span><div id="mt">${bars()}</div>
     <div class="scene-emoji">${n.e}</div><p class="say sq">${n.q}</p><p class="say small">記住：停、睇、諗、揀。</p><div id="opts"></div></div>`);
    autoSay($('.sq'));
    const box=$('#opts');
    box.innerHTML=shuffle(n.c.map((c,j)=>Object.assign({},c,{j:j}))).map(c=>`<div class="choice say" role="button" data-j="${c.j}">${c.t}</div>`).join('')+'<div class="fb"></div>';addSpk(box);
    let done=false;
    $$('.choice',box).forEach(b=>b.onclick=()=>{if(done)return;done=true;const c=n.c[+b.dataset.j];
      c.d.forEach((v,j)=>{m[j]=Math.max(0,Math.min(10,m[j]+v))});
      if(c.best){best++;SFX.ok()}else SFX.no();
      b.classList.add(c.best?'right':'meh');$$('.choice',box).forEach(x=>{if(x!==b)x.classList.add('off')});
      $('#mt').innerHTML=bars();
      const fb=$('.fb',box);fb.className='fb show '+(c.best?'ok':'no');
      const better=n.c.find(x=>x.best);
      fb.innerHTML=`<p class="say" style="margin:0">${c.best?'✨ ':'🤍 '}${c.fb}</p>${c.best?'':`<p class="say small">💡 更有 class 嘅做法：${better.t}</p>`}<button class="btn gold" id="sn">${k<s.nodes.length-1?'繼續故事 ▶':'睇結局 ▶'}</button>`;
      addSpk(fb);autoSay(fb);
      $('#sn').onclick=()=>{k++;if(k<s.nodes.length)show();else ending()};
      setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'center'}),150);
    });
  };
  const ending=()=>{
    S.storyBest[s.id]=Math.max(S.storyBest[s.id]||0,best);save();
    const st=best===5?3:best>=3?2:1;
    const txt=best===5?'🌟 完美優雅結局！你每一步都用咗心法。身邊嘅人因為你，覺得舒服、安心、被尊重。大家都好想同你做朋友！'
      :best>=3?'💎 優雅練習生結局！你大部分時間都好有 class。再諗下其他選擇，下次會更加好！'
      :'🌱 種子結局！冇問題，每個高手都係由一粒種子開始。試多一次，揀唔同嘅選擇，睇下故事會點樣變！';
    render(`<div class="card center pop"><div style="font-size:70px">${best===5?'🏆':best>=3?'💎':'🌱'}</div><h2 class="serif">故事結局</h2>${bars()}
     <p class="say ltext">${txt}</p><p class="say">你揀中咗 ${best} 個最有 class 嘅做法（滿分 5 個）。</p>
     <div class="row" style="justify-content:center"><button class="btn ghost" id="again">↺ 再玩一次</button><button class="btn gold" id="fin">完成挑戰 ▶</button></div></div>`);
    if(best===5){confetti();SFX.win()}autoSay($('.ltext'));
    $('#again').onclick=()=>playStory(s,i);$('#fin').onclick=()=>finishGame(i,st);
  };
  show();
}

(function(){const c=$('#sky'),x=c.getContext('2d');let W=0,H=0;const dpr=Math.min(2,window.devicePixelRatio||1);
  const rs=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};rs();addEventListener('resize',rs);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P=[];for(let i=0;i<(reduce?25:70);i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,s:Math.random()*.0004+.0001,t:Math.random()*6.28,g:Math.random()<.4});

    const a=.3+.35*Math.sin(p.t);x.beginPath();x.fillStyle=p.g?'rgba(240,205,120,'+a+')':'rgba(255,240,250,'+(a*.8)+')';x.arc(p.x*W,p.y*H,p.r*dpr,0,6.283);x.fill()}
    requestAnimationFrame(f)};f();})();
