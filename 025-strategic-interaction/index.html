<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070f">
<meta name="description" content="謀略學堂：用遊戲教小朋友察言觀色、推斷人心、掌握時機、結盟談判、識穿伎倆。全廣東話語音。">
<title>謀略學堂 · 夜梟軍師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--panel:rgba(13,17,33,.88);--panel2:rgba(26,32,58,.92);--line:rgba(224,182,90,.30);--gold:#e0b65a;--gold2:#f6dc98;--ink:#eee9dc;--muted:#aaa7bb;--red:#ef6f6f;--green:#5bcc93;--blue:#6ab2ec;--purple:#a990f2;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;font-size:18px;line-height:1.75}
body{min-height:100vh;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body.nobg{background:radial-gradient(ellipse at 50% 20%,#1b2140 0%,#070914 60%,#030409 100%) fixed}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.78) 100%)}
#app{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:0 16px 90px}
.serif{font-family:"Noto Serif TC","Songti TC","STSong","PMingLiU",serif}
h1,h2,h3{margin:.3em 0;line-height:1.35}
h2.hd,h3.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
a{color:var(--gold2)}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));margin:0 -16px 16px;background:linear-gradient(180deg,rgba(5,7,15,.96),rgba(5,7,15,.78));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold2);font-size:21px;letter-spacing:3px;cursor:pointer;white-space:nowrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(224,182,90,.08);font-size:15px;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s,filter .2s;font-family:inherit;text-align:center}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(180deg,#f4d488,#c8953a);color:#1d1406;border-color:#f6dc98;box-shadow:0 4px 18px rgba(224,182,90,.35)}
.btn.ghost{background:rgba(255,255,255,.03)}
.btn.red{background:linear-gradient(180deg,#e77,#b44);color:#fff}
.btn.big{font-size:20px;min-height:60px;padding:12px 28px}
.btn.dis,.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 12px 50px rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mt{margin-top:16px}
/* speakable text */
.say{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.say .tx{flex:1;white-space:pre-line}
.say.big .tx{font-size:20px}
.say.ctx{background:rgba(106,178,236,.08);border-left:4px solid var(--blue);padding:10px 12px;border-radius:10px}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(224,182,90,.14);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:inherit;padding:0;line-height:1}
.spk.playing{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,182,90,.75)}100%{box-shadow:0 0 0 16px rgba(224,182,90,0)}}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:rgba(224,182,90,.15);color:var(--gold2);font-size:14px;font-weight:700}
/* splash */
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(5,7,15,.2),rgba(5,7,15,.85))}
.eye{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 50% 50%,#fff3c8 0 8%,#e0b65a 9% 22%,#3a2a0a 23% 40%,transparent 41%),radial-gradient(circle,rgba(224,182,90,.35),transparent 70%);animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.4)}}
.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(46px,11vw,96px);letter-spacing:.18em;margin:0;background:linear-gradient(180deg,#fff2c4,#e0b65a 55%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(224,182,90,.25)}
.subt{font-family:"Noto Serif TC",serif;color:var(--gold2);letter-spacing:.5em;font-size:clamp(15px,3.6vw,22px);margin:4px 0 22px}
.whisper{max-width:620px;margin:0 auto 26px;min-height:5.5em;color:#d9d3c2;font-size:18px}
.whisper p{margin:.35em 0;opacity:0;animation:fadein 1.4s forwards}
@keyframes fadein{to{opacity:1}}
/* home */
.hero{text-align:center;padding:10px 0 6px}
.hero h1{font-family:"Noto Serif TC",serif;color:var(--gold2);font-size:clamp(28px,6vw,44px);letter-spacing:.15em;margin:0}
.owlbox{display:flex;gap:14px;align-items:flex-start}
.owl{font-size:52px;line-height:1;filter:drop-shadow(0 0 12px rgba(224,182,90,.5))}
.map{position:relative;margin:22px 0;display:flex;flex-direction:column;gap:14px}
.map:before{content:"";position:absolute;left:50%;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--gold),transparent);opacity:.35}
.node{position:relative;display:flex;align-items:center;gap:12px;width:min(560px,100%);padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .15s}
.node:active{transform:scale(.98)}
.node.l{align-self:flex-start}.node.r{align-self:flex-end}
.node .disc{flex:none;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#3a3256,#141830);border:2px solid var(--gold);box-shadow:0 0 18px rgba(224,182,90,.35)}
.node.locked{opacity:.55}.node.locked .disc{border-color:#555;box-shadow:none}
.node.done .disc{background:radial-gradient(circle at 35% 30%,#f4d488,#a5762a)}
.nb{flex:1;min-width:0}.nt{font-weight:900;font-size:18px}.ns{font-size:14.5px;color:var(--muted);line-height:1.5}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.tile{padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center}
.tile .ti{font-size:34px}.tile b{display:block;font-size:17px}.tile small{color:var(--muted);font-size:14px;line-height:1.4;display:block}
/* chapter */
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctitle{font-weight:900;font-size:18px;flex:1}
.dots{display:flex;gap:5px;width:100%}
.dots i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.dots i.on{background:var(--gold)}.dots i.cur{background:var(--gold2);box-shadow:0 0 8px var(--gold)}
.scene{font-size:56px;text-align:center;letter-spacing:8px;margin:4px 0 8px}
.bubble{border-radius:16px;padding:10px 14px;margin:10px 0;animation:pop .35s}
.bubble.owl{background:rgba(224,182,90,.10);border:1px solid var(--line)}
.bubble.npc{background:rgba(106,178,236,.08);border:1px solid rgba(106,178,236,.3)}
.bubble.nar{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18)}
.who{font-weight:900;color:var(--gold2);font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ttop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--muted)}
.tcard{animation:pop .35s}
.ticon{font-size:58px;text-align:center}
.why{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(169,144,242,.10);border:1px solid rgba(169,144,242,.35)}
.why .lab{font-weight:900;color:#cdbdff;font-size:15px}
/* choices */
.choice{display:flex;gap:10px;align-items:center;padding:12px 14px;margin:10px 0;border-radius:14px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;transition:transform .12s,background .2s}
.choice:active{transform:scale(.98)}
.choice .tx{flex:1}
.choice.right{background:rgba(91,204,147,.18);border-color:var(--green)}
.choice.wrong{background:rgba(239,111,111,.15);border-color:var(--red)}
.choice.off{pointer-events:none;opacity:.6}
.choice.off.right{opacity:1}
.part .hit{pointer-events:all}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;animation:pop .3s}
.fb.good{background:rgba(91,204,147,.12);border:1px solid var(--green)}
.fb.bad{background:rgba(239,111,111,.10);border:1px solid var(--red)}
.fb.info{background:rgba(224,182,90,.10);border:1px solid var(--line)}
/* sort */
.pool{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.chip{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.chip .tx{flex:1}
.chip.sel{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(224,182,90,.4);background:rgba(224,182,90,.12)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;position:sticky;bottom:8px;z-index:5}
.bucket{padding:12px 8px;border-radius:14px;border:2px dashed var(--gold);background:rgba(13,17,33,.95);text-align:center;font-weight:900;cursor:pointer;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bucket .cnt{font-size:13px;color:var(--muted);font-weight:400}
.bucket.hot{background:rgba(224,182,90,.18);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px rgba(224,182,90,.6)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
/* spot */
.spot{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media(max-width:640px){.spot{grid-template-columns:1fr}}
.fig{background:radial-gradient(circle at 50% 30%,#232a4a,#0f1226);border-radius:18px;border:1px solid var(--line);padding:6px}
.fig svg{width:100%;height:auto;display:block}
.part{cursor:pointer}
.part .hit{fill:rgba(224,182,90,0);stroke:none;transition:fill .2s}
.part:hover .hit{fill:rgba(224,182,90,.12)}
.part.seen .hit{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.3);stroke-dasharray:4 4}
.part.key .hit{fill:rgba(224,182,90,.22);stroke:var(--gold2);stroke-width:2;stroke-dasharray:none}
.clue{padding:6px 10px;border-radius:10px;margin:6px 0;font-size:16px;animation:pop .3s}
.clue.k{background:rgba(224,182,90,.13);border:1px solid var(--line)}
.clue.n{background:rgba(255,255,255,.04)}
/* timing */
.tbar{position:relative;height:56px;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#5a1f2a,#7a2a33);border:2px solid var(--line);margin:18px 0 8px}
.tbar .z{position:absolute;top:0;bottom:0}
.z.y{background:#b9922e}.z.g{background:linear-gradient(180deg,#5bd99b,#2f9a64)}
.needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 12px #fff;border-radius:3px}
.tlegend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
/* meters */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.meter{font-size:13px;text-align:center}
.meter .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.meter .bar i{display:block;height:100%;background:var(--gold);transition:width .5s}
.eff{display:inline-block;margin:2px 4px;padding:1px 8px;border-radius:999px;font-size:13px;font-weight:700}
.eff.p{background:rgba(91,204,147,.2);color:#9ff0c4}.eff.m{background:rgba(239,111,111,.2);color:#ffb3b3}
/* alliance */
.voters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.voter{padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.voter.win{border-color:var(--green);box-shadow:0 0 0 2px rgba(91,204,147,.3)}
.voter .vn{font-weight:900;font-size:17px}
.voter .obs{font-size:14px;color:var(--muted);line-height:1.5;margin:3px 0}
.voter .need{font-size:14px;color:var(--gold2)}
.sbar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;margin:6px 0}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#6ab2ec,#5bcc93);transition:width .4s}
.sbar:after{content:"";position:absolute;left:60%;top:0;bottom:0;width:2px;background:#fff}
.vact{display:flex;gap:6px;flex-wrap:wrap}
.vact .btn{min-height:40px;padding:6px 10px;font-size:14px;border-radius:10px}
.log{max-height:220px;overflow:auto;font-size:15px;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px;margin-top:10px}
.log div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:560px;width:100%;max-height:88vh;overflow:auto}
/* negotiate */
.ken{display:flex;align-items:center;gap:14px;font-size:16px}
.ken .face{font-size:60px}
.offer{font-size:34px;font-weight:900;color:var(--gold2)}
input[type=range]{width:100%;height:36px;accent-color:var(--gold)}
/* card */
.xwrap{perspective:1000px;display:flex;justify-content:center;margin:12px 0}
.xcard{width:min(340px,90vw);height:440px;position:relative;transform-style:preserve-3d;transition:transform .9s;cursor:pointer}
.xcard.open{transform:rotateY(180deg)}
.xf,.xb{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.xf{background:repeating-linear-gradient(45deg,#1a1f3a 0 12px,#141830 12px 24px);border:3px solid var(--gold);font-size:70px}
.xf div{font-size:24px;font-family:"Noto Serif TC",serif;color:var(--gold2);letter-spacing:.3em}
.xb{transform:rotateY(180deg);background:linear-gradient(160deg,#2b2412,#141018);border:3px solid var(--gold2)}
.xk{font-family:"Noto Serif TC",serif;font-size:88px;color:var(--gold2);line-height:1.1;text-shadow:0 0 30px rgba(224,182,90,.6)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mini{padding:14px;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(160deg,#2b2412,#141018);text-align:center}
.mini .xk{font-size:52px}
.mini.lock{border-color:#444;background:#11131f;opacity:.5}
/* mission */
.mis{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel2);margin:8px 0;cursor:pointer}
.mis .ck{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900}
.mis.on .ck{background:var(--gold);color:#1b1306}
textarea,input[type=text]{width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font-size:17px;padding:10px 12px;font-family:inherit}
textarea{min-height:80px}
/* five steps */
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
@media(max-width:640px){.five{grid-template-columns:1fr}}
.five .st{text-align:center;padding:12px 8px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.five .st .xk{font-size:46px}
.result{text-align:center}
.bigstar{font-size:60px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 20px rgba(224,182,90,.7)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#222844;border:1px solid var(--gold);padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.list li{margin:6px 0}
.cert{border:6px double var(--gold);padding:26px;border-radius:12px;text-align:center;background:linear-gradient(160deg,#241e10,#0e0c14)}
.set-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.set-row label{flex:1;min-width:200px}
select{font-size:16px;padding:8px;border-radius:10px;background:#141830;color:var(--ink);border:1px solid var(--line);max-width:100%}
.switch{width:64px;height:36px;border-radius:18px;background:#333;position:relative;cursor:pointer;flex:none}
.switch:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--gold)}.switch.on:after{left:32px}
@media print{#bg,#vig,.top,.row,.spk{display:none!important}body{background:#fff;color:#000}.cert{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="vig"></div>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= 課程內容 ================= */
/* story lines: [who, text]  who: 'O' = 夜梟軍師, 'N' = 旁白, 其他 = 角色名 */
const CH = [
/* ---------- 第一章 ---------- */
{id:'c1',icon:'👁️',title:'第一章 · 睇人眉頭眼額',sub:'觀察力：人哋未開口，身體已經講咗',steps:[
{type:'story',scene:'🏫 👩‍🏫 🧒',lines:[
['O','歡迎你，新來嘅小謀士。我係夜梟軍師。喺呢個世界，好多嘢人哋唔會講出口，但係佢哋嘅面、身體同聲音，早就講咗出嚟。'],
['N','你同媽媽講：「我想買新玩具！」媽媽口講「等陣先」，但係眉頭皺晒，一路望住電話，打字打得好快。'],
['O','你覺得媽媽心入面諗緊乜？係真係「等陣」，定係「而家唔好煩我」？'],
['O','識睇人眉頭眼額嘅人，好似戴咗一副隱形眼鏡，睇到其他人睇唔到嘅嘢。佢哋知道幾時應該開口，幾時應該收聲。今日，我教你戴上呢副眼鏡。']]},
{type:'teach',title:'軍師授課：觀察術',cards:[
['👀','三個觀察位：面、身、聲','面：眉頭、眼神、嘴角。\n身：手放喺邊、腳指向邊、坐得近定遠。\n聲：講得快定慢、大聲定細聲、語氣同平時一唔一樣。','人嘅情緒，係由腦入面一個好古老、反應好快嘅部分控制。佢郁得快過我哋諗嘢。所以人可以控制自己講乜，但好難完全控制自己個面同身體。呢啲「漏出嚟」嘅訊號，就係你嘅線索。'],
['🦶','腳唔識講大話','一個人如果想走，佢對腳通常會先指向門口。手可以扮，個樣可以扮，但好少人記得控制對腳。','我哋由細到大練習得最多嘅，係控制個面，因為人人都望住個面。離個面越遠嘅身體部分，越少人刻意控制，所以越誠實。'],
['😊','真笑定假笑？','真心笑嘅時候，眼角會有笑紋，眼會瞇埋少少。假笑就只係嘴郁，對眼冇變。','嘴角嘅肌肉，我哋話郁就郁得；但眼角嗰組肌肉，多數只會喺真正開心嗰陣自己郁。所以要睇真定假，望對眼，唔好淨係望個嘴。'],
['📏','基準線：同佢平時比較','阿明平時好多嘢講，今日一句都唔出聲——呢個先係線索。但如果阿明平時都好靜，今日靜就唔代表乜嘢。','每個人都有自己嘅「正常模式」。線索唔係「佢做咗乜」，而係「佢做嘅嘢同平時有冇唔同」。有改變，先至係訊號。所以要先了解一個人平時係點。'],
['🧩','3C 法則：唔好靠一個線索落結論','第一個C，場合：而家係咩環境？\n第二個C，一堆線索：有冇幾個線索指向同一個方向？\n第三個C，改變：同平時有冇唔同？\n三樣都齊，先比較肯定。','抱住手可能係嬲，但都可能只係凍，或者佢習慣咁企。單一線索有好多個可能；幾個線索一齊出現，可能性先會收窄。好似偵探咁，要有幾個證據先可以拉人。'],
['🎤','聽弦外之音','「隨便你啦」、「冇所謂」、「都OK嘅」——好多時意思係「我其實唔係好鍾意，但唔想講」。留意佢講嗰陣語氣有冇拖長、聲音有冇變低。','好多人怕衝突、怕冇面，所以唔會直接講「唔好」。佢哋會用好含糊嘅說話，等你自己估。識聽嘅人，就唔會撞板；唔識聽嘅人，得罪咗人都唔知。']]},
{type:'spot',scenes:[

{who:'阿明',ctx:'今日好熱，三十三度。阿明同你講：「我冇嬲呀。」',col:'#c0504d',look:{brow:'angry',eye:'side',mouth:'tight',arm:'crossed',foot:'front',extra:'none'},

{who:'媽媽',ctx:'媽媽啱啱返完工，入門口。你想問佢星期六可唔可以去同學生日會。',col:'#4f8a6b',look:{brow:'worried',eye:'tired',mouth:'frown',arm:'open',foot:'front',extra:'sweat'},

{who:'新同學小晴',ctx:'今日班入面嚟咗個新同學小晴，佢企喺課室後面。',col:'#d08a3a',look:{brow:'worried',eye:'wide',mouth:'smile',arm:'fidget',foot:'front',extra:'none'},

 tip:'嘴笑但眼冇笑、手指不停郁、眉頭向上，係緊張嘅訊號。策略：主動行過去打招呼，介紹佢識其他同學。新嚟嘅人最需要朋友，你係佢第一個朋友，佢會記住你好耐。呢個亦係建立盟友最好嘅時機。'},
{who:'班長阿詩',ctx:'小息，你想同班長阿詩提議班會搞一個遊戲日。',col:'#3a7bd5',look:{brow:'flat',eye:'happy',mouth:'smile',arm:'open',foot:'front',extra:'none'},

]},

{type:'mission',items:['揀一個屋企人，靜靜觀察佢「平時」係點（基準線）。然後留意佢有一日同平時唔同嘅地方，諗下點解。','下次同人講嘢嘅時候，望一望佢對腳指向邊。','留意一次有人講「隨便」或者「冇所謂」，佢真正嘅意思係乜？']}

{id:'c2',icon:'🧮',title:'第二章 · 人人心中有個算盤',sub:'推斷力：佢想要乜？佢怕乜？',steps:[
{type:'story',scene:'🧒 🍬 👧👧👧',lines:[
['N','小美好想加入阿詩嗰班人一齊玩。佢日日送糖俾阿詩，但阿詩都係冇叫佢一齊玩。'],
['小美','我對佢咁好，點解佢唔理我？'],
['O','因為小美只係諗「我想要乜」，冇諗「阿詩想要乜、怕乜」。原來阿詩怕嘅係：多咗個新人，佢喺班入面嘅位置會被分薄。'],
['O','每個人心入面都有一個算盤，噼哩啪啦咁計緊：做呢件事，我會得到乜？會失去乜？識得睇穿呢個算盤，你就識得點樣同人打交道。']]},
{type:'teach',title:'軍師授課：人心六顆珠',cards:[
['💰','第一顆珠：利益——有冇著數？','得到鍾意嘅嘢、時間、分數、零用錢、玩具。','人同所有動物一樣，會靠近對自己有好處嘅嘢。呢個唔係壞，係天性。明白呢點，你就唔會怪人「咁現實」，而係諗：點樣令佢都有著數？'],
['😳','第二顆珠：面子——會唔會冇面？','人好怕喺其他人面前出醜、輸、被笑。為咗面子，好多人寧願唔要著數。','人係群居動物。喺遠古時代，被群體睇唔起，就可能被趕走，好危險。所以「面子」喺我哋腦入面，同「安全」差唔多咁重要。'],
['🛡️','第三顆珠：安全感——會唔會有損失？','怕被罰、怕失去朋友、怕改變。好多人唔肯試新嘢，唔係因為新嘢唔好，而係因為怕。','心理學家發現，人失去一樣嘢嘅痛，大約係得到同一樣嘢嘅開心嘅兩倍。所以「怕失去」往往比「想得到」更有力。'],
['🌟','第四顆珠：被重視——有冇人認同我？','人人都想被睇見、被讚、覺得自己重要。','被重視，等於喺群體有地位，有地位就有安全同資源。所以一句真心嘅「多謝你，冇你唔得」，可能比一粒糖更有用。'],
['😮‍💨','第五顆珠：怕麻煩——會唔會好煩好攰？','就算一件事係好事，如果太麻煩，人都唔想做。','個腦好慳電，會自動揀最輕鬆嘅路。所以你想人幫你，就要令件事變得簡單。'],
['🔥','第六顆珠：情緒——佢而家心情點？','嬲、驚、攰、肚餓嘅時候，人好難冷靜計數。','情緒好似天氣，會影響個算盤點計。同一個請求，佢開心嗰陣同嬲嬲豬嗰陣，答案可以完全唔同。'],
['🧊','冰山定律','人講出口嘅，只係冰山頂一小部分。佢真正想要嘅、怕嘅，喺水底，先係大塊。','好多需要講出口會冇面，或者唔安全，所以人會包裝。你要問自己：佢講呢句話，背後係保護緊乜？'],
['🔄','換位思考三問','第一問：如果我係佢，我想要乜？\n第二問：我怕乜？\n第三問：點樣先可以令我覺得「答應你」係著數？','只要你搵到一個方法，令對方覺得「幫你等於幫佢自己」，事情就會順好多。呢個叫「雙贏」，係所有謀略入面最強嘅一招。']]},
{type:'sort',title:'算盤偵探：佢最關心邊顆珠？',intro:'每句說話背後，最主要係邊顆珠？先撳句子，再撳盒。',buckets:['💰 利益','😳 面子','🛡️ 安全感','🌟 被重視','😮‍💨 怕麻煩'],items:[
{t:'哥哥話：「我唔玩呢隻遊戲，好幼稚。」（其實佢成日輸）',b:1,why:'成日輸好冇面，所以佢話個遊戲幼稚嚟保護面子。'},
{t:'同學話：「你借功課我抄，我請你食雪糕。」',b:0,why:'佢用著數嚟換著數，係利益交換。（不過抄功課會一齊出事！）'},
{t:'媽媽話：「唔好轉新補習社啦，舊嗰間都OK。」',b:2,why:'改變有風險，人自然想維持現狀，係安全感。'},
{t:'班長話：「呢個主意好呀，係我之前諗出嚟㗎！」',b:3,why:'佢想人知道佢有功勞，想被重視。'},
{t:'爸爸啱啱返完工，話：「下次先算啦，今日唔好去咁遠。」',b:4,why:'攰嘅時候，人最怕麻煩。'},
{t:'同學唔肯同新嚟嘅人坐，怕自己嘅好朋友被搶。',b:2,why:'怕失去朋友，係安全感問題。'},
{t:'老師話：「你哋自己搞掂佢，唔好嚟搵我。」',b:4,why:'老師好忙，唔想多一件麻煩事。'},
{t:'組長堅持要喺老師面前由佢一個人報告。',b:3,why:'喺老師面前報告，可以被睇見、被讚，係被重視。'}]},
{type:'quiz',qs:[
['小美想加入阿詩嗰班人，最聰明嘅做法係？',['再送多啲糖','喺其他人面前真心讚阿詩，令佢有面；表示自己唔會搶佢位，仲可以帶新遊戲俾大家玩','去同老師投訴阿詩排斥人'],1,'阿詩怕嘅係位置被分薄（安全感），想要嘅係面子同好玩。小美俾佢面、令佢安心、帶嚟好處，三顆珠一齊處理。'],
['「失去」同「得到」，邊樣令人反應大啲？',['得到','失去，大約係兩倍','一樣大'],1,'所以話人「唔做會失去乜」，往往比話人「做咗會得到乜」更有說服力。'],
['你想爸爸幫你砌模型，點講最容易成功？',['「你幫我砌啦，好簡單之嘛」','「我已經分好零件同睇晒說明書，你幫我砌最難嗰兩步，大約十分鐘，之後我請你飲杯茶」','「你唔幫我就係唔錫我」'],1,'你處理咗佢「怕麻煩」（準備好、時間短），又俾咗佢小小著數。第三個係情緒勒索，會令人反感。']]},
{type:'card',name:'推',t:'人人心中有個算盤：利益、面子、安全感、被重視、怕麻煩、情緒。搵到佢嘅算盤，就搵到開門嘅鎖匙。'},
{type:'mission',items:['今個星期，揀一個你想請佢幫手嘅人，用「換位思考三問」諗清楚先開口。','觀察一次有人講嘢，諗下佢冰山底下真正想要乜。','試下一次「令幫你等於幫佢自己」嘅講法。']}
]},
/* ---------- 第三章 ---------- */
{id:'c3',icon:'⏳',title:'第三章 · 識時務者為俊傑',sub:'時機與冷靜：早一秒遲一秒，結果完全唔同',steps:[
{type:'story',scene:'📞😡 ☕😌',lines:[
['N','阿仔考完試，即刻衝去同爸爸講：「我想買新遊戲機！」嗰陣爸爸啱啱收到公司電話，好嬲。'],
['爸爸','買乜嘢買！成日掛住玩！'],
['N','兩個星期後嘅星期日早上，爸爸食完一餐好味嘅早餐，坐喺梳化好放鬆。阿仔先拎成績表出嚟，再問：「爸爸，我今次進步咗，可唔可以考慮一下獎勵？」'],
['爸爸','（笑）好呀，講嚟聽下。'],
['O','同一個要求，換咗個時間，結果完全唔同。「識時務者為俊傑」，意思係：聰明人會睇清楚形勢先出手。']]},
{type:'teach',title:'軍師授課：時機與冷靜',cards:[
['🌤️','揀心情好嘅時候','食飽、放鬆、啱啱有好事發生：好時機。\n肚餓、攰、趕時間、啱啱被人鬧：壞時機。','人嘅「耐性電池」用得七七八八嘅時候，個腦會傾向講「唔好」，因為講唔好最慳力、最安全。'],
['👥','睇觀眾','有啲嘢要喺人多嘅時候講，例如讚人。有啲嘢一定要私底下講，例如提醒人做錯。','有觀眾嘅時候，人會更加在乎面子。當眾話人錯，佢為咗保面子會死撐，就算佢知自己錯都唔會認。'],
['🎁','先送禮，後開口','想人幫你之前，先幫人、先有好表現。例如想要獎勵，先拎出好成績。','人有「互惠」本能：人哋對我好，我會覺得欠咗人情，想還返。呢個本能喺世界上所有文化都有。'],
['🛑','唔出手，都係一種出手','時機唔啱嘅時候，最叻嘅做法係「等」。急住開口，只會浪費機會。','一次被拒絕之後，對方會記住「我已經講咗唔好」。下次要佢改口就更難，因為人想保持前後一致。所以唔好浪費第一槍。'],
['🧊','先控制自己，先控制局面','一嬲就衝口而出，等於將主導權交咗俾人。嬲嘅時候：深呼吸三下、心入面數到十、講「我諗一諗先」。','嬲嘅時候，腦入面負責諗後果嘅部分會好似斷咗線。所以有人會故意激嬲你，因為你一嬲就容易講錯嘢、做錯嘢。冷靜嘅人，永遠有最多選擇。'],
['🗺️','天時、地利、人和','天時：時間啱唔啱？\n地利：地方啱唔啱，私下定公開？\n人和：身邊有冇支持你嘅人？\n三樣都齊，成功率最高。','古代軍事家都知道，就算你好有道理，形勢唔啱都會輸。好消息係：形勢係可以「等」出嚟，亦可以「造」出嚟嘅。']]},

{id:'c4',icon:'👞',title:'第四章 · 擦鞋都係一門學問',sub:'讚美嘅藝術：令人舒服，又唔會俾人覺得你假',steps:[
{type:'story',scene:'👩‍🏫 😍🧒 🙂👧',lines:[
['N','班入面有兩個同學都想做壁報組長。阿威成日同老師講：「Miss你好靚呀！Miss你最好呀！」老師笑笑口，但同學喺背後叫佢「擦鞋仔」。'],
['N','另一個同學阿晴，有日同老師講：「Miss，你上次教我哋用顏色分類筆記，我試咗，今次溫書快咗好多，多謝你。」老師好感動，記住咗阿晴。'],
['O','兩個都係「擦鞋」，但一個低級，一個高級。高手讚人，令人覺得你真心、有眼光；低手讚人，令人覺得你有目的。'],
['O','最後，邊個做咗壁報組長？當然係阿晴。今日我教你點樣做一個「讚美高手」。']]},
{type:'teach',title:'軍師授課：讚美之道',cards:[
['🧲','點解讚美有用？','每個人都好想被睇見、被認同。你讚到佢心坎，佢會覺得你明白佢，自然想親近你、幫你。','被認同係人類好基本嘅需要（記得「被重視」呢顆珠）。仲有，人會鍾意令自己感覺良好嘅人，呢個叫「喜好原理」。人亦都比較願意幫自己鍾意嘅人。'],
['🎯','讚具體，唔好讚空泛','低手：「你好叻呀！」\n高手：「你頭先解嗰題數嘅方法好特別，我都冇諗到可以咁計。」','具體嘅讚美證明你真係有留意，所以人會信。空泛嘅讚美人人都識講，聽落似客套，或者似有目的。'],
['💪','讚努力同選擇，唔好只讚天份','「你練咗咁多日，終於入到波！」比「你好有天份」更打動人。','努力係佢自己揀嘅、控制到嘅。讚佢努力，等於話佢「你係一個肯捱嘅人」，呢種認同更深入，佢會更想繼續努力。'],
['👂','最高級嘅擦鞋：認真聽','留心聽人講、記住佢講過嘅嘢，之後再問返佢：「你上次講嗰個比賽點呀？」','好少人會真心聽人講嘢。你記住佢嘅事，等於話佢：「你喺我心目中係重要嘅。」呢個比任何讚美都有力。'],
['🎭','俾面：公開讚，私下勸','讚人要喺人多嘅地方講；提點人做錯，要私底下講。有人做錯，留條「台階」俾佢落。','喺人前讚佢，佢嘅面子同地位上升，會好感激你；喺人前話佢，佢面子受損，就算你啱，佢都會記仇。'],
['🗣️','借第三者把口','「阿晴話你畫畫好靚喎！」轉述第三者嘅讚美，有時比自己直接讚更可信。仲有：喺人背後講佢好說話，好多時會傳返去佢耳仔。','當面讚，人會懷疑你有目的；第三者嘅讚美冇利益關係，所以人更加信。背後讚人，傳到佢耳仔，效果比當面讚強好多倍。'],
['⚠️','擦鞋三大禁忌','一忌：讚完即刻開口要嘢，太明顯。\n二忌：讚得太誇張、講大話，會俾人識穿。\n三忌：為咗擦一個人，踩低另一個人，會得罪人，仲會傳開。','讚美嘅力量來自「可信」。一旦人發現你有目的或者講大話，之前所有讚美都會變成負分，仲會被人叫「擦鞋仔」。'],
['🙇','好擦鞋同壞擦鞋嘅分別','好嘅擦鞋：講真話，但揀講佢好嘅嗰面。\n壞嘅擦鞋：講大話、出賣良心去討好人。','你可以揀講邊啲真話，但唔好講假話。咁樣你一世都唔怕俾人識穿，仲會建立「有眼光、講真話」嘅名聲。']]},

{id:'c5',icon:'💎',title:'第五章 · 吊高來賣',sub:'價值與談判：越急越蝕底，識得等先有價',steps:[
{type:'story',scene:'🃏✨ 🧒 🍬🍬',lines:[
['N','阿Ken好想要你手上嗰張限量版閃卡。你好開心，即刻話：「好呀好呀！你俾幾多我都得！」'],
['N','結果阿Ken只係俾咗你兩粒糖。之後你先知道，原來佢肯俾成盒貼紙。'],
['O','你越心急，人哋就越覺得你唔值錢。「吊高來賣」唔係扮嘢，而係明白自己嘅價值，同埋唔好太早亮底牌。'],
['O','呢一課，你會學識談判高手嘅秘密。之後，你仲要同阿Ken真刀真槍咁傾一次。']]},
{type:'teach',title:'軍師授課：價值與談判',cards:[
['💎','物以罕為貴','一樣嘢越少、越難得到，人就越想要。你嘅時間、幫助、友誼都一樣：隨時隨地任人攞，人就唔識珍惜。','呢個叫「稀缺效應」。個腦會自動覺得難得嘅嘢比較有價值，因為喺遠古時代，稀少嘅資源要搶先先有。'],
['🃏','唔好一開始就亮底牌','唔好話人知「我好需要」、「我好急」、「你俾幾多都得」。','對方知道你嘅底線，就會將條件壓到最低。談判好似玩啤牌，邊個先露底，邊個蝕底。'],
['🚪','有後備方案，先夠膽講唔好','談判之前，先諗定：如果傾唔成，我仲有乜選擇？例如另一個同學都想要張卡。','專家叫呢個做「最佳替代方案」。有後備方案，你就唔使驚對方走，自然有底氣；冇後備方案，你就會變成求人。'],
['⚓','先開價嘅「定錨效應」','第一個講出嚟嘅數字，會好似船錨咁，令之後嘅傾價都圍住佢轉。如果你知道行情，可以由你先開一個合理但偏高嘅價。','人腦好難完全由零開始諗，會不知不覺用第一個數字做參考點。所以邊個先定錨，邊個就有優勢。'],
['📣','講價值，唔好淨係講價錢','「呢張卡全校得三張，仲係新淨冇花。」講清楚佢點解值錢，對方就肯出多啲。','人唔係買「東西」，係買「價值」。你幫佢睇到價值，佢個算盤就會計多啲。'],
['🐢','以退為進','有時講：「唔緊要，我唔急，你諗清楚先。」反而令對方更想要。','你退一步，壓力就轉咗去對方身上：佢會怕失去機會。記得：怕失去，比想得到更強烈。'],
['🙅','識得講「唔好」','唔係人哋要乜你就俾乜。禮貌咁講：「唔好意思，呢個我唔可以。」你嘅「好」先至有價值。','一個從來唔識講唔好嘅人，佢嘅幫忙會被當成理所當然。識拒絕，係保護自己嘅價值。'],
['⚖️','紅線：唔好呃人','吊高來賣，係講真嘢、揀時機、唔露底；唔係講大話，例如話張卡新淨，但其實有花。','一次呃人，之後全世界都唔再同你交易。名聲係你最值錢嘅資產，比任何一張卡都值錢。']]},
{type:'negotiate'},
{type:'quiz',qs:[
['你想賣舊漫畫俾同學，以下邊句最蝕底？',['「呢套係全套，冇缺本。」','「我好急要錢，你俾幾多都得。」','「我唔急，你考慮下先。」'],1,'一講「好急」同「幾多都得」，就等於亮晒底牌。'],
['後備方案有乜用？',['等我可以呃人','傾唔成都唔怕，所以夠膽講唔好','冇用'],1,'有後路，先有底氣。'],
['同學成日叫你幫佢做值日，你唔想。最好嘅講法係？',['「好啦……」（其實好唔想）','「唔好意思，今日我有事做唔到。下次你需要，可以早啲問我，我睇下得唔得。」','「你好煩呀！」'],1,'有禮貌、清楚講唔好，仲留咗後路。你嘅「好」先會有價值。']]},
{type:'card',name:'價',t:'越急越蝕底。知道自己嘅價值，準備好後備方案，唔好先亮底牌。吊高來賣，但唔講大話。'},
{type:'mission',items:['下次有人要你幫手，唔好即刻答應，講「我諗一諗」，諗清楚先決定。','試一次有禮貌咁講「唔好」。','做任何決定之前，問自己：「如果唔成，我嘅後備方案係乜？」']}
]},
/* ---------- 第六章 ---------- */
{id:'c6',icon:'🤝',title:'第六章 · 結盟與派系',sub:'團結大多數：一個人行得快，一班人行得遠',steps:[
{type:'story',scene:'🗳️ 🧒 vs 😈👥',lines:[
['N','你想做班長，因為你想喺班入面搞義賣，幫醫院嘅小朋友。但係大Joe都想做班長，佢身邊有一班跟班。'],
['N','你一個人，再有道理都只係一票。全班七個同學，你要攞到四票先贏。'],
['O','喺任何團體入面，都有「派系」，即係一班班有共同利益嘅人。想成事，你要睇清楚：邊個同邊個好、邊個講嘢有分量、每個人想要乜。然後，搵到共同利益，結成同盟。'],
['O','記住，大Joe都會拉票。你嘅精力有限，每一步都要計。']]},
{type:'teach',title:'軍師授課：結盟之道',cards:[
['🗺️','畫一張人際地圖','邊個同邊個好？邊個講嘢多人聽？邊個好少出聲但好有影響力？邊個同邊個有過節？','人唔係一個一個咁獨立做決定，而係受身邊嘅人影響。識得張地圖，你就知道應該先搵邊個。'],
['🔑','搵關鍵人物','說服一個「人氣王」，好多時等於說服咗佢身邊一班人。','呢個叫「社會認同」：人唔肯定嘅時候，會望下身邊嘅人點做，因為跟大隊最安全。關鍵人物，就係大隊嘅方向盤。'],
['🧩','共同利益，先係最牢固嘅膠水','結盟唔係靠「我哋係好朋友」，而係「我哋一齊做，大家都有著數」。','友情會變，但當一件事對雙方都有好處，合作就自然維持到。所以結盟之前，要先搵到雙贏點。'],
['🕵️','先打聽，後出手','未了解人哋想要乜就亂咁應承，好容易應錯嘢。先問、先聽、先觀察。','情報係謀略嘅基礎。孫子兵法講：「知彼知己，百戰不殆。」你知得越多，每一步就越準。'],
['🤥','唔好亂開空頭支票','唔好同兩個人都應承同一樣嘢，例如同兩個人都話會俾佢做副班長。','一旦被人發現，你喺所有人心目中嘅信用都會一齊跌。承諾少啲，但講得出做得到。'],
['⚔️','拉一派打一派？要識，但要用得正','「分化」即係令對手嘅人分裂，或者聯合一班人對付另一班人。你一定要認得呢招，因為有人會用嚟對付你。如果你要用，只可以用嚟「團結大多數，孤立欺凌者」，例如聯合全班一齊唔接受大Joe蝦人。','一班人團結就強，分裂就弱，呢個係權力嘅基本規律。但如果用嚟欺負無辜嘅人，你會變成你最討厭嗰種人，最後亦會被人用同一招對付返你。'],
['🌉','唔好樹敵，留後路','今日嘅對手，聽日可能係隊友。贏咗都唔好踩人，輸咗都唔好反面。','世界好細，人際關係係一場長期遊戲。今日留一條路俾人，聽日就係留一條路俾自己。'],
['🗡️','抹黑會反彈','散播對手壞話，短期可能有用，但一俾人揭發，你就會變成「奸人」。','人最憎被利用同被呃。抹黑嘅人一旦被識穿，連支持你嘅人都會走。']]},
{type:'alliance'},
{type:'quiz',qs:[
['大Joe班人成日蝦阿肥。用「團結大多數」嘅方法，你會點做？',['加入大Joe班一齊蝦，咁就唔會蝦到自己','同班入面其他同學傾，大家一齊表明唔接受欺凌，同埋話俾老師知','唔關我事'],1,'團結大多數，孤立欺凌者，呢個係分化術嘅正當用法。'],
['選舉贏咗之後，對輸咗嘅大Joe，最聰明嘅做法係？',['喺全班面前笑佢','有禮貌咁多謝佢參選，邀請佢一齊幫手搞義賣','以後唔理佢'],1,'唔樹敵、留後路。今日嘅對手，聽日可能係隊友，仲會令其他人覺得你有氣量。']]},
{type:'card',name:'盟',t:'先打聽，再對症下藥。搵關鍵人物，靠共同利益結盟。唔開空頭支票，唔抹黑人，唔樹敵。'},
{type:'mission',items:['喺紙上畫一張你班嘅人際地圖：邊個同邊個好？邊個係人氣王？','搵一個同你有共同目標嘅同學，一齊做一件事。','觀察一次：有冇人用「拉一派打一派」？佢點做？']}
]},
/* ---------- 第七章 ---------- */
{id:'c7',icon:'🐟',title:'第七章 · 水清則無魚',sub:'灰色地帶：世界唔係得黑同白',steps:[
{type:'story',scene:'🧑‍⚖️ 🙅‍♂️🙅‍♀️',lines:[
['N','阿正係班入面最正直嘅人。佢見到有同學遲咗一分鐘交功課，即刻話俾老師知；見到有人食少少零食，又話俾風紀知。'],
['N','有一次，朋友收到阿正送嘅禮物，話「好鍾意」。阿正當眾拆穿：「你講大話！你明明唔鍾意！」'],
['N','結果，冇人想同阿正做朋友。當阿正真係遇到麻煩、需要人幫手嘅時候，全班都冇人出聲。'],
['O','水太清，魚就冇得住。一個人要求太嚴、乜都要計清楚，身邊就冇人敢接近。真正嘅智慧，係分得清：邊啲事要堅持，邊啲事可以隻眼開隻眼閉。']]},
{type:'teach',title:'軍師授課：灰色地帶',cards:[
['🌫️','世界有灰色地帶','唔係所有事都係「啱」或者「錯」。好多事係「唔係咁理想，但可以接受」。','人唔係完美嘅，規矩都唔可能寫晒所有情況。要求每個人每件事都完美，結果只會係同所有人為敵。'],
['🪜','俾台階人落','人做錯少少，唔好拆穿到佢冇面。可以私下講，或者幫佢搵個藉口：「可能你冇留意啫。」','人一冇面就會死撐、記仇。你俾台階佢，佢會改，仲會記住你嘅好。'],
['⚔️','揀戰場','每次衝突都要用力，你嘅力氣有限。問自己：呢件事一個月後仲重唔重要？唔重要，就放手。','戰略嘅核心係「集中力量」。將力氣留俾真正重要嘅事，先打得贏關鍵嘅仗。'],
['📜','明規矩同潛規則','明規矩係寫出嚟嘅，例如校規。潛規則係冇寫出嚟，但大家都跟嘅，例如：新同學唔好一嚟就搶最好嘅位、小息某張乒乓波枱通常係高年級先用。','潛規則係一個群體慢慢形成嘅習慣。唔理潛規則，雖然冇犯規，但會得罪人。先睇清楚，再決定跟唔跟、幾時改。'],
['🎭','善意嘅說話藝術','朋友問：「我幅畫靚唔靚？」你覺得麻麻，可以講：「你用色好大膽，我好鍾意個天空！」你講咗真話，只係揀咗好嘅嗰面講。','呢個唔係呃人，係顧及對方感受。重點係：唔好為咗自己嘅利益，講傷害人嘅大話。'],
['🚨','但係，紅線唔可以退','有啲事一定要堅持，一定要講：有人被欺凌、有人有危險、有大人叫你瞞住屋企人、有人要你做違法或者傷害人嘅事。','灰色地帶係俾「小事」用嘅。涉及安全同傷害，就冇灰色，只有黑白。分得清呢兩樣，先係真智慧。'],
['🧱','水清無魚，唔等於任人魚肉','隻眼開隻眼閉，唔係叫你做「好好先生」。俾台階之餘，要守住你嘅界線。','如果你次次都忍，對方會學識：「呢個人點樣都唔會出聲。」寬容要有底線，先叫智慧；冇底線，叫畀人蝦。']]},
{type:'sort',title:'戰場選擇器',intro:'呢件事，值得爭取、放手算數，定係紅線一定要講？',buckets:['⚔️ 值得爭取','🐟 放手算數','🚨 紅線：一定要講'],items:[
{t:'同學排隊嗰陣打尖咗一個位。',b:1,why:'小事，一個月後冇人記得。最多輕輕提一句，唔使搞大。'},
{t:'有同學日日被人搶午餐錢。',b:2,why:'欺凌涉及傷害，一定要話俾老師或者信得過嘅大人知。'},

{t:'一個網上認識嘅人，叫你唔好話俾爸媽知你哋傾偈。',b:2,why:'叫你瞞住屋企人，係危險訊號，一定要講。'},
{t:'老師計錯你測驗分數，少咗十分。',b:0,why:'值得爭取，但要私下、有禮貌咁問：「老師，呢題我想請教下。」'},

{t:'細佬食多咗你一塊餅。',b:1,why:'小事，計較會傷感情。'}]},

e1:{end:1,score:0.3,t:'小強面紅晒，嬲嬲地走咗，之後成組人氣氛好僵，佢仲同人講你壞話。\n💡 你啱，但你輸咗。當眾拆穿，令佢冇台階落，佢只會死撐同記仇。'},
e2:{end:1,score:1,t:'小強鬆咗一口氣：「多謝你……我今晚一定搞掂。」佢真係交咗，之後仲對你特別好。\n✅ 你俾咗台階（「可能你好攰」），又守住咗界線（今晚九點前一定要交）。呢個就係水清無魚嘅真正用法。'},

{id:'c8',icon:'🛡️',title:'第八章 · 防人之心不可無',sub:'識穿伎倆：害人之心不可有，防人之心不可無',steps:[
{type:'story',scene:'😇🍬 → 😈📄',lines:[
['N','有個同學平時好少同你講嘢，突然有日走埋嚟：「你好叻呀！你係全班最好人嘅！你可唔可以借份功課我抄吓？」'],
['N','你好開心被人讚，就借咗。結果老師發現兩份功課一模一樣，你同佢一齊被罰。之後，佢都冇再搵過你。'],
['O','你學識咗謀略，人哋都識。最危險嘅唔係壞人，而係你認唔出佢用緊乜招。'],
['O','今日，我教你識穿最常見嘅伎倆。學識咗，冇人可以輕易利用你。']]},
{type:'teach',title:'軍師授課：伎倆圖鑑',cards:[
['🍬','糖衣陷阱：突然好熱情','平時唔理你嘅人，突然大讚你，然後即刻要你幫手。\n防禦：問自己：「佢讚我，係因為我，定係因為佢想要嘢？」','讚美會令我哋開心，開心嘅時候我哋會冇咁小心。呢招就係利用你嘅好心情，令你冇時間諗。'],
['⏰','製造緊迫：「快啲！得今日！」','「你唔即刻答應就冇機會㗎啦！」\n防禦：越催得急，越要慢。講：「我要諗一諗。」','時間壓力會令個腦冇時間計數，只靠直覺做決定。真正嘅好機會，好少會因為你諗一晚就消失。'],
['😢','情緒勒索：「你唔幫我，就唔係我朋友」','用內疚、恐懼、友情嚟逼你。\n防禦：真朋友唔會用絕交嚟威脅你。講：「我當你係朋友，但呢件事我唔可以做。」','怕失去朋友（怕失去）係好強烈嘅感覺，佢就係利用呢點。你一認出佢，佢就冇力。'],
['🪓','挑撥離間：「佢喺背後講你壞話㗎」','有人走嚟講第三者壞話，想你哋反面。\n防禦：唔好即刻信，亦唔好即刻去質問。觀察多啲，或者冷靜咁同當事人傾。','呢個就係「拉一派打一派」：令其他人分裂，挑撥嘅人就得益。你要問：「佢話我知呢件事，佢有乜著數？」'],
['🦶','得寸進尺：先細後大','先借支筆，再借功課，再叫你考試幫佢傳答案。\n防禦：每次都問：「如果第一次佢就問呢個，我會唔會應承？」','人想保持前後一致：應承咗細嘅，就覺得唔好意思唔應承大嘅。佢就係一級一級咁拉你落水。'],
['👥','人多勢眾：「大家都係咁做㗎啦」','用一班人嚟壓你。\n防禦：大家都做，唔等於啱。問自己：如果冇人睇住，我仲覺唔覺得呢件事啱？','人天生怕同群體唔同。但一班人一齊錯，都仲係錯。'],
['🌀','扭曲事實：「你諗多咗啦」、「我從來冇講過」','明明發生咗嘅事，佢話冇，令你懷疑自己。\n防禦：重要嘅嘢留低記錄，例如訊息、筆記，同信得過嘅人傾。','如果你唔信自己嘅記憶，就只能夠信佢，咁佢就控制咗你。記錄係你嘅盾牌。'],
['🎣','套料：不知不覺問晒你啲秘密','好似閒聊咁問你：屋企住邊、幾時得你一個、你嘅密碼、你朋友嘅秘密。\n防禦：私隱唔講，朋友嘅秘密唔講。','資訊就係力量。你講出去嘅每一個秘密，都可能變成人哋手上嘅籌碼。'],
['🚨','特別警報：叫你「保守秘密」嘅大人','如果有大人，包括網上認識嘅人，送禮物俾你、叫你唔好話俾爸爸媽媽知、或者令你覺得唔舒服，即刻話俾信得過嘅大人知。你唔會有麻煩，你係保護緊自己。','真正關心你嘅大人，唔會要求你瞞住屋企人。秘密，係壞人最鍾意用嘅工具。']]},

{type:'teach',title:'十個殘酷真相',cards:[
['🌧️','真相一：世界唔一定公平','老師會偏心，教練會揀自己鍾意嘅人，努力嘅人未必贏。\n應對：唔好淨係嬲。諗：「喺呢個唔公平嘅規則入面，我點做先最有利？」','做決定嘅係人，人有感情、有喜好，會偏向令佢舒服同信任嘅人。所以除咗實力，「關係」同「印象」都計分。'],
['🙈','真相二：做得好，唔代表有人知','你默默做晒，功勞可能係講得最大聲嗰個攞。\n應對：學識有技巧咁「匯報」：「老師，我哋組嘅資料搜集部分，我整理咗呢份。」','老師同上司都好忙，佢哋只會見到佢哋睇到嘅嘢。唔講出嚟，就等於冇發生過。呢個唔係吹水，係令事實被睇見。'],
['🦊','真相三：有人會搶你功勞','應對：留低痕跡，喺群組報告進度、做嘢有記錄、交嘢時寫明分工。','搶功勞嘅人，靠嘅係「冇證據」。你有記錄，佢就搶唔到。保護自己，要喺事發之前做。'],
['🍂','真相四：朋友會變','升班、分班、有新朋友、利益唔同咗，友情都會變。\n應對：唔好將所有秘密講晒俾一個人知，唔好只得一個朋友圈。','人嘅關係，好多時同環境同利益有關。環境變，關係就可能變。呢個唔一定係邊個衰，而係人之常情。'],
['🗣️','真相五：有人會喺背後講你','就算你冇做錯嘢，都會有人講你壞話，因為妒忌、因為好玩、或者因為佢想贏你。\n應對：唔好逐個去吵，用長期嘅行動建立名聲；真係太過分，搵大人幫手。','講人是非，可以令講嘅人覺得自己有地位、同聽嘅人更親密。你控制唔到人哋把口，但你控制到大部分人見到嘅你。'],
['⚖️','真相六：有道理，唔一定贏','好多決定唔係睇邊個啱，而係睇邊個有支持、有時機、識講。\n應對：道理、盟友、時機，三樣齊先出手。','做決定嘅人都有自己嘅算盤：面子、怕麻煩、關係。你只有道理，冇處理佢嘅算盤，佢都未必揀你。'],
['🧮','真相七：大部分人首先諗自己','唔係因為佢哋壞，而係人嘅天性。\n應對：唔好期望人無條件幫你，搵雙贏，令幫你等於幫佢自己。','人要先保護好自己，先可以照顧人。明白呢點，你就唔會因為人哋自私而太受傷，反而識得點合作。'],
['🏦','真相八：冇人有義務幫你','平時你幫人，有事人先會幫你。\n應對：平時「儲人情」，多啲幫人、多啲多謝人、記住人哋嘅好。','人情好似銀行戶口，平時要存錢，有需要先拎得出。從來唔存、淨係識借嘅人，好快冇人肯借。'],
['🪞','真相九：第一印象好難改','人好快就會幫你貼標籤，例如「懶」、「叻」、「麻煩友」，之後只會留意符合呢個標籤嘅嘢。\n應對：新環境頭幾日特別重要：守時、有禮、做好份內事。','個腦為咗慳力，會好快幫人分類，之後只搵證據支持自己嘅判斷，呢個叫「確認偏誤」。所以要改印象，要好多次、好長時間。'],
['💪','真相十：錯唔係你，但後果可能要你承擔','例如有人整爛你啲嘢、搵你笨。嬲係正常，但抱怨唔會令事情變好。\n應對：先保護自己、止蝕，再諗點樣討回公道。','世界唔會因為「唔係我錯」就自動幫你修好。識得先處理後果嘅人，先可以重新拎返主導權。']]},

const TTS={v:null,list:[],tok:0,btn:null,ok:('speechSynthesis' in window),
 init(){if(!this.ok)return;const pick=()=>{this.list=speechSynthesis.getVoices()||[];const named=this.list.find(v=>v.name===S.voice);
  this.v=named||this.list.find(v=>/zh[-_]HK/i.test(v.lang))||this.list.find(v=>/yue|canton|粵|廣東|sin-?ji|hiugaai|hiumaan|wanlung|tracy|danny/i.test(v.name+' '+v.lang))||null};
  pick();try{speechSynthesis.addEventListener('voiceschanged',pick)}catch(e){speechSynthesis.onvoiceschanged=pick}setTimeout(pick,700);setTimeout(pick,2000)},
 isHK(){return !!this.v&&/HK|yue|canton|粵|廣東/i.test(this.v.lang+' '+this.v.name)},
 clean(t){return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu,' ').replace(/[「」『』《》【】（）()]/g,' ').replace(/\$(\d+)/g,'$1蚊').replace(/→/g,'，').replace(/[ \t]+/g,' ').trim()},
 stop(){this.tok++;if(this.ok){try{speechSynthesis.cancel()}catch(e){}}if(this.btn)this.btn.classList.remove('playing');this.btn=null},
 toggle(t,b){if(b&&this.btn===b){this.stop();return}this.say(t,b)},
 say(t,b){if(!this.ok){toast('呢部機唔支援語音朗讀');return}
  this.stop();const my=this.tok;
  const parts=(this.clean(t).match(/[^。！？!?；;\n]+[。！？!?；;]*/g)||[]).map(s=>s.trim()).filter(s=>s.replace(/[，。！？、：\s]/g,'').length);
  if(!parts.length)return;this.btn=b||null;if(b)b.classList.add('playing');let i=0;
  const end=()=>{if(my!==this.tok)return;if(this.btn)this.btn.classList.remove('playing');this.btn=null};
  const next=()=>{if(my!==this.tok)return;if(i>=parts.length){end();return}
   const u=new SpeechSynthesisUtterance(parts[i++]);u.lang=this.v?this.v.lang:'zh-HK';if(this.v)u.voice=this.v;u.rate=S.rate;u.pitch=1;
   u.onend=next;u.onerror=end;speechSynthesis.speak(u)};
  setTimeout(next,60)}};

 const sk='#f0c7a1',ln='#231a2b',cl=col||'#5a6bb0';

  default:return '<circle cx="'+x+'" cy="66" r="7" fill="#fff"/><circle cx="'+x+'" cy="66" r="3.5" fill="'+ln+'"/>'}};
 let eyes=E(83)+E(117);if(L.eye==='happy')eyes+='<path d="M66 64 l-7 -3 M66 69 l-8 1 M134 64 l7 -3 M134 69 l8 1" stroke="'+ln+'" stroke-width="2"/>';
 const mouth={smile:'<path d="M84 90 Q100 106 116 90" stroke="'+ln+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>',tight:'<path d="M88 96 L112 96" stroke="'+ln+'" stroke-width="4" stroke-linecap="round"/>',frown:'<path d="M85 101 Q100 89 115 101" stroke="'+ln+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>'}[L.mouth||'tight'];
 const A=(d)=>'<path d="'+d+'" stroke="'+cl+'" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 const hand=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="8" fill="'+sk+'"/>';
 let arms='';switch(L.arm){

  case 'watch':arms=A('M70 142 L54 210')+hand(54,212)+A('M130 142 L152 176 L114 162')+'<rect x="112" y="152" width="14" height="14" rx="3" fill="#ddd" stroke="#333" stroke-width="2"/>'+hand(108,162);break;

  default:arms=A('M70 142 L50 212')+A('M130 142 L150 212')+hand(50,214)+hand(150,214)}
 const door=L.foot==='door';
 const legs=door?'<path d="M90 234 L100 286 M110 234 L124 286" stroke="#2c3047" stroke-width="15" stroke-linecap="round"/>':'<path d="M90 234 L88 286 M110 234 L112 286" stroke="#2c3047" stroke-width="15" stroke-linecap="round"/>';
 const feet=door?'<ellipse cx="110" cy="292" rx="15" ry="6" fill="#111"/><ellipse cx="136" cy="292" rx="15" ry="6" fill="#111"/>':'<ellipse cx="86" cy="293" rx="10" ry="7" fill="#111"/><ellipse cx="114" cy="293" rx="10" ry="7" fill="#111"/>';
 let extra='';if(L.extra==='bag')extra='<rect x="30" y="205" width="34" height="30" rx="5" fill="#8a5a2b"/><path d="M38 205 Q47 192 56 205" stroke="#8a5a2b" stroke-width="3" fill="none"/><text x="160" y="232" font-size="16">🔑</text>';
 if(L.extra==='sweat')extra='<path d="M140 40 Q133 52 140 56 Q147 52 140 40 Z" fill="#7cc6ff"/><path d="M58 50 Q53 59 58 62 Q63 59 58 50 Z" fill="#7cc6ff"/>';
 const hit=(p,x,y,w,h)=>'<g class="part" data-p="'+p+'"><rect class="hit" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10"/></g>';
 let hits=hit('arm',28,136,144,92)+hit('brow',62,38,76,22)+hit('eye',62,58,76,22)+hit('mouth',76,82,48,26)+hit('foot',66,270,(door?100:68),34);
 if(L.extra==='bag')hits+=hit('extra',24,186,46,54)+hit('extra',150,212,30,28);if(L.extra==='sweat')hits+=hit('extra',128,34,24,28);
 return '<svg viewBox="0 0 200 310" xmlns="http://www.w3.org/2000/svg">'+(door?'<rect x="168" y="150" width="30" height="148" fill="#5b3b22" stroke="#e0b65a" stroke-width="2"/><circle cx="173" cy="226" r="3" fill="#e0b65a"/><text x="183" y="146" font-size="10" fill="#e0b65a" text-anchor="middle">門</text>':'')+
  legs+feet+'<path d="M68 136 Q100 124 132 136 L127 238 L73 238 Z" fill="'+cl+'"/><rect x="92" y="108" width="16" height="22" fill="'+sk+'"/><circle cx="100" cy="70" r="42" fill="'+sk+'"/><path d="M58 64 Q60 22 100 24 Q142 22 142 64 Q130 40 100 42 Q72 40 58 64 Z" fill="#2b1d16"/>'+
  '<path d="'+brow+'" stroke="'+ln+'" stroke-width="4" stroke-linecap="round" fill="none"/>'+eyes+mouth+arms+extra+hits+'</svg>'}
REND.spot=(st,el)=>{let k=0,score=0;const run=()=>{const sc=st.scenes[k];const found=new Set(),seen=new Set();
 el.innerHTML='<div class="ttop"><span class="tag">🔎 觀察偵探 '+(k+1)+' / '+st.scenes.length+'</span><span>對象：'+esc(sc.who)+'</span></div>'+P('情境：'+sc.ctx,'ctx')+
 '<div class="spot"><div class="fig">'+figure(sc.look,sc.col)+'</div><div>'+P('撳佢身上唔同嘅位置去搜證：眉、眼、嘴、手、腳，同埋身邊嘅嘢。要搵齊 '+sc.keys.length+' 個關鍵線索！')+'<div class="tag" id="prog">🔑 線索 0 / '+sc.keys.length+'</div><div id="found"></div></div></div><div id="judge"></div>';
 autoSay('情境：'+sc.ctx);
 el.querySelectorAll('.part').forEach(g=>g.addEventListener('click',()=>{const p=g.dataset.p;if(seen.has(p))return;seen.add(p);
  el.querySelectorAll('.part[data-p="'+p+'"]').forEach(x=>x.classList.add('seen'));const key=sc.keys.includes(p);
  if(key){found.add(p);el.querySelectorAll('.part[data-p="'+p+'"]').forEach(x=>x.classList.add('key'))}
  const t=sc.clues[p]||'冇乜特別。';const d=document.createElement('div');d.className='clue '+(key?'k':'n');d.innerHTML=P((key?'🔑 ':'· ')+t);$('#found').prepend(d);autoSay(t,d.querySelector('.spk'));
  $('#prog').textContent='🔑 線索 '+found.size+' / '+sc.keys.length;if(found.size===sc.keys.length)judge()}));
 const judge=()=>{$('#judge').innerHTML='<div class="fb info">'+HD('🧩 線索齊晒！'+sc.q,'h3')+sc.opts.map((o,j)=>'<div class="choice" data-j="'+j+'"><div class="tx">'+esc(o)+'</div>'+sp(o)+'</div>').join('')+'<div id="jfb"></div></div>';
  autoSay('線索齊晒！'+sc.q);$('#judge').scrollIntoView({behavior:'smooth'});
  $('#judge').querySelectorAll('.choice').forEach(c=>c.onclick=e=>{if(e.target.closest('.spk'))return;const ok=+c.dataset.j===sc.a;if(ok)score++;
   $('#judge').querySelectorAll('.choice').forEach(x=>{x.classList.add('off');if(+x.dataset.j===sc.a)x.classList.add('right')});if(!ok)c.classList.add('wrong');
   const t=(ok?'✅ 推斷正確！':'❌ 再睇下啲線索。')+sc.tip;$('#jfb').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><b>🦉 軍師策略：</b>'+P(t)+'</div>';autoSay(t);
   const d=document.createElement('div');d.className='row';d.innerHTML='<button class="btn gold">'+(k<st.scenes.length-1?'下一個偵查對象 ▶':'完成偵查 ▶')+'</button>';
   d.firstChild.onclick=()=>{if(k<st.scenes.length-1){k++;run();el.scrollIntoView()}else{R.scores.push(score/st.scenes.length);nextStep()}};$('#jfb').appendChild(d)})}};run()};

/* ---------- 時機計 ---------- */
REND.timing=(st,el)=>{let k=0,score=0;const run=()=>{const r=st.rounds[k];let pos=Math.random()*.2,dir=1,live=true,raf;
 let zones='';(r.z||[]).forEach(z=>{zones+='<div class="z y" style="left:'+((z[0]-.08)*100)+'%;width:'+((z[1]-z[0]+.16)*100)+'%"></div><div class="z g" style="left:'+(z[0]*100)+'%;width:'+((z[1]-z[0])*100)+'%"></div>'});
 el.innerHTML='<div class="ttop"><span class="tag">⏳ 時機計 '+(k+1)+' / '+st.rounds.length+'</span><span>得分 '+score.toFixed(1)+'</span></div>'+P(r.ctx,'ctx')+
 P('白色指針會左右移動。綠色係最佳時機，黃色係麻麻，紅色係壞時機。睇清楚情境：如果根本冇好時機，就撳「等陣先」！')+
 '<div class="tbar">'+zones+'<div class="needle" id="ndl"></div></div><div class="tlegend"><span>😣 壞時機</span><span>好時機 😊</span></div><div class="row"><button class="btn gold big" id="go">⚡ 出手！</button><button class="btn ghost big" id="wt">🛑 等陣先</button></div><div id="tfb"></div>';
 autoSay(r.ctx);
 const ndl=$('#ndl');const loop=()=>{if(!live)return;pos+=dir*r.speed;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}ndl.style.left=(pos*100)+'%';raf=requestAnimationFrame(loop)};loop();
 const fin=(pts,txt,good)=>{live=false;cancelAnimationFrame(raf);score+=pts;$('#go').classList.add('dis');$('#wt').classList.add('dis');
  const t=txt+r.why;$('#tfb').innerHTML='<div class="fb '+(good?'good':'bad')+'">'+P(t)+'</div>';autoSay(t);
  const d=document.createElement('div');d.className='row';d.innerHTML='<button class="btn gold">'+(k<st.rounds.length-1?'下一回合 ▶':'完成 ▶')+'</button>';
  d.firstChild.onclick=()=>{if(k<st.rounds.length-1){k++;run()}else{R.scores.push(score/st.rounds.length);nextStep()}};$('#tfb').appendChild(d)};
 $('#go').onclick=()=>{if(r.wait){fin(0,'❌ 呢個時候根本冇好時機，應該等！',false);return}let z='r';(r.z||[]).forEach(q=>{if(pos>=q[0]&&pos<=q[1])z='g';else if(z!=='g'&&pos>=q[0]-.08&&pos<=q[1]+.08)z='y'});
  if(z==='g')fin(1,'✅ 完美時機！',true);else if(z==='y')fin(.5,'🟡 時機麻麻，可能成功，可能唔成功。',false);else fin(0,'❌ 時機唔啱，對方好大機會拒絕你。',false)};
 $('#wt').onclick=()=>{if(r.wait)fin(1,'✅ 好眼光！識得等，係高手。',true);else fin(.2,'🤔 其實呢度有好時機㗎，等得太耐可能錯失機會。',false)};
 };run()};

REND.branch=(st,el)=>{const m={trust:50,power:50,rep:50,heart:50};let node=st.start;
 const meters=()=>'<div class="meters">'+Object.keys(METERS).map(k=>'<div class="meter">'+METERS[k][0]+' '+METERS[k][1]+' <b>'+m[k]+'</b><div class="bar"><i style="width:'+clamp(m[k],0,100)+'%"></i></div></div>').join('')+'</div>';
 const effs=e=>Object.keys(e||{}).map(k=>'<span class="eff '+(e[k]>0?'p':'m')+'">'+METERS[k][0]+METERS[k][1]+(e[k]>0?'+':'')+e[k]+'</span>').join('');
 const draw=()=>{const n=st.nodes[node];
  if(n.end){let t=n.t,sc=n.score;
   if(n.calc){const tot=m.trust+m.power+m.rep+m.heart;sc=clamp((tot-170)/150,0,1);
    t=tot>=310?'🏆 大軍師級表現！你揀啱時機、處理到每個人嘅算盤、化敵為友、仲將功勞分俾大家。義賣日之後，老師同學都信你、撐你，下次你想做乜，大家都會幫手。':tot>=260?'👍 好有軍師嘅樣！大部分決定都好聰明，有幾步可以再諗深一層。睇下邊個數值低咗，再玩一次。':'🌱 義賣辦成咗，但你蝕咗唔少信任同名聲。返去重溫邊一章，再挑戰一次！';
    if(m.heart<45)t+='\n⚠️ 你嘅良心值好低。用奸計可能贏一場仗，但會輸咗你自己，同埋所有人對你嘅信任。謀略係工具，良心係羅盤。';
    else t+='\n🧭 你守住咗良心。記住：謀略係工具，目標要正。'}
   R.scores.push(sc);el.innerHTML=meters()+'<div class="fb '+(sc>=.7?'good':'info')+'">'+P(t,'big')+'</div>';autoSay(t);nextBtn(el);return}
  el.innerHTML='<span class="tag">🎭 情境抉擇</span>'+meters()+P(n.t,'big')+'<div id="cs">'+n.c.map((c,j)=>'<div class="choice" data-j="'+j+'"><div class="tx">'+esc(c[0])+'</div>'+sp(c[0])+'</div>').join('')+'</div><div id="bfb"></div>';
  autoSay(n.t);
  el.querySelectorAll('.choice').forEach(c=>c.onclick=e=>{if(e.target.closest('.spk'))return;const ch=n.c[+c.dataset.j];
   el.querySelectorAll('.choice').forEach(x=>x.classList.add('off'));c.classList.add('right');
   Object.keys(ch[2]||{}).forEach(k=>m[k]=clamp(m[k]+ch[2][k],0,100));
   if(ch[3]||Object.keys(ch[2]||{}).length){$('#bfb').innerHTML='<div class="fb info">'+effs(ch[2])+(ch[3]?P(ch[3]):'')+'</div>';if(ch[3])autoSay(ch[3])}
   const d=document.createElement('div');d.className='row';d.innerHTML='<button class="btn gold">繼續 ▶</button>';d.firstChild.onclick=()=>{node=ch[1];draw();el.scrollIntoView()};$('#bfb').appendChild(d)})};draw()};

REND.alliance=(st,el)=>{
 const NEED={face:'想被重視、有地位',ball:'想小息有多啲時間踢波',fun:'想班入面多啲好玩活動',quiet:'想有安靜地方睇書',protect:'怕被大Joe班人蝦，想有安全感',fair:'好憎唔公平，想分工公平',study:'擔心成績，想有人一齊溫書'};

REND.negotiate=(st,el)=>{const max0=40+rand(0,12);let max=max0,offer=12,pat=4,batna=null,valueN=0,over=false,asked=false;const log=[];
 const mood=()=>pat>=4?'😊':pat===3?'🙂':pat===2?'😐':'😤';
 const intro='你手上有一張限量版閃卡。阿Ken好想要。你嘅目標：用最好嘅價錢賣出去，但唔可以講大話。阿Ken嘅耐性有限，佢唔耐煩就會走。';
 const L=t=>log.unshift(t);
 const draw=()=>{el.innerHTML='<span class="tag">💎 談判桌：吊高來賣</span>'+P(intro)+'<div class="panel" style="margin:10px 0"><div class="ken"><div class="face">'+mood()+'</div><div><b>阿Ken 而家出價</b><div class="offer">$'+offer+'</div><div class="muted">耐性：'+'❤️'.repeat(Math.max(pat,0))+'</div>'+(batna?'<div class="tag">🚪 後備方案：小美肯出 $'+batna+'</div>':'')+'</div></div></div>'+
  '<div class="choice" data-a="info"'+(asked?' style="opacity:.4;pointer-events:none"':'')+'><div class="tx">🕵️ 先打聽行情，問下其他同學</div></div>'+
  '<div class="choice" data-a="value"'+(valueN>=2?' style="opacity:.4;pointer-events:none"':'')+'><div class="tx">📣 講出張卡嘅真實價值（全校得三張、新淨）</div></div>'+
  '<div class="choice" data-a="cool"><div class="tx">🐢 「我唔係好急，你慢慢諗。」</div></div>'+
  '<div class="choice" data-a="walk"><div class="tx">🚪 「咁算啦，我諗下賣俾其他人。」轉身行開</div></div>'+
  '<div class="choice" data-a="reveal"><div class="tx">😰 老實講：「其實我好需要錢買媽媽生日禮物……」</div></div>'+
  '<div class="panel" style="margin-top:10px"><b>💬 還價：</b> <span class="offer" id="cv" style="font-size:24px">$'+Math.max(offer+10,30)+'</span><input type="range" id="cr" min="10" max="100" value="'+Math.max(offer+10,30)+'"><div class="row"><button class="btn" id="ct">💬 開呢個價</button><button class="btn gold" id="ac">🤝 接受 $'+offer+'</button></div></div>'+
  '<div class="log">'+(log.length?log.map(x=>'<div>'+esc(x)+'</div>').join(''):'<div>談判記錄會喺度顯示。</div>')+'</div>';
  $('#cr').oninput=e=>$('#cv').textContent='$'+e.target.value;
  $('#ct').onclick=()=>counter(+$('#cr').value);$('#ac').onclick=()=>deal(offer,'你接受咗阿Ken嘅出價。');
  el.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>action(c.dataset.a))};
 const tick=()=>{if(!over&&pat<=0){end('阿Ken：「唉，算啦，我唔要喇。」佢走咗。')}else if(!over)draw()};
 const action=a=>{if(over)return;
  if(a==='info'){asked=true;batna=22;L('🕵️ 小美話，如果你唔賣俾阿Ken，佢願意出 $22。你而家有後備方案喇！')}
  if(a==='value'){valueN++;max+=5;offer=Math.min(max,offer+4);L('📣 你講出張卡點解咁難得。阿Ken：「全校得三張？咁……我加到 $'+offer+'。」')}
  if(a==='cool'){if(pat>=2){offer=Math.min(max,offer+5);L('🐢 阿Ken有啲急：「唔好咁啦，我加到 $'+offer+' 啦！」')}else L('🐢 阿Ken開始唔耐煩……');pat--}
  if(a==='walk'){if(offer<max-4&&pat>=2){offer=max-rand(0,3);pat=1;L('🚪 你一轉身，阿Ken即刻追上嚟：「等等！$'+offer+'，最後價！」')}else{end('🚪 你行開咗，阿Ken：「咁算啦。」佢真係唔要喇。');return}}
  if(a==='reveal'){max=Math.max(offer,max-12);offer=Math.max(8,offer-4);L('😰 阿Ken笑咗：「咁你應該好急喎……我出返 $'+offer+' 啦。」（亮咗底牌！）')}
  tick()};
 const counter=x=>{if(over)return;
  if(x<=offer){deal(x,'你開嘅價仲低過佢出價！阿Ken即刻答應。💡 唔好低過對方肯出嘅價。');return}
  if(x<=max){if(x-offer<=6){deal(x,'阿Ken諗咗一陣：「好啦，成交！」');return}offer=Math.round(offer+(x-offer)*.5);pat--;L('💬 你開價 $'+x+'。阿Ken：「太貴喇……$'+offer+' 啦。」')}
  else if(x<=max*1.4){offer=Math.min(max,offer+3);pat--;L('💬 你開價 $'+x+'。阿Ken：「咁貴？最多 $'+offer+'。」')}
  else{pat-=2;L('💬 你開價 $'+x+'。阿Ken：「你搶錢呀？！」佢好唔高興。')}
  tick()};
 const deal=(p,why)=>{over=true;finish(p,why,true)};
 const end=why=>{over=true;const p=batna||8;finish(p,why+(batna?' 好彩你有後備方案，賣咗俾小美 $'+batna+'。':' 你冇後備方案，最後只可以平賣 $8。'),false)};
 const finish=(p,why,dealt)=>{const ratio=clamp(p/max0,0,1.2);const sc=clamp(ratio,0,1);R.scores.push(sc);

  const t=why+'\n最後成交價：$'+p+'。阿Ken原本最高肯出 $'+max0+'。\n'+grade;
  el.innerHTML='<span class="tag">💎 談判結果</span><div class="scene">'+(ratio>=.65?'🤝':'😅')+'</div>'+P(t,'big')+'<div class="fb info">'+P('高手秘訣：先打聽行情，攞到後備方案；講出真實價值；唔好亮底牌；開價要高過對方出價，但唔好離譜；識得以退為進。')+'</div><div class="log">'+log.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div><div class="row"><button class="btn ghost" id="retry">🔁 再傾一次</button></div>';
  autoSay(t);$('#retry').onclick=()=>{R.scores.pop();REND.negotiate(st,el)};nextBtn(el)};
 draw();autoSay(intro)};

 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(N*s+.3,.2,N*s+.3)),new THREE.LineBasicMaterial({color:0xe0b65a,transparent:true,opacity:.7}));edge.position.y=-.08;sc.add(edge);

 const PN=600,pp=new Float32Array(PN*3);for(let i=0;i<PN;i++){pp[i*3]=(Math.random()-.5)*30;pp[i*3+1]=Math.random()*14;pp[i*3+2]=(Math.random()-.5)*30}
