<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff8a3d">
<meta name="description" content="象棋小學堂：用廣東話由零開始教小朋友捉中國象棋，由認識棋子到殺法、戰術、開局、中局、殘局，可以同電腦對弈，每一步都有思考過程解釋。">
<title>象棋小學堂 — 由零開始學中國象棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6e2bd' stroke='%23a8773e' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23c92a2a' stroke-width='2'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23c92a2a' font-weight='900'%3E帥%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff7e8; --bg2:#ffefd2; --ink:#3b2a1a; --ink2:#7a5c3e; --card:#ffffff;
  --pri:#ff8a3d; --pri2:#ff6b1a; --ok:#2fb344; --bad:#f03e3e; --info:#228be6; --gold:#f5a400; --pur:#9c4dcc;
  --wood1:#f6d9a4; --wood2:#e8bd78; --line:#6b4422; --shadow:0 6px 18px rgba(120,70,20,.15);
  --r:20px; --font:"PingFang HK","Noto Sans HK","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --kai:"Kaiti TC","STKaiti","BiauKai","DFKai-SB","KaiTi","Noto Serif TC","PMingLiU",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overscroll-behavior:none}
body{background:radial-gradient(circle at 10% 0%,#fff3d6 0,transparent 40%),radial-gradient(circle at 90% 100%,#ffe2c4 0,transparent 45%),var(--bg);touch-action:manipulation}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;touch-action:manipulation}
b,strong{color:#c2410c}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,#ff9a4d,#ff7a2e);color:#fff;box-shadow:0 3px 12px rgba(255,120,40,.35);z-index:5;flex:0 0 auto}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;letter-spacing:1px;cursor:pointer;white-space:nowrap}
#topbar .logo svg{width:38px;height:38px}
#topbar .sp{flex:1}
.tb-chip{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap;color:#fff;font-size:15px}
.tb-btn{background:rgba(255,255,255,.95);color:#e8590c;border-radius:14px;padding:7px 12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tb-btn:active{transform:translateY(2px);box-shadow:none}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto;display:none;padding:18px}
.screen.on{display:block;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- home ---------- */
.hero{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:22px;background:var(--card);border-radius:28px;padding:22px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffe8cc;opacity:.6}
.hero .mascot{width:130px;flex:0 0 auto;z-index:1}
.hero h1{margin:0 0 6px;font-size:30px;color:#e8590c}
.hero p{margin:4px 0;color:var(--ink2);z-index:1;position:relative}
.cards{max-width:980px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);text-align:left;transition:transform .15s;position:relative;overflow:hidden;color:var(--ink)}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.97)}
.card .ic{font-size:44px;line-height:1}
.card h3{margin:8px 0 4px;font-size:21px}
.card p{margin:0;color:var(--ink2);font-size:15px}
.card .bar{height:8px;border-radius:9px;background:#f1e4d0;margin-top:10px;overflow:hidden}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb84d,#ff7a2e)}
.tip-box{max-width:980px;margin:0 auto 20px;background:#fffbe6;border:2px dashed #ffd43b;border-radius:20px;padding:14px 18px;color:#8a5a00}
/* ---------- map ---------- */
.map-wrap{max-width:900px;margin:0 auto}
.stage{background:var(--card);border-radius:26px;padding:16px 18px 18px;margin:0 0 18px;box-shadow:var(--shadow);border-left:10px solid var(--sc,#ffb84d)}
.stage.locked{opacity:.55;filter:grayscale(.6)}
.stage-h{display:flex;align-items:center;gap:12px}
.stage-h .big{font-size:40px}
.stage-h h2{margin:0;font-size:22px}
.stage-h p{margin:0;color:var(--ink2);font-size:15px}
.lessons{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.les{width:104px;min-height:110px;border-radius:22px;background:#fff8ee;border:3px solid #f3dcc0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;text-align:center;position:relative;color:var(--ink)}
.les .ic{font-size:32px}
.les .nm{font-size:14px;font-weight:700;line-height:1.25;margin-top:4px}
.les .st{font-size:13px;letter-spacing:-1px;height:16px}
.les.done{background:#ebfbee;border-color:#8ce99a}
.les.next{border-color:var(--pri);box-shadow:0 0 0 4px rgba(255,138,61,.25);animation:pulse 1.6s infinite}
.les.lock{opacity:.5}
.les.lock:after{content:"🔒";position:absolute;top:4px;right:6px;font-size:14px}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,138,61,.08)}}
/* ---------- board screen ---------- */
#scr-board{padding:10px;display:none}
#scr-board.on{display:flex;gap:14px}
.bcol{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;min-width:0;gap:8px}
.scol{flex:0 0 430px;max-width:430px;display:flex;flex-direction:column;min-height:0;gap:10px}
#boardWrap{position:relative;width:100%;display:flex;justify-content:center}
#board{width:min(100%,calc((100vh - 190px) * 0.906));width:min(100%,calc((100dvh - 190px) * 0.906));height:auto;display:block;user-select:none;-webkit-user-select:none;touch-action:none;filter:drop-shadow(0 10px 18px rgba(110,60,10,.28))}
.bctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{background:#fff;color:var(--ink);border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 #e9d3b5,0 4px 10px rgba(0,0,0,.06);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #e9d3b5}
.btn.pri{background:linear-gradient(180deg,#ffa25c,#ff7a2e);color:#fff;box-shadow:0 3px 0 #d9561a}
.btn.ok{background:linear-gradient(180deg,#51cf66,#2fb344);color:#fff;box-shadow:0 3px 0 #237a33}
.btn.blue{background:linear-gradient(180deg,#4dabf7,#228be6);color:#fff;box-shadow:0 3px 0 #1864ab}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid #e9d3b5}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 10px;min-height:36px;font-size:15px}
/* advantage tug */
.tug{width:min(100%,560px);display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.tug .tr{flex:1;height:16px;border-radius:10px;background:#333;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.tug .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff6b6b,#e03131);transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.tug .tr:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff8}
.tug .lbl{min-width:40px;text-align:center}
.tug .rd{color:#e03131}.tug .bk{color:#222}
/* side panel */
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;position:relative}
.panel.grow{flex:1;overflow:auto;min-height:0}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ph h3{margin:0;font-size:19px;flex:1}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.prog i{width:12px;height:12px;border-radius:50%;background:#f1e4d0}
.prog i.d{background:#8ce99a}.prog i.c{background:var(--pri);transform:scale(1.25)}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .mas{width:64px;flex:0 0 64px}
.bubble .tx{background:#fff4e6;border-radius:18px;padding:11px 14px;position:relative;flex:1;font-size:17px}
.bubble .tx:before{content:"";position:absolute;left:-9px;top:20px;border:9px solid transparent;border-right-color:#fff4e6;border-left:0}
.spk{background:#ffe8cc;color:#e8590c;border-radius:50%;width:38px;height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;vertical-align:middle;margin-left:4px;box-shadow:0 2px 0 #ffc078}
.spk.sm{width:30px;height:30px;min-width:30px;font-size:15px}
.spk.playing{background:#ff8a3d;color:#fff;animation:wob .6s infinite alternate}
@keyframes wob{to{transform:scale(1.15)}}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.opt{background:#fff;border:3px solid #f0dcc2;border-radius:16px;padding:11px 14px;text-align:left;font-weight:700;color:var(--ink)}
.opt.right{border-color:var(--ok);background:#ebfbee}
.opt.wrong{border-color:#ffa8a8;background:#fff5f5;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:10px;border-radius:16px;padding:10px 14px;font-weight:600}
.fb.good{background:#ebfbee;color:#1b6e2b}
.fb.try{background:#fff9db;color:#8a5a00}
.navrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.navrow .sp{flex:1}
/* brain */
.brain h4{margin:0;font-size:17px;display:flex;align-items:center;gap:6px}
.think-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#f3f0ff,#e7f5ff);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.think-head .who{font-weight:900;flex:1}
.stepc{border-radius:16px;border:2px solid #eee;margin:7px 0;overflow:hidden;background:#fff;transition:border-color .2s}
.stepc .sh{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-weight:800}
.stepc .sh .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:0 0 28px}
.stepc .sh .sum{flex:1;font-weight:600;font-size:15px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepc .sb{padding:0 12px 10px 46px;font-size:16px;display:none}
.stepc.open .sb{display:block}
.stepc.open .sh .sum{white-space:normal}
.stepc.s1 .n{background:#4dabf7}.stepc.s2 .n{background:#f03e3e}.stepc.s3 .n{background:#2fb344}.stepc.s4 .n{background:#f59f00}.stepc.s5 .n{background:#9c4dcc}
.stepc.open.s1{border-color:#4dabf7}.stepc.open.s2{border-color:#f03e3e}.stepc.open.s3{border-color:#2fb344}.stepc.open.s4{border-color:#f59f00}.stepc.open.s5{border-color:#9c4dcc}
.stepc.reveal{animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateX(-14px) scale(.96)}to{opacity:1;transform:none}}
.cand{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px}
.cand .tag{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 24px}
.cand .nm{width:86px;font-weight:800;font-family:var(--kai);font-size:17px}
.cand .bb{flex:1;height:12px;background:#f1f3f5;border-radius:8px;overflow:hidden}
.cand .bb i{display:block;height:100%;border-radius:8px}
.cand .sc{width:52px;text-align:right;font-weight:700;color:var(--ink2);font-size:14px}
.cand.chosen{background:#fff9db;border-radius:10px;padding:3px 4px}
.why{font-size:14.5px;color:#555;margin:0 0 6px 32px}
.pvline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.pvm{border-radius:10px;padding:3px 8px;font-family:var(--kai);font-weight:800;font-size:16px}
.pvm.r{background:#ffe3e3;color:#c92a2a}.pvm.k{background:#e9ecef;color:#212529}
.reason{display:flex;gap:6px;margin:3px 0}
.verdict{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 12px;margin-bottom:8px;font-weight:800}
.verdict .em{font-size:34px}
.v-best{background:#ebfbee;color:#1b6e2b}.v-good{background:#e7f5ff;color:#1864ab}.v-ok{background:#fff9db;color:#8a5a00}.v-weak{background:#fff4e6;color:#a34b00}.v-blunder{background:#fff5f5;color:#c92a2a}
.movelist{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--kai);font-size:15px;max-height:120px;overflow:auto}
.movelist span{padding:2px 7px;border-radius:8px;background:#f8f1e7;cursor:pointer}
.movelist span.cur{background:#ffd8a8}
.movelist span.r{color:#c92a2a}
.thinking{display:flex;align-items:center;gap:10px;padding:10px;font-weight:800;color:var(--ink2)}
.dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--pri);animation:bop 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bop{50%{transform:translateY(-6px);opacity:.5}}
/* setup */
.setup{max-width:900px;margin:0 auto}
.setup h2{margin:6px 0 10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{background:#fff;border-radius:22px;padding:16px;border:4px solid transparent;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.mode.sel{border-color:var(--pri)}
.mode .ic{font-size:40px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lvl{background:#fff;border-radius:18px;padding:10px;border:3px solid #f0dcc2;text-align:center;color:var(--ink)}
.lvl.sel{border-color:var(--pri);background:#fff4e6}
.lvl .ic{font-size:30px}.lvl .nm{font-weight:900}.lvl .ds{font-size:13px;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.seg{display:inline-flex;background:#f1e4d0;border-radius:14px;padding:4px}
.seg button{background:transparent;border-radius:11px;padding:8px 14px;font-weight:800;color:var(--ink2)}
.seg button.sel{background:#fff;color:#e8590c;box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(60,30,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:28px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#3b2a1a;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:60;transition:transform .3s;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.big-emoji{font-size:64px;text-align:center}
.center{text-align:center}
.stars-big{font-size:44px;text-align:center;letter-spacing:4px}
.ranklist{display:grid;gap:10px}
.rank{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.rank .ic{font-size:34px}.rank.got{background:#ebfbee}.rank.cur{outline:4px solid var(--pri)}
.rank .nm{font-weight:900;font-size:18px}.rank .nd{font-size:14px;color:var(--ink2)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed #eee}
.sw{width:56px;height:32px;border-radius:20px;background:#ddd;position:relative;transition:.2s;flex:0 0 56px}
.sw:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on:after{left:27px}
.warnv{background:#fff4e6;border-radius:14px;padding:10px 12px;font-size:15px;color:#a34b00;margin:8px 0}
/* svg board pieces */
.pc{cursor:pointer}
.pc text{font-family:var(--kai);font-weight:900;font-size:34px;pointer-events:none}
.pc.sel .base{stroke:#ffd43b;stroke-width:5}
.ringp{animation:ringp 1.2s infinite}
@keyframes ringp{50%{stroke-width:7;opacity:.55}}
.starp{animation:twinkle 1.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{50%{transform:scale(1.2) rotate(10deg)}}
.chk{animation:chk .8s infinite}
@keyframes chk{50%{opacity:.35}}
@media (max-width:1000px), (orientation:portrait){
  #scr-board.on{flex-direction:column;overflow:auto}
  .scol{flex:0 0 auto;max-width:none;width:100%}
  .panel.grow{overflow:visible}
  #board{width:min(100%,calc((100vh - 330px) * 0.906),640px);width:min(100%,calc((100dvh - 330px) * 0.906),640px)}
}
@media (max-width:600px){
  html,body{font-size:16px}
  #topbar .logo span{display:none}
  .hero{flex-direction:column;text-align:center}
  .les{width:94px}
  #board{width:100%}
  .tb-chip.hide-s{display:none}
}
.jump{animation:jump .6s 2}
@keyframes jump{30%{transform:translateY(-12px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ "}
details[open]>summary:before{content:"▾ "}
.crow{cursor:pointer;border-radius:10px;padding:3px 4px;transition:background .15s}
.crow:hover{background:#f8f1e7}
.crow.sel{outline:3px solid #228be6;background:#e7f5ff}
.why .what{font-weight:700;color:#5c3d1e}
details.more>summary{cursor:pointer;font-weight:800;color:#1864ab;margin:6px 0}
.pvrow{border:2px solid #f1e4d0;border-radius:14px;padding:6px 8px;margin:7px 0;cursor:pointer;background:#fff}
.pvrow.chosen{border-color:#f59f00;background:#fff9db}
.pvrow.sel{border-color:#228be6;background:#e7f5ff}
.pvrow .pvline{margin:2px 0}
.pvrow .why{margin:2px 0 0 0}
.pvrow .btn.sm{min-height:30px;padding:3px 10px;margin-left:auto}
.pvrow .tag{width:22px;height:22px;min-width:22px;border-radius:50%;color:#fff;font-weight:900;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.pvrow .pvline{align-items:center}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo" id="tb-logo" data-go="home">象棋小學堂</div>
    <span class="sp"></span>
    <button class="tb-chip" id="tb-rank" data-go="ranks"></button>
    <span class="tb-chip hide-s" id="tb-stars"></span>
    <button class="tb-btn" data-go="home" aria-label="主頁">🏠</button>
    <button class="tb-btn" data-go="settings" aria-label="設定">⚙️</button>
  </header>
  <main>
    <section class="screen" id="scr-home"></section>
    <section class="screen" id="scr-map"></section>
    <section class="screen" id="scr-setup"></section>
    <section class="screen" id="scr-ranks"></section>
    <section class="screen" id="scr-book"></section>
    <section class="screen" id="scr-study"></section>
    <section class="screen" id="scr-board">
      <div class="bcol">
        <div class="tug" id="tug"></div>
        <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="象棋棋盤"></svg></div>
        <div class="bctrl" id="bctrl"></div>
      </div>
      <div class="scol" id="side"></div>
    </section>
  </main>
</div>
<div id="modal"><div class="box"></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<noscript>請開啟 JavaScript 先可以使用象棋小學堂。</noscript>

    { t: 'talk', fen: '9/9/9/9/9/9/9/9/3N5/2B6 w', marks: { ring: ['d1'], x: ['e2'] }, say: '小心！如果「田」字中間嗰點有棋子擋住，相就飛唔過去，我哋叫呢個做「**塞象眼**」。你睇，有隻馬企咗喺象眼，相就飛唔到去嗰度喇。' },
    { t: 'quiz', fen: '9/9/9/9/9/9/9/9/9/2B6 w', marks: { river: true }, say: '相可唔可以過河去對面？', opts: [
      { a: '可以', why: '唔得㗎，相同象只可以喺自己嗰邊保護屋企。' },
      { a: '唔可以', ok: true, why: '啱晒！相唔過河，專心防守。' }] }
  ] },
  { id: 'L5', icon: '🚗', title: '車', steps: [
    { t: 'talk', fen: '9/9/9/9/9/9/9/9/9/R8 w', marks: { arrows: [['a0', 'a9', 'g'], ['a0', 'i0', 'g']] }, say: '**車**係最勁嘅棋子！佢可以**打直或者打橫，想行幾多格都得**，只要中間冇棋子擋住。車值**9分**，係最值錢嘅棋子。' },
    { t: 'stars', fen: '9/9/9/9/9/9/9/9/9/R8 w', piece: 'a0', stars: ['a5', 'i5', 'i9'], say: '開車去食⭐星星！車可以一下子衝好遠㗎！', win: '嘩，車真係好快！' },
    { t: 'eat', fen: '9/9/9/p3p4/9/9/9/4p4/9/R8 w', say: '而家學**食子**：行去對方棋子嘅位置，就可以食咗佢！用你架車食晒三隻黑卒啦！', win: '全部食晒！你已經識得用車食子喇！' }

  { id: 'L6', icon: '🐴', title: '馬', steps: [
    { t: 'talk', fen: '9/9/9/9/9/4N4/9/9/9/9 w', marks: { dots: ['d6', 'f6', 'c5', 'g5', 'c3', 'g3', 'd2', 'f2'] }, say: '**馬**行「**日**」字：先打直或者打橫行一格，再斜出去一格。一隻喺中間嘅馬，最多有八個地方可以跳！馬值**4分**。' },
    { t: 'stars', fen: '9/9/9/9/9/9/9/9/9/1N7 w', piece: 'b0', stars: ['c2', 'd4', 'e6'], say: '跳馬去食⭐星星！記住行「日」字呀！', win: '好靚嘅跳馬！' },
    { t: 'talk', fen: '9/9/9/9/4P4/4N4/9/9/9/9 w', marks: { ring: ['e5'], x: ['d6', 'f6'] }, say: '馬都有弱點！如果佢行嘅方向，**貼住佢嗰一格**有棋子，馬就跳唔過去，叫做「**蹩馬腳**」。你睇，兵擋住咗馬向上跳嘅路。' },
    { t: 'stars', fen: '9/9/9/9/4P4/4N4/9/9/9/9 w', piece: 'e4', stars: ['d6'], say: '挑戰！馬腳俾兵蹩住咗，直接跳唔到上面粒⭐。你可唔可以**兜個圈**跳過去？', win: '你好醒！識得兜路避開蹩馬腳！' }
  ] },
  { id: 'L7', icon: '💣', title: '炮', steps: [
    { t: 'talk', fen: '9/9/9/9/9/9/9/1C7/9/9 w', say: '**炮**平時行路同車一樣：打直打橫，行幾多格都得。但係**食子嘅時候，一定要隔住一隻棋子跳過去食**！中間嗰隻叫「**炮架**」。所以人哋話炮係「**隔山打牛**」。炮值**4.5分**。' },
    { t: 'talk', fen: '9/9/1n7/9/9/1P7/9/1C7/9/9 w', marks: { arrows: [['b2', 'b7', 'r']], ring: ['b4'] }, say: '你睇：炮同黑馬中間，剛好有**一隻**紅兵做炮架，所以炮可以跳過兵，食咗隻馬！如果中間冇棋子或者有兩隻，就食唔到喇。' },
    { t: 'eat', fen: '9/9/1n2b2r1/9/9/1P7/9/1C7/9/9 w', targets: ['b7', 'h7'], say: '用炮食咗隻**黑馬**同**黑車**！記住要搵炮架呀！（提示：象都可以做炮架㗎！）', win: '炮手好勁！隔山打牛成功！' }
  ] },
  { id: 'L8', icon: '🪖', title: '兵同卒', steps: [
    { t: 'talk', fen: '9/9/9/9/9/9/4P4/9/9/9 w', marks: { river: true }, say: '**兵**（黑方叫**卒**）每次只可以**向前行一格**，而且**永遠唔可以後退**。但係一過咗河，佢就變勁咗，可以**打橫行**！過河之前值1分，過河之後值**2分**。' },
    { t: 'stars', fen: '9/9/9/9/9/9/4P4/9/9/9 w', piece: 'e3', stars: ['e5', 'd6', 'c6'], say: '帶隻兵過河，食晒⭐星星！', win: '小兵過河變英雄！' },
    { t: 'quiz', fen: '9/9/9/9/4P4/9/9/9/9/9 w', say: '兵可唔可以向後退？', opts: [
      { a: '可以', why: '唔得呀，兵只可以向前衝，永不回頭！' },
      { a: '唔可以', ok: true, why: '啱！兵勇往直前，一步都唔退。' }] }
  ] },
  { id: 'L9', icon: '💰', title: '棋子值幾多分', steps: [
    { t: 'talk', fen: START, say: '每隻棋子都有唔同嘅價值。記住呢個表：**車9分、炮4.5分、馬4分、仕士2分、相象2分、兵卒1分（過河2分）**。帥將就無價，因為冇咗就輸！' },
    { t: 'talk', fen: START, say: '點解要識分數呢？因為**交換棋子**嘅時候，你要知自己係賺定蝕。例如用1分嘅兵換對方4分嘅馬，就賺咗3分！' },
    { t: 'quiz', say: '用你隻**炮**（4.5分）換對方架**車**（9分），抵唔抵？', opts: [
      { a: '好抵！賺咗', ok: true, why: '冇錯！你賺咗4.5分，好划算。' },
      { a: '唔抵，蝕咗', why: '再諗吓：車9分，比炮4.5分多好多，所以係賺㗎！' }] },
    { t: 'quiz', say: '用你架**車**換對方隻**兵**，抵唔抵？', opts: [
      { a: '抵', why: '唔抵呀！9分換1分，蝕好多。' },
      { a: '唔抵', ok: true, why: '啱晒！車好珍貴，唔好隨便換走佢。' }] }
  ] },
  { id: 'L10', icon: '📣', title: '將軍同應將', steps: [
    { t: 'talk', fen: '4k4/9/9/9/9/4R4/9/9/9/3K5 b', marks: { arrows: [['e4', 'e9', 'r']] }, say: '如果你嘅棋子下一步可以食到對方嘅將，就叫做「**將軍**」！就好似話：「喂，你嘅皇帝有危險喇！」' },
    { t: 'goal', goal: 'check', fen: '4k4/9/9/9/9/R8/9/9/9/3K5 w', say: '試吓用你架**車**將軍！', win: '將軍！黑將而家有危險喇！', hints: ['車可以打直或者打橫行，搵條路對住黑將。', '試吓將車行去中間嗰條直線，或者行到最頂嗰條橫線。'] },
    { t: 'talk', fen: '3k5/9/9/9/9/4r4/9/9/9/4K4 w', marks: { arrows: [['e4', 'e0', 'r']] }, say: '如果俾人將軍，一定要即刻救返個帥！有三招：**一、走開**；**二、擋住**；**三、食咗佢**。我哋逐招練習！' },
    { t: 'goal', goal: 'moves', accept: ['e0f0'], fen: '3k5/9/9/9/9/4r4/9/9/9/4K4 w', say: '**第一招：走開**。黑車將緊你個帥，帥要搵個安全位置避開！', win: '走得好！帥避開咗。留意帥唔可以行去左邊，因為會同黑將面對面！', hints: ['帥只可以行一格，試吓左右兩邊。', '左邊會同黑將白臉相對，所以要行去右邊。'] },
    { t: 'goal', goal: 'moves', accept: ['d0e1'], fen: '4k4/9/9/9/9/9/9/9/4r4/3AK4 w', say: '**第三招：食咗佢**。黑車衝到帥面前，搵隻棋子食咗佢！', win: '好嘢！用仕食咗架車！留意帥自己唔可以食，因為食咗之後會同黑將面對面。', hints: ['邊隻棋子可以斜行一格去黑車嗰度？', '用仕斜斜咁食咗黑車！'] },
    { t: 'goal', goal: 'moves', accept: ['a2e2'], fen: '3k5/9/9/9/4r4/9/9/R8/9/4K4 w', say: '**第二招：擋住**。用你架車擋喺黑車同帥中間！', win: '擋得好！車好似一面盾牌咁保護住帥。', hints: ['車可以打橫行，去帥前面嘅直線。', '將車打橫行去中間嗰條線。'] }
  ] },
  { id: 'L11', icon: '🏁', title: '將死同困斃', steps: [

    { t: 'goal', goal: 'mate', n: 1, fen: '4k4/R8/9/9/9/8R/9/9/9/3K5 w', say: '輪到你！用一步**將死**黑將！提示：兩架車可以合作㗎。', win: '將死！兩架車一上一下，黑將無路可逃！', hints: ['下面嗰架車已經封住咗第二行。', '用另一架車喺最頂嗰行將軍！'] },
    { t: 'talk', fen: '3k5/9/3P5/9/9/9/9/9/9/R3K4 b', marks: { ring: ['d9'] }, say: '仲有一種情況叫「**困斃**」：對方冇俾人將軍，但係**佢一步都行唔到**。喺中國象棋，**困斃都係輸㗎**！你睇，黑將左邊會同帥白臉，下面又俾兵望住，冇棋可行喇。' },
    { t: 'talk', fen: START, say: '最後一條規矩：唔可以**長將**，即係不停咁將軍、將極都唔停。比賽入面，長將嘅一方要變着，唔變就判輸。所以將軍要有計劃，唔好亂將！' }
  ] },
  { id: 'L12', icon: '📝', title: '識睇棋譜', steps: [
    { t: 'talk', fen: START, marks: { files: true }, say: '高手會用文字記低每一步，叫做**記譜**。紅方由**右至左**數直線：一、二、三……九；黑方用阿拉伯數字，由佢自己嘅右手邊數：1至9。' },
    { t: 'talk', fen: START, marks: { files: true, arrows: [['h2', 'e2', 'g']] }, say: '例如「**炮二平五**」：「炮二」即係企喺第二條直線嘅炮；「**平**」即係打橫行；「五」即係去第五條線。「**進**」係向前，「**退**」係向後。' },
    { t: 'goal', goal: 'moves', accept: ['h2e2'], fen: START, marks: { files: true }, say: '請你行：**炮二平五**', win: '完全正確！呢步叫「當頭炮」，係最常見嘅開局！', hints: ['搵右邊第二條直線上面嘅炮。', '將佢打橫行去正中間第五條線。'] },
    { t: 'goal', goal: 'moves', accept: ['h0g2'], fen: START, marks: { files: true }, say: '請你行：**馬二進三**（馬向前跳，跳去第三條線）', win: '好叻！你已經識睇棋譜喇！', hints: ['右邊第二條線上面嘅馬。', '向前跳日字，落喺第三條線。'] },
    { t: 'goal', goal: 'moves', accept: ['h9g7'], fen: 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C2C4/9/RNBAKABNR b', marks: { files: true }, say: '換你做黑方！請你行：**馬8進7**（黑方由佢自己右手邊數，即係由畫面左邊數過嚟）', win: '超叻！紅黑兩邊嘅記譜你都識晒！', hints: ['黑方嘅數字由畫面左邊開始數：1、2、3……', '第8條線即係畫面右邊第二條，向前（向下）跳去第7條線。'] }
  ] }

    { t: 'goal', goal: 'mate', n: 1, fen: '3k5/9/3N5/9/9/8C/9/9/9/5K3 w', say: '用**馬後炮**將死黑將！', win: '馬後炮成功！馬封路，炮將軍，完美配合！', hints: ['馬已經企喺黑將同一條直線。', '將炮打橫行去馬嘅後面！'] }

  ] },
  { id: 'M7', icon: '🧨', title: '棄車殺（兩步）', steps: [

    { t: 'goal', goal: 'mate', n: 2, fen: '3a5/5k3/5a2b/5R3/9/9/5R3/9/9/3K5 w', say: '兩步將死！諗清楚對方會點應，再落手。', win: '好勁！你識得棄車！前車犧牲咗，後車就殺入去！', hints: ['兩架車企喺同一條直線。', '前面嗰架車衝上去食士將軍！'] }

{ id: 's5', name: '中局大作戰', icon: '🔥', color: '#cc5de8',

  { id: 'C1', icon: '🧠', title: '思考四步曲', steps: [

    { t: 'talk', fen: '4k4/9/1n4r2/9/9/1R4c2/9/9/9/3K5 w', marks: { arrows: [['b4', 'b7', 'g']] }, say: '**第三步：攻！** 我有冇機會？可唔可以將軍、食子、捉雙？搵吓對方有冇冇人保護嘅棋子。' },

    { t: 'talk', fen: START, say: '喺「**對戰**」模式，右邊嘅**思考泡泡**會顯示電腦點樣用四步曲諗嘢：佢睇咗乜、驚乜、想攻乜、點解揀呢步而唔揀其他。你可以撳每一步睇棋盤上面嘅箭咀！' }

  { id: 'C2', icon: '🤝', title: '子力合作', steps: [

    { t: 'talk', fen: START, say: '「**先手**」即係你嘅棋逼住對方要應付你，佢冇時間做自己想做嘅嘢。例如將軍、捉子，都係搶先手嘅方法。' },
    { t: 'talk', fen: START, say: '「**兌子**」即係大家換走同樣價值嘅棋子。記住：**領先嘅時候多啲兌子**，令局面簡單，慢慢贏；**落後嘅時候避免兌子**，保留機會反擊。' },
    { t: 'quiz', say: '如果你多咗對方一架車，應該點？', opts: [

    { t: 'quiz', say: '點樣叫做「搶先手」？', opts: [
      { a: '行一步令對方一定要應付嘅棋，例如將軍或者捉子', ok: true, why: '冇錯，對方要忙住救火，你就掌握主動！' },

        t = '如果行' + r.note + '，' + you + '最好嘅應對係' + rep.note + (rep.cap ? '（食' + rep.cap + '）' : rep.chk ? '（將軍）' : '') + '。';
        if (r.pv[2]) t += '然後' + me + '再行' + r.pv[2].note + (r.pv[2].cap ? '（食' + r.pv[2].cap + '）' : '') + (r.pv[2].mate ? '，將死！' : '') + '。';
      } else t = r.pv[0] && r.pv[0].mate ? '呢步直接將死！' : '之後局面平穩。';
      t += '結果：' + self.scoreTxt(r.score) + '。';
      html5 += '<div class="why">' + (r.chosen ? '👑 ' : '') + esc(t) + '</div></div>';
      if (r.chosen) sayP = t.replace('如果行', '我行');
    });
    var chosenRow = rows[chosenIdx] || rows[0];
    var o5 = { arrows: [] };
    chosenRow.pv.forEach(function (x, i) { o5.arrows.push([x.m & 127, x.m >> 7, x.side === s ? 'y' : 'k', String(i + 1), x.side !== s]); });
    steps.push({ k: 5, ic: '🔮', name: '預判：每步之後會點？', sum: chosenRow.pv.slice(1, 3).map(function (x) { return x.note; }).join(' → ') || (ex2.mate ? '將死！' : '—'),
      html: html5, say: sayP, ov: o5, lines: lines, pv: chosenRow.pv.map(function (x) { return x.m; }) });

var Prog = {
  stageDone: function (st) { return st.lessons.every(function (l) { return Store.d.done[l.id]; }); },
  stageUnlocked: function (si) { return Store.d.set.unlock || si === 0 || this.stageDone(STAGES[si - 1]); },
  lessonUnlocked: function (si, li) {
    if (Store.d.set.unlock) return true;
    if (!this.stageUnlocked(si)) return false;
    return li === 0 || !!Store.d.done[STAGES[si].lessons[li - 1].id];
  },
  totals: function () {
    var got = 0, max = 0, done = 0, n = 0;
    STAGES.forEach(function (st) { st.lessons.forEach(function (l) { max += 3; n++; got += Store.d.done[l.id] || 0; if (Store.d.done[l.id]) done++; }); });
    return { got: got, max: max, done: done, n: n };
  },
  winAtLeast: function (k) { for (var l = k; l <= 6; l++) if ((Store.d.wins[l] || 0) > 0) return true; return false; },
  rank: function () {
    var d = function (i) { return Prog.stageDone(STAGES[i]); };
    var conds = [true, d(0), d(1), d(2), d(3) && this.winAtLeast(2), d(4) && d(5) && this.winAtLeast(3), d(6) && this.winAtLeast(4), this.winAtLeast(5)];
    var r = 0; for (var i = 1; i < conds.length; i++) { if (conds[i]) r = i; else break; }
    return r;
  },
  next: function () {
    for (var si = 0; si < STAGES.length; si++) for (var li = 0; li < STAGES[si].lessons.length; li++)
      if (!Store.d.done[STAGES[si].lessons[li].id] && this.lessonUnlocked(si, li)) return [si, li];
    return null;
  }
};

function illegalReason(pos, f, t) {
  var b = pos.b, p = b[f], s = p >> 3, ty = p & 7, fr = XQ.rowOf(f), fc = XQ.colOf(f), tr = XQ.rowOf(t), tc = XQ.colOf(t);
  var dr = tr - fr, dc = tc - fc, adr = Math.abs(dr), adc = Math.abs(dc), K = s ? '將' : '帥';
  var pseudo = XQ.gen(pos, false).some(function (m) { return (m & 127) === f && (m >> 7) === t; });
  if (b[t] && (b[t] >> 3) === s) return '嗰度已經有自己嘅棋子喇。';
  if (pseudo) {
    if (XQ.inCheck(pos)) return '你個' + K + '俾人將緊軍！呢步救唔到' + K + '，要先應將呀。';
    var q = pos.clone(); q.make((f) | (t << 7));
    var ks = q.ks[s], ok = q.ks[s ^ 1];
    if (ks >= 0 && ok >= 0 && XQ.colOf(ks) === XQ.colOf(ok)) {
      var lo = Math.min(XQ.rowOf(ks), XQ.rowOf(ok)), hi = Math.max(XQ.rowOf(ks), XQ.rowOf(ok)), blk = false;
      for (var r = lo + 1; r < hi; r++) if (q.b[r * 9 + XQ.colOf(ks)]) blk = true;
      if (!blk) return '咁樣行會令兩個皇帝面對面（白臉將），唔准㗎！';
    }
    return '咁樣行，你個' + K + '會俾對方食㗎！要保護好個' + K + '。';
  }
  switch (ty) {
    case XQ.K: if (!XQ.inPalace(tr, tc, s)) return K + '唔可以行出九宮㗎！'; return K + '每次只可以打直或者打橫行一格。';
    case XQ.A: if (!XQ.inPalace(tr, tc, s)) return (s ? '士' : '仕') + '唔可以出九宮㗎！'; return (s ? '士' : '仕') + '每次只可以斜行一格。';
    case XQ.B:
      if (adr === 2 && adc === 2) { if (s === 0 ? tr < 5 : tr > 4) return (s ? '象' : '相') + '唔可以過河㗎！'; return '塞咗象眼！田字中間有棋子擋住。'; }
      return (s ? '象' : '相') + '要行「田」字（斜斜咁行兩格）。';
    case XQ.N:
      if ((adr === 2 && adc === 1) || (adr === 1 && adc === 2)) return '蹩咗馬腳！馬行嘅方向貼住有棋子擋住。';
      return '馬要行「日」字：直行一格再斜出一格。';
    case XQ.R: if (dr && dc) return '車只可以打直或者打橫行。'; return '中間有棋子擋住，車過唔到。';
    case XQ.C:
      if (dr && dc) return '炮只可以打直或者打橫行。';
      if (b[t]) return '炮食子一定要隔住「一隻」棋子（炮架）先食得！';
      return '中間有棋子擋住，炮唔食子嘅時候唔可以跳過去。';
    case XQ.P:
      var fw = s === 0 ? -1 : 1, W = s ? '卒' : '兵';
      if (dr === -fw) return W + '永遠唔可以後退㗎！';
      if (dr === 0 && !(s === 0 ? fr <= 4 : fr >= 5)) return W + '未過河，唔可以打橫行。';
      return W + '每次只可以行一格。';
  }
  return '呢步唔行得。';
}

/* 通用：處理撳棋盤 */
function Tapper(opts) {
  /* opts: pos(), side(), canPick(sq), onMove(m), legal(sq)->moves */
  return function (sq) {
    var pos = opts.pos(), b = pos.b, p = b[sq], s = opts.side();
    if (Board.sel >= 0) {
      if (p && (p >> 3) === s && sq !== Board.sel && (!opts.canPick || opts.canPick(sq))) { Sfx.sel(); Board.select(sq, opts.legal(sq)); return; }
      if (sq === Board.sel) { Board.select(-1, []); return; }
      var mv = Board.legal.filter(function (m) { return (m >> 7) === sq; })[0];
      if (mv !== undefined) { var f = Board.sel; Board.select(-1, []); opts.onMove(mv); return; }
      var why = illegalReason(pos, Board.sel, sq); Sfx.soft(); toast('🙅 ' + why);
      if (opts.onIllegal) opts.onIllegal(why);
      return;
    }
    if (!p) return;
    if ((p >> 3) !== s) { toast(s === (p >> 3) ? '' : '呢隻係對方嘅棋子，揀你自己（' + (s ? '黑色' : '紅色') + '）嘅棋子啦！'); return; }
    if (opts.canPick && !opts.canPick(sq)) { toast('今次要用指定嗰隻棋子呀！'); return; }
    Sfx.sel(); Board.select(sq, opts.legal(sq));
  };
}
function legalFrom(pos, sq) { return XQ.legalMoves(pos).filter(function (m) { return (m & 127) === sq; }); }
function soundFor(pos, m) { /* 喺行棋前叫 */
  var cap = pos.b[m >> 7]; pos.make(m); var chk = XQ.inCheck(pos); pos.unmake();
  if (chk) { Sfx.cap(); setTimeout(function () { Sfx.check(); }, 120); } else if (cap) Sfx.cap(); else Sfx.move();
}

        return;

  goalCheck: function (m, before) {
    var self = this, c = this.c, s = this.step(), tok = c.tok;

    var whyTxt = ex.reasons.map(function (r) { return r.ic + ' ' + r.tx; }).join('<br>');
    if (s.goal === 'check') {
      if (XQ.inCheck(c.pos)) { this.success(s.win); $('#gfb').innerHTML = '<div class="fb good">' + whyTxt + '</div>'; }
      else { this.fail('呢步未有將軍，黑將仲安全。再試吓！'); this.undoLater(); }
      return;
    }
    if (s.goal === 'moves') {
      if (s.accept.indexOf(XQ.iccs(m)) >= 0) {
        this.success(s.win); $('#gfb').innerHTML = '<div class="fb good"><b>點解咁好？</b><br>' + whyTxt + '</div>';
        if (s.follow) this.follow(3);
      } else { this.fail(rnd(['呢步唔係最好喎，', '差少少，']) + '再諗吓有冇更犀利嘅一步？'); this.undoLater(); }
      return;
    }
    if (s.goal === 'defend') {
      var mm = Think.mates1(c.pos);
      if (!mm.length) { this.success(s.win); $('#gfb').innerHTML = '<div class="fb good">' + whyTxt + '</div>'; }
      else { Board.setMarks({ arrows: [[mm[0] & 127, mm[0] >> 7, 'r', '!']] }); this.fail('哎呀，對方仲可以' + XQ.notation(c.pos.b, mm[0]) + '將死你！睇吓紅色箭咀，再試一次。'); this.undoLater(1800); }
      return;
    }
    if (s.goal === 'mate') {
      if (!XQ.legalMoves(c.pos).length) { this.success(s.win); $('#gfb').innerHTML = '<div class="fb good">' + whyTxt + '</div>'; return; }
      if (c.userMoves >= s.n) { this.fail('仲未將死喎！我哋由頭再試多次。'); setTimeout(function () { if (Lesson.c && Lesson.c.tok === tok) self.go(c.i); }, 1700); return; }
      this.say('對手諗緊點樣逃走…🤔', 'think', false); Board.lock = true;

  undoLater: function (ms) {

/* 讀入中文棋譜：逐步對照合法棋步 */
function parseRecord(text) {
  var t = String(text).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48); })
    .replace(/\{[^}]*\}|（[^）]*）|\([^)]*\)/g, ' ');
  var re = /(?:[前中後][車俥馬傌炮砲相象仕士兵卒]|[車俥馬傌炮砲相象仕士帥將兵卒][一二三四五六七八九1-9])[進退平][一二三四五六七八九1-9]/g;
  var toks = t.match(re) || [], pos = new XQ.Pos(START), moves = [], err = '';
  var CN = { '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };
  var PC = { '帥': 'K', '將': 'K', '仕': 'A', '士': 'A', '相': 'B', '象': 'B', '馬': 'N', '傌': 'N', '車': 'R', '俥': 'R', '炮': 'C', '砲': 'C', '兵': 'P', '卒': 'P' };
  function norm(x) { return x.split('').map(function (ch) { return CN[ch] || PC[ch] || ch; }).join(''); }
  for (var i = 0; i < toks.length; i++) {
    var want = norm(toks[i]), found = 0;
    XQ.legalMoves(pos).forEach(function (m) { if (!found && norm(XQ.notation(pos.b, m)) === want) found = m; });
    if (!found) { err = '第 ' + (i + 1) + ' 步「' + toks[i] + '」喺嗰個局面行唔到'; break; }
    moves.push(found); pos.make(found);
  }
  return { moves: moves, err: err };
}

        Board.setMarks({ hl: [best.m & 127] });
        var t = '💡 試吓郁發光嗰隻' + Think.pName(self.pos.b[best.m & 127]) + '。諗吓：' + (ex.reasons[0] ? ex.reasons[0].tx.replace(/！$/, '') : '佢可以去邊度幫手') + '？';
        toast(t, 4000); Speech.auto(t);
      } else {
        Board.setMarks({ hl: [best.m & 127], arrows: [[best.m & 127, best.m >> 7, 'g', '✓']] });
        var t2 = '💡 建議行 ' + ex.note + '：' + ex.reasons.map(function (x) { return x.tx; }).join('');
        toast(t2, 5000); Speech.auto(t2);
      }
    });
  },
  /* 復盤 */
  startReview: function () {
    if (!this.recs.length) { toast('仲未有棋步可以復盤'); return; }
    if (this.peek) this.unpeek();
    this.review = { i: this.recs.length - 1 }; this.tok++; this.busy = false; Speech.stop();
    this.showReview();
  },
  showReview: function () {
    var r = this.recs[this.review.i], q = r.before.clone(); q.make(r.m);
    Board.set(q, { last: r.m, marks: {} }); Board.lock = true;
    this.moveList(); this.renderReview();
  },
  renderReview: function () {
    var r = this.recs[this.review.i], el = $('#gbody'), i = this.review.i;
    var h = '<div class="think-head"><div class="who">📋 復盤：第 ' + (i + 1) + ' / ' + this.recs.length + ' 步</div></div>' + this.graph(i) +
      '<div class="navrow" style="margin:0 0 8px"><button class="btn sm" data-rvnav="-999">⏮</button><button class="btn sm" data-rvnav="-1">◀</button><button class="btn sm" data-rvnav="1">▶</button><button class="btn sm" data-rvnav="999">⏭</button><span class="sp"></span><button class="btn sm" data-rvnav="take">🎮 由呢步接手</button><button class="btn sm pri" data-rvnav="exit">返回對局</button></div>';
    h += r.kind === 'ai' ? this.aiCard(r) : this.fbCard(r);
    el.innerHTML = h;
    $('#turnTxt') && ($('#turnTxt').textContent = '📋 復盤模式');
  },
  /* 形勢走勢圖：每一步之後紅黑邊個佔優 */
  graph: function (cur) {
    var pts = this.recs.map(function (r) { return r.red; }), n = pts.length; if (n < 2) return '';
    var W = 380, H = 86, last = 0, P = [];
    var y = function (v) { if (v > XQ.MATE - 200) return 4; if (v < -XQ.MATE + 200) return H - 4; return H / 2 - (H / 2 - 6) * Math.tanh(v / 700); };
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:460px;display:block;margin:0 auto 6px;height:auto;background:#fff8ee;border-radius:12px">';
    out += '<rect x="0" y="0" width="' + W + '" height="' + H / 2 + '" fill="rgba(240,62,62,.07)"/><line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="#ccc" stroke-dasharray="4 4"/>';
    out += '<text x="6" y="14" font-size="11" fill="#c92a2a">紅優</text><text x="6" y="' + (H - 5) + '" font-size="11" fill="#333">黑優</text>';
    pts.forEach(function (v, i) { if (v === undefined) v = last; last = v; P.push([8 + (W - 16) * i / (n - 1), y(v), i, v]); });
    out += '<polyline fill="none" stroke="#e8590c" stroke-width="2.5" points="' + P.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
    P.forEach(function (p, k) {
      var jump = k > 0 && Math.abs(Math.tanh(p[3] / 700) - Math.tanh(P[k - 1][3] / 700)) > 0.35;
      out += '<circle data-rv="' + p[2] + '" cx="' + p[0] + '" cy="' + p[1] + '" r="' + (p[2] === cur ? 6 : jump ? 5 : 3.2) + '" fill="' + (p[2] === cur ? '#228be6' : jump ? '#f03e3e' : '#e8590c') + '" style="cursor:pointer"/>';
    });
    return out + '</svg><div style="font-size:13px;color:var(--ink2);margin:-2px 0 6px">📈 形勢走勢圖：紅點係形勢突然大變嘅<b>轉捩點</b>，撳落去睇吓發生咩事。</div>';
  },
  rvNav: function (d) {
    if (d === 'take') { var keep = this.review.i + 1; while (this.hist.length > keep) { this.pos.unmake(); this.hist.pop(); this.recs.pop(); } this.over = null; this.takeover(); return; }
    if (d === 'exit') { this.review = null; Board.lock = false; Board.set(this.pos, { last: this.hist[this.hist.length - 1] || null, marks: {} }); this.moveList(); this.refreshSide(); $('#turnTxt').textContent = this.over ? '🏁 對局完結' : '輪到：' + this.who(this.pos.turn); var self = this; this.tok++; setTimeout(function () { self.loop(); }, 100); return; }
    this.review.i = Math.max(0, Math.min(this.recs.length - 1, this.review.i + (+d)));
    this.showReview();
  }
};
/* 復盤時打開卡片，要喺嗰步之前嘅局面顯示箭咀 */
(function () {
  var orig = Game.overlay;
  Game.overlay = function (key, st) {
    if (this.review) { var r = this.recs[+key.slice(1)]; Board.set(r.before, { last: null, marks: st.ov }); Board.lock = true; return; }
    if (key === 'pre') { if (this.peek) this.unpeek(); Board.setMarks(st.ov); return; }
    orig.call(this, key, st);
  };
})();

/* ================================================================
   啟動同事件
   ================================================================ */
document.addEventListener('click', function (e) {
  var t = e.target;
  var close = t.closest('[data-close]'); if (close) closeModal();
  var go = t.closest('[data-go]');
  if (go) {
    var g = go.dataset.go;
    if (g === 'lesson') Lesson.open(+go.dataset.si, +go.dataset.li);
    else if (g === 'daily') Lesson.daily();
    else if (g === 'mist') Lesson.mist();
    else if (g === 'resume') Game.resume();
    else if (g === 'demo') { var dg = DEMOS[+go.dataset.i]; Game.start({ mode: 'study', moves: dg.moves.split(' ').map(XQ.parseIccs), title: dg.name }); }
    else if (g === 'bookitem') Lesson.openBook(+go.dataset.i);
    else if (g === 'settings') UI.settings();
    else if (g === 'about') UI.about();
    else UI.show(g);
    return;
  }
  var opt = t.closest('[data-opt]'); if (opt) { Lesson.quiz(+opt.dataset.opt); return; }
  var md_ = t.closest('[data-mode]'); if (md_) { Setup.mode = md_.dataset.mode; Setup.render(); return; }
  var lv = t.closest('[data-lv]'); if (lv) { var kv = lv.dataset.lv.split(':'); Setup[kv[0]] = +kv[1]; Setup.render(); return; }
  var sd = t.closest('[data-side]'); if (sd) { Setup.side = +sd.dataset.side; Setup.render(); return; }
  var sp = t.closest('[data-speed]'); if (sp) { Setup.speed = +sp.dataset.speed; Setup.render(); return; }
  var gz = t.closest('[data-guess]'); if (gz) { Setup.guess = gz.dataset.guess === '1'; Setup.render(); return; }
  var pvb = t.closest('[data-act="pvline"]'); if (pvb && Game.on) { Game.act('pvline', pvb); return; }
  var cr = t.closest('[data-cand],[data-line]'); if (cr && Game.on && !t.closest('.spk')) { var ck = (cr.dataset.cand || cr.dataset.line).split(':'); Game.candClick(ck[0], +ck[1], +ck[2], cr); return; }
  var rv = t.closest('[data-rv]'); if (rv && Game.on) { if (!Game.review) { Game.review = { i: 0 }; Game.tok++; Game.busy = false; Speech.stop(); } Game.review.i = +rv.dataset.rv; Game.showReview(); return; }
  var rn = t.closest('[data-rvnav]'); if (rn) { Game.rvNav(rn.dataset.rvnav); return; }
  var oi = t.closest('[data-oi]'); if (oi && Lesson.c) { Lesson.openSet(+oi.dataset.oi); return; }
  if (t.closest('.spk')) return;
  var card = t.closest('.stepc .sh'); if (card && Game.on) { var c = card.parentNode, kk = c.dataset.card.split(':'); Game.openCard(kk[0], +kk[1], c); return; }
  var act = t.closest('[data-act]');
  if (act) { var a = act.dataset.act; if (Lesson.c && !Game.on) Lesson.act(a, act); else Game.act(a, act); }
});
$('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

window.addEventListener('load', function () {
  Board.init(); Eng.init(); Speech.init();
  $('#tb-logo').innerHTML = '<div style="width:38px;height:38px;background:#fff;border-radius:50%;padding:2px">' + mascotSvg() + '</div><span>象棋小學堂</span>';
  UI.show('home');
});

</script>
