:root {
  --ink: #2b2250; --bg1: #fff7e0; --bg2: #e3f6ff; --card: #ffffff; --line: #e7e1f5;
  --pri: #6c4cf0; --pri2: #8f73ff; --ok: #2e9d4f; --bad: #e53935; --warn: #ff9800; --blue: #1e88e5;
  --r: 22px; --sh: 0 6px 0 rgba(43, 34, 80, .12), 0 10px 24px rgba(43, 34, 80, .10);
  --font: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Noto Sans HK", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); background: linear-gradient(160deg, var(--bg1), var(--bg2)); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font-family: inherit; -webkit-user-select: text; user-select: text; }
#screen { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.scr { min-height: 100%; padding: calc(12px + var(--sat)) 16px calc(24px + var(--sab)); max-width: 1180px; margin: 0 auto; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 800; z-index: 99; background: var(--bg1); }
h1, h2, h3, h4 { margin: 0; }
b { font-weight: 800; }

/* ---------- speaker ---------- */
.spk { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #ffd54f; color: #5b3a00; display: inline-grid; place-items: center; box-shadow: 0 3px 0 #e0a800; transition: transform .1s; vertical-align: middle; }
.spk svg { width: 26px; height: 26px; }
.spk:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0a800; }
.spk.speaking { background: #ff9800; color: #fff; animation: pulse 0.9s infinite; }
.spk.speaking .w1 { animation: wave 0.9s infinite; } .spk.speaking .w2 { animation: wave 0.9s .3s infinite; }
@keyframes wave { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, .6) } 50% { box-shadow: 0 0 0 10px rgba(255, 152, 0, 0) } }
.say { display: flex; gap: 12px; align-items: flex-start; text-align: left; }
.saytext { flex: 1; font-size: 19px; line-height: 1.6; padding-top: 7px; -webkit-user-select: text; user-select: text; }
.say.tip { background: #fff8e1; border: 2px dashed #ffcc80; border-radius: 16px; padding: 10px; margin-bottom: 10px; }
.say.tip .saytext { font-weight: 700; }
.lc0 { color: #e53935 } .lc1 { color: #fb8c00 } .lc2 { color: #d8a000 } .lc3 { color: #43a047 } .lc4 { color: #1e88e5 } .lc5 { color: #7e57c2 } .lc6 { color: #d81b60 }

/* ---------- common ---------- */
.hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; position: sticky; top: calc(-12px - var(--sat)); padding: 8px 0; z-index: 5; background: linear-gradient(var(--bg1) 70%, transparent); }
.hdr h2 { flex: 1; font-size: 26px; }
.btn-back { width: 52px; height: 52px; border-radius: 16px; border: 0; background: #fff; font-size: 34px; font-weight: 900; line-height: 1; box-shadow: var(--sh); padding-bottom: 5px; }
.pill { background: #fff; border-radius: 99px; padding: 8px 14px; font-weight: 800; box-shadow: var(--sh); white-space: nowrap; }
.ibtn { width: 50px; height: 50px; border-radius: 50%; border: 0; background: #fff; font-size: 24px; box-shadow: var(--sh); }
.bubble { background: #fff; border-radius: var(--r); padding: 14px; box-shadow: var(--sh); margin: 10px 0 16px; position: relative; }
.bigbtn { border: 0; border-radius: 18px; padding: 14px 24px; font-size: 20px; font-weight: 800; background: linear-gradient(180deg, var(--pri2), var(--pri)); color: #fff; box-shadow: 0 5px 0 #4a2fc0; transition: transform .08s; }
.bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a2fc0; }
.bigbtn.alt { background: linear-gradient(180deg, #ffca28, #ffb300); color: #4a3000; box-shadow: 0 5px 0 #c98a00; }
.bigbtn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5cfe8; }
.bigbtn.sm { padding: 10px 16px; font-size: 17px; }
.bigbtn:disabled { opacity: .5; }
.ibtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 9px 16px; font-size: 17px; font-weight: 700; }
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; }
.center { text-align: center; }
.center .say { text-align: left; margin: 10px 0; }
.warnbar { background: #fff3e0; border: 2px solid #ffcc80; border-radius: 14px; padding: 10px 14px; margin: -6px 0 12px; font-weight: 700; }
.linkbtn { border: 0; background: none; color: var(--pri); font-weight: 800; text-decoration: underline; font-size: 16px; }
.voicehelp { background: #fff8e1; border-radius: 14px; padding: 12px 16px; text-align: left; font-size: 16px; line-height: 1.6; margin: 10px 0; }
.voicehelp ul { margin: 6px 0 0; padding-left: 20px; }

/* ---------- mascot ---------- */
.mascot { width: 80px; height: 94px; overflow: visible; }
.mascot.big { width: 150px; height: 175px; } .mascot.mid { width: 110px; height: 128px; } .mascot.sm { width: 64px; height: 75px; }
.mascot .m-body { transform-origin: 55px 130px; animation: bob 2.4s ease-in-out infinite; }
.mascot .m-sad { display: none; }
.mascot.sad .m-sad { display: block; } .mascot.sad .m-happy { display: none; }
.mascot.sad .m-body { animation: sadshake .5s; }
.mascot.happy .m-body { animation: hop .5s; }
.mascot.cheer .m-body { animation: hop .6s 3; }
.mascot .m-eyes { animation: blink 4s infinite; transform-origin: 55px 99px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-5px) rotate(2deg) } }
@keyframes hop { 0%, 100% { transform: translateY(0) } 40% { transform: translateY(-22px) rotate(-6deg) } }
@keyframes sadshake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-7px) rotate(-5deg) } 75% { transform: translateX(7px) rotate(5deg) } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }

/* ---------- home ---------- */
.home-top { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.hero { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 0 6px; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.1; background: linear-gradient(90deg, #6c4cf0, #e05aa8, #ff9800); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; }
.hero .sub { margin: 6px 0 0; font-weight: 700; opacity: .7; }
.instsw { display: flex; gap: 10px; justify-content: center; margin: 4px 0 16px; }
.instsw button { border: 3px solid #fff; background: rgba(255, 255, 255, .6); border-radius: 99px; padding: 10px 20px; font-size: 19px; font-weight: 800; }
.instsw button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.instsw.sm button { font-size: 17px; padding: 8px 16px; }
.menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mbtn { border: 0; border-radius: var(--r); padding: 16px 12px; background: #fff; box-shadow: var(--sh); display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .1s; }
.mbtn:active { transform: scale(.96); }
.mbtn span { font-size: 40px; } .mbtn b { font-size: 21px; } .mbtn small { opacity: .7; font-size: 14px; }
.mbtn.big { grid-column: span 3; flex-direction: row; justify-content: center; gap: 16px; padding: 20px; background: linear-gradient(135deg, #8f73ff, #6c4cf0); color: #fff; }
.mbtn.big span { font-size: 52px; } .mbtn.big b { font-size: 30px; } .mbtn.big small { color: #fff; font-size: 16px; }
.mbtn.c2 { background: #e8f5e9 } .mbtn.c3 { background: #fff8e1 } .mbtn.c4 { background: #fce4ec } .mbtn.c5 { background: #e3f2fd } .mbtn.c6 { background: #fff3e0 } .mbtn.c7 { background: #f3e5f5 }
.foot { text-align: center; opacity: .6; font-size: 14px; margin-top: 20px; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; background: rgba(30, 20, 60, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#modal.on { display: flex; }
.mbox { background: #fff; border-radius: 28px; padding: 22px; max-width: 560px; width: 100%; max-height: calc(100% - 16px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); animation: popin .25s; }
.mbox.wide { max-width: 760px; }
.mbox h3 { font-size: 24px; margin: 6px 0; }
@keyframes popin { from { transform: scale(.85); opacity: 0 } }
.instpick { display: flex; gap: 14px; justify-content: center; margin: 14px 0; }
.instpick button { border: 0; border-radius: 22px; padding: 16px 26px; font-size: 22px; font-weight: 800; background: #f3efff; box-shadow: var(--sh); display: flex; flex-direction: column; align-items: center; }
.instpick span { font-size: 54px; }
.namein { display: block; font-weight: 700; margin-top: 8px; }
.namein input { display: block; margin: 8px auto 0; font-size: 20px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); width: 220px; text-align: center; }

/* ---------- map ---------- */
.worlds { display: flex; flex-direction: column; gap: 18px; }
.world { background: #fff; border-radius: 26px; box-shadow: var(--sh); overflow: hidden; }
.world.other { opacity: .82; }
.wbanner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(120deg, var(--c1), var(--c2)); color: #fff; text-shadow: 0 2px 3px rgba(0, 0, 0, .18); }
.wbanner h3 { font-size: 23px; } .wbanner small { opacity: .95; font-weight: 700; }
.wbanner > div:nth-child(2) { flex: 1; }
.wemo { font-size: 44px; text-shadow: none; }
.wstat { font-weight: 800; background: rgba(255, 255, 255, .3); padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
.wles { border: 0; background: #fff; color: var(--ink); border-radius: 99px; padding: 8px 14px; font-weight: 800; font-size: 16px; text-shadow: none; white-space: nowrap; }
.lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
.lvl { border: 0; border-radius: 20px; padding: 12px 10px 10px; background: #f7f5ff; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; gap: 2px 8px; text-align: left; position: relative; box-shadow: 0 4px 0 #e3ddf6; transition: transform .1s; animation: popin .3s calc(var(--i) * .04s) backwards; }
.lvl:active { transform: scale(.95); }
.lnum { grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(180deg, var(--c1), var(--c2)); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 20px; }
.lmode { font-size: 18px; }
.ltitle { grid-column: span 2; font-weight: 800; font-size: 15px; line-height: 1.3; min-height: 2.6em; }
.lst { grid-column: span 2; font-size: 20px; letter-spacing: 2px; }
.st { color: #ddd; } .st.on { color: #ffc107; text-shadow: 0 1px 0 #d39e00; }
.lvl.locked { filter: grayscale(1); opacity: .5; }
.lvl.boss { background: #fff0f0; box-shadow: 0 4px 0 #f6caca; }
.lvl.done { background: #f0fff2; box-shadow: 0 4px 0 #c9ecd0; }
.lvl.opt::after { content: '可選'; position: absolute; top: 6px; right: 8px; font-size: 11px; background: #eee; border-radius: 6px; padding: 1px 5px; }

/* ---------- intro ---------- */
.intro .ihead { display: flex; gap: 12px; align-items: center; margin: -22px -22px 14px; padding: 16px 22px; background: linear-gradient(120deg, var(--c1), var(--c2)); color: #fff; border-radius: 28px 28px 0 0; }
.intro .ihead span { font-size: 46px; } .intro .ihead h3 { font-size: 26px; margin: 2px 0 0; } .intro .ihead small { font-weight: 700; }
.intro .say { margin-bottom: 8px; }
.prevbox { background: #f8f6ff; border-radius: 16px; padding: 10px; margin: 10px 0; text-align: center; }
.prevcap { font-weight: 700; margin-bottom: 6px; text-align: left; }
.answ { display: flex; align-items: center; gap: 8px; justify-content: center; font-weight: 700; flex-wrap: wrap; }
.answ button { border: 2px solid var(--line); border-radius: 99px; background: #fff; padding: 8px 14px; font-weight: 800; font-size: 16px; }
.answ button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.best { text-align: center; margin-top: 10px; font-weight: 700; }

/* ---------- notation ---------- */
svg.score { display: block; overflow: visible; }
.score .ink { color: var(--ink); fill: currentColor; }
.score line { stroke: currentColor; }
.score .sl { stroke: #5a5080; }
.score text.mus { font-family: 'Bravura'; font-size: 4px; }
.score text.lab { font-family: var(--font); font-size: 1.35px; font-weight: 800; }
.score text.stxt { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
.score text.stxt.it { font-style: italic; }
.score text.fing { font-family: Georgia, serif; font-size: 1.5px; font-weight: 700; }
.score .nt { transition: color .2s; }
.score .nt.tap { cursor: pointer; }
.score .nt.tap:hover { color: var(--pri); }
.score .nt.flashy { color: #ff9800 !important; animation: notehop .6s; }
@keyframes notehop { 30% { transform: translateY(-.6px) } }
.pic { height: calc(var(--vh) * var(--sp, 13px)); width: auto; max-width: 100%; margin: 0 auto; }
.pic.sm { --sp: 10px; }
.pic.prev { --sp: 10px; margin: 4px auto; }
.pic.rev { --sp: 9px; }
.pic.report { --sp: 12px; }
.pic.glyph { --sp: 16px; }
.pics2 { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pics2 > svg, .pics2 > div { flex: 0 1 auto; }
.termpic { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 34px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.termpic small { font-size: 15px; font-style: normal; font-family: var(--font); opacity: .7; }
.solftable { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.solftable div { width: 70px; border-radius: 16px; padding: 8px 4px; background: var(--c); color: #fff; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.solftable b { font-size: 30px; } .solftable span { font-weight: 700; }
.dynrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dynrow > div { display: flex; flex-direction: column; align-items: center; background: #f8f6ff; border-radius: 14px; padding: 6px 10px; }
.dynrow small { font-weight: 800; }
.tempoicon { font-size: 36px; }

/* keyboards */
.kbd { position: relative; width: 100%; height: clamp(130px, 25vh, 230px); touch-action: none; }
.kbd .wk { position: absolute; top: 0; bottom: 0; background: linear-gradient(#fff, #f4f2fa); border: 2px solid #3a3160; border-radius: 0 0 12px 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-shadow: 0 4px 0 #cfc9e6; transition: background .1s; }
.kbd .wk + .wk { margin-left: -1px; }
.kbd .bk { position: absolute; top: 0; height: 60%; background: linear-gradient(#3a3160, #1a1433); border-radius: 0 0 8px 8px; z-index: 2; box-shadow: 0 4px 0 #000; border: 1px solid #000; }
.kbd .kl { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.kbd .kl b { font-size: clamp(16px, 2.6vw, 26px); }
.kbd .mc { font-style: normal; font-size: 11px; font-weight: 800; background: #ffd54f; border-radius: 6px; padding: 1px 3px; margin-top: 2px; white-space: nowrap; }
.kbd.exact .kl b { font-size: clamp(12px, 1.8vw, 20px); }
.kbd .down { filter: brightness(.85); }
.kbd .wk.ok { background: #a5e6b4; } .kbd .bk.ok { background: #2e9d4f; }
.kbd .wk.bad { background: #ffb3b3; animation: shake .3s; } .kbd .bk.bad { background: #e53935; animation: shake .3s; }
.kbd .hint { animation: glow 0.8s infinite; } .kbd .wk.hint { background: #fff59d; } .kbd .bk.hint { background: #fbc02d; }
.pic-kbd { height: 130px; max-width: 560px; margin: 0 auto; }
.pic-kbd .wk { align-items: flex-end; font-weight: 900; font-size: 20px; cursor: pointer; }
.pic-kbd .hl, .pic-kbd .hl2 { background: #fff59d !important; } .pic-kbd .bk.hl { background: #fbc02d !important; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, .9) } 50% { box-shadow: 0 0 0 8px rgba(255, 193, 7, 0) } }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }

/* ---------- game ---------- */
.scr.game { height: 100%; min-height: 0; display: flex; flex-direction: column; padding-bottom: calc(10px + var(--sab)); max-width: 1180px; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 25%, transparent), transparent 40%); }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
.hx { width: 46px; height: 46px; border-radius: 14px; border: 0; background: #fff; font-size: 22px; font-weight: 900; box-shadow: var(--sh); flex: none; }
.htitle { font-weight: 800; font-size: 17px; max-width: 26%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hprog { flex: 1; height: 22px; background: #fff; border-radius: 99px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .1); min-width: 60px; }
.hprog i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 99px; transition: width .3s; }
.hprog span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.hearts { font-size: 18px; white-space: nowrap; } .hearts.shake { animation: shake .4s; }
.hscore, .hcombo { background: #fff; border-radius: 99px; padding: 6px 12px; font-weight: 800; box-shadow: var(--sh); white-space: nowrap; }
.hcombo.hot { background: #ff7043; color: #fff; animation: pulse .8s infinite; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; margin: 10px 0; }
.prompt { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; justify-content: center; }
.qwrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; background: #fff; border-radius: 26px; box-shadow: var(--sh); margin-top: 8px; padding: 8px 12px; position: relative; overflow: hidden; }
.qtimer { height: 10px; background: #eee; border-radius: 99px; overflow: hidden; flex: none; }
.qtimer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff7043, #ffca28, #66bb6a); }
.staffhold { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.staffhold svg { width: 100%; height: 100%; max-height: 100%; }
.staffhold.pop { animation: slidein .3s; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0 } }
.qnote { color: var(--ink); }
.fb { min-height: 0; }
.hintcard { background: #fff8e1; border: 3px solid #ffcc80; border-radius: 18px; padding: 10px 14px; margin-top: 8px; animation: popin .25s; }
.hintcard.good { background: #e8f5e9; border-color: #a5d6a7; }
.hintcard small { display: block; margin-top: 4px; font-weight: 700; color: #b26a00; }
.hintcard .saytext { font-size: 18px; }
.hintcard.sm .saytext { font-size: 16px; padding-top: 10px; }
.mini { position: absolute; right: 8px; top: 34px; pointer-events: none; }
.combopop { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; color: #ff5722; text-align: center; text-shadow: 0 3px 0 #fff, 0 0 20px #fff; animation: combo 1.3s forwards; pointer-events: none; z-index: 5; }
@keyframes combo { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0 } 20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1 } 80% { opacity: 1 } 100% { transform: translate(-50%, -120%) scale(1); opacity: 0 } }
.answers { flex: none; }
.inp { display: flex; gap: 8px; justify-content: center; }
.inp.locked { pointer-events: none; }
.ab { border: 0; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--c, #999) 60%, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .08s; touch-action: none; }
.ab.lt { flex: 1; max-width: 120px; height: clamp(68px, 12vh, 100px); background: var(--c); color: #fff; text-shadow: 0 2px 2px rgba(0, 0, 0, .25); }
.ab.lt b { font-size: clamp(28px, 5vw, 42px); line-height: 1; } .ab.lt small { font-size: 15px; font-weight: 800; }
.ab.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.ab.ok { outline: 5px solid #2e9d4f; outline-offset: 2px; }
.ab.bad { outline: 5px solid var(--bad); animation: shake .3s; filter: grayscale(.5); }
.ab.hint { animation: glow .8s infinite; outline: 5px solid #ffc107; outline-offset: 2px; }
.ab.str { flex: 1; max-width: 170px; height: clamp(90px, 14vh, 120px); background: #fff8ee; --c: #c8a070; position: relative; overflow: hidden; }
.ab.str b { font-size: 26px; color: var(--c); } .ab.str small { font-weight: 700; opacity: .7; }
.ab.str i { position: absolute; left: 50%; top: 0; bottom: 0; width: var(--w); background: #8d6e63; opacity: .25; transform: translateX(-50%); }
.ab.fg { flex: 1; max-width: 130px; height: clamp(80px, 13vh, 110px); --c: #7e57c2; }
.ab.fg b { font-size: 38px; color: #6c4cf0; } .ab.fg small { font-weight: 700; }

/* train */
.trainbox { flex: 1; min-height: 140px; max-height: 480px; background: #fff; border-radius: 26px; box-shadow: var(--sh); margin-top: 8px; position: relative; overflow: hidden; }
.trainbox svg { position: absolute; inset: 8px 0; width: 100%; height: calc(100% - 16px); }
.trainmascot { position: absolute; left: 4px; bottom: 2px; z-index: 3; }
.danger { fill: rgba(229, 57, 53, .12); }
.clefbg { fill: #fff; }
.tn { color: var(--ink); }
.tn.target { color: var(--blue); }
.tn.target text:not(.lab) { filter: drop-shadow(0 0 .3px #64b5f6); }
.tn.okn { color: var(--ok); opacity: 0; transition: opacity .25s .05s; }
.tn.wrongn { color: var(--bad); } .tn.wrongn.target { color: #d81b60; }
.tn.crash { color: var(--bad); opacity: 0; transition: opacity .6s; }
.tn .tl { fill: var(--bad); font-size: 1.6px; }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; font-size: 80px; font-weight: 900; color: var(--pri); z-index: 4; text-shadow: 0 4px 0 #fff; animation: popin .3s; }

/* melody */
.nt.cur { color: var(--blue); }
.nt.done { color: var(--ok); }
.arrow { fill: var(--blue); animation: arr .8s infinite; }
@keyframes arr { 50% { transform: translateY(-.4px) } }
.pname { font-size: 18px; }
.phrasedone { display: flex; gap: 10px; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; margin-top: 8px; flex-wrap: wrap; animation: popin .3s; }

/* quiz */
.quiz { flex: 1; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; overflow-y: auto; padding: 4px 2px; }
.quiz.pop { animation: slidein .3s; }
.qprompt { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 800; justify-content: center; text-align: center; }
.qpic { background: #fff; border-radius: 22px; box-shadow: var(--sh); padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 170px; }
.qpic .pic { --sp: 21px; }
.qpic .pic.glyph { --sp: 30px; }
.qpic .termpic { font-size: 50px; }
.qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qopts.three { grid-template-columns: 1fr 1fr 1fr; }
.qo { border: 0; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #d9d2f0; padding: 16px 10px; font-size: 24px; font-weight: 800; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .08s; }
.qo small { font-size: 13px; font-weight: 600; opacity: .7; font-family: Georgia, serif; }

/*
  renderLine(spec) — a single line of music.
  spec: { clef:'t'|'b'|'n'|'g', ks, ts, items:[...], spacing, width, labels, labelMode, minTop, minBot, clefless, endBar }
  item: { note:'E4', dur, dot, staff:'t'|'b', color, id, cls, label, finger, above(glyph name), below(text), tap }

/* ---------- Audio (Web Audio synth) ---------- */
const Snd = {
  ctx: null, master: null,
  init() {
    if (this.ctx) return;

    if (!AC) return;

  },
  unlock() {

  },
  now() { this.init(); return this.ctx ? this.ctx.currentTime : 0; },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  piano(m, t, dur = 1.2, vel = 0.8) {

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(9000, 1200 + f * 5); lp.connect(out);
    const decay = clamp(3.4 - (m - 40) * 0.045, 0.7, 4);
    const parts = [[1, 1], [2, 0.5], [3, 0.26], [4, 0.14], [5, 0.07], [6, 0.05], [7, 0.025]];

  note(m, dur, inst) {

      case 'combo': [84, 88, 91, 96].forEach((m, i) => this.tone(H(m), t + i * 0.05, 0.15, 'sine', 0.14)); break;
      case 'star': this.tone(H(96), t, 0.3, 'sine', 0.16); this.tone(H(103), t + 0.06, 0.3, 'sine', 0.1); break;

  drum(t) {

  },
};

/* ---------- Cantonese speech (Web Speech API, zh-HK) ---------- */
const Speech = {
  voices: [], voice: null, ok: 'speechSynthesis' in window, curBtn: null, queue: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); this.choose(); if (typeof onVoicesReady === 'function') onVoicesReady(); };
    load();
    speechSynthesis.onvoiceschanged = load;
    setTimeout(load, 700); setTimeout(load, 2000);
  },
  isCanto(v) { return /^(zh[-_]HK|yue)/i.test(v.lang) || /粵|粤|Cantonese|香港|Hong ?Kong|Sin-?ji|善怡|HiuGaai|HiuMaan|WanLung/i.test(v.name); },
  cantoVoices() { return this.voices.filter(v => this.isCanto(v)); },
  choose() {
    const want = Store.d.set.voiceURI;
    let v = want && this.voices.find(v => v.voiceURI === want);
    if (!v) {
      const c = this.cantoVoices();
      const score = v => (/Natural|Online|Neural|Premium|Enhanced|高品質|優化/i.test(v.name) ? 4 : 0) + (/HiuGaai|HiuMaan|Sin-?ji|善怡|Google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);

  clean(t) {
    return String(t)
      .replace(/<[^>]+>/g, '')
      .replace(/(升號|降號|還原記號)\s*[♯♭♮]/g, '$1')
      .replace(/([A-G])♯/g, '升$1').replace(/([A-G])♭/g, '降$1').replace(/♯/g, '升號').replace(/♭/g, '降號').replace(/♮/g, '還原記號')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{E000}-\u{F8FF}]/gu, '')
      .replace(/[「」『』]/g, '').replace(/…/g, '，').replace(/→/g, '，').replace(/\s+/g, ' ').trim();
  },
  speak(text, btn) {
    if (!this.ok || !Store.d.set.voice) return;
    this.stop();
    const clean = this.clean(text);
    if (!clean) return;
    // split into sentences (Chrome cuts long utterances)
    const parts = (clean.match(/[^。！？!?；;\n]+[。！？!?；;\n]*/g) || [clean]).map(s => s.trim()).filter(Boolean);
    const chunks = [];
    for (const p of parts) { if (chunks.length && (chunks[chunks.length - 1] + p).length < 90) chunks[chunks.length - 1] += p; else chunks.push(p); }
    if (btn) { this.curBtn = btn; btn.classList.add('speaking'); }
    const token = this.token = Math.random();
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = this.voice ? this.voice.lang : 'zh-HK';
      if (this.voice) { try { u.voice = this.voice; } catch (e) { /* ignore */ } }
      u.rate = Store.d.set.rate; u.pitch = 1.05;
      if (i === chunks.length - 1) { u.onend = u.onerror = () => { if (this.token === token) this.done(); }; }
      try { speechSynthesis.speak(u); } catch (e) { this.done(); }
    });
  },
  done() { if (this.curBtn) this.curBtn.classList.remove('speaking'); this.curBtn = null; },
  stop() { if (!this.ok) return; this.token = null; speechSynthesis.cancel(); this.done(); },
  auto(text) { if (Store.d.set.autoRead) this.speak(text); },
};
const SPK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path class="w1" d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="w2" d="M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function spk(text, cls = '') { return `<button class="spk ${cls}" data-say="${esc(text)}" aria-label="播放廣東話語音" title="播放廣東話語音">${SPK_ICON}</button>`; }
// text + speaker in one line
function sayLine(text, say, cls = '') { return `<div class="say ${cls}">${spk(say || text)}<div class="saytext">${text}</div></div>`; }

/* ---------- storage ---------- */
const Store = {
  key: 'douya-reading-v1', d: null,
  defaults() {
    return {
      inst: null, name: '',
      set: { labels: 'letter', voice: true, autoRead: true, rate: 1, voiceURI: '', sfx: true, noteSound: true, preview: false, kbdLabels: true, ansPiano: 'keys', ansCello: 'letters', unlockAll: false },
      stars: {}, best: {}, ns: {}, stk: {}, lessons: {}, tot: { q: 0, ok: 0, time: 0 }, days: {},
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) { d = null; }
    const def = this.defaults();
    this.d = Object.assign(def, d || {});
    this.d.set = Object.assign(def.set, (d && d.set) || {});
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { /* private mode */ } },
  inst() { return this.d.inst === 'cello' ? 'cello' : 'piano'; },
  stat(key, ok, time) {
    const s = this.d.ns[key] || (this.d.ns[key] = { ok: 0, bad: 0, t: 0 });
    if (ok) { s.ok++; s.t += time; } else s.bad++;
    this.d.tot.q++; if (ok) { this.d.tot.ok++; this.d.tot.time += time; }
    this.d.days[new Date().toISOString().slice(0, 10)] = 1;
  },
  errRate(key) { const s = this.d.ns[key]; if (!s || s.ok + s.bad < 1) return 0.35; return s.bad / (s.ok + s.bad); },
};

const PIC = {

  note(dur, o = {}) { return renderLine(Object.assign({ clef: 't', clefless: true, lead: 0.8, spacing: 3.2, minTop: -3.2, minBot: 6.2, cls: 'pic sm', items: [Object.assign({ note: 'A4', dur }, o)] }, o.spec || {})).svg; },

  glyph(name, w = 4, up = 2.2, down = 1, extra = '') {
    return svgWrap(`<text x="${w / 2}" y="0" class="mus" text-anchor="middle">${GL[name]}</text>${extra}`, [0, -up - 0.4, w, up + down + 0.8], 'pic glyph');
  },
  term(t, sub = '') { return `<div class="termpic"><span>${esc(t)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`; },
  hairpin(cresc) {
    const s = cresc ? '<path d="M0.5 1.5 L7.5 0.3 M0.5 1.5 L7.5 2.7" fill="none" stroke="currentColor" stroke-width="0.16"/>' : '<path d="M0.5 0.3 L7.5 1.5 M0.5 2.7 L7.5 1.5" fill="none" stroke="currentColor" stroke-width="0.16"/>';
    return svgWrap(s, [0, -0.4, 8, 3.8], 'pic glyph');
  },
  onNote(glyph, note = 'B4', below = false) {
    return renderLine({ clef: 't', clefless: true, lead: 1.2, spacing: 3.4, minTop: -3.6, minBot: 6, cls: 'pic sm', items: [below ? { note, dur: 'q', stem: 'up', below: glyph } : { note, dur: 'q', stem: 'down', above: glyph }] }).svg;
  },
  clef(c, extra = {}) { return renderLine(Object.assign({ clef: c, items: [], width: 7, minTop: -2.4, minBot: 6.4, cls: 'pic sm' }, extra)).svg; },
};
function fmtBeats(b) {
  if (b === 0.5) return '半拍';
  if (b === 0.25) return '四分一拍';
  if (b === 1.5) return '1 拍半';
  if (b === 0.75) return '四分三拍';
  return b + ' 拍';
}

function voltaPic() {
  let s = staffLines(0, 22, 0);
  s += barSVG('repR', 9.4, 0, 4) + barSVG('single', 16.6, 0, 4) + barSVG('final', 21, 0, 4);
  s += ln(2, -2.5, 10.8, -2.5, 0.16) + ln(2, -2.5, 2, -1.2, 0.16) + ln(10.8, -2.5, 10.8, -1.2, 0.16);
  s += ln(11.6, -2.5, 20.5, -2.5, 0.16) + ln(11.6, -2.5, 11.6, -1.2, 0.16);
  s += `<text x="2.5" y="-1" class="stxt" font-size="1.7">1.</text><text x="12.1" y="-1" class="stxt" font-size="1.7">2.</text>`;
  s += noteSVG(parseNote('G4'), 4.5, 0, 't').svg + noteSVG(parseNote('E4'), 7, 0, 't').svg + noteSVG(parseNote('C5'), 13.5, 0, 't', { dur: 'h' }).svg + noteSVG(parseNote('C5'), 18.3, 0, 't', { dur: 'h' }).svg;
  return svgWrap(s, [-0.5, -4.2, 23, 9.6], 'pic sm');
}

function kbdPic(lo, hi, o = {}) {
  const whites = []; for (let m = lo; m <= hi; m++) if (!midiIsBlack(m)) whites.push(m);
  const W = 100 / whites.length;
  let html = `<div class="kbd pic-kbd" style="--n:${whites.length}">`;
  whites.forEach((m, i) => {
    const L = LET[PC.indexOf(m % 12)];
    html += `<div class="wk${o.hl && o.hl.includes(m) ? ' hl' : ''}" data-midi="${m}" style="left:${i * W}%;width:${W}%">${o.labels ? `<span style="color:${LCOL[LET.indexOf(L)]}">${L}</span>` : ''}</div>`;
  });
  for (let m = lo; m <= hi; m++) if (midiIsBlack(m)) {
    const i = whites.indexOf(m - 1);
    html += `<div class="bk${o.hl && o.hl.includes(m) ? ' hl' : ''}" data-midi="${m}" style="left:${(i + 1) * W - W * 0.3}%;width:${W * 0.6}%"></div>`;
  }
  return html + '</div>';
}

const DUR_BEATS = { w: 4, h: 2, q: 1, 8: 0.5, 16: 0.25, hd: 3, qd: 1.5 };
// parse "C4 D4:h | E4" -> items for renderLine + seq
function parsePhrase(str, octShift = 0) {
  const items = [];
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === '|') { items.push({ bar: 'single' }); continue; }
    let [n, d] = tok.split(':'); d = d || 'q';
    if (octShift) { const p = parseNote(n); p.oct += octShift; n = nStr(p); }
    const dot = d === 'hd' || d === 'qd';
    items.push({ note: n, dur: dot ? d[0] : d, dot, beats: DUR_BEATS[d] });
  }
  return items;
}

/* ---------- rhythm patterns (tap game) ---------- */
const RHY = {
  1: ['q q q q', 'h h', 'h q q', 'q q h', 'w', 'q qr q qr', 'q q hr', 'hd q', 'qr q q q', 'h qr q'],
  2: ['8 8 q q q', 'q 8 8 q 8 8', '8 8 8 8 h', 'qd 8 h', 'h 8 8 q', 'q qr 8 8 q', '8 8 q hd'.replace(' hd', ' h'), 'qd 8 qd 8', 'q 8 8 8 8 q'],
};
function parseRhythm(str) {
  const toks = str.split(' ');
  const out = []; let beat = 0;
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i]; const rest = t.endsWith('r'); const d = rest ? t.slice(0, -1) : t;
    const b = DUR_BEATS[d];
    out.push({ d, rest, beats: b, at: beat });
    beat += b;
  }
  // beam pairs of eighths starting on a beat
  for (let i = 0; i < out.length - 1; i++) {
    if (out[i].d === '8' && !out[i].rest && out[i + 1].d === '8' && !out[i + 1].rest && Number.isInteger(out[i].at)) { out[i].beam = out[i + 1].beam = 'b' + i; i++; }
  }
  return out;
}

function makeKeyboard(lo, hi, o = {}) {
  const el = E(`<div class="kbd${o.exact ? ' exact' : ''}"></div>`);
  const whites = []; for (let m = lo; m <= hi; m++) if (!midiIsBlack(m)) whites.push(m);
  const W = 100 / whites.length;
  el.style.setProperty('--n', whites.length);
  const showLab = Store.d.set.kbdLabels;
  whites.forEach((m, i) => {
    const L = LET[PC.indexOf(m % 12)];
    const k = E(`<div class="wk" data-midi="${m}" style="left:${f3(i * W)}%;width:${f3(W)}%"><span class="kl">${showLab ? `<b style="color:${LCOL[LET.indexOf(L)]}">${L}</b>` : ''}${m === 60 && o.exact ? '<i class="mc">中央C</i>' : ''}</span></div>`);
    el.appendChild(k);
  });
  for (let m = lo; m <= hi; m++) if (midiIsBlack(m)) {
    const i = whites.indexOf(m - 1); if (i < 0) continue;
    el.appendChild(E(`<div class="bk" data-midi="${m}" style="left:${f3((i + 1) * W - W * 0.31)}%;width:${f3(W * 0.62)}%"></div>`));

  if (!n.hasAcc && !ksAcc(ks, n.step)) s += landmarkHint(n, clef);
  if (!n.hasAcc && ksAcc(ks, n.step)) s += `因為調號有${ksAcc(ks, n.step) > 0 ? '升號' : '降號'}，所以要彈 ${lbl}。`;
  if (n.hasAcc && n.acc === 0) s += '前面有還原記號，所以唔使升降！';
  if (n.hasAcc && n.acc !== 0) s += `前面有${n.acc > 0 ? '升號，要彈右邊最近嗰粒琴鍵' : '降號，要彈左邊最近嗰粒琴鍵'}。`;
  if (kind === 'finger' || kind === 'strings' || (Store.inst() === 'cello' && celloPos(n) && !n.hasAcc)) {
    const p = celloPos(n); if (p) s += p[1] === 0 ? `大提琴係 ${p[0]} 弦空弦。` : `大提琴喺 ${p[0]} 弦用第 ${p[1]} 指。`;
  }
  if (kind === 'exact') { const m = midiOf(n, ks); s += m === 60 ? '喺鋼琴正中間。' : m > 60 ? `喺中央C 右邊。` : `喺中央C 左邊。`; }
  return s;
}

/* ================= GAME BASE ================= */
class Game {
  constructor(l, root) {
    this.L = l; this.root = root;
    this.total = 0; this.ok = 0; this.bad = 0; this.combo = 0; this.maxCombo = 0; this.score = 0;
    this.lives = l.lives || 0; this.times = []; this.mist = []; this.alive = true; this.timers = [];
    this.kind = inputFor(l);
  }
  mount(extra = '') {
    const l = this.L;
    this.el = E(`<div class="scr game" style="--c1:${l.world ? l.world.c1 : '#b3e5fc'};--c2:${l.world ? l.world.c2 : '#4fc3f7'}">
      <div class="hud"><button class="hx" aria-label="離開">✕</button><div class="htitle">${l.world ? l.world.emoji : '⚡'} ${l.title}</div>
      <div class="hprog"><i></i><span></span></div>
      ${this.lives ? `<div class="hearts"></div>` : ''}<div class="hscore">⭐ <b>0</b></div><div class="hcombo">🔥 <b>0</b></div></div>
      <div class="stage">${extra}</div><div class="answers"></div></div>`);
    this.root.appendChild(this.el);
    $('.hx', this.el).onclick = () => this.quit();
    this.stage = $('.stage', this.el); this.answers = $('.answers', this.el);
    this.keyH = e => { if (e.key === 'Escape') this.quit(); else if (this.inp) this.inp.keyHandler(e); if (this.onKey) this.onKey(e); };
    document.addEventListener('keydown', this.keyH);
    this.hud();
  }
  hud() {
    const n = this.planned || this.L.n || 1;
    const done = this.ok + this.bad;
    $('.hprog i', this.el).style.width = Math.min(100, (this.doneCount != null ? this.doneCount : done) / n * 100) + '%';
    $('.hprog span', this.el).textContent = `${Math.min(n, this.doneCount != null ? this.doneCount : done)}/${n}`;
    $('.hscore b', this.el).textContent = this.score;
    const hc = $('.hcombo', this.el); $('b', hc).textContent = this.combo; hc.classList.toggle('hot', this.combo >= 5);
    if (this.lives || this.L.lives) { const h = $('.hearts', this.el); if (h) h.innerHTML = '❤️'.repeat(Math.max(0, this.lives)) + '🤍'.repeat(Math.max(0, this.L.lives - this.lives)); }
  }
  later(fn, ms) { const t = setTimeout(() => { if (this.alive) fn(); }, ms); this.timers.push(t); return t; }
  good(time, key, fxEl) {
    this.ok++; this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo);
    if (time != null) this.times.push(time);
    const speed = time != null ? Math.round(clamp(60 - time * 12, 0, 50)) : 20;
    const mult = 1 + Math.min(4, Math.floor(this.combo / 5)) * 0.5;
    this.score += Math.round((100 + speed) * mult);
    if (key) Store.stat(key, true, time || 0);
    Snd.sfx('ok');
    if (this.combo > 0 && this.combo % 5 === 0) { Snd.sfx('combo'); this.comboPop(); }
    if (fxEl) FX.burstAt(fxEl, 14);
    this.hud();
  }
  miss(key, info) {
    this.bad++; this.combo = 0;
    if (key) Store.stat(key, false, 0);
    if (info) this.mist.push(info);
    Snd.sfx('bad');
    if (this.L.lives) { this.lives--; const h = $('.hearts', this.el); if (h) { h.classList.remove('shake'); void h.offsetWidth; h.classList.add('shake'); } }
    this.hud();
    return this.L.lives && this.lives <= 0;
  }
  comboPop() {
    const msgs = ['好嘢！', '叻叻！', '正呀！', '勁呀！', '犀利！', '超級棒！'];
    const m = pick(msgs);
    const p = E(`<div class="combopop">🔥 ${this.combo} 連擊！<br>${m}</div>`);
    this.stage.appendChild(p); setTimeout(() => p.remove(), 1300);
    if (Store.d.set.autoRead && this.combo % 10 === 0) Speech.speak(`${this.combo} 連擊！${m}`);
    if (this.combo >= 10) award('combo10'); if (this.combo >= 25) award('combo25');
  }
  quit() {
    Snd.sfx('tap');
    const box = showModal(`<div class="center"><h3>要離開呢關嗎？</h3><p>而家離開唔會計分。</p><div class="ibtns"><button class="bigbtn ghost y">離開</button><button class="bigbtn n">繼續玩</button></div></div>`);
    this.paused = true;
    $('.y', box).onclick = () => { closeModal(); go(this.L.weak ? scrHome : this.L.custom ? scrPractice : scrMap); };
    $('.n', box).onclick = () => { closeModal(); this.paused = false; if (this.resume) this.resume(); };
  }
  destroy() { this.alive = false; this.timers.forEach(clearTimeout); document.removeEventListener('keydown', this.keyH); if (this.raf) cancelAnimationFrame(this.raf); if (this.onDestroy) this.onDestroy(); }
  finish(failed) {
    if (!this.alive) return;
    const total = this.ok + this.bad;
    const acc = total ? this.ok / total : 0;
    const avg = this.times.length ? this.times.reduce((a, b) => a + b, 0) / this.times.length : 0;
    const target = this.fastTarget || 0;
    let stars = 0;
    if (!failed) { if (acc >= 0.9 && (!target || avg <= target)) stars = 3; else if (acc >= 0.8) stars = 2; else if (acc >= 0.6) stars = 1; }
    const res = { failed, acc, avg, stars, score: this.score, ok: this.ok, total, maxCombo: this.maxCombo, mist: this.mist, target };
    this.alive = false;
    setTimeout(() => go(scrResult, this.L, res), failed ? 700 : 400);
  }
}

/* ---------- FLASH ---------- */
class FlashGame extends Game {
  start() {
    const l = this.L;
    this.items = l.pool.map(s => parseItem(s, l.clef));
    this.ks = l.ks ? KEYSIG[l.ks] : null;
    this.fastTarget = l.time ? Math.min(3, l.time * 0.5) : 3;
    this.mount(`<div class="prompt">${spk('呢粒係咩音？' + (this.kind === 'finger' ? '喺大提琴第一把位，要用邊隻手指？' : this.kind === 'strings' ? '係邊條空弦？' : ''))}<span>${this.kind === 'finger' ? '用邊隻手指？（第一把位）' : this.kind === 'strings' ? '係邊條空弦？' : '呢粒係咩音？'}</span></div>
      <div class="qwrap">${this.L.time ? '<div class="qtimer"><i></i></div>' : ''}<div class="staffhold"></div></div>
      <div class="fb"></div><div class="mini">${mascot('idle', 'sm')}</div>`);
    this.inp = makeInput(this.kind, { kbd: l.kbd }, (v, b) => this.answer(v, b));
    this.answers.appendChild(this.inp.el);
    this.q = 0; this.last = null;
    this.next();
  }
  choose() {
    const w = this.items.map(it => (it.key === this.last ? 0.05 : 1) * (1 + 3 * Store.errRate(this.statKey(it))));
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return this.items[i]; }

  if (!r.failed && r.stars > 0) { Snd.sfx('win'); setTimeout(() => FX.confetti(), 300); for (let i = 0; i < r.stars; i++) setTimeout(() => Snd.sfx('star'), 500 + i * 350); }
  setTimeout(() => Speech.auto(say), 900);
  // stickers
  const got = [];
  const aw = id => { if (award(id, true)) got.push(id); };
  if (!r.failed && r.stars > 0) {
    aw('first');
    if (r.total >= 5 && r.ok === r.total) aw('perfect');
    if (r.avg && r.avg <= 1.5 && r.acc >= 0.9 && r.total >= 8) aw('fast');
    if (l.boss) { aw('boss'); const bw = WORLDS.flatMap(w => w.levels).filter(x => x.boss && Store.d.stars[x.id]).length; if (bw >= 5) aw('boss5'); }
    if (l.weak) aw('weak');
  }
  if (Store.d.tot.ok >= 100) aw('q100'); if (Store.d.tot.ok >= 500) aw('q500');
  const ts = totalStars(); if (ts >= 30) aw('star30'); if (ts >= 90) aw('star90');
  const days = Object.keys(Store.d.days).length; if (days >= 3) aw('days3'); if (days >= 7) aw('days7');
  if (l.world && !l.custom) { const w = l.world; if (w.levels.filter(x => !isOptional(x)).every(x => Store.d.stars[x.id])) aw('w_' + w.id); }
  if (got.length) {
    $('.newstk', el).innerHTML = `<div class="stkgot"><b>🎁 新貼紙！</b>${got.map(id => { const s = STICKERS.find(x => x.id === id); return `<span class="stk new">${s.e}<small>${s.name}</small></span>`; }).join('')}</div>`;
    setTimeout(() => Snd.sfx('combo'), 1600);
  }
  Store.save();
}
function award(id, silent) {
  if (Store.d.stk[id]) return false;
  Store.d.stk[id] = Date.now(); Store.save();
  if (!silent) { const s = STICKERS.find(x => x.id === id); if (s) toast(`🎁 新貼紙：${s.e} ${s.name}`); }
  return true;
}

function scrLesson(root, id, back) {
  const ls = LESSONS.find(x => x.id === id);
  let ci = 0;
  const el = E(`<div class="scr lesson"></div>`);
  el.appendChild(header(`${ls.emoji} ${ls.title}`, back || (() => go(scrLessons))));
  const card = E('<div class="lcardview"></div>');
  const nav = E(`<div class="lnav"><button class="bigbtn ghost prev">◀ 上一張</button><div class="dots"></div><button class="bigbtn next">下一張 ▶</button></div>`);
  el.appendChild(card); el.appendChild(nav); root.appendChild(el);
  const show = () => {
    const c = ls.cards[ci];
    const pic = c.pic ? c.pic() : '';
    card.innerHTML = `<div class="lc-inner"><div class="lc-num">${ci + 1} / ${ls.cards.length}</div>${sayLine(c.text, c.say || c.text)}${pic ? `<div class="lc-pic">${pic}</div>` : `<div class="lc-pic">${mascot('happy', 'mid')}</div>`}${/tap|撳/.test(c.text) || (pic && pic.includes('class="nt') && pic.includes(' tap')) ? '<div class="taphint">👆 撳五線譜上面嘅音符，聽下個音同名</div>' : ''}</div>`;
    card.classList.remove('slide'); void card.offsetWidth; card.classList.add('slide');
    $('.dots', nav).innerHTML = ls.cards.map((_, i) => `<i class="${i === ci ? 'on' : i < ci ? 'past' : ''}"></i>`).join('');
    $('.prev', nav).style.visibility = ci ? 'visible' : 'hidden';
    $('.next', nav).textContent = ci === ls.cards.length - 1 ? '完成 ✔' : '下一張 ▶';
    // wire keyboard pictures
    $$('.pic-kbd [data-midi]', card).forEach(k => k.onclick = () => { const m = +k.dataset.midi; Snd.note(m, 1); Speech.speak(midiName(m)); k.classList.add('hl2'); setTimeout(() => k.classList.remove('hl2'), 500); });
    Speech.auto(c.say || c.text);
  };
  $('.prev', nav).onclick = () => { if (ci > 0) { ci--; Snd.sfx('tap'); show(); } };
  $('.next', nav).onclick = () => {
    Snd.sfx('tap');
    if (ci < ls.cards.length - 1) { ci++; show(); return; }
    Store.d.lessons[ls.id] = 1; Store.save();
    const n = Object.keys(Store.d.lessons).length;
    if (n >= 5) award('lesson5'); if (LESSONS.every(x => Store.d.lessons[x.id])) award('lessonAll');
    Snd.sfx('win'); FX.confetti();
    const w = WORLDS.find(w => w.lesson === ls.id);
    const box = showModal(`<div class="center">${mascot('cheer', 'mid')}<h3>讀完「${ls.title}」喇！</h3>${sayLine('好叻呀！讀完呢一課喇。' + (w ? `去${w.name}練習下啦！` : ''))}<div class="ibtns">${w ? `<button class="bigbtn gow">${w.emoji} 去${w.name}</button>` : ''}<button class="bigbtn ghost bk">返課堂列表</button></div></div>`);
    const gw = $('.gow', box); if (gw) gw.onclick = () => go(scrMap);
    $('.bk', box).onclick = () => go(scrLessons);
  };
  let sx = null;
  card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) { if (dx < 0 && ci < ls.cards.length - 1) { ci++; show(); } else if (dx > 0 && ci > 0) { ci--; show(); } } sx = null; });
  show();
}

  g: { basic: R('C3', 'C5'), ext: R('A2', 'E5'), name: '🏰 大譜表', kbd: { basic: [48, 72], ext: [45, 76] } },
  m: { name: '🔀 高低音混合' },

function scrPractice(root) {
  const P = Store.d.prac || (Store.d.prac = { clef: Store.inst() === 'cello' ? 'b' : 't', range: 'basic', mode: 'flash', n: 20, time: 0 });

    ${opt('clef', '譜號', Object.entries(PRACTICE_RANGES).map(([k, v]) => [k, v.name]))}
    ${opt('range', '範圍', [['basic', '基本（五線入面）'], ['ext', '進階（加埋加線）']])}
    ${opt('mode', '玩法', [['flash', '⚡ 快閃'], ['train', '🚂 火車'], ['melody', '🎹 讀譜']])}
    ${opt('n', '題數', [[10, '10'], [20, '20'], [30, '30'], [50, '50']])}
    ${opt('time', '每題時限（快閃）', [[0, '無'], [6, '6 秒'], [4, '4 秒'], [2.5, '2.5 秒']])}
    <button class="bigbtn go">開始練習 ▶</button></div>`));
  root.appendChild(el);
  $$('.sel', el).forEach(g => $$('button', g).forEach(b => b.onclick = () => {
    const k = g.dataset.k; let v = b.dataset.v; if (k === 'n' || k === 'time') v = +v; P[k] = v; Store.save();
    $$('button', g).forEach(x => x.classList.toggle('on', x === b)); Snd.sfx('tap');
  }));
  $('.go', el).onclick = () => {
    const c = P.clef;
    let pool, clef = c, kbd;
    if (c === 'm') { clef = 't'; pool = [...PRACTICE_RANGES.t[P.range].map(n => n + '/t'), ...PRACTICE_RANGES.b[P.range].map(n => n + '/b')]; }
    else { pool = PRACTICE_RANGES[c][P.range]; if (c === 'g') kbd = PRACTICE_RANGES.g.kbd[P.range]; }
    const mode = P.mode === 'melody' && c === 'm' ? 'flash' : P.mode;
    const l = { custom: true, t: mode, title: `自由練習：${PRACTICE_RANGES[c].name.slice(2).trim()}`, clef, pool, n: mode === 'melody' ? Math.max(3, Math.round(P.n / 8)) : P.n, len: 8, leap: 3, time: mode === 'flash' ? P.time : 0, speed: 2.2, input: c === 'g' ? 'exact' : 'auto', kbd, world: { c1: '#b3e5fc', c2: '#4fc3f7', emoji: '⚡' } };
    Snd.unlock(); startLevel(l);
  };
}
function startWeak() {
  const keys = Object.keys(Store.d.ns).filter(k => !k.includes('@'));
  const rows = keys.map(k => ({ k, s: Store.d.ns[k], r: Store.errRate(k), n: Store.d.ns[k].ok + Store.d.ns[k].bad })).filter(x => x.n >= 2 && x.r > 0.1);
  rows.sort((a, b) => b.r - a.r);
  let weak = rows.slice(0, 8);
  // add slow notes too
  if (weak.length < 4) {
    const slow = keys.map(k => ({ k, s: Store.d.ns[k] })).filter(x => x.s.ok >= 2 && !weak.find(w => w.k === x.k)).sort((a, b) => b.s.t / b.s.ok - a.s.t / a.s.ok).slice(0, 6 - weak.length);
    weak = weak.concat(slow);
  }
  if (weak.length < 3) {
    showModal(`<div class="center">${mascot('idle', 'mid')}<h3>未有足夠資料</h3>${sayLine('豆芽仔仲未知道你邊粒音比較弱。去冒險地圖玩多幾關先，再返嚟弱點特訓啦！')}<button class="bigbtn" onclick="go(scrMap)">🗺️ 去冒險地圖</button></div>`);
    return;
  }
  const pool = weak.map(x => { const [c, n] = x.k.split(':'); return `${n}/${c}`; });
  const hasAcc = pool.some(p => /[#b]\d/.test(p.split('/')[0]) || /n\d/.test(p.split('/')[0]));
  const l = { custom: true, weak: true, t: 'flash', title: '🧠 弱點特訓', clef: 't', pool, n: 15, input: hasAcc ? 'keys' : 'auto', world: { c1: '#ffe0b2', c2: '#ff9800', emoji: '🧠' } };
  const prev = pool.map(p => { const [n, c] = p.split('/'); return renderLine({ clef: c, items: [{ note: n, tap: true }], labels: true, spacing: 3, width: 8, cls: 'pic rev' }).svg; }).join('');
  const box = showModal(`<div class="center"><h3>🧠 弱點特訓</h3>${sayLine('豆芽仔搵到你最常錯或者最慢嘅音。今次會專登多啲考呢啲音，加油！')}<div class="weakprev">${prev}</div><div class="ibtns"><button class="bigbtn go">開始 ▶</button><button class="bigbtn ghost cl">返回</button></div></div>`, { cls: 'wide' });
  $('.go', box).onclick = () => { Snd.unlock(); startLevel(l); };
  $('.cl', box).onclick = closeModal;
}

/* ================= REPORT ================= */
function scrReport(root) {
  const d = Store.d;
  const el = E(`<div class="scr report"></div>`);
  el.appendChild(header('📊 我的進度', () => go(scrHome)));
  const acc = d.tot.q ? Math.round(d.tot.ok / d.tot.q * 100) : 0;
  const avg = d.tot.ok ? (d.tot.time / d.tot.ok).toFixed(1) : '—';
  const days = Object.keys(d.days).length;
  const say = (d.tot.q ? `你一共答咗 ${d.tot.q} 題，答啱 ${d.tot.ok} 題，準確度百分之 ${acc}，平均 ${avg} 秒答一題。` : '你仲未開始玩，去冒險地圖玩幾關先啦！') + `你練習咗 ${days} 日，攞咗 ${totalStars()} 粒星。下面嘅五線譜，綠色係你好熟嘅音，橙色係麻麻哋，紅色係要多啲練習嘅音，灰色係未試過。`;
  el.appendChild(E(`<div class="rtop"><div class="rstats"><div><b>${d.tot.q}</b><small>答題</small></div><div><b>${acc}%</b><small>準確度</small></div><div><b>${avg}s</b><small>平均用時</small></div><div><b>${days}</b><small>練習日數</small></div><div><b>${totalStars()}</b><small>星星</small></div></div>${sayLine(say.split('下面')[0], say)}</div>`));
  const leg = '<div class="legend"><span class="g">■ 好熟（85%+）</span><span class="o">■ 麻麻哋</span><span class="r">■ 要練多啲（&lt;60%）</span><span class="x">■ 未試過</span></div>';
  el.appendChild(E(`<div>${leg}</div>`));
  const ranges = [['t', R('A3', 'C6'), '高音譜號'], ['b', R('C2', 'E4'), '低音譜號'], ['n', R('C3', 'A4'), '次中音譜號']];
  for (const [c, notes, name] of ranges) {
    if (c === 'n' && !notes.some(n => d.ns[`n:${n}`])) continue;
    const items = notes.map(n => {
      const s = d.ns[`${c}:${n}`]; let col = '#9e9e9e';
      if (s && s.ok + s.bad) { const r = s.ok / (s.ok + s.bad); col = r >= 0.85 ? '#2e7d32' : r >= 0.6 ? '#ef8a00' : '#d32f2f'; }
      return { note: n, color: col, labelColor: col, tap: true, cls: 'rep' };
    });
    const svg = renderLine({ clef: c, items, labels: true, spacing: 2.35, cls: 'pic report' }).svg;
    const box = E(`<div class="repstaff"><h4>${name}</h4>${svg}</div>`);
    el.appendChild(box);
  }
  // weak list
  const rows = Object.keys(d.ns).filter(k => !k.includes('@')).map(k => ({ k, s: d.ns[k], n: d.ns[k].ok + d.ns[k].bad })).filter(x => x.n >= 2 && x.s.bad > 0).sort((a, b) => (b.s.bad / b.n) - (a.s.bad / a.n)).slice(0, 6);
  if (rows.length) {
    el.appendChild(E(`<div class="weaklist"><h4>要加油嘅音</h4>${rows.map(x => { const [c, n] = x.k.split(':'); const pn = parseNote(n); return `<div class="wrow"><b>${noteLabel(pn)}</b><span>${CLEF[c].name} · ${posText(pn, c)}</span><span>✔ ${x.s.ok}　✘ ${x.s.bad}</span></div>`; }).join('')}<button class="bigbtn gow">🧠 弱點特訓</button></div>`));
    $('.gow', el).onclick = startWeak;
  }
  el.appendChild(E(`<button class="bigbtn ghost reset" style="margin:24px auto;display:block">重設所有進度</button>`));
  $('.reset', el).onclick = () => {
    const b = showModal(`<div class="center"><h3>真係要重設？</h3><p>所有星星、貼紙同紀錄都會刪除。</p><div class="ibtns"><button class="bigbtn ghost y">重設</button><button class="bigbtn n">取消</button></div></div>`);
    $('.y', b).onclick = () => { const set = Store.d.set, inst = Store.d.inst, name = Store.d.name; Store.d = Store.defaults(); Store.d.set = set; Store.d.inst = inst; Store.d.name = name; Store.save(); go(scrReport); };
    $('.n', b).onclick = closeModal;
  };
  root.appendChild(el);
  Speech.auto(say);
}

    ${tog('sfx', '音效', '答啱、答錯、連擊嘅聲效')}
    ${tog('noteSound', '答啱後播放音符', '用鋼琴或者大提琴聲播出個音')}
    ${tog('preview', '出題時先播音（聽音模式）', '⚠️ 唔建議！開咗會變成靠耳仔估，練唔到睇譜。')}
    <h3>🎹 答題</h3>
    ${tog('kbdLabels', '琴鍵顯示音名', '初學建議開住；熟咗可以關掉挑戰自己')}
    <div class="srow"><div><b>鋼琴答題方式</b></div><div class="chips sel" data-k="ansPiano"><button class="chip${s.ansPiano === 'keys' ? ' on' : ''}" data-v="keys">🎹 琴鍵</button><button class="chip${s.ansPiano === 'letters' ? ' on' : ''}" data-v="letters">🔤 字母</button></div></div>
    <div class="srow"><div><b>大提琴答題方式</b></div><div class="chips sel" data-k="ansCello"><button class="chip${s.ansCello === 'letters' ? ' on' : ''}" data-v="letters">🔤 字母</button><button class="chip${s.ansCello === 'keys' ? ' on' : ''}" data-v="keys">🎹 琴鍵</button></div></div>
    <h3>👨‍👩‍👧 家長 / 老師</h3>
    ${tog('unlockAll', '解鎖全部關卡', '唔使一關一關過，可以直接揀')}
    <p class="note">進度會儲存喺呢部機嘅瀏覽器入面。清除瀏覽器資料會令進度消失。</p>
  </div>`));
  root.appendChild(el);
  $$('input[type=checkbox]', el).forEach(c => c.onchange = () => { s[c.dataset.k] = c.checked; Store.save(); if (c.dataset.k === 'voice' && !c.checked) Speech.stop(); });
  $$('.sel', el).forEach(g => $$('button', g).forEach(b => b.onclick = () => {
    const k = g.dataset.k; if (k === 'inst') Store.d.inst = b.dataset.v; else s[k] = b.dataset.v;
    Store.save(); $$('button', g).forEach(x => x.classList.toggle('on', x === b)); Snd.sfx('tap');
  }));
  $('#sname', el).onchange = e => { Store.d.name = e.target.value.trim(); Store.save(); };
  $('#rate', el).oninput = e => { s.rate = +e.target.value; $('#ratev', el).textContent = s.rate.toFixed(2) + 'x'; Store.save(); };
  $('#vsel', el).onchange = e => { s.voiceURI = e.target.value; Store.save(); Speech.choose(); $('#vstat', el).textContent = Speech.voice ? '✅ 而家用緊：' + Speech.voice.name : '⚠️ 搵唔到廣東話語音'; };
  $('#vtest', el).onclick = e => Speech.speak(`你好${Store.d.name ? '，' + Store.d.name : ''}！我係豆芽仔，一齊學睇五線譜啦！中央C，高音G，低音F。`, e.currentTarget);
}

/* ================= BOOT ================= */
async function boot() {
  Store.load();
  FX.init();
  bindGlobal();
  Speech.init();
  try { await Promise.race([document.fonts.load('4px Bravura', ''), sleep(2500)]); } catch (e) { /* ignore */ }
  $('#loading').remove();
  go(scrHome);
}
window.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
